  {id:1596,type:'multi',answer:'AC',stem:'「1伸缩配置（ScalingConfiguration）定义了用于弹性伸缩的ECS实例的配置信息。弹性伸缩为某个伸缩组自动增加ECS实例时，会根据伸缩配置创建ECS实例。ECS伸缩配置具有以下哪几种状态?',opts:['Inactive','Deleting','Active','down'],exp:'伸缩配置具有以下几种状态(LifecycleState):Active:生效状态，伸缩组会采用处于生效状态的伸缩配置自动创建ECS实例。Inacitve:失效状态，该伸缩配置存在于伸缩组中，但伸缩组不会采用处于失效状态的伸缩配置自动创建ECS实例。参考链接：https://help.aliyun.com/document_detail/25945.html'},
  {id:1597,type:'multi',answer:'AD',stem:'某企业管理员希望将Web应用防火墙WAF和内容分发网络CDN结合使用，为开启内容加速的域名提供Web攻击防御。该管理员将CDN作为入口层用来实现内容加速，流量经过作为中间层的WAF进行防护再到源站。下列关于这个架构的配置，说法正确的是',opts:['在CDN中配置源站信息时，源站域名不能与加速域名相同，否则会造成循环解析，无法回源','在CDN中配置源站信息时，如果资源已存储在阿里云OSS中，可使用OSS内网域名作为源站','将CDN配置中的源站修改为需要防护的域名','需要在WAF中生成要防护的源站域名的专用CNAME地址'],exp:'https://help.aliyun.com/document_detail/42200.html'},
];

const LABELS=['A','B','C','D','E','F','G','H'];
let wrongSet=new Set(JSON.parse(localStorage.getItem('acp_cloud_wrong')||'[]'));
let favSet  =new Set(JSON.parse(localStorage.getItem('acp_cloud_fav')||'[]'));
function save(){
  localStorage.setItem('acp_cloud_wrong',JSON.stringify([...wrongSet]));
  localStorage.setItem('acp_cloud_fav',  JSON.stringify([...favSet]));
}

let queue=[],cur=0,mode='all',sessOk=0,sessNg=0,answered=false,selSet=new Set();
let sessAns=new Map(); // qid -> {ans,ok} 本次会话作答记录，用于翻回已答题时回显

function startPractice(m){
  mode=m;cur=0;sessOk=0;sessNg=0;sessAns.clear();
  if(m==='all')        queue=QS.map((_,i)=>i);
  else if(m==='wrong') queue=QS.map((_,i)=>i).filter(i=>wrongSet.has(QS[i].id));
  else if(m==='fav')   queue=QS.map((_,i)=>i).filter(i=>favSet.has(QS[i].id));
  if(!queue.length){alert(m==='wrong'?'错题集为空，继续练习积累！':'收藏夹为空，练习时点 ☆ 收藏！');return;}
  document.getElementById('modeTag').textContent={all:'顺序练习',wrong:'错题练习',fav:'收藏练习'}[m];
  switchTab(0);showQ();
}

function showQ(){
  if(cur>=queue.length){showScore();return;}
  answered=false;selSet.clear();
  const q=QS[queue[cur]],n=cur+1,tot=queue.length;
  document.getElementById('pgText').textContent=`第 ${n} 题 / 共 ${tot} 题`;
  document.getElementById('pgFill').style.width=`${((n-1)/tot)*100}%`;
  document.getElementById('favBtn').textContent=favSet.has(q.id)?'★':'☆';
  const badge=document.getElementById('qBadge');
  if(q.type==='single'){badge.textContent='单选题';badge.className='q-badge badge-s';}
  else if(q.type==='multi'){badge.textContent='多选题';badge.className='q-badge badge-m';}
  else{badge.textContent='判断题';badge.className='q-badge badge-j';}
  document.getElementById('qStem').textContent=q.stem;
  const wrap=document.getElementById('optsWrap');
  wrap.innerHTML='';
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML=`<span class="opt-label">${LABELS[i]}</span><span class="opt-text">${o}</span>`;
    btn.onclick=()=>pickOpt(i,btn,q);
    wrap.appendChild(btn);
  });
  const sb=document.getElementById('submitBtn');
  sb.style.display=q.type==='multi'?'block':'none';
  sb.disabled=true;
  document.getElementById('resultArea').style.display='none';
  // 导航栏状态
  document.getElementById('prevBtn').disabled=(cur===0);
  document.getElementById('navNextBtn').textContent=cur>=queue.length-1?'查看成绩 ✓':'下一题 →';
  const ji=document.getElementById('jumpInput');
  ji.max=queue.length;ji.placeholder='1-'+tot;ji.value=n;
  // 回显本会话已答过的题
  const rec=sessAns.get(q.id);
  if(rec){answered=true;renderAnswered(q,rec);}
  showScreen('scrPractice');
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderAnswered(q,rec){
  const cSet=new Set(q.answer.split(''));
  const uSet=new Set((rec.ans||'').split(''));
  document.getElementById('optsWrap').querySelectorAll('.opt').forEach((b,idx)=>{
    b.disabled=true;
    if(cSet.has(LABELS[idx]))b.classList.add('ok');
    else if(uSet.has(LABELS[idx]))b.classList.add('ng');
  });
  document.getElementById('submitBtn').style.display='none';
  const ra=document.getElementById('resultArea');
  ra.className='result '+(rec.ok?'ok':'ng');
  const expHtml=q.exp?`<div class="result-exp"><b>解析：</b>${q.exp}</div>`:'';
  ra.innerHTML=(rec.ok?'<b>✓ 回答正确！</b>':'<b>✗ 回答错误</b>，正确答案是 <b>'+q.answer+'</b>')+expHtml;
  ra.style.display='block';
}

function pickOpt(i,btn,q){
  if(answered)return;
  if(q.type==='single'||q.type==='judge'){
    answered=true;
    const all=document.getElementById('optsWrap').querySelectorAll('.opt');
    all.forEach(b=>b.disabled=true);
    const correct=q.answer.split('');
    all.forEach((b,idx)=>{
      if(correct.includes(LABELS[idx]))b.classList.add('ok');
      else if(idx===i)b.classList.add('ng');
    });
    recordResult(LABELS[i]===q.answer,q,LABELS[i]);
  }else{
    const L=LABELS[i];
    if(selSet.has(L)){selSet.delete(L);btn.classList.remove('sel');}
    else{selSet.add(L);btn.classList.add('sel');}
    document.getElementById('submitBtn').disabled=selSet.size===0;
  }
}

function submitMulti(){
  const q=QS[queue[cur]];answered=true;
  const cSet=new Set(q.answer.split(''));
  const uAns=[...selSet].sort().join('');
  const all=document.getElementById('optsWrap').querySelectorAll('.opt');
  all.forEach((b,idx)=>{
    b.disabled=true;b.classList.remove('sel');
    if(cSet.has(LABELS[idx]))b.classList.add('ok');
    else if(selSet.has(LABELS[idx]))b.classList.add('ng');
  });
  document.getElementById('submitBtn').style.display='none';
  recordResult(uAns===q.answer,q,uAns);
}

function recordResult(ok,q,ans){
  if(ok){sessOk++;wrongSet.delete(q.id);}
  else{sessNg++;wrongSet.add(q.id);}
  sessAns.set(q.id,{ans:ans||'',ok});
  save();
  const ra=document.getElementById('resultArea');
  ra.className='result '+(ok?'ok':'ng');
  const expHtml=q.exp?`<div class="result-exp"><b>解析：</b>${q.exp}</div>`:'';
  ra.innerHTML=(ok?'<b>✓ 回答正确！</b>':'<b>✗ 回答错误</b>，正确答案是 <b>'+q.answer+'</b>')+expHtml;
  ra.style.display='block';
  const nb=document.getElementById('navNextBtn');
  if(nb)nb.textContent=cur>=queue.length-1?'查看成绩 ✓':'下一题 →';
}

function prevQ(){if(cur>0){cur--;showQ();}}
function nextQ(){cur++;showQ();}
function jumpNum(){
  const v=parseInt(document.getElementById('jumpInput').value,10);
  if(isNaN(v)||v<1||v>queue.length){alert('请输入 1 到 '+queue.length+' 之间的题号');return;}
  cur=v-1;showQ();
}

// 电脑端方向键切题
document.addEventListener('keydown',e=>{
  if(!document.getElementById('scrPractice')||!document.getElementById('scrPractice').classList.contains('on'))return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(e.key==='ArrowLeft'){e.preventDefault();prevQ();}
  else if(e.key==='ArrowRight'){e.preventDefault();nextQ();}
});

function toggleFav(){
  if(cur>=queue.length)return;
  const q=QS[queue[cur]];
  if(favSet.has(q.id)){favSet.delete(q.id);document.getElementById('favBtn').textContent='☆';}
  else{favSet.add(q.id);document.getElementById('favBtn').textContent='★';}
  save();
}

function showScore(){
  const tot=queue.length,pct=tot?Math.round(sessOk/tot*100):0;
  document.getElementById('scoreNum').textContent=pct+'%';
  document.getElementById('scTotal').textContent=tot;
  document.getElementById('scOk').textContent=sessOk;
  document.getElementById('scNg').textContent=sessNg;
  showScreen('scrScore');
  document.getElementById('pgWrap').style.display='none';
}

function goWrong(){switchTab(1);}
function restart(){startPractice(mode);}

function switchTab(t){
  for(let i=0;i<3;i++)document.getElementById('tab'+i).classList.toggle('on',i===t);
  document.getElementById('pgWrap').style.display=(t===0&&cur<queue.length)?'block':'none';
  if(t===0){
    if(!queue.length){startPractice('all');return;}
    if(cur<queue.length)showScreen('scrPractice');else showScreen('scrScore');
  }else if(t===1){
    document.getElementById('modeTag').textContent='错题集';
    buildList('wrongWrap',wrongSet,'wrong');showScreen('scrWrong');
  }else{
    document.getElementById('modeTag').textContent='收藏夹';
    buildList('favWrap',favSet,'fav');showScreen('scrFav');
  }
}

function buildList(cid,set,lm){
  const wrap=document.getElementById(cid);
  const qs=QS.filter(q=>set.has(q.id));
  if(!qs.length){
    const msg=lm==='wrong'?'暂无错题，继续加油！':'还没有收藏，练习时点 ☆ 收藏';
    wrap.innerHTML=`<div class="empty"><div class="empty-ico">${lm==='wrong'?'🎉':'⭐'}</div><div class="empty-txt">${msg}</div></div>`;
    return;
  }
  const btnTxt=lm==='wrong'?'开始错题练习':'开始收藏练习';
  let html=`<div class="list-hd"><span class="list-count">共 ${qs.length} 道题</span><button class="list-go ${lm==='wrong'?'red':''}" onclick="startPractice('${lm}')">${btnTxt}</button></div>`;
  qs.forEach(q=>{
    const cls=q.type==='single'?'ln-s':(q.type==='multi'?'ln-m':'ln-j');
    const stem=q.stem.length>50?q.stem.substring(0,50)+'…':q.stem;
    html+=`<div class="list-item" onclick="jumpTo(${q.id})"><div class="list-num ${cls}">${q.id}</div><div class="list-stem">${stem}</div></div>`;
  });
  wrap.innerHTML=html;
}

function jumpTo(qId){
  const idx=QS.findIndex(q=>q.id===qId);
  if(idx<0)return;
  mode='all';queue=QS.map((_,i)=>i);cur=idx;sessOk=0;sessNg=0;sessAns.clear();
  document.getElementById('modeTag').textContent='顺序练习';
  switchTab(0);showQ();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

startPractice('all');
</script>
