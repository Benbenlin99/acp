  {id:695,type:'single',answer:'C',stem:'某大型购物商城新安装了一套视频监控系统，在商城大楼里安装了35个高清摄像头，用于监控主要的出口通道。该系统部署在一台阿里云的云服务器ECS实例上，该ECS实例上挂载了4块2T的数据盘来存储视频数据。上线一周后发现视频数据量过大，预计8T硬盘容量不足以支撑1个月。客户计划对存储空间进行扩容，且同时需要满足历史数据可快速访问，您认为以下哪种阿里云产品可以满足需求？',opts:['多台云服务器ECS','归档存储(Archive Storage)','对象存储OSS','内容分发网络CDN'],exp:'题目中要求需要解决数据增长过快的问题，需要可以通过将视频文件存储到OSS中来解决问题，因为OSS没有空间上限，不需要担心增长过快的问题，同时还可以满足快速读取的要求。(归档存储无法快速读取数据)'},
  {id:696,type:'single',answer:'B',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力等方面都具有优势。以下哪一项是OSS在可靠性方面表现出来的优势？',opts:['受限于硬件可靠性,易出问题,一旦出现磁盘坏道,容易出现不可逆转的数据丢失','数据可靠性不低于 99.99999999%。数据自动多重冗余备份','数据需要客户手工备份、耗时、耗力','提供多种鉴权和授权机制及白名单、防盗链、主子账号功能'],exp:'题目中问的是OSS在可靠性方面表现出来的优势，所以选择"数据可靠性不低于99.99999999%。数据自动多重冗余备份"，"提供多种鉴权和授权机制及白名 单、防盗链、主子账号功能"是OSS在安全性方面表现出来的优势。'},
  {id:697,type:'single',answer:'B',stem:'「当阿里云用户想要通过API进行ECS实例删除时，必须保证ECS实例状态为○，才可以进行删除操作，删除后实例的状态变为O？?',opts:['Stopping；Deleted','Stopped；Deleted','Stopped；Starting','Stopping；Starting'],exp:'删除云服务器ECS必须保证ECS实例状态为已停止Stopped，删除了以后状态为已删除:Deleted。'},
  {id:698,type:'single',answer:'B',stem:'某创业公司处于起步阶段，暂无专业的运维工程师，但需要应对随时变化的互联网业务，为用户提供更优质的体验，避免由于用户访问量突发造成系统瘫痪，您建议该公司选用以下哪种产品改善用户体验？',opts:['云服务器','弹性伸缩','负载均衡','云数据库'],exp:'本题单选正确答案为B。B（弹性伸缩）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:699,type:'single',answer:'C',stem:'阿里云提供了丰富的解决方案以满足VPC内的云产品实例与公网（Internet）、其他VPC、或本地数据中心（IDC）互连的需求。客户可以通过（）将专有网络和公网（Internet）打通，通过（）连接两个VPC，通过（）将本地IDC和云上专有网络打通。',opts:['云企业网、VPN网关、高速通道','弹性公网IP(EIP)、智能接入网关、高速通道','负载均衡、云企业网、智能接入网关','云企业网、云企业网、ECS固定公网IP'],exp:'VPC与外部网络连接可以通过ECS固定公网IP，弹性公网IP（EIP），公网NAT网关，负载均衡等方式实现. 如果您需要专有网络连接其他专有网络，您可以通过VPC对等连接、云企业网或VPN网关等方式实现互通。 如果您需要专有网络与本地数据中心互通，您可以通过购买VPN网关、高速通道物理专线或智能接入网关等方式实现。参考链接：https://help.aliyun.com/document_detail/65220.html 参考链接：https://help.aliyun.com/document_detail/100380.html'},
  {id:700,type:'single',answer:'B',stem:'实例是阿里云上提供计算服务的最小单位，不同的实例规格可以提供的计算能力不同。下列关于实例规格说法正确的是',opts:['实例规格族可分为企业级实例规格族和个人型实例规格族。','企业级实例中，每一个vCPU都对应一个Intel® Xeon®处理器核心的超线程','ECS实例规格定义了实例的CPU，内存、存储和网络','各个地域下可供售卖的实例规格完全一样'],exp:'在企业级实例中，基于X86架构的实例规格，每一个vCPU都对应一个处理器核心的超线程，基于ARM架构的实例规格，每一个vCPU都对应一个处理器的物理核心，具有性能稳定且资源独享的特点。参考链接：https://help.aliyun.com/document_detail/25378.html'},
  {id:701,type:'single',answer:'D',stem:'某游戏公司管理员将最新版本的游戏安装包上传到了对象存储OSS中，因使用了内容',opts:['文件刷新','OSS刷新','URL预热','URL刷新'],exp:'源站点的新资源覆盖同名旧资源后，为避免您受节点缓存影响仍访问到旧资源，可通过提交对应资源的URL或目录进行刷新，清空全网缓存后您可以直接访问到最新的资源。https://help.aliyun.com/document_detail/183664.html'},
  {id:702,type:'single',answer:'C',stem:'「1某公司有两个业务，要购买阿里云产品ECS服务器，要求两个业务之间的网络延时较低，建议在（）创建这两个业务实例。',opts:['不同地域','同一地域的不同可用区内','同一可用区内','同一个安全组'],exp:'如果您的应用需要较高的容灾能力，建议您将实例部署在同一地域的不同可用区内。 如果您的应用要求实例之间的网络延时较低，建议您将实例创建在同一可用区内。参考链接：https://help.aliyun.com/document_detail/123712.html'},
  {id:703,type:'single',answer:'C',stem:'阿里云提供了多种连接ECS实例的方式，包括Workbench、VNC等，使用VNC方式登录的典型场景不包括以下哪一项？',opts:['云服务器失陷，CPU和带宽消耗高','实例误开启操作系统防火墙','忘记SSH密码，无法使用远程连接工具链接ECS','实例启动自检等原因导致启动速度慢'],exp:'忘记SSH密码通过VPN登录也需要输入密码，所以不能通过此方式登入系统。'},
  {id:704,type:'single',answer:'D',stem:'【】阿里云负载均衡SLB中提供了证书上传和管理的服务，在需要进行加密传输时，用户可以将证书上传到负载均衡SLB实例，在创建监听的时候绑定证书。证书是为了支持（）协议。',opts:['TCP','HTTP','PPPoE','HTTPS'],exp:'绑定证书是为了满足加密传输的参考链接：要求。'},
  {id:705,type:'single',answer:'C',stem:'「1某企业将所有业务系统都部署在了云服务ECS上，这些业务系统每天会产生大量的日志。该企业的云运维工程师希望借助于阿里云日志服务SLS良采集ECS上的日志数据并进行消费，则该工程师首先需要在ECS上安装良实现日志数据采集',opts:['Log Service SDK','Logstash','Logtail','Trace服务'],exp:'本题单选正确答案为C。C（Logtail）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:706,type:'single',answer:'C',stem:'OSS支持使用对象标签对存储的object进行分类，用户可以针对同标签的object设置生命周期规则、访问权限。',opts:['指定标签','存储空间标签','对象标签','自定义标签'],exp:'OSS支持使用对象标签(ObjectTagging)对存储的对象(Object)进行分类，您可以针对同标签的Object设置生命周期规则、访问权限等。参考链接:参考链接：https://help.aliyun.com/document_detail/106678.html 存储空间(Bucket)的标签功能，对Bucket进行分类管理，如列举带有指定标签的Bucket、对拥有指定标签的Bucket设置访问权限等。参考链接:参考链接：https://help.aliyun.com/document_detail/133826.html'},
  {id:707,type:'single',answer:'A',stem:'［某云上用户A的ECS实例上部署的应用程序在云产品通信中，通过云账号的AccessKey访问其业务数据库RDS的API，为了方便和快速地调用，某云上用户A直接把AccessKey写在配置文件中，但这种方式存在权限过高、泄露信息和难以维护等问题，如果你是阿里云产品经理，你会建议该用户开通以下哪种服务？ 选项：',opts:['RAM服务','云防火墙服务','VPC服务','SLB服务'],exp:'本题单选正确答案为A。A（RAM服务）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:708,type:'single',answer:'C',stem:'阿里云OSS通过RestfulAPI方式对外提供服务，用户通过OSS默认域名或者绑定的自定义域名方式访问。但是，某企业出于安全考虑，需要在出口防火墙配置策略，限制内部员工和业务系统只能访问指定的公网IP，但是OSS的Bucket访问IP会随机变换，因此需要经常修改防火墙策略，增加运维成本。以下哪种方式有助于解决上述问题?',opts:['使用文件存储代替OSS','前端增加一个负载均衡SLB实例，使用SLB的固定IP访问','在ECS实例上配置OSS的反向代理','使用阿里云NAT网关服务，进行IP地址转换'],exp:'阿里云OSS的存储空间(Bucket)访问地址会随机变换，您可以通过在ECS实例上配置OSS的反向代理，实现通过固定IP地址访问OSS的存储空间。'},
  {id:709,type:'single',answer:'D',stem:'「1针对阿里云专有网络VPC内的云服务器ECS实例，可以通过安全组良进行ECS实例的访问控制配置。以下说法中，哪一项是正确的？',opts:['一个安全组中可以包含同一个可用区的不同VPC里的云服务器ECS实例','一个安全组中可以包含同一个地域的不同VPC里的云服务器ECS实例','一个安全组中仅可以包含同一个可用区的同一个VPC内的云服务器ECS实例','一个安全组中可以包含同一个地域的同一个专有网络VPC内的云服务器ECS实例'],exp:'ECS实例加入安全组时，目标安全组的网络类型与ECS实例的网络类型必须一致。如果网络类型是专有网络，目标安全组与ECS实例必须属于同一个VPC网络。参考链接：https://help.aliyun.com/document_detail/25443.html'},
  {id:710,type:'single',answer:'C',stem:'「某企业的安全工程师希望对云服务器ECS实例间的入流量和出流量进行访问控制，限制ECS实例间的未授权访问，可使用云防火墙的功能实现。',opts:['VPC边界防火墙','企业安全组','主机边界防火墙','互联网边界防火墙'],exp:'主机边界防火墙可以对ECS实例间的入流量和出流量进行访问控制,限制ECS实例间的未授权访问。https://help.aliyun.com/document_detail/90536.html'},
  {id:711,type:'single',answer:'A',stem:'弹性公网IP（EIP）是可以独立购买和持有的公网IP地址资源。将EIP和云资源绑定后，云资源可以通过EIP与公网通信。下列关于EIP的说法正确的是',opts:['EIP支持加入共享带宽以获取超大弹性带宽','EIP只支持包年包月和按使用流量计费两种计费方式','EIP实例支持DDoS防护（增强版），并可以灵活关闭','EIP支持绑定到经典网络类型的云服务器ECS实例上'],exp:'EIP支持按照固定带宽计费，支持DDoS防护（增强版），但是不可以灵活关闭。https://help.aliyun.com/document_detail/32321.html(https://help.aliyun.com/document_detail/32321.html)'},
  {id:712,type:'single',answer:'D',stem:'公网NAT网关是一款针对公网访问的企业级安全网关产品，具有高性能、自动弹性、灵活计费、精细化运维等特性，可以帮助用户更好地管理公网访问流量。以下关于公网NAT网关说法正确的是',opts:['同一个VPC内只能创建一个公网NAT网关','公网NAT网关的SNAT功能可以使ECS实例面向公网提供服务','公网NAT网关的DNAT功能可以为专有网络VPC内无公网IP的ECS实例提供访问公网的代理服务。','公网NAT网关可以绑定多个EIP提供服务'],exp:'公网 NAT 网关支持绑定多个弹性公网 IP（EIP），以实现多地址并发代理，提升带宽容量与服务可用性。SNAT 功能用于私有网络实例访问公网，而非对外提供服务；DNAT 功能用于将公网流量转发至内网实例，实现反向代理；一个 VPC 内可创建多个公网 NAT 网关，不受数量限制。'},
  {id:713,type:'single',answer:'B',stem:'进行管理，为节省成本，该企业计划将监控视频数据长期存放在对象存储OSS上，每个月园区管理员会查看一次视频数据，此时可选择对象存储类型满足场景需求。',opts:['冷归档存储','低频访问','归档存储','标准存储'],exp:'本题单选正确答案为B。B（低频访问）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:714,type:'single',answer:'A',stem:'「某社区网站每天的PV量高达2000万次，应用程序部署在阿里云的云服务器ECS实例上，日志记录在单台ECS实例的数据盘。现在业务部门提出新的需求，网站的访问日志要保存24个月，且支持按日期快速下载，单台ECS实例的数据盘扩最多可以保存三个月的日志数据。您认为在该系统上增加阿里云的哪种产品可以一次性解决日志的保存问题？',opts:['对象存储OSS','归档存储(Archive Storage)','云数据库RDS','内容分发网络CDN'],exp:'划重点:保存存三个月的日志数据且支持快速下载，所以需要用到OSS。'},
  {id:715,type:'single',answer:'C',stem:'使用阿里云弹性伸缩(AutoScaling)来实现计算资源的弹性配置时，做了如下设置:伸缩组的属性中设置MinSize=2，MaxSize=7，伸缩规则为“增加6台ECS”。该伸缩组当前的云服务器ECS实例数为3台，通过设置定时任务来执行，执行一次后，会增加几台云服务器ECS实例？',opts:['0','2','4','6'],exp:'注意:MaxSize=7，所以执行定时任务每次增加6台，但是最多只能增加到7台，所以执行一次后会增加7-3=4台ECS实例'},
  {id:716,type:'single',answer:'C',stem:'您在阿里云的云服务器ECS实例的使用中，要创建新的安全组规则时，不可以规定以下哪一种类型的授权？',opts:['安全组授权','端口授权','MAC授权','IP授权'],exp:'安全组规则是不支持MAC授权的。'},
  {id:717,type:'single',answer:'B',stem:'阿里云的对象存储OSS可以与云服务器ECS实例协同来实现文件存储的功能。下列关于ECS与OSS的关系的描述中，哪项是正确的？',opts:['华东1(杭州)的云服务器ECS实例与华北1(青岛)OSS之间可以通过内网进行访问','云服务器ECS实例与OSS之间的请求次数，不分内外网都会计费','云服务器ECS实例与OSS之间的流量费用完全免费','以上都不对'],exp:'文档原话，记住了，走内网流量是不收费的，但是每次的请求次数还是收费。参考链接：https://help.aliyun.com/knowledge_detail/39679.html'},
  {id:718,type:'single',answer:'D',stem:'某企业的应用运维工程师正在搭建一套开发测试环境，计划购买云服务ECS进行部署，并配合云数据库RDS进行使用。该工程师希望能尽量减轻使用成本，对性能和稳定性要求很低，可以选择云数据库RDS的实例规格族实现该需求。',opts:['突发规格','独享规格','通用规格','共享规格'],exp:'追求高性价比，需要减轻使用成本的应用场景选择共享规格。https://help.aliyun.com/document_detail/57184.html'},
  {id:719,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)中，伸缩组是一组部署了相同应用的云服务器ECS实例的集合。以下关于伸缩组的说法中，哪一项是正确的？',opts:['当伸缩组对应的伸缩规则的条件触发后，弹性伸缩会根据设定的伸缩规则添加或者减少伸缩组中的云服务器ECS实例','伸缩组是云服务器ECS实例的资源池，当实际应用中需要添加计算资源时，会从伸缩组中获取可用的ECS实例，添加到应用中去','伸缩组是云服务器ECS实例的资源池，弹性伸缩会预先创建一定数量的云服务器ECS实例放在伸缩组中','伸缩组是监控的目标，其中的云服务器ECS实例，必须是由阿里云弹性伸缩基于相同的镜像自动创建的'],exp:'阿里云弹性伸缩(AutoScaling)的基础知识。服务器ECS实例可以是自己创建，也可以自动添加闲置的云服务器ECS资源。'},
  {id:720,type:'single',answer:'B',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，提供丰富的功能，满足各种业务场景的需要。某用户使用SLB和多台后端云服务器部署高并发网站，在使用过程中，发现某段时间客户端访问延迟，想要快速定位异常后端服务器，推荐其采用以下哪种方式？',opts:['通过弹性伸缩服务配合云监控，在客户端访问延迟时快速增加云服务器实例','结合阿里云日志服务，通过仪表盘巡检，分析负载均衡的响应时间','结合阿里云云监控服务，查看负载均衡的云监控数据','通过SLB健康检查功能，定位健康检查异常的ECS'],exp:'负载均衡的访问日志能收集了所有发送到负载均衡的请求的详细信息，包括请求时间、客户端IP地址、延迟、请求路径和服务器响应等。负载均衡作为公网访问入口，承载着海量的访问请求，您可以通过访问日志分析客户端用户行为、了解客户端用户的地域分布、进行问题排查等。参考链接：https://help.aliyun.com/document_detail/139996.html'},
  {id:721,type:'single',answer:'C',stem:'【】云计算以多种形式对外提供服务，比如可以提供给消费者计算能力、存储、网络和其他基础资源，消费者能够利用这些计算资源部署和运行任意软件，包括操作系统和应用程序，但不能管理或控制任何云计算基础设施。该服务形式属于以下哪一种？',opts:['SaaS(软件即服务)','PaaS(平台即服务)','IaaS(基础设施即服务)','DaaS(数据即服务)'],exp:'题目中说了:利用这些计算资源部署和运行任意软件，包括操作系统和应用程序，说到“计算资源”了，所以就是提供基础的云计算服务，即基础设施即服务，具体可以结合参考链接中的产品举例理解区分参考链接：https://yq.aliyun.com/articles/560829'},
  {id:722,type:'single',answer:'C',stem:'「1在使用阿里云负载均衡SLB的管理控制台时，如果需要添加某台云服务器ECS实例到某负载均衡SLB实例的后端服务器池中，ECS实例必须处于（）状态。',opts:['已创建','已停止','运行中','启动中'],exp:'手动添加负载均衡SLB的后端服务器的时候，后端的ECS服务器必须处于运行中状态。'},
  {id:723,type:'single',answer:'D',stem:'在OSS中，用户操作的基本数据单元是文件(Object)。OSS支持将文件分片上传，上传完成之后再调用。下列哪种场景不需要使用OSS分片上传？',opts:['流式上传','大文件加速上传','网络条件较差，经常连接断开','单文件大小为80KB'],exp:'分片上传的三个使用场景： 1、大文件加速上传，当文件大小超过5GB时，使用分片上传可实现并行上传多个Part以加快上传速度。 2、网络环境较差，网络环境较差时，建议使用分片上传。当出现上传失败的时候，您仅需重传失败的Part。 3、文件大小不确定(此题流式上传，指将文件流、网络流等数据流以流式上传的方式上传到存储空间)，可以在需要上传的文件大小还不确定的情况下开始上传，这种场景在视频监控等行业应用中比较常见。参考链接：https://help.aliyun.com/document_detail/31850.html'},
  {id:724,type:'single',answer:'D',stem:'与专有云相比，公有云天生就暴露在互联网上。公有云为企业应用带来互联网+的优势的同时，也带来了来自互联网的安全威胁。阿里云是通过以下哪个产品来提供云计算服务的基础安全加固和防护的（比如常见的防DDoS攻击）？',opts:['云监控','云服务器','云数据库','云安全中心'],exp:'题目中问的什么云产品是供云计算服务的基础安全加固和防护的，所以选择云安全中心平台。'},
  {id:725,type:'single',answer:'B',stem:'阿里云上使用内容分发网络CDN、全局流量管理、全球加速或者DDoS高防时经常会需要到云解析DNS中添加记录，该记录会将解析的域名指向另一个域名，再由另一个域名提供IP地址',opts:['NS','CNAME','MX','PTR'],exp:'本题单选正确答案为B。B（CNAME）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:726,type:'single',answer:'B',stem:'某用户要求可以及时监控ECS实例的网络异常、软件崩溃和硬件使用情况，可及时记录网络、软件或硬件问题，我们可以用（）配合云监控的指标监视功能，灵活自定义计算资源维护的健康水位。',opts:['系统日志','实例健康状况','监控','自助诊断系统'],exp:'实例健康状况侧重于网络配置的异常活动、软件崩溃和硬件使用情况等。通过监视实例健康状态，可及时记录网络、软件或硬件问题。 该功能配合云监控的指标监视功能，可以灵活自定义计算资源维护的健康水位。'},
  {id:727,type:'single',answer:'B',stem:'「1某企业购买了阿里云对象存储0SS服务来存放业务系统的海量非结构化数据。现因安全合规的要求，需要使用自管理、可指定的密钥来对OSS中存放的数据进行加密存放，此需求可通过方式来实现。',opts:['使用KMS托管用户主密钥进行客户端加密','使用KMS托管密钥进行服务器端加解密','使用用户自主管理密钥进行客户端加密','使用OSS完全托管密钥进行服务器端加解密'],exp:'对象存储OSS提供服务器端加密和客户端加密，服务器加密可选OSS完全托管和KMS，客户端加密是指将文件（Object）发送到对象存储OSS之前在本地进行加密。。https://help.aliyun.com/document_detail/31871.html'},
  {id:728,type:'single',answer:'B',stem:'以下关于SLB使用场景的描述，（）是适用于4层(TCP)协议配置SLB的监听规则。',opts:['后端服务器应用采用HTTP、HTTPs、TCP协议的负载均衡场景','后端服务器应用采用TCP协议的负载均衡场景','后端服务器应用采用HTTP协议的负载均衡场景','后端服务器应用采用HTTPs协议的负载均衡场景'],exp:'本题单选正确答案为B。B（后端服务器应用采用TCP）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:729,type:'single',answer:'D',stem:'云服务器ECS提供了基础安全服务，包括异常登录检测、漏洞扫描、基线配置核查等。如果用户在创建ECS实例时，选择（）选项操作，系统会自动为新创建的ECS实例安装基础安全服务的安全插件Agent。',opts:['登录凭证','实例RAM角色','创建部署集','安全加固'],exp:'您可以按以下方式操作Agent。 • 创建ECS实例时自动安装Agent i. 登录ECS管理控制台。 ii. 在左侧导航栏，选择实例与镜像>实例。 iii. 在顶部菜单栏处，选择地域。 iv. 创建一台ECS实例，在镜像配置处，勾选安全加固，系统自动为新建ECS实例安装Agent。详情请参见使用向导创建实例。参考链接：https://help.aliyun.com/document_detail/121691.html'},
  {id:730,type:'single',answer:'B',stem:'通过CA中心签发的证书默认有效期为1年，必须在证书到期前的30个自然日内续费并更新证书，才能延长证书的服务时长。为了避免因忘记续费证书，导致证书到期后业务无法正常使用，数字证书管理服务提供证书托管服务，可以在证书即将到期时自动申请并更新证书。下列关于托管服务说法正确的是',opts:['托管服务可以自动将新证书安装到Web服务器中','托管服务支持自动补齐原证书过期前尚未使用的有效期','开启托管服务时购买的证书支持在控制台申请退款','只支持阿里云SSL证书'],exp:'托管服务支持自动补齐原证书过期前尚未使用的有效期，即自动续费签发的新证书的到期时间，将在原证书到期时间的基础上增加1年。https://help.aliyun.com/document_detail/170123.html'},
  {id:731,type:'single',answer:'A',stem:'弹性伸缩ESS的伸缩规则主要用来触发伸缩活动，例如增加1台ECS实例或ECI实例。伸缩规则包含多种类型，其中可以选择一项云监控指标，并指定目标值，弹性伸缩会自动计算所需的实例数量并进行扩缩容，从而将云监控指标维持在目标值附近。',opts:['目标追踪规则','简单规则','预测规则','步进规则'],exp:'其中，弹性伸缩的目标追踪伸缩规则是在简单规则的基础上扩展出来的一种新类型伸缩规则，您可以根据需要选择一项云监控指标，并指定监控指标的目标值，弹性伸缩会自动计算所需的实例数量并进行扩缩容，从而将云监控指标更高效、更准确地维持在目标值附近。https://help.aliyun.com/document_detail/420651.html'},
  {id:732,type:'single',answer:'C',stem:'［您基于阿里云的云服务器ECS实例部署了MySql数据库，随着业务量的不断上涨，您的运维工作不断增加，包括数据库的备份、主备数据库之间的数据同步等问题，可以采用以下哪一种阿里云的产品来解决该问题？',opts:['开放搜索服务OpenSearch','对象存储OSS','云数据库RDS','表格存储'],exp:'题目中说了因为业务量的上涨导致自部署的Mysql数据库工作量越来越大，所以需要云数据库RDS来快速解决这些问题。'},
  {id:733,type:'single',answer:'D',stem:'［使用阿里云的云服务器ECS实例、负载均衡SLB实例以及弹性伸缩（Auto Scaling）可以构建一个稳定、高效、安全、低成本的系统，既能做到将负载按预定策略分流，又能做到根据业务量的变化对资源进行弹性伸缩。关于负载均衡SLB实例和弹性伸缩（AutoScaling）配合使用的说法中，哪一项是正确的？',opts:['一个负载均衡SLB实例可以绑定多个弹性伸缩的伸缩组，但这些伸缩组的伸缩配置必须一致','一个负载均衡SLB实例可以绑定多个弹性伸缩的伸缩组，且这些伸缩组的伸缩配置可以不同','一个伸缩组可以对应多个负载均衡SLB实例，但是两者必须在同一个可用区(Zone)中','一个伸缩组可以对应多个负载均衡SLB实例，但是两者必须在同一个地域(Region)中'],exp:'伸缩组用于管理有相同应用场景的ECS实例，并支持关联多个负载均衡实例和RDS实例，SLB实例和伸缩组必须位于同一地域。参考链接：https://help.aliyun.com/document_detail/25878.html'},
  {id:734,type:'single',answer:'A',stem:'某用户在云上创建了VPC网络，其VPC内的某些ECS实例绑定EIP对外提供服务，其他的ECS实例通过NAT网关的SNAT功能代理访问互联网。由于绑定EIP的ECS实例会优先通过EIP访问互联网，造成了该用户VPC内ECS实例的公网出口IP不一致的情况。为了统一VPC内ECS实例的公网出口IP（对外提供服务的ECS实例仍需要以不同的访问地址继续提供服务），便于用户更高效地管理互联网业务，用户可以进行以下哪种操作？',opts:['为原绑定EIP的ECS实例单独分配一块弹性网卡，并将EIP绑定到弹性网卡','将绑定了EIP的ECS实例解绑EIP','为所有ECS实例自建SNA网关，将原绑定EIP的ECS实例解绑EIP','为原绑定EIP的ECS实例ECS实例设置DNAT IP映射'],exp:'您可以为绑定了EIP的ECS实例单独分配一块弹性网卡，并将EIP绑定到弹性网卡，这样来自互联网的访问流量会经过弹性网卡到达ECS实例，当ECS实例需要访问互联网时会通过NAT网关进行转发。参考链接：https://help.aliyun.com/document_detail/122272.html'},
  {id:735,type:'single',answer:'C',stem:'「1在启动弹性伸缩前，需要设置条件，可实现在业务需求增长时自动增加ECS实例以保证计算能力，在业务需求下降时自动减少ECS实例以节约成本。',opts:['伸缩配置','触发条件','伸缩规则','伸缩策略'],exp:'本题单选正确答案为C。C（伸缩规则）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:736,type:'single',answer:'A',stem:'使用阿里云的负载均衡SLB实例时，可以通过健康检查来判断后端云服务器ECS实例的可用性。针对四层服务(UDP协议)，负载均衡SLB实例通过（）来判断云服务器ECS实例是否可用。',opts:['端口检查是否超时','云服务器ECS实例的服务器端返回的报文内容中的特殊字符','云服务器ECS实例的服务器端返回的状态码','云服务器ECS实例的服务器端返回的字节数'],exp:'四层是检查端口，七层是检查服务器端返回的状态码。'},
  {id:737,type:'single',answer:'B',stem:'某企业的安全架构师希望能对云上操作系统和服务的弱口令、账号权限、身份鉴别、密码策略、访问控制、安全审计和入侵防范等安全配置进行检测，并提供检测结果，针对存在的风险配置给出加固建议。此时可使用云安全中心的功能实现。',opts:['漏洞管理','基线检查','云平台配置检查','资产暴露分析'],exp:'基线一般指配置和管理系统的详细描述，或者说是最低的安全要求，包括服务和应用程序设置、操作系统组件的配置、权限和权利分配、管理规则等。云安全中心的基线检查功能支持检测操作系统和服务（数据库、服务器软件、容器等）的弱口令、账号权限、身份鉴别、密码策略、访问控制、安全审计和入侵防范等安全配置，并提供检测结果，针对存在的风险配置给出加固建议。具体的检测项，请参见基线检查内容。 https://help.aliyun.com/document_detail/164548.html(https://help.aliyun.com/document_detail/164548.html)'},
  {id:738,type:'single',answer:'A',stem:'阿里云负载均衡SLB在四层（TCP)转发时，设置了会话保持，在会话保持的超时时间内，以下说法中哪一项是正确的？',opts:['来源IP地址相同的连接都会转发到同一台后端云服务器ECS实例上','负载均衡SLB实例将自动以Session为单位进行转发，无需IP地址判断或者cookie信息辅助','客户端的请求中带有负载均衡SLB实例设置的cookie信息，负载均衡SLB实例会根据cookie中的信息判断是否来自同一会话，如果是，则转发到相同的ECS实例','采用test-and-set机制，负载均衡SLB实例先去检查后端ECS实例的内存中是否存在相同Session信息，如果某台ECS实例中存在，则转发至该ECS实例，如果所有ECS实例中都没有相关信息，则该请求被认为是某个Session的第一次连接，会按照转发规则转发给任意一台ECS实例'],exp:'负载均衡SLB在四层(TCP)转发是是基于源IP的会话保持。四层会话保持的最长时间是3600秒。'},
  {id:739,type:'single',answer:'C',stem:'「阿里云对象存储服务OSS基于（）架构设计，能够消除单点故障，确保数据业务的持续性。',opts:['高性能','高并发','高可用','高安全'],exp:'本题单选正确答案为C。C（高可用）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:740,type:'single',answer:'C',stem:'VPN网关是一款网络连接服务，通过建立加密隧道的方式实现企业本地数据中心、企业办公网络、互联网客户端与阿里云专有网络VPC之间安全可靠的私网连接。VPN网关提供IPsec-VPN和SSL-VPN两种网络连接方式，下列关于两种连接方式说法正确的是',opts:['SSL-VPN是一种基于路由的网络连接技术，提供灵活的流量路由方式，方便配置和维护VPN策略','SSL-VPN支持绑定国际标准商用密码算法的私网和公网VPN网关实例','IPsec-VPN支持绑定转发路由器实例，通过云企业网实现网络互通','IPsec-VPN是一种基于OpenVPN架构的网络连接技术，适用于在互联网客户端与VPC之间建立网络连接'],exp:'IPsec-VPN支持在企业本地数据中心或企业办公网络与阿里云专有网络VPC（Virtual Private Cloud）之间建立安全可靠的网络连接。IPsec连接支持绑定VPN网关实例和转发路由器实例。本文为您介绍在IPsec连接绑定转发路由器实例的情况下，IPsec-VPN常见的应用场景。https://help.aliyun.com/document_detail/452467.htm'},
  {id:741,type:'single',answer:'C',stem:'某用户在创建ECS实例（分配了公网IP地址)后的六小时内，想要更换该ECS实例的公网IP地址，但在控制台操作界面找不到更换公网IP选项，以下哪一项可能是引起该问题的原因？',opts:['创建的ECS实例为经典网络实例','ECS实例处于Stopped状态','ECS实例为VPC网络，停止实例时选择“停机不收费”','ECS实例为VPC网络，且分配了私网IP地址'],exp:'如果您的ECS实例分配了公网IP地址，无论是经典网络还是专有网络VPC，在创建后六小时内，您都可以更换公网IP地址。'},
  {id:742,type:'single',answer:'B',stem:'阿里云云服务器ECS提供多种实例规格，满足用户多种业务场景的需要。某中小企业用户想要使用两台ECS，一台部署单个Tomcat服务，另外一台部署Memcache服务，最推荐以下哪种配置？',opts:['Tomcat：4核4G, Memcache：2核8G','Tomcat：4核4G, Memcache：2核16G','Tomcat：4核8G, Memcache：2核16G','Tomcat：4核8G, Memcache：2核8G'],exp:'可参考选型最佳实践参考文档进行选择。参考链接：https://help.aliyun.com/document_detail/58291.html'},
  {id:743,type:'single',answer:'C',stem:'阿里云的资源是多地域(Region)、多可用区(Zone)部署的，通常来讲，同地域下不同可用区之间的距离大概在（）范围。',opts:['数百公里','数百米','数十公里','数公里'],exp:'同一个地域的可用区都属于在同一个城市，一半相隔都在数十公里。'},
  {id:744,type:'single',answer:'A',stem:'在一些业务场景下，可以通过购买按量付费的云服务器ECS实例来满足特定时间段内需要更多资源的需求，可以通过设定自动释放时间的方式来保证按量付费的ECS实例按预期释放。关于该操作，以下哪项说法是错误的？',opts:['只能在云服务ECS实例创建的时候进行自动释放时间的设置','只能设置一次ECS实例的自动释放时间','可以多次设置ECS实例的自动释放时间','ECS实例的自动释放时间一旦设置不能取消'],exp:'此题有问题，原则是由C是正确的。'},
  {id:745,type:'single',answer:'C',stem:'很多用户将系统迁移上云时，期待能够大幅节约成本，但完成上云后，最终的云上成本大于线下每年的平摊成本。工程师对导致该现象的原因分析，不正确的是以下哪一项？',opts:['线下很多库是单机库，到云上釆用的是RDS高可用版本，相对来说成本会増加','云服务器的配置完全按照云下配置1:1选型，实际利用率较低，不符合云上架构最佳实践','线下使用的虚拟化方案由于采用超额预定，在同等效果下，比云服务器的资源利用率更高','计算成本时，只计算了购买/租用设备的成本，忽略了线下的维护成本、人员成本、机房和电力成本等等'],exp:'云迁移成本分析中，线下成本通常包含硬件采购、维护、人力、电力等综合开销。用户上云后发现成本超预期，需考虑资源选型、架构优化等因素。D选项指出用户仅计算设备成本，忽略其他线下支出，而实际情况是这些线下成本确实存在且应被计入比较。题目认为D分析错误，可能误解用户未忽略线下成本。A、B、C均合理指出云上成本增加的技术原因，D忽略了隐性成本对总成本的影响，与常见云迁移成本评估原则相悖（如AWS成本优化白皮书强调全面对比TCO）。'},
  {id:746,type:'single',answer:'D',stem:'阿里云弹性伸缩（AutoScaling)的冷却时间是指在同一个伸缩组内，当有一个伸缩活动被成功执行后的一段锁定时间内，该伸缩组不执行其他的伸缩活动。以下关于冷却时间的说法中，哪一项是正确的？',opts:['伸缩活动开始后，冷却时间马上开始计时','伸缩活动结束后，冷却时间马上开始计时','当伸缩组加入或移出多个ECS实例时，第一个ECS实例加入或移出完成后，整个伸缩组冷却时间才开始计时','当伸缩组加入或移出多个ECS实例时，最后一个ECS实例加入或移出完成后，整个伸缩组冷却时间才开始计时'],exp:'伸缩活动中，最后一个ECS实例加入或移出完成后，整个伸缩组冷却时间才开始计时，伸缩活动结束并不代表最后一个ECS实例已经加入或移出完成。'},
  {id:747,type:'single',answer:'A',stem:'负载均衡支持按带宽计费的负载均衡实例下的所有监听共享实例的总带宽,假如您购买了一个带宽峰值为10MB的负载均衡实例，并在该实例下创建了三个监听(监听A、',opts:['监听B最多也只能跑满 6MB 带宽','监听B最多也只能跑满4MB 带宽','监听B最多也只能跑满10MB 带宽','监听B最多也只能跑满14MB 带宽'],exp:'监听A的4MB带宽不管用不用都会预留出来的，所以监听B最大只能跑满6MB的带宽。参考链接：https://help.aliyun.com/document_detail/85930.html'},
  {id:748,type:'single',answer:'B',stem:'容器服务ACK支持将何种语言的代码以容器化的方式部署、交付及运行。一个应用从开发代码到运行容器化应用大致分为编写代码、构建镜像、上传镜像至镜像仓库、运行容器化应用四个阶段。其中构建镜像可使用完成，该文本文件中包含了将代码打包成镜像所需的指令。',opts:['Docker commit','Dockerfile','Docker build','Docker images'],exp:'Dockerfile 是一个用来构建镜像的文本文件，文本内容包含了一条条构建镜像所需的指令和说明。'},
  {id:749,type:'single',answer:'B',stem:'某个SLB实例的健康检查配置如下：响应超时时间：5秒，成功响应时间：1秒，健康检查间隔：2秒，健康阈值：3次，不健康阈值：3次。该SLB实例的健康检查失败的间隔时间和健康检查成功间隔时间分别是（）秒和（）秒。',opts:['21，7','19，7','21，9','19，9'],exp:'1.健康检查失败时间窗=响应超时时间×不健康阈值+检查间隔×(不健康阈值-1)既:5∗3+2∗(3-1)=19 2.健康检查成功时间窗=(健康检查成功响应时间x健康阈值)+检查间隔x(健康阈值-1)既:(1∗3)+2∗(3-1)=7参考链接：https://help.aliyun.com/document_detail/85958.html'},
  {id:750,type:'single',answer:'A',stem:'云服务器ECS是一种简单高效、处理能力可弹性伸缩的计算服务。在使用云服务器ECS的过程中，有时难免会出现数据被误删除的情况，在阿里云ECS实例上恢复被误删除的数据有多种方式，其中不包括以下哪一项?',opts:['通过ECS管理控制台恢复该磁盘对应的数据块副本','使用开源工具ext3grep恢复误删的数据','使用开源工具Extundelete恢复误删的数据','通过ECS管理控制台回滚已创建的快照'],exp:'参考链接：https://help.aliyun.com/document_detail/51371.html'},
  {id:751,type:'single',answer:'B',stem:'「使用阿里云的负载均衡SLB实例时，可以通过健康检查来判断后端云服务器ECS实例上的可用性。针对七层服务，负载均衡SLB实例的健康检查机制为：默认由负载均衡SLB实例向后端云服务器ECS实例的内网IP地址的应用服务器配置的缺省首页发起（）请求，如果返回“200OK”，将认为后端云服务器ECS实例运行正常，否则视为运行异常。',opts:['SSH','HTTP','telnet','ICMP'],exp:'7层服务的监控检查机制为由负载均衡SLB实例向后端云服务器ECS实例的内网IP地址的应用服务器配置的缺省首页发起HTTP请求，然后判断请求的返回码来进行健康检查操作.参考链接：https://help.aliyun.com/document_detail/98226.html'},
  {id:752,type:'single',answer:'D',stem:'「VPN网关是一款基于互联网，通过加密通道将企业数据中心、企业办公网络、或互联网终端和阿里云专有网络安全可靠地连接起来的服务，也可以使用VPN网关在VPC之间建立加密的内网连接。下列关于VPN网关说法正确的是',opts:['VPN网关支持经典网络','可以通过VPN网关访问互联网','VPC间互通流量需要经过互联网','支持在一个IPsec连接中配置多个对端网段'],exp:'是否支持在一个IPsec连接中配置多个对端网段？支持。https://help.aliyun.com/document_detail/65381.html#section-a2q-n3h-xdb'},
  {id:753,type:'single',answer:'C',stem:'您已经在阿里云的一台经典网络类型的没有数据盘的云服务器ECS实例上运行所有的应用，现在出于业务发展的需要，您希望将这台云服务器ECS实例迁移到相同地域的专有网络VPC中去，以下哪种操作是可行的？',opts:['直接将云服务器ECS实例的类型转换为专有网络','将该云服务器ECS实例的安全组变更为专有网络类型','制作该云服务器ECS实例的镜像，基于该镜像制作专有网络类型的云服务器ECS实例，业务会短暂停顿','无法迁移'],exp:'经典网络迁移至VPC，阿里云给出了两种解决方案，1、混挂和混访方案；2、单ECS迁移方案；此题目告知在仅在ECS上运行所有应用，所以可以使用单ECS迁移方案。此方案您只需在控制台上完成迁移预约，阿里云会根据您设置的迁移时间进行迁移，迁移完成后，您将收到迁移成功的短信消息提醒。参考链接：https://help.aliyun.com/document_detail/55051.html'},
  {id:754,type:'single',answer:'D',stem:'阿里云OSS产品的账单费用由三部分组成，包括：存储空间费用、流量费用和OSSAPI请求费用。其中流量费用是根据用户使用OSS的下行流量多少收费，上行流量和通过内网访问的流量免费，以下使用OSS的场景中，哪一项不产生OSS流量费用？',opts:['某淘宝卖家为了提高店铺的访问速度，将店铺中的所有图片上传到了OSS，然后在店铺中直接引用','在阿里云ECS上静态网站直接引用了OSS中的图片，该网站来自公网，访问量是每天1000次','管理员在自己的办公室内浏览自己OSS Bucket里的图片','某系管理员将OSS用作数据备份，每晚用内网从ECS上传200G数据到OSS'],exp:'只有公网下载(下行)才会产生流量费用，所以此题内网上传文件到OSS，是不会产生流量费用的的。'},
  {id:755,type:'single',answer:'A',stem:'用户在使用SLB负载均衡时，发现在HTTP请求的头部增加了Transfer-Encoding:chunked字段，但是从本地主机直接访问后端服务器时是没有这个字段的，以下哪项是可能的原因？',opts:['由于七层负载均衡基于Tengine反向代理实现','在四层负载均衡服务中，负载均转发流量增加了该字段','通过设置可以不增加该字段','Transfer-Encoding:chunked表示Web服务器对响应消息体做了整体传输'],exp:'由于七层SLB是基于Tengine反向代理实现，Transfer-Encoding字段表示Web服务器如何对响应消息体编码，例如Transfer-Encoding:chunked表示Web服务器对响应消息体做了分块传输。参考链接：https://help.aliyun.com/document_detail/55201.html'},
  {id:756,type:'single',answer:'A',stem:'如果公网带宽占有率达到百分之百，EIP未及时扩容，易出现业务流量限速丢包的情况，进而引发客户端访问质量恶化和用户体验直线下降的问题。可以使用EIP的（）功能帮助用户实时监测流量波动情况。',opts:['秒级监控','云监控','自动扩容','弹性IP'],exp:'弹性公网IP（ElasticIPAddress，简称EIP）提供高精度秒级监控功能。借助秒级监控功能，您可以实时监控互联网业务流量变化，及时调整EIP的带宽峰值。参考链接：https://help.aliyun.com/document_detail/85354.html'},
  {id:757,type:'single',answer:'A',stem:'「在使用阿里云的负载均衡SLB实例时，可以对后端云服务器ECS实例配置不同的权重，权重越大的ECS实例，会被分到越多的负载。某个SLB实例的后端服务器池中有5个ECS实例，都处在健康状态，其中一台实例ecs_inst1权重被设置成了100，以下说法哪一项是正确的？',opts:['由于不确定其他4台ECS实例的权重配置，所以无法判断ecs_inst1会被分到多大比例的负载','100%的负载都会被分发到ecs_inst1上去，其余4台ECS实例会处于空闲状态','根据SLB的工作原理，ecs_inst1将会被分到大约20%左右的负载','根据外部请求中的请求级别参数判断，所有请求级别参数为100的，都会被转发至ecs_inst1'],exp:'因为只有一台配置了100的权重，并不知道其他4台ECS的具体权重配置(并不是说一台设置了100的权重，其他的权重都必须0，其他ECS也是同样可以设置为100的权重，这样和这一台的权重是相同的，被分发的请求量也是相同的)，所以所以无法判断ecs_inst1会被分到多大比例的负载。'},
  {id:758,type:'single',answer:'A',stem:'「1安全组A中存在5台阿里云的云服务器ECS实例，您针对安全组A增加了一个新的规则来允许来自特定IP地址的入流量，并且增加了3台新的云服务器。以下描述中，哪一项是正确的？',opts:['无需任何额外的操作，特定来源IP地址可以访问所有的8台云服务器','需要进行所有服务器的重启之后，特定来源IP地址可以访问所有的8台云服务器','特定来源IP地址仅可以访问新增的3台云服务器','特定来源IP地址仅可以访问新增的3台云服务器，当之前的5台服务器进行重启之后也可以进行访问'],exp:'安全组开通后，无需任何操作即可开放'},
  {id:759,type:'single',answer:'B',stem:'勒索病毒、挖矿程序等持久化、顽固型病毒已经成为网络安全最大的威胁。为了避免ECS被病毒感染，需要提前采取防御措施，以下哪种措施不能起到防御病毒感染的作用？',opts:['定期修改服务器登录密码','定期做快照备份','及时更新操作系统及应用程序的漏洞修复补丁','隐藏网站后台，尽量在保证网站正常运行的前提下，使用多字符网站后台目录名'],exp:'做备份只是中毒了恢复，不能防御'},
  {id:760,type:'single',answer:'D',stem:'用户通过配置安全组规则，可以控制安全组内一台或多台ECS实例的入流量和出流量，建议用户设置简洁的安全组规则。如果一台ECS实例被分配了多个安全组，该ECS实例很可能会同时遵循数百条安全组规则，任何规则变更都可能引起网络不通的故障。在创建安全组规则时，必填字段不包括以下哪一项？',opts:['授权对象','端口范围','授权策略','授权时限'],exp:'授权时限没有此填写项目参考链接：https://help.aliyun.com/document_detail/25471.html'},
  {id:761,type:'single',answer:'C',stem:'某用户在阿里云控制台查看到某台ECS实例状态为（），这种状态下，ECS实例能正常提供服务，弹性伸缩不会检查ECS实例健康状态，也不会释放ECS实例，需要用户手动管理',opts:['备用中','使用中','保护中','挂起中'],exp:'处于保护状态的ECS实例负载均衡权重不受影响。弹性伸缩不会检查处于保护状态的ECS实例健康状态，也不会释放ECS实例。'},
  {id:762,type:'single',answer:'C',stem:'「创建专有网络后，系统会自动为您创建一张默认路由表并为其添加系统路由来管理专有网络的流量。路由表的操作以下哪项说法是错误的？',opts:['路由表由路由条目组成，每个路由条目指定了网络流量的目的地','不能创建系统路由，也不能删除系统路由','每个交换机可以绑定多张路由表','删除VPC时，系统会自动删除对应的系统路由'],exp:'创建专有网络VPC(VirtualPrivateCloud)后，系统会自动为您创建一张系统路由表并为其添加系统路由来管理VPC的流量。系统路由表不能创建和删除。 您可以在专有网络内创建自定义路由表，然后将其和交换机绑定来控制路由，更灵活地进行网络管理。但是每个交换机只能关联一张路由表。'},
  {id:763,type:'single',answer:'B',stem:'专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。VPC默认是没有公网服务的，若想使VPC与公网联通，可以借助于以下哪种服务？',opts:['VPN网关','NAT网关','高速通道','云企业网'],exp:'NAT网关(NATGateway)是提供网络地址转换服务的，如果您的云上网络只希望主动访问公网上的业务，而不希望云上的业务直接暴露在公网上从而有被攻击的风险，您可以选用公网NAT网关。参考链接：https://help.aliyun.com/document_detail/106263.html'},
  {id:764,type:'single',answer:'D',stem:'在使用云服务器ECS的过程中，我们非常关心ECS的运行状态。在ECS管理控制台，对ECS实例状态的监控分为两种，一种是直接可以监控到的，一种是需要安装云监控插件才能监控到的。下列选项中，哪一项是需要安装插件才能监控到的指标？',opts:['CPU使用率','系统磁盘每秒读取次数','公网入流量平均速率','内存使用率'],exp:'云服务器ECS使用率必须安装监控，其他的监控项无需安装插件。指标采集粒度为1分钟。参考链接：https://help.aliyun.com/document_detail/43505.html'},
  {id:765,type:'single',answer:'C',stem:'「1负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，支持4层和7层流量的转发，其中，4层负载均衡服务不支持（）功能。',opts:['访问控制','健康检查','域名URL转发','加权最小连接数（WLC）调度算法'],exp:'具体可查看CLB支持4层和7层负载均衡具体的功能对比.参考链接：https://help.aliyun.com/document_detail/32460.html'},
  {id:766,type:'single',answer:'D',stem:'「1专有网络各（VirtualPrivateCloud，简称VPC）是隔离的私有网络。默认情况下，VPC内的ECS也无法访问公网或者被公网访问。通过（），可以实现公网可以访问VPC中的ECS，但是VPC中的ECS不能访问公网。',opts:['分配公网IP','绑定弹性公网IP','配置NAT网关','配置公网负载均衡'],exp:'专有网络中的云资源默认无法访问公网，也无法被公网访问。您可以通过配置ECS实例固定公网IP、弹性公网IP、NAT网关、负载均衡的方式连接公网。弹性公网IP是可以访问外网的，想不让访问外网使用公网负载均衡。参考链接：https://help.aliyun.com/document_detail/53597.html'},
  {id:767,type:'single',answer:'A',stem:'［阿里云提供公网和私网两种类型的负载均衡服务。下列关于SLB实例属性配置的说法中，哪一项是错误的？',opts:['系统自动选择公网或者私网访问','如果用户不指定一个容易识别的SLB名称，则系统会自行分配一个名称','LoadBalancerID是用于识别用户SLB实例的唯一标识','不同类型的SLB，系统会分配不同的服务地址给用户'],exp:'负载均衡SLB中的公网或者私网访问的选择是由用户在购买时候的选择，并不是系统自动选择。'},
  {id:768,type:'single',answer:'A',stem:'「1某企业在阿里云上搭建了ECS+SLB+RDS+AS的业务架构。弹性伸缩AS的伸缩组关联了负载均衡SLB实例，在伸缩组中的ECS实例都会自动加入到SLB实例的后端服务器组，处理来自SLB实例分发的客户端请求。然而，弹性扩张的ECS实例中，为客户端提供服务的应用需要一定的启动时间，如果应用在接收客户端请求时尚未启动，则无法对外提供服务。此时可通过功能来确保服务可用。',opts:['生命周期挂钩','运维编排服务 (OOS)','冷却时间','伸缩组监控'],exp:'弹性扩张时，在ECS实例或ECI实例加入负载均衡CLB（原SLB）实例的后端服务器组前，生命周期挂钩将扩容的ECS实例或ECI实例挂起。等ECS实例或ECI实例中的应用启动完成，挂钩的超时时间结束后，ECS实例或ECI实例加入到负载均衡CLB（原SLB）实例的后端服务器组，并对外提供服务。参考链接：https://help.aliyun.com/document_detail/207450.html'},
  {id:769,type:'single',answer:'C',stem:'阿里云的云服务器ECS产品的应用非常广泛，既可以单独地作为Web服务器，也可以与其他阿里云产品配合提供多媒体解决方案。在多媒体、大流量的APP或网站应用场景下，云服务器ECS实例与阿里云的（）产品搭配，可大幅减少用户访问的等待时间并降低带宽费用。',opts:['对象存储OSS','弹性伸缩Auto Scaling','内容分发网络CDN','负载均衡SLB'],exp:'题目中说了大幅减少用户访问的等待时间并降低带宽费用，意思就是加速访问，节省带宽，所以需要内容分发网络CDN来实现。'},
  {id:770,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)中，可以配置伸缩规则来定义具体的扩展和收缩操作。以下哪一项属于伸缩规则？',opts:['加入或移出3个云服务器ECS实例','配置周期性任务，每天13:00点定时触发','将不健康的云服务器ECS实例移出','自动创建云服务器ECS实例时，使用的配置以及镜像'],exp:'伸缩规则(ScalingRule)定义了具体的扩展或收缩操作，例如加入或移出N个实例。'},
  {id:771,type:'single',answer:'B',stem:'［使用集群是解决高并发，海量数据的常用手段，对于这种类型的网站而言，不管多么强大的服务器都满足不了持续增长的业务需求。这种情况下，需要增加服务器来分担原有系统的压力，我们可以开通阿里云上哪个服务来实现该请求的分发？',opts:['ECS','SLB','RDS','DRDS'],exp:'划重点:来实现该请求的分发，所以需要负载均衡SLB。'},
  {id:772,type:'single',answer:'C',stem:'「1某用户的业务系统搭建在云上，由ECS实例对外提供服务，为了应对业务系统的突发流量，该用户还开通了弹性伸缩服务。已知架构中某一台ECS实例承载了关键业务，为保证业务正常运行，该用户开启了实例释放保护。下列选项中，哪种情况不会释放掉该ECS实例？',opts:['实例由弹性伸缩自动创建，在缩容时被移出伸缩组','实例达到自动释放时间','用户手动释放','账号欠费超过15天'],exp:'实例释放保护不能阻止因合理原因自动执行的释放行为，包括但不限于: 账号欠费超过15天，实例被自动释放。 实例设置了自动释放时间，到期后被自动释放。 实例存在安全合规风险，被停止或释放。 实例由弹性伸缩自动创建，在缩容时被移出伸缩组并释放。参考链接：https://help.aliyun.com/document_detail/101256.html'},
  {id:773,type:'single',answer:'C',stem:'「1阿里云的云服务器ECS实例的快照是指某一个时间点上某一块磁盘的数据拷贝。下列关于云服务器ECS实例快照的说法中，哪一项是错误的？',opts:['用户可以手动创建快照和也可以设置自动快照策略','系统盘和数据盘都可以制作快照','可以保留自动快照到用户自己的OSS Bucket中','云服务器ECS实例到期后或手动释放磁盘时，手动创建的快照不会同时释放'],exp:'自动快照是保存在OSS里面，但是是保存在独立于用户自己的OSSBucket里面，而不是用户的Bucket里面。参考链接：https://help.aliyun.com/knowledge_detail/52045.html'},
  {id:774,type:'single',answer:'A',stem:'设计云上架构时，如果能充分了解云服务的特点，就能扬长避短，充分利用云的优势。例如，由于云服务器ECS是虚拟服务器，其单机性能或许不如传统物理机，但是云上可以很便捷地搭建起两个ECS和一个负载均衡SLB实例的架构，这种架构与单台高配ECS相比，以下哪项不属于该架构的优势？',opts:['方便管理运维','隐藏后端IP，避免被扫描、被直接攻击','方便后续水平扩展','避免单点故障'],exp:'本题单选正确答案为A。A（方便管理运维）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:775,type:'single',answer:'B',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力等方面都具有优势。以下哪一项不是OSS在数据处理能力方面表现出来的优势？',opts:['提供实时缩放图片的处理功能','提供大规模的数据分析能力','提供实时的“文字水印”的图片处理功能','提供实时的“图片水印”的图片处理功能'],exp:'对象存储OSS并不具备大规模的数据分析能力。'},
  {id:776,type:'single',answer:'B',stem:'客户希望使用阿里云OSS产品进行在线音视频内容直播时，必须要和以下哪种阿里云产品配合使用？',opts:['负载均衡SLB','多媒体转码服务MTS','云数据库RDS','内容分发网络CDN'],exp:'题目中说到“在线的音视频内容直播”就需要用到多媒体转码服务MTS服务。'},
  {id:777,type:'single',answer:'A',stem:'在对象存储服务OSS中，用户创建了存储空间（Bucket）之后，可以上传任何类型的文件(Object)到存储空间中。OSS服务支持多种文件上传方式，如果需要上传的文件大小为10GB，建议用户采用以下哪种方式上传？',opts:['分片上传','表单上传','追加上传','控制台上传'],exp:'OSS控制台上传大小不得超过5GB的文件； 表单上传是指使用OSSAPI中的PostObject请求来完成Object的上传，上传的Object也不能超过5GB； 分片上传功能，可以将待上传的文件分成多个碎片(Part)分别上传，上传完成之后再调用CompleteMultipartUpload接口将这些Part组合成一个Object，一半大文件加速上传，网络条件差的情况上传，流式上传均采用分片上传的方式； 追加上传指的是使用OSSAPI中AppendObject在已上传的AppendableObject类型文件后面直接追加内容'},
  {id:778,type:'single',answer:'D',stem:'网络ACL是专有网络VPC中的网络访问控制功能。用户可以自定义设置网络ACL规则，并将网络ACL与交换机绑定，实现对交换机中ECS的流量的访问控制。下列关于网络ACL功能特性说法，哪一项是错误的？',opts:['仅过滤绑定的交换机中的ECS流量','规则是无状态的','不过滤同一交换机内的ECS间的流量','无任何规则时，会允许所有出入方向的访问'],exp:'辅助弹性网卡，且辅助弹性网卡绑定了设置网卡可见模式的EIP，那么网络ACL不过滤该ECS实例的流量。 网络ACL的规则是无状态的，设置入方向规则的允许请求后，需要同时设置相应的出方向规则，否则可能会导致请求无法响应。 网络ACL无任何规则时，会拒绝所有出入方向的访问。 网络ACL与交换机绑定，不过滤同一交换机内的ECS实例间的流量。参考链接：https://help.aliyun.com/document_detail/116626.html'},
  {id:779,type:'single',answer:'C',stem:'「1在创建ECS实例后，如果需要更换ECS实例的操作系统，用户可以通过更换系统盘来更换操作系统。用户进行更换系统盘操作后，以下哪项不一定发生？',opts:['旧系统盘会被释放','系统盘ID会更新','原系统盘自动快照被自动删除','原自动快照策略失效'],exp:'您手动创建的快照不会被释放，这些快照仍可以创建自定义镜像。如果旧系统盘设置了自动快照随磁盘释放，则自动快照会被自动删除。 旧系统盘上应用的自动快照策略自动失效'},
  {id:780,type:'single',answer:'A',stem:'为保证存储在对象存储OSS中的数据的安全性，阿里云提供多种权限控制策略用来向他人授予资源的特定权限。某企业的应用管理员希望将存储在OSS存储空间中的指定一个文件供互联网上任何用户访问，可以通过实现。',opts:['Object ACL','Bucket ACL','RAM Policy','Bucket Policy'],exp:'如果设置了Object的权限，Object的权限大于Bucket的权限，则以设置的Object的权限为准。https://help.aliyun.com/document_detail/100676.html'},
  {id:781,type:'single',answer:'C',stem:'对于入网流量，负载均衡会根据用户在控制台或API上配置的转发策略，对来自前端的访问请求进行转发和处理，如果相应的负载均衡实例服务端口使用的是（），那么LVS集群内每个节点都会根据负载均衡策略，将其承载的服务请求按策略直接分发到后端ECS服务器。',opts:['二层协议','三层协议','四层协议','七层协议'],exp:'四层采用开源软件LVS(LinuxVirtualServer)+keepalived的方式实现负载均衡，并根据云计算需求对其进行了个性化定制。'},
  {id:782,type:'single',answer:'A',stem:'「1负载均衡提供监听级别的访问控制，用户可以针对不同的监听设置访问白名单或黑名单。如果某个用户开启了白名单或者黑名单访问，但访问策略组中没有添加任何IP，则负载均衡监听会执行以下哪一项操作？',opts:['转发所有请求','拒绝所有请求','白名单为空，拒绝所有请求； 黑名单为空，转发所有请求；','白名单为空，转发所有请求； 黑名单为空，拒绝所有请求；'],exp:'如果开启了白名单访问，但访问策略组中没有添加任何IP，则负载均衡监听会转发全部请求。如果开启了黑名单访问，但访问策略组中没有添加任何IP，则负载均衡监听会转发全部请求。参考链接：https://help.aliyun.com/document_detail/85979.html'},
  {id:783,type:'single',answer:'A',stem:'云安全中心、（态势感知）是一款集持续监测、深度防御、全面分析、快速响应能力于一体的云上安全管理平台，提供多种版本可供选择。某企业近期部署了容器平台，大量业务迁移到了容器中，该企业的安全工程师希望云安全中心能够提供对容器K8S的威胁检测，保障容器安全，可选择版本进行使用。',opts:['防病毒版','旗舰版','企业版','高级版'],exp:'https://help.aliyun.com/document_detail/42306.html'},
  {id:784,type:'single',answer:'C',stem:'虽然OSS默认对所有对象在物理盘上进行多份副本存储，但合规性还要求所规定的数据需要跨距离保存副本。通过（）功能，可以在远距离的OSS数据中心之间复制数据以满足这些合规性要求。',opts:['跨可用区复制','数据传输服务','跨区域复制','数据备份服务'],exp:'虽然OSS默认对每个存储的对象在物理盘上有多份副本，但合规性要求所规定的数据需要跨一定距离保存一份副本。通过跨区域复制，可以在远距离的OSS数据中心之间复制数据以满足这些合规性要求。'},
  {id:785,type:'single',answer:'A',stem:'法，哪一项是正确的？',opts:['通过集群提供服务，具有高可靠性','通过LVS提供七层负载均衡','通过Tengine提供四层负载均衡','负载均衡后端ECS实例数不得少于3'],exp:'通过集群提供服务,具有高可用性(也可以说是可靠性)，四层负载均衡是通过LVS来实现的，七层负载均衡是通过Tengine来实现的。负载均衡必须和云服务器ECS配合使用。'},
  {id:786,type:'single',answer:'A',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。在安全性方面，OSS服务具备防DDoS攻击和自动黑洞清洗的功能，若采用传统IT解决方案，实现和OSS类似的防DDoS功能，需要进行以下哪种操作？',opts:['需要购买专业的流量清洗和黑洞设备，同时按预期的防护能力购买相应的IDC入口带宽','只需要在存储服务器内安装特定的安全软件','购买多台存储服务器，同时启用，可实现相同级别的抗DDoS功能','专业的存储服务器都自带了防DDoS功能，无需客户购买'],exp:'题目问的是传统IT的解决方案需要实现防DDos功能，所以需要购买专业的流量清洗和黑洞设备，同时按预期的防护能力购买相应的IDC入口带宽。'},
  {id:787,type:'single',answer:'A',stem:'密钥常用于保护特定的数据，因此，数据的安全依赖于密钥的安全。在密钥管理服务中，可以通过改变加密密钥的方式，使得每个密钥具有更高的安全阈值和更小的密码分析攻击面，实现数据保护的安全策略和最佳实践。',opts:['密钥轮转','密钥别名','托管密码机','密钥版本化'],exp:'通过定期轮转密钥而改变加密密钥的方式,可以使得每个密钥具有更高的安全阈值和更小的密码分析攻击面.https://help.aliyun.com/document_detail/134231.htmL'},
  {id:788,type:'single',answer:'D',stem:'「SLB系统后端的ECS权重值一样，但是实际负载却不一样，可能是因为以下哪项造成的？',opts:['权重值没有生效','SLB后端服务器端口配置错误','开启了获取真实IP功能','开启了会话保持功能'],exp:'解析:如果您同时开启了会话保持功能，那么有可能会造成后端服务器的访问并不是完全相同的。如果出现了访问不均衡的情况，建议您暂时关闭会话保持功能，观察一下是否依然存在这种情况。'},
  {id:789,type:'single',answer:'C',stem:'负载均衡SLB需要将不同的请求转发到不同的后端服务器上时，或需要通过域名和URL进行请求转发时，可以选择使用以下哪种角色？',opts:['默认服务器组','后端服务器','虚拟服务器组','主备服务器组'],exp:'当您需要将不同的请求转发到不同的后端服务器上时，或需要通过域名和URL进行请求转发时，可以选择使用虚拟服务器组。参考链接：https://help.aliyun.com/document_detail/85962.html'},
  {id:790,type:'single',answer:'C',stem:'负载均衡SLB基础架构是采用集群部署，提供四层（TCP协议和UDP协议）和七层（HTTP和HTTPS协议）的负载均衡功能，（）采用开源软件LVSS（LinuxVirtual Server）+keepalived的方式实现负载均衡功能，用Tengine实现负载均衡功能。',opts:['七层，七层','七层，四层','四层，七层','四层，四层'],exp:'四层是LVS，七层是tengine'},
  {id:791,type:'single',answer:'A',stem:'「阿里云对象存储OSS出于安全考虑，直接在浏览器地址栏输入OSS通信域名式打开文件。若需要直接在浏览器打开这类文件，需要如何配置？',opts:['绑定用户自定义的域名(可以是三级域名)','OSS不直接提供这样的功能，需要二次开发','在OSS的安全管理菜单中修改ACL，允许浏览器直接访问，设置时需要短信验证','在OSS管理控制台-Object管理中，修改文件的HTTP头信息'],exp:'需要将自定义的域名访问绑定在属于自己的Bucket上面，即CNAME。域名绑定成功后，为了使用域名正常访问OSS，还需要添加CNAME记录指向存储空间对应的外网域名。参考链接：https://help.aliyun.com/document_detail/195674.html'},
  {id:792,type:'single',answer:'B',stem:'由于使用隧道封装技术对云服务器的IP报文进行封装，所以云服务器的（）信息不会进入物理网络，实现了不同云服务器间网络隔离，因此也实现了不同专有网络间网络隔离。',opts:['物理层','数据链路层','应用层','传输层'],exp:'由于使用隧道封装技术对云服务器的IP报文进行封装，所以云服务器的数据链路层(二层MAC地址)信息不会进入物理网络，实现了不同云服务器间二层网络隔离，因此也实现了不同专有网络间二层网络隔离。'},
  {id:793,type:'single',answer:'A',stem:'「1某企业使用公共云的云服务器进行文件处理，为提升性能，将正在使用的1核2G云服务器的配置提升至2核8G，该操作属于以下哪一种？',opts:['垂直扩展','自动扩展','水平扩展','资源编排'],exp:'题目中说的是升级ECS的配置，所以称之为垂直扩展，假如是通过弹性伸缩来完成的拓展，称之为水平扩展。'},
  {id:794,type:'single',answer:'B',stem:'您已经成功购买了阿里云的弹性公网IP(EIP)，需要通过管理控制台进行弹性公网IP的绑定，但是界面提示没有找到相应的云服务器ECS实例，可能是以下哪种原因引起的？',opts:['您所申请的EIP所在的地域内没有经典网络的云服务器ECS实例','您所申请的EIP所在的地域内的专有网络VPC内没有云服务器ECS实例','您所申请的EIP所在地域的专有网络VPC内在某个可用区内的没有云服务器ECS实例','您所申请的EIP所在地域的某个可用区内没有经典网络的云服务器ECS实例'],exp:'划重点:绑定弹性公网IP却提示没有找到相应的云服务器ECS实例。弹性公网IP的限制有:ECS实例的网络类型必须是专有网络、ECS实例的地域必须和EIP的地域相同。所以选择:您所申请的EIP所在的地域内的专有网络VPC内没有云服务器ECS实例。参考链接：https://help.aliyun.com/document_detail/54479.html'},
  {id:795,type:'single',answer:'B',stem:'根据ECS实例加入伸缩组的方式，ECS实例可以分为自动创建的ECS实例和手动创建的ECS实例。对于手动创建的ECS实例，若用户想由伸缩组在弹性收缩时停止和释放资源，需要对该ECS实例做以下哪项设置?',opts:['托管给SLB实例','托管给伸缩组','移出保护状态','转为备用状态'],exp:'是否释放手动添加的ECS实例由其托管状态决定。如果实例生命周期未托管给伸缩组，只移出实例但不释放。如果实例生命周期托管给伸缩组，移出并释放实例。参考链接：https://help.aliyun.com/document_detail/25911.html'},
  {id:796,type:'single',answer:'B',stem:'「1由于业务的流量增长，您需要对您的阿里云的包年包月的云服务ECS实例的带宽进行临时升级操作，以下描述中，哪一项是错误的？',opts:['可以多次叠加操作临时升级操作','支持按天升级，升级后如果云服务器ECS实例下个月进行续费，按照升级后的带宽进行续费','可以按天进行升级，升级后如果云服务器ECS实例下个月进行续费，仍然按照升级前的基础带宽进行续费','可以为ECS实例设定当月内指定时间段内的带宽临时增加'],exp:'1.带宽临时升级是支持按天升级的，2.因为带宽升级时间最多只能升级到ECS的到期时间，所以在升级之后的续费还是按照升级前的带宽进行续费的。'},
  {id:797,type:'single',answer:'B',stem:'题干：312/820、B公司运营着一个手机APP应用商店，类似Apple的AppStore，创业初期所有的软件包都存储在云服务器ECS实例的数据盘上。从上个月开始，公司做了大量的推广，下载量增长了200倍，用户覆盖范围也从省扩展到全国。为了节约存储和带宽成本，同时提高用户下载速度，您推荐B公司选择以下哪种产品组合？ 选项：',opts:['弹性伸缩(Auto Scaling)+云服务器','对象存储OSS和内容分发网络CDN','对象存储OSS和弹性伸缩(Auto Scaling)','对象存储OSS和云数据库RDS'],exp:'划重点:节约存储和带宽成本，使用对象存储OSS节省存储成本和带宽成本，提高用户下载速度，使用CDN来提高全国用户的下载速度。'},
  {id:798,type:'single',answer:'B',stem:'某用户在对其账号下的ECS实例进行高危操作（更换系统盘）时，为了避免数据丢失，需要对磁盘数据进行提前备份，同时业务要求缩短制作快照的等待时间，这种情况下，该用户可选择创建以下哪一种快照类型？',opts:['普通快照','本地快照','加密快照','自动快照'],exp:'本地快照是云盘数据在某个时刻的完整拷贝，是重要的数据容灾手段。本地快照的快照数据存储在云盘所在的集群中，支持快速备份和恢复，当数据丢失时，您可以通过快照将数据恢复到快照时间点。参考链接：https://help.aliyun.com/document_detail/25391.html'},
  {id:799,type:'single',answer:'C',stem:'某用户的业务系统在云上搭建了ECS和VPC服务架构。该用户在为Windows系统的ECS实例配置IPv6地址时，搭建好IPv6VPC后的步骤如下：1、开通网络带宽2、分配IPv6地址3、添加安全组规则4、配置IPv6地址。以下哪一项是正确的步骤顺序？',opts:['3-2-4-1','3-2-1-4','2-1-4-3','2-1-3-4'],exp:'使用IPv6的步骤如下所示: 1.搭建IPv6 2.为ECS实例分配IPv6地址。 3.开通公网带宽。 4.配置IPv6地址。 5.添加安全组规则。 6.(可选)删除IPv6地址。参考链接：https://help.aliyun.com/document_detail/127302.html'},
  {id:800,type:'single',answer:'A',stem:'某企业在阿里云云服务器ECS上部署了业务网站，并将网站中的附件、图片和视频等存放到对象存储OSS中。由于该业务网站的特殊性，该企业管理员希望当发生断网、断电或者灾难事件导致某个机房不可用时，OSS仍能继续提供强一致性的服务，要求恢复时间目标（RTO）以及恢复点目标（RPO）等于0，此时可选择___满足该场景需求。',opts:['同城冗余存储','跨区域复制','同区域复制','高性能冗余存储'],exp:'同城冗余存储能够提供机房级容灾能力。当发生断网、断电或者灾难事件导致某个机房不可用时，OSS仍能继续提供强一致性的服务。整个故障切换过程用户无感知、业务不中断、数据不丢失，满足关键业务系统对于恢复时间目标（RTO）以及恢复点目标（RPO）等于0的强需求。https://www.alibabacloud.com/help/zh/object-storage-service/latest/zrs'},
  {id:801,type:'single',answer:'A',stem:'阿里云的云服务器ECS产品的应用非常广泛，既可以单独地作为Web服务器，也可以与其他阿里云产品配合提供多媒体解决方案。在多媒体、大流量的APP或网站应用场景下，云服务器ECS实例与阿里云的（）产品搭配，可以存储静态图片、视频、下载包等来降低存储费用。',opts:['对象存储OSS','云数据库RDS','弹性伸缩Auto Scaling','块存储'],exp:'存储静态图片、视频、下载包，优先选择对象存储OSS。'},
  {id:802,type:'single',answer:'B',stem:'OSS服务费用由存储费用、流量费用、请求费用、数据处理费用、对象标签费用、传输加速费用组成，以下哪一种场景不会产生流量费用？',opts:['通过互联网从OSS下载到本地','本地上传图片到OSS','将源Bucket数据同步复制到目标Bucket，源Bucket和目标Bucket属于不同区域','通过CDN服务层下载OSS数据'],exp:'文件上传到oss不占用流量费用，只收取请求费用。'},
  {id:803,type:'single',answer:'D',stem:'OSS的防盗链是指调用OSS API的PutBucketReferer接口设置Referer，用以防止他人盗用OSS数据。下列选项中，哪一项不会进行防盗链验证？',opts:['通过签名URL访问Object','匿名访问Object','Bucket权限为public-read-write','请求 Header 中带有 Authorization 字段'],exp:'防盗链功能通过设置Referer白名单以及是否允许空Referer，限制仅白名单中的域名可以访问您Bucket内的资源。OSS支持基于HTTP和参考链接：header中表头字段Referer的方法设置防盗链。 是否进行防盗链验证的具体场景如下： 仅当通过签名URL或者匿名访问Object时，进行防盗链验证。 当请求的Header中包含Authorization字段，不进行防盗链验证。参考链接：https://help.aliyun.com/document_detail/31869.html'},
  {id:804,type:'single',answer:'D',stem:'某中小企业打算将一个业务系统快速迁移至阿里云，原有业务运行在IDC机房的一台物理机上，包括应用、数据库（MySQL）以及存储文件（约100GB），以下哪种方案最为经济快捷？',opts:['使用一台ECS部署应用和存储文件，使用RDS(mysql)实例快速完成数据库迁移','使用一台ECS部署应用和数据库，使用对象存储OSS节约文件存储成本','使用两台ECS进行部署，一台部署应用及存放数据，另一台部署mysql','使用云服务器ECS、云数据库RDS(MySQL)、对象存储OSS进行部署，形成弹性、可扩展的架构'],exp:'应用部署在ECS上，数据库mysql使用阿里云云数据库RDS，100G数据可以存储在对象存储中。'},
  {id:805,type:'single',answer:'D',stem:'某企业是阿里云深度用户，购买了多种云产品支撑业务系统。现该企业管理员希望从业务角度集中管理业务线涉及到的服务器、数据库、负载均衡、存储等资源。从而按业务线来管理报警规则、查看监控数据，从而提升运维效率。该管理员可使用云监控的功能实现云产品的便捷管理。',opts:['云产品监控','报警模板','自定义监控','应用分组'],exp:'通过应用分组功能将同一业务相关的服务器、数据库、对象存储、缓存等资源添加到同一应用分组中。在分组维度管理报警规则，查看监控数据，可以极大的降低管理复杂度，提高云监控使用效率。 https://help.aliyun.com/document_detail/45242.html(https://help.aliyun.com/document_detail/45242.html)'},
  {id:806,type:'single',answer:'C',stem:'阿里云内容分发网络CDN系统能够实现内容加速的功能，需要智能DNS解析的支持，以下哪项功能不是智能DNS解析系统所具备的？',opts:['可以根据预先配置好的IP段位置信息，将用户请求指向离客户最近的服务器','如果用户在多个机房放置相同的镜象站点，可以让不同的地方客户访问不同的站点，实现负载均衡','智能DNS解析系统具备网页内容缓存的功能，用户首次访问时从源站抓取数据，之后的请求优先从缓存中读取','可以根据不同的访问者IP把同一个域名分别解析成不同的IP地址'],exp:'目前智能DNS解析是不支持网页内容缓存的功能的。参考链接：https://help.aliyun.com/document_detail/29730.html'},
  {id:807,type:'single',answer:'D',stem:'阿里云云服务器ECS是一种简单高效、处理能力可弹性伸缩的计算服务，帮助您快速构建更稳定、安全的应用，提升运维效率，降低IT成本。ECS属于以下哪一种服务形式？',opts:['PaaS(平台即服务)','SaaS(软件即服务)','DaaS(数据即服务)','IaaS(基础设施即服务)'],exp:'IaaS也就是基础设施即服务(Infrastructure-as-a-Service)。IaaS公司会提供场外服务器，存储和网络硬件，也可以选择租用。节省了维护成本和办公场地，公司可以在任何时候利用这些硬件来运行其应用。比如阿里云的ECS，亚马逊的EC2，腾讯云的CVM，都属于IaaS。'},
  {id:808,type:'single',answer:'B',stem:'阿里云的专有网络VPC可以帮助您基于阿里云的产品构建出一个隔离的网络环境。与（）产品结合使用，可以实现专有网络VPC与传统数据中心组成一个按需定制的网络环境。',opts:['域名解析DNS','VPN','负载均衡SLB','云监控'],exp:'通过VPN专线可以将该网络与传统数据中心组成一个按需定制的网络环境。'},
  {id:809,type:'single',answer:'C',stem:'随着企业业务发展，精细化实时运营诉求越来越强烈，某企业的管理员在使用云数据库RDSMySQL期间，进行复杂分析查询时，经常会出现查询卡顿。此时想要从根本上解决复杂分析慢的问题，可通过RDSMySQL的功能来解决。',opts:['只读实例','读写分离','分析实例','自治服务DAS'],exp:'可以将RDS MySQL主实例中的数据自动同步到MySQL分析实例中，解决RDS MySQL复杂分析查询卡顿问题，实现毫秒级针对万亿级数据进行即时的多维分析透视和业务探索。https://help.aliyun.com/document_detail/157896.html'},
  {id:810,type:'single',answer:'D',stem:'阿里云对象存储OSS提供了丰富的文件上传和下载接口，用户可以通过API方便地实现大容量存储空间的管理。如果您想建立一个大型图片分享站点，该网站允许大量用户通过WEB方式进行图片的上传和分享，可以使用阿里云的（）产品与OSS配合实现。',opts:['云数据RDS','负载均衡SLB','内容分发网络CDN','云服务器ECS'],exp:'题目中要求允许大量用户通过WEB方式进行图片的上传和分享，所以需要云服务器ECS来提供WEB服务支持。'},
  {id:811,type:'single',answer:'B',stem:'云计算以多种形式对外提供服务，比如提供给消费者的服务是把客户开发或者购买的应用程序部署到云计算基础设施上。消费者不需要管理或控制底层的云基础设施，包括网络、服务器、操作系统、存储等，但能够控制部署的应用程序，也可能控制运行应用程序的托管环境配置。该服务形式属于以下哪一种？',opts:['SaaS(软件即服务)','PaaS(平台即服务)','IaaS(基础设施即服务)','DaaS(数据即服务)'],exp:'SaaS(软件即服务):提供给消费者的服务是运营商运行在云计算基础设施上的应用程序，消费者可以在各种设备上通过瘦客户端界面访问，如浏览器(例如基于Web的邮件)。消费者不需要管理或控制任何云计算基础设施，包括网络、服务器、操作系统、存储，甚至独立的应用能力等等，消费者仅仅需要对应用进行有限的，特殊的配置。 PaaS(平台即服务):提供给消费者的服务是把客户使用支持的开发语言和工具(例如Java、python、.Net等)开发的或者购买的应用程序部署到供应商的云计算基础设施_上。消费者不需要管理或控制底层的云基础设施，包括网络、服务器、操作系统、存储等，但客户能够控制部署的应用程序，也可能控制运行应用程序的托管环境配置。 laaS(基础架构即服务):提供给消费者的服务是处理能力、存储、网络和其他基本的计算资源，用户能够利用这些计算资源部署和运行任意软件，包括操作系统和应用程序。消费者不能管理或控制任何云计算基础设施，但能控制操作系统、储存、部署的应用，也有可能获得有限制的网络组件(例如，防火墙、负载均衡器等)的控制。'},
  {id:812,type:'single',answer:'D',stem:'安全组是ECS实例的虚拟防火墙，用于设置单个或多个ECS实例的网络访问控制。下列关于安全组网络隔离的描述，哪一项是错误的？',opts:['设置了组内网络隔离的安全组，仅在安全组内没有任何自定义规则的情况下保证安全组内实例之间网络隔离','安全组内网络隔离是一种自定义的网络连通策略，对于默认安全组和新建的安全组无效','安全组内既设置了组内隔离，又设置了让组内实例之间可以互相访问的ACL。所以这种情况设置了组内网络隔离但实例仍然互通','安全组内网络隔离是ECS实例之间的隔离'],exp:'仅设置指定的普通安全组内的网络隔离，不改变默认的网络连通策略，即其他已有和新建的普通安全组，以及企业安全组仍采用默认策略。 安全组内网络隔离是网卡之间的隔离，而不是ECS实例之间的隔离。若实例上绑定了多张弹性网卡，需设置每个网卡所属安全组的组内网络隔离。 安全组内网络隔离的优先级最低，即设置组内网络隔离后，仅在安全组内没有任何自定义规则的情况下保证组内实例之间网络隔离。 以下情况，安全组内实例之间仍然可以互相访问: 实例同时归属于多个安全组时，有一个及以上的安全组未设置组内隔离。 既设置了安全组内隔离，又设置了让组内实例之间可以互相访问的ACL。'},
  {id:813,type:'single',answer:'C',stem:'「某企业利用某公共云服务租用了若干台虚拟机，并把这些虚拟机放在一个隔离的虚拟网络中，该网络可以选择自有IP地址范围、划分网段、配置路由表和网关等，该虚拟网络通常被称作以下哪项服务?',opts:['SDN服务','NFV服务','VPC服务','VPN服务'],exp:'题目中说需要构建隔离的虚拟网络，所以需要用到阿里云专用网络VPC服务。'},
  {id:814,type:'single',answer:'C',stem:'ECS实例在线扩容CentOS8系统盘后出现报错：“xfs_growfs:isnotamountedXFSfilesystem”错误，以下哪一项是错误原因？',opts:['xfs_growts命令后需要接文件系统，而非文件系统挂载点','centos 8目前只可以进行离线扩容','xfs_growfs命令后需要接文件系统挂载点，而非文件系统','centos 8目前不支持在线扩容'],exp:'问题原因：新旧版本的xfs_growfs命令使用问题。新版的xfs_growfs命令后面的参数需要为文件系统挂载点，而非文件系统本身。参考链接：https://help.aliyun.com/knowledge_detail/155936.html'},
  {id:815,type:'single',answer:'A',stem:'「您的业务将面临一个新的挑战，要进行一次大型的促销，但无法预估业务增长的幅度，但您了解云服务器ECS实例的CPU利用率如果超过了70%，业务的响应速度将会有大幅度的下降，目前您的Web应用部署在一组阿里云的云服务器ECS实例上，前端采用一个公网的负载均衡SLB作为流量入口。采用以下哪种方式可以最高效并最节省地解决该问题？',opts:['采用弹性伸缩Auto Scaling服务,设定伸缩规则，当CPU利用率超过70%的时候自动增加新的服务器ECS实例加入到负载均衡SLB的集群当中，CPU利用率低于30%的时候释放多余的云服务器ECS实例','制作部署Web服务的云服务器ECS实例的镜像,基于该镜像创建部分新的云服务器ECS实例,并加入到负载均衡SLB的集群中,并由运维人员实时监控CPU的利用率,如果超过70%就立刻申请新的云服务器ECS实例加入到负载均衡的集群中','制作部署web服务的云服务器ECS实例的镜像，基于该镜像创建足够多的新的云服务器ECS实例，并加入到负载均衡SLB的集群中，提前做好准备','采用弹性伸缩Auto Scaling服务，设定伸缩规则，当CPU利用率超过70%的时候自动增加新的云服务器ECS实例加入到负载均衡SLB的集群当中'],exp:'题目中说到高效并最节省，所以不仅需要应对CPU超过70%的情况，还需要考虑节省，所以设置了,CPU利用率低于30%的时候释放多余的云服务器ECS实例来节省成本。'},
  {id:816,type:'single',answer:'C',stem:'安全组是一种虚拟防火墙，具备状态检测和数据包过滤能力，用于在云端划分安全域。某客户对运维效率、ECS实例规格以及计算节点的规模要求比较高，那么我们应该为客户推荐（）最合适。',opts:['自定义安全组','普通安全组','企业安全组','默认安全组'],exp:'企业安全组适用于对运维效率、ECS实例规格以及计算节点规模有更高需求的场景。'},
  {id:817,type:'single',answer:'D',stem:'「某用户在阿里云控制台手动创建了一台ECS实例并加入到弹性伸缩组（已知该伸缩组配置了负载均衡)中。由于业务发生变化，该用户将此台ECS实例转为备用状态，那么以下哪项说法是正确的？',opts:['该ECS实例负载均衡权重不变','弹性伸缩仍管理该ECS生命周期','伸缩组发生伸缩活动时，优先移出该ECS实例','用户需从伸缩组内移出该ECS实例才能将其释放'],exp:'• 如果ECS实例所在伸缩组配置了负载均衡，则该ECS实例的负载均衡权重会置零。 • 该ECS实例保持备用状态，直至您将其移出备用状态。 • 弹性伸缩不会管理ECS实例的生命周期，而是由您管理。 • 伸缩组内发生伸缩活动时，不会移出处于备用状态的ECS实例。 • 该ECS实例被停止或者重启时，不会更新ECS实例的健康检查状态。 • 您需要预先从伸缩组内移出该ECS实例才能将其释放。 • 如果您删除伸缩组，ECS实例会自动解除备用状态并随伸缩组一起释放。参考链接：https://help.aliyun.com/document_detail/71055.html'},
  {id:818,type:'single',answer:'D',stem:'「如果您在创建Linux操作系统的云服务器ECS实例的同时选择增加了数据盘，以下关于系统盘和数据盘的说法中，哪一项是错误的？',opts:['在数据盘使用前，需要先格式化mount数据盘','支持对数据盘进行二次分区','可以根据业务需要，对数据盘进行多分区配置','如果对系统盘进行二次分区操作，不会发生任何异常'],exp:'使用第三方工具对系统盘进行二次分区操作，可能会导致云服务器ECS出现异常。'},
  {id:819,type:'single',answer:'D',stem:'如果用户不再需要ECS实例上挂载的某块云盘，用户可以将其手动释放，存储在云盘上的数据会被全部释放，云盘停止计费。用户在手动释放云盘时，云盘状态必须是以下哪种？',opts:['已删除','使用中','初始化中','待挂载'],exp:'手动释放云盘以及为按量付费数据盘开启或关闭随实例释放时，云盘状态必须为待挂载。参考链接：https://help.aliyun.com/document_detail/33828.html'},
  {id:820,type:'single',answer:'A',stem:'与传统的软件运行和维护模式相比，云计算要求硬件资源和软件资源能够更好地共享，任何一个企业用户都能够按照自己的需求对SaaS软件进行客户化配置而不影响其他用户的使用。以下哪种技术能够满足上述需求？',opts:['多租户技术','计算资源隔离技术','VPC技术','CDN技术'],exp:'简单说就是充分利用计算机资源，将资源共享给多个需要租用的用户，且每个用户之间数据是隔离的。参考链接：https://www.cnblogs.com/pingfan21/p/7478242.html'},
  {id:821,type:'single',answer:'D',stem:'某应用开发者在开发应用程序时，为保证应用系统中敏感数据的安全，希望通过自主可控的KMS服务器来提供加密密钥对敏感数据进行保护，他可以选择密钥管理服务KMS的组件实现这一需求。',opts:['密钥服务','证书管家','专属KMS','凭据管家'],exp:'本题单选正确答案为D。D（凭据管家）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:822,type:'single',answer:'C',stem:'您基于阿里云的云服务器ECS实例部署了Mysql数据库，随着业务量的不断上涨，您需要通过读写分离的方式来改善数据库的性能，可以采用以下哪一种阿里云产品来快速解决该问题？',opts:['对象存储OSS','SSD盘','云数据库RDS','表格存储'],exp:'题目中是因为在云服务器ECS上部署了MySQL服务，随着业务上涨导致MySQL服务出现性能的问题，所以需要使用云数据库RDS来改善。'},
  {id:823,type:'single',answer:'A',stem:'「1阿里云的负载均衡SLB对应的后端服务器池中包含多台云服务器ECS实例时，若ECS实例对外服务能力不同，为了更充分的利用ECS实例的处理能力，以下说法哪一项是正确的？',opts:['给处理能力强的ECS实例配置更高的权重，权重越高意味着将有机会被分配到更多的访问请求','按照轮询的模式分发任务，能力强的ECS实例一定能分配到更多的请求','按照最小连接数的模式分发任务，能力强的ECS实例一定能分配到更多的请求','负载均衡SLB的目的就是为了平衡后台ECS实例间的负载，无法让某些ECS实例分配到更多的请求'],exp:'通过设置轮询权重，能力强的设置比较高的权重从而获得更多的请求来处理。'},
  {id:824,type:'single',answer:'B',stem:'D公司基于阿里云对象存储OSS和云服务器ECS构建了一个应用网站。因业务发展，事务性的数据交互需求增多，多个请求共同写OSS上的同一个文件时会互相覆盖，为此管理员很发愁。您认为可以选用阿里云的哪种云产品解决该问题？',opts:['内容分发网络CDN','关系型云数据库RDS','负载均衡SLB','增加更多的云服务器ECS'],exp:'题目中说因为增加了事务性的数据交互需求，导致在同时写一个文件的时候会相互覆盖，这个时候需要选择关系型数据库RDS来解决事务性的交互需求。'},
  {id:825,type:'single',answer:'A',stem:'「某企业使用公共云搭建了一个门户网站，目前访问缓慢。为了提升网站的响应速度，又购置了多台云服务器，希望新增加的服务器和原有服务器一起对外提供服务，需要以下哪种技术配合实现这个方案？',opts:['负载均衡','VPC(虚拟专用网)服务','CDN(内容分发网络)','容器服务'],exp:'题目中说"希望新增加的服务器和原有服务器一起对外提供服务"的技术，所以选择把新加的机器作为负载均衡SLB后端的机器一起提供服务，所以选择负载均衡SLB。'},
  {id:826,type:'single',answer:'A',stem:'「',opts:['密码','RAM角色','实例类型','秘钥对'],exp:'实例启动模板是一项持久化ECS实例配置的功能，可用于快速创建实例。实例启动模板中包含了用于创建实例的配置信息，可以存储除了密码以外的任意配置信息，包括密钥对、RAM角色、实例类型和网络设置等。'},
  {id:827,type:'single',answer:'B',stem:'「1使用阿里云的负载均衡SLB时，为了实现跨地域（Region）的高可用性，可以在不同的地域(Region）仓创建多个负载均衡SLB实例，通过（）的方式对外提供服务。',opts:['DNS广播','DNS轮询','DNS最小连接数','DNS多播'],exp:'实现不同地域的多个负载均衡SLB的负载，需要通过DNS轮询来实现.参考链接：https://help.aliyun.com/knowledge_detail/39752.html'},
  {id:828,type:'single',answer:'A',stem:'B公司基于阿里云对象存储OSS和云服务器ECS实例构建了一个mp3音乐下载站点，用户在该网站注册后可获得mp3文件的下载链接。最近一周OSS的公网流量突然增长了一倍，但注册用户数只增加了5%，经分析发现很多下载请求不是用户直接从该网站下载，而是来自某搜索引擎。您认为该网站可以采取以下哪种方案快速降低风险？',opts:['通过OSS Bucket 属性里的“防盗链设置”功能做来源限制','将音乐下载站点改成HTTPS访问','将音乐文件从OSS搬迁到云服务器ECS实例的数据盘','增加负载均衡SLB，多一层防护'],exp:'题目中说了是因为其他非自己的站点的下载导致OSS的公网流量增长，所以需要用到对象存储OSS的防盗链功能来杜绝其他站点的下载。'},
  {id:829,type:'single',answer:'A',stem:'某企业的业务场景需要多台ECS实例共享同一NAS文件系统中的数据，管理员希望能通过云助手实现批量挂载，关于该操作说法正确的是',opts:['ECS是Windows操作系统和Linux系统均支持','停机状态的ECS实例也可以实现挂载','ECS实例可以和NAS挂载点位于不同VPC','ECS实例可以和NAS文件系统在不同地域'],exp:'NAS只支持与挂载点同一VPC网络的计算节点挂载文件系统目录'},
  {id:830,type:'single',answer:'A',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。可以广泛应用于各种场景。例如：图片和音视频类应用的海量存储、静态网站、应用中的静态网页。以下哪一种场景适合使用OSS服务？',opts:['客户A是一个网店老板,每天产生10Gb的高清图片,需要稳定可靠的存储','客户B的一个在线应用,采用自建MySQL数据库保存订单信息,该应用每天产生2000万条订单数据,预计2周后存储容量达到服务器上限,希望通过阿里云产品解决订单存储问题','客户C想对当前业务系统积累了5年的数据进行数据挖掘,为新财年的营销策略制定提供数据支持','客户D的小型电子商务系统由于业务量爆增,计算能力明显不足,每天业务高峰期时服务器的CPU利用率都超过90%,正在寻找优化方案'],exp:'OSS仅适合存放静态非结构化数据，所以数据库的数据是不行的。'},
  {id:831,type:'single',answer:'D',stem:'通过数字证书管理服务可以完成SSL证书购买、申请，并将证书部署到Web服务器中进行使用。SSL证书采用公钥体制，即利用一对互相匹配的密钥对进行数据加密和解密。每个用户自己设定一把特定的、仅为本人所知的私有密钥，并用它进行解密和签名，这种加密方法叫做',opts:['哈希加密','对称加密','数字签名','非对称加密'],exp:'公钥（Public Key）与私钥（Private Key）是通过加密算法得到的一个密钥对（即一个公钥和一个私钥，也就是非对称加密方式） https://help.aliyun.com/document_detail/42216.html?spm=a2c4g.750001.0.i1(https://help.aliyun.com/document_detail/42216.html?spm=a2c4g.750001.0.i1)'},
  {id:832,type:'single',answer:'C',stem:'某电商平台包含众多线上系统和环节，如用户注册、登录、浏览商品、购物结算等。由于站点的动静态资源混杂、跨运营商访问网络不稳定、突发流量造成网络拥塞等问题，经常会出现在线支付、秒杀、促销推广时响应时间慢、服务不稳定等问题。如果您是阿里云产品经理，您会建议选择以下哪种阿里云产品解决问题？ 选项：',opts:['云解析DNS','PCDN','全站加速CDN','高速通道'],exp:'全站加速(DynamicRouteforContentDelivery Network)是阿里云自主研发的融合了动态加速和静态加速技术的CDN产品。该产品一站式解决了页面动静态资源混杂、跨运营商、网络不稳定、单线源站、突发流量、网络拥塞等诸多因素导致的响应慢、丢包、服务不稳定的问题，提升全站性能和用户体验。'},
  {id:833,type:'single',answer:'D',stem:'「您发现某台阿里云的云服务器ECS实例无法连接到互联网，不可能是以下哪一种原因造成的？',opts:['自行修改过公网IP','您修改了云服务器ECS实例访问公网的安全组策略','在云服务器ECS实例中将公网IP对应的网卡关闭了','云服务器ECS实例的网口松了'],exp:'云服务器ECS实例无法连接到互联网不会是因为云服务器ECS的网口连接问题导致的。'},
  {id:834,type:'single',answer:'A',stem:'「1阿里云的弹性公网IP支持与云服务器ECS实例的动态绑定和解绑。下列关于弹性公网IP与ECS绑定的说法中，哪一项是错误的？',opts:['弹性公网IP只能绑定在相同地域相同可用区的VPC类型的云服务器ECS实例上','1个弹性公网IP只能绑定到1个ECS实例上','弹性公网IP只能绑定在相同地域的VPC类型的云服务器ECS实例上','弹性公网IP不能绑定在经典网络的云服务器ECS实例上'],exp:'ECS实例的地域和EIP的地域相同即可，无需相同可用区。更多弹性公网IP使用限制.参考链接：https://help.aliyun.com/document_detail/54479.html'},
  {id:835,type:'single',answer:'C',stem:'「1阿里云对象存储OSS提供海量文件存储能力，对于文件管理除了支持简单上传、断点续传和大文件分片上传功能外，还提供了多种删除文件的功能。如果需要删除的Object数量很多，而且存在一定的规律，比如定期删除某些天之前的Object，或者清空整个Bucket，该场景适用于以下哪种删除功能?',opts:['管理控制台逐个删除','通过OpenAPI逐个删除','生命周期管理','管理控制台批量删除'],exp:'题目中说需要比如定期删除某些天之前的Object，所以可以通过生命周期管理来管理最合适。'},
  {id:836,type:'single',answer:'A',stem:'某在线教育网站是基于云服务器ECS+负载均衡SLB+弹性伸缩（AutoScaling)的方案实现的，在保证系统稳定、客户体验良好的前提下，大大节省了资源成本和运维成本。现网站想把用户的访问信息（如来源IP、访问页面URL、停留时长等）保存下来进行分析，不建议通过以下哪种方案实现？',opts:['伸缩组中的每台ECS实例，均保存各自处理的用户访问信息，这些ECS实例上的数据随时可以访问、分析，这种方案简单高效、稳定可靠，同时节省成本','将用户相关的访问信息实时或者准实时的同步到云数据库Memcache版(原OCS)中去，后续通过应用访问OCS，或者按照一定规则将OCS中的数据持久化，然后使用持久化后的数据','将用户相关的访问信息实时或者准实时的保存到云数据库RDS MySQL版中去，后续的查询、分析均通过RDS实现','将用户相关的访问信息实时或者准实时的同步到对象存储OSS中，供后续使用'],exp:'因为涉及到多台ECS且将ECS挂载到到了负载均衡的后端，上云最佳实践中，不能在每台ECS中各自保存用户的访问信息，这样会导致之后的请求的数据不同步，最佳的解决方案是将用户的信息保存到统一的云产品(比如云数据库RDS)中，所有的ECS都通过该云产品来调用访问用户信息。'},
  {id:837,type:'single',answer:'B',stem:'网站接入Web应用防火墙防护后，可以为网站开启主动防御功能。主动防御采用阿里云自研的机器学习算法，自主学习网站域名的合法流量，并自动为网站生成定制化的安全防护策略，防御未知攻击。在开启主动防御时，其默认的工作模式是',opts:['静默','告警','拦截','引流'],exp:'默认情况下，主动防御采用告警模式。所有主动防御安全规则仅将命中规则的请求上报至安全报表，并不会进行拦截。建议您通过安全报表观察一段时间，确认主动防御的安全规则没有出现误拦截的情况后，再切换到拦截模式。https://help.aliyun.com/document_detail/147941.html'},
  {id:838,type:'single',answer:'D',stem:'「1在阿里云上注册的域名到期后通常有30天左右的续费宽限期，如果错过了续费宽限期，域名会进入赎回期，在赎回期内，可以赎回域名。以下关于域名赎回说法正确的是',opts:['阿里云账号下的国际域名错过了赎回期，会被立马删除','域名赎回的价格和续费价格一样','赎回期内域名可以正常解析','在急需赎回域名页签下如果找不到想赎回的域名，可能是因为域名超过了赎回期已经被注册局删除'],exp:'https://help.aliyun.com/document_detail/35909.html'},
  {id:839,type:'single',answer:'C',stem:'「某公司系统架构在阿里云上，使用了多个阿里云弹性伸缩ESS的伸缩组来实现动态资源管理。现有一台包年包月的云服务器ECS实例还未到期，且处于闲置状态，为避免资源浪费，您建议对该ECS实例采用以下哪种操作？',opts:['如果该ECS的处理能力很强的话，可以加入到同一个可用区(Zone)的多个伸缩组中去，前提是要部署多个应用处理的环境','只能把该ECS加到同一个可用区(Zone)的某一个伸缩组中去，前提是它的规格要符合该伸缩组伸缩配置规定的规格','可以把它手工添加到同一个地域(Region)的任意伸缩组中去','只能把该ECS加到同一个地域(Region)的某一个伸缩组中去，前提是它的规格要符合该伸缩组伸缩配置规定的规格'],exp:'弹性伸缩是有地域的限制，手动添加的ECS必须与伸缩组处于同一个地域。但是不需要要求ECS符合该伸缩组伸缩配置规定的规格。参考链接：https://help.aliyun.com/document_detail/25901.html'},
  {id:840,type:'single',answer:'C',stem:'专有网络VPC是云上的专用虚拟网络，可以在专有网络内部署和使用云资源，用户可以完全掌控自己的专有网络，例如选择IP地址范围、配置路由表和网关等。某管理员在使用专有网络时，以下说法错误的是',opts:['将同一张路由表绑定到多个交换机上','创建专有网络和交换机时使用172.16.0.0/12作为专有网络的私网网段','创建VPC后，删除系统路由表，再创建自定义路由表进行灵活管理','在专有网络内创建多个交换机进行子网划分'],exp:'系统路由不能删除'},
  {id:841,type:'single',answer:'A',stem:'Windows实例的系统盘由40GB扩容到100GB，确认扩容已经完成，计算机分区C显示大小99.9GB，但是可用空间（百分比)反而比之前更小。以下哪一项是导致问题的原因？',opts:['虚拟内存被开启且设置的是系统自动管理','更换系统盘错误','windows目前不支持在线扩容','内存满被占满'],exp:'参考链接：https://help.aliyun.com/knowledge_detail/150589.html'},
  {id:842,type:'single',answer:'D',stem:'当一个阿里云的云服务器ECS实例无法加入指定的安全组时，可能是由以下哪种原因造成的？',opts:['云服务器ECS实例创建之后默认已经加入一个安全组，不能再加入其他安全组','该云服务器ECS实例的状态为运行中','该云服务器ECS实例没有开启公网带宽，所以无法加入安全组','本云服务器ECS实例目前已经加入的安全组数量达到上限'],exp:'每个ECS实例最多可以加入5个安全组，当超过5个了以后就无法继续加入其他安全组。安全组的限制和主机状态、公网带宽没有关系。参考链接：https://help.aliyun.com/document_detail/25443.html'},
  {id:843,type:'single',answer:'C',stem:'「您已经创建好了一块新的块存储，想要通过阿里云的管理控制台进行磁盘挂载到云服务器ECS实例上的操作，却找不到想挂载的云服务器实例，一定不是因为（）原因引起的。',opts:['云服务器ECS实例已经释放','块存储与云服务器ECS实例不在同一个地域','块存储与云服务器ECS实例在同一个可用区','块存储与云服务器ECS实例不在一个可用区'],exp:'云盘只能挂载到同一地域下同一可用区内的实例上，不能跨可用区挂载。题目中问的是一定不是因为什么原因，所以在一个可用区不会导致找不到挂载的ECS的情况。'},
  {id:844,type:'single',answer:'D',stem:'传统型负载均衡CLB与传统硬件负载均衡系统高投入相比，成本可下降60%。CLB支持包年包月和按量付费两种付费模式，某企业需要长期使用资源，想选择包年包月的付费模式，在购买时CLB的计费项构成为',opts:['包含实例占用费和规格费','包含实例占用费、规格费及LCU费','只有实例费用','包含实例占用费、规格费及公网网络费'],exp:'公网CLB包年包月产品计费，包含实例费，带宽费，规格费。https://help.aliyun.com/document_detail/27695.html'},
  {id:845,type:'single',answer:'B',stem:'云服务器ECS是阿里云提供的性能卓越、稳定可靠、弹性扩展的IaaS级别云计算服务。现某企业运维管理员希望在阿里云上购买IaaS服务搭建嵌套虚拟化环境，来实现特殊的业务需求，此时可购买实例来实现。',opts:['专有宿主机DDH','弹性裸金属','资源编排','任意规格的云服务器ECS'],exp:'只有弹性裸金属服务器可以支持虚拟化嵌套。'},
  {id:846,type:'single',answer:'A',stem:'若你在阿里云上购买了公网IP资产，当遭受大流量DDoS攻击，且攻击流量的峰值带宽超过了资产的DDoS',opts:['黑洞','挂起','DDoS防护','DDoS高防'],exp:'本题单选正确答案为A。A（黑洞）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:847,type:'single',answer:'A',stem:'「1某企业在使用云防火墙的过程中，希望能检查是否有可疑活动的系统，在检测到可疑事件时发出告警或者采取主动反应措施。此时可通过云防火墙的功能满足需求。',opts:['失陷感知','漏洞防护','主动外联活动','入侵防御'],exp:'失陷感知 失陷感知是一种监控网络传输，检查是否有可疑活动的系统，在检测到可疑事件时发出告警或者采取主动反应措施。云防火墙集成阿里云近十年检测防御能力，对经过云防火墙的流量进行实时分析、统计，智能发现失陷主机、阻断异常网络活动。'},
  {id:848,type:'single',answer:'C',stem:'阿里云云数据库RDS的产品系列包括基础版、高可用版、集群版、三节点企业版。高可用版是适用性较广的云数据库系列。采用一主一备的经典高可用架构，适合80%以上的用户场景，下列关于高可用版说法正确的是',opts:['开启读写分离连接后，备节点可提供给业务只读访问','高可用版可满足恢复点目标（RPO）=0的强需求','高可用版实例的主备节点可以部署在同一地域里的相同或不同可用区','基础版实例不支持升级为高可用版'],exp:'高可用版在极端情况下可能丢失数据，若您需要数据100%安全，恢复点目标（RPO）=0，建议您使用三节点企业版。 高可用版实例的主备节点可以部署在同一地域里的相同或不同可用区，部署在不同可用区可以实现实例的跨可用区容灾，提升实例的可用性。 https://help.aliyun.com/document_detail/127875.html(https://help.aliyun.com/document_detail/127875.html)'},
  {id:849,type:'single',answer:'D',stem:'某用户为其SLB实例的一个HTTP监听配置了多条域名转发策略，包括：精确域名：www.aliyun.com,精确域名：market.aliyun.com,泛域名：*.aliyun.com，泛域名：*.market.aliyun.com，已知当前某个请求访问域名为info.market.aliyun.com，该条请求匹配的域名转发对应以下哪一项?',opts:['www.aliyun.com','∗.aliyun.com','market.aliyun.com','∗.market.aliyun.com'],exp:'参考链接：https://help.aliyun.com/document_detail/87023.html'},
  {id:850,type:'single',answer:'A',stem:'某企业在华东1（杭州）地域创建了两个VPC，并使用企业版转发路由器将VPC1与VPC2连通，现需要通过流日志功能，查看VPC之间的互访流量。在创建流日志时，关于其选项配置正确的是',opts:['资源类型选择专有网络','资源类型选择交换机','流量类型选择被访问控制允许的流量','流量类型选择被访问控制拒绝的流量'],exp:'资源类型应该选择专有网络，流量类型选择全部流量。https://help.aliyun.com/document_detail/90628.html'},
  {id:851,type:'single',answer:'A',stem:'「某用户使用负载均衡SLB和云服务器ECS搭建网站，出于安全考虑，网站已部署SSL证书，使用HTTPS协议访问，现在，网站希望将用户的HTTP访问重定向至HTTPS，如何简单地实现该需求？',opts:['添加一个新的监听，并开启监转发功能','为现有七层监听添加域名转发策略','为现有七层监听添加路径转发策略','开启SLB的证书托管功能'],exp:'查看负载均衡将HTTP:80访问重定向转发至参考链接：:443教程，参考链接：https://help.aliyun.com/document_detail/89151.html'},
  {id:852,type:'single',answer:'C',stem:'「某公司使用阿里云对象存储OSS存储文件，其管理员发现某个Bucket每天会自动生成名称中包含日期的Object，以下哪一项是最可能的原因?',opts:['该Bucket开启了LifeCycle生命周期规则','该Bucket开启了版本控制功能','该Bucket开启了日志存储，并且将日志的存储路径设置为上述Bucket','该Bucket开启了跨区域复制功能，并且将复制的目标路径设置为上述Bucket'],exp:'参考链接：https://help.aliyun.com/document_detail/31868.html'},
  {id:853,type:'single',answer:'C',stem:'在使用云数据库RDS时，对数据安全性要求非常高的金融、证券、保险行业的核心数据库可选择三节点企业版。三节点企业版采用的三节点架构，通过多副本同步复制，确保数据的强一致性，提供金融级的可靠性。',opts:['两主一备','一主一备一只读','一主一备一日志','一主两备'],exp:'三节点企业版（原名：金融版）是面向高端企业级用户的云数据库系列。采用一主一备一日志的三节点架构，通过多副本同步复制，确保数据的强一致性，提供金融级的可靠性。https://help.aliyun.com/document_detail/51701.html'},
  {id:854,type:'single',answer:'B',stem:'1阿里云OSS同城冗余存储提供99.9999999999%（12个9)的数据设计可靠性以及99.995%的服务可用性，可以支持以下哪种级别的容灾能力？',opts:['机架级','机房级','地域级','服务器级'],exp:'OSS提供同城冗余存储和跨区域复制特性，实现同地域和跨地域级别的机房容灾能力。参考链接：https://help.aliyun.com/document_detail/172497.html'},
  {id:855,type:'single',answer:'A',stem:'某摄影网站购买了阿里云OSS产品来存放和处理图片，但发现大量图片下载产生了巨额的外网流量费用，且无法保证远距离传输速度，经咨询又购买了阿里云CDN产品，但又有用户反映手机端图片带有处理参数，经CDN加速后变成空白，刷新后可以访问。针对此问题，以下哪种排查方法不正确？',opts:['使用手机直接访问OSS查看图片访问是否正常。若直接访问OSS也异常，CDN访问正常，说明OSS节点网络问题导致加载失败','使用手机直接访问OSS查看图片访问是否正常。若直接访问OSS查看图片正常，而通过CDN访问异常，说明CDN节点网络问题导致加载失败或CDN缓存了错误内容','使用电脑端直接访问OSS查看图片访问是否正常。若电脑端访问正常，则问题出现在手机端','使用电脑端直接访问OSS查看图片是否正常。若电脑访问也异常，可能是图片出现问题了'],exp:'可查看苹果手机端携带了图片处理参数访问经过CDN加速的图片时变成空白图片，刷新后可以访问，电脑访问正常处理方案。使用手机直接访问OSS查看图片访问是否正常，若直接访问OSS也异常，那么CDN访问应该也是异常的，若CDN刷新一下就正常，可能是因为CDN的缓存导致。参考链接：https://help.aliyun.com/document_detail/100327.html'},
  {id:856,type:'single',answer:'D',stem:'某企业运维人员在管理对象存储OSS的时候，担心OSS中的资源被其他人盗用产生损失，希望对存储空间中的资源进行访问限制。此时可以对存储空间设置防盗链功能，通过对访问来源设置Referer白名单的机制来实现访问控制。',opts:['细粒度权限管控','Bucket Policy','URL鉴权','防盗链'],exp:'本题单选正确答案为D。D（防盗链）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:857,type:'single',answer:'A',stem:'「1存储空间的名称在OSS范围内必须是全局唯一的，一旦创建之后无法修改名称。以下哪一项符合存储空间命名规范？',opts:['12-test','-Test12','Test-12','12Test-'],exp:'所选定的存储空间名称在阿里云OSS的所有现有存储空间名称中必须具有唯一性。 只能包括小写字母、数字和短划线(-)。 必须以小写字母或者数字开头和结尾。 长度必须在3~63字节之间。'},
  {id:858,type:'single',answer:'B',stem:'（）是组成专有网络的基础网络设备，用来连接不同的云资源实例。专有网络是地域级别的资源，专有网络不可以跨地域，但包含所属地域的所有可用区。可以在每个可用区内创建一个或多个（）来划分子网。',opts:['路由器、交换机','交换机、交换机','交换机、路由器','路由器、路由器'],exp:'官方原话：交换机（vSwitch）是组成专有网络的基础网络设备，用来连接不同的云资源实例。专有网络是地域级别的资源，专有网络不可以跨地域，但包含所属地域的所有可用区。您可以在每个可用区内创建一个或多个交换机来划分子网。参考链接：https://help.aliyun.com/document_detail/100380.html'},
  {id:859,type:'single',answer:'C',stem:'将基础设施作为服务的云计算服务属于以下哪一种服务形式？',opts:['Daas','Paas','IaaS','SaaS'],exp:'本题单选正确答案为C。C（IaaS）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:860,type:'single',answer:'D',stem:'用户在使用阿里云弹性伸缩(AutoScaling)时,希望能根据计算资源的使用情况来增加或者减少云服务器ECS实例，如当CPU利用率小于等于30%时，则减少一台云服务器ECS实例，除了配置伸缩规则为“减少1台ECS”还需要以下哪项操作来配合实现？',opts:['创建伸缩配置','设置伸缩组的属性','创建定时任务','创建报警任务'],exp:'划重点:当CPU利用率小于等于30%时则减少一台云服务器ECS实例。只有达到这个条件才去执行，所以这就是一个报警任务。'},
  {id:861,type:'single',answer:'C',stem:'「游戏行业有个明显的特点是业务流量很难预估，波动很大，例如今天上线1台云服务器ECS实例就足够处理所有的业务需求，明天可能就需要10台云服务器ECS实例来处理所有的需求。这样的场景下，您不知道所需最佳的阿里云产品的组合方式？',opts:['负载均衡SLB+云服务器ECS+云数据库RDS','云服务器ECS','负载均衡SLB+云服务器ECS+云数据库RDS+弹性伸缩AutoScaling','云服务器ECS+弹性伸缩AutoScaling'],exp:'采用SLB与ECS以及弹性伸缩开启动态模式，可以在业务量上涨自动增加ECS，业务量下降自动减少ECS。数据需要同意存储在云数据库中。'},
  {id:862,type:'single',answer:'B',stem:'您远程登录阿里云的云服务器ECS实例时出现黑屏现象，已知该实例的操作系统为Windows系统，该现象不可能是由以下哪种原因造成的？',opts:['系统宕机','密码输入错误','CPU资源耗尽','内存空间不足'],exp:'云服务器ECS实例黑屏说明是ECS的状态不正常导致的，密码输入错误是不会导致云服务器ECS实例出现异常。'},
  {id:863,type:'single',answer:'D',stem:'对象存储服务OSS是一种海量、安全、低成本、高可靠的云存储服务，针对存放在Bucket的Object的访问，OSS提供了多种权限控制方式，其中，以下哪一项不是OSS支持的权限控制方式?',opts:['Bucket Policy','RAM Policy','ACL','Security Group'],exp:'OSS支持的权限控制有：BucketACL，ObjectACL，BucketPolicy以及RAMPolicy。参考链接：https://help.aliyun.com/document_detail/31833.html'},
  {id:864,type:'single',answer:'D',stem:'】《网络安全法》第二十一条规定：网络运营者应当按照网络安全等级保护制度的要求，履行下列安全保护义务，保障网络免受干扰、破坏或者未经授权的访问，防止网络数据泄露或者被窃取、篡改。而在现实网络环境中，木马病毒、勒索病毒、挖矿程序等持久化、顽固型病毒已经成为网络安全最大的威胁。在使用云服务器ECS的过程中，如果发现ECS感染了木马病毒，建议用户最先采取以下哪种措施？',opts:['检查是否有陌生的异常进程在运行','修改远程登录端口','安装查杀病毒防木马软件，对服务器进行全盘病毒扫描和查杀','修改系统管理员账户的密码'],exp:'参考链接：https://help.aliyun.com/knowledge_detail/40994.html'},
  {id:865,type:'single',answer:'D',stem:'阿里云的云服务器ECS相对于传统服务器的一个重要特征是，可以更便捷地进行服务器的配置升级。下列关于云服务器ECS无缝升级的说法中，哪一项是错误的？ 选项：',opts:['升级带宽不需要云服务器ECS进行重启','云服务器ECS支持变更CPU、内存和带宽升级','云服务器ECS的配置升级时，用户不需要重新部署环境或迁移数据','云服务器ECS不支持新增数据盘'],exp:'本题单选正确答案为D。D（云服务器ECS不支持新增）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:866,type:'single',answer:'B',stem:'阿里云弹性伸缩服务(AutoScaling)可以根据业务需求和策略自动调整弹性计算资源。在业务需求增长时，无缝增加ECS实例，满足计算需要。在创建伸缩配置时，需要设置的参数不包括以下哪一项？',opts:['镜像','登录密码','计费方式','安全组'],exp:'具体可查看创建伸缩配置流程。参考链接：https://help.aliyun.com/document_detail/25890.html'},
  {id:867,type:'single',answer:'B',stem:'如果您希望在阿里云专有网络VPC内创建不同可用区的云服务器ECS实例，获得更高的容灾能力，以下哪种方式是可行的？',opts:['可以通过将处于不同可用区的云服务器ECS实例部署到同一台交换机下，从而实现多可用区容灾','可以通过将云服务器ECS实例部署在处于不同可用区的交换机下，从而实现多可用区容灾','可以通过将云服务器ECS实例部署在处于不同可用区的路由器下，从而实现多可用区容灾','可以通过将处于不同地域的云服务器ECS实例部署到同一台路由器下，从而实现多地域的多可用区容灾'],exp:'云服务器云服务器是关联在交换机下面的，VPC下面可以包含同一个地域多个不同可用区的交换机，所以想具备容灾的能力，可以考虑ECS在一个VPC下面跨交换机部署。是关联在交换机下面的，VPC下面可以包含同一个地域多个不同可用区的交换机，所以想具备容灾的能力，可以考虑ECS在一个VPC下面跨交换机部署。'},
  {id:868,type:'single',answer:'B',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。用OSS管理的文件可以很方便地对外提供分享，分享前点击文件后面的“获取地址”文字链接即可得到当前文件的地址，该分享使用的是以下哪一种应用层（七层）协议？',opts:['SMTP','HTTP','TCP','FTP'],exp:'文件的分享地址，是在OSS应用的控台操作的，所以属于HTTP的第七层应用层。'},
  {id:869,type:'single',answer:'A',stem:'「您已经有一台运行状态的云服务器ECS实例，并完成了所需的应用软件的部署。如果您希望创建一个部署同样软件的新的云服务器ECS实例，可以采用以下哪种方式最高效地获得？',opts:['基于现有的云服务器ECS实例的系统盘制作自定义镜像，并基于该自定义镜像生成新的云服务器ECS实例','基于现有的云服务器ECS实例的系统盘制作快照，并基于该快照生成新的云服务器ECS实例','直接生成一台新的云服务器ECS实例，并进行所需软件的部署','上传本地制作好的镜像，并基于该镜像创建一台新的云服务器ECS实例'],exp:'题目中说需要创建一个部署同样软件的新的云服务器ECS实例，所以需要通过制作镜像来实现快速复制，'},
  {id:870,type:'single',answer:'A',stem:'某公司将重要业务部署在阿里云华北2地域，使用的架构是负载均衡SLB+多台ECS，SLB作为公网流量的统一入口，为了避免因该SLB实例出现问题导致业务中断，以下哪项措施是可行的？',opts:['在华北2区域不同可用区再创建一个SLB实例作为备实例，出现故障时，SLB支持主备实例自动切换','在华东1地域再创建一个SLB实例作为备实例，出现故障时，SLB支持主备实例自动切换','对SLB实例开启实例删除保护，防止其被运维人员误删','使用安骑士对SLB实例进行安全防护'],exp:'当主可用区出现故障或不可用时，负载均衡有能力在非常短的时间内(约30秒)切换到备可用区并恢复服务；当主可用区恢复时，负载均衡同样会自动切换到主可用区提供服务。'},
  {id:871,type:'single',answer:'A',stem:'阿里云弹性伸缩(Auto Scaling)，是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务。支持用户添加已有的云服务器ECS实例，但该云服务器ECS实例的状态必须为以下哪一种？',opts:['运行中','已创建','已停止','准备中'],exp:'弹性伸缩手动添加ECS，ECS的状态必须为运行中。'},
  {id:872,type:'single',answer:'A',stem:'阿里云的负载均衡SLB可以通过流量分发扩展应用系统对外的服务能力，通过消除单点故障提升应用系统的可用性。以下关于负载均衡SLB特点的说法中，哪一项是错误的？',opts:['跨地域容灾：支持同一个负载均衡SLB实例分流负载到跨多个地域(Region)的云服务器ECS实例，可用性更高','扩展性：支持删除和添加后端云服务器，实现无缝伸缩','安全：结合阿里云的安全产品提供多种安全防护，使应用更加安全可靠','成本：和传统硬件负载均衡器相比，成本大幅下降'],exp:'同一个负载均衡只支持跨可用区容灾，不支持跨地域容灾。'},
  {id:873,type:'single',answer:'D',stem:'如果您需要对某个域名（如abc.com)通过阿里云内容分发网络CDN加速，必须要在CDN服务中将该域名（如abc.cOm)添加到“加速域名”中。添加完成之后您会获得一个CNAME地址A，接下来需要进行域名解析的修改，将该加速域名（如abc.com)指向这个CNAME地址A。以下有关修改域名解析的说法中，哪一项是错误的？',opts:['如果您的“加速域名”提前转移到阿里云，且在同一个阿里云帐号下管理，可以实现一键修改解析','为“加速域名”分配的CNAME地址指向的具体IP地址，由阿里云CDN系统智能控制','“加速域名”使用的解析服务商可以是阿里云以外的公司','该加速域名(如abc.com)所使用的DNS系统必须支持“智能解析”功能'],exp:'加速域名使用的DNS系统不一定需要支持支持“智能解析”功能。阿里云以外的公司的公司也可以提供解析。 参考链接：https://help.aliyun.com/document_detail/27101.html'},
  {id:874,type:'single',answer:'A',stem:'「1在使用阿里云负载均衡SLB时后端服务器可以设置主备服务器组，当主机工作正常时，流量将直接走主机；当主机宕机时，流量将走到备机。关于主备服务器组支持的协议，以下说法哪一项是正确的？',opts:['主备服务器组只支持四层监听(TCP和UDP协议)','主备服务器组只支持七层监听(HTTP和HTTPS协议)','主备服务器组只支持七层监听(HTTP协议)','主备服务器组支持四层监听(TCP和UDP协议)和七层监听(HTTP协议)'],exp:'主备服务器组是在监听维度上维护的，并且只支持四层监听。参考链接：https://help.aliyun.com/document_detail/52796.html'},
  {id:875,type:'single',answer:'A',stem:'执行伸缩规则、手动添加或移出已有ECS实例时，均会触发（）实现扩容或缩容。',opts:['伸缩活动','定时任务','自动伸缩','告警任务'],exp:'本题单选正确答案为A。A（伸缩活动）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:876,type:'single',answer:'A',stem:'创建阿里云弹性伸缩(AutoScaling)伸缩组的时候，可以配置“移出策略”。现将移出策略配置为“最早伸缩配置对应的实例”，以下说法中正确的是？ 选项：',opts:['只移除通过弹性规则创建的ECS实例，并且是按照伸缩配置创建ECS实例的时间先后顺序，优先移出先建的ECS实例','根据ECS实例的创建时间判断，优先移出先建的ECS实例','只移除手工添加的ECS实例，并且是按照伸缩配置创建ECS实例的时间先后顺序，优先移出先建的ECS实例','根据ECS实例添加到伸缩组的时间判断，优先移出先添加ECS实例'],exp:'顾名思义，最先的，伸缩配置创建的实例。'},
  {id:877,type:'single',answer:'C',stem:'阿里云弹性伸缩（AutoScaling）提供了“弹性自愈”功能，能保证伸缩组中的云服务器ECS实例都处在正常状态，从而使业务始终保持正常的负载，提高系统的稳定性。以下关于“弹性自愈”的描述中，哪项是正确的？',opts:['如果伸缩组中某台ECS实例状态不是运行中，阿里云弹性伸缩首先会自动重启该ECS,重启成功后继续保持在伸缩组中，如果重启失败，则从伸缩组中移除，同时创建新的ECS实例键入到伸缩组中来','如果伸缩组中某台ECS实例的状态不是运行中，阿里云弹性伸缩会启动ECS实例的故障检查与修复进程，对ECS实例进行自动修复','如果伸缩组中某台ECS实例状态不是运行中，则该ECS实例会被移出伸缩组，同时自动创建一台新的ECS实例，添加到伸缩组中来','如果伸缩组中某台ECS实例状态不是运行中，阿里云弹性伸缩首先会自动重启该ECS,重启成功后继续保持在伸缩组中，如果重启失败，则会使用指定的镜像恢复该ECS实例到初始状态，继续保持在伸缩组中'],exp:'当检测到某台ECS实例处于不健康状态时。弹性伸缩自动释放不健康ECS实例并创建新的ECS实例，自动添加新ECS实例到负载均衡实例的后端服务器和RDS实例的访问白名单中。'},
  {id:878,type:'single',answer:'C',stem:'阿里云对象存储OSS为每个存储空间Bucket自动分配一个内网地址和一个外网地址，内网地址可以实现OSSBucket与云服务器ECS实例之间的流量免费，同时，云服务器ECS实例通过内网访问OSSBucket的网络质量较好，能够有效的提升部署在ECS实例上的应用的上传和下载质量。以下关于OSSBucket内网地址的描述中，哪项是正确的？',opts:['从公共云上的任意一台ECS实例都可以通过内网访问任何地域的OSS Bucket','只要ECS实例和OSS Bucket属于同一用户，ECS实例就可以通过内网访问OSS Bucket','如果ECS实例需要访问OSS Bucket的内网地址，只能访问与ECS实例在同一地域的Bucket','如果ECS实例使用OSS Bucket内网地址，只能访问与ECS实例在同一地域且在同一可用区的OSS Bucket'],exp:'ECS需要通过内网访问OSS的Bucket的话，需要和此Bucket处于同一地域。'},
  {id:879,type:'single',answer:'C',stem:'阿里云提供丰富的产品以满足用户不同的使用需求，这些产品大致分为五类（ACID+S）：人工智能、云计算、物联网、大数据和安全。以下不属于阿里云产品的是',opts:['日志服务SLS','图计算服务 Graph Compute','服务器巡检','无影云桌面'],exp:'服务器巡检不是阿里云的产品。'},
  {id:880,type:'single',answer:'B',stem:'「您的应用系统中存在大量的非结构化数据，之前采用阿里云的云服务器ECS实例加云数据盘的方式进行存储，随着数据的不断膨胀，维护成本和拥有成本越来越高。您希望将目前存储在云服务器ECS实例的数据盘上的大量非结构化的数据转存到其他的服务上去，并使用新的服务提供后续的数据存储服务，从而更好地实现节省运维、管理及存储的成本，采用以下哪种方式最为经济高效？',opts:['将磁盘数据存储下载到本地数据中心的磁带库中进行存储','在云服务所在的地域申请OSS bucket，使用OssImport将磁盘上的数据转移到OSS服务中进行存储','申请OSS bucket，使用闪电立方将磁盘上的数据转移到OSS服务中进行存储','将数据转移到表格存储中，提供低成本、高并发、低延时的海量数据存储与在线访问'],exp:'闪电立方LightningCube(海外叫数据迁移DataTransport)是阿里云为TB乃至PB级数据迁移提供的服务。而题目中说的是:云服务器ECS实例的数据盘上的大量非结构化的数据转存到其他的服务上去。所以使用OSSImport更方便。ossimport支持将任意地域的本地存储数据、第三方存储数据、对象存储OSS数据迁移至任意地域的OSS中。参考链接：https://help.aliyun.com/document_detail/59922.html'},
  {id:881,type:'single',answer:'D',stem:'创建阿里云的云服务器ECS实例时可以免费获得一些安全防护功能，但以下哪一种安全功能需要单独购买？',opts:['基础DDoS防护','木马查杀','防暴力破解','DDoS高防IP'],exp:'DDoS高防IP是需要付费购买的功能。基础DDoS防护是可以免费开通的。'},
  {id:882,type:'single',answer:'B',stem:'「1作为一个互联网初创企业的技术负责人，小A在早期选择了阿里云的云服务器ECS并将Java应用程序、数据库MySQL等部署在了一台云服务器ECS实例上。随着业务发展和用户量增加，发现部署在这台ECS实例上数据库性能出现瓶颈。为了快速解决该问题，同时提高系统安全性和稳定性，您建议选择以下哪一种阿里云产品？',opts:['负载均衡SLB','云数据库RDS','对象存储OSS','专有云VPC'],exp:'这台ECS实例上数据库性能出现瓶颈，所以需要选择阿里云的RDS解决性能问题。'},
  {id:883,type:'single',answer:'A',stem:'「1某视频公司使用负载均衡SLB将用户的访问请求分发到30台云服务器ECS实例，由这些配置相同的ECS实例来响应用户的请求。每天晚上20:00到次日凌晨2:00期间，业务量会大幅增加，比其他时间段增加1倍左右，为了能正常响应用户请求，从成本和容易实现的角度，您最推荐以下哪种解决方案？',opts:['使用阿里云弹性伸缩(Auto Scaling)，通过合适的配置，自动增加ECS实例或者减少ECS实例','使用自定义的镜像，手工创建30台云服务器ECS实例，在每天晚上20:00前，手工增加到SLB中去，次日凌晨2:00再从SLB中移除','基于自定义的镜像创建30台云服务器ECS实例，添加到SLB中去，通过设置权重，让这些ECS实例在每天晚上20:00到次日凌晨2:00之间可以响应用户需求，其他时间段权重修改为0','使用阿里云弹性伸缩(Auto Scaling)，通过合适的配置，自动提升每台ECS实例的规格'],exp:'题目要求成本和容易的角度，所以是通过动态伸缩更加简单和节省成本。'},
  {id:884,type:'single',answer:'C',stem:'】（）是阿里云提供的海量、安全、低成本、高可靠的云存储服务。其数据设计持久性不低于99.9999999999%（12个9)，服务可用性（或业务连续性)不低于99.995%。',opts:['ESSD云盘','负载均衡SLB','对象存储OSS','云数据库RDS'],exp:'阿里云对象存储OSS（ObjectStorageService）是一款海量、安全、低成本、高可靠的云存储服务，可提供99.9999999999%（12个9）的数据持久性，99.995%的数据可用性。多种存储类型供选择，全面优化存储成本。参考链接：https://help.aliyun.com/product/31815.html'},
  {id:885,type:'single',answer:'C',stem:'用户对数据的安全性和可用性有极高的要求，希望所有写入的数据在另一个数据中心存有一实现这一需求？',opts:['跨可用区复制','数据备份服务','跨区域复制','数据传输服务'],exp:'数据备份与容灾：您对数据的安全性和可用性有极高的要求，对所有写入的数据，都希望在另一个数据中心显式地维护一份副本，以备发生特大灾难，如地震、海啸等导致一个OSS数据中心损毁时，还能启用另一个OSS数据中心的备份数据。参考链接：https://help.aliyun.com/document_detail/31864.html'},
  {id:886,type:'single',answer:'D',stem:'「1专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。在VPC内部，用户依然可以采取多种措施，以实现细粒度的访问控制，以下对VPC网络ACL功能的描述，哪一项是错误的？',opts:['网络ACL规则仅过滤绑定的交换机中的ECS流量','网络ACL与交换机绑定，不过滤同一交换机内的ECS间的流量','新创建的网络ACL，默认会在出方向和入方向分别生成一条规则，表示允许所有出、入方向流量','网络ACL的规则是有状态的：返回数据流会被自动允许，不受任何规则的影响'],exp:'网络ACL的规则是无状态的，设置入方向规则的允许请求后，需要同时设置相应的出方向规则，否则可能会导致请求无法响应。'},
  {id:887,type:'single',answer:'B',stem:'「A公司将最近两年的内部培训录像都保存在阿里云对象存储OSS中，以方便员工在需要的时候学习。随着智能手机的普及，很多员工希望通过手机来观看视频，但是保存在OSS中的视频格式无法在手机上直接播放，遇到这种问题时客户可以使用阿里云的哪种云产品高效地解决该问题？',opts:['云数据库RDS','阿里云媒体转码(Media Transcoding，简称MTS)','云服务器ECS','负载均衡SLB'],exp:'划重点:OSS中的视频格式无法在手机上直接播放，所以需要用到视频解码来解决直接播放的问题。'},
  {id:888,type:'single',answer:'C',stem:'「在使用阿里云的负载均衡SLB实例时，做了如下健康检查的配置：响应超时时间为5秒，健康检查间隔为2秒，不健康阈值为3，健康阈值为3。即对于确认一个后端服务器ECS实例是健康的，需要连续三次得到正常响应。如果某后端云服务器ECS实例当前状态是不健康的，现在对该实例进行恢复，可以通过健康检查确认该实例是健康的时间窗是多久？',opts:['5秒','19秒','7秒','21秒'],exp:'健康检查成功时间窗=（健康检查成功响应时间x健康阈值）+检查间隔x（健康阈值-1），应该是1s∗3+2s∗（3-1）=7s.参考链接：https://help.aliyun.com/document_detail/85958.html'},
  {id:889,type:'single',answer:'C',stem:'「某企业使用ECS搭建了业务系统，并选择应用负载均衡ALB来均衡访问流量。但是搭建完成后访问业务系统时响应为503(ServiceTemporarilyUnavailable）状态码，可能的原因是（）。',opts:['ALB与后端服务之间TCP通信异常','后端服务负载增大，响应请求的时间大于配置的响应超时时间。','监听没有配置后端服务器','健康检查异常'],exp:'ALB监听没有配置后端服务器，或者配置的后端服务器的权重为0可导致SLB返回状态码503。https://help.aliyun.com/document_detail/400300.html#section-8rc-5el-s9c'},
  {id:890,type:'single',answer:'C',stem:'使用CDN加速访问URL时，出现空白页面，使用Chrome浏览器访问源站，按F12键打开开发者工具，单击Network,查看Content-Length配置项显示为0，这个问题应该如何解决?',opts:['清理浏览器的缓存，并重新开启浏览器访问该网站','打开CDN控制台，单击域名管理。 在对应的域名上点击配置，在配置页面找到Content-Length参数并关闭','查看源站是否返回Tansfer-Encoding: chunked头信息。CDN不支持此头信息，去除此头信息即可','登录CDN控制台，检查该域名的配置，查看CNAME是否匹配正确'],exp:'若Content-Length配置项为0，则查看源站是否返回Transfer-Encoding:chunked头信息。CDN不支持此头信息，删除此头信息即可。参考链接：https://help.aliyun.com/knowledge_detail/73749.html'},
  {id:891,type:'single',answer:'C',stem:'ECS在使用的过程中如果数据盘空间不够，可以使用扩容功能，扩容云盘只是创建一块新云盘，作为数据盘挂载到实例上，以下需要用户自行操作的是哪一个？',opts:['设置挂载点','分区格式化','刷新文件系统','修改用户权限'],exp:'阿里云ECS数据盘扩容后，挂载新云盘需完成基础操作流程。官方文档指出，新云盘挂载后，分区、格式化、挂载点配置属于用户必选操作。选项A“设置挂载点”通常通过配置/etc/fstab实现，属于格式化后的步骤；选项B“分区格式化”为新盘初始化的关键环节；选项D“修改用户权限”与磁盘挂载无直接关联。选项C“刷新文件系统”在部分场景下指文件系统扩容后的操作（如resize2fs），但此处题干语境为新盘挂载，常规流程中无需此步骤。此题为答案设定条件下的解析示例。'},
  {id:892,type:'single',answer:'C',stem:'E公司是一个原创网络小说的发布和交流平台，基于阿里云平台建设（使用了云服务器ECS和内容分发网络CDN的组合），上线3年来积累了大量的原创作品，访问量每季度增长50%。两天前，有同事发现来自某一段IP的爬虫每天晚上自动来抓取平台里的原创内容，并在多个社区里发布，造成作者权益的受损。为此管理员果断在ECS的安全组里屏蔽了那段IP，但是问题并没有解决。请您为管理员提供一个可行的方案。',opts:['启用阿里云CDN的refer白名单功能','开启云服务器ECS内部的防火墙','启用阿里云CDN的Refer黑名单功能','启用阿里云CDN的IP黑名单功能'],exp:'在ECS安全组屏蔽了那段IP是不奏效的，说明对方访问的还是CDN的资源，所以需要在CDN中屏蔽这段IP。题目中指明了固定的这段IP，所以需要用到refer黑名单的功能。参考链接：https://help.aliyun.com/document_detail/27134.html'},
  {id:893,type:'single',answer:'C',stem:'［用户购买了一台ECS服务器，希望该实例只开放80端口进行公网访问，以下哪种操作能实现该配置？',opts:['新建一个安全组，并新增一条安全组规则允许80端口的公网入流量，将该云服务器实例放入该安全组','在原有安全组中新增一条规则只允许80端口流量入','新建一个安全组，并新增一条安全组规则允许80端口的公网入流量，将该云服务器实例放入该安全组，并从原先的默认安全组挪出','在该实例所在的默认安全组添加一条公网访问规则仅允许80端口的公网出访问，并添加一条公网访问规则不允许所有的公网出流量'],exp:'只有新建一个安全组，并将其放入，并移除之前所有安全组，开发端口才能保证。因为不知道其他安全组的规则和权重。'},
  {id:894,type:'single',answer:'A',stem:'「在阿里云上创建专有网络VPC时，VPC会自动为用户创建1条系统路由，以下哪一项是这条路由的作用？',opts:['用于专有网络内的云产品实例访问专有网络外的云服务(该云服务支持VPC内的云产品实例直接访问)','用于专有网络外的云产品实例访问专有网络内的云产品实例','没有任何作用','用于打通用户所有的专有网络'],exp:'创建专有网络后，系统会自动为您创建一张默认路由表并为其添加系统路由来管理专有网络的流量。参考链接：https://help.aliyun.com/document_detail/49002.html'},
  {id:895,type:'single',answer:'D',stem:'「基于已有ECS实例创建伸缩组后，系统会根据业务情况自动添加或减少一组具有相同配置的ECS实例。某用户在创建伸缩组时设置期望实例数为8，并添加3台已有实例，伸缩组创建完成后，已有实例添加至伸缩组，此时该伸缩组期望实例数为多少？',opts:['5','3','8','11'],exp:'手动添加实例，直接触发扩容，然后修改期望实例数。当前期望实例数+扩容数量。参考链接：https://help.aliyun.com/document_detail/146231.html'},
  {id:896,type:'single',answer:'A',stem:'「您在阿里云的两个不同地域创建了专有网络VPC，如果希望实现两个VPC之间的私网通信，采用以下哪种产品可以实现？',opts:['通过云企业网实现VPC之间的私网通信','通过路由器创建新的路由条目打通','通过安全组创建新的访问规则打通','无需任何操作，同一个帐号下的不同VPC本来就是内网连通的'],exp:'题目问的是希望实现两个VPC之间的私网通信，所以需要通过高速通道或者云企业网或者vpn来实现VPC之间的私网通信。'},
  {id:897,type:'single',answer:'A',stem:'某企业在华北1（青岛）地域购买了ECS实例并部署了业务系统，为了实现跨地域的负载均衡及高可用性，该企业管理员想快速在华东2（上海）及华南2（河源）地域部署多台相同的ECS实例，该管理员可通过方式实现快速部署。',opts:['在华北1地域通过现有ECS实例创建自定义镜像，并将该镜像复制到华东2和华南2地域，然后利用复制的自定义镜像在华东2及华南2地域部署ECS实例','在华北1地域通过现有ECS实例创建自定义镜像，并基于自定义镜像将ECS部署到华东2和华南2地域','在华东2和华南2地域分别购买ECS实例，并分别部署业务系统完成配置','在华北1地域通过现有ECS实例创建自定义镜像，并基于自定义镜像在华北1地域部署需要的ECS实例，然后将ECS实例的地域更改到华东2和华南2'],exp:'不同地域镜像不可通用，只能使用的地域均复制一个，且ECS实例创建后不支持修改地域属性。'},
  {id:898,type:'single',answer:'A',stem:'题干：419/820、阿里云的专有网络VPC下的云服务器ECS实例如果绑定了EIP，就可以实现该服务器ECS实例对公网的服务。出于安全的考虑要求禁止某台绑定了EIP的云服务器ECS实例的3389端口的TCP访问，可以通过以下哪种方法来实现？',opts:['在这台云服务器实例的安全组规则中添加一条入方向的访问规则，拒绝所有内外网IP的TCP协议访问3389端口','在这台云服务器实例的安全组规则中添加一条公网入方向的访问规则，拒绝所有公网IP的TCP协议访问3389端口','在这台云服务器实例的安全组规则中添加一条入方向的访问规则，拒绝所有内网IP的TCP协议访问3389端口','在这台云服务器实例的安全组规则中添加一条公网入方向的访问规则以及一条内网入方向的访问规则，拒绝所有内外网IP的TCP协议访问3389端口'],exp:'在控制台里面，专用网络VPC下面的ECS，不管是否绑定了EIP，在设置安全组的时候，只可以设置内网规则，外网规则是不可以选的。因为对于其来说，内网规则等同于外网规则，所以不要被题目中的"对公网的服务"误导。所以此题应该选择添加一条入方向的访问规则，拒绝所有IP的TCP协议访问3389端口。'},
  {id:899,type:'single',answer:'B',stem:'「1在创建阿里云的云产品实例时，可以选择默认类型的专有网络VPC和交换机，这两项配置确定了专有网络类型的云产品创建时在相应地域和可用区下唯一的默认网络位置，与非默认的专有网络VPC和交换机之间的区别主要在于默认类型的VPC和交换机只能由阿里云为您创建。下列关于默认专有网络VPC的描述，哪一项是错误的？',opts:['每个地域的默认专有网络VPC唯一','默认专有网络VPC与非默认专有网络VPC的操作方式与规格限制不一致','默认专有网络VPC由阿里云为您创建，您自行创建的均为非默认专有网络VPC','默认专有网络VPC不占用阿里云为您分配的专有网络VPC配额'],exp:'默认专有网络与非默认专有网络的操作方式与规格限制一致。 参考链接：https://www.alibabacloud.com/help/zh/doc-detail/65402.html'},
  {id:900,type:'single',answer:'D',stem:'弹性公网IP EIP(Elastic IP Address)是可以独立购买和持有的公网IP地址资源。',opts:['NAT网关','负载均衡SLB','云服务器ECS','云数据库RDS'],exp:'本题单选正确答案为D。D（云数据库RDS）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:901,type:'single',answer:'B',stem:'交换机（vSwitch）是组成专有网络VPC的基础网络模块，用来连接不同的云资源。下列关于交换机的说法正确的是',opts:['交换机创建后，可以灵活修改其网段','交换机的网段必须是其所属VPC网段的真子集','交换机支持组播和广播','每个交换机的第1个和1个IP地址为系统保留地址'],exp:'配置交换机的IPv4网段。交换机的网段限制如下：交换机的网段必须是其所属VPC网段的真子集。 例如，VPC的网段是192.168.0.0/16，那么该VPC内交换机的网段必须是192.168.0.0/16的真子集，可以是192.168.0.0/17~192.168.0.0/29。 每个交换机的第1个和最后3个IP地址为系统保留地址。 例如，交换机的网段为192.168.1.0/24，则192.168.1.0、192.168.1.253、192.168.1.254和192.168.1.255这4个地址是系统保留地址。 如果交换机有和其他VPC的交换机或本地数据中心通信的需求，请确保交换机的网段和要通信的网段不冲突。 https://help.aliyun.com/document_detail/65387.html(https://help.aliyun.com/document_detail/65387.html) 交换机创建后，不能再修改网段。'},
  {id:902,type:'single',answer:'B',stem:'「某游戏公司的架构师在设计游戏部署架构时，选择将游戏主程序部署在ECS上，所有业务数据存储在Redis中，如果希望获得较高的性价比，且掉电数据不丢失，可以选择Tair产品类型满足需求。',opts:['内存型','持久内存型','混合存储型','磁盘（ESSD）型'],exp:'https://help.aliyun.com/document_detail/441340.html'},
  {id:903,type:'single',answer:'C',stem:'在阿里云上使用云数据RDS时，经常使用到数据传输服务DTS。DTS支持关系型数据库、非关系型的数据库、数据多维分析等数据源间的数据交互，它的功能可支持数据异地多活、数据异地灾备、本地数据灾备等场景的数据源交互。',opts:['数据迁移','数据集成','数据同步','数据订阅'],exp:'数据同步功能帮助您实现数据源之间的数据实时同步，适用于数据异地多活、数据异地灾备、本地数据灾备、跨境数据同步、云BI及实时数据仓库等多种业务场景。 https://help.aliyun.com/document_detail/417486.html(https://help.aliyun.com/document_detail/417486.html)'},
  {id:904,type:'single',answer:'C',stem:'「1弹性伸缩服务使用可以根据业务需求和策略设置伸缩规则，适合业务量波动的应用场景。关于弹性伸缩服务，以下哪项说法是错误的？',opts:['不支持纵向扩展','ECS实例上的应用必须是无状态并且可横向扩展的','不支持自动在RDS访问白名单中添加或移除ECS实例的IP','伸缩组内ECS不适合保存会话记录、应用数据、日志等信息'],exp:'本题单选正确答案为C。C（不支持自动在RDS访问白）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:905,type:'single',answer:'A',stem:'在使用阿里云弹性伸缩(Auto Scaling)时，伸缩组中包含的云服务器ECS实例有两种类型，一种是根据用户的伸缩配置和伸缩规则由弹性伸缩服务自动创建的云服务器ECS实例，另外一种是由用户手工添加到伸缩组中的ECS实例。关于这两种云服务器ECS实例，以下哪项说法是正确的？',opts:['当ECS实例被弹性伸缩从伸缩组中移出时，对于自动创建的ECS实例会停止和释放，对于手工添加的ECS实例则不会停止和释放','手工添加的ECS实例，不受伸缩配置中定义的规格的限制','手工添加的ECS实例对地域没有要求，但是对状态有要求，必须是“运行中”','当伸缩组需要减少ECS实例时，自动创建的ECS实例会被优先移出伸缩组，手工添加的ECS实例会被尽量保留'],exp:'手动添加一台或多台ECS实例。手动添加的ECS实例配置与当前伸缩配置没有关联。但是手工添加的ECS需要和当前伸缩组处于同一个地域。参考链接：https://help.aliyun.com/document_detail/25901.html'},
  {id:906,type:'single',answer:'A',stem:'某企业运维工程师在使用云数据库RDSMySQL时发现，RDSMySQL支持',opts:['要使用库表恢复，需要先开启库表备份，且开通之后无法关闭该功能','恢复到新实例的地域可以与原实例不同','库表恢复功能需要手动开启，会产生一定费用','恢复到原实例时，恢复后库名或表名与之前相同'],exp:'新实例的地域与原实例相同，不支持修改。常规的库表恢复功能默认开启，不会产生费用。恢复到原实例时，恢复后库名可与原库名相同，但恢复后表名不能与原表名相同。https://help.aliyun.com/document_detail/103175.html'},
  {id:907,type:'single',answer:'B',stem:'某用户购买了一个带宽峰值为100MB的负载均衡实例，并在该实例下创建了三个监听（监听A、监听B和监听C)。已知监听A承载了用户核心业务，业务峰值为50MB，监听B、C承载非核心业务，并且业务流量波动较大(10-100MB左右)。为了保证带宽高利用率，并且用户核心业务始终保持足够的带宽，下列哪一项设置最合理？',opts:['三个监听均不设带宽峰值','为监听A设带宽峰值为50MB,视业务情况为监听B、C分别设带宽峰值（和不超过50MB）','为监听A设置带宽峰值为50MB,监听B、C不设置带宽峰值','视业务情况为监听B、C分别设置带宽峰值监听，监听A不设置监听峰值'],exp:'本题单选正确答案为B。B（为监听A设带宽峰值为50）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:908,type:'single',answer:'C',stem:'专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。创建专有网络后，系统会在路由表中自动添加一条以（）为目标网段的路由条目，用于VPC内的云产品通信。',opts:['172.16.0.0/12','10.0.0.0/8','100.64.0.0/10','192.168.0.0/16'],exp:'参考链接：https://help.aliyun.com/document_detail/87057.html'},
  {id:909,type:'single',answer:'D',stem:'「1专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。以下关于VPC中交换机与其它组件的对应关系，哪一项是错误的？',opts:['网络ACL是与交换机绑定的','子网是与交换机绑定的','路由表是与交换机绑定的','安全组是与交换机绑定的'],exp:'安全组不和交换机绑定，并且可关联多个交换机中的实例'},
  {id:910,type:'single',answer:'D',stem:'安全组是一种虚拟防火墙，由同一地域内具有相同保护需求并相互信任的实例组成，具备状态检测和数据包过滤能力，用于在云端划分安全域，以下哪项是正确的创建及管理安全组规则的流程？',opts:['1、创建安全组； 2、添加安全组规则； 3、弹性网卡加入安全组； 4、管理安全组； 5、ECS实例绑定弹性网卡； 6、管理安全组规则','1、创建安全组； 2、添加安全组规则； 3、ECS加入安全组； 4、管理安全组规则； 5、管理安全组','1、创建安全组； 2、ECS加入安全组； 3、添加安全组规则； 4、管理安全组； 5、管理安全组规则','1、创建安全组； 2、添加安全组规则； 3、ECS加入安全组； 4、管理安全组； 5、管理安全组规则'],exp:'https://help.aliyun.com/document_detail/173123.html'},
  {id:911,type:'single',answer:'A',stem:'已知某个VPC网络附加IPv4网段为172.16.0.0/16。该VPC路由表中已有云企业网（已开始路由重叠功能）路由，目标网段为172.16.0.0/24。如果当前用户使用附加网段来创建交换机，用户可以选择以下哪一网段?',opts:['172.16.0.0/16','172.16.0.0/17','172.16.0.0/24','172.16.0.0/25'],exp:'如果交换机所属的专有网络添加了附加IPv4网段，您可以根据业务需要选择主IPv4网段或附加IPv4网段作为交换机所属的网段。因为用附加网段来创建交换机，则选择176.16.0.0/16。参考链接：https://help.aliyun.com/document_detail/65387.html'},
  {id:912,type:'single',answer:'B',stem:'专有网络VPC类型的ECS实例有两种IP地址，分为私有IP地址和公网IP地址。专有网络VPC类型ECS实例一经创建即被分配一个私有IP地址。以下哪种场景不适用私有IP地址？',opts:['同一局域网内ECS实例与其他云服务之间内网互访','不在同一局域网内的ECS实例与其他云服务之间互访','负载均衡','同一局域网内ECS实例之间内网互访'],exp:'私有IP地址可以用于以下场景: 1.负载均衡 2.同一局域网内ECS实例之间内网互访 3.同一局域网内ECS实例与其他云服务(如OSS、RDS)之间内网互访参考链接：https://help.aliyun.com/document_detail/44441.html'},
  {id:913,type:'single',answer:'D',stem:'「容器服务ACK让企业能轻松高效地在云端运行Kubernetes容器化应用，无需关心容器的繁琐部署运单选维，专注于核心业务。创建ACK集群后，可在集群内部署工作负载，部署配置完成后可通过公网访问工作负载。ACK支持多种公网访问方式，但不包括以下___方式。',opts:['节点访问','负载均衡','Nginx Ingress','EIP'],exp:'ACK支持五种公网访问方式：节点访问（NodePort），负载均衡（LoadBalancer），Nginx Ingress，域名（External DNS），DNAT网关（DNAT）。https://help.aliyun.com/document_detail/86745.html(https://help.aliyun.com/document_detail/86745.html)'},
  {id:914,type:'single',answer:'A',stem:'云连接器提供海量物联网卡一站式定向上云连接服务，即开即用，可实现物联网终端到阿里云之间安全、稳定、可靠的连接。云连接器由云连接器实例、授权规则和连接地址池三部分组成。其中授权规则，由目标地址类型、目标地址和访问策略组成，可以允许或拒绝物联网终端访问目标地址。',opts:['目标地址类型、目标地址和访问策略','目标地址类型、目标地址和DNS授权','目标地址、DNS授权和访问策略','目标网段、目标域名和访问策略'],exp:'https://help.aliyun.com/document_detail/303954.html'},
  {id:915,type:'single',answer:'C',stem:'「阿里云弹性伸缩服务（Auto Scaling）中，创建完成伸缩组后，为了设置用于弹性伸缩的云服务器ECS实例的规格，需要定义以下哪一项？',opts:['伸缩活动','定时任务','伸缩配置','伸缩规则'],exp:'参考链接：https://help.aliyun.com/document_detail/87761.html'},
  {id:916,type:'single',answer:'A',stem:'「1当用户访问OSS图片处理服务错误的时候，图片处理服务会返回给用户相应的错误码和错误信息。用户无法解决问题时，可以将错误消息中的（）元素发送给图片处理服务的工程师，定位错误的原因。',opts:['Requestld','Code','Hostld','Message'],exp:'用户发送的每次接口调用请求，无论成功与否，系统都会返回一个唯一识别码RequestId给用户。参考链接：https://help.aliyun.com/document_detail/44706.html'},
  {id:917,type:'single',answer:'A',stem:'某全球性访问论坛使用对象存储服务OSS存储论坛的静态资源，并使用了CDN服务实现资源的就近访问，某些用户发现论坛的下载文件速度大幅提升，但部分客户因数据传输距离较远，导致上传文件速度很慢。为提升该论坛用户上传文件的速度，让不同地域的用户都能有很好的访问体验，该论坛可以开通以下哪种服务？',opts:['开启OSS服务的传输加速服务','开通OSS服务静态网站托管','开通PCDN加速服务','开通不同地域的OSS服务作为文件存储，不同地域OSS之间通过跨区域复制功能实时同步数据'],exp:'OSS传输加速利用全球分布的云机房，将全球各地用户对您存储空间（Bucket）的访问，经过智能路由解析至就近的接入点，使用优化后的网络及协议，为云存储互联网的上传、下载提供端到端的加速方案。参考链接：https://help.aliyun.com/document_detail/131312.html'},
  {id:918,type:'single',answer:'A',stem:'在使用阿里云负载均衡SLB的时候，经常会发现有很多100开头的IP(100.x.X.x)在访问负载均衡SLB实例的后端云服务器ECS实例，这可能是由以下哪项原因引起的？',opts:['开启了健康检查选项，负载均衡SLB实例对ECS实例进行健康检查引起的','是云监控搜集各种统计指标','是阿里云飞天系统的Zookeeper守护进程','肯定配置了阿里云弹性伸缩(Auto Scaling)，这是弹性伸缩的弹性自愈进程在做ECS实例的状态检查'],exp:'有10或100开头的IP在频繁访问ECS是因为负载均衡系统除了会通过系统服务器的内网IP将来自外部的访问请求转到后端ECS上之外，还会对ECS进行健康检查(前提是您已经开启了这一功能)和对您的负载均衡服务进行可用性监控，这些访问的来源都是由负载均衡系统发起的。参考链接：https://yq.aliyun.com/ask/58922'},
  {id:919,type:'single',answer:'C',stem:'弹性伸缩ESS支持滚动升级功能，通过任务形式批量更新伸缩组内处于服务中状态的ECS实例的镜像。下列关于滚动更新说法正确的是',opts:['伸缩组中可以存在执行中的伸缩活动','同一时间支持并发执行多个滚动升级任务','伸缩组所在地域必须支持运维编排服务OOS','已滚动升级的任务不支持回滚'],exp:'仅适用于所在地域支持运维编排服务OOS的伸缩组，否则伸缩组无法使用滚动升级功能。 参考链接：https://help.aliyun.com/document_detail/162302.html'},
  {id:920,type:'single',answer:'C',stem:'「对象存储OSS支持数据冷热分层，提供更具性价比的存储方式，适合存放任意类型的文件。OSS支持三种不同的存储类型，覆盖从热到冷的各种数据存储场景，以下哪一项不属于OSS支持的存储类型？',opts:['归档存储','标准存储','冗余存储','低频访问存储'],exp:'对象存储OSS提供标准、低频访问、归档三种存储类型，全面覆盖从热到冷的各种数据存储场景。参考链接：https://help.aliyun.com/document_detail/51374.html'},
  {id:921,type:'single',answer:'B',stem:'【】SLB是将访问流量根据转发策略分发到后端多台云服务器（ECS实例）的流量分发控制服务。下列关于SLB说法，错误的是哪一项？',opts:['在使用SLB的过程中随时调整后端ECS的数目','同一组ECS不可以搭建多个网站并同时进行负载均衡','SLB的服务能力与后端ECS的公网宽带规格无关','不同操作系统的ECS可以同时做为SLB服务的后端服务器'],exp:'同一组ECS可以同时搭建多个网站并进行负载均衡。'},
  {id:922,type:'single',answer:'B',stem:'题干：444/820、阿里云对象存储OSS为用户提供保存访问日志记录的功能，当一个Bucket开启访问日志记录功能后，OSS将自动记录这个Bucket的请求日志，以小时为单位，按照固定的命名规则，生成一个Object，写入用户指定的BucketB。以下关于OSS日志记录的说法中，哪项是正确的？',opts:['Bucket A和Bucket B可以属于不同的用户','Bucket A和Bucket B可以是同一个Bucket，也可以是不同的Bucket，但必须属于同一个用户','Bucket A和Bucket B必须是不同的Bucket','Bucket A和Bucket B必须是同一个Bucket'],exp:'源Bucket和目标Bucket可以是同一个Bucket，也可以是不同的Bucket，但必须属于同一个账号下的同一地域内。您也可以将多个源Bucket的Log都保存在同一个目标Bucket内(建议指定不同的TargetPrefix)。参考链接：https://help.aliyun.com/document_detail/31868.html'},
  {id:923,type:'single',answer:'C',stem:'负载均衡通过设置虚拟服务地址，将添加的ECS实例虚拟成一个高性能、高可用的应用服务池，并根据转发规则，将来自客户端的请求分发给云服务器池中的ECS实例。下列关于SLB转发规则说法，错误的是哪一项?',opts:['SLB支持“轮询模式”转发规则','虚拟服务器组中添加的ECS实例的地域必须和负载均衡实例相同','一般情况下，默认路由在有内网的情况下，先走内网，无内网再走外网','SLB支持“最小连接数模式”转发规则'],exp:'在有公网网卡的情况下，默认路由会走公网。参考链接：https://help.aliyun.com/document_detail/55193.html'},
  {id:924,type:'single',answer:'C',stem:'「云计算提供多种服务模型，例如将消费者创建或获取的应用程序，利用资源提供者指定的编程语言和工具部署到云的基础设施上。消费者不直接管理或控制包括网络，服务器，运行系统，存储，甚至单个应用的功能在内的底层云基础设施，但可以控制部署的应用程序，也有可能配置应用的托管环境。这种服务模型被称作',opts:['软件即服务（SaaS）','数据即服务（DaaS）','平台即服务（PaaS）','基础设施即服务（IaaS）'],exp:'本题单选正确答案为C。C（平台即服务（PaaS））符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:925,type:'single',answer:'D',stem:'开通阿里云对象存储OSS服务后，您首先需要使用OSS管理控制台或OpenAPI创建存储空间Bucket来存储文件，以下关于Bucket的说法中，哪项是正确的？',opts:['Bucket的名称要求全局唯一，创建后支持更改','Bucket的名称只要求在本帐号内唯一，创建后支持更改','Bucket的名称要求在本帐号内唯一，且创建后不支持更改','Bucket的名称要求全局唯一，且创建后不支持更改'],exp:'每个Bucket存储空间的名字全局唯一，Bucket存储空间一旦创建成功，名称和所处地域不能修改。参考链接：https://help.aliyun.com/document_detail/31842.html'},
  {id:926,type:'single',answer:'C',stem:'1阿里云上使用弹性伸缩AS时，为简化启用伸缩组前的准备操作，更快地使用伸缩组开始扩缩容，可以基于ECS实例创建伸缩组，伸缩组创建完成后，系统会创建一个默认伸缩配置进行使用。以下关于该操作说法正确的是',opts:['如果需要为伸缩组关联RDS实例，RDS实例和伸缩组可以位于不同地域','在基于ECS实例创建伸缩组时，作为组内实例配置信息来源的ECS实例的计费方式必须是按量付费实例','伸缩组创建完成后，支持自动创建ECS实例和手动添加已有ECS实例','如果需要为伸缩组关联应用型负载均衡ALB服务器组，伸缩组的网络类型必须为VPC，但可以和ALB处于不同VPC'],exp:'详情可查看基于ECS实例创建伸缩组。https://help.aliyun.com/document_detail/161242.html'},
  {id:927,type:'single',answer:'C',stem:'阿里云的负载均衡SLB可以把用户请求分发到多台云服务器ECS实例上去，其中“加权轮询模式”的转发策略是指以下哪一项？',opts:['将访问请求分发给目前负载最低的后端云服务器ECS实例','将等待最久的访问请求分发给后端云服务器池中处理能力最强的ECS实例','将访问请求按照后端云服务器ECS实例的权重依次分发','将优先级最高的访问请求优先分发给后端云服务器ECS实例'],exp:'加权轮询:权重值越高的后端服务器，被轮询到的次数(概率)也越高。参考链接：https://help.aliyun.com/document_detail/53858.html'},
