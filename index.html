  {id:459,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)，是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务。支持用户添加已有的云服务器ECS实例，但该云服务器ECS实例的状态必须为',opts:['运行中','已创建','已停止','准备中'],exp:'弹性伸缩手动添加ECS，ECS的状态必须为运行中。'},
  {id:460,type:'single',answer:'B',stem:'如果用户不再需要ECS实例上挂载的某块云盘，用户可以将其手动释放，存储在云盘上的数据会被全部释放，云盘停止计费。用户在手动释放云盘时，云盘状态必须为',opts:['使用中','待挂载','已删除','初始化中'],exp:'手动释放云盘以及为按量付费数据盘开启或关闭随实例释放时，云盘状态必须为待挂载。 https://help.aliyun.com/document_detail/33828.html?spm=a2c4g.11186623.6.828.77226fff6z78ls'},
  {id:461,type:'single',answer:'C',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，提供丰富的功能，满足各种业务场景的需要。某用户使用SLB和多台后端云服务部署高并发网站，在使用过程中，发现某段时间客户端访问延迟，想要快速定位异常后端服务器，推荐其采用的方式是',opts:['通过SLB健康检查功能，定位健康检查异常的ECS','通过弹性伸缩服务配合云监控，在客户端访问延迟时快速增加云服务器实例','结合阿里云日志服务，通过仪表盘巡检，分析负载均衡的响应时间','结合阿里云云监控服务，查看负载均衡的云监控数据'],exp:'什么是负载均衡访问日志： 负载均衡的访问日志能收集了所有发送到负载均衡的请求的详细信息，包括请求时间、客户端IP地址、延迟、请求路径和服务器响应等。负载均衡作为公网访问入口，承载着海量的访问请求，您可以通过访问日志分析客户端用户行为、了解客户端用户的地域分布、进行问题排查等。 参考链接： https://help.aliyun.com/document_detail/139996.html?spm=a2c4g.11174283.6.677.446511929sSCMf'},
  {id:462,type:'single',answer:'A',stem:'专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。在VPC内部，用户依然可以采取多种措施，以实现细粒度的访问控制，以下对VPC网络ACL功能的描述，错误的是',opts:['网络ACL的规则是有状态的：返回数据流会被自动允许，不受任何规则影响','网络ACL与交换机绑定，不过滤同一交换机内的ECS间的流量','网络ACL规则仅过滤绑定的交换机中的ECS流量','新创建的网络ACL，默认会在出方向和入方向分别生成一条规则，表示允许所有出、入方向流量。'],exp:'网络ACL的规则是无状态的，设置入方向规则的允许请求后，需要同时设置相应的出方向规则，否则可能会导致请求无法响应。'},
  {id:463,type:'single',answer:'D',stem:'在阿里云ECS中，无论每次接口调用请求是否成功，系统都会返回一个唯一识别码（返回参数）给用户？',opts:['Version','AccessKeyId','Response','RequestId'],exp:'用户发送的每次接口调用请求，无论成功与否，系统都会返回一个唯一识别码 RequestId 给用户。参考链接：https://www.alibabacloud.com/help/zh/doc-detail/45136.htm'},
  {id:464,type:'single',answer:'A',stem:'基于已有ECS实例创建伸缩组后，系统会根据业务情况自动添加或减少一组具有相同配置的ECS实例。某用户在创建伸缩组时设置期望实例数为8，并添加3台已有实例，伸缩组创建完成后，已有实例添加至伸缩组，此时该伸缩组期望实例数为',opts:['8','3','11','5'],exp:'在阿里云弹性伸缩服务中，创建伸缩组时设置的期望实例数默认会被保留。题目中用户设置期望实例数为8，添加3台已有实例后，由于已有实例数(3)未超过期望值(8)，因此系统维持原期望值。根据弹性伸缩机制，当已有实例数小于伸缩组期望值时，系统会通过自动扩容补足差值（此时会触发扩容5台实例）。本题关键点在于理解：期望实例数的调整仅发生在已有实例数超过设定值的情况'},
  {id:465,type:'single',answer:'A',stem:'为了提升您在阿里云上部署的应用的可用性，可以在多可用区创建云服务器ECS实例并进行应用的部署，同时可以与产品搭配使用，可以实现高可用的架构。',opts:['负载均衡SLB','云数据库RDS','弹性伸缩Auto Scaling','云监控'],exp:'题目中要求可以在多可用区部署ECS，所以需要通过负载均衡SLB来实现。'},
  {id:466,type:'single',answer:'D',stem:'您的操作系统为Windows的阿里云的云服务器ECS实例，通过远程登录发现黑屏，不可能是原因造成的。',opts:['内存空间不足','CPU资源耗尽','系统宕机','密码输入错误'],exp:'云服务器ECS实例黑屏说明是ECS的状态不正常导致的，密码输入错误是不会导致云服务器ECS实例出现异常。'},
  {id:467,type:'single',answer:'C',stem:'云计算以多种形式对外提供服务，比如可以提供给消费者处理能力、存储、网络和其他基本的计算资源，消费者能够利用这些计算资源部署和运行任意软件，包括操作系统和应用程序，但不能管理或控制任何云计算基础设施。这种服务形式被称作',opts:['SaaS(软件即服务)','PaaS(平台即服务)','IaaS(基础设施即服务)','DaaS(数据即服务)'],exp:'题目中说了：利用这些计算资源部署和运行任意软件，包括操作系统和应用程序，说到“计算资源”了，所以就是提供基础的云计算服务，即基础设施即服务，具体可以结合参考链接中的产品举例理解区分：https://yq.aliyun.com/articles/560829'},
  {id:468,type:'single',answer:'D',stem:'某中小企业打算将一个业务系统快速移至阿里云，其原来是租用了IDC机房的一台物理机部署，包含括应用、数据库（mysql）以及存储文件（约100G），以下方案中，最经济快捷的是',opts:['使用两台ECS进行部署，一台部署应用及存放数据，另一台部署mysql','使用一台ECS部署应用和存储文件，使用RDS（mysql）实例快速完成数据库迁移','使用一台ECS部署应用和数据库，使用对象存储OSS节约文件存储成本','使用云服务器ECS、云数据库RDS（mysql）、对象存储OSS进行部署，形成弹性、可扩展的架构'],exp:'企业迁移业务系统需兼顾经济性与效率。ECS提供计算资源，RDS实现数据库高可用与免运维管理，OSS以按量付费方式低成本存储非结构化文件（如100G文件）。三者组合可独立弹性伸缩，避免单点瓶颈，降低整体TCO。选项A、B、C均未完整分离计算、数据库与存储，存在性能耦合或扩展受限问题。'},
  {id:469,type:'single',answer:'B',stem:'《网络安全法》第二十一条规定：网络运营者应当按照网络安全等级保护制度的要求，履行下列安全保护义务，保障网络免受干扰、破坏或者未经授权的访问，防止网络数据泄露或者被窃取、篡改。而在现实网络环境中，木马病毒、勒索病毒、挖矿程序等持久化、顽固型病毒已经成为网络安全最大的威胁。在使用云服务器ECS的过程中，如果发现ECS感染了木马病毒，建议用户最先采取的措施是',opts:['修改远程登录端口','修改系统管理员账户的密码','检查是否有陌生的异常进程在运行','安装查杀病毒防木马软件，对服务器进行全盘病毒扫描和查杀'],exp:'感染病毒后的解决方法 通过执行以下操作，处理感染病毒后的云服务器ECS。 修改系统管理员账户的密码。建议密码长度不小于8位，并且使用大写字母、小写字母、数字、特殊字符组合。 修改远程登录端口。 Windows操作系统：如何查看和修改Windows实例远程桌面的默认端口 Linux操作系统：修改/etc/ssh/sshd_config文件中对应的端口号，重新启动sshd服务。 开启防火墙限制允许登录的IP地址，防火墙只开放特定的服务端口。建议对FTP、数据库等这些不需要对所有用户开放的服务进行源IP访问控制。 Windows操作系统：如何配置Windows实例远程连接的防火墙 Linux操作系统：云服务器ECS实例如何配置默认防火墙Firewall 检查是否有开放未授权的端口，如果有，关闭未授权的端口。 Windows操作系统：在CMD命令行，输入netstat /ano命令检查端口。 Linux操作系统：执行netstat -anp命令查看。 检查是否有陌生的异常进程在运行，如果有，则关闭该进程，和服务器管理员确认是否可以删除该异常进程所使用的文件。 Windows操作系统检查：选择 开始 > 运行，输入msinfo32，选择 软件环境 > 正在运行的任务，进行检查。 Linux系统检查：通过执行ps -ef或top命令查看。 安装查杀病毒防木马软件，对服务器进行全盘病毒扫描和查杀。建议使用云盾·安骑士。 如果需要删除系统中的未知账户，Windows系统还需要检查注册表中的SAM键值是否有隐藏账户。 如果有Web服务的，限制Web运行账户对文件系统的访问权限，仅开放只读权限。 参考链接： https://help.aliyun.com/knowledge_detail/40994.html?spm=a2c4g.11186623.2.78.67c860e6tV9BPO'},
  {id:470,type:'single',answer:'A',stem:'在使用阿里云的负载均衡SLB实例时，可以对后端云服务器ECS实例配置不同的权重，权重越大的ECS实例，会被分到越多的负载。某个SLB实例的后端服务器池中有5个ECS实例，都处在健康状态，其中一台实例ecs_inst1权重被设置成了100，以下说法中正确的是',opts:['由于不确定其他4台ECS实例的权重配置，所以无法判断ecs_inst1会被分到多大比例的负载','100%的负载都会被分发到ecs_inst1上去，其余4台ECS实例会处于空闲状态','根据SLB的工作原理，ecs_inst1将会被分到大约20%左右的负载','根据外部请求中的请求级别参数判断，所有请求级别参数为100的，都会被转发至ecs_inst1'],exp:'因为只有一台配置了100的权重，并不知道其他4台ECS的具体权重配置（并不是说一台设置了100的权重，其他的权重都必须0，其他ECS也是同样可以设置为100的权重，这样和这一台的权重是相同的，被分发的请求量也是相同的），所以所以无法判断ecs_inst1会被分到多大比例的负载。'},
  {id:471,type:'single',answer:'D',stem:'阿里云的负载均衡SLB中，可以通过健康检查来判断后端云服务器ECS实例的可用性。健康检查可以识别出后端服务器池中是否有不可用的云服务器ECS实例，如果有则不给这些异常的云服务器ECS实例分配任务，直到这些云服务器ECS实例恢复正常，某些特殊应用场景下需要关闭健康检查。以下说法中正确的是_。',opts:['七层服务可以关闭健康检查，四层服务无法关闭健康检查','四层服务可以关闭健康检查，七层服务无法关闭健康检查','无论四层和七层均无法关闭健康检查','无论四层和七层均可以关闭健康检查'],exp:'阿里云负载均衡SLB的健康检查功能支持用户根据业务需求灵活配置。对于四层（如TCP/UDP）和七层（如HTTP/HTTPS）监听，均可在监听设置中启用或关闭健康检查，以适应特殊应用场景。因此，无论四层和七层均可以关闭健康检查，选项D正确；其他选项与实际情况不符'},
  {id:472,type:'single',answer:'B',stem:'如果您希望在阿里云专有网络VPC内创建不同可用区的云服务器ECS实例，获得更高的容灾能力，以下方式是可行的。',opts:['可以通过将处于不同可用区的云服务器ECS实例部署到同一台交换机下，从而实现多可用区容灾','可以通过将云服务器ECS实例部署在处于不同可用区的交换机下，从而实现多可用区容灾','可以通过将云服务器ECS实例部署在处于不同可用区的路由器下，从而实现多可用区容灾','可以通过将处于不同地域的云服务器ECS实例部署到同一台路由器下，从而实现多地域的多可用区容灾'],exp:'云服务器云服务器是关联在交换机下面的，VPC下面可以包含同一个地域多个不同可用区的交换机，所以想具备容灾的能力，可以考虑ECS在一个VPC下面跨交换机部署。是关联在交换机下面的，VPC下面可以包含同一个地域多个不同可用区的交换机，所以想具备容灾的能力，可以考虑ECS在一个VPC下面跨交换机部署。'},
  {id:473,type:'single',answer:'A',stem:'某社区网站每天的PV量高达2000万次，应用程序部署在阿里云的云服务器ECS实例上，日志记录在单台ECS实例的数据盘。现在业务部门提出新的需求，网站的访问日志要保存24个月，并且在需要的时候可以按照日期快速下载，单台ECS实例的数据盘扩到最大容量，可以保存三个月的日志数据。您认为在该系统上增加阿里云的产品可以一次性解决日志的保存问题。',opts:['对象存储OSS','归档存储（Archive Storage）','云数据库RDS','内容分发网络CDN'],exp:'划重点：保存存三个月的日志数据且支持快速下载，所以需要用到OSS。'},
  {id:474,type:'single',answer:'A',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力等几个方面都具有优势。以下不是OSS在数据处理能力方面表现出来的优势。 选项：',opts:['提供大规模的数据分析能力','提供实时缩放图片的处理功能','提供实时的“文字水','提供实时的“图片水印”的图片处理功能'],exp:'对象存储OSS并不具备大规模的数据分析能力。'},
  {id:475,type:'single',answer:'C',stem:'负载均衡服务健康检查机制的引入，有效提高了业务服务的可用性，但健康检查的状态可能影响到前端客户端的访问请求结果。下列选项中，会导致前端访问请求失败。',opts:['目标ECS健康检查成功','目标ECS健康检查失败','目标ECS异常，处于健康检查失败时间窗','目标ECS无异常，处于健康检查成功时间窗'],exp:'如果目标ECS存在异常，正处于健康检查失败时间窗，而健康检查还未达到检查失败判定次数（默认为三次），则相应请求还是会被分发到该ECS，进而导致前端访问请求失败。'},
  {id:476,type:'single',answer:'C',stem:'您已经成功购买了阿里云的弹性公网IP(EIP），需要通过管理控制台进行弹性公网IP的绑定，但是界面提示没有找到相应的云服务器ECS实例，可能是由以下原因引起的。',opts:['您所申请的EIP所在地域的某个可用区内没有经典网络的云服务器ECS实例','您所申请的EIP所在地域的专有网络VPC内在某个可用区内的没有云服务器ECS实例','您所申请的EIP所在的地域内的专有网络VPC内没有云服务器ECS实例','您所申请的EIP所在的地域内没有经典网络的云服务器ECS实例'],exp:'划重点：绑定弹性公网IP却提示没有找到相应的云服务器ECS实例。弹性公网IP的限制有：ECS实例的网络类型必须是专有网络、ECS实例的地域必须和EIP的地域相同。所以选择：您所申请的EIP所在的地域内的专有网络VPC内没有云服务器ECS实例。参考链接：https://help.aliyun.com/document_detail/54479.html'},
  {id:477,type:'single',answer:'C',stem:'当用户想以个人身份向OSS发送请求时，需要首先将发送的请求按照OSS指定的格式生成签名字符串；然后使用AccessKeySecret对签名字符串进行加密产生验证码。OSS收到请求以后，会通过AccessKeyID找到对应的AccessKeySecret，以同样的方法提取签名字符串和验证码，如果计算出来的验证码和提供的一样即认为该请求是有效的；否则，OSS将拒绝处理这次请求，并返回HTTP错误状态码是',opts:['错误状态码:405','错误状态码:400','错误状态码:403','错误状态码:500'],exp:'拒绝处理这次请求对应的状态码是：403。'},
  {id:478,type:'single',answer:'A',stem:'用户通过网络使用软件，无需购买软硬件、建设机房等，而改用向提供商租用基于Web的软件，来管理企业经营活动，且无需对软件进行维护，服务提供商会全权管理和维护软件。这种模式是云计算提供的服务。',opts:['SaaS(软件即服务)','DaaS(数据即服务)','IaaS(基础设施即服务)','PaaS(平台即服务)'],exp:'题目中说了是基于Web的软件，消费者只需要通过网络使用软件，不需要管理和维护软件，所以选择SaaS(软件即服务)。'},
  {id:479,type:'single',answer:'A',stem:'阿里云对象存储服务OSS支持多种访问控制策略，若某bucket的访问权限是私有，其中某个object的访问权限是公共读写，那么，以下关于该bucket和object权限说法正确的是',opts:['所有用户都有该object的读写权限','所有用户都有该bucket的读写权限','只有该Bucket的拥有者可以读写该object','只有被RAM Policy授权的用户可以读写该object'],exp:'OSS权限机制中，Object级别的权限会覆盖Bucket级别权限。当Bucket为私有(默认)时，单独设置为公共读写的Object将允许所有用户读写。选项A正确，因为公共读写权限的Object允许匿名访问；选项B错误，Bucket权限仍为私有；选项C/D与公共读写权限冲突，故排除'},
  {id:480,type:'single',answer:'C',stem:'您已经在阿里云的一台经典网络类型的没有数据盘的云服务器ECS实例上运行所有的应用，现在出于业务发展的需要，您希望将这台云服务器ECS实例迁移到相同地域的专有网络VPC中去，以下操作是可行的。',opts:['直接将云服务器ECS实例的类型转换为专有网络','将该云服务器ECS实例的安全组变更为专有网络类型','制作该云服务器ECS实例的镜像，基于该镜像制作专有网络类型的云服务器ECS实例，业务会短暂停顿','无法迁移'],exp:'题目中需要将经典网络的云服务器ECS实例迁移到相同地域的专有网络VPC中去，虽然目前阿里云支持直接迁移，但是从上云实践的规范中出发，因为云服务器或捆绑或者依赖其他多个附属的云产品（如：数据库RDS等），所以运营一键迁移并不能完成其他附属云产品的转换。所以基于镜像来迁移至专用网络VPC中去是最稳妥的方法。参考链接：https://help.aliyun.com/document_detail/57978.html'},
  {id:481,type:'single',answer:'D',stem:'某视频社交APP计划将系统部署在阿里云上，其业务系统需要包括视频的原始数据采集、视频上传、存储、视频转码、分发以及视频播放的完整功能。如果你是阿里云产品经理，以下选项中的阿里云方案，你会向用户推荐的是',opts:['文件存储+视频点播+媒体处理+内容分发CDN+阿里云播放器','文件存储+短视频SDK+媒体处理+内容分发CDN+阿里云播放器','对象存储OSS+视频直播+媒体处理+内容分发CDN+阿里云播放器','对象存储OSS+短视频SDK+媒体处理+内容分发CDN+阿里云播放器'],exp:'先把ABCD共有的部分“媒体处理+内容分发CDN+阿里云播放器”排除掉，OSS是用来存储的，排除掉“文件存储”，题干中并没有直播需求，所以选择D'},
  {id:482,type:'single',answer:'C',stem:'采用云计算服务与传统自建IT系统不同，相比传统自建方式，云计算带来了巨大的便利性。以阿里云服务器ECS为例，这些便利性中不包括',opts:['用户无需再去维护和管理硬件','获得服务器实例在几分钟内而不是数天数周','用户无需参与任何安全管理工作','用户按照需要获得计算量而不是按照峰值设计'],exp:'题目问的是便利性不包括，安全管理工作还是需要用户参加的。'},
  {id:483,type:'single',answer:'C',stem:'阿里云的负载均衡SLB提供对多台云服务器进行流量分发的服务，支持四层和七层的流量转发。其中七层流量转发是通过实现的。',opts:['LVS','Nginx','Tengine','Heartbeat'],exp:'流量转发四层是通过LVS实现，七层是通过Tengine实现'},
  {id:484,type:'single',answer:'B',stem:'在创建阿里云的云产品实例时，可以选择默认类型的专有网络VPC和交换机，这两项配置确定了专有网络类型的云产品创建时在相应地域和可用区下唯一的默认网络位置，与非默认的专有网络VPC和交换机之间的区别主要在于默认类型的VPC和交换机只能由阿里云为您创建。下列关于默认专有网络VPC的描述错误的是',opts:['每个地域的默认专有网络VPC唯一','默认专有网络VPC与非默认专有网络VPC的操作方式与规格限制不一致','默认专有网络VPC由阿里云为您创建，您自行创建的均为非默认专有网络VPC','默认专有网络VPC不占用阿里云为您分配的专有网络VPC配额'],exp:'默认专有网络与非默认专有网络的操作方式与规格限制一致。参考链接：https://www.alibabacloud.com/help/zh/doc-detail/65402.htm'},
  {id:485,type:'single',answer:'B',stem:'当您的阿里云的云服务器ECS实例处于状态时，通过API查询云服务器状态时，返回状态是runningd',opts:['启动中','运行中','更换系统中','重置中'],exp:'ECS状态是running对应的是运行中的状态。启动中的状态是：Starting。注意区别。'},
  {id:486,type:'single',answer:'A',stem:'弹性公网IP EIP(Elastic IP Address）是可以独立购买和持有的公网IP',opts:['云数据库RDS','云服务器ECS','负载均衡SLB','NAT网关'],exp:'弹性公网IP（EIP）的核心功能是为云资源提供固定公网访问能力，其绑定对象需具备网络接口或网关特性。根据架构设计，云数据库RDS作为内网型数据服务，默认不暴露公网且无直接绑定网络接口的机制，故无法关联EIP；而ECS、SLB、NAT网关均涉及公网通信或流量转发，需通过EIP实现外部访问。'},
  {id:487,type:'single',answer:'A',stem:'题干：487/1023、如果您需要对某个域名（如abc.com)通过阿里云内容分发网络CDN加速，必须要在CDN服务中将该域名（如abc.com）添加到“加速域名”中。添加完成之后您会获得一个CNAME地址A，接下来需要进行域名解析的修改，将该加速域名（如abc.com)指向这个CNAME地址A。以下有关修改域名解析的说法中错误的是？',opts:['该加速域名（如abc.com）所使用的DNS系统必须支持“智能解析”功能','“加速域名”使用的解析服务商可以是阿里云以外的公司','如果您的“加速域名”提前转移到阿里云，且在同一个阿里云帐号下管理，可以实现一键修改解析','为“加速域名”分配的CNAME地址指向的具体IP地址，由阿里云CDN系统智能控制'],exp:'加速域名使用的DNS系统不一定需要支持支持“智能解析”功能。阿里云以外的公司的公司也可以提供解析。参考链接：https://help.aliyun.com/document_detail/27101.html'},
  {id:488,type:'single',answer:'A',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，可以扩展应用系统对外的服务能力，并且可以消除单点故障提升应用系统的可用性。结合共同使用，可以提供WAF及防DDoS攻击能力，使应用环境更安全。',opts:['云盾的DDoS高防IP','云监控','云盾的态势感知','云盾的先知计划'],exp:'WAF解释为Web应用防护系统（也称为：网站应用级入侵防御系统。英文：Web Application Firewall，简称： WAF），DDoS高防IP也是支持Web应用DDoS攻击防护，支持过滤多种flood，高频攻击等攻击，支持HTTP特征过滤、URI过滤、host过滤。参考链接：https://help.aliyun.com/document_detail/28465.html'},
  {id:489,type:'single',answer:'A',stem:'F公司新推出一款手机APP，将安装包链接挂在公司的官网（基于云服务器ECS实例）进行下载（安装包大小：6Mb），上线前两个月下载速度还能接受。自从上周公司在CCTV做了一次广告后，下载量持续爆增，不仅用户体验下降了，官网ECS实例的带宽成本也急剧上升。F公司可以选择阿里云的产品组合，同时解决下载速度和带宽成本的问题。',opts:['对象存储OSS和内容分发网络CDN','对象存储OSS和弹性伸缩(Auto Scaling)','对象存储OSS和云数据库RDS','弹性伸缩(Auto Scaling)和云服务器ECS实例'],exp:'题目需要同时解决下载速度和带宽成本的问题，所以需要将APP存储到对象存储OSS中结合内容分发CDN来解决下载速度和带宽的问题。'},
  {id:490,type:'single',answer:'C',stem:'当一个阿里云的云服务器ECS实例无法加入指定的安全组时，可能是原因造成的。',opts:['该云服务器ECS实例的状态为运行中','云服务器ECS实例创建之后默认已经加入一个安全组，不能再加入其他安全组','本云服务器ECS实例目前已经加入的安全组数量达到上限','该云服务器ECS实例没有开启公网带宽，所以无法加入安全组'],exp:'每个ECS实例最多可以加入 5 个安全组，当超过5个了以后就无法继续加入其他安全组。安全组的限制和主机状态、公网带宽没有关系。参考链接：https://help.aliyun.com/document_detail/25443.html'},
  {id:491,type:'single',answer:'B',stem:'云计算领域的三篇分别关于MapReduce/GFS/BigTable三大技术的经典论文是由哪家公司发表的? 选项：',opts:['Amazon（亚马逊）','Google（谷歌）','Microsoft（微软）','Facebook（脸书）'],exp:'云计算领域的三篇分别关于MapReduce/GFS/BigTable三大技术的经典论文是由Google发表的。参考链接：https://blog.csdn.net/ytangdigl/article/detail/79843684'},
  {id:492,type:'single',answer:'B',stem:'已知在OSS服务上的存储空间test123中存有一个名为abc.png的图片文件。如果用户在相同存储空间下本次又上传了同名abc.png图片文件，则',opts:['提示用户是否确定上传同名文件','覆盖原有图片文件','以abc(1)-png保存上传文件','根据文件大小确认保留哪个图片文件'],exp:'您可以通过重复上传同名的对象来覆盖之前的对象 https://help.aliyun.com/document_detail/31827.html?spm=a2c4g.11186623.6.610.65bf58a8zIecPw'},
  {id:493,type:'single',answer:'A',stem:'某云上用户开通了阿里云的弹性伸缩服务以应对其业务运行过程中可能出现的流量高峰。某日，因业务需要，运维人员需要更换伸缩组内的某一台ECS的操作系统，因此需要对其进行停机，为了避免其因健康检查失败而被释放，建议运维人员采用的操作是',opts:['将该ECS实例转为备用状态，弹性伸缩不会检查处于备用状态的ECS实例健康状态，也不会释放ECS实例','将该ECS实例转为保护状态，弹性伸缩不会检查处于保护状态的ECS实例健康状态，也不会释放ECS实例','将该ECS实例转为挂起状态，弹性伸缩不会检查处于挂起状态的ECS实例健康状态，也不会释放ECS实例','将该ECS实例转加入白名单，弹性伸缩不会检查白名单内的ECS实例健康状态，也不会释放ECS实例'],exp:'您可以将暂时不使用的ECS实例转为备用状态，处于备用状态的ECS实例负载均衡权重会被置零。弹性伸缩不会检查处于备用状态的ECS实例健康状态，也不会释放ECS实例。'},
  {id:494,type:'single',answer:'C',stem:'使用阿里云OSS产品实现在线的音视频内容直播时，必须要和阿里云的产品一起配合实现。',opts:['内容分发网络CDN','负载均衡SLB','多媒体转码服务MTS','云数据库RDS'],exp:'题目中说到“在线的音视频内容直播”就需要用到多媒体转码服务MTS服务。'},
  {id:495,type:'single',answer:'D',stem:'弹性伸缩（AutoScaling',opts:['MNS主题','MNS队列','OOS模板','OSS主板'],exp:'生命周期挂钩被触发时，通过指定的方式发出通知或者自动执行更多操作。支持的选项如下： MNS主题：您需要继续选择MNS主题。 MNS队列：您需要继续选择MNS队列。 OOS模板：您需要继续选择OOS模板。 MNS主题和MNS队列支持填写通知标识。弹性伸缩每次推送消息到通知对象时，会同时发送您预先指定的通知标识，便于管理和标记不同类别的通知信息'},
  {id:496,type:'single',answer:'A',stem:'阿里云的云盾态势感知能从多个维度监控用户云上资源的安全状况，包括网络层、主机层、数据库层、应用层，甚至还提供安全情报功能，目前态势感知可以通过方式向用户发送报警信息。',opts:['包括手机短信和电子邮件','只有手机短信','只有电子邮件','包括手机短信、电子邮件和旺旺'],exp:'目前态势感知（现已改名为云安全中心）的告警设置仅支持：短信、邮件、钉钉机器人、站内信。目前不支持旺旺告警，参考链接：https://help.aliyun.com/document_detail/111648.html'},
  {id:497,type:'single',answer:'A',stem:'下列哪个阿里提供的操作系统是自带图形化界面的？',opts:['windows server2008','OpenSUSE','Ubuntu','CentOS'],exp:'Linux系列的系统大部分是不带图形界面的，windows server目前是默认带图形化界面。'},
  {id:498,type:'single',answer:'D',stem:'某企业基于阿里云的产品构建了在线电子商务系统，系统每天产生大量的交易日志都上传到标准存储类型的对象存储OSS上，平均每天300G，架构师小赵发现超过1年的日志很少有进一步处理的需求，仅仅是一个备份。基于这种情况小赵可以采取手段降低日志存储的成本。',opts:['把数据存储到本地','把数据存储到RDS','把数据存储到ECS','转化OSS存储类型为归档存储'],exp:'对于不经常访问的可以选择对象存储的归档存储方式'},
  {id:499,type:'single',answer:'D',stem:'阿里云的云盾态势感知用大数据分析技术，按攻击者的视角来建立安全防御体系，颠覆了传统单一的入侵和漏洞检测，让用户对安全“可见、可控、可管”。以下关于态势感知功能的描述错误的是',opts:['可以发现webshell,恶意病毒攻击','利用大数据,可对高级攻击者使用的0day漏洞攻击进行防御','实时捕捉云服务器ECS实例中的网络连接,利用情报信息做异常识别,发现僵尸网络','是一个针对阿里云服务器ECS的托管服务'],exp:'态势感知是对云上资产的诊断服务，服务器安全托管服务才是对ECS的托管。参考链接：https://help.aliyun.com/document_detail/73743.html'},
  {id:500,type:'single',answer:'C',stem:'负载均衡通过设置虚拟服务地址，将添加的ECS实例虚拟成一个高性能、高可用的应用服务池，并根据转发规则，将来自客户端的请求分发给云服务器池中的ECS实例。下列关于SLB转发规则说法错误的是？',opts:['SLB支持“轮询模式”转发规则','SLB支持“最小连接数模式“转发规则','SLB四层流量走默认路由','一般情况下，默认路由在有内网的情况下，先走内网，无内网再走外网'],exp:'SLB转发规则主要指调度算法，如轮询和最小连接数，故A、B正确。四层（TCP/UDP）流量由负载均衡器直接转发至后端ECS实例，不依赖于默认路由，因此C错误。D描述的是网络默认路由的一般行为，并非SLB转发规则的内容'},
  {id:501,type:'single',answer:'A',stem:'在使用阿里云弹性伸缩百(AutoScaling)时如果在伸缩组中指定了RDS实例，伸缩组会自动将加入伸缩组的ECS实例的内网IP添加到指定的RDS实例的访问白名单当中，下面说法错误的是？',opts:['如果ECS实例无法加入到RDS访问白名单，该ECS实例不会被回滚操作并释放','指定的RDS实例必须是运行中状态。','指定的RDS实例访问白名单的IP个数不能达到上限。','伸缩组创建成功后，伸缩组不会立即生效，只有启用伸缩组，才能接受伸缩规则的触发和执行相关的伸缩活动。'],exp:'题目问的是描述错误的选项，如果弹性伸缩的ECS实例无法加入到RDS访问白名单，自动创建的ECS会被回滚和释放。手动创建的ECS不会被回滚和释放。[https://help.aliyun.com/document_detail/25915.html]，参考链接：https://help.aliyun.com/document_detail/25936.html'},
  {id:502,type:'single',answer:'B',stem:'由于业务的流量增长，您需要对您的阿里云的云服务ECS实例的带宽进行临时升级操作，以下的描述中错误的是',opts:['可以按天进行升级，升级后如果云服务器ECS续费，仍然按照原基础带宽进行续费','不支持按天升级，升级之后按升级之后的带宽进行续费','可以在当前生命周期内，设定时间段区间内临时增加带宽','可以多次叠加操作，支持随时操作，不受任何操作影响'],exp:'1. 带宽临时升级是支持按天升级的，2. 因为带宽升级时间最多只能升级到ECS的到期时间，所以在升级之后的续费还是按照升级前的带宽进行续费的。'},
  {id:503,type:'single',answer:'A',stem:'在云安全中心，有些合法程序、正常行为会被识别成安全威胁或告警事件，针对该场景，云安全中心提供了的功能，开启后云安全中心将不再提示该告警。',opts:['添加白名单','添加黑名单','告警收敛','态势感知'],exp:'合法程序或正常行为被误判为安全威胁时，可通过添加白名单功能将相关程序或行为纳入可信列表，系统将不再对该类内容产生告警。白名单机制是云安全中心用于排除误报的核心功能，直接实现告警过滤。黑名单用于阻断恶意对象，告警收敛用于合并相似告警，态势感知用于整体风险可视化，均不适用于永久忽略特定合法行为的场景。'},
  {id:504,type:'single',answer:'A',stem:'某全球性访问论坛使用对象存储服务OSS存储论坛的静态资源，并使用了CDN服务实现资源的就近访问，但该用户发现论坛的下载文件速度大幅提升，部分客户会因数据传输距离较远上传文件速度很慢，造成了不好的访问体验。为提升该论坛用户上传文件的速度，让不同地域的用户都能有很好的访问体验，为提升该论坛用户上传文件的速度，让不同地域的用户都能有很好的访问体验，建议该论坛',opts:['开启OSS服务的传输加速服务','开通CDN加速服务','开通不同地域的OSS服务作为文件存储，不同地域OSS之间通过跨区域复制功能实时同步数据','开通OSS服务静态网站托管'],exp:'题目核心诉求是解决全球用户上传文件速度慢的问题。CDN主要用于静态资源下载加速（选项B已使用），对上传无帮助。选项C虽然通过多地域OSS存储可实现就近上传，但需要自行搭建地域路由逻辑且实时同步成本高。选项A的OSS传输加速服务专门优化全球传输链路，通过就近接入点+智能路由技术实现上传加速，无需额外开发维护，是阿里云官方推荐的标准解决方案'},
  {id:505,type:'single',answer:'C',stem:'VPC实例的状态变为之后，表示VPC创建成功，可以进行下一步的管理操作。',opts:['Standby','Running','Available','Inavailable'],exp:'VPC没有runing状态，目前只有Pending配置中和Available，可用两种状态。'},
  {id:506,type:'single',answer:'B',stem:'网络安全是一项系统工程，必须从整体上采取措施。阿里云为用户提供全方位的安全服务，其中，堡垒机是云盾提供的一个核心系统运维和安全审计管控平台，堡垒机的功能不包括',opts:['权限控制','实人认证','高效运维','操作审计'],exp:'堡垒机是云盾提供的核心运维安全管控平台，主要功能包括权限控制、高效运维和操作审计，用于集中管理用户访问权限、记录操作行为并提升运维效率。实人认证属于身份核验服务，通常由身份认证平台或人脸识别系统提供，并非堡垒机的核心功能范畴。'},
  {id:507,type:'single',answer:'C',stem:'对象存储服务0SS是一种海量、安全、低成本、高可靠的云存储服务，适合存放任意类型的文件。容量和处理能力弹性扩展，多种存储类型供选择，全面优化存储成本。对象存储OSS中的低频访问存储类型适合保存类型的数据。',opts:['每小时访问频率1—2次','每天访问频率1—2次','每月访问频率1—2次','每年访问频率1—2次'],exp:'低频访问（Infrequent Access） 提供高可靠性、较低存储成本的对象存储服务。有最低存储时间（30天）和最小计量单位（64 KB）要求。支持数据实时访问，访问数据时会产生数据取回费用，适用于较低访问频率（平均每月访问频率1到2次）的业务场景。提供低频访问-本地冗余（LRS）和低频访问-同城冗余（ZRS）两种数据冗余存储方式。 低频访问-本地冗余（LRS） 采用数据冗余存储机制，将每个对象的不同冗余存储在同一个区域内多个设施的多个设备上，确保硬件失效时的数据可靠性和可用性。 低频访问-同城冗余（ZRS） 采用多可用区（AZ）机制，将用户的数据分散存放在同一地域（Region）的3个可用区。当某个可用区不可用时，仍然能够保障数据的正常访问。 参考链接： https://help.aliyun.com/document_detail/51374.html?spm=a2c4g.11186623.6.617.424a5c5chdi6sU'},
  {id:508,type:'single',answer:'A',stem:'阿里云的云盾加密服务采用机制来保证密钥的安全。',opts:['符合国家密码管理局要求的算法','符合银监会对密钥强度的要求','防篡改硬件密码机','国际通用密码算法'],exp:'加密服务是云上的数据安全加密解决方案。服务底层使用经国家密码管理局检测认证的硬件密码机。密码机的关键还是加密算法，题目主要问的是机制，所以选择国家密码管理局检测认证的加密算法。'},
  {id:509,type:'single',answer:'A',stem:'某企业使用公有云的云服务器进行文件处理，出于改善性能的考虑，将正在使用的1核2G云服务器的配置提升至2核8G，这种操作在云计算中被称为',opts:['垂直扩展','自动扩展','水平扩展','资源编排'],exp:'题目中说的是升级ECS的配置，所以称之为垂直扩展，假如是通过弹性伸缩来完成的拓展，称之为水平扩展。'},
  {id:510,type:'single',answer:'D',stem:'某用户在使用云服务器ECSLinux实例时发现，在重启系统后会出现数据盘分区丢失或者数据丢失的问题，这可能是因为该用户未在etc/fstab文件里设置自动挂载。此时，您可以先手动挂载数据盘分区。如果手动挂载时报分区表丢失，建议其采用的操作方法不包括以下哪一项？',opts:['通过fdisk恢复分区','通过testdisk恢复分区','通过testdisk直接恢复数据','通过Disk Genius直接恢复数据'],exp:'如果手动挂载时报分区表丢失，您可以尝试如下三种办法进行处理： 1、通过fdisk恢复分区 2、通过testdisk恢复分区 3、通过testdisk直接恢复数据参考链接：https://help.aliyun.com/document_detail/52046.html'},
  {id:511,type:'single',answer:'A',stem:'负载均衡服务健康检查机制的引入，有效提高了业务服务的可用性，但健康检查的状态可能影响到前端客户端的访问请求结果。以下哪一项会导致前端访问请求失败？',opts:['目标ECS异常，处于健康检查失败时间窗','目标ECS健康检查失败','目标ECS健康检查成功','目标ECS无异常，处于健康检查成功时间窗'],exp:'如果目标ECS存在异常，正处于健康检查失败时间窗，而健康检查还未达到检查失败判定次数(默认为三次)，则相应请求还是会被分发到该ECS，进而导致前端访问请求失败。'},
  {id:512,type:'single',answer:'C',stem:'某视频直播公司采用阿里云弹性伸缩ESS来实现动态增加或者减少云服务器ECS实例，以应对业务量的变化。由于该公司系统刚上线不久，没有历史数据做参考，同时也不能预估业务量的变化，他们希望通过ECS实例资源的使用情况（比如CPU利用率、系统负载Load等）来弹性伸缩计算资源。您建议他们选择以下哪种伸缩模式？',opts:['固定数量模式','定时模式','动态模式','lazy模式'],exp:'因为题目中的场次是弹性伸缩且没有任何历史数据作为参考，即无法确定需要伸缩的ECS的数量。所以本题是动态模式最合适。'},
  {id:513,type:'single',answer:'A',stem:'［基于隧道技术和（）技术，阿里云的研发在硬件网关和自研交换机设备的基础上实现了VPC产品。',opts:['SDN','CDN','GRE','Overlay'],exp:'本题单选正确答案为A。A（SDN）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:514,type:'single',answer:'C',stem:'云计算最大的优势在于弹性与灵活性。阿里云的弹性体现在纵横扩展的弹性、存储的弹性、网络的弹性以及对于业务架构重新规划的弹性，普通IDC模式下，很难做到对单台服务器进行变更配置。而对于阿里云，（）的弹性能支持购买云服务器ECS或者存储的容量后，可以根据业务量变化自由变更配置。',opts:['存储','网络','纵向','横向'],exp:'阿里云服务器或者存储支持纵向进行提高配置或者扩充容量。'},
  {id:515,type:'single',answer:'A',stem:'某创业初期的企业，计划购买云数据库RDS来提供稳定和高效的数据存取服务，希望能以尽量低的成本进行使用，则实例是最佳选择。该实例打破固定资源付费的模式，做到真正负载与资源动态匹配的按量付费，可节省大量成本。',opts:['RDS MySQL Serverless','RDS节省计划','RDS资源包','RDS MySQL共享规格'],exp:'需要定时处理任务、业务波动大、全托管或希望完全免运维的场景，请选择Serverless。好处是：打破固定资源付费的模式，做到真正负载与资源动态匹配的按量付费，可节省大量成本。参考链接：https://help.aliyun.com/document_detail/53729.html'},
  {id:516,type:'single',answer:'D',stem:'弹性伸缩是根据业务需求和策略，经济地自动调整弹性计算资源的管理服务，容器服务ACK中也广泛采用的弹性伸缩功能进行业务弹性。弹性伸缩分为调度层弹性和资源层弹性两个维度，其中调度层弹性的组件内置在Kubernetes中，面向在线业务，适用于Deployment、StatefulSet等实现scale接口的对象。',opts:['Elastic-Workload','容器垂直伸缩（VPA）','容器定时伸缩（CronHPA）','容器水平伸缩（HPA）'],exp:'HPA 适用于 Deployment、StatefulSet 等实现 scale 接口的对象，不适用于无法扩缩的对象，例如 DaemonSet 资源。Kubernetes 内置有 HorizontalPodAutoscaler 资源，通常是对需要配置水平自动伸缩的 Workload 创建一个 HorizontalPodAutoscaler 资源，Workload 与 HorizontalPodAutoscaler 相对应 。'},
  {id:517,type:'single',answer:'C',stem:'某电商企业的业务网站，在大型促销秒杀时，系统整体访问压力非常大，一般的数据库根本无法承载这样的读取压力，于是选择了阿里云云数据库Redis版作为数据库系统使用。使用时需要先创建Redis实例，设置白名单，然后通过连接地址连接Redis实例，下列关于连接地址说法正确的是',opts:['默认提供 专有网络 或经典网络的连接地址，直连地址和公网连接地址需要手动申请','云数据库Redis版实例的VIP地址在服务维护或者变动时保持不变','通过公网连接Redis实例会产生阿里云流量费用','云数据库Redis只支持私网访问'],exp:'本题单选正确答案为C。C（通过公网连接Redis实）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:518,type:'single',answer:'A',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。在OSSBucket中，所有元素都是以（）形式被存储。',opts:['object','key','value','Bucket'],exp:'Bucket中所有元素都是以对象(也可以叫文件、Object)来存储的。参考链接：https://help.aliyun.com/document_detail/31817.html'},
  {id:519,type:'single',answer:'A',stem:'在使用容器服务ACK时可通过节点池更方便地对节点进行分组管理。节点池是集群中具有相同配置的一组节点，节点池可以包含一个或多个节点。下列关于节点池说法正确的是',opts:['在删除节点池前，需清空节点池内所有节点','创建和升级节点池会导致集群短暂中断','每个集群仅可以创建一个节点池','创建节点池后，可以编辑节点池开启自动弹性伸缩功能'],exp:'在删除节点池前，您需清空节点池内所有节点。 https://help.aliyun.com/document_detail/197279.html(https://help.aliyun.com/document_detail/197279.html)'},
  {id:520,type:'single',answer:'A',stem:'阿里云OSS图片处理服务(Image Service)是阿里云OSS对外提供的图片处理服务。用户将原始图片上传保存在OSS上，通过简单的RESTful接口，可以在任何时间、任何地点、任何互联网设备上对图片进行处理。以下有关OSS图片处理服务说法中，哪项是正确的？',opts:['处理的图片是OSS用户上传到Bucket里的Object','其它答案都正确','处理完的图片会保存在OSS中','可以处理来自于阿里云OSS以外的图片'],exp:'图片处理第一步就是需要将图片上传到用户指定的Bucket，所以处理图片是基于Bucket里面的图片文件来处理的。处理完的图片并不会保存到OSS，而是直接返回给请求的用户。参考链接：https://help.aliyun.com/document_detail/44686.html'},
  {id:521,type:'single',answer:'B',stem:'用户需要快速创建多个ECS实例，这些实例的密钥对、RAM角色、实例类型和网络设置全部一致，为了方便快速的创建这些ECS实例，我们可以通过创建（）来实现。',opts:['弹性供应','实例启动模板','镜像','快照'],exp:'创建实例启动模板是一项持久化ECS实例配置的功能，可用于快速创建实例。实例启动模板中包含了用于创建实例的配置信息，可以存储除了密码以外的任意配置信息，包括密钥对、RAM角色、实例类型和网络设置等。参考链接：https://help.aliyun.com/document_detail/112390.html'},
  {id:522,type:'single',answer:'D',stem:'题干：某大型企业客户将关键业务系统部署在阿里云上，使用弹性伸缩服务应对不可预测的流量高峰。该客户发现，由于阿里云不同区域的资源种类、资源数目是有限的、动态变化的，在使用弹性伸缩服务进行动态扩展时，有可能出现因资源不足而扩展失败的情况，为了尽可能避免这种情况，建议运维人员采用以下哪项操作？',opts:['选择多个地域创建ECS，加入同一伸缩组','选择多个地域创建伸缩组，关联同一个SLB实例','为伸缩活动设置报警策略，当收到伸缩活动失败的报警时，手动创建ECS实例','在伸缩配置中设置多个实例规格，当特定实例规格库存不足时，会切换到至备选实例规格，提高弹性扩张的成功率'],exp:'缩配置中支持选择多个实例规格，当某个实例规格库存不足时，可以自动使用其他实例规格创建ECS实例，提高弹性扩张的成功率。参考链接：https://help.aliyun.com/document_detail/25890.html'},
  {id:523,type:'single',answer:'A',stem:'关于用户使用阿里云专有网络VPC产品的费用，以下说法中，哪一项是错误的？',opts:['VPC中使用的弹性公网IP是免费的','专有网络VPC是一个免费的网络容器','交换机是免费的','路由器是免费的'],exp:'弹性公网IP，即EIP是按照流量或者带宽收费，非免费。'},
  {id:524,type:'single',answer:'D',stem:'［云服务器ECS持续提供多种服务器规格，解决用户的多种业务需求。某公司计划采用云服务器ECS部署SQLServer数据库，最推荐其使用以下哪种云盘？',opts:['高效云盘','普通云盘','SSD云盘','ESSD云盘'],exp:'本题单选正确答案为D。D（ESSD云盘）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:525,type:'single',answer:'B',stem:'如果在配置阿里云的负载均衡SLB实例的监听时，开启了“获取真实访问IP”，针对七层服务可以通过http头部中的（）字段获取来访者真实IP。',opts:['Etag','X-Forwarded-For','Authorization','Connection'],exp:'在负载均衡SLB中，可以通过X-Forwarded-For的方式获取访问者真实IP。参考链接：https://help.aliyun.com/document_detail/100972.html'},
  {id:526,type:'single',answer:'B',stem:'某企业使用负载均衡SLB将用户的访问请求分发到多台云服务器ECS实例上，同时为了应对业务波动带来的计算资源需求的变化，选用了阿里云弹性伸缩(Auto Scaling)对后端云服务器ECS实例进行动态的添加或者删除。基于对业务状况的判断，他们定义了两种伸缩模式的任务，一种是定时任务，即在指定的时间点执行伸缩活动，另一种是报警任务，即根据云监控的返回信息自动触发伸缩活动。1假设在某一时间点，定时任务和报警任务同时满足执行条件，以下哪项是正确的？',opts:['同时只会有一个伸缩活动执行，定时任务触发的伸缩活动优先执行','同时只会有一个伸缩活动执行，两种任务并没有优先级的区分','两个伸缩活动同时执行','同时只会有一个伸缩活动执行，报警任务触发的伸缩活动优先执行'],exp:'两者是没有优先级之分，两个同时触发会随机执行。请以我们的答案为准。这个答案我们都是确认过的，所以不用质疑哦，这个暂时没有官方文档释义支持。'},
  {id:527,type:'single',answer:'A',stem:'某创业团队基于阿里云的产品构建了一个网盘应用，允许用户通过Web方式进行文件的上传和下载。当前版本的实现方式是所有文件都保存在多台云服务器ECS实例的数据盘上。随着业务量的增长，ECS实例的数量也同步增加，系统运维成本越来越高。如果用户开通阿里云的（）产品与ECS实例搭配，可以很好地降低运维成本。',opts:['阿里云对象存储OSS','关系型云数据库RDS','内容分发网络CDN','负载均衡SLB'],exp:'阿里云对象存储OSS（ObjectStorageService）是一款海量、安全、低成本、高可靠的云存储服务，可提供99.9999999999%（12个9）的数据持久性，99.995%的数据可用性。多种存储类型供选择，全面优化存储成本。'},
  {id:528,type:'single',answer:'D',stem:'智能接入网关SAG是阿里云提供的软件定义广域网SD-WAN解决方案。企业可通过智能接入网关实现一站式接入阿里云，获得更加智能、安全和可靠的上云体验。SAG包含多种产品形态，如果想将电脑、手机等终端设备一键上云，可选择',opts:['硬件CPE设备形态','镜像vCPE形态','小程序形态','App形态'],exp:'智能接入网关SAG（Smart Access Gateway）APP是智能接入网关的软件客户端形态，您在电脑、手机等移动终端安装SAG APP客户端后，可一键连接企业内网。 https://help.aliyun.com/document_detail/108541.html(https://help.aliyun.com/document_detail/108541.html)'},
  {id:529,type:'single',answer:'C',stem:'购买的块存储无法挂载到指定的ECS上时，以下哪项是可能的原因？',opts:['该ECS已停止状态','ECS没有公网IP','购买的块存储和ECS不在同一个可用区','ECS是按量付费'],exp:'被挂载的实例和云盘在同一个可用区。 被挂载的实例的状态为运行中(Running)或者已停止(Stopped)，不能为已锁定(Locked)。 云盘的状态为待挂载(Available)。 您的账号不欠费。'},
  {id:530,type:'single',answer:'B',stem:'某游戏公司将业务部署在云服务ECS上，该游戏每天18:00~22:00存在业务高峰期，需要新增1台指定规格的ECS实例来满足业务需求。此时可以选择弹性伸缩AS来实现，需要通过操作来实现该场景操作配置。',opts:['创建伸缩组，创建伸缩配置，创建伸缩规则，创建报警任务','创建伸缩组，创建伸缩配置，创建伸缩规则，创建定时任务','创建伸缩组，创建伸缩配置，创建伸缩规则','创建伸缩组，创建伸缩配置'],exp:'本题单选正确答案为B。B（创建伸缩组，创建伸缩配置）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:531,type:'single',answer:'C',stem:'阿里云云服务器ECS提供众多实例规格族，满足不同用户、不同场景的应用，例如：通用型、计算型、突发型、共享型等。以下哪种场景不适合选用共享型实例？',opts:['开发环境','代码存储库','中大型数据库','Web应用前端机'],exp:'参考链接：https://help.aliyun.com/document_detail/108489.html'},
  {id:532,type:'single',answer:'A',stem:'一个负载均衡实例是一个运行的负载均衡服务，用来接收流量并将其分配给后端服务器。要使用负载均衡服务，必须创建一个负载均衡实例，并至少添加一个（）和两台ECS实例。',opts:['监听','数据盘','公网IP','EIP'],exp:'负载均衡只要指定监听端口就行监听流量数据。'},
  {id:533,type:'single',answer:'D',stem:'题干：27/820、阿里云对象存储OSS需要按使用付费，为了防止用户在OSS上的数据被其他人盗链而产生不必要的支出，OSS设计了防盗链功能，以下关于OSS防盗链实现机制的说法中，哪项是正确的？ 选项：',opts:['基于SSL密钥实现','基于HTTP的Authorization实现','基于IP黑、白名单机制','基于HTTP header中表头字段referer实现'],exp:'对象存储OSS的防盗链是基于HTTP或参考链接：header中包含Referer字段来实现的。参考链接：https://help.aliyun.com/document_detail/32021.html'},
  {id:534,type:'single',answer:'D',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。OSS支持对网页或者移动应用进行静态和动态资源分离，同时可以与（）产品结合，提供加速服务。',opts:['专有网络 VPC','云服务器ECS','高性能计算 HPC','内容分发网络CDN'],exp:'题目是说到了加速服务。所以需要通过内容分发网络CDN来实现。参考链接：https://help.aliyun.com/document_detail/123226.html'},
  {id:535,type:'single',answer:'C',stem:'创建专有网络后，可以通过创建（）为专有网络划分一个或多个子网，云资源必须部署在其中。',opts:['路由表','路由器','交换机','路由条目'],exp:'创建专有网络后，您可以通过创建交换机为专有网络划分一个或多个子网。同一专有网络内的不同交换机之间内网互通。参考链接：https://help.aliyun.com/document_detail/34217.html'},
  {id:536,type:'single',answer:'D',stem:'假设网络管理员需要随时随地通过公网对阿里云专有网络VPC下的多台云服务器ECS实例进行管理，要求提升安全性的同时降低成本，可以通过以下哪种方式实现？',opts:['修改VPC的安全组策略，允许公网的访问','其他答案都不对','为每一台云服务器ECS实例绑定一个EIP，登录各个云服务器ECS实例进行管理','在VPC内选择一台云服务器ECS实例作为堡垒机，申请一个EIP绑定到该ECS实例，通过该堡垒机进行其他云服务器ECS实例的管理'],exp:'为某台ECS申请了EIP，则可以通过公网访问这台ECS，然后通过这台ECS管理VPC内的其他ECS实例。'},
  {id:537,type:'single',answer:'D',stem:'某视频公司的服务部署在阿里云的云服务器ECS上，春晚或每周五热门节目来临时，访问量突',opts:['专有网络VPC','对象存储OSS','表格存储','弹性伸缩Auto Scaling'],exp:'题目中要求需要解决，春晚或每周五服务器压力比较大的问题，但是又不想长期采购云服务器ECS，所以可以通过弹性伸缩来解决上述问题。'},
  {id:538,type:'single',answer:'C',stem:'不同VPC内的ECS实例因为所在的（）不同，本身处于两个不同的路由平面，所以不同VPC内的ECS实例无法进行通信，天然地进行了隔离。',opts:['交换机','转发ID','隧道ID','路由器'],exp:'不同VPC内的ECS实例由于所在的隧道ID不同，本身处于两个不同的路由平面，因此不同VPC内的ECS实例无法进行通信，天然地进行了隔离。参考链接：https://help.aliyun.com/document_detail/34221.html'},
  {id:539,type:'single',answer:'D',stem:'阿里云提供了多种多样的ECS供用户选择，某用户希望能够选择最适合自己的ECS，其需要考虑的因素不包括以下哪一项？',opts:['价格','地理位置','应用场景','宿主机配置'],exp:'用户无需了解宿主机配置，其购买的云服务属于分布式，宿主机出现问题也会自动在其他主机上运行。'},
  {id:540,type:'single',answer:'C',stem:'您拥有香港地域可用区A、华北1（青岛）地域可用区B和华南1（深圳）可用区B的云服务器ECS实例，现在希望通过购买新的块存储挂载到已有的云服务器ECS实例上进行磁盘空间的扩容，肯定不能购买买O可用区的块存储。',opts:['香港地域可用区A','华南1（深圳）地域可用区B','华北1（青岛）地域可用区A','华北1（青岛）地域可用区B'],exp:'挂载数据盘需要被挂载的实例和云盘在同一个可用区。参考链接：https://help.aliyun.com/document_detail/25446.html'},
  {id:541,type:'single',answer:'C',stem:'专有网络VPC可通过网络ACL功能进行网络访问控制，用户可以自定义设置网络ACL规则，并将网络ACL与交换机绑定，实现对交换机中云服务器ECS实例流量的访问控制。关于网络ACL说法正确的是',opts:['网络ACL可以控制流入和流出ECS实例的数据流','ECS实例所属的交换机可以绑定多个网络ACL','网络ACL返回数据流必须被规则明确允许','网络ACL执行规则前，会评估所有规则'],exp:'网络ACL，返回数据流状态 无状态：返回数据流必须被规则明确允许。https://help.aliyun.com/document_detail/116626.html'},
  {id:542,type:'single',answer:'A',stem:'阿里云负载均衡服务SLB支持用户可以同时设置实例维度上的“后端服务器”、监听维度上的“虚拟服务器组”和“转发规则”，那么当用户流量经过负载均衡某端口时，关于SLB判断流量转发的顺序，以下说法哪一项是正确的？',opts:['先判断其是否能够匹配上某条“转发规则”，如果匹配，则将流量转发到该规则的后端服务器组上','支持用户同时在这三个维度上的设置，但三者添加的服务器之间有约束关系，所以无需考虑转发顺序','先判断是否有实例维度上的“后端服务器”，如果存在，那么即将流量转发到实例级别添加的各后端服务器中','先判断该监听上是否设置了“虚拟服务器组”，如何设置，那么将流量转发到该虚拟服务器组上；'],exp:'注意以下描述的首先和其次的顺序:当用户流量经过负载均衡某端口时，我们首先判断其是否能够匹配上某条“转发规则”，如果匹配，则将流量转发到该规则的后端服务器组上；若不匹配并且在该监听上设置了虚拟服务器组，那么将流量转发到该虚拟服务器组上；若用户没有在该监听上设置虚拟服务器组，即将流量转发到实例级别添加的各后端服务器中。'},
  {id:543,type:'single',answer:'B',stem:'某在线考试网站提供在线的认证考试服务，用户登录网站后，需要在120分钟时间内完成答卷。该网站使用了阿里云的云服务器ECS以及负载均衡SLB等实例，上述场景中，如果要保持120分钟之内用户和服务器之间的连接不间断，可以通过负载均衡SLB的（）功能实现。',opts:['会话同步','会话保持','弹性自愈','加权轮询'],exp:'本题单选正确答案为B。B（会话保持）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:544,type:'single',answer:'A',stem:'阿里云弹性伸缩ESS可以设置定时任务增加或减少ECS实例，如果多个定时任务在相近的时间内触发执行同一个伸缩组的伸缩规则，以下哪项说法是正确的？',opts:['最早触发的定时任务会先执行伸缩活动,排在后面的定时任务会在LaunchExpirationTime内自动重试定时触发','会选取最近创建的定时任务执行，排在后面的定时任务则会取消','会选取最早创建的定时任务执行，排在后面的定时任务会在LaunchExpirationTime内自动重试定时触发','多个定时任务不分先后将同时执行'],exp:'如果多个定时任务在相近的时间内触发执行同一个伸缩组的伸缩规则，则最早触发的定时任务会先执行伸缩活动。，排在后面的定时任务会在LaunchExpirationTime内自动重试定时触发。参考链接：https://help.aliyun.com/document_detail/25957.html'},
  {id:545,type:'single',answer:'B',stem:'某金融企业的线上业务系统经常遭受各类网络攻击，在使用内容分发CDN进行加速时，担心节点被攻击会影响正常用户的访问及安全问题，此时可选择来同时兼顾站点性能、网站安全以及内容安全。',opts:['PCDN','SCDN','边缘节点服务ENS','DCDN'],exp:'互联网金融类网站多为线上业务系统，线上业务的安全性和稳定性是用户选择服务的重点。金融数据也是恶意爬虫攻击的首要对象，站点性能、网站安全以及内容安全需要同时兼顾。https://help.aliyun.com/document_detail/63600.html'},
  {id:546,type:'single',answer:'B',stem:'某企业运维人员在使用云服务器ECS时发现云服务器ECS支持通过多种方式连接实例，包括Workbench、VNC和第三方客户端工具。如果某ECS实例误开启了防火墙，导致网络访问异常，此时最好使用哪种方式登录ECS实例进行网络配置问题的排查',opts:['阿里云客户端','VNC','Workbench','第三方客户端工具'],exp:'本题单选正确答案为B。B（VNC）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:547,type:'single',answer:'B',stem:'如果ECS实例发生了实例自动恢复事件，例如物理机非预期宕机或进行运维，阿里云默认自动重启恢复实例。用户可以通过修改实例维护属性，自定义实例自动恢复方式。如果实例挂载了本地盘，用户可选择的恢复方式不包括以下哪一种？',opts:['自动重新部署','部分重启恢复','自动重启恢复','禁止重启恢复'],exp:'阿里云默认自动重启恢复您的ECS实例，并且支持自定义恢复方式，自动重启恢复，禁止重启恢复 ，自动重新部署。参考链接：https://help.aliyun.com/knowledge_detail/57052.html'},
  {id:548,type:'single',answer:'C',stem:'「企业云管理员在初次使用云服务器ECS时，可以基于ECS管理控制台的ECS实例创建向导，逐步',opts:['为云盘开启自动备份','分配公网IPv4地址','自行为实例挂载本地盘','批量购买多台ECS实例'],exp:'本地盘只能用作数据盘，且不支持自行为实例挂载本地盘。https://help.aliyun.com/document_detail/87190.html'},
  {id:549,type:'single',answer:'A',stem:'某行业大牛的个人博客只有一些静态页面，他想用最经济便捷的方式将网站部署在阿里云上，另外，由于很多浏览器将没有使用HTTPS协议的网站全部标记为不安全，他想要为网站开启HTTPS协议支持。根据该用户的情况，您最推荐以下哪一种阿里云方案？',opts:['使用对象存储OSS存储网站静态页面，绑定自定义域名，并开启证书托管','使用云服务器ECS和负载均衡SLB部署网站，将SSL证书托管在SLB上','使用云服务器ECS部署博客网站，并在ECS中部署SSL证书','使用虚拟主机部署博客网站，并在虚拟主机中部署SSL证书'],exp:'OSS具有静态网站访问功能，可以直接绑定域名托管SSL即可。参考链接：https://help.aliyun.com/document_detail/67323.html'},
  {id:550,type:'single',answer:'C',stem:'某企业应用管理员想在阿里云云服务ECS上搭建一个业务系统，该业务平时CPU使用率很低，但偶尔有突发高CPU使用率的需求。该管理员希望从整体业务角度分配计算资源，将业务平峰期的计算能力转移到高峰期使用，以节约使用成本，此时可购买满足业务需求。',opts:['抢占式实例','共享型实例','突发性能实例','按量付费实例'],exp:'通过CPU积分，您可以从整体业务角度分配计算资源，将业务平峰期的计算能力转移到高峰期使用，以节约使用成本。https://help.aliyun.com/document_detail/59977.html'},
  {id:551,type:'single',answer:'A',stem:'小王是某新闻网站的技术负责人，该网站目前部署在一台阿里云的云服务器ECS实例上。随着用户访问量的增加，小王发现用户访问网站的响应速度在变慢，通过分析发现是应用服务器的Web会话数量太多且CPU利用率超过75%。为了快速缓解该应用服务器的压力，您认为应采取以下哪项操作？',opts:['增加一台云服务器ECS实例，并采用负载均衡SLB进行负载分担','采用云数据库RDS进行新闻数据存储','采用对象存储OSS进行内容的存储','采用专有云VPC提升运维效率'],exp:'划重点:应用服务器的CPU利用率超过75%，所以需要增加ECS来减轻这台服务器的压力，同时需要通过负载均衡SLB来实现他们的负载分担。'},
  {id:552,type:'single',answer:'B',stem:'在使用ECS时更换操作系统是通过更换实例的系统盘实现的。在更换系统盘的过程中，以下哪项参数是可以修改的？',opts:['内网IP','镜像','安全组','区域'],exp:'更换系统可以进行更换镜像文件'},
  {id:553,type:'single',answer:'C',stem:'企业数据中心的发展经历了自建数据中心、IDC托管和购买云服务几个阶段，相比于自建IDC，云计算在业务模式、交付效率、经济性、便利性等方面都更具优势，以下不属于云计算优势的是',opts:['可在几分钟内交付计算实例，缩短交付周期','可按量计费，注重衡量成本/效率/可用性之间的平衡','用户不需要考虑云上安全，不参加任何安全管理工作','用户不再需要维护和管理硬件'],exp:'用户不需要考虑云上安全，不参加任何安全管理工作是错误的。'},
  {id:554,type:'single',answer:'D',stem:'在使用云服务器ECS时要考虑地域和可用区的选择。地域指数据中心所在的地理区域，通常按照数据中心所在的城市划分。可用区是指在同一地域内，电力和网络互相独立的物理区域。关于地域和可用区，下列说法正确的是',opts:['不同地域的资源价格是完全一样的','购买阿里云资源时需要选择部署地域，资源创建或购买成功后可以随时更换地域','购买阿里云资源时需要选择部署的可用区，资源创建或购买成功后可以随时更换可用区','需要较高的容灾能力的应用，可以将实例部署在同一地域的不同可用区内，实例之间之间可内网互通'],exp:'实例创建后地域及可用区不可修改。'},
  {id:555,type:'single',answer:'C',stem:'文件存储HDFS版是面向阿里云ECS实例及容器服务等计算资源的文件存储服务，可以像在Hadoop分布式文件系统中一样管理和访问数据。下列关于文件存储HDFS版说法正确的是',opts:['初始情况下，每个阿里云账号会自动生成一个默认权限组，可以修改默认权限组进行访问控制','文件存储HDFS版支持快照操作，可以定期创建快照实现数据的备份','可以通过挂载点来访问文件存储HDFS，同一挂载点可以被多个计算节点同时挂载，共享访问。','在文件存储HDFS版中，权限组是一个黑名单机制，通过向权限组添加规则，来拒绝指定的IP或网段访问文件系统'],exp:'挂载点定义了采用怎样的权限来访问数据库文件存储（DBFS），同一个挂载点可以被多个计算节点同时挂载并进行共享访问。 https://help.aliyun.com/document_detail/89794.html(https://help.aliyun.com/document_detail/89794.html)'},
  {id:556,type:'single',answer:'B',stem:'某企业云管理员在使用云服务ECS的过程中，发现从创建实例开始到释放实例结束，实例可能处于不同的状态，这些状态组成了实例的生命周期。实例的生命周期状态不包括仅选择一个选项。',opts:['启动中','已过期','欠费回收中','已删除'],exp:'其中，弹性伸缩的目标追踪伸缩规则是在简单规则的基础上扩展出来的一种新类型伸缩规则，您可以根据需要选择一项云监控指标，并指定监控指标的目标值，弹性伸缩会自动计算所需的实例数量并进行扩缩容，从而将云监控指标更高效、更准确地维持在目标值附近。https://help.aliyun.com/document_detail/420651.html'},
  {id:557,type:'single',answer:'A',stem:'专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。在',opts:['VPN网关','安全组','RDS白名单','网络ACL'],exp:'专有网络VPC不仅可以通过网络ACL实现访问控制，还可以依赖各个云产品的访问控制能力来实现安全访问，例如云服务器ECS通过设置安全组来进行访问控制，负载均衡SLB和云数据库RDS通过白名单来进行访问控制。参考链接：https://help.aliyun.com/document_detail/65409.html'},
  {id:558,type:'single',answer:'C',stem:'云盘是阿里云为云服务器ECS提供的数据块级别的块存储产品，具有低时延、高性能、持久性、高可靠等特点。创建云盘后，用户可以在控制台对其进行管理，云盘的管理控制台直接支持的功能不包括以下哪一项?',opts:['扩容磁盘','回滚磁盘','共享磁盘','备份磁盘'],exp:'磁盘可以扩容，快照，回滚但是不支持共享'},
  {id:559,type:'single',answer:'D',stem:'某企业在阿里云上搭建了在线教育视频网站，使用了ECS+RDS+OSS+SLB+AS+CDN的产品架构。其中，在配置CDN时，希望用户点播视频能回源拉取特定内容的范围，提高缓存命中率，减少回源流量消耗和源站压力，并且提升资源响应速度。此时可通过配置实现。',opts:['回源302跟随','缓存命中率','URL预热','Range回源'],exp:'Range回源可有效提高文件分发效率,可以提高缓存命中率,减少回源流量消耗和源站压力,并且提升资源响应速度。https://help.aliyun.com/document_detail/68473.html'},
  {id:560,type:'single',answer:'C',stem:'在创建VPC和交换机时，必须以无类域间路由块(CIDR block)的形式为专有网络划分私网网段，以下关于网段划分的实践中，哪一项是错误的？',opts:['可以使用192.168.0.0/16、172.16.0.0/12、10.0.0.0/8这三个私网网段及其子网作为VPC的私网地址范围','交换机的网段的大小在16位网络掩码与29位网络掩码之间，可提供8-65536个地址。16位掩码能支持65532个ECS实例，而小于29位掩码又太小，没有意义','每个交换机的第一个和最后两个IP地址为系统保留地址。以192.168.1.0/24为例，192.168.1.0、192.168.1.254和192.168.1.255这些地址是系统保留地址','当有VPC与VPC互通或VPC与本地IDC互通的需求时，需要确保VPC的网段和要互通的网络的网段都不冲突'],exp:'交换机的网段的大小在16位网络掩码与29位网络掩码之间，可提供8-65536个地址。16位掩码能支持65532个ECS实例，而小于29位掩码又太小，没有意义。 每个交换机的第一个和最后三个IP地址为系统保留地址。以192.168.1.0/24为例，192.168.1.0、192.168.1.253、192.168.1.254和192.168.1.255这些地址是系统保留地址。'},
  {id:561,type:'single',answer:'C',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，提供公网和私网两种类型的负载均衡实例。关于公网类型负载均衡实例的IP地址，以下哪项说法是正确的？',opts:['系统会为其分配一个公网服务地址和一个私网服务地址','系统会为其分配一个弹性公网IP和一个私网服务地址','系统会为其分配一个公网服务地址','系统会为其分配一个弹性公网IP'],exp:'在您创建公网负载均衡实例后，系统会为其分配一个公网服务地址，您可以将您的域名和该公网服务地址进行绑定，对外提供服务。参考链接：https://help.aliyun.com/document_detail/85931.html'},
  {id:562,type:'single',answer:'A',stem:'云计算以多种形式对外提供服务，比如提供的服务是运行在云计算基础设施上的应用程序，消包括网络、服务器、操作系统、存储，甚至独立的应用能力等等，仅需要对应用进行有限的、特殊的配置。该服务形式属于以下哪一种？',opts:['SaaS(软件即服务)','DaaS(数据存储即服务)','IaaS(基础设施即服务)','PaaS(平台即服务)'],exp:'题目中说了是消费者通过搜客户端界面访问，提到客户端那就相当于日常使用的软件，所以选择SaaS(软件即服务)。'},
  {id:563,type:'single',answer:'C',stem:'「负载均衡的操作日志需要在三（）控制台查看。操作审计记录云账户资源操作，提供操作记录查询，并可以将记录文件保存到指定的OSS存储空间。',opts:['ConsoleSignin','RAM','ActionTrail','KMS'],exp:'参考链接：https://help.aliyun.com/document_detail/85973.html'},
  {id:564,type:'single',answer:'D',stem:'［当各地的localdns服务器接收到解析请求查询时，就会向权威DNS（例如云解析DNS）发起解析请求查询，获取到解析结果。localdns会将查询到的解析结果，保存到本地一段时间。保存的这个时间周期，根据设置而来的。',opts:['权重配置','URL转发','DNS Cache','TTL'],exp:'localdns会将查询到的解析结果，保存到本地一段时间。保存的这个时间周期，就是根据TTL设置而来的。https://help.aliyun.com/document_detail/39799.html'},
  {id:565,type:'single',answer:'B',stem:'【】（）类型的云产品，统一部署在阿里云的公共基础网络内，由阿里云统一规划和管理，更适合对网络易用性要求比较高的用户。',opts:['云上网络','经典网络','专有网络','传统网络'],exp:'经典网络类型的云产品，统一部署在阿里云公共基础设施内，规划和管理由阿里云负责，更适合对网络易用性要求比较高的用户。参考链接：https://help.aliyun.com/document_detail/61651.html'},
  {id:566,type:'single',answer:'A',stem:'文件存储CPFS是阿里云推出的全托管、可扩展并行文件系统，CPFS特有的功能可以实现将对象存储OSS中的数据合并入CPFS，进行统一命名空间的元数据管理，快速地处理OSS中的数据。',opts:['数据流动','数据迁移','协议服务','POSIX文件接口'],exp:'阿里云CPFS特有的数据流动功能可以实现将对象存储OSS中的数据合并入CPFS，进行统一命名空间的元数据管理。https://help.aliyun.com/document_detail/111755.html'},
  {id:567,type:'single',answer:'D',stem:'您希望通过管理控制台进行阿里云的专有网络VPC内的云服务器ECS实例的私网IP地址的修改，但发现操作的菜单不可用，可能是以下哪种原因引起的？',opts:['该云服务器ECS实例没有绑定EIP','该云服务器ECS实例所在的VPC类型是默认专有网络','该云服务器ECS实例不是运行状态','没有针对该云服务器ECS实例进行停止操作，且该云服务器ECS实例不是停止状态'],exp:'修改云服务器ECS的私网IP地址需要云服务器ECS处于停止的状态，所以是"没有针对该云服务器ECS实例进行停止操作，且该云服务器ECS实例不是停止状态"的原因造成的。参考链接：https://help.aliyun.com/document_detail/27733.html'},
  {id:568,type:'single',answer:'A',stem:'某企业云运维人员在使用文件存储NAS时，担心会有使用人员误操作删除NAS存储中的文件，导致数据丢失，于是开启功能，以实现文件误删除后的恢复操作。',opts:['回收站','版本控制','缓存区域','文件保护区'],exp:'开启回收站功能,被删除的文件或目录都将暂存在回收站中。当您误删除文件系统中的文件后,可以通过回收站恢复这些文件及其 UId、GId和 acL 等元数据信息。 通过灵活的备份策略生成多个备份副本数据,在发生数据丢失或受损时及时恢复文件'},
  {id:569,type:'single',answer:'A',stem:'云计算的一个显著特点是提供按需供应、按需付费的服务。所有资源以资源池的方式存在，资源类型包括网络、服务器、存储、应用和服务。以下关于资源池的说法中，哪一项是错误的？',opts:['资源池无法突破单台物理机所拥有的资源','资源池包含了多个相同类型的资源','资源池是实现计算服务化的基础','不同的资源池有不同的资源池优化方法'],exp:'资源池的解释:云计算的核心理念就是通过互联网络为用户提供按需的IT资源服务。为了达到这个目标，云服务提供商首先要保证拥有一个容量充足的资源池以满足在并发的业务高峰时刻仍能满足用户的服务要求。http://book.51cto.com/art/201202/319793.htm'},
  {id:570,type:'single',answer:'D',stem:'管理控制台是统一查看和管理阿里云产品及服务的平台。管理控制台面向阿里云用户，通过图形化界面、Cloud shell命令行工具等进行配置操作，创建云服务器ECS后，可以在控制台对其进行管理，ECS管理控制台直接支持的功能不包括以下哪一项？ 选项：',opts:['释放实例','停止实例','重启实例','迁移实例'],exp:'本题单选正确答案为D。D（迁移实例）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:571,type:'single',answer:'D',stem:'某企业基于阿里云的产品构建了在线电子商务系统，系统每天产生的大量交易日志都上传到标准存储类型的对象存储OSS上，平均每天300G，架构师小赵发现超过1年的日志很少有进一步处理的需求，仅作为备份数据。基于这种情况，小赵可以对一年前的日志文件采取以下哪种方式降低存储成本？',opts:['把数据存储到本地','把数据存储到RDS','把数据存储到ECS','转换OSS存储类型为归档存储'],exp:'对于不经常访问的可以选择对象存储的归档存储方式'},
  {id:572,type:'single',answer:'A',stem:'HTTP协议以明文方式发送内容，不提供任何方式的数据加密。HTTPS协议是以安全为目标的HTTP通道，通过SSL证书来实现加密过程。当客户端向服务器发起TLS握手请求时，需要向数字证书认证机构（CA）发送查询请求，验证证书的合法性和有效性，这会导致TLS握手效率较低，此时可通过功能实现由CDN预先缓存在线证书验证结果并下发给客户端，减少用户验证时间。',opts:['配置OCSP Stapling','配置HSTS','配置HTTPS证书','配置强制跳转'],exp:'配置OCSP Stapling,CDN:OCSP Stapling功能,可实现由CDN预先缓存在线证书验证结果并下发给客户端,无需浏览器直接向CA站点查询证书状态,从而减少用户验证时间。https://www.alibabacloud.com/help/zh/alibaba-cloud-cdn/latest/configure-ocsp-stapling'},
  {id:573,type:'single',answer:'D',stem:'某用户在阿里云上创建了包年包月类型的ECS，创建后才发现，操作系统误选为Windows(实际需要使用Linux)，以下哪项操作能最快解决该问题？',opts:['使用root用户登录ECS，重装操作系统','申请5天无理由退款，重新创建ECS','发起工单，请售后协助更换操作系统','为该ECS更换系统盘'],exp:'本题单选正确答案为D。D（为该ECS更换系统盘）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:574,type:'single',answer:'C',stem:'在使用阿里云服务器ECS时，如果业务量的变化时间可以预测，可以配合弹性伸缩的（），在业务高峰到达前准备好足量的计算资源，或者在业务高峰后释放空闲的计算资源。',opts:['健康模式','动态模式','定时模式','固定数量模式'],exp:'业务量变化时间可以预测，您可以创建定时任务，在指定时间执行指定伸缩规则，添加或减少服务器数量。'},
  {id:575,type:'single',answer:'D',stem:'用户在添加安全组规则时，必须指定通信协议、端口或端口范围，然后安全组根据允许或拒绝策略决定是否转发数据到ECS实例。某用户需要使用Xshell客户端远程连接Linux系统的ECS实例，设置的安全组规则应放行（）协议和（）端口。',opts:['SMTP， 25','Telnet， 23','HTTPS， 443','SSH， 22'],exp:'本题单选正确答案为D。D（SSH， 22）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:576,type:'single',answer:'D',stem:'阿里云弹性伸缩 (Auto Scaling)是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务，可以自动调整以下哪种参数？ 选项：',opts:['云服务器ECS实例的内存大小','云服务器ECS实例的CPU个数','云服务器ECS实例的带宽','云服务器ECS实例的个数'],exp:'弹性伸缩(AutoScaling)是横向扩展，扩展的是云服务器ECS实例的个数，云服务器ECS实例的配置是不支持伸缩的。'},
  {id:577,type:'single',answer:'C',stem:'告警管理是日志服务SLS告警子系统，负责管理告警降噪和告警事务。在进行告警管理时，可通过配置告警策略，来进行告警降噪等操作。其中可添加用于阻止由某告警引发的其他告警通知，用于禁止一段时间内的告警通知来满足特定场景需求。',opts:['告警合并，告警静默','告警抑制，告警去重','告警抑制，告警静默','告警静默，告警抑制'],exp:'告警抑制用于阻止由某告警引发的其他告警通知，告警静默用于禁止一段时间内的告警通知。https://help.aliyun.com/document_detail/290785.html'},
  {id:578,type:'single',answer:'C',stem:'用户想根据业务需求和策略设置伸缩规则，在业务需求增长时自动增加ECS实例以保证计算能力，在业务需求下降时自动减少ECS实例以节约成本，可以选用以下哪种阿里云产品实现需求？',opts:['专有网络','负载均衡','弹性伸缩','云数据库'],exp:'本题单选正确答案为C。C（弹性伸缩）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:579,type:'single',answer:'C',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，可以扩展应用系统对外的服务能力，并且可以消除单点故障提升应用系统的可用性。SLB结合（）共同使用，可以提供防DDoS攻击能力，使应用环境更安全。',opts:['先知(安全众测)','云监控','DDoS防护','云安全中心'],exp:'DDoS防护支持Web应用DDoS攻击防护，支持过滤多种flood，高频攻击等攻击，支持HTTP特征过滤、URI过滤、host过滤。参考链接：https://help.aliyun.com/document_detail/28465.html'},
  {id:580,type:'single',answer:'D',stem:'某网络公司的运维人员，购买了一台ECS服务器，并且已经进入到服务器中完成了应用软件的部署。现在他想要一台部署了同样应用的服务器，可以采用以下哪些方法来快速达到目的？ 选项：',opts:['直接购买一台新的服务器，重新部署','利用系统盘制作自定义镜像来生成一台新的服务器','寻找专业的运维人员，达到快速部署的目的','利用系统盘生成快照来制作自定义镜像之后，生成一台新的服务器'],exp:'自定义镜像只能通过系统盘快照生成，无法直接通过系统盘制作自定义镜像。'},
  {id:581,type:'single',answer:'B',stem:'SLB支持同一Region跨数据中心容灾，还可以通过与哪种服务结合支持跨Region容灾？',opts:['OCS','DNS','ECS','OSS'],exp:'SLB支持配合DNS轮询的方式支持同一Region跨数据中心容灾'},
  {id:582,type:'single',answer:'C',stem:'某些企业由于安全机制，需要在出口防火墙配置策略，以限制内部员工和业务系统只能访问指定的公网IP，但是OSS的Bucket访问IP会随机变换，导致需要经常修改防火墙策略，增加运维成本。以下哪种方式有助于解决上述问题？',opts:['OSS控制台开启反向代理访问功能','通过cli或SDK定时获取OSS的最新访问地址，通过脚本或程序更新访问IP','ECS实例上配置OSS的反向代理，实现通过固定IP地址访问OSS的存储空间','发工单询问OSS的内网IP段，加入ECS的访问白名单中'],exp:'阿里云OSS的存储空间（Bucket）访问地址会随机变换，您可以通过在ECS实例上配置OSS的反向代理，实现通过固定IP地址访问OSS的存储空间。参考链接：https://help.aliyun.com/document_detail/107023.html'},
  {id:583,type:'single',answer:'A',stem:'「小明是一个社交网站的架构师，创业初期用户量较少，每个注册客户上传的图片文件直接保存在了一台阿里云的云服务器ECS实例上。最近用户量爆增，图片存储的空间达到了3.5TB，Web服务器由原来的1台ECS实例扩展到了5台ECS实例，性能问题得到了解决，可是保存在单台ECS实例的图片无法在多台ECS之间共享读写。您认为可以选用阿里云的哪种云产品解决该问题？',opts:['对象存储OSS','负载均衡SLB','内容分发网络CDN','归档存储(Archive Storage)'],exp:'要求1：保存在ECS实例的图片在多台ECS之间共享读写； 要求2：业务图片支持随时访问； 所以只能选择对象存储OSS。'},
  {id:584,type:'single',answer:'B',stem:'网络安全是指网络系统的硬件、软件及其系统中的数据受到保护，不因偶然的或者恶意的原因而遭受到破坏、更改、泄露，系统连续可靠正常地运行，网络服务不中断。对于网络上常见的CC攻击主要破坏了网络安全的哪种特性？',opts:['保密性','可用性','完整性','不可抵赖性'],exp:'本题单选正确答案为B。B（可用性）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:585,type:'single',answer:'A',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，提供丰富的功能，满足各种业务场景的需要。某用户想要使用负载均衡SLB和云服务器ECS部署双向认证的HTTPS网站，以下哪个说法是正确的？',opts:['需要在SLB上托管服务器SSL证书和客户端CA证书','SLB只能托管SSL证书，不能托管CA证书','SLB只能托管CA证书，不能托管SSL证书','SLB目前仅支持HTTPS单向认证，暂不支持HTTPS双向认证'],exp:'要配置参考链接：:双向认证的监听，您需要在配置监听时上传服务器证书和CA证书。参考链接：https://help.aliyun.com/document_detail/85954.html'},
  {id:586,type:'single',answer:'D',stem:'某客户在阿里云购买了几台ECS实例后，为了增强应用的可用性，实现高可用架构，想要通过负载均衡实现对多台ECS实例进行流量分发的服务，以下哪项可能会造成流量分发失败？ 选项：',opts:['负载均衡SLB实例和后端提供服务的云服务器ECS实例规格配置可以不同','负载均衡SLB实例和后端提供服务的云服务器ECS实例带宽设置不同','负载均衡SLB实例和后端提供服务的云服务器ECS实例不在同一可用区','负载均衡SLB实例和后端提供服务的云服务器ECS实例不在同一地域'],exp:'本题单选正确答案为D。D（负载均衡SLB实例和后端）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:587,type:'single',answer:'A',stem:'已知在OSS服务上的存储空间test123中存有一个名为abc.png的图片文件，如果用户在相同存储空间下又上传了同名abc.png图片文件，可能出现以下哪种情况? 选项：',opts:['覆盖原有图片文件','提示用户是否确定上传同名文件','以abc(1)png保存上传文件','根据文件大小确认保留哪个图片文件'],exp:'您可以通过重复上传同名的对象来覆盖之前的对象参考链接：https://help.aliyun.com/document_detail/31827.html'},
  {id:588,type:'single',answer:'A',stem:'客户想要通过设置虚拟服务地址，将添加的同一地域的多台ECS实例虚拟成一个高性能、高可用的后端服务池，并根据转发规则，将来自客户端的请求分发给后端服务器池中的ECS实例，该功能可以使用阿里云的服务来实现。',opts:['负载均衡SLB','弹性伸缩AutoScaling','内容分发网络SDN','云数据库RDS'],exp:'本题单选正确答案为A。A（负载均衡SLB）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:589,type:'single',answer:'D',stem:'公网IP可以实现阿里云的云服务器ECS实例与Internet之间互访，下列关于云服务器ECS实例的公网IP的描述中，哪一项是错误的？',opts:['公网IP可用于不同地域的云服务器之间互访','手工修改ECS实例的公网IP后，该ECS实例的网络通信会受到影响','无论您选择何种计费方式，在购买实例的时候，您都需要选择公网带宽的使用规格','云服务器ECS实例更换系统盘时，公网IP地址也会随之变更'],exp:'更换系统盘不会导致网络层面的变更，所以公网IP不会变更。'},
  {id:590,type:'single',answer:'A',stem:'某企业使用负载均衡SLB+云服务器ECS+弹性伸缩(AutoScaling)的架构搭建网站，已经创建了伸缩组，冷却时间设置为300秒，最小ECS数设置为1，最大ECS数设置为100台，并设定了伸缩规则为每次增加1台ECS”，同时配置报警任务：“统计周期设为2分钟，，“重复几次后报服警设置为3；每当CPU使用率平均值超过60%时，触发伸缩规则定义的伸缩活动；当前伸缩组中有10台ECS实例。该网站业务在长达1小时的时间段内发生了井喷式的爆发增长，CPU的使用率会一直高于60%，这一小时期间，每两次触发报警的时间间隔最少为几分钟？',opts:['6','5','9','11'],exp:'此题考察的是:每两次触发该报警任务间隔时间。题目中的统计周期为2min，重复次数为3，所以每次报警任务的执行间隔时间是2∗3=6min，此间隔时间6min已经过了300s(即5min)的冷却时间的限制了，所以本题答案是:最少时间间隔=周期∗重复次数，即2min∗3=6min。此题经常考，需重视。'},
  {id:591,type:'single',answer:'C',stem:'阿里云内容分发网络CDN在基本配置之上为用户开放了很多优化功能，包括：页面优化、智能压缩、过滤参数、拖拽播放等。以下关于这些优化功能的描述，哪一项是错误的？',opts:['可以压缩与去除页面中无用的空行、回车等内容，有效缩减页面大小','支持多种内容格式的智能压缩，有效减少用户传输内容的大小','可以提高站点的整体安全性，防止源站服务器帐号被爆力破解','可实现视频、音频点播的随机拖拽播放功能'],exp:'提高站点的整体安全性不属于CDN性能优化的一部分，参考链接(性能优化部分) 参考链接：https://www.alibabacloud.com/help/zh/doc-detail/64935.html'},
  {id:592,type:'single',answer:'A',stem:'负载均衡提供标签管理功能，方便用户通过标签对负载均衡实例进行分类。以下关于负载均衡标签的使用限制的说法中，哪一项是错误的？',opts:['不同地域中的的标签信息互通','一个实例上的每个标签的标签键必须唯一','每个实例可以绑定的标签数量有限制','标签必须绑定在某个负载均衡实例上'],exp:'不支持未绑定实例的空标签存在，标签必须绑定在某个负载均衡实例上。 一个实例最多可以绑定10个标签。 一个实例上的每个标签的标签键必须唯一，相同标签键的标签会被覆盖。 每个地域中的的标签信息不互通，例如在华东1地域创建的标签在华东2地域不可见。'},
  {id:593,type:'single',answer:'A',stem:'某用户在云上开通了OSS服务用于存储其站点的图片资源，并且使用CDN进行内容的分发加速。该用户为了在业务中避免被盗图的风险，对于OSS服务中的公共读文件开启了原图保护，限制向外暴露图片的URL该用户开启原图保护以后，通过以下哪种访问OSS服务可能会造成原图保护失效？',opts:['通过CDN请求访问文件','直接访问OSS文件','匿名访问OSS文件','通过处理参数请求缩略图'],exp:'问题一:OSS开启了原图保护，直接访问图片文件时会正常返回403，但是通过CDN来进行请求时原图保护无效，返回200。 这种情况有可能是CDN回源到了私有Bucket，造成原图保护失效。原图保护功能仅针对匿名访问文件有效，对于带签名的访问是无效的。 问题二:开启原图保护后，通过签名后的URL可以访问原图？ 原图保护仅针对允许匿名访问的文件，使用签名URL访问图片属于非匿名访问，所以开启原图保护后，使用签名后的URL仍然可以访问原图。参考链接：https://help.aliyun.com/document_detail/54739.html'},
  {id:594,type:'single',answer:'D',stem:'阿里云云服务器ECS提供众多实例规格族，满足不同用户、不同场景的应用，某企业有一个特殊的计算任务，仅在特定的时段有较高的CPU性能需求，为了尽可能地节约成本，应该选用以下哪种实例类型？',opts:['密集计算型实例','共享型实例','通用计算型实例','突发性能型实例'],exp:'在购买企业级等类型的实例后，您拥有实例CPU的完全使用权，同时意味着无论CPU使用率是0%还是100%,您都需要为整个VCPU付费。如果您的业务场景规律，仅在特定的时段有较高的CPU性能需求，相当于在其它时段也在为未能使用的计算资源付费。这种情况下，您可以选择突发性能实例打造高性价比、经济实用的服务器。参考链接：https://help.aliyun.com/document_detail/59977.html'},
  {id:595,type:'single',answer:'C',stem:'日志服务SLS提供数据加工功能，通过编排内置的两百多个函数，使用协同消费组对日志数据进行消费，实现对日志数据的加工处理。下列关于数据加工的调度过程说法正确的是',opts:['用户没有配置任务的终点时间时，运行实例会在超时时间后退出','对每一个加工规则，加工服务的调度器每次会启动一个运行实例','当任务因为某些原因被停止，再次启动时，默认重头开始运行','每一条日志数据均通过加工规则处理后再输出'],exp:'当用户没有配置任务的终点时间时，运行实例默认不会退出，则加工任务不会停止,对每一个加工规则，加工服务的调度器会启动一个或多个运行实例。当任务因为某些原因被停止，再次启动时，默认会从上次保存的消费位置继续消费。https://help.aliyun.com/document_detail/129147.html'},
  {id:596,type:'single',answer:'C',stem:'服务器ECS支持灵活的计费方式和多种优惠机制。其中节省计划是一种折扣权益计划，可以通过承诺在一定期限内消费一定的金额，来换取较低的按量付费折扣。下列关于折扣计划的说法正确的是',opts:['在同一时间，只可以有1份处于生效状态的节省计划','节省计划支持抢占式实例','节省计划支持三种付费方式：全预付、部分预付和0预付','购买了节省计划后，不能再购买预留实例券'],exp:'节省计划付费类型:全预付,部分预付,0预付。https://help.aliyun.com/document_detail/184083.html'},
  {id:597,type:'single',answer:'A',stem:'［某视频手机应用，日均活跃用户为两百万，以下哪一项产品/产品组合可以支持用户对视频，图片，音频的大量访问？',opts:['OSS+CDN','云盾+云监控','PTS','VPC'],exp:'划重点:来解决用户对视频，图片，音频的大量访问。所以选择OSS和CDN。'},
  {id:598,type:'single',answer:'A',stem:'共享存储是指多台服务器访问（读写）同一个存储设备的同一个分区，即系统允许多个用户共享同一份文件。如阿里云的文件存储(NetworkAttached Storage,简称NAS)就提供了共享存储的服务,以下说法错误的是?',opts:['公共云计算中使用的存储都是共享存储','多个云服务器实例可以同时访问同一个共享文件系统','适合跨多个云服务器实例部署的应用程序访问相同数据来源的应用场景','支持主流的应用程序及工作负载可无缝配合使用,无需任何修改即可读写数据'],exp:'公共云计算中使用的存储并非是共享存储，而是分布式的私有存储。'},
  {id:599,type:'single',answer:'B',stem:'您在创建云服务器ECS实例的磁盘快照时，发现每次创建快照所需的时间都不同，关于该现象，以下哪项说法是错误的？',opts:['第一次给磁盘创建快照是一个全量的过程，会把整个磁盘都做成快照，所以第一次快照制作的时间比较长','磁盘快照生成的时候，磁盘本身的读写性能发生了变化','因为磁盘容量大小不同，导致快照创建的时间不同','第一次快照之后的磁盘快照是增量创建，只会对磁盘增加的数据和修改的数据做快照，所以第一次之后的快照制作的时间相对短一些'],exp:'阿里云提供的磁盘本身的读写性能是稳定的，并不会发生了变化。参考链接：https://help.aliyun.com/document_detail/25455.html'},
  {id:600,type:'single',answer:'C',stem:'某O2O网站基于阿里云的云服务器ECS、负载均衡SLB以及弹性伸缩(Auto Scaling)服务搭建了线上系统，其中ECS用来处理用户响应，SLB用来分发流量，弹性伸缩负责动态分配资源以满足突发的业务变化，三个产品配合可以提供稳定、便捷、低成本的服务。现在网站计划采用云数据库RDS服务，用来保存用户访问时产生的数据。针对此场景，以下哪项说法是正确的？',opts:['可以把RDS实例直接挂在SLB下，由SLB按照转发规则分配任务到RDS实例进行处理','对RDS实例所在的地域(Region)没有硬性规定，但是建议和弹性伸缩在同一个地域，可以减小网络传输的延迟，提升响应速度','如果在伸缩组中指定了RDS实例，则弹性伸缩会自动把伸缩组中的ECS实例的IP地址添加到RDS的白名单中去，无需手工设置','可以把RDS实例手工添加到伸缩组，RDS实例可以保存用户访问的数据'],exp:'题目问的是弹性伸缩和ECS，再配合RDS配合使用，弹性伸缩只支持ECS的伸缩，不支持其他任何云产品的伸缩，所以"可以把RDS实例手工添加到伸缩组"错误；SLB后端只能挂载ECS，不支持其他任何云产品挂载，所以"可以把RDS实例直接挂在SLB下"错误；弹性伸缩必须和RDS出于同一个地域，否则不能搭配使用，所以"对RDS实例所在的地域(Region)没有硬性规定"错误，；弹性伸缩(AutoScaling)与SLB/RDS紧密集成，可以自动管理SLB后端服务器和RDS白名单，节省操作成本。参考链接：https://help.aliyun.com/document_detail/25859.html'},
  {id:601,type:'single',answer:'C',stem:'「负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，支持4层和7层流量的转发，其中,() I功能是7层负载均衡服务不支持的。',opts:['SNI支持','域名URL转发','一致性哈希（CH）调度算法','重定向'],exp:'具体可查看CLB支持4层和7层负载均衡具体的功能对比。参考链接：https://help.aliyun.com/document_detail/32460.html'},
  {id:602,type:'single',answer:'C',stem:'神龙架构是阿里云自主研发的软硬一体虚拟化技术，与传统服务器相比，以下不属于神龙架构服务器优势的是',opts:['神龙架构将云上性能损耗降为零','兼具虚拟机的弹性和物理机的性能及功能特性','计算资源共享，具备较高的性价比','自研芯片具备IO加速能力'],exp:'弹性裸金属服务器即神龙架构为用户独占计算资源，而非共享。https://help.aliyun.com/document_detail/60576.html'},
  {id:603,type:'single',answer:'B',stem:'开放系统互连参考模型(Open System Interconnect,简称OSl)是国际标准化组织(ISO)和国际电报电话咨询委员会(CCITT)联合制定的开放系统互连参考模型，为开放式互连信息系统提供了一种功能结构的框架。我们常用到的第七层是指（）。',opts:['会话层','应用层','表示层','传输层'],exp:'七层为应用层，表示层在第六层，会话层第五层，传输层第四层'},
  {id:604,type:'single',answer:'C',stem:'阿里云内容分发网络CDN和传统厂商的CDN相比具有稳定快速、节约成本和简单易用三个特点。以下关于阿里云CDN节约成本的描述中，哪一项是错误的？',opts:['资源弹性扩展，按实际使用量付费，接入即可实现跨运营商、跨地域的全网覆盖','先使用后付费,提供按流量或峰值带宽两种计费方式，满足不同业务需求','同一地域的CDN和云服务ECS实例之间，不收回源流量费','对于网站突发流量，无需用户干预，自动作出响应和调整,有效减少源站压力'],exp:'由于CDN节点在全国多地均有分布，所以与其他云产品间流量通过公网传输。所以这个时候访问的是ECS的公网IP，不管是否是同一个地域都会产生回源流量费。参考链接:参考链接：https://help.aliyun.com/knowledge_detail/40165.html'},
  {id:605,type:'single',answer:'A',stem:'作为某初创企业的技术负责人，阿明将Java应用程序、图片视频等静态文件都部署在了一台ECS实例上，提供服务。随着业务发展和用户量的增加，发现存储在ECS实例上的静态文件访问速度不能达到预期的要求。为提升静态文件访问速度，您建议选择以下哪一种阿里云产品？',opts:['对象存储OSS','云数据库RDS','弹性伸缩Auto Scaling','负载均衡SLB'],exp:'对象存储可存储静态文件，加速访问'},
  {id:606,type:'single',answer:'D',stem:'［某应用管理员在源站把文件A进行删除，但客户端仍持续访问，CDN节点没有缓存文件A，所有针对文件A的请求都将被转发回源，由源站响应4xx状态码，大幅增加了源站的压力，此时可配置，首次回源后即可由CDN节点直接响应4xx状态码，减轻源站压力。',opts:['自定义HTTP响应头','缓存过期时间','URI重写规则','状态码过期时间'],exp:'配置状态码过期时间主要适用于源站响应了异常状态码的情况下，用于指定CDN节点上执行的缓存处理动作。 正常情况下CDN节点成功从源站获取到所请求的资源，即源站响应了2xx状态码时，会按照阿里云CDN缓存规则及优先级进行缓存。如果源站无法迅速响应所有状态码（例如非2xx状态码），且不希望所有请求全部由源站响应，那么可以配置状态码过期时间，由CDN节点直接响应状态码，减轻源站压力。 典型场景：文件A在源站已被删除，但客户端仍持续访问，CDN节点没有缓存文件A，所有针对文件A的请求都将被转发回源，由源站响应4xx状态码，这将会大幅增加源站的压力。如果CDN节点上配置了缓存4xx状态码，那么CDN节点针对文件A的请求首次回源后，会缓存4xx状态码，在预设缓存时间内，当客户端再次请求文件A时，将会由CDN节点直接响应4xx状态码，无需回源。 https://help.aliyun.com/document_detail/111598.html?spm=a2c4g.750001.0.i3(https://help.aliyun.com/document_detail/111598.html?spm=a2c4g.750001.0.i3)'},
  {id:607,type:'single',answer:'B',stem:'IPv4网关是连接专有网络VPC和公网的网络组件。VPC访问IPv4公网的流量经过IPv4网关，由IPv4网关实现路由转发以及私网地址到公网地址的转换，最终实现对公网的访问。下列关于IPv4网关说法正确的是',opts:['一个IPv4网关可以绑定多张网关路由表','IPv4网关可作为VPC路由表中的路由下一跳，控制VPC访问公网的目的地址范围','一个VPC下支持创建多个IPv4网关','不管VPC内包含任何资源，都支持创建IPv4网关'],exp:'IPv4网关作为VPC路由表中的路由下一跳，控制VPC访问公网的目的地址范围。https://help.aliyun.com/document_detail/376445.html'},
  {id:608,type:'single',answer:'B',stem:'「创建专有网络VPC后，系统会自动创建一张系统路由表并为其添加系统路由来管理VPC的流量。路由表中的每一项是一条路由条目，下列关于路由条目说法正确的是',opts:['路由条目由源网段、目标网段、下一跳类型、下一跳四部分组成','路由条目包括系统路由、自定义路由和动态路由','在VPC下创建新的交换机后，需要手动创建以交换机网段为目标网段的路由条目','在添加自定义路由时，下一跳类型不能为ECS实例'],exp:'路由条目无源网段选项，在VPC下创建新的交换机后，系统自动创建以交换机网段为目标网段的路由条目。https://help.aliyun.com/document_detail/91265.html'},
  {id:609,type:'single',answer:'A',stem:'云计算一个重要特点是弹性，阿里云的用户可以根据业务需求和策略实现计算资源的自动调整。在业务量高峰时增加ECS实例来提升系统的处理能力，在业务量低谷时自动减少ECS实例以节约成本。针对此场景，您建议选择以下哪一种阿里云产品？',opts:['弹性伸缩Auto Scaling','负载均衡SLB','云数据库RDS','专有网络VPC'],exp:'题目中说需要自动根还有业务量来自动调节ECS实例的数目，所以需要选择弹性伸缩AutoScaling。'},
  {id:610,type:'single',answer:'A',stem:'在购买ECS的时候必须设置安全组，安全组在ECS中是非常重要的服务，其中安全组的主要使用方式为以下哪一种？',opts:['白名单的使用','黑名单的使用','黑名单出入网规则限制','流量限速'],exp:'本题单选正确答案为A。A（白名单的使用）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:611,type:'single',answer:'B',stem:'阿里云弹性伸缩(AutoScaling)是根据用户的业务需求和策略,自动调整其弹性计算资源的管理服务。若要求弹性伸缩创建的ECS实例中可以直接正常处理用户请求,无需任何额外的系统调度和配置,弹性伸缩的云服务器ECS实例中部署的应用必须满足以下哪项条件？',opts:['所有数据保存在ECS实例磁盘上','无状态且可横向扩展的','无状态且符合幂等性','有状态'],exp:'弹性伸缩主要是ECS的横向伸缩，同时也是服务的横向伸缩，弹性伸缩要求每台ECS是无状态的，否则不能保证数据的统一。 参考链接：https://kyfxbl.iteye.com/blog/1831869'},
  {id:612,type:'single',answer:'B',stem:'D公司在线视频业务全国排名前五，整个业务系统全部建设在阿里云之上，使用的云产品有云服务器ECS、对象存储OSS、内容分发网络CDN。最近发现有黑客恶意下载公司的正版视频，在国外社区分发。假设你是D公司的系统管理员，从技术上可以如何解决这个问题？',opts:['启用阿里云CDN的IP黑名单功能','启用阿里云CDN的URL鉴权功能','启用阿里云OSS的Refer黑名单功能','启用云服务顺的安全组功能'],exp:'划重点:公司使用了CDN，黑客恶意下载公司的正版视频。所以需要对CDN的访问进行保护，但是题目中并不知道黑客的具体IP或者某一段IP，知道具体IP的话可以直接把具体IP或者这段IP加入黑名单，所以只能需要采用CDN的URL鉴权功能防止在社区在分发的问题。'},
  {id:613,type:'single',answer:'D',stem:'阿里云快照可以为所有类型的云盘创建一致性快照，是一种便捷高效的数据容灾手段，有一个客户要求容灾能力高，对快照创建时间没有要求，为客户推荐（）最合适。',opts:['自动快照','加密快照','本地快照','普通快照'],exp:'参考链接：https://help.aliyun.com/document_detail/25391.html'},
  {id:614,type:'single',answer:'C',stem:'阿里云致力于以在线公共服务的方式，提供安全、可靠的计算和数据处理能力，让计算和人工智能成为普惠科技。阿里云始终坚守自己的三条生命线，持续发展与创新，以下不属于三条生命线的是',opts:['与合作伙伴共生共存','坚决不碰客户数据','积极拥抱开源技术','坚持自主研发之路'],exp:'自主研发、共生共存、不碰客户数据是阿里的三条生命线'},
  {id:615,type:'single',answer:'C',stem:'客户准备使用阿里云来部署他们的业务系统，为保证业务处理的正确性和服务不中断，可以通过（）实现高IO云盘的数据备份，通过跨可用区、部署集、负载均衡等实现应用容灾。',opts:['使用mysqldump命令','规则族','快照','本地快照'],exp:'参考链接：https://help.aliyun.com/document_detail/25367.html'},
  {id:616,type:'single',answer:'A',stem:'阿里云的负载均衡SLB提供对多台后端服务器进行流量分发的服务。对于后端服务器的选择，以下说法哪一项是正确的？',opts:['只能是阿里云的云服务器ECS实例','所有能通过公网访问的服务器均可','所有阿里云的云产品实例','支持AWS的EC2'],exp:'阿里云的负载均衡SLB目前只支持阿里云的云服务器ECS实例，不支持其他服务器。'},
  {id:617,type:'single',answer:'B',stem:'某用户在阿里云上购买了云服务器ECS实例，镜像选择了公共镜像中的WindowsServer类型，在使用该Windows实例的过程中，偶然出现磁盘变为RAW格式的情况，可能的原因是',opts:['该磁盘正在进行快照备份','硬件层故障导致磁盘分区信息丢失','磁盘脱机','RAW是磁盘的正常格式'],exp:'磁盘显示为RAW格式是因为Windows无法识别磁盘上的文件系统，一般是因为记录文件系统类型或者位置的信息丢失或者损坏。https://help.aliyun.com/document_detail/52020.html'},
  {id:618,type:'single',answer:'D',stem:'某企业应用管理员在本地搭建了一套ERP系统，为减少自主维护数据库的麻烦，该管理员准备购买云数据库RDS MySQL作为ERP系统的数据库。要使用RDS，则需要先创建云数据库RDS MySQL实例，以下关于RDS MySQL实例的操作说法正确的是',opts:['RDS实例购买后，地域可以根据需要灵活更改','RDS不支持外面连接，只能提供给云服务器ECS使用','RDS实例不支持经典网络','VPC相同，交换机不同，ECS实例与RDS实例也可以内网互通'],exp:'本题单选正确答案为D。D（VPC相同，交换机不同，）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:619,type:'single',answer:'A',stem:'「对象存储服务OSS是一种海量、安全、低成本、高可靠的云存储服务，适合存放任意类型的文件。对象存储OSS中的低频访问存储类型，适合保存以下哪种类型的数据？',opts:['每月访问频率1—2次','每小时访问频率1—2次','每天访问频率1—2次','每年访问频率1—2次'],exp:'低频访问(InfrequentAccess)，适用于较低访问频率(平均每月访问频率1到2次)的业务场景。参考链接：https://help.aliyun.com/document_detail/51374.html'},
  {id:620,type:'single',answer:'A',stem:'在使用负载均衡服务前，需要添加ECS实例作为负载均衡实例的后端服务器，用来接收负载均衡监听转发的请求。负载均衡服务通过设置（），将添加的同一地域的多台ECS实例虚拟成一个高性能、高可用的应用服务池。',opts:['虚拟服务地址','前端协议','后端端口','后端协议'],exp:'负载均衡服务通过设置虚拟服务地址，将添加的同一地域的多台ECS实例虚拟成一个高性能、高可用的应用服务池。'},
  {id:621,type:'single',answer:'D',stem:'「用户将数据存储到OSS以后，就可以使用阿里云其他产品和服务对其进行相关操作，比如ECS产品。假设OSS和ECS实例属于同地域，用户可以通过（）方式使用内网访问OSS资源；假设OSS和ECS实例属于不同地域，用户可以通过（）来间接实现通过OSS内网地址访问OSS资源。',opts:['VPN网关直接访问OSS资源、配置ECS反向代理','VPN网关直接访问OSS资源、通过ossbrowser访问OSS资源','URL直接访问OSS资源、通过ossbrowser访问OSS资源','URL直接访问OSS资源、通过配置ECS反向代理'],exp:'本题单选正确答案为D。D（URL直接访问OSS资源）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:622,type:'single',answer:'B',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力等方面都具有优势。以下哪一项是OSS在安全性方面表现出来的优势？？',opts:['流量清洗和黑洞设备需要另外购买，阿里云的云市场有多家优质的供应商可供选择','提供多种鉴权和授权机制，以及白名单、防盗链、主子账号功能','OSS提供灵活的开发接口，兼容市面上主流的安全防护设备和协议','阿里云提供地定制化的安全服务，可根据用户的需要一对一定制开发'],exp:'其他均不属于安全方面优势。参考链接：https://help.aliyun.com/document_detail/31818.html'},
  {id:623,type:'single',answer:'B',stem:'在弹性伸缩ESS中，伸缩活动用于记录伸缩组内实例数、伸缩组边界值、期望实例数等数量的变化情况，一个伸缩活动可能有不同的状态。某个企业的云管理员在阿里云弹性伸缩ESS中定义了一个伸缩组的伸缩最大实例数为100，伸缩规则要求自动创建10台ECS实例，在执行伸缩活动后伸缩活动状态为拒绝，可能的原因是',opts:['伸缩组已关联SLB实例，SLB实例的后端服务器配额为90','伸缩组内已有100台ECS实例','伸缩组状态异常','伸缩组所在地域中，伸缩配置中的实例规格已无库存'],exp:'伸缩活动被拒绝原因其中之一原因：伸缩组内的实例数不能小于伸缩组设置的最小值，也不能大于伸缩组设置的最大值，执行此伸缩规则将导致伸缩组内实例小于最小值或大于最大值，因此拒绝执行。建议：请检查目前实例数量或伸缩规则配置，确保执行伸缩规则后不会超出实例数量限制。https://open.alitrip.com/docs/doc.html'},
  {id:624,type:'single',answer:'B',stem:'OSS是目前中国国内唯一通过CohassetAssociates审计认证的云服务，可满足严格的电子记录保留要求；允许用户以“不可删除、不可篡改”方式保存和使用数据，符合美国证券交易委员会(SEC)和金融业监管局（FINRA）的合规要求。用户可设置以下哪种合规保留策略？',opts:['基于对象','基于时间','多维度','基于用户'],exp:'OSS提供强合规策略，用户可针对存储空间(Bucket)设置基于时间的合规保留策略。参考链接：https://help.aliyun.com/document_detail/172498.html'},
  {id:625,type:'single',answer:'A',stem:'某零售企业计划在阿里云上购买云数据库RDS SQL Server版用来作为业务系统的数据库，并希望在双十一等促销活动期间面对流量高峰时，可以增加高规格只读实例来承担业务的主要读请求，该企业云管理员可选择云数据库RDS实例系列来满足需求。',opts:['集群版','基础版','三节点企业版','高可用版'],exp:'https://help.aliyun.com/document_detail/96810.html'},
  {id:626,type:'single',answer:'A',stem:'使用阿里云弹性伸缩ESS来实现计算资源的弹性配置时，做了如下设置：伸缩组属性中设置MinSize=6，MaxSize=8，伸缩规则为“减少5台ECS”。该伸缩组当前的云服务器ECS实例数为8台，通过设置定时任务来执行，执行一次后，会减少几台云服务器ECS实例',opts:['2','0','1','5'],exp:'注意:MinSize=6，所以执行定时任务每次减少5台，但是最少需要有6台机器，所以执行一次后最多只能减少2台。'},
  {id:627,type:'single',answer:'B',stem:'［当您通过OpenAPI对阿里云的云服务器ECS实例进行磁盘挂载时，挂载失败可能是由于以下哪种原因引起的？',opts:['云服务器ECS实例的状态为运行中','云服务器ECS实例的状态为启动中','磁盘的状态为待挂载','云服务器ECS实例的状态为已停止'],exp:'只有在稳定(运行中，已停止)状态才能挂载磁盘，其他状态都不行。参考链接：https://help.aliyun.com/document_detail/25446.html'},
  {id:628,type:'single',answer:'C',stem:'您基于阿里云的专有网络VPC环境构建应用，只想购买一个弹性IP(EIP)，但是该VPC内有多台云服务器ECS实例需要对外提供服务时，可以采用以下哪种方式来解决该问题？',opts:['其他的选项都不对','在所有云服务器ECS实例所在的安全组增加一条策略，允许所有外网的访问流量','可以通过端口映射的方式，先将EIP绑定到某台云服务器ECS实例A上，并将实例A的端口映射到其他的云服务器ECS实例上','不用任何操作，某台云服务器ECS实例绑定EIP之后，外网可以直接访问该VPC内的所有云服务器ECS实例'],exp:'可分配不同端口映射到不同服务器，实现均可以对外服务'},
  {id:629,type:'single',answer:'A',stem:'「1某企业的应用管理员计划将网站上的图片和视频存储在对象存储OSS上，他在创建存储空间（Bucket）时发现可以设置BucketACL来控制对象的访问权限，默认的Bucket权限是',opts:['私有读写','公共读','公共写','公共读写'],exp:'私有private（默认值）https://help.aliyun.com/document_detail/31843.html'},
  {id:630,type:'single',answer:'B',stem:'某用户需要根据云监控指标（ECS实例的CPU平均利用率)的目标值来触发弹性伸缩活动，由弹性伸缩自动计算所需的实例数量并进行扩/缩容，从而将云监控指标维持在目标值附近，针对该场景，用户需要进行以下哪项设置？',opts:['简单规则','目标追踪规则','预测规则','步进规则'],exp:'参考链接：https://help.aliyun.com/document_detail/119069.html'},
  {id:631,type:'single',answer:'D',stem:'云企业网和高速通道都可以用来建立VPC与本地数据中心的连接，实现云上和云下的通信，但云企业网与高速通道也存在一些差异，关于两者说法正确的是',opts:['高速通道能动态学习并转发路由，提高了路由的快速收敛和网络通信的质量及安全性。','云企业网配置过程中需要针对端到端进行路由配置。','云企业网的带宽需要在购买时指定互通地域的带宽，点到点购买','高速通道不具有传递性。使用高速通道互通的VPC或本地数据中心只能和对端的VPC互通。'],exp:'云企业网基于Fullmesh链路,动态学习并转发路由,提高了路由的快速收敛和网络通信的质量及安全性。https://help.aliyun.com/document_detail/123106.html。高速通道不具有传递性。使用高速通道互通的VPC或本地数据中心只能和对端的VPC互通。https://help.aliyun.com/document_detail/99971.html(https://help.aliyun.com/document_detail/99971.html?)'},
  {id:632,type:'single',answer:'C',stem:'「1某云上用户开通了阿里云的弹性伸缩服务以应对业务流量高峰。某日，因业务变化，运维人员需要更换伸缩组内的某一台ECS的操作系统，需要对其进行停机操作，为了避免该ECS实例因健康检查失败而被释放，建议运维人员采用以下哪项操作？',opts:['将该ECS实例转为保护状态，弹性伸缩不会检查处于保护状态的ECS实例健康状态，也不会释放ECS实例','将该ECS实例加入白名单，弹性伸缩不会检查白名单内的ECS实例健康状态，也不会释放ECS实例','将该ECS实例转为备用状态，弹性伸缩不会检查处于备用状态的ECS实例健康状态，也不会释放ECS实例','将该ECS实例转为挂起状态，弹性伸缩不会检查处于挂起状态的ECS实例健康状态，也不会释放ECS实例'],exp:'您可以将暂时不使用的ECS实例转为备用状态，处于备用状态的ECS实例负载均衡权重会被置零。弹性伸缩不会检查处于备用状态的ECS实例健康状态，也不会释放ECS实例。'},
  {id:633,type:'single',answer:'A',stem:'「1某企业的业务系统对数据安全有较高要求，需要对业务数据进行容灾恢复，当数据盘出现故障时，可以通过故障切换功能，完成主备站点的切换。此时可通过功能实现这一需求。',opts:['云盘异步复制','云盘自动快照','云盘镜像','使用快照回滚云盘'],exp:'https://help.aliyun.com/document_detail/314563.html'},
  {id:634,type:'single',answer:'D',stem:'用户通过网络使用软件，无需购买软硬件、建设机房等，只需向提供商租用基于Web的软件，来管理企业经营活动，且无需对软件进行维护，服务提供商会全权管理和维护软件。该模式属于以下哪一种服务形式？',opts:['PaaS(平台即服务)','DaaS(数据即服务)','IaaS(基础设施即服务)','SaaS(软件即服务)'],exp:'题目中说了是基于Web的软件，消费者只需要通过网络使用软件，不需要管理和维护软件，所以选择SaaS(软件即服务)。'},
  {id:635,type:'single',answer:'A',stem:'「1某企业在阿里云上购买了ECS实例部署了业务系统，同时购买了传统型负载均衡CLB包年包月实例来实现负载均衡。近期该企业计划开展一个为期3天的大型促销活动，担心用户访问量大导致CLB的性能瓶颈，此时可通过操作满足该场景需求。',opts:['使用短时升配功能，临时提升包年包月实例的带宽和规格','对包年包月实例执行升配操作','将包年包月实例转按量付费实例','将包年包月实例进行续费变配，调整实例的配置'],exp:'短时升配适用于大促或者节假日线上运营活动等场景。您可以通过短时升配功能，临时提升包年包月实例的带宽和规格。https://help.aliyun.com/document_detail/431216.html'},
  {id:636,type:'single',answer:'A',stem:'「1在使用阿里云弹性伸缩服务（AutoScaling）时，如果在伸缩组中指定了RDS实例，伸缩组会自动',opts:['如果ECS实例无法加入到RDS访问白名单，那么该ECS实例将被回滚操作并释放','指定的RDS实例必须是运行中状态','指定的RDS实例访问白名单的IP个数不能达到上限','伸缩组创建成功后，伸缩组不会立即生效，只有启用伸缩组，才能接受伸缩规则的触发和执行相关的伸缩活动'],exp:'题目问的是描述错误的选项，如果弹性伸缩的ECS实例无法加入到RDS访问白名单，自动创建的ECS会被回滚和释放。手动创建的ECS不会被回滚和释放。'},
  {id:637,type:'single',answer:'C',stem:'SSL-VPN支持将客户端远程接入专有网络VPC，使客户端可以安全地访问VPC中部署的应用或服务。在使用SSL-VPN时，以下说法正确的是',opts:['客户端的私网网段和VPC的私网网段可以重叠','需要创建SSL服务端，SSL服务端的地域和已创建的VPN网关的地域可以不同','根据SSL服务端配置，创建并下载客户端证书','只支持Linux、Mac、Windows客户端，Android客户端暂不支持'],exp:'创建SSL客户端证书。根据SSL服务端配置，创建并下载客户端证书.参考链接：https://help.aliyun.com/document_detail/65282.html'},
  {id:638,type:'single',answer:'A',stem:'Web应用防火墙WAF的规则防护引擎默认开启，所有接入WAF防护的网站业务，默认都受到规则防护引擎的检测和防护。WAF按照防护严格程度，内置了多套规则，其中默认规则组是',opts:['中等规则组','基础规则组','宽松规则组','严格规则组'],exp:'中等规则组：默认选用该规则组。 宽松规则组：如需减少误拦截，可选用该规则组。 严格规则组：如需提高攻击检测命中率，可选用该规则组。 https://help.aliyun.com/document_detail/147592.html?spm=a2c4g.750001.0.i7(https://help.aliyun.com/document_detail/147592.html?spm=a2c4g.750001.0.i7)'},
  {id:639,type:'single',answer:'C',stem:'对象存储服务OSS的版本控制功能用于管理某一存储空间(Bucket)中相同对象(Object)的不同版本。以下关于对版本控制应用场景及解决方案的描述中，哪项是错误的？ 选项：',opts:['通过版本控制的恢复历史版本功能，可以将因意外操作或应用程序故障删除或覆盖的Object快速恢复','Bucket开启版本控制功能后，大量冗余的历史版本Objects会占用存储空间，产生费用。建议通过配置历史版本过期规则来自动清理历史版本Object','Bucket开启版本控制后，所有手动删除的Object默认不会直接删除，而是会成为历史版本，存储在Bucket建议修改此默认配置，使手动删除的Object不再保存于历史版本中','Bucket开启版本控制后，删除其中的Object会产生删除标记，大量不清理的删除标记会影响GetBucket操作性能。建议配置生命周期规则，定期清除删除标记'],exp:'您可以通过版本控制的恢复历史版本功能，将您因意外操作或应用程序故障删除或覆盖的Object快速恢复。您在覆写或删除Object时，会将Object以历史版本的形式保存，大量冗余的历史版本Object：会占用存储空间产生费用。您可以通过配置历史版本过期规则来自动清理历史版本Object。通过删除Object的当前版本来恢复Object的历史版本，删除已开启版本控制的Bucket中的Objects会产生删除标记，大量不请理的删除标记会影响GetBucket操作性能。建议您配置生命周期规则，定期清除删除标记。参考链接：https://help.aliyun.com/document_detail/169911.html'},
  {id:640,type:'single',answer:'D',stem:'某跨国公司在美国硅谷和中国上海均有办公点，且该跨国公司在美国（硅谷）和华东2（上海）龙土地域分别创建了VPC1和VPC2，并在两个VPC中部署了应用系统。因业务发展，需要美国硅谷的两个办公点、中国上海的两个办公点、VPC1、VPC2全互通（已知业务之间数据日传输量在100M以内）。如果你是阿里云产品经理，你会建议用户采用以下哪种最高效经济的方案？',opts:['使用高速通道对办公地点和VPC进行数据打通','为VPC网络搭配负载均衡服务，配合云解析实现网络流量互访','为VPC内的ECS实例绑定弹性公网IP，办公点与VPC以及VPC间通过公网访问','使用VPN连接办公地点与所在地VPC，将两个VPC加载到同一云企业网中'],exp:'您可以通过云企业网实现任意两个地域下的网络实例互通，例如使北京地域VPC与杭州地域VPC互通。您首先需要创建一个云企业网实例，然后将要互通的网络实例(专有网络和边界路由器)加载到云企业网实例，再购买一个带宽包，设置跨地域互通带宽即可。参考链接：https://help.aliyun.com/document_detail/68503.html'},
  {id:641,type:'single',answer:'D',stem:'CDN支持配置Referer防盗链，访问请求到达CDN节点后，CDN节点会根据预设的防盗链黑名单或白名单，对访客的身份进行过滤。符合规则的用户可以顺利请求到资源，不符合规则的用户，请求会返回以下哪种响应码？',opts:['503','200','500','403'],exp:'符合规则的用户可以顺利请求到资源，不符合规则的用户，请求会返回403响应码。参考链接：https://help.aliyun.com/document_detail/27134.html'},
  {id:642,type:'single',answer:'A',stem:'阿里云对象存储OSS提供了海量文件存储能力，当用户需要将一些Object从一个Bucket复制到另外一个Bucket，且不改变内容时，可以使用OSS OpenAPI的CopyObject实现。使用CopyObject来复制文件，可以节省以下哪种成本？',opts:['网络带宽','没有节约成本','存储成本','API请求次数'],exp:'CopyObject接口用于在存储空间(Bucket)内或同地域的Bucket之间拷贝文件(Object)，所以不需要使用带宽再次上传至OSS，可以节省OSS的网络带宽。'},
  {id:643,type:'single',answer:'D',stem:'某公司的网站与后台管理都在相同的SLB实例下，以下哪种功能只允许特定IP访问后台管理？',opts:['虚拟服务器组','主机组','黑名单','白名单'],exp:'开启白名单:仅转发来自所选访问控制策略组中设置的IP地址或地址段的请求，白名单适用于应用只允许特定IP访问的场景。'},
  {id:644,type:'single',answer:'D',stem:'阿里云OSS进行数据存储前，需要先创建一个或多个存储空间，以下哪一项是该存储空间？',opts:['key','value','object','Bucket'],exp:'本题单选正确答案为D。D（Bucket）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:645,type:'single',answer:'A',stem:'ECS服务器会对每个访问的请求进行身份验证，以下哪一个是用于标识访问者身份的？',opts:['Access Key Id','Access Key Secret','User name','Requestld'],exp:'AccessKeySecret是用来鉴权校验；AccessKeyId是用来区分用户的。AccesskeyID是类似身份的标识，而accesskeysecret的作用是签名您的访问参数，以防被篡改。参考链接：https://help.aliyun.com/knowledge_detail/43189.html'},
  {id:646,type:'single',answer:'B',stem:'以阿里云服务器ECS为例，以下哪一项不属于云计算带来的便利？',opts:['获得服务器实例在几分钟内而不是数天数周','用户无需参与任何安全管理工作','用户按照需要获得计算量而不是按照峰值设计','用户无需再去维护和管理硬件'],exp:'题目问的是便利性不包括，安全管理工作还是需要用户参加的。'},
  {id:647,type:'single',answer:'A',stem:'www.bestcar.com是一个刚建立的汽车资讯车友交流网站。主站用PHP搭建，有10GB的图片素材，部分JS文件。目前购买一台ECS实例存放所有程序代码，并在ECS上安装MySQL数据库。随着用户访问量的不断增长，访问速度越来越慢，用户上传的图片每周增长50GB。以下哪种产品组合方案可以同时提供海量存储空间和快速访问?',opts:['采用OSS+CDN组合','采用OSS+MTS组合','采用OSS+RDS组合','采用OSS+ECS组合'],exp:'题目中说了需要需要同时解决大量图片存储和快速访问，解决大量图片所以需要用OSS来存储，实现快速访问所以需要用CDN来配合加速访问。'},
  {id:648,type:'single',answer:'C',stem:'负载均衡提供性能共享型实例和性能保障型实例，性能保障型实例提供可靠的性能指标。下列选项中，哪一项不属于性能保障型实例的关键指标？',opts:['每秒新建连接数','最大连接数','每秒新增查询数','每秒查询数'],exp:'实例规格,负载均衡提供性能共享型实例和性能保障型实例，性能保障型实例提供可靠的性能指标。参考链接：https://help.aliyun.com/document_detail/85931.html'},
  {id:649,type:'single',answer:'A',stem:'某企业在云服务ECS上搭建了新闻网站，有时播出热点新闻会访问量突增，新闻的时效性降低后，访问量回落。由于该新闻网站的业务量波动无规律，访问量突增和回落的具体时间难以预测，所以手动调整实例很难做到及时性，而且调整数量也不确定。可以利用弹性伸缩ESS的进行ECS的数量控制。',opts:['报警任务','定时任务','期望实例数','并行伸缩活动'],exp:'某新闻网站播出了热点新闻，访问量突增，新闻的时效性降低后，访问量回落。由于该新闻网站的业务量波动无规律，访问量突增和回落的具体时间难以预测，所以手动调整实例很难做到及时性，而且调整数量也不确定。您可以利用弹性伸缩的报警任务，由阿里云自动根据CPU使用率等衡量指标进行弹性伸缩。参考链接：https://help.aliyun.com/document_detail/324146.html'},
  {id:650,type:'single',answer:'A',stem:'作为架构师，您在给某公司设计架构方案，来自手机APP客户端的请求将被云服务器ECS实例处理，同时使用负载均衡SLB实例进行流量分发，使得后台各ECS实例的负载大致均匀，为了应对业务量的大幅波动（周未访问量比较大），您还建议他们使用弹性伸缩(AutoScaling)动态的增加或减少计算资源。他们对您的方案比较满意，作为一个特别看重用户体验的创业型公司，他们有一个比较担心的问题：在后端云服务器ECS实例相对空闲时，可能会触发减少ECS实例的伸缩活动，这时候运行在即将移出伸缩组的ECS实例上的应用会被终止，那么发起这些应用的用户的体验会变差。您应该向客户推荐以下哪种解决方法来消除客户的后顾之忧?',opts:['弹性伸缩中， 伸缩组对应的伸编配置使用的自定义镜像里存放执行脚本，井设置命令在操作系统关机时自动执行该脚本，其中该脚本中存放了此种状况下的处理逻辑','在负载均街SLB实例的后端服务器池中，找到将要被移出的ECS实例，手工将该实例从后端服务器池中移出，则正在此ECS实例上运行的应用会正常返回结果，但是不会再被分到新的请求','在负载均衡SLB实例的后端服务器池中，找到将要被移出的ECS实例，自动设定该ECS实例的权重为0，则该实例将不会被分到新的请求，在处理完成已有的需求后，将被自动移出后端服务器池','在负载均衡SLB实例中，开启后端服务器的数据同步选项，同时开启后端服务器的应用漂移选项，则在伸缩活动将某台ECS实例从伸缩组中移走时，其上的数据和正在运行的应用将由同个伸缩组中的另-台ECS实例接管'],exp:'如您需要确保在ECS实例上任务处理完成才让弹性伸缩释放该实例，您需要在自定义镜像中存放执行脚本，并设置命令在操作系统关机时自动执行该脚本。'},
  {id:651,type:'single',answer:'A',stem:'「使用阿里云的负载均衡SLB实例时，合理的会话保持配置可以实现与某个连接（Session）相关的所有应用请求能够由同一台后端云服务器ECS实例进行处理，维持业务的延续性。七层服务的会话保持是基于实现的。',opts:['cookie','源IP','负载均衡IP','用户的UUID'],exp:'负载均衡提供四层（TCP或UDP协议）和七层（HTTP或参考链接：协议）监听，TCP基于源地址的会话保持。HTTP基于Cookie的会话保持。参考链接：https://help.aliyun.com/document_detail/85943.html'},
  {id:652,type:'single',answer:'D',stem:'在开通阿里云内容分发网络CDN时，首先要“添加和管理CDN加速域名”。以下关于管理加速域名的描述中，哪一项是错误的？',opts:['加速域名必须先通过ICP备案，否则不允许添加','加速域名的源站可以放在阿里云OSS上','删除加速域名前，必须先停止该加速域名的加速服务','源站类型为域名时，源站域名允许和加速域名相同'],exp:'域名备案后才开添加此为添加域名的提前条件； 加速域名的源站支持OSS域名，IP，源站域名，函数计算域名； 删除加速域名前，必须先停止加速服务； 源站域名不能与加速域名相同，否则会造成循环解析，无法回源。'},
  {id:653,type:'single',answer:'A',stem:'某企业希望通过阿里云高速通道打通本地数据中心IDC与云上专有网络VPC。为实现安全可靠、低延迟的网络访问，该企业决定选择独享专线接入，该独享专线需要由运营商施工完成铺设。',opts:['运营商','合作伙伴','阿里云','自主建设'],exp:'本题单选正确答案为A。A（运营商）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:654,type:'single',answer:'C',stem:'［】（）可以配合CDN产品，提供静态内容存储、分发到边缘节点的解决方案。利用CDN边缘节点缓存的数据，提升同一个文件被同一地区客户大量重复并发下载时的体验。',opts:['RDS','SLB','OSS','VPN'],exp:'本题单选正确答案为C。C（OSS）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:655,type:'single',answer:'B',stem:'某公司有一个阿里云官网账号，并通过此账号申请使用了阿里云的负载均衡SLB实例，公司的账号的管理员创建了子账号，并将负载均衡SLB实例的只读权限授予该子账号，该子账号的拥有者可以查看SLB服务，但是无法对其进行修改。上述授权操作使用了阿里云的哪一种产品？',opts:['DAC(Discretionary Access Control)','RAM (Resource Access Management)','MAC(Mandatory Access Control)','资源编排'],exp:'提及到"子账号"，所以需要通过阿里云的RAM(ResourceAccessManagement) ，即用户身份管理与资源访问控制服务。 参考链接：https://help.aliyun.com/document_detail/28627.html'},
  {id:656,type:'single',answer:'C',stem:'随着专有网络、路由表、交换机数量的增多，会加大对这些实例的管理难度。可通过标签进行分组管理，有助于搜索和筛选实例。下列关于标签的说法正确的是',opts:['不同地域下的标签信息互通','标签的键和值创建后不支持修改','不支持未绑定实例的空标签存在，标签必须绑定在实例上','每个标签都由一对键值对（Key-Value）组成，每个实例只能绑定一个标签'],exp:'不支持未绑定实例的空标签存在，标签必须绑定在实例上，不同地域中的标签信息不互通。https://help.aliyun.com/document_detail/160749.html'},
  {id:657,type:'single',answer:'C',stem:'用户可以配置：（）实时关注ECS实例使用情况，当（）检测到伸缩组内的ECS实例vCPU使用率突破80%时，（）根据用户配置的伸缩规则弹性扩张ECS资源，自动创建合适数量的ECS实例。',opts:['实例健康状况、实例健康状况、弹性伸缩','弹性伸缩、弹性伸缩、实例健康状况','云监控、云监控、弹性伸缩','安全组、云监控、弹性伸缩'],exp:'本题单选正确答案为C。C（云监控、云监控、弹性伸缩）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:658,type:'single',answer:'A',stem:'伸缩活动的生命周期为："判断伸缩组的健康状态和边界条件"与"启动cooldown"之间的所有活动，手工加入既有的ECS实例后：1判断ECS实例的状态、类型2分配Activityld和执行伸缩活动3修改Total Capacity4加入ECS实例等活动以下哪项是上述活动的正确顺序？',opts:['1-2-4-3','2-1-4-3','1-4-2-3','2-3-1-4'],exp:'手工加入的步骤:1.判断伸缩组的健康状态、边界条件和ECS实例的状态、类型。2.分配ActivityId和执行伸缩活动。3.加入ECS实例。4.修改TotalCapacity。5.添加RDS 白名单。6.挂载负载均衡，将权重设为当前伸缩组中已激活的伸缩配置上指定的“负载均衡权重”。此处使用了伸缩配置上指定的“负载均衡权重”。7. 伸缩活动完成，启动cooldown。 参考链接：https://bbs.aliyun.com/simple/t586976.html'},
  {id:659,type:'single',answer:'C',stem:'某用户使用负载均衡SLB和云服务器ECS搭建服务集群，搭建完成时，运维人员进行测试，发现SLB内的云服务器通过telnet访问SLB的VIP不通，以下哪项导致这种现象的原因？',opts:['创建负载均衡实例后，没有添加监听','SLB健康检查异常','目前负载均衡不支持同时作为客户端和服务端，因为返回的数据包只在云服务器内部转发，不经过SLB','服务器内网防火墙设置没有放行相应端口'],exp:'本题单选正确答案为C。C（目前负载均衡不支持同时作）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:660,type:'single',answer:'A',stem:'在使用容器服务ACK时，可以通过容器服务控制台和Kubernetes命令行工具kubectl两种方式来连接集群进行管理。如果想通过Kubectl进行管理，需要在客户端安装kubectl工具，并配置集群凭证，集群凭证需要保存到客户端目录下的config文件中才能正常使用。',opts:['$HOME/.kube','/etc/Kubernetes/.kube','/root/.kube','/etc/.kube'],exp:'将复制的集群凭证内容粘贴至$HOME/.kube目录下的config文件中，保存并退出。https://help.aliyun.com/document_detail/86494.html'},
  {id:661,type:'single',answer:'B',stem:'在创建阿里云的云产品实例时，可以选择默认类型的专有网络V',opts:['默认交换机只能创建在默认专有网络中','如果您有已经创建的专有网络VPC和交换机，在创建专有网络VPC类型的云产品实例时，云产品实例就不会创建在默认交换机中','默认交换机与非默认交换机支持相同操作方式，且规格限制一致','默认交换机由阿里云为您创建，您自行创建的均为非默认交换机'],exp:'提示:默认专有网络与非默认专有网络的操作方式与规格限制--致。'},
  {id:662,type:'single',answer:'A',stem:'阿里云弹性伸缩服务AutoScaling可以根据业务需求和策略自动调整弹性计算资源。在业务需求增长时，无缝增加ECS实例，满足业务需要；在业务需求下降时，自动减少ECS实例节约成本。在创建弹性伸缩组时，需要设置的参数不包括以下哪一项？ 选项：',opts:['伸缩配置','组内最大实例数','伸缩组名称','组内最小实例数'],exp:'参考链接：https://help.aliyun.com/document_detail/25882.html'},
  {id:663,type:'single',answer:'A',stem:'某新媒体公司通过手机APP提供新闻资讯服务，采用阿里云弹性伸缩(AutoScaling)来实现动态添加或者减少云服务器ECS实例，来应对业务量的变化。该公司估算所需资源为，业务空闲时需要10台ECS，7：30到9:00，18:30到20:00为业务高峰时段，所需的ECS实例在10-20台。该公司在伸缩组中将最小实例个数设置为10，最大实例个数设置为20。从容易部署以及节省成本的角度来考虑，您建议他们配置以下哪种模式的任务？',opts:['动态模式','定时模式','固定数量模式','lazy模式'],exp:'题目中说了，ECS在这段时间内是动态变化的，以及要从节省成本的角度出发，定时任务一下子从10台增加到20台，这样虽然满足业务要求但是成本增加了，所以选择动态任务既可以满足要求还可以根据需求适当扩展ECS减少成本。'},
  {id:664,type:'single',answer:'B',stem:'某企业新开发的互联网应用在传输时易出现延迟大、丢包等问题，严重影响了互联网用户的访问体验。该企业云管理员希望通过阿里巴巴优质BGP带宽和全球传输网络，实现应用的七层网络加速，可创建实例实现。',opts:['云企业网','全球加速标准型','全球加速企业型','全球加速基础型'],exp:'基础型全球加速可用于三层（IP协议）网络加速场景，您只需要配置加速区域和终端节点组即可实现业务加速。 标准型全球加速主要用于四层（TCP和UDP协议）和七层（HTTP和HTTPS协议）网络加速。 https://help.aliyun.com/document_detail/406244.html(https://help.aliyun.com/document_detail/406244.html)'},
  {id:665,type:'single',answer:'D',stem:'云解析DNS为企业和开发者将易于管理识别的域名转换为计算机用于互连通信的数字IP地址，从而将用户的访问路由到相应的网站或应用服务器。云解析DNS支持多种解析记录类型，其中A记录类型可以将域名映射到IPv4地址进行解析。',opts:['AAAA','SRV','CNAME',''],exp:'本题单选正确答案为D。D（）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:666,type:'single',answer:'A',stem:'Object操作具有（），即操作成功或失败，不会存在有中间状态的Object。OSS保证用户一旦上传完成后，读到的Object是完整的，OSS不会返回给用户一个部分上传成功的Object。',opts:['原子性','持久性','一致性','隔离性'],exp:'Object操作在OSS上具有原子性，操作要么成功要么失败，不会存在有中间状态的Object。OSS保证用户一旦上传完成之后读到的Object是完整的，OSS不会返回给用户一个部分上传成功的Object。 Object操作在OSS同样具有强一致性，用户一旦收到了一个上传(PUT)成功的响应，该上传的Object就已经立即可读，并且Object的冗余数据已经写成功。不存在一种上传的中间状态，即read-after-write却无法读取到数据。对于删除操作也是一样的，用户删除指定的Object成功之后，该Object立即变为不存在。参考链接：https://help.aliyun.com/document_detail/31827.html'},
  {id:667,type:'single',answer:'A',stem:'某企业有公共的文件需要共享给多组业务使用，需要集中的共享存储来存放数据，于是决定购买文件存储',opts:['需要多个计算节点同时修改同一个文件，则需要使用NFS v4.0挂载以支持文件锁功能','文件系统创建后，其访问协议可以随时改变','般情况下，NFSv4.0性能优于NFS v3，建议您使用NFS v4.0','所有类型的NAS均支持NFS和SMB协议'],exp:'如果需要多个计算节点同时修改同一个文件，则需要使用NFS v4.0挂载以支持文件锁功能。https://help.aliyun.com/document_detail/27519.html'},
  {id:668,type:'single',answer:'B',stem:'在使用阿里云的负载均衡SLB实例时，做了如下健康检查的配置：响应超时时间为5秒，健康检查间隔为2秒，不健康阈值为3，健康阈值为3。即对于确认一个后端云服务器ECS实例是不健康的，需要连续三次健康检查超时。则在某后端云服务器ECS实例状态异常后，被负载均衡SLB实例从后端服务器中移出的时间窗为是多久？',opts:['5秒','19秒','7秒','21秒'],exp:'健康检查失败时间窗=响应超时时间×不健康阈值+检查间隔×（不健康阈值-1），应该是5s∗3+2s∗（3-1）=19s。参考链接：https://help.aliyun.com/document_detail/85958.html'},
  {id:669,type:'single',answer:'B',stem:'阿里云内容分发网络CDN和传统厂商的CDN相比具有稳定快速、节约成本和简单易用三个特点。以下关于阿里云CDN节约成本的描述中，哪一项是错误的?',opts:['先使用后付费，提供按流量或峰值带宽两种计费方式，满足不同业务需求','同一地域的CDN和云服务器ECS实例之间，不收回源流量费','对于网站突发流量，无需用户干预，自动作出响应和调整，有效减少源站压力','资源弹性扩展，按实际使用量付费，接入即可实现跨运营商、跨地域的全网覆盖'],exp:'CDN回源的地址可以使回源域名,也可以是回源IP,这个时候访问的是ECS的公网IP,不管是否是同一个地域都会产生回源流量费。'},
  {id:670,type:'single',answer:'C',stem:'「某电商平台为吸引用户，除定期推出优惠活动外，还会在节假日、会员日、购物节开展线上大促。业务流量突增。在保证线上活动顺利的同时，需要控制成本，运维人员可以使用以下哪种产品组合？',opts:['云服务器+弹性伸缩+云数据库','云服务器+弹性伸缩','云服务器+负载均衡+弹性伸缩+云数据库+对象存储','云数据库+弹性伸缩'],exp:'本题单选正确答案为C。C（云服务器+负载均衡+弹性）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:671,type:'single',answer:'C',stem:'「某个云上用户目前因业务需要，希望将多个域名绑定到同一个负载均衡服务地址上，通过不同的域名区分不同的访问来源，并且使用HTTPS加密访问。针对该场景，用户可以通过以下哪一项配置实现。',opts:['配置访问控制','共享实例带宽','配置监听转发','配置扩展域名'],exp:'HTTPS监听器支持基于域名的转发策略，通过监听规则将不同域名的请求分发至对应的后端服务器。负载均衡服务通常允许在监听器中设置转发规则，如根据域名路由流量。选项C对应配置监听规则实现域名区分，而选项B可能仅涉及域名绑定而非路由策略。参考阿里云SLB文档中关于HTTPS监听器多域名配置部分。'},
  {id:672,type:'single',answer:'C',stem:'「阿里云对象存储服务OSS支持多种访问控制策略，若某Bucket的访问权限是私有，其中某个Object的访问权限是公共读写，那么，以下关于该Bucket和Object权限的说法中，哪一项是正确的?',opts:['所有用户都有该Bucket的读写权限','只有该Bucket的拥有者可以读写该object','所有用户都有该Object的读写权限','只有被RAM Policy授权的用户可以读写该object'],exp:'参考链接：https://help.aliyun.com/document_detail/171615.html'},
  {id:673,type:'single',answer:'A',stem:'您希望通过华北2(北京)地域的阿里云专有网络VPC中的云服务器ECS实例通过内网访问OSS但是连接oss-cn-beijing-internal.aliyuncs.com(华北2(北京)地域的通用内网地址)失败，可以采用以下哪种方式来解决该问题?',opts:['通过VPC专用的OSS内网地址进行访问，vpc100-oss-cn-beijing.aliyuncs.com','其他方式都不能解决','只能通过外网地址进行访问','换其他地域的内网地址进行访问，如华北1(青岛)地域的通用内网地址(oss-cn-qingdao-internal.aliyuncs.com)'],exp:'在VPC的环境中ECS连接oss-cn-beijing-internal.aliyuncs.com这个地址不通。这个是因为OSS针对VPC是有一套自己的内网地址，所以需要用北京:vpc100-oss-cn-beijing.aliyuncs.com.http://docs-aliyun.cn-hangzhou.oss.aliyun-inc.com/pdf/vpc-troubleshooting-intl-zh-2017-02-06.pdf'},
  {id:674,type:'single',answer:'B',stem:'某用户使用负载均衡SLB和云服务器ECS搭建FTP服务（监听端口99），搭建完成后，通过filezillaclient访问SLB公网IP的99端口，能够登陆FTP，但是读取目录失败，导致该错误的关键原因是以下哪一项？',opts:['后端服务器负载过高','ECS的安全组规则入方向配置错误','创建负载均衡实例后，没有添加监听','负载均衡SLB不支持搭建FTP服务'],exp:'本题单选正确答案为B。B（ECS的安全组规则入方向）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:675,type:'single',answer:'C',stem:'问权限(ACL)，（）不是OSSObjectACL支持的方式。',opts:['公共读','继承Bucket','继承Object','私有'],exp:'OSSObjectACL支持的方式有公共读，公共读写，私有，以及继承Bucket。'},
  {id:676,type:'single',answer:'A',stem:'阿里云的负载均衡SLB包含了几个主要的部分：来自外部的访问请求、Listener、LoadBalancer、BackendServer等，关于Listener的说法中，哪一项是正确的?',opts:['主要包括用户定制的负载均衡策略和转发规则','提供对外服务的ECS实例集合','是指负载均衡SLB实例','通过配置监控规则，可以生成负载均衡SLB实例的监控指标'],exp:'Listener:用户定制的监听器，定义了负载均衡策略和转发规则。参考链接：https://yq.aliyun.com/articles/311875'},
  {id:677,type:'single',answer:'A',stem:'基于目前主流的隧道技术，专有网络隔离了虚拟网络。每个VPC都有一个独立的隧道号，一个隧道号对应着一个虚拟化网络。一个VPC内的ECS实例之间的传输数据包都会加上隧道封装，带有唯一的隧道ID标识，然后送到物理网络上进行传输。不同VPC内的ECS实例因为所在的（）不同，本身处于两个不同的路由平面，所以不同VPC内的ECS实例无法进行通信，天然地进行了隔离。',opts:['隧道ID','SDN','CDN','账号'],exp:'不同VPC内的ECS实例由于所在的隧道ID不同，本身处于两个不同的路由平面，因此不同VPC内的ECS实例无法进行通信，天然地进行了隔离。参考链接：https://help.aliyun.com/document_detail/34221.html'},
  {id:678,type:'single',answer:'D',stem:'「对象存储服务OSS是一种海量、安全、低成本、高可靠的云存储服务，适合存放任意类型的文件。对象存储OSS中的归档存储类型，适合保存以下哪种类型的数据？',opts:['每月访问频率1—2次','每小时访问频率1—2次','每天访问频率1—2次','每年访问频率1—2次'],exp:'参考链接：https://help.aliyun.com/document_detail/51374.html'},
  {id:679,type:'single',answer:'B',stem:'在OSS中，用户操作的基本数据单元是Object，Object中不包含以下哪种元素?',opts:['meta','id','data','Key'],exp:'对象由元信息(ObjectMeta)，用户数据(Data)和文件名(Key)组成。参考链接：https://help.aliyun.com/document_detail/177681.html'},
  {id:680,type:'single',answer:'D',stem:'阿里云负载均衡SLB实例中的后端服务器ECS实例需要设置权重，可以给对外服务能力更强的ECS实例设置更大的权重，这些ECS实例就会有机会处理更多的访问请求。在提供稳定服务的同时，充分的利用了已有资源。如果将一台ECS实例的权重设置为0，以下说法哪一项是正确的？',opts:['所有外部访问请求都被分发到这台ECS实例上','该ECS实例会被认为状态异常，负载均衡SLB会把它移出后端服务器池','负载均衡SLB会分发外部请求给这台ECS实例，分发量的大小等于总请求数除以后端服务器ECS实例个数','该ECS实例不会再得到负载均衡SLB实例分发的外部访问请求'],exp:'将负载均衡后端ECS的权重置零，新发起的业务请求是无法经负载均衡转发到该服务器的，健康检查相应的会显示异常。所以该ECS实例不会再得到负载均衡SLB实例分发的外部访问请求。参考链接：https://help.aliyun.com/knowledge_detail/39492.html'},
  {id:681,type:'single',answer:'D',stem:'弹性伸缩AS是根据业务需求和策略自动调整实例数量的服务。弹性伸缩提供多种伸缩模式其中会定期检查ECS实例的运行状态，如果发现一台ECS实例未处于运行中状态，则判定该ECS实例为不健康实例并移出。1仅选择一个选项。',opts:['自定义模式','固定数量模式','动态模式','健康模式'],exp:'本题单选正确答案为D。D（健康模式）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:682,type:'single',answer:'B',stem:'某企业云架构师在规划业务系统时，希望将业务涉及到的ECS实例分散部署在不同的物理服务器上，以此保证业务的高可用性和底层容灾能力。此场景可通过功能实现。',opts:['资源编排','部署集','主备服务器组','弹性供应'],exp:'部署集 部署集支持高可用策略，部署集内实例会严格分散在不同的物理服务器上，保证业务的高可用性和底层容灾能力。 https://help.aliyun.com/document_detail/260296.html(https://help.aliyun.com/document_detail/260296.html)'},
  {id:683,type:'single',answer:'D',stem:'您在阿里云的华东1(杭州)跟华北2(北京)都创建了专有网络VPC，通过（）可以最快速的把华东1(杭州)跟华北2(北京)的VPC通过内网连接起来实现两地云服务器ECS实例可以互相访问。',opts:['VPN','高速通道','专线','其他答案都对'],exp:'因为快速是相对的，高速通道、VPN以及专线的建立都是需要一定时间的。所以题目的意思不能说谁最快速，而是说怎么样能通过阿里云最快速实现这样的功能，所以三个都选。'},
  {id:684,type:'single',answer:'C',stem:'弹性扩张时，弹性伸缩使用伸缩组内的实例配置信息自动创建ECS实例，实例配置信息支持设置实例的规格、（）、用户自定义数据等。',opts:['自定义内网IP','自定义公网IP','操作系统','地域'],exp:'本题单选正确答案为C。C（操作系统）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:685,type:'single',answer:'A',stem:'负载均衡通过健康检查来判断后端服务器（ECS实例)的业务可用性。健康检查机制提高了前端业务整体可用性，避免了后端ECS异常对总体服务的影响。关于传统型负载均衡CLB健康检查说法正确的是',opts:['针对七层(HTTP或HTTPS协议)监听，健康检查通过HTTP HEAD探测来获取状态信息','对于HTTPS监听，健康检查时通过HTTPS进行传输','如果在[健康检查间隔)时间之内，节点服务器没有收到后端eCS返回的信息，则认为服务无响应，判定健康检查失败.','UDP监听不需要进行健康检查'],exp:'针对七层（HTTP或HTTPS协议）监听，健康检查通过HTTP HEAD探测来获取状态信息。https://help.aliyun.com/document_detail/85958.html'},
  {id:686,type:'single',answer:'B',stem:'云产品的可用区指的是一套独立的基础设施，不同的可用区之间基础设施（网络，电力和空调等）相互独立，即一个可用区出现基础设施故障不影响另外一个可用区。下列关于阿里云ECS可用区的说法中，哪一项是正确的？',opts:['可用区是在用户购买时指定的，购买后支持更改','可用区之间内网互通','可用区内网络延时最高不超过1ms','若要提高应用的容灾能力则可以将实例创建在同一可用区'],exp:'可用区之内网络互通。'},
  {id:687,type:'single',answer:'C',stem:'「1阿里云弹性伸缩ESS是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务，必须和以下哪种产品配合使用？',opts:['云监控','云数据库RDS','云服务器ECS','块存储'],exp:'本题单选正确答案为C。C（云服务器ECS）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:688,type:'single',answer:'C',stem:'「1使用阿里云云服务器ECS的过程中，如果发现Windows磁盘空间满了，可以通过清理磁盘中不需要的文件，或者扩容磁盘来解决。此外，日常也应养成良好的磁盘使用习惯，这些习惯不包括以下哪一项？',opts:['文件压缩保存','定期清理不必要的应用程序','磁盘快照压缩保存','设置磁盘监控'],exp:'日常需要养成良好的磁盘使用习惯，本文推荐以下几个磁盘使用的最佳实践:压缩保存文件，定期清理不必要的应用程序设置磁盘监控。参考链接：https://help.aliyun.com/document_detail/51683.html'},
  {id:689,type:'single',answer:'B',stem:'EIP是一种NATIP。它实际位于阿里云的公网网关上，通过NAT方式映射到被绑定的云资源上。和云资源绑定后，云资源可以通过EIP与公网通信。用户购买了EIP后，发现无法绑定到现有的ECS上，经过排查发现是以下哪种原因造成的？',opts:['EIP的地域和ECS实例的地域相同','ECS为经典网络类型','该ECS实例没有公网IP','ECS为专有网络类型'],exp:'经典网络类型的ECS无法进行绑定EIP'},
  {id:690,type:'single',answer:'C',stem:'题干：196/820、传统防御方式的主旨是将攻击者拒之门外，然而随着攻击手段的多样化、隐蔽化、复杂化,传统的防御方式往往疲于应付，比如利用0day漏洞的APT攻击，传统的基于规则和特征库的安全产品很难察觉。此时可以使用云安全中心的功能模拟多个易受攻击的主机和服务，给攻击者提供一个容易被攻击的目标，伪装成用户的业务应用，使攻击者误认为是欲攻击的目标对象，从而延缓攻击并收集更多攻击者信息进行反制。',opts:['诱捕陷阱','云黑洞','云蜜罐','攻击傀儡机'],exp:'https://help.aliyun.com/document_detail/426563.html'},
  {id:691,type:'single',answer:'C',stem:'［阿里云弹性伸缩服务AutoScaling可以根据业务需求和策略自动调整弹性计算资源。某用户计划使用定时任务作为伸缩活动的触发条件，创建定时任务时，不支持配置以下哪一项参数？',opts:['重试过期时间','执行时间','冷却时间','重复周期'],exp:'参考链接：https://help.aliyun.com/document_detail/25904.html'},
  {id:692,type:'single',answer:'B',stem:'「1阿里云负载均衡服务SLB支持在配置监听时选择是否开启会话保持，您可以针对不同的监听配置不同的会话保持策略。下列关于SLB的会话保持说法，正确的是哪一项？',opts:['仅支持基于cookie的HTTP层会话保持','同时支持TCP层和HTTP层的会话保持','会话保持针对TCP层和HTTP层都是基于源IP的','仅支持基于源IP的TCP层的会话保持'],exp:'会话保持现在是既支持TCP也支持HTTP的，但是之前的是不支持tcp层的。'},
  {id:693,type:'single',answer:'B',stem:'「1阿里云的云服务器ECS产品的应用非常广泛，既可以单独地作为Web服务器，也可以与其他阿里云产品配合提供多媒体解决方案。在多媒体、大流量的APP或网站应用场景下，云服务器ECS实例与阿里云的（）产品搭配，可以实现在业务量增长时自动增加ECS实例，并在业务量下降时自动减少ECS实例，保证满足访问量在峰值时对资源的要求，同时降低了系统资源的拥有成本。',opts:['对象存储OSS','弹性伸缩Auto Scaling','内容分发网络CDN','云监控'],exp:'题目中说:“业务量增长时自动增加ECS实例，并在业务量下降时自动减少ECS实例“，顾名思义是弹性伸缩AutoScaling。'},
  {id:694,type:'single',answer:'A',stem:'「对于入网流量，负载均衡会根据用户在控制台或AP1上配置的转发策略，对来自前端的访向请求进行转发和处理，TCP/UDP协议和HTTP/HTTPS协议的流量都需要经过LVS集群进行转发，LVS集群内的每台节点服务器均匀地分配海量访问请求，并且每一台节点服务器之间都有会话同步策略，以保证高可用。如果相应的负载均衡实例服务端口使用的是七层HTTP协议，那么以下哪个说法是正确的？',opts:['LVS集群内每个节点会先将其承载的服务请求均分到Tengine集群，Tengine集群内的每个节点再根据负载均衡策略，将服务请求按策略最终分发到后端ECS服务器','LVS集群内每个节点都会根据负载均衡实例负载均衡策略，将其承载的服务请求按策略直接分发到后端ECS服务器','LVS集群内每个节点都会根据负载均衡策略，调用Key Serveri进行证书验证及数据包加解密等前置操作，再将服务请求按策略最终分发到后端ECS服务器','LVS集群内每个节点会先将其承载的服务请求均分到Tengine集群，Tengine集群内的每个节点再根据负载均衡策略，先调用Key Server进行证书验证及数据包加解密等前置操作，再将服务请求按策略最终分发到后端ECS服务器'],exp:'如果相应的负载均衡实例服务端口使用的是四层协议(TCP或UDP)，那么LVS集群内每个节点都会根据负载均衡实例负载均衡策略，将其承载的服务请求按策略直接分发到后端服务器。如果相应的负载均衡实例服务端口使用的是七层HTTP协议，那么LVS集群内每个节点会先将其承载的服务请求均分到Tengine:集群，Tengine:集群内的每个节点再根据负载均衡策略，将服务请求按策略最终分发到后端ECS服务器。如果相应的负载均衡实例服务端口使用的是七层参考链接：协议，与上述HTTP处理过程类似，差别是在按策略将服务请求最终分发到后端ECS服务器前，先调用KeyServeri进行证书验证及数据包加解密等前置操作。参考链接：https://help.aliyun.com/document_detail/27544.html'},
