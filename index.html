  {id:1381,type:'multi',answer:'CD',stem:'对象存储服务(Object Storage Service,OSS)是一种海量、安全、低成本、高可靠的云存储服务，其中，存储空间(Bucket)是用于存储对象(Object)的容器，所有的对象都必须隶属于某个存储空间，以下哪几种属性是存储空间的配置属性？',opts:['可用区','元信息','存储类型','访问权限'],exp:'存储空间是用户用于存储对象(Object)的容器，所有的对象都必须隶属于某个存储空间。存储空间具有各种配置属性，包括地域、访问权限、存储类型等。用户可以根据实际需求，创建不同类型的存储空间来存储不同的数据。参考链接：https://help.aliyun.com/document_detail/87728.html'},
  {id:1382,type:'multi',answer:'ABE',stem:'IMG是阿里云OSS对外提供的海量、安全、低成本、高可靠的图片处理服务，可以将原始图片上传保存在OSS上，通过简单的RESTful接口，在任何时间、任何地点、任何互联网设备上对图片进行处理，用户可以通过以下哪几种方式处理图片？',opts:['使用OSS SDK对图片进行处理','为图片URL添加参数进行单次处理','上传图片时OSS自动处理，无需设置','OSS控制台开启图片处理功能','使用图片样式对不同图片进行相同处理'],exp:'您可以通过文件URL、API、SDK对OSS内图片进行处理。参考链接：https://help.aliyun.com/document_detail/44686.html'},
  {id:1383,type:'multi',answer:'BD',stem:'权重越高的ECS实例将被分配到更多的访问请求。您可以根据后端ECS实例的对外服务能力和情况来区别设定。SLB权重设置为0会发生以下哪些情况？',opts:['服务器优先级最高','服务器优先级最低','能正常提供服务','不能正常提供服务'],exp:'将负载均衡后端ECS的权重置零，相当于将该ECS手工下线，用于对相应ECS进行重启、配置调整等主动运维。而由于该状态下，业务数据是无法经负载均衡转发到该服务器的，所以健康检查相应的自然会显示异常。'},
  {id:1384,type:'multi',answer:'AB',stem:'一个公司内部的视频分享站点（未做任何程序开发），管理员定期上传各种培训视频，2000名员工在休息时间可以进行下载和学习。为了鼓励全员一起丰富视频资源库，B公司想扩展站点功能，增加员工自助上传、评价、播放次数统计、排行榜、视频分类、热门推荐等互动功能，假设您是B公司的架构师，您推荐公司选用阿里云的哪几种产品满足需求？',opts:['云服务器ECS','云数据库RDS','加密DNS服务(HTTPDNS)','音视频转码服务(MTS)'],exp:'划重点:2000名员工在休息时间可以进行下载和学习。自助上传、评价、播放次数统计、排行榜、视频分类。所以需要使用用到ECS部署网站，同事需要用到数据库RDS存储员工的文件数据。主要题目中没有提到视频在线播放，所以不需要用到音视频转码服务(MTS)。'},
  {id:1385,type:'multi',answer:'BC',stem:'使用阿里云的负载均衡SLB实例时，通过会话保持可以实现与某个连接（Session）相关的所有应用请求能够由同一台后端云服务器ECS实例进行处理。为了在七层协议转发中，实现基于Cookie的会话保持，阿里云的负载均衡SLB提供了以下哪些处理方式？',opts:['Cookie跟踪','Cookie重写','Cookie植入','Cookie校验'],exp:'可查看文档参考链接：https://help.aliyun.com/knowledge_detail/55202.html，第四条。参考链接：https://help.aliyun.com/knowledge_detail/55202.html'},
  {id:1386,type:'multi',answer:'AD',stem:'某企业购买了云安全中心企业版来提供安全告警、病毒防御、漏洞检测及修复、基线检查、资产指纹、攻击分析等全面的安全服务。然后需要在受保护的服务器上安装云安全中心的Agent插件才能受到云安全中心保护，下列关于云安全中心Agent的说法正确的是',opts:['Agent卸载后会有一段保护期，在保护期内重新安装的Agent会被自动卸载','阿里云ECS服务器、IDC服务器及第三方服务器均支持一键自动安装Agent','云安全中心Agent没有按时上报其在线信息，云安全中心服务器端会在12小时后判定该服务器不在线','云安全中心Agent可以在Linux、Windows、MacOS和Android系统中安装'],exp:'一键自动安装Agent（仅阿里云服务器支持） https://help.aliyun.com/document_detail/68597.html(https://help.aliyun.com/document_detail/68597.html) 服务端检测到和Agent客户端的通信异常，包括但不限于网络异常、客户端进程被异常结束、客户端被卸载等，会将客户端的状态更改为离线。 如果服务端在10个小时内没有收到Agent客户端登录、采集到的数据等信息，会将客户端状态更改为离线 https://help.aliyun.com/document_detail/68611.html(https://help.aliyun.com/document_detail/68611.html)'},
  {id:1387,type:'multi',answer:'ABC',stem:'如果您希望删除指定的阿里云的专有网络VPC，必须首先删除该专有网络内的所有云产品实例，包括以下哪些？',opts:['安全组','交换机','云服务器ECS实例','路由器'],exp:'排除法，路由器是你删除VPC时自动删除的。参考链接：https://help.aliyun.com/document_detail/27717.html'},
  {id:1388,type:'multi',answer:'BCD',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。OSS免费提供了多种监控报表，方便用户随时关注OSS中文件的访问和资源占用情况。OSS支持以下哪几种监控功能？',opts:['访问OSS文件的用户终端类型（PC端或手机端）的监控','存储空间的监控','对OSS服务请求的PV访问量(包括PUT、GET的请求数)的监控','对OSS服务请求的UV访问人次的监控'],exp:'OSS不支持对终端的类型进行监控。'},
  {id:1389,type:'multi',answer:'ABCD',stem:'在实际项目中，通常会把阿里云的负载均衡SLB、云服务器ECS以及弹性伸缩(Auto Scaling)结合起来使用，以下关于三者配合使用的说法中，哪些是正确的？',opts:['三者必须在同一个地域(Region)，才能配合使用','负载均衡SLB实例必须打开健康检查，否则无法和弹性伸缩配合使用','一个SLB实例可以绑定多个伸缩组','一个伸缩组可以同时支持多个SLB实例','负载均衡SLB实例必须关闭会话保持，否则将影响弹性伸缩活动的执行'],exp:'一个伸缩组可以同时支持多个SLB实例，且一个SLB实例可以对应多个伸缩组。'},
  {id:1390,type:'multi',answer:'ABCEF',stem:'1阿里云的云服务器ECS产品拥有传统服务器和虚拟主机无法企及的优势。在易用性方面，以下哪些属于ECS产品所具有的优势？',opts:['通过镜像可一键部署相同的操作系统和软件环境','通过阿里云的管理控制台可以在任何地方进行云服务器ECS实例的管理','可快速复制多台ECS实例','可以任意修改云服务器ECS实例的各种系统配置，也不会影响ECS实例的正常使用','阿里云的云市场提供了丰富的操作系统和应用软件','支持自定义镜像、数据盘快照'],exp:'任意修改云服务器ECS实例的各种系统配置可能会导致服务器出现异常。'},
  {id:1391,type:'multi',answer:'BD',stem:'某云上用户使用ECS实例承载其业务应用，使用对象存储服务OSS作为业务应用的文件存储。因业务需要，用户需要将OSS服务的某个存储空间（Bucket)配置为云存储网关，作为文件系统通过NFS协议挂载至ECS实例。配置完成后，挂载至ECS的存储空间Bucket可作为以下哪几种形式存在？',opts:['归档存储','文件系统','数据库系统','存储卷'],exp:'参考链接：https://help.aliyun.com/document_detail/134092.html'},
  {id:1392,type:'multi',answer:'AD',stem:'某用户在使用ECS实例过程中忘记登录密码，需要重置ECS登录密码。需要该用户注意的是，在重置ECS登录密码时，ECS实例状态可为以下哪几种？',opts:['已停止','启动中','已过期','运行中'],exp:'只有稳定状态下，ECS才可以重置登录密码。参考链接：https://help.aliyun.com/document_detail/25439.html'},
  {id:1393,type:'multi',answer:'BD',stem:'在使用弹性伸缩ESS来自动调整业务的计算能力时，需要创建伸缩组。伸缩组是弹性伸缩的核心单元，用来管理一组具有相同应用场景和相同实例类型的实例。下列关于伸缩组的说法正确的是',opts:['创建伸缩组后，可以开启期望实例数功能','伸缩组类型为ECS的伸缩组可以选择已有实例作为组内实例配置信息来源','一个伸缩组中，可以创建多个伸缩配置','伸缩组类型为ECI的伸缩组可以选择启动模板作为组内实例配置信息来源','伸缩组内可以有多项生效的组内实例配置信息来源'],exp:'您只能在新建伸缩组时开启期望实例数功能，而不能通过修改已有伸缩组来开启该功能。https://help.aliyun.com/document_detail/146231.html'},
  {id:1394,type:'multi',answer:'ACD',stem:'「1负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，阿里云提供公网和私网两种类型的负载均衡服务，用户可以根据业务场景选择配置对外公开或对内私有的负载均衡。以下关于私网负载均衡实例的描述哪些是正确的？',opts:['如果在创建负载均衡实例时选择的类型是私网类型，后续也可以通过绑定EIP，实现对公网流量的转发','私网负载均衡服务既可以被经典网络ECS实例访问，也可以被专有网络ECS实例访问','经典网络类型的私网负载均衡实例，其服务地址由阿里云统一分配和管理','专有网络类型私网负载均衡实例，其服务地址从指定的专有网络的交换机网段内分配'],exp:'CD是官网原话'},
  {id:1395,type:'multi',answer:'ABC',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，可以通过流量分发扩展应用系统对外的服务能力，通过消除单点故障提升应用系统的可用性。阿里云的负载均衡SLB包括哪些主要的组成部分？ 选项：',opts:['LoadBalancer','Listener','Backend Server','Heartbeat'],exp:'考察负载均衡由以下三个部分。 参考链接：https://help.aliyun.com/document_detail/27539.html'},
  {id:1396,type:'multi',answer:'ACD',stem:'阿里云的云监控通过监控弹性公网IP(EIP)的出流量、入流量、出流量数据包数、入流量数据包数4个监控项，帮助用户监测EIP的运行状态。下列关于弹性公网IP监控说法，哪些是正确的？',opts:['用户可以对监控项设置报警规则，以便数据异常时收到报警信息','创建EIP后，云监控服务需要手动开启之后，才开始对EIP进行监控','用户可登录云监控的管理控制台界面查看EIP的监控数据','创建EIP后，云监控自动开始对其监控'],exp:'排除法，创建EIP后，云监控服务自动开启，无需手动开启即可对EIP进行监控。'},
  {id:1397,type:'multi',answer:'AD',stem:'配置负载均衡SLB之后，访问网站出现”500InternalServerError”、“502BadGateway”和504GatewayTimeout”等错误，假设当前服务器中的PHP请求总数已经达到了PHP-FPM中max_children设置的上限，如果后续有新的PHP请求到达服务器，以下哪几种情况可能会出现？',opts:['如果已有的PHP请求处理较慢，新的PHP请求处于等待状态，直至超过Nginx的fastcg_read_timeout值，则会出现504状态码。','如果已有的PHP请求处理较慢，新的PHP请求处于等待状态，直至超过Nginx的fastcgi_read_timeout值，则会出现500状态码。','如果已有的PHP请求被处理完成，新请求被继续处理，则会出现504状态码。','如果已有的PHP请求处理较慢，新的PHP请求处于等待状态，直至超过Nginx的request_terminate_timeout值，则会出现502状态码。'],exp:'参考链接：http://www.ttlsa.com/web/analysis-of-site-502-and-504-error/'},
  {id:1398,type:'multi',answer:'ABC',stem:'对象存储服务(Object Storage Service OSS)是一种海量，安全，低成本、高可靠的云存储服务，每个OSS的用户都会用到上传服务。Web端常见的上传方法是用户在浏览器或APP端上传文件到应用服务器，应用服务器再把文件上传到OSS，以下关于OSSWeb直传场景方案的描述中，哪些是正确的？',opts:['利用OSS Browser.js SDK将文件上传到OSS','利用OSS提供的PostObject接口，使用表单上传方式将文件上传到OSS','不管使用Browser.js SDK还是PosObject接口进行数据直传，在网络不好的时候，都建议使用断点续传上传大文件','利用RAM/STS生成临时上传凭证','客户端进行表单直传到OSS时，需要为Bucket设置跨域规则以支持Post方法'],exp:'本题多选正确答案为ABC。A（利用OSS Browse）、B（利用OSS提供的Post）、C（不管使用Browser.）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1399,type:'multi',answer:'AD',stem:'对象是OSS存储数据的基本单元，也被称为OSS的文件。对象的生命周期是从上传成功到被删除为止，在OSS中，对Object的操作具有以下哪几种特性？',opts:['原子性','最终一致性','有序性','强一致性'],exp:'Object操作在OSS上具有原子性，操作要么成功要么失败，不会存在有中间状态的Object。Object操作在OSS同样具有强一致性，用户一旦收到了一个上传（PUT）成功的响应，该上传的Object就已经立即可读，并且Object的冗余数据已经写成功。参考链接：https://help.aliyun.com/document_detail/31827.html'},
  {id:1400,type:'multi',answer:'CD',stem:'在使用负载均衡服务前，需要添加ECS实例作为负载均衡实例的后端服务器，以下说法正确的有哪些？',opts:['如果出现了访问不均衡的情况，可能是ECS出现故障','权重越高的ECS实例将被分配到更少的访问请求','为保证数据的一致性，后端两台ECS实例中的应用服务部署应该是相同的','负载均衡不支持跨地域部署'],exp:'访问不均衡情况，应该是开启了会话保持功能或者ECS权重不同，如果ECS出现故障，SLB的端口检查到不健康状态，会直接不给分配流量。权重越高的ECS被分配到的请求肯定越多。'},
  {id:1401,type:'multi',answer:'CD',stem:'阿里云弹性伸缩(AutoScaling)中，冷却时间是指在同-一个伸缩组内，当有-一个伸缩活动被成功执行后的一段锁定时间内，该伸缩组不执行其他的伸缩活动。以下关于冷却时间的说法中，哪些是正确的？',opts:['在伸缩组的冷却时间内，云监控报警类型的请求可以绕过冷却时间立即执行伸缩活动，其他类型的触发任务会被拒绝(如用户手工执行伸缩规则、定时任务等)','冷却时间锁定的是同一个伸缩组的伸缩活动，对于多伸缩组内的不同伸缩活动，不会锁定','当伸缩组处于冷却时间内时，可以通过先停用伸缩组再重新启动的方式，让伸缩组的冷却时间提前结束','当伸缩组加入或移出多个ECS实例时，最后一个ECS实例加入或移出完成后，整个伸缩组冷却时间才开始计时'],exp:'定时任务也可以立即执行。不同伸缩活动，也会收到冷却时间影响。'},
  {id:1402,type:'multi',answer:'AB',stem:'云服务器ECS提供了丰富的管理功能，使用户在不同场景下都能安全便捷地使用。登录Linux类型的云服务器ECS实例，可以使用以下哪些鉴权方式？',opts:['用户名和密码','SSH秘钥对','accessKeyld和accessKeySecret','控制台VNC登录密码'],exp:'AB是登录阿里云ECS的，VNC登录密码只能连接到VNC控制台，类似你连接上显示器，该要的密码还是要的。accessKeyld和accessKeySecret是阿里云账号RAM鉴权的'},
  {id:1403,type:'multi',answer:'ADE',stem:'在使用应用负载均衡ALB时，可以配置健康检查来检查服务器组的运行状况，从而判断该组中注册的服务器的业务可用性。ALB健康检查支持协议类型。',opts:['GRPC','UDP','ICMP','TCP','HTTP'],exp:'健康检查协议类型:HTTP,TCP,GRPC。https://help.aliyun.com/document_detail/198767.html'},
  {id:1404,type:'multi',answer:'ABC',stem:'「1客户需要使用CDN加速指定网站上的业务，则需要将该网站作为源站，为其创建加速域名。CDN通过加速域名将源站上的资源缓存到CDN的加速节点，实现资源访问加速。在添加域名页面，源站信息我们可以选择以下哪几项？',opts:['函数计算域名','源站域名','OSS域名','DNS域名','ECS域名'],exp:'参考链接：https://help.aliyun.com/document_detail/119807.html'},
  {id:1405,type:'multi',answer:'BD',stem:'云服务器ECS是一种简单高效、处理能力可弹性伸缩的计算服务。某用户使用一台ECS部署企业官网，以下哪些操作可能造成网站无法访问？',opts:['手动创建快照','ECS修改安全组规则','给ECS安装云监控插件','ECS更换系统盘'],exp:'本题多选正确答案为BD。B（ECS修改安全组规则）、D（ECS更换系统盘）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1406,type:'multi',answer:'AD',stem:'云监控为云上用户提供开箱即用的企业级开放型一站式监控解决方案。云监控提供监控数据的报警功能，可以通过设置报警规则来定义监控项的阈值，并在监控项满足报警条件时发送报警通知。下列关于报警服务说法正确的是',opts:['报警服务支持电话、短信、邮件、钉钉机器人等多种方式','可以使用报警模板功能，将各类云产品监控项的报警规则保存到模板中。但模板使用生效后不能修改','报警服务不支持触发弹性伸缩ESS','可以在报警规则中选择日志服务，将报警信息写入日志服务的日志库'],exp:'本题多选正确答案为AD。A（报警服务支持电话、短信、）、D（可以在报警规则中选择日志）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1407,type:'multi',answer:'AD',stem:'「安全组是一种虚拟防火墙，具备状态检测和数据包过滤能力，用于在云端划分安全域。通过配置安全组规则，可以控制安全组内一台或多台ECS实例的入流量和出流量。以下哪些做法符合安全组最佳实践？',opts:['尽量开放和暴露最少的端口','尽量使用系统提供的默认安全组','使用跳板机，跳板机与生产ECS放在同一安全组内','生产环境和测试环境使用不同的安全组'],exp:'为应用添加安全组规则时遵循最小授权原则，尽量暴露最少的端口，生产和测试使用不同的安全组，避免测试环境bug导致生产被黑'},
  {id:1408,type:'multi',answer:'ACD',stem:'阿里云的负载均衡SLB可以把用户请求按照预设的转发策略分发到后端服务器池中的多台云服务器ECS实例上去，由不同的ECS实例完成请求的响应。以下关于后端服务器池中的ECS实例说法中，哪些是正确的？',opts:['负载均衡SLB不提供CNAME地址，需要直接将域名解析到负载约衡SLB提供的服务IP地址上','后端服务池中的ECS实例的权重加起来一定等于100','在使用负载均衡SLB实例的过程中，只要不超过限制，可以随时调整后端ECS实例的数目','同一组ECS实例可以搭建多个网站，并可以同时对这些网站进行负载均衡','后端服务池中的ECS实例必须都是运行中状态'],exp:'负载均衡SLB不提供CNAME地址，只提供IP地址；后端服务器的权重之和是没有限制的，你可以每个权重都设置为100；后端服务池中的ECS可能由于异常导致机器不能正常运行，会出现非运行中的情况。'},
  {id:1409,type:'multi',answer:'ABCE',stem:'「1阿里云的负载均衡SLB支持多种协议的转发服务，其中就包括UDP，它是面向非连接的协议，发送数据包前并不会与对方建立连接，且不提供差错恢复和数据重传。它的优点是速度快，效率高，对某些特定的场景来说非常适合。您手上有几家正在使用负载均衡SLB的客户，以下哪些场景适合使用基于UDP协议的负载均衡SLB？',opts:['某视频点播网站，用户观通过点播观看视频','某新媒体公司，通过手机APP端提供资讯服务，在客户刷新的时候推送新闻到客户端','某在线交友网站的视频聊天室','某公司提供的域名解析服务','某在线语音图片等智能识别网站，要求将用户需求中的音频请求发送至音频服务器处理，需求中的对图片的请求发送至图片服务器处理','某邮件服务商提供的发送或接收邮件功能'],exp:'域名解析服务和邮件服务并不是走UDP协议。'},
  {id:1410,type:'multi',answer:'ACD',stem:'您希望将您的应用部署在阿里云的产品上，并具备较高的可用性，以下哪几种操作可以满足您提升应用可用性的需求？',opts:['使用多个地域的云服务器ECS实例来部署服务，提升服务的可用性','使用负载均衡SLB挂载不同地域的云服务器ECS实例来提升服务的可用性','使用负载均衡SLB挂载同一个地域的不同可用区的云服务器ECS实例来提升同一个地域的服务可用性','在不同的地域申请负载均衡SLB挂载地域的不同可用区的云服务器ECS实例，同时结合CNS域名解析与多个负载均衡SLB结合使用，来提升服务的可用性'],exp:'同一个负载均衡不可以挂载多个地域的云服务器'},
  {id:1411,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS里存储的所有文件必须隶属于某个存储空间Bucket，当一个用户创建了多个Bucket，每个Bucket为不同的应用服务时，最安全的方法是让每个应用只能访问对应的Bucket。阿里云的OSS与访问控制RAM配合可以满足此类业务需求。以下关于OSS配合RAM的方案描述中，哪几项是正确？',opts:['开发环境和正式线上环境中的应用使用不同的Bucket','允许某个应用读，另一个应用写同一个Bucket里的文件','让某个应用临时读写某个Bucket，凭证过期后无法访问','不同的应用访问不同的Bucket，但是权限只有“允许”和“拒绝”，不区分“读”和“写”'],exp:'不同的应用是应该访问不同的Bucket，权限不仅需要有“允许”和“拒绝”，而且为了安全，也需要区分“读”和“写”。'},
  {id:1412,type:'multi',answer:'BCD',stem:'您在通过OpenAPI制作阿里云的云服务器ECS实例的自定义镜像的时候失败了，有可能是以下哪些原因引起的？',opts:['选择系统盘快照制作','选择数据盘快照制作','没有设置自定义镜像的名称','没有设置自定义镜像的描述'],exp:'云服务器ECS实例的自定义镜像的时候失败了，因为自定义镜像本身就是用系统盘快照来制作的，所以不会是选择系统盘快照制作导致的，可能是选择数据盘快照制作导致的，同时制作镜像时，自定义镜像的名称和自定义镜像的描述都是必须的不可为空。'},
  {id:1413,type:'multi',answer:'BCD',stem:'「阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。为了让用户对存放在OSS里的文件访问可控，OSS为每个存储空间(Bucket)提供了多种访问权限。以下哪几项属于Bucket支持的权限类型？ 选项：',opts:['私有读','公共读写','公共读','私有'],exp:'Bucket的权限没有私有读的权限.参考链接：https://help.aliyun.com/document_detail/31843.html'},
  {id:1414,type:'multi',answer:'AC',stem:'某企业在阿里云上部署的门户网站经常遭受恶意攻击者的DDoS攻击勒索，于是决定购买DDoS高防来保护门户网站持续可用。购买DDoS高防实例后，可以通过方式接入DDoS高防，从而将来自公网的访问流量在高防流量清洗中心进行清洗过滤',opts:['域名接入','协议接入','端口接入','自动接入'],exp:'https://help.aliyun.com/document_detail/127434.html'},
  {id:1415,type:'multi',answer:'BDE',stem:'一个完整的云计算环境由（）三部分（以下用XYZ代指）组成，X是指计算设备，负责完成软件的计算，Y是指我们用来完成输入/输出的设备，Z负责将云端和终端连接起来，完成信息传输。',opts:['数据','云端','服务器','终端','网络'],exp:'本题多选正确答案为BDE。B（云端）、D（终端）、E（网络）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1416,type:'multi',answer:'ABCE',stem:'阿里云弹性伸缩(Auto Scaling)，是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务。以下关于阿里云弹性伸缩的优势说法中，哪些是正确的？',opts:['根据设定策略自动调整弹性计算资源，满足业务波动性比较大的场景','伸缩模式丰富，可同时配置多种伸缩模式','按规则自动创建和释放云服务器ECS实例，自动配置RDS访问白名单','支持多种阿里云产品的动态伸缩，包括云服务器ECS、云数据库RDS、负载均衡SLB以及表格存储(Table Store，原OTS)','根据需求分配资源，在无法准确预测业务变化时，解决业务连续性的问题'],exp:'弹性伸缩目前只支持ECS及其数据盘的弹性伸缩，不支持云数据库RDS、负载均衡等云产品的弹性伸缩。'},
  {id:1417,type:'multi',answer:'AB',stem:'1弹性伸缩服务使用伸缩配置创建ECS实例，这种方式不够高效灵活，无法满足企业应用场景中复杂的业务需求，企业需要对新创建的实例进行更多的自定义设置，以下哪些功能可以满足需求？',opts:['生命周期挂钩','实例自定义数据','定时任务','冷却时间'],exp:'为了提供更加高效灵活的伸缩服务，弹性伸缩配置中新增了实例自定义数据。您可以利用实例自定义数据白动完成CS实例配置，从而安全快速地实现应用级别的扩容和缩容。您可以使用伸缩配置或实例启动模板定义创建ECS实例时的通用模板，但是，面对复杂的业务情况，您可能希望在启用ECS实例前进行更多自定义操作，这时就需要使用生命周期挂构。'},
  {id:1418,type:'multi',answer:'AC',stem:'当包年包月实例的配置无法满足用户的业务需求时，用户可以使用包年包月实例升级配置功能升级实例规格，如升级公网带宽等。某用户将其账号下经典网络类型ECS实例的公网带宽首次从OMbit/s升级到一个5Mbit/s，为使新配置生效，用户可选择的操作有哪些？',opts:['在控制台重启实例','在操作系统内重启','使用API Rebootinstance重启实例','重新绑定VIP'],exp:'官方文档原话，说明说过您将经典网络实例的公网带宽首次从0Mbit/s临时升级到一个非零值，必须在控制台或使用APIRebootlnstance重启实例，才能使配置生效。参考链接：https://help.aliyun.com/document_detail/99059.html'},
  {id:1419,type:'multi',answer:'ABCD',stem:'以下哪些属于阿里云的云服务器ECS产品相对于传统物理服务器的优势？',opts:['宽带升降更敏捷','无需自建，云服务器启动就自动具备防护DDoS攻击的能力','无需额外开发，云服务器支持宕机迁移，可用性更高','云服务器ECS的交付周期短','云服务器ECS可以运行传统物理服务器不可以运行的应用'],exp:'题目中问的是阿里云云服务器ECS和传统的物理服务器的优势，其中云服务器的系统和传统服务器的系统内核都是一致的，所以不会存在云服务器可以运行传统物理服务器不可以运行的应用。'},
  {id:1420,type:'multi',answer:'CDE',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，提供丰富的功能，满足各种业务场景的需要。某用户想要使用一个负载均衡SLB实例配置两个HTTPS网站（域名不同、证书不同），其需要进行以下哪几项操作？',opts:['使用主备服务器组','添加两个HTTPS监听','在七层HTTPS监听中添加扩展域名','启用SLB七层转发的域名URL转发功能','在SLB实例上托管两个证书'],exp:'1、需要虚拟服务器组，而非主备服务器组； 2、只需要添加一个参考链接：httpS监听；参考链接：https://help.aliyun.com/document_detail/87023.html'},
  {id:1421,type:'multi',answer:'ACD',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。如果用户希望基于阿里云的产品实现3万用户同时在线观看视频直播平台，视频资源存储在OSS里，视频资源必须经过授权才能观看。为了让不同地域的用户都获得良好的播放体验，至少还需要搭配阿里云的哪几项服务来实现该方案？',opts:['内容分发网络CDN','弹性伸缩(Auto Scaling)','音视频转码服务MTS','云服务器ECS'],exp:'视频在OSS所以必须使用MTS，用户为全国则需要CDN保证数据访问性能，云服务用作数据鉴权'},
  {id:1422,type:'multi',answer:'ABC',stem:'「1阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。在OSS中文件都隶属于某一个存储空间Bucket，并且能以Bucket为单位设置相关的属性，以决定整个Bucket里的文件对外展现的形式和特定的功能。以下哪几项可以通过Bucket属性设置？',opts:['自定义域名绑定','读写权限(ACL)设置','防盗链设置','设置OSS文件被访问时的HTTP头(Header)'],exp:'目前在OSS的控制台的属性设置里面，是没有设置OSS文件被访问时的参考链接：http头(Header)这个操作，具体的可以实践操作了解。'},
  {id:1423,type:'multi',answer:'CD',stem:'D公司两年前使用阿里云对象存储OSS和云服务器ECS实例构建了视频内容的展示和下载的网站。为提升用户体验，该网站不再提供视频下载，变为视频在线播放，同时覆盖全国2000万用户群体。为了让不同地域的用户都获得良好的播放体验，D公司至少需要选择以下哪几种阿里云产品？',opts:['云服务器ECS','云数据库RDS','音视频转码服务MTS','内容分发网络CDN'],exp:'划重点:不再提供视频下载，变为视频在线播放。时覆盖全国范围内2000万的用户群。所以需要视频解码MTS和内容分发CDN。'},
  {id:1424,type:'multi',answer:'BCE',stem:'部署集是控制ECS实例分布的策略，用户可以使用部署集将业务涉及到的ECS实例分散部署在不同的',opts:['一个账号在一个地域内的部署集配额不支持提额','部署集内不能创建抢占式实例','部署集不支持创建专有宿主机','一个部署集内能容纳的实例数量无限额','部署集之间不支持相互合并'],exp:'参考使用限制官方文档参考链接：https://help.aliyun.com/document_detail/91258.html'},
  {id:1425,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力方面具备明显的优势。以下哪几项属于OSS在可靠性方面的优势？',opts:['存储规模可自动扩展，OSS对外服务不中断','数据自动多重冗余备份','服务可用性不低于99.9%，不受限于硬件可靠性','底层数据异地存储(自动在多个地域分散保存)'],exp:'参考链接：https://help.aliyun.com/document_detail/31818.html'},
  {id:1426,type:'multi',answer:'BD',stem:'「云上安全建设是一项系统性工程，难度高、涉猎面广、专业性强，企业要自主建设安全体系需要大量的成本投入。当特定安全产品不能解决综合性的安全问题时，可以考虑购买阿里云提供的安全解决方案来满足特定场景需求，下列属于阿里云提供的安全解决方案的是',opts:['企业安全平台建设解决方案','等保合规解决方案','护网行动一站式解决方案','企业上云安全建设解决方案'],exp:'https://security.aliyun.com/?spm=5176.8625285.J_6360345030.1.621849a2oe56ec'},
  {id:1427,type:'multi',answer:'AC',stem:'C公司基于阿里云的产品构建了一个共享软件下载的WEB网站，所有下载内容保存在阿里云对象存储OSS中，用户可以直接访问OSS为每个对象提供的链接完成下载。最近一年的业务增长很快，下载量同比增加了300%，每月下载流量超过500TB。公司的运营团队想通过架构升级来降低网站的云资源使用成本（至少降低20%)，同时提升用户的下载速度。该网站可以通过以下哪些方式达到预期目标？',opts:['使用内容分发网络(CDN)提升用户下载速度，并降低网络流量成本','新增多台云服务器ECS实例','通过购买对象存储服务OSS的流量包节省成本','使用加密DNS服务'],exp:'题目中说了，公司团队需要降低网站的云资源使用成本，同时提升用户的下载速度。所以需要购买对象存储服务OSS的流量包节省流量使用成本，使用内容分发网络(CDN)提升用户下载速度，同时降低网络流量成本。'},
  {id:1428,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(AutoScaling)中的伸缩组，是指具有相同应用场景的ECS实例集合。当用户创建一个伸缩组时，需要包含以下哪些内容？',opts:['伸缩规则','伸缩活动','伸缩配置','伸缩触发任务'],exp:'伸缩组包含伸缩配置、伸缩规则、伸缩活动。参考链接：https://help.aliyun.com/document_detail/25858.html'},
  {id:1429,type:'multi',answer:'BC',stem:'「执行伸缩规则、手动添加或删除ECS实例后均会触发伸缩活动，伸缩活动具有以下哪些特点？',opts:['回滚的ECS实例在被释放前不会被扣费','伸缩活动不可以中断','伸缩活动有ECS实例加入伸缩组失败时，需要保持ECS实例级事务的完整性，而非伸缩活动级事务的完整性','当伸缩组创建了5台ECS实例，但只有4台ECS实例成功加入负载均衡时，则对全部5台ECS实例进行自动释放操作'],exp:'本题多选正确答案为BC。B（伸缩活动不可以中断）、C（伸缩活动有ECS实例加入）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1430,type:'multi',answer:'ABD',stem:'1某公司使用负载均衡服务SLB和云服务器ECS部署Web业务应用网站，并且为了保证业务系统的安全性，该公司的云上架构搭配使用了云安全中心、（安骑士）和DDoS高防IP产品。业务架构搭建完毕后，用户访问时',opts:['在业务层面存在通过SLB实例IP地址访问SLB实例的情况','ECS安装了安骑士插件，但是没有在安骑士中放通相应端口','SLB防火墙(iptables)规则配置错误，不能正常接收请求','源站配置了高防，但是没有在高防中配置七层转发规则','Web应用处理HTTP请求的时间超过了负载均衡的超时时间'],exp:'参考链接：https://help.aliyun.com/document_detail/55207.html'},
  {id:1431,type:'multi',answer:'CD',stem:'在云数据库Redis版的控制台可查看慢请求日志，找到解决性能问题、优化请求的线索。Redis的慢日志会记录执行时间超过指定阀值的请求，慢日志分为和',opts:['数据缓存慢日志','运行慢日志','数据节点慢日志','代理慢日志'],exp:'Redis的慢日志会记录执行时间超过指定阈值的请求,慢日志分为数据节点慢日志和代理慢日志。https://help.aliyun.com/document_detail/95874.html'},
  {id:1432,type:'multi',answer:'BD',stem:'在互联网信息飞速发展的时代，域名是企业在互联网上建立所有服务的基础，同时域名具有唯一性。企业若想要建立网站展示企业或个人信息，需先注册域名。域名注册完成后支持多种操作，包括',opts:['域名绑定','域名转移','域名修改','域名交易','域名升级','域名销毁'],exp:'https://help.aliyun.com/document_detail/61257.html'},
  {id:1433,type:'multi',answer:'CD',stem:'创建负载均衡实例后，需要为实例配置监听。负载均衡实例监听负责检查连接请求，然后根据调度算法定义的转发策略将请求流量分发至后端服务器，负载均衡提供哪几种监听方式？',opts:['组播报文','流量','七层','四层'],exp:'参考链接：https://help.aliyun.com/document_detail/85943.html'},
  {id:1434,type:'multi',answer:'AB',stem:'「系统为创建的负载均衡实例分配服务IP地址，根据创建的负载均衡实例的类型，服务地址可能是哪几种类型的IP？',opts:['公网','私网','网络','主机'],exp:'本题多选正确答案为AB。A（公网）、B（私网）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1435,type:'multi',answer:'ACD',stem:'「创建阿里云的云服务器ECS实例时需要选择地域，地域有时候也被称为“节点”，是指实例所在的地理位置。关于ECS实例地域的说法，哪些是正确的？）',opts:['地域与用户距离越近，延迟越少，下载速度越快。例如，您的用户都分布在华北地区，则可以选择在华北2(北京)地域创建ECS实例实现更快的访问','云服务器ECS实例创建完成后可以更换地域','不同地域提供的可用区数量、实例系列、存储类型、实例价格等会有所差异，可以根据业务需求进行选择','不同地域间的内网默认不能互通'],exp:'云服务器ECS不支持更换地域，也不支持更换可用区。'},
  {id:1436,type:'multi',answer:'ABD',stem:'OSS为权限控制提供访问控制列表(ACL)，ACL可以指定存储空间和对象访问权限的访问策略，OSS支持的ACL权限有以下哪几种？',opts:['private','public-read','protected','public-read-write','public-write'],exp:'OSS的存储空间（Bucket）内部是扁平的，没有文件系统的文件夹等概念。若您希望像使用本地文件夹和磁盘那样使用OSS，您可以通过云存储网关将OSS的Bucket作为文件系统挂载至ECS实例中使用。参考链接：https://help.aliyun.com/document_detail/100676.html'},
  {id:1437,type:'multi',answer:'ACD',stem:'阿里云对象存储OSS自动为每个Bucket分配一个“外网地址”和“内网地址”。正确使用OSS的内网地址，可以节省OSS与云服务器ECS实例之间的流量费用，云服务器ECS实例通过内网访问OSS能够有效的提升上传和下载的质量。以下哪几种场景可以使用OSS的“内网地址”通信?',opts:['OSS Bucket在R1地域,用户有1台云服务器ECS实例在R1地域的可用区A，此台ECS实例上的访问日志要保存到OSS中','OSS Bucket在R2地域，用户在R1地域的可用区A有1台云服务器ECS实例,此台ECS实例上的访问日志要保存到OSS中','OSS Bucket在R1地域,在该地域的可用区B用户有1台云服务器ECS实例,此台ECS实例上的访问日志要保存到OSS中','OSS Bucket在R1地域,用户有两台云服务器ECS实例分别在该地域的可用区A和可用区B，两台ECS实例上的访问日志都要保存到OSS中'],exp:'题目中问的是云服务器ECS实例通过内网访问OSS，所以要求云服务器ECS和OSS需要处于同一个地域，"OSSBucket在R2地域,用户在R1地域的可用区A有1台云服务器ECS实例"明显不符合要求。'},
  {id:1438,type:'multi',answer:'BD',stem:'阿里云云盘三副本技术通过分布式文件系统为云服务器ECS提供稳定、高效、可靠的数据随机访问能力，为ECS实例实现99.9999999%的数据可靠性保证。下列关于三副本的描述正确的是',opts:['阿里云数据存储平台中，有四类角色来控制数据的读写，分别为Master、Chunk Server、Cache Server和Client','三份副本分布在不同机架下的不同Chunk Server上','三副本机制能够解决人为误删除导致的数据丢失','当有数据节点损坏，导致有效副本数量小于三时，集群中会发起自动同步任务，确保有效副本达到三份'],exp:'在阿里云数据存储平台中，有三类角色，分别为Master、Chunk Server和Client。https://help.aliyun.com/document_detail/35108.htm'},
  {id:1439,type:'multi',answer:'BC',stem:'服务器迁移中心SMC是阿里云自主研发的迁移平台，可将单台或多台源服务器迁移至阿里云。SMC支持以下哪些类型的操作系统迁移？',opts:['Unix','Linux','Windows','MACOS'],exp:'可查看服务器迁移中心SMC使用限制。参考链接：https://help.aliyun.com/document_detail/121598.html'},
  {id:1440,type:'multi',answer:'AB',stem:'您可以通过以下哪些方式对阿里云云服务器ECS实例的运行数据进行监控，从而判断业务的运行状态？',opts:['通过云监控服务的管理控制台进行实例运行情况的监控，并设置报警规则进行定制化的监控','通过阿里云的ECS管理控制台的实例详情页面进行CPU利用率和网络的出网和入网情况的监控','通过云服务器ECS的管理控制台可以进行监控告警的设置','通过云安全中心进行ECS实例CPU利用率情况的监控'],exp:'目前只支持在云监控的管理控制台来进行监控告警的设置。'},
  {id:1441,type:'multi',answer:'BCD',stem:'1用户购买云服务器ECS后，为了保证ECS实例的正常运行，在使用之前用户需了解ECS相关操作的注意事项，包括但不限于以下哪些项？',opts:['购买成功后，不得进行更换系统盘操作','不要随意修改网卡MAC地址','禁止使用ECS实例做流量穿透服务','不要编译Linux系统的内核，或对内核进行任何其他操作','对于4GB以上内存的云服务器，需选择32位操作系统'],exp:'A是禁止翻墙；B是错误的，可以进行更换系统盘重装系统；C不需要随意修改MAC；E不要编译内核；D、4G以上内存使用64位操作系统'},
  {id:1442,type:'multi',answer:'AC',stem:'阿里云的同一个账号在同一个地域的不同的云服务器ECS实例，可以通过安全组规则设置ECS实例之间内网互通。同一个安全组下的ECS实例默认是内网互通的，不同的安全组下ECS实例默认是内网不通的。如果希望两台ECS实例InstanceA和lnstanceB可以内网互通，以下哪些是正确的操作？',opts:['把ECS实例InstanceA和InstanceB放入到想同的安全组中，就可以满足内网都互通了','为了实现内网互通，一定要把ECS实例InstanceA和InstanceB放在同一个安全组内','如果ECS实例InstanceA和InstanceB不在同一个安全组内，两个安全组各自增加授权另一个安全组可以访问的安全组规则，就可以满足都互通了','如果云服务器ECS实例InstanceA和InstanceB不在同一个安全组内，只需要在其中一个安全组内设置内网授权另一个安全组可以访问的安全组规则，就可以满足内网都互通了'],exp:'为了实现内网互通有放入同一个安全组和分别安全组设置规则两个方案'},
  {id:1443,type:'multi',answer:'ACD',stem:'创建阿里云的云服务器ECS实例之前，需要对ECS实例的配置进行选型，阿里云为用户提供了推荐的配置组合方案来满足大部分用户的需求，这些推荐配置只是作为您开始使用云服务器ECS实例的参考。同时，阿里云还提供了灵活、可编辑的配置修改方式。如果您在使用过程中，发现ECS实例的配置过高或过低，可以随时修改配置进行ECS实例的变配。下列关于ECS实例的变配说法，哪些是正确的？',opts:['变配后，云服务器ECS实例的带宽即时生效','不支持对云服务器ECS实例的配置进行降级','升级云服务器ECS实例的CPU和内存后，必须通过阿里云的管理控制台重启ECS实例才能生效，在ECS实例内重启无效','变配后，云服务器ECS实例的公网和内网的IP地址不会改变'],exp:'阿里云服务器ECS支持自定义升级，可以根据用户需求，针对CPU、内存、带宽进行升级。其中带宽支持按天来进行升级。'},
  {id:1444,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(Auto Scaling)的伸缩配置(Scaling Configuration)中支持设置的镜像类型包含下面哪几种？',opts:['自定义镜像','公共镜像','共享镜像','云市场镜像'],exp:'弹性伸缩设置ECS配置的时候，不支持使用云市场的镜像，主要是因为部分云市场的镜像是收费的，阿里云控制台没有云市场镜像的选项。'},
  {id:1445,type:'multi',answer:'CD',stem:'某用户因业务需要，在负载均衡SLB实例的后端服务器中设置了主备ECS实例，主实例工作正常时，流量转发至主机，主实例宕机时，流量切换至备机。这种情况下该用户可以在SLB实例后端创建主备服务器组，需要用户注意的是，此时只能创建哪几种监听？',opts:['HTTP','HTTPS','TCP','UDP'],exp:'主备服务器组仅可适用于TCP和UDP监听上。参考链接：https://help.aliyun.com/document_detail/129367.html'},
  {id:1446,type:'multi',answer:'ABD',stem:'CAP理论是分布式领域的重要理论，也被戏称为“帽子理论”。CAP理论指出，一个分布式系统不可能同时满足和这三个基本需求，最多只能同时满足其中的2个。',opts:['一致性','可用性','可扩展性','分区容错性','高性能'],exp:'CAP原则又称CAP定理，指的是在一个分布式系统中，一致性(Consistency)、可用性(Availability)、分区容错性(Partitiontolerance)。CAP原则指的是，这三个要素最多只能同时实现两点，不可能三者兼顾。'},
  {id:1447,type:'multi',answer:'AC',stem:'数据安全中心DSC可以提供敏感数据识别、数据安全审计、数据脱敏、智能异常检测等数据安全能力。在使用DSC检测云产品中存在的敏感数据或审计数据库活动前，需要先完成对应云产品中数据库的授权，支持和两种授权方式。',opts:['账号密码授权','批量授权','一键授权','凭据授权'],exp:'https://help.aliyun.com/document_detail/215753.html'},
  {id:1448,type:'multi',answer:'ACDE',stem:'弹性伸缩不仅支持根据业务需求自动调节ECS实例数量，而且提供了在ECS实例上自动部署应用的能力。以下哪些选项属于弹性伸缩的伸缩配置支持的特性，用于帮助用户高效、灵活地自定义ECS实例配置，满足业务需求？',opts:['实例RAM角色','生命周期挂钩','SSH密钥对','标签','实例自定义数据','事件通知'],exp:'弹性伸缩（AutoScaling）在业务需求增长时无缝地增加ECS实例数量，并在业务需求下降时自动减少ECS实例数量节约成本。为了提供更加弹性、灵活的伸缩服务，伸缩配置支持标签、密钥对、实例RAM角色和实例自定义数据。本文介绍4个特性的作用并演示了使用方式。参考链接：https://help.aliyun.com/document_detail/63444.html'},
  {id:1449,type:'multi',answer:'BC',stem:'OSS同城冗余存储提供99.9999999999%（12个9）的数据设计可靠性以及99.995%的服务可用性。当断网、断电或者其他灾难事件导致某个机房不可用时，仍然能够确保继续提供强一致性的服务能力，整个故障切换过程用户无感知、业务不中断、数据不丢失，可以满足关键业务系统哪些参数的容灾要求？',opts:['TCO=0','RTO=0','RPO=O','AVO=O'],exp:'参考链接：https://help.aliyun.com/document_detail/172497.html'},
  {id:1450,type:'multi',answer:'AC',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。OSS产品的账单费用由三部分组成：存储空间费用、流量费用和API请求费用。以下对OSS的操作中，哪几项需要收取流量费用？',opts:['从本地PC机下载OSS文件','从本地PC机上传文件到OSS','云服务器ECS实例通过公网IP下载OSS文件','云服务器ECS实例通过内网IP下载OSS文件'],exp:'上传:内网，外网都不收取流量费用；下载:内网不收取流量费用，外网收取流量费用。所以过公网IP下载OSS文件，本地PC机下载OSS文件都是收取流量费用的。'},
  {id:1451,type:'multi',answer:'AD',stem:'客户创建好了阿里云的云服务器ECSLinux实例，并承担该云服务器的系统管理员角色，当客户远程连接该服务器时，发现无法连接至该云服务器ECS实例，可以通过以下哪些方式来检查？',opts:['如果在本地无法telnet到云服务器ECS实例的SSH远程端口，可以通过管理控制台的远程终端登陆到云服务器ECS实例后，查看一下服务器上的ssh服务是否正常启动','查看一下云服务器ECS实例的网络对外访问是否正常','检查本地客户端的防火墙是否有拦截','查看一下云服务器ECS实例上是否有运行NetworkManeger的服务，使用Service NetworkManager Status查看一下服务状态'],exp:'可参考无法通过SSH远程登录Linux实例时的排查指引。参考链接：https://help.aliyun.com/knowledge_detail/41470.html'},
  {id:1452,type:'multi',answer:'BDE',stem:'如果企业自建Redis，要实现高可用则需要自行部署基于哨兵模式的机房内高可用架构，而云数据库Redis支持三种不同的部署架构即和，均支持单机房高可用架构，可避免单点故障引起的服务中断。',opts:['主备架构','集群架构','高可用架构','标准架构','读写分离架构','三节点架构'],exp:'云数据库Redis支持标准架构、集群架构和读写分离架构，可满足不同的业务场景对业务读写能力、数据量和性能的要求。https://help.aliyun.com/document_detail/223808.html'},
  {id:1453,type:'multi',answer:'ABCEF',stem:'「创建阿里云的云服务器ECS实例时，以下哪些是可选的镜像类型？',opts:['从其他地域复制过来的自定义镜像','基于云服务器ECS实例制作的自定义镜像','阿里云提供的公共镜像','用户上传的镜像','阿里云镜像市场的镜像','其他阿里云用户共享给您的自定义镜像'],exp:'题目中问的是创建阿里云的云服务器ECS实例时可选的镜像，虽然用户是可以自己上传本地镜像的，但是上传的本地镜像需要用户把本地镜像制作为自定义镜像，所以在创建云服务器ECS的时候是没有用户上传的镜像的选项的。'},
  {id:1454,type:'multi',answer:'AD',stem:'「EIP是可以独立购买和持有的公网IP地址资源，支持绑定到SLB实例上。以下关于绑定EIP的负载均衡实例必须满足的条件，哪些是正确的？',opts:['必须为专有网络','必须和EIP出于同一个可用区','必须为经典网络','只能绑定一个EIP'],exp:'选择要绑定的负载均衡SLB实例。要绑定的负载均衡SLB实例必须满足以下条件：SLB实例的网络类型必须是专有网络。SLB实例的地域必须和EIP的地域相同。一个SLB实例仅支持绑定一个EIP。'},
  {id:1455,type:'multi',answer:'ABD',stem:'「若VPC中创建了ECS实例规格族限制中的ECS实例，则该VPC不支持使用高级功能。专有网络(VPC)的高级功能包括以下哪几项？',opts:['网络ACL','流日志','自定义交换机','自定义路由表','智能接入'],exp:'专有网络(VPC)的高级功能包括网络ACL、流日志和自定义路由表。参考链接：https://help.aliyun.com/document_detail/163020.html'},
  {id:1456,type:'multi',answer:'ABD',stem:'以下哪些属于云服务器ECS产品在容灾备份方面的优势？',opts:['单份数据损坏可在短时间内快速恢复','每份数据多份副本','需要用户人工制作数据备份','无需额外的开发，支持自动的磁盘数据备份'],exp:'云服务器ECS产品默认支持三副本备份的方式，服务器容灾并不需要用户人工数据备份。'},
  {id:1457,type:'multi',answer:'AB',stem:'对象存储OSS存储数据的基本单元称为对象Object。某管理员在使用OSS的过程中发现，在Object管理的整个生命周期内，不会存在有中间状态的object，操作要么成功要么失败，这是Object操作在OSS上的的特性。',opts:['强一致性','原子性','持久性','连续性'],exp:'Object操作在OSS上具有原子性，操作要么成功要么失败，不会存在有中间状态的Object。Object操作在OSS同样具有强一致性，用户一旦收到了一个上传（PUT）成功的响应，该上传的Object就已经立即可读，并且Object的冗余数据已经写成功。参考链接：https://help.aliyun.com/document_detail/31827.html'},
  {id:1458,type:'multi',answer:'ABC',stem:'「1阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。除了基本的存储功能外，OSS还提供了强大的图片处理能力，可根据实际业务需要对图片进行加工和转换。以下哪几项属于OSS的图片处理支持的功能？',opts:['图片缩放、添加水印','图片格式转换(例如：由jpg转换成png)','图片360度范围内旋转','OCR文字识别(将图片中的文字直接转成文本)'],exp:'OSS目前不具备OCR文字识别的处理能力。'},
  {id:1459,type:'multi',answer:'ABC',stem:'云服务器ECS系统资源监控DashBoard页面内容有哪些？',opts:['CPU使用率','网络带宽','磁盘IO','TPS'],exp:'DashBoard不支持对TPS的监控'},
  {id:1460,type:'multi',answer:'BCDE',stem:'阿里云弹性伸缩ESS中的伸缩触发任务用于触发伸缩规则的任务，常见的有定时任务、云监控的报警任务等。对于报警任务，支持以下哪些触发条件？',opts:['磁盘IOPS','外网和内网出入流量','系统平均负载','CPU负载','内存利用率'],exp:'报警任务支持:CPU，内存，系统平均负载，内外网出和入流量，TCP总连接数和已建立连接数。系统盘读和写BPS，系统盘读和写IOPS，内网网卡收包数和发包数。磁盘IOPS不是具体的确定的属性，具体的要区分具体的系统盘读和写BPS，系统盘读和写IOPS。'},
  {id:1461,type:'multi',answer:'ADE',stem:'1每个OSS的用户都会用到上传服务。Web端常见的上传方法是用户在浏览器或APP端上传文件到应用服务器，应用服务器再把文件上传到OSS。这种方法的网络传输时间比直传多一倍，且需要多台应用服务器，费用高，扩展性也很差。您建议采用以下哪几种方案通过Web前端技术上传？',opts:['使用表单上传方式，将文件上传到OSS','使用FTP协议上传文件到OSS','借助form的ajax文件上传到oss','利用OSS Brdser.js SDK将文件上传到OSS','通过支付宝小程序上传文件到OSS'],exp:'参考链接：https://help.aliyun.com/document_detail/112718.html'},
  {id:1462,type:'multi',answer:'AB',stem:'「1阿里云的专有网络VPC可以帮助用户基于阿里云构建出一个隔离的网络环境。阿里云的负载均衡SLB支持专有网络VPC，即在通过专有网络VPC隔离出的网络环境里也可以使用负载均衡SLB服务。负载均衡SLB可以通过以下哪几种方式支持专有网络VPC？',opts:['用户可以申请使用自己VPC内的IP地址作为负载均衡SLB实例的私网地址，并挂载VPC的ECS实例','用户可以申请公网IP地址作为负载均衡SLB实例的公网地址，并挂载VPC的ECS实例','用户可以申请使用自己VPC内的IP地址作为负载均衡SLB实例的私网地址，并挂载经典网络的ECS实例','用户可以申请公网IP地址作为负载均衡SLB实例的公网地址，并可以混合挂载经典网络的ECS实例以及VPC的ECS实例'],exp:'负载均衡SLB结合VPC使用的基础知识。'},
  {id:1463,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(AutoScaling)中的冷却时间是指在同一伸缩组内一个伸缩活动执行完成后的系统稳定时间，带给用户更好的体验。以下哪些类型的伸缩活动即使在冷却时间内也可以执行？',opts:['定时任务触发的伸缩活动','手工触发的伸缩活动','健康模式触发的伸缩活动','云监控报警任务触发的伸缩活动'],exp:'在冷却时间内，伸缩组会拒绝由云监控报警任务触发的伸缩活动请求。但其他类型任务(手动执行任务、定时任务)触发的伸缩活动可以立即执行，绕过冷却时间。参考链接：https://help.aliyun.com/document_detail/25912.html'},
  {id:1464,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(AutoScaling)，是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务。以下哪些应用场景可以由弹性伸缩实现？',opts:['用户根据自己的业务需求自动调整其弹性计算资源，在满足业务需求高峰增长时，自动增加ECS实例数量','用户根据自己的业务需求自动调整其弹性计算资源，在业务需求下降时自动减少ECS实例数量以节约成本','当伸缩组中的某个ECS实例发生故障时，弹性伸缩会创建新的ECS实例，接管故障ECS实例的计算任务','用户根据自己的业务需求，自动调整期弹性计算资源，在业务需求上升时，自动提高ECS的配置'],exp:'排除法，弹性伸缩(AutoScaling)是横向扩展，扩展的是云服务器ECS实例的个数，云服务器ECS实例的配置是不支持伸缩的。所以自动提高ECS的配置是错误的。'},
  {id:1465,type:'multi',answer:'ABCD',stem:'一个日访问量超过10万PV的小型门户网站想迁到阿里云上，该网站主要提供文字和图片类信息服务，已经实现了动静分离；希望2年内日PV超过100万，满足全国客户的快速访问。针对该业务场景，您建议选择以下哪几种阿里云产品？ 选项：',opts:['云服务器ECS','对象存储OSS','内容分发网络CDN','云数据库RDS','媒体转码(Media Transcoding)'],exp:'题目中需要将访问量超过10万PV的小型门户网站想迁到阿里云上，主要提供文字和图片类信息服务。已经实现了动静分离，目标是满足全中国网民的快速访问。1.需要ECS来搭建和运行网站服务；2.需要RDS来存储门户网站的用户数据。3.需要对象存储OSS来实现图片等信息的存储。4. 需要内容访问CDN来满足全中国网民的快速访问。'},
  {id:1466,type:'multi',answer:'AB',stem:'「1安全组具备状态检测和数据包过滤能力，可以基于安全组的特性和安全组规则的配置在云端划分安全域。下列符合安全组最佳实践的是',opts:['将安全组作为白名单使用，通过添加安全组规则设置允许访问的端口范围和授权对象','添加安全组规则时遵循最小授权原则','尽量将所有实例都加入同一个安全组，添加多条安全组规则集中管理','如需修改线上环境使用的安全组，建议直接修改，提升效率'],exp:'尽量将所有实例都加入同一个安全组，添加多条安全组规则集中管理。这种管理是不规范的管理，不方便个别业务需要修改安全组导致全部实例受到影响。如需修改线上环境使用的安全组，建议直接修改，提升效率。这样是不安全的行为，修改错误可能会导致线上服务无法访问。建议先在测试环境修改后再在线上环境修改。参考链接：https://help.aliyun.com/document_detail/25475.html'},
  {id:1467,type:'multi',answer:'AC',stem:'某企业使用阿里云的专有网络VPC构建了一个隔离的网络环境，并通过VPN专线将该网络与传统数据中心组成一个按需定制的网络环境，这样就可以把一些原来在传统数据中心中运行的应用平滑迁移到了阿里云上。现在需要从公网上接收用户请求，并使用阿里云的负载均衡SLB实例将这些请求分配到VPC中的多台云服务器ECS实例上去。以下哪些说法是正确的？',opts:['用户在VPC内创建负载均衡SLB实例，并挂载VPC内的ECS实例，为负载均衡SLB实例绑定一个EIP，即可实现负载均衡SLB实例接受公网请求，并将这些请求分发给后端ECS实例','用户在VPC内创建负载均衡SLB实例，并挂载VPC内的ECS实例，通过跳板机接收外部请求，然后将这些请求通过负载均衡SLB实例分发给后端ECS实例','用户创建公网IP的负载均衡SLB实例，挂载VPC中的ECS实例，这样来自于公网的请求就会被分流到VPC中的ECS实例上去处理','用户创建公网IP的负载均衡SLB实例，挂载VPC中的ECS实例和本地数据中心的服务器，这样来自于公网的请求就会被分流到VPC中的ECS实例以及本地数据服务器上去处理'],exp:'题目考察的是公网分发请求至SLB的正确方法，按照官方推荐应该是购买公网IP的负载均衡SLB实例接收公网请求，或者创建VPC内的负载均衡SLB实例，然后再给这个SLB绑定EIP来接收公网请求。用跳板机接收外部请求不规范且冗余，既然有了公网IP，就没有必要使用跳板机来接收公网请求。'},
  {id:1468,type:'multi',answer:'ABD',stem:'阿里云专有网络VPC产品是基于软件定义网络的技术实现的，具备以下哪些特点？',opts:['管理操作及配置实时生效','可以按需配置网络设置','网络访问控制规则固定，不能进行灵活的配置','无需购买硬件网络设备可以实现基本的网络设置'],exp:'VPC可以进行灵活的网络定义'},
  {id:1469,type:'multi',answer:'BCDEF',stem:'「您已经创建好的阿里云的云服务器ECS实例上部署了服务A，当服务A不再需要提供服务时，可以使用该云服务器部署服务B，如果服务A和B所需的操作系统不同，则需要更换该ECS实例的系统盘。在执行该操作的过程中，以下哪些说法正确的？',opts:['更换系统盘之后，您的云服务器ECS实例的IP地址会发生变化','在有数据盘的情况下，如果是Windows系统更换至Linux系统，由于Linux默认无法识别NTFS格式，需要您单独安装软件识别，例如ntfs-3G等','更换系统盘前云服务器ECS实例要处于已停止状态','在有数据盘的情况下，如果是Linux系统更换至Windows系统，由于Windows系统默认无法识别ext3，ext4，xfs等文件系统格式的磁盘，需要您单独安装软件识别，例如 ext2read ext2fsd 等','更换系统盘之后，您现有系统盘的自动快照及其上的数据会丢失','更换系统盘时可以选择用户自定义镜像、阿里云为您提供的公共镜像'],exp:'排除法，更换系统盘并不是导致网络层的IP地址会发生变化。'},
  {id:1470,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。在OSS里存储文件前首先要创建一个存储空间Bucket,之后才能在Bucket中进行文件的上传和管理。以下有关Bucket的描述中，哪些是正确的？',opts:['同一个Bucket内部的空间是扁平的，所有的对象都是直接隶属于其对应的Bucket','每个用户可以拥有多个Bucket','Bucket的名称在OSS范围内必须是全局唯一的，一旦创建之后无法修改','Bucket在创建时需要指定容量上限'],exp:'Bucket容量是没有上限的，所以无需在创建时指定。'},
  {id:1471,type:'multi',answer:'AB',stem:'专有网络VPC(VirtualPrivateCloud)是一个隔离的网络环境，专有网络之间逻辑上彻底隔离。以下关于VPC的说法，哪些是正确的？',opts:['不同专有网络之间内部网络完全隔离，可以通过对外映射的IP互连','每个VPC都有一个独立的隧道号，一个隧道号对应着一个虚拟化网络','可以像传统网络环境一样划分子网，每一个子网内部的不同云服务器使用同一个路由器互联，不同子网间使用交换机互联','专有网络内的ECS使用安全组防火墙进行二层网络访问控制'],exp:'每一个子网内部的不同云服务器使用同一个交换机互联，不同子网间使用路由器互联，答案中刚好说反；参考链接：https://help.aliyun.com/document_detail/34219.html'},
  {id:1472,type:'multi',answer:'ABC',stem:'【】专有网络VPC是用户在阿里云上创建的自定义的私有网络，不同的专有网络VPC之间彻底逻辑隔离。专有网络VPC可以提供以下哪些功能？',opts:['设置私有IP地址范围','划分网段','配置路由表','VPN连接'],exp:'VPC支持VPN连接但是这不是他提供的功能，VPN连接还是依赖于其他设备和网络。'},
  {id:1473,type:'multi',answer:'BCD',stem:'某企业云管理员购买了阿里云负载均衡SLB产品来消除系统中的单点故障，提升应用系统的可用性，同时购买了Web应用防火墙WAF来保障网站的业务安全和数据安全。但是配置完成后发现负载均衡SLB实例的服务地址访问超时，导致这个问题的可能的原因是',opts:['负载均衡SLB的监听配置中未开启会话保持功能','后端服务器accept队列满，导致后端服务器不回复syn_ack报文，客户端超时','SLB实例的服务地址被WAF安全防护','rp_filter特性和负载均衡底层LVS的策略路由产生冲突，导致访问出现异常。'],exp:'后端服务器accept队列满，导致后端服务器不回复syn_ack报文，客户端超时 https://help.aliyun.com/document_detail/175650.html rp_filter特性和负载均衡底层LVS的策略路由产生冲突 https://help.aliyun.com/document_detail/55206.html'},
  {id:1474,type:'multi',answer:'BC',stem:'在使用阿里云弹性伸缩(AutoScaling)中，用户希望能在某个时间点执行预设定的规则，如每',opts:['新建一个伸缩组','创建伸缩规则','创建定时任务','创建报警任务'],exp:'本题中伸缩组已经创建了，所以「创建一个伸缩组」不会选，要实现定时任务，需要创建一个规则且添加一个定时任务。和报警任务也没有任何关系哦。'},
  {id:1475,type:'multi',answer:'ABDF',stem:'「1某企业的安全工程师在使用Web应用防火墙WAF时，发现网站防护包含多个防护模块，接入防护的网站访问请求默认需要经过所有已开启的防护模块的检测。如果想实现精细化的管理，可以为不同网站防护模块单独设置白名单，让满足条件的请求忽略指定模块的检测。支持设置的模块白名单包括',opts:['应用防护白名单','Bot管理白名单','内容检测白名单','Web入侵防护白名单','CC防护白名单','数据安全白名单'],exp:'本题多选正确答案为ABDF。A（应用防护白名单）、B（Bot管理白名单）、D（Web入侵防护白名单）、F（数据安全白名单）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1476,type:'multi',answer:'ABCD',stem:'「1阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。以下哪几项属于OSS支持的文件上传方法？ 选项：',opts:['从OSS管理控制台直接上传','通过OpenAPI上传','通过SDK上传','通过云市场里的FTP工具上传','通过移动硬盘直接拷贝到OSS中'],exp:'排除法，OSS对象存储不支持从移动硬盘直接拷贝到OSS中去。'},
  {id:1477,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(AutoScaling)，是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务。可以提供以下哪些功能？',opts:['根据客户业务需求横向扩展云服务器ECS实例的数量，即自动增加或减少云服务器ECS实例','支持负载均衡SLB配置:在增加或减少云服务器ECS实例时，自动向负载均衡SLB实例中添加或移除相应的云服务器ECS实例','支持云数据库RDS访问白名单:在增加或减少云服务器ECS实例时，自动向云数据库RDS访问白名单中添加或移出该云服务器ECS实例的IP','根据客户业务需求提升或者缩减单个云服务器ECS实例的配置(包括内存大小、CPU个数等)'],exp:'排除法，弹性伸缩(AutoScaling)是横向扩展，扩展的是云服务器ECS实例的个数，云服务器ECS实例的配置是不支持伸缩的。所以根据客户业务需求提升或者缩减单个云服务器ECS实例的配置(包括内存大小、CPU个数等)是错误的。'},
  {id:1478,type:'multi',answer:'AC',stem:'安全组用于设置单台或多台云服务器的网络访问控制，错误配置的安全组规则可能会导致ECS实例在私网或公网与其他设备之间的访问失败，包括但不限于以下哪些项？',opts:['无法从本地远程连接(SSH)Linux实例','无法远程ping ECS实例的内网IP','无法通过HTTP或HTTPS协议访问ECS实例提供的Web服务','无法通过内网访问其他地域的RDS实例'],exp:'本题多选正确答案为AC。A（无法从本地远程连接(SS）、C（无法通过HTTP或HTT）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1479,type:'multi',answer:'ABC',stem:'创建阿里云的云服务器ECS实例时，要根据您的业务需求进行实例规格和配置的选择。下列说法中关于实例选择的描述中，哪些是正确的？',opts:['企业级异构计算规格族群可以提供更好的浮点运算性能','实例均为I/O优化实例，可以发挥磁盘的更好性能','如果您要使用Windows系统的ECS实例部署Web环境，建议选择至少2GB或更高内存的实例规格','需要单独开通云盾的基础防护服务'],exp:'排除法，云盾的基础防护服务在ECS创建完成后自动开通，不需要单独开通。'},
  {id:1480,type:'multi',answer:'ABCD',stem:'1阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。OSS服务的使用费由包“存储费用”、“流量费用”、“API请求费用”三部分组成。在实际业务场景中，用户可以根据实际情况优化使用方式来降低OSS的使用成本。以下是某管理员提出的几项优化建议，您认为哪几项可以直接降低OSS使用成本？',opts:['如果OSS服务产生的费用中外网流量费用占比较大，可以结合阿里云CDN服务来降低OSS的流量费用','如果云服务器ECS和OSS在同一地域，可以使用OSS内网地址通信，降低流量费用','如果业务的访问量比较平稳，存储空间和外网流量可预测，可以购买包年包月的资源包来降低存储和流量两项费用','定期删除已经过期不用的文件，降低占用的OSS存储空间，节约存储费用','对OSS的大批量操作尽量安排在晚上，夜间的API请求费用更低'],exp:'排除法，OSS是收费是统一的，不会因为时间的差异而导致相应的费用差异。'},
  {id:1481,type:'multi',answer:'BD',stem:'Web应用防火墙WAF可以有效识别Web业务流量的恶意特征，在对流量清洗和过滤后，将正常、安全的流量返回给服务器，避免网站服务器被恶意入侵导致性能异常等问题。WAF支持使用和两种方式，可以根据实际业务场景，选择适当的接入方式。',opts:['IP地址接入','透明接入','端口接入','CNAME接入'],exp:'WAF支持使用CNAME接入和透明接入两种方式,默认支持HTTP 1.0、HTTP 1.1和HTTP 2.0。您可以根据实际业务场景,选择适当的接入方式。https://help.aliyun.com/document_detail/162902.html'},
  {id:1482,type:'multi',answer:'BC',stem:'1在CDN中，源站决定了回源时请求到哪个IP，回源HOST决定回源请求访问到该IP上的哪个站点。以下关于源站和回源HOST的描述中，哪些是错误的？',opts:['源站为Www.a.com,回源HOST为www.b.com,那么实际回源是请求到www.a.com解析到的P,即对应的主机上的站点www.b.com','源站为www.a.com,回源HOST为www.b.com,那么实际回源是请求到www.b.com解祈到的lP,即对应的主上的站点Www.a.com','源站为1.1.1.1，回源HOST为ww.b.com那么实际回源的是www.b.com对应的主机1.1.1.1上的站点','源站为1.11.1，回源HOST为www.b.com,那么实际回源的是.1.1.1对应的主机上的站点www.b.com'],exp:'源站和回源HOST的区别：源站：源站决定了回源时请求到的具体P地址。回源HOST:回源HOST决定了回源请求访问到该P地址上的具体站点。参考链接：https://help.aliyun.com/document_detail/27131.html'},
  {id:1483,type:'multi',answer:'AB',stem:'OSS通过服务器端加密机制，提供静态数据保护。适合于对于文件存储有高安全性或者合规性要求的应用场景。例如，深度学习样本文件的存储、在线协作类文档数据的存储。针对不同的应用场景，OSS支持以下哪几种服务器端加密方式？',opts:['使用KMS托管密钥进行加解密','使用OSS完全托管加密','ECS上部署OSS_SDK应用进行加解密','源站位于ECS.使用ECS加密云盘即可实现'],exp:'本题多选正确答案为AB。A（使用KMS托管密钥进行加）、B（使用OSS完全托管加密）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1484,type:'multi',answer:'AB',stem:'ECS自建数据库进行迁移可以使用DTS工具来进行，DTS迁移工具支持以下哪几种类型的数据库？',opts:['RDBMS','NoSQL','OcenBase','DB2'],exp:'官网原话：数据传输服务（DataTransmissionService，简程DTS）是阿里云提供的支持RDBMS、NoSQL、OLAP等多种数据源之间数据交互的数据服务。本文以MySQL数据库为例，介绍如何配置DTS迁移任务，实现ECS实例上自建数据库间的数据迁移。'},
  {id:1485,type:'multi',answer:'BC',stem:'某用户通过设置期望实例数功能，设定了伸缩组内的ECS实例数量。在期望实例数检查任务触发扩缩容活动时，以下哪几项可以并行执行的伸缩活动？',opts:['手动执行再均衡分布','手动添加实例','手动移出实例','报警任务触发执行的伸缩活动'],exp:'存在执行中的并行伸缩活动时，可以执行其它并行伸缩活动。包括通过以下方式触发的伸缩活动：手动执行伸缩规则、通过定时任务执行伸缩规则，手动添加实例、手动添加实例、手动移除实例、期望实例数检查任务、实例健康检查任务、最大最小值检查任务。'},
  {id:1486,type:'multi',answer:'AB',stem:'负载均衡支持创建HTTPS监听，并且提供了统一的证书管理服务，用户可以将证书上传到负载均衡，支持上传PEM格式的服务器证书和CA证书，以下哪些说法是正确的？',opts:['服务器证书需要上传证书内容和私钥','CA证书只需要上传证书内容','CA证书需要上传证书内容和私钥','服务器证书只需要上传证书内容'],exp:'参考链接：https://help.aliyun.com/document_detail/85954.html'},
  {id:1487,type:'multi',answer:'AC',stem:'某网络公司的运维人员，购买了一台ECS服务器，并且已经进入到服务器中完成了应用软件的部署，现在他想要一台部署了同样应用的服务器，可以采用以下哪些方法来快速达到该目的？',opts:['利用系统盘制作自定义镜像来生成一台新的服务器','直接购买一台新的服务器，重新部署','利用系统盘生成快照来制作自定义镜像之后，生成一台新的服务器','寻找专业的运维人员，达到快速部署的目的'],exp:'只有通过生成镜像的方式最为高效快速。'},
  {id:1488,type:'multi',answer:'ABCE',stem:'某小型礼品电商网站部署在阿里云上，包含4台包年包月云服务器ECS实例、负载均衡SLB实例和RDS实例。在双十一、情人节等时期需要应对客户抢购行为，这些时段并发量会是平时的3-10倍。为了应对业务高峰，该公司准备采用弹性伸缩服务创建伸缩组，可以配置哪些信息？',opts:['关联的RDS实例','伸缩组内ECS实例的最小值','关联的负载均衡服务实例','RDS实例的配置','伸缩组内ECS实例的最大值','伸缩组内ECS的最大配置'],exp:'排除法，题目问的是:创建伸缩组，可以指定哪些配置。1.在创建伸缩组时候可以配置RDS的实例，但是并不能指定RDS的实例的配置，RDS的实例的配置需要在购买RDS的时候来指定的。2. 在创建伸缩组时只支持指定ECS的指定配置，不支持指定ECS的最大配置。'},
  {id:1489,type:'multi',answer:'ACD',stem:'在使用阿里云ECS的过程中，经常会遇到关于磁盘的操作，以下关于磁盘的操作实践，哪些是错误的？',opts:['更换系统盘，原系统盘快照也会随之丢失','无论是包年包月还是按量付费的ECS实例都支持更换系统盘操作','ECS实例在任何状态下都可以允许更换系统盘操作','更换系统盘，原系统的所在实例的ID也会发生变化','当用户释放云盘时，存储系统立即销毁元数据，确保无法继续访问数据'],exp:'ECS只有处于已停止状态可以更换系统盘；更换系统盘，实例ID不会发生变化，更换系统盘，原系统盘的快照不会删除。'},
  {id:1490,type:'multi',answer:'AD',stem:'云解析DNS是一种安全、快速、稳定、可扩展的权威DNS服务。云解析DNS是由和两部分组成，来实现域名解析功能。',opts:['解析数据层','节点层','配置层','管控层'],exp:'云解析DNS是由管控层和解析数据层两部分组成,管控层：云解析DNS为客户提供可视化的域名解析管理平台，可以帮助客户实现快速关系域名解析的增删改查。解析数据层：云解析DNS会将客户在管控层的解析配置，实时同步到云解析DNS在全球部署的解析服务器节点上。'},
  {id:1491,type:'multi',answer:'BCD',stem:'阿里云官网有很多阿里云内容分发网络CDN与其它云产品组合的方案与业务场景供用户参考。以下选项中，哪些场景适合使用阿里云内容分发网络CDN?',opts:['日访问次数低于100的BBS论坛','日访问次数大于10万次的阿里云虚拟主机纯静态站点','某中型电商类网站中的图片、html、css、js文件','新闻门户网站，日访问人数超过3000万次，用户遍布全国各地'],exp:'日均低于100的访问次数，不适合用CDN，因为热点不够，可能不足够形成CDN热点文件。同时从成本出发也不适合使用。'},
  {id:1492,type:'multi',answer:'ACD',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。为了方便用户把OSS服务集成到自己的网站或应用中，OSS提供了“自定义域名绑定”的功能，用户可以通过自己的域名来访问OSS中的文件（如：http://img.mydomain.net/xxxx)。以下关于OSS绑定域名的说法中，哪些是正确的?',opts:['不管域名是否在阿里云管理，绑定到OSS的域名必须在工信部备案','如果在OSS绑定域名时提示绑定的域名已经被其他用户绑定，此时用户无需额外操作即可进行强制绑定','如果用户绑定的域名和OSS服务在同一个阿里云帐号中管理，在OSS管理控制台中可以选择自动添加或修改域名的CNAME记录','绑定域名的时候可以选择“自动”或“手动”添加域名解析'],exp:'在OSS绑定域名时提示绑定的域名已经被其他用户绑定，需要验证域名所有权后才可继续进行绑定操作。参考链接：https://help.aliyun.com/knowledge_detail/39675.html'},
  {id:1493,type:'multi',answer:'ABC',stem:'您可以根据业务的需要，选择采用手动或者镜像的方式进行阿里云的云服务器ECS实例的使用环境的部署。针对这两种部署方式，以下哪些说法是正确的？',opts:['阿里云的云市场提供了丰富的镜像资源，大部分镜像都集成了操作系统和应用程序','在创建ECS实例时，可以选择云市场的镜像来快速获得所需的应用程序，无需自行安装，如PHP，MySQL等','如果您需要个性化定制的运行环境，可以使用手动部署','如果您使用镜像市场的镜像来重新初始化ECS实例，可以通过更换系统盘来完成操作，同时数据盘的数据也会受到影响'],exp:'更改系统盘操作，只会影响系统盘的数据，数据盘的数据不会受到任何影响。'},
  {id:1494,type:'multi',answer:'ACD',stem:'阿里云内容分发网络CDN节点的系统关键组件有哪些？',opts:['LVS','origin','tengine','swift'],exp:'LVS做四层均衡负载；Tengine做七层负载均衡；Swift做参考链接：http缓存。参考链接：http://docs-aliyun.cn-hangzhou.oss.aliyun-inc.com/pdf/cdn-brief-manual-cn-zh-2016-05-11.pdf'},
  {id:1495,type:'multi',answer:'BCD',stem:'阿里云快照可以为所有类型的云盘创建崩溃一致性快照，是一种便捷高效的数据容灾手段。快照是云盘的重要功能，是某一时间点一块云盘的数据状态文件。以下关于快照使用场景的描述，哪些是正确的？',opts:['某阿里云用户需跨地域迁移磁盘数据','某阿里云用户需跨可用区迁移磁盘数据','某公司需要对ECS系统盘中的数据做定期备份','某公司需要对ECS数据盘中的数据做定期备份','某电商公司使用AutoScaling做自动弹性伸缩，应对流量峰值','某公司需要将数据库平滑迁移到阿里云上'],exp:'本题多选正确答案为BCD。B（某阿里云用户需跨可用区迁）、C（某公司需要对ECS系统盘）、D（某公司需要对ECS数据盘）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1496,type:'multi',answer:'BCD',stem:'阿里云云防火墙是一款云平台SaaS化的防火墙，可统一管理南北向和东西向的流量。云防火墙支持防护的范围包括',opts:['其他第三方公有云之间的流量访问控制','VPC和本地数据中心之间的访问流量控制','EIP、SLB公网IP、ECS公网等公网资产的入方向和出方向流量进行访问控制','VPC到VPC之间的流量访问控制','本地同城数据中心之间的流量访问控制'],exp:'云防火墙可以防护以下云资产或流量：互联网边界防火墙（南北向），VPC边界防火墙（东西向），主机边界防火墙。https://help.aliyun.com/document_detail/90216.html'},
  {id:1497,type:'multi',answer:'BC',stem:'DDoS原生防护是一款直接提升阿里云云产品DDoS防御能力的安全产品。相比于DDoS高防，DDoS原生防护可以直接把防御能力加载到云产品上，下列关于DDoS防护说法正确的是',opts:['购买DDoS原生防护企业版后，需要配置业务的DNS域名解析调度到阿里云防护网络中','DDoS原生防护提供基础版默认为阿里云资源公网IP免费开启，无需购买','DDoS原生防护企业版实例的地域必须与需要防护的阿里云公网IP资产地域一致','使用DDoS原生防护的云产品需要更换IP地址'],exp:'基础版：默认为阿里云公网IP资产免费开启，无需购买。提供不超过5 Gbps的DDoS基础防护能力。 https://help.aliyun.com/document_detail/63651.html(https://help.aliyun.com/document_detail/63651.html?spm=a2c4g.750001.0.i3) DDoS原生防护企业版实例的地域必须与云资源的地域一致。 https://help.aliyun.com/document_detail/179118.html(https://help.aliyun.com/document_detail/179118.html?spm=a2c4g.63651.0.i5)'},
  {id:1498,type:'multi',answer:'ACD',stem:'您已经创建好了阿里云的云服务器ECS Linux实例，并承担该云服务器的系统管理员角色，当发生无法远程连接该云服务器ECS实例时，以下哪些是正确的操作？',opts:['如果在本地无法telnet到云服务器ECS实例的SSH远程端口，可以通过管理控制台的远程终端登陆到云服务器ECS实例后，查看云服务器上的ssh服务是否正常启动','检查本地客户端的TCP端口21对外网络访问是否正常','查看云服务器ECS实例上的防火墙是否拦截了SSH端口，可以先关闭防火墙进行测试','查看云服务器ECS实例上是否运行NetworkManager的服务，这个服务可能会影响到您的网络，可以使用Service NetworkManager Stater查看服务状态'],exp:'21号端口为ftp端口，ssh服务需要检查的端口为22号端口,程登录Linux实例时的排查指引。参考链接：https://help.aliyun.com/knowledge_detail/41470.html'},
  {id:1499,type:'multi',answer:'ACD',stem:'1某在线广告提供商使用机器学习精准投放广告，在业务高峰期会临时需要大量计算资源，成本较高；同时可能存在ECS实例库存不足、手动创建ECS实例操作仓促、ECS实例临时停止服务等问题，存在一定的业务受损风险。您推荐选用以下哪几种方案满足业务需求？',opts:['通过弹性伸缩将计算节点分散在多个可用区，同时指定多种实例规格','使用抢占实例，以低成本购买ECS实例','通过弹性伸缩监控负载变化并实现自动创建ECS实例','针对日常业务流量，购买包年包月ECS实例'],exp:'本题多选正确答案为ACD。A（通过弹性伸缩将计算节点分）、C（通过弹性伸缩监控负载变化）、D（针对日常业务流量，购买包）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1500,type:'multi',answer:'CDE',stem:'阿里云的云服务器ECS实例的可用区是指在同一地域内，电力和网络互相独立的物理区域。关于云服务器ECS可用区的说法，哪些是正确的？',opts:['如果您的应用需要较高的容灾能力，建议您将云服务器ECS实例部署在同一地域的同一可用区内','如果您的应用在ECS实例之间需要非常低的网络时延，则建议您将ECS实例创建在不同的可用区内','是否将云服务器ECS实例放在同一个可用区内，主要取决于对容灾能力和网络延时的要求','同一可用区内的ECS实例之间的网络延时更小','在同一地域内不同可用区之间内网互通，可用区之间能做到机房级别的故障隔离'],exp:'看清题意，如果您的应用需要较高的容灾能力，建议您将云服务器ECS实例部署在同一地域的不同可用区内；如果您的应用在ECS实例之间需要非常低的网络时延，则建议您将ECS实例创建在相同的可用区内。'},
  {id:1501,type:'multi',answer:'BCF',stem:'某企业的应用管理员计划使用阿里云云数据库RDS作为内部ERP系统的数据库，该管理员了解到云数据库RDS提供三种数据存储类型，分别是和可以根据性能需求进行灵活选择。',opts:['高效云盘','ESSD云盘','本地SSD盘','文件存储NAS','对象存储OSS','SSD云盘'],exp:'云数据库RDS提供三种数据存储类型：ESSD云盘、本地SSD盘和SSD云盘。https://help.aliyun.com/document_detail/69795.html'},
  {id:1502,type:'multi',answer:'AD',stem:'某企业在本地数据中心自购服务器搭建了MySQL，使用一段时间后觉得管理成本很高，运维麻烦，扩展也不灵活。为彻底解决数据库运维的烦恼，该企业的管理员决定将本地MySQL迁移到阿里云云数据库RDS实例中，关于该数据库的迁移以下说法正确的是',opts:['可以使用数据传输服务DTS，将自建MySQL迁移至RDS MySQL实例中','DTS只支持全量数据迁移，不支持增量数据迁移','RDS MySQL实例的存储空间可以小于自建MySQL数据库占用的存储空间，RDS MySQL实例会自动扩容','对于迁移失败的任务，DTS会触发自动恢复'],exp:'DTS会尝试恢复七天之内迁移失败任务.https://help.aliyun.com/document_detail/211612.html'},
  {id:1503,type:'multi',answer:'AC',stem:'阿里云基于软件定义网络SDN架构下的三层Overlay技术和交换机虚拟化技术，将物理专线的接入端口隔离起来，并抽象成边界路由器VBR，下列关于VBR说法正确的是',opts:['作为VPC和本地IDC的中间路由器，负责交换数据包','VBR支持源地址策略路由','在三层子接口模式下，可以识别或附加VLAN标签','每个VBR可以创建多张路由表，实现灵活的路由管理'],exp:'作为VPC和本地IDC的中间路由器，负责交换数据包。 决定物理专线端口模式为三层路由接口或基于VLAN的三层子接口。 在三层子接口模式下，可以识别或附加VLAN（Virtual Local Area Network）标签。 支持边界路由协议BGP（Border Gateway Protocol）。 BGP是一种基于TCP协议的动态路由协议，主要应用于不同自治域间交换路由信息和网络可达信息。在物理专线接入的过程中，您可以使用BGP实现本地IDC与VBR之间的内网互连，实现更高效、灵活且可靠地搭建混合云。 VBR支持IPv4和IPv6 BGP。 使用限制 不支持源地址策略路由。 每个VBR有且只有一张路由表。 VBR支持的BGP版本为BGP-4。 每个VBR下最多建立8个BGP邻居。 每个BGP邻居的动态路由条数上限为110条。超过上限的路由将被丢弃，无法接收。 通过BGP协议连接VPC时，您需要为阿里云侧分配独立的AS号，不能和云平台内部交换机的AS号重复。 https://help.aliyun.com/document_detail/44854.html?spm=a2c4g.116227.0.0.682d160fUtX3kE(https://help.aliyun.com/document_detail/44854.html?spm=a2c4g.116227.0.0.682d160fUtX3kE)'},
  {id:1504,type:'multi',answer:'AC',stem:'加密服务是云上的硬件加密解决方案，通过使用加密服务，可运用多种加密算法对云上业务数据进行可靠的加解密运算，实现数据保护，加密服务支持的密码机类型包括和签名验证服务器SVSM',opts:['金融数据密码机EVSM','个人数据密码机PVSM','通用数据密码机GVSM','集群数据密码机CVSM'],exp:'包括金融数据密码机EVSM、通过服务器密码机GVSM和签名验证服务器SVSM。https://help.aliyun.com/document_detail/296030.html'},
  {id:1505,type:'multi',answer:'BC',stem:'某社交平台的用户每天会上传大量的图片，图片上传后会存储于OSS对象存储服务的Bucket中。为了快速监控新增的图片是否涉及色情、涉政暴恐等，该平台使用内容安全OSS违规检测功能，当检测到违规时可以进行冻结，冻结方式支持',opts:['将OSS中的违规文件进行屏蔽','将OSS中的违规文件进行删除','将OSS中的违规文件访问权限设置为私有','将OSS中的违规文件移动到bucket中的其他目录下'],exp:'本题多选正确答案为BC。B（将OSS中的违规文件进行）、C（将OSS中的违规文件访问）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1506,type:'multi',answer:'ABCE',stem:'您需要在阿里云上创建云服务器ECS实例，以下哪些因素可能导致您创建的云服务器ECS实例产生的费用不同？',opts:['云服务器ECS实例的镜像类型','云服务器ECS实例的公网带宽不同','云服务器ECS实例的地域','将要部署在云服务器ECS实例上的应用不同','云服务器ECS实例的付费模式'],exp:'排除法，可以了解一下ECS的费用组成部分，即哪些配置会影响到ECS的价格。很显然，部署在ECS上面的不同应用是属于系统软件部分，不会影响到ECS的费用。'},
  {id:1507,type:'multi',answer:'ABCE',stem:'C公司在传统IDC机房有一套应用系统，用了共计50多台服务器，运维成本越来越高，希望迁到阿里云降低资产拥有成本和运维成本。该系统的硬件包括30台Web服务器、5台MySQL数据库服务器、5台文件存储服务器、5台自建LVS负载均衡、5台数据备份服务器。C公司要想在系统功能不损失的前提下上云，应该选用阿里云的哪些产品？',opts:['云服务器ECS','云数据库RDS','对象存储OSS','弹性伸缩Auto Scaling','负载均衡SLB'],exp:'题目中的系统的硬件分别对应，30台WEB服务器对应云服务器ECS、5台MySQL数据库服务器对应云数据库RDS、5台文件存储服务器对应对象存储OSS、5台自建LVS负载均衡对应负载均衡SLB、5台数据备份服务器是不需要的，因为ECS和OSS提供了多重冗余备份。'},
  {id:1508,type:'multi',answer:'AD',stem:'「如果客户的应用访问量很高，可以通过配置（）将流量分发到不同的ECS实例上。此外，还可以使用（）功能将同一客户端的请求转发到同一台后端ECS，提高访问效率。',opts:['会话保持','流量保持','分发流量','监听规则'],exp:'官网原话，如果您的应用访问量很高，您可以通过配置监听规则将流量分发到不同的云服务器ECS（ElasticComputeService）实例上。此外，您可以使用会话保持功能将同一客户端的请求转发到同一台后端ECS，提高访问效率。参考链接：https://help.aliyun.com/document_detail/27543.html'},
  {id:1509,type:'multi',answer:'AB',stem:'负载均衡通过健康检查来判断后端服务器（ECS实例)业务可用性。为了避免频繁的健康检查失败导致系统切换，健康检查只有在健康检查时间窗内连续多次检查成功或失败后，才会进行状态切换。对于TCP/HTTP/HTTPS监听，推荐以下哪几种健康检查配置？',opts:['响应超时时间 5秒','健康检查间隔 2秒','响应超时时间 10秒','健康检查间隔 5秒'],exp:'健康检查间隔UDP监听的默认值为5秒，参考链接：http/参考链接：httpS/TCP监听的默认值为2秒。 响应超时时间UDP监听的默认值为10秒，参考链接：http/参考链接：httpS/TCP监听的默认值为5秒'},
  {id:1510,type:'multi',answer:'ABC',stem:'「B公司想基于阿里云的产品构建一个纯Web版本的网盘，用于公司内3千名员工的内部文件的存储和分享。要求员工能在线上传和下载文件，并查看文件列表，员工之间可以授权共享查看和下载，存储容量为10TB。那么B公司应该选用阿里云的哪些产品来保证网盘的可扩展性？',opts:['云数据库RDS，保存文件基本信息、下载链接、员工信息等','云服务器ECS，运行网盘应用程序','对象存储OSS，保存网盘里的文件','内容分发网络CDN，缓存热点文件'],exp:'因为是一个公司的员工，不存在分布在全国各地的情况，所以不需要用到内容分发网络CDN。其他的ECS，RDS，OSS都需要用到。'},
  {id:1511,type:'multi',answer:'ABC',stem:'1对象存储服务（Object Storage Service，OSS）是一种海量、安全、低成本、高可靠的云存储服务，支持不同的存储类型，以下哪几种场景适合使用标准存储类型？ 选项：',opts:['社交类图片','分享类图片','大数据分析','企业数据的长期备份','档案数据'],exp:'本题多选正确答案为ABC。A（社交类图片）、B（分享类图片）、C（大数据分析）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1512,type:'multi',answer:'ABD',stem:'专有网络VPC类型的ECS实例支持两种公网IP地址，分别是ECS系统分配的公网IP地址(NatPublicIP)和弹性公网IP(EIP)地址。关于两种公网IP地址说法，哪些是正确的？',opts:['如果用户希望长期使用某个公网IP地址，根据业务需要将它绑定到指定的ECS实例上，建议用户选择EIP地址','在实例的使用期间，将带宽值设置为0Mbit/s，可以释放NatPublicIP','一台ECS实例可以关联多个NatPublicIP或EIP','如果希望释放实例时公网IP地址随实例一起释放，可以选择NatPublicIP','如果ECS实例绑定了EIP地址，用户可在实例内部查询到公网网卡'],exp:'本题多选正确答案为ABD。A（如果用户希望长期使用某个）、B（在实例的使用期间，将带宽）、D（如果希望释放实例时公网I）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1513,type:'multi',answer:'BCDE',stem:'您计划基于阿里云的云服务器ECS实例搭建一个网站，以下哪些因素可能会影响网站打开速度？',opts:['云服务器ECS实例的磁盘大小','是否有大量数据库的操作','网络的带宽','网页内容本身的大小','是否过多引用了其他网站的内容'],exp:'排除法，云服务器ECS实例的磁盘大小是不会影响到网站的访问速度的。'},
  {id:1514,type:'multi',answer:'ABC',stem:'「1在使用阿里云的云服务器ECS实例的过程中，如果您的业务需求发生变化，可能需要进行重置操作系统或者磁盘，在操作前需要注意提前备份对应磁盘里的数据。在进行上述的重置操作时，以下哪些说法是正确的？',opts:['阿里云的云服务器ECS服务在重置启动前不会为您的实例和磁盘做自动备份','可以进行重置操作的前置条件是该ECS实例需要处于“已停止”的状态','使用阿里云提供的公共镜像重置后需要对业务进行重新部署,包括应用的安装和配置,以尽快恢复业务','重新初始化系统盘会影响数据盘的数据'],exp:'排除法，重新初始化系统盘对数据盘中的数据并没有影响。'},
  {id:1515,type:'multi',answer:'CD',stem:'「1数据可恢复性是判断数据库运维可靠性的关键指标。云数据库RDS默认提供和两种恢复功能。可支持用户将一定时间内内任意一个时间点的数据恢复到RDS临时实例或克隆实例上，数据验证无误后即可将数据迁回RDS主实例，从而完成数据回溯。',opts:['按数据库实例恢复','按逻辑库表恢复','按备份集恢复','按指定时间点恢复'],exp:'https://help.aliyun.com/document_detail/53622.html'},
  {id:1516,type:'multi',answer:'CD',stem:'对象存储服务(ObjectStorageService，OSS)是一种海量、安全、低成本、高可靠的云存储服务，文件元信息(ObjectMeta)是对上传到OSS的文件的属性描述，若用户需要修改已上传Object的元数据，可采用以下哪几种方式？',opts:['在OSS控制台修改Object的属性值','使用OSS API中的ModifyObjectMeta方法进行修改','将Object下载到本地，删除原来的Object，重新上传更改元数据后的Object','通过CopyObject或者UploadPartCopy接口对Object进行拷贝，修改目标文件的元数据，再将源文件删除。'],exp:'本题多选正确答案为CD。C（将Object下载到本地）、D（通过CopyObject）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1517,type:'multi',answer:'AC',stem:'阿里云内容分发',opts:['需要在DNS解析服务商添加一条CANME记录，将自己的加速域名指向CDN加速域名','一个网站如果采用多台服务器部署，则需要把所有服务器的IP都加入CDN服务','通过HTTPS访问CDN时，需要将证书配置到CDN','通过HTTPS访问CDN时，源站必须配置SSL证书'],exp:'本题多选正确答案为AC。A（需要在DNS解析服务商添）、C（通过HTTPS访问CDN）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1518,type:'multi',answer:'AB',stem:'某用户在云上搭建ECS+SLB+RDS业务应用架构，同时使用了AutoScaling服务对服务资源ECS进行弹性扩展和收缩。因业务需要，用户需要使用开通云数据库Redis作为热点数据的缓存存储，保证应用对数据的高速访问。但由于AutoScaling伸缩组暂不能关联Redis实例，用户需手动配置ECS实例加入或移出Redis实例的访问白名单，费时费力且效率较低。以下哪些选项可以帮助用户实现ECS实例的自动加入和移出Redis实例白名单？',opts:['弹性伸缩生命周期挂钩','OOS模板','MNS','实例启动模板'],exp:'伸缩组支持关联负载均衡实例和RDS实例，但是暂时不能关联Redis实例。如果您有业务数据存储在Redis：实列上，手动配置ECS实例加入或移出Rdis实例白名单，操作效率较低。您可以通过生命周期挂钩和OOS模板将CS实例自动加入和移出Redis:实例白名单。参考链接：https://help.aliyun.com/document_detail/102410.html'},
  {id:1519,type:'multi',answer:'ABD',stem:'OSS是按使用收费的服务，为了防止用户在OSS上的数据被其他人盗链，OSS支持基于HTTP header中表头字段referer的防盗链方法。下列关于OSS防盗链的说法中，哪些是正确的？',opts:['Referer参数支持通配符“∗”和“？”','白名单为空时，不会检查referer字段是否为空。','在支持通配符中，可以使用问号“？”代替0个或多个字符','白名单不为空，且设置了不允许referer字段为空的规则；则只有referer属于白名单的请求被允许，其他所有的请求会被拒绝。'],exp:'在支持通配符中，正确是用星号∗:代替0个或多个字符。参考链接：https://help.aliyun.com/document_detail/44198.html'},
  {id:1520,type:'multi',answer:'BC',stem:'开启OSS的存储空间（Bucket)版本控制特性后，针对数据的覆盖和删除操作将会以历史版本的形式保存下来，以下关于该特性的描述中，哪些是正确的？',opts:['Bucket开启版本控制，可与设置合规保留策略搭配使用','Bucket开启版本控制后，被覆盖或删除的文件都会成为历史版本被保存下来','开启Bucket版本控制后，无法返回到非版本化状态','开启Bucket版本控制后，如存储费用提升过快，可返回到非版本化状态'],exp:'本题多选正确答案为BC。B（Bucket开启版本控制）、C（开启Bucket版本控制）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1521,type:'multi',answer:'CD',stem:'下列ECS实例的生命周期状态中，哪些属于中间状态？',opts:['已过期','运行中','停止中','重置中'],exp:'云服务器ECS的运行中和已过期属于稳定状态。'},
  {id:1522,type:'multi',answer:'BF',stem:'某企业在阿里云上购买了云数据库RDSMySQL实例作为业务系统的数据库使用，在使用的过程中，由于各种原因需要对实例进行变更，关于实例变更下列说法正确的是',opts:['升级主实例配置时，只读实例会自动升级','进行变更配置操作的实例状态需要是运行中','变配操作需要手动重启实例','实例变更配置支持升配或降配','实例不支持变更存储空间','变更配置后实例的连接地址不会变化'],exp:'https://help.aliyun.com/document_detail/95665.html'},
  {id:1523,type:'multi',answer:'BCD',stem:'「下面关于OSS简单上传的描述中，哪些是正确的？',opts:['支持断点上传','上传文件最大不超过5GB','在上传单个文件过程中可以携带meta信息','基于PUT方式的http请求上传'],exp:'简单上传指的是使用OSSAPI中的PutObject方法上传单个文件(Object)。简单上传不需要支持断点上传。简单上传适用于一次参考链接：http请求交互即可完成上传的场景，比如小文件(小于5GB)的上传。上传文件时支持设置Object Meta。参考链接：https://help.aliyun.com/document_detail/31848.html'},
  {id:1524,type:'multi',answer:'CD',stem:'「1某小企业的业务系统部署在阿里云ECS上，偶尔会遇到操作系统无响应、异常重启或者无法连接实例等问题，其运维人员需要对其进行排查，但是由于服务器ECS是虚拟化的云上服务，用户无法接入显示设备，也无法手动截屏，那么，推荐他采取以下哪些措施？',opts:['使用云监控服务，查看此故障的详细信息','使用阿里云日志服务SLS，对此类日志进行收集和分析','通过控制台实例详情页查看实例系统日志','通过控制台实例详情页查看实例屏幕截图'],exp:'您可以通过控制台实例详情页、控制台实例列表页面或者API查看实例日志和实例截图。参考链接：https://help.aliyun.com/document_detail/85535.html'},
  {id:1525,type:'multi',answer:'BD',stem:'对象存储服务(Object Storage Service，OSS)是一种海量、安全、低成本、高可靠的云存储服务，支持不同的存储类型。以下关于归档存储类型的描述中，哪些是正确的？',opts:['不支持图片处理','数据可靠性与标准存储类型相同','服务可用性与标准存储类型相同','不支持实时访问'],exp:'参考链接：https://help.aliyun.com/document_detail/51374.html'},
  {id:1526,type:'multi',answer:'BC',stem:'「1阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，可以通过流量分发扩展应用系统对外的服务能力，通过消除单点故障提升应用系统的可用性。阿里云的负载均衡SLB支持的网络协议有哪几层？ 选项：',opts:['3层(网络层)','7层(应用层)','4层(传输层)','2层(数据链路层)'],exp:'阿里云负载均衡SLB基于OSI模型设计，支持传输层和应用层协议。根据官方文档，负载均衡SLB实例分为两种类型：应用型（七层）和传统型（四层）。应用型支持HTTP、HTTPS等应用层协议，对应7层；传统型支持TCP、UDP等传输层协议，对应4层。网络层（3层）和数据链路层（2层）不属于SLB流量分发的协议层次。选项B（7层）和C（4层）符合阿里云SLB的功能定义。'},
  {id:1527,type:'multi',answer:'BCE',stem:'某公司使用阿里云对象存储OSS存储文件，其管理员经常发现文件丢失的情况，您建议其采取以下哪几种措施解决问题？',opts:['开启OSS的Logging日志，记录文件操作记录','开启跨区域复制功能，提高文件可靠性','开启服务器端加密功能，防止文件被误删','在访问日志中过滤DELETE关键字来定位删除操作','检查是否文件设置了LifeCyle生命周期规则'],exp:'以下情况可能会导致您的数据被删除： 1、生命周期规则 2、Bucket设置为允许所有人读写 3、拥有Bucket管理权限的账号泄露 4、管理人员误删参考链接：https://help.aliyun.com/document_detail/64070.html'},
  {id:1528,type:'multi',answer:'AC',stem:'阿里云的负载均衡SLB中的证书（Certificate)用于HTTPS协议，当需要使用加密传输时，用户可以将证书上传至负载均衡SLB实例中，在创建HTTPS协议监听时绑定证书，提供HTTPS服务。用户可以采取以下哪些方式上传证书？',opts:['通过负载均衡SLB的管理控制台上传','通过FTP服务上传','通过负载均衡SLB的API上传','先将证书上传至负载均衡SLB的后端服务器ECS实例上，负载均衡SLB会据此自动更新证书'],exp:'可以通过负载均衡的控台及负载均衡的API上传参考链接：httpS证书，控台上传参考链接:参考链接：https://help.aliyun.com/document_detail/32336.html，API上传参考链接:参考链接：https://help.aliyun.com/document_detail/34181.html'},
  {id:1529,type:'multi',answer:'ABD',stem:'云计算是一种商业计算模型，它将计算任务分布在大量计算机组成的资源池上，使各种应用系统能够根据需要获取计算力、存储空间和信息服务。以下关于云计算特点的说法中，哪些是正确的？',opts:['大规模','高可靠性','高费用支出','按需服务','仅支持单租户'],exp:'云计算的特点:大规模，虚拟化，高可靠性，通用性，按需服务，高可伸缩性，廉价性。云计算是支持多租户而不是仅支持单租户。'},
  {id:1530,type:'multi',answer:'BD',stem:'用户在创建了伸缩组之后，可以将已有的ECS实例手动添加至伸缩组，充分利用已有的计算资源。下列选项中的ECS实例，哪几项不能被手动加入到伸缩组？',opts:['与伸缩组相处于同一地域','伸缩组的网络类型为专有网络时，ECS实例为经典网络','状态为运行中','已加入到其他伸缩组中'],exp:'本题多选正确答案为BD。B（伸缩组的网络类型为专有网）、D（已加入到其他伸缩组中）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1531,type:'multi',answer:'CD',stem:'当您发现无法将指定的阿里云的块存储挂载到某台云服务器ECS实例上时，可能是以下哪些原因造成的？',opts:['云服务器ECS实例处于已停止状态','云服务器ECS实例没有公网IP','购买的块存储和云服务器ECS实例不在同一个可用区','云服务器ECS实例已经挂载的数据盘数量达到上限'],exp:'题目中所说的是无法将数据盘挂载到ECS上面，请分析一下原因。分析一下挂载云盘的注意事项:参考链接：https://help.aliyun.com/document_detail/25446.html，发现一台ECS实例最多能挂载16块云盘作数据盘用，且云盘只能挂载到同一地域下同一可用区内的实例上，不能跨可用区挂载。 参考链接：https://help.aliyun.com/document_detail/25446.html'},
  {id:1532,type:'multi',answer:'BC',stem:'阿里云的云服务器ECS实例在同一个地域内，不同账号下，经典网络下可以通过安全组规则设置两台云服务器之间内网互通。比如：UserA的用户在杭州有一台经典网络的ECS云服务器InstanceA(内网IP：A.A.A.A)，InstanceA所属的默认安全组为GroupA，，UserB的用户在杭州有一台经典网络的ECS云服务器InstanceB（内网IP：B.B.B.B)，InstanceB所属的默认安全组为GroupB。通过安全组配置实现InstanceA和lnstanceB在内网上互通，以下哪些是正确的操作？',opts:['UserB为GroupB添加一条这样的规则：在内网出方向上授权A.A.A.A的IP可以访问GroupB下的所有云服务器ECS实例','UserA为GroupA添加一条这样的规则：在内网入方向上授权B.B.B.B的IP可以访问GroupA下的所有云服务器ECS实例','UserB为GroupB添加一条这样的规则：在内网入方向上授权A.A.A.A的IP可以访问GroupB下的所有云服务器ECS实例','UserA为GroupA添加一条这样的规则：在内网出方向上授权B.B.B.B的IP可以访问GroupA下的所有云服务器ECS实例'],exp:'两台同一地域不同账号下的服务器，需要授权内网互通，只需要各自在自己的安全组入方向添加允许对方ECS的内网IP访问即可。'},
  {id:1533,type:'multi',answer:'BC',stem:'阿里云内容分发网络CDN建立并覆盖在承载网之上，由分布在不同区域的边缘节点服务器群组成的分布式网络，替代以WebServer为中心的数据传输模式。在cDN工作过程中，用户的访问请求首先会到达边缘节点，然后通过回源的方式从源站点抓取数据。以下关于阿里云CDN用户在源站服务器上获取“访客真实IP”的说法中，哪些选项是正确的？',opts:['只能通过修改用户应用程序的方法获取','“访客真实IP”保存在HTTP协议的“X—Forwarded-For”Header中，可以在Apache和Nginx的自定义LOG中直接获取到','Windows平台下，如果使用IIS，需要安装一个“F5XForwardedFor”的扩展模块，才能在日志里看到“访客真实IP”','在阿里云CDN的管理控制台中有一键开通“记录访客真实IP”的功能，用户设置了这个关开后，可以在访问日志中直接看到访客真实IP'],exp:'可查看官方文档获取客户端真实IP具体实现步骤。参考链接：https://help.aliyun.com/document_detail/42205.html'},
  {id:1534,type:'multi',answer:'CD',stem:'阿里云的弹性伸缩、云服务器ECS以及负载均衡SLB实例三者搭配可以实现高可用架构，可实现弹性伸缩和自动负载均衡，大大降低了成本，其中关于阿里云弹性伸缩的说法中，以下哪些是正确的？',opts:['同一个伸缩组中的云服务器ECS实例配置一定相同','同一伸缩组内，同一时刻可以有多个伸缩活动在执行','支持多种阿里云产品的动态伸缩，包括云服务器ECS、云数据库RDS、负载均衡SLB以及表格存储','伸缩模式丰富，可同时配置多种伸缩模式'],exp:'多模式并行，伸缩组内配置可以不同，同一时刻一个伸缩组内只能有一个伸缩活动，排除法选CD'},
  {id:1535,type:'multi',answer:'ADE',stem:'某企业想使用云服务器ECS+负载均衡SLB+弹性伸缩(AutoScaling)的架构搭建一个企业级的门户网站，技术负责人对于负载均衡和弹性伸缩配合使用没有经验，于是将他理解的两种产品配合使用的一些技术细节列成了一个表单，并请作为架构师的您帮他做一下鉴别，以下哪些项是正确的？',opts:['如果SLB实例已挂载了VPC(指阿里云专有网络，AliCloud VPC)类型的ECS实例，则不支持在该SLB下增加经典网络类型的ECS实例','创建伸缩组时指定的SLB实例必须和该伸缩组在同一个可用区(Zone)','创建伸缩组时指定的SLB实例的所有配置的监听端口必须开启健康检查','伸缩组会自动将加入伸缩组的ECS实例添加到指定的SLB实例当中','创建伸缩组时指定的SLB实例必须是已启用状态'],exp:'如果需要为伸缩组关联负载均衡实例，需确保您持有一个或多个处于运行中状态的负载均衡实例且负载均衡实例必须开启健康检查但并非所有，参考链接:参考链接：https://help.aliyun.com/document_detail/25882.html； SLB实例只能全部挂在经典网络或全部挂在专有网络，不可混挂； 在负载均衡SLB和弹性伸缩一起使用的时候，负载均衡实例和伸缩组必须位于同一地域。而不是必须在同一个可用区。参考链接:参考链接：https://help.aliyun.com/document_detail/101364.html'},
  {id:1536,type:'multi',answer:'AB',stem:'［Bucket是用户用于存储对象（Object）的容器，所有的对象都必须隶属于某个存储空间。存储空间具有各种配置属性，包括地域、访问权限、存储类型等。用户可以根据实际需求，创建不同类型的存储空间来存储不同的数据。下面关于Bucket的说法中，哪些是正确的？',opts:['Bucket的名称在整个OSS中具有全局唯一性，且不能修改','一个应用可以对应一个或多个Bucket','Bucket在整个OSS中的名称可以有多个，且不能修改','一个应用只能对应一个Bucket'],exp:'本题多选正确答案为AB。A（Bucket的名称在整个）、B（一个应用可以对应一个或多）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1537,type:'multi',answer:'AC',stem:'「某互联网金融应用需要对大量金融数据交换文件进行超大文本文件的结构化分析，期望达到分钟级的处理效率，您建议其采用以下哪几种阿里云方案？',opts:['将大量的金融数据交换文件存放在OSS上','使用DataLakeAnalytics，无需加载，即可对OSS中的文件进行结构化分析','通过MaxCompute的OSS外部表查询功能，将OSS上的文件加载到MaxCompute进行架构化分析','将OSS上的数据文件加载至DataLakeAnalytics进行结构化分析'],exp:'互联网金融应用每天都需要将大量的金融数据交换文件存放在OSS上，并需要进行超大文本文件的结构化分析。通过MaxCompute的OSS外部表查询功能，用户可以直接用外部表的方式将OSS上的大文件加载到MaxCompute进行分析，从而大幅提升整个链路的效率。参考链接：https://help.aliyun.com/document_detail/87392.html'},
  {id:1538,type:'multi',answer:'AB',stem:'「1CDN的URL预热功能是指将URL提前上传到CDN的L2节点上，再次访问时无需从源站获取资源，虽然预热没有直接提升L1的命中率，但是提升了CDN的真实命中率。下列场景中CDN缓存命中率均较低，哪几项适用于预热URL来提升命中率？',opts:['因加速域名流量较低导致从CDN缓存节点提前清除','业务高峰期，源站访问压力大，静态资源访问效率低','静态资源未返回响应头Etag，缓存失败','URL请求带有可变参数导致资源重新回源'],exp:'您可以在业务高峰前预热热门资源，也可以预热流量较低的加速域名，'},
  {id:1539,type:'multi',answer:'AC',stem:'「1服务器迁移中心SMC是阿里云自主研发的迁移平台，可将单台或多台源服务器迁移至阿里云。下列关于SMC说法正确的是 选项：',opts:['迁移源包括IDC服务器、虚拟机、其他云平台的云主机或其他类型的服务器','迁移过程需要停机操作','采用RSA密钥加密传输通道','迁移过程全自动托管，迁移源上无需运行任何客户端'],exp:'SMC能够将单台或多台迁移源迁移至阿里云。迁移源包括IDC服务器、虚拟机、其他云平台的云主机或其他类型的服务器。数据传输安全有保证默认采用SSL 2048位RSA密钥加密传输通道，支持不停机迁移迁移过程无需停机，不影响源服务器系统业务。参考链接：https://www.aliyun.com/product/ecs/smc'},
  {id:1540,type:'multi',answer:'AD',stem:'「某公司在云上创建了专有网络，在专有网络中创建了两个交换机，交换机1下创建了ECS1实例要求禁止ECS1实例、ECS2实例、ECS3实例与互联网互通；禁止ECS1与ECS3互通；允许ECS1与ECS2互通。现已创建网络ACL，并关联了交换机1和交换机2，需要添加规则来实现访问控制',opts:['在入方向规则：创建优先级1，允许源地址为192.168.0.229/32所有端口的流量；创建优先级2，允许源地址为192.168.1.206/32所有端口的流量；创建优先级3，拒绝源地址0.0.0.0/0所有端口的流量。','在入方向规则：创建优先级1，允许源地址为192.168.1.206/32所有端口的流量；创建优先级2，允许源地址为192.168.0.229/32所有端口的流量；创建优先级3，拒绝源地址0.0.0.0/0所有端口的流量。','在出方向规则：创建优先级1，允许目的地址为192.168.0.229/32所有端口的流量；创建优先级2，允许目的地址为192.168.1.206/32所有端口的流量。','在出方向规则：创建优先级1，允许目的地址为192.168.0.229/32所有端口的流量；创建优先级2，允许目的地址为192.168.1.206/32所有端口的流量；创建优先级3，拒绝目的地址0.0.0.0/0所有端口的流量。'],exp:'详细可以参考限制不同交换机下的ECS间的互通的最佳实践。参考链接：https://help.aliyun.com/document_detail/162709.html?utm_content=g_1000230851'},
  {id:1541,type:'multi',answer:'AC',stem:'在使用专有网络VPC的过程中，创建VPC时配置的IPv4网段是该VPC的主IPv4网段，可以通过添加附加网段来扩充VPC的网段，以下关于主网段及附加网段说法正确的是',opts:['VPC创建后，其主IPv4网段不能修改','添加后附加网段后，主IPv4网段和附加网段只能选择一个生效','可以选择使用主IPv4网段或附加网段来创建交换机，但每个交换机的网段只能属于VPC的1个网段','同VPC下，如果主网段内的ECS实例与附加网段内的ECS实例加入同一安全组且被VPC的网络ACL规则允许通行，则可以实现互通'],exp:'创建VPC时配置的IPv4网段是该VPC的主IPv4网段。VPC创建后，您不能修改其主IPv4网段，但您可以添加附加网段来扩充VPC的网段。添加后，主IPv4网段和附加网段同时生效。您可以选择使用主IPv4网段或附加网段来创建交换机，但每个交换机的网段只能属于VPC的1个网段。https://help.aliyun.com/document_detail/65398.html'},
  {id:1542,type:'multi',answer:'ABD',stem:'「1阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。以下哪几种场景适合使用OSS服务？',opts:['手机APP应用的升级包下载','海量图片文件的存储','结构化数据的存储和查询','海量视频文件的存储'],exp:'结构化数据的存储和查询比较适合用RDS等数据库产品解决，不适合使用对象存储OSS服务。'},
  {id:1543,type:'multi',answer:'BCD',stem:'负载均衡实例监听负责检查连接请求，然后根据调度算法定义的转发策略将请求流量分发至后端服务器。SLB实例监听可选择的协议类型有哪些？',opts:['FTP','HTTP','HTTPS','TCP'],exp:'目前负载均衡SLB监听仅支持TCP/UDP(4层)和参考链接：http/参考链接：httpS(7层)这4 种协议。参考链接：https://help.aliyun.com/document_detail/85943.html'},
  {id:1544,type:'multi',answer:'BC',stem:'「1为了便于企业IP管理，阿里云支持申请多个连续的EIP，连续EIP可以提高网络管理的简便性。在选择连续EIP组掩码时，支持申请的连续EIP掩码范围为/24~/28，掩码范围不同，可分配的连续EIP的个数不同，以下掩码和对应的ip数量，哪些是正确的？',opts:['/28：默认分配15个IEP','/27：默认分配32个IEP','/26：默认分配64个IEP','/24：默认分配36个IEP'],exp:'支持申请的连续EIP掩码范围为24～28，掩码范围不同，可分配的连续EIP的个数不同，具体如下： /28：默认分配16个EIP。 /27：默认分配32个EIP。 /26：默认分配64个EIP。 /25：默认分配128个EIP。 /24：默认分配256个EIP。参考链接：https://help.aliyun.com/document_detail/65203.html'},
  {id:1545,type:'multi',answer:'AD',stem:'在使用云数据库Redis时，为保障Redis数据库的安全稳定，系统默认禁止所有IP地址访问Redis实例。所以在开始使用Redis实例前，管理员需要将客户端的iP地址或IP地址段添加到Redis实例的白名单中，设置白名单可以使用方法进行设置。',opts:['手动添加','通过云助手批量添加','通过访问控制列表ACL设置','通过ECS安全组设置'],exp:'白名单设置方法介绍：手动添加白名单，通过ECS安全组设置白名单，通过阿里云App设置白名单（手机端）。https://help.aliyun.com/document_detail/56464.html'},
  {id:1546,type:'multi',answer:'ACE',stem:'伸缩组是弹性伸缩的核心单元，具有以下哪几种状态？',opts:['Active','Stopping','Deleting','Starting','Inactive'],exp:'参考链接：https://help.aliyun.com/document_detail/25913.html'},
  {id:1547,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。OSS支持海量级的文件存储，在日常应用中有些文件不需要长期保存(例如：1年以前的日志文件)，此时用户可以通过以下哪几种方法去删除这些文件？',opts:['可以通过OSS管理控制中的“生命周期管理(LifeCycle)”设置自动删除','如果名称有一定的规则，可以调用OpenAP或SDK去删除','从管理控制台批量选择并删除','通过OSS的碎片管理功能去删除'],exp:'碎片管理功能是用来删除一些文件删除残留的'},
  {id:1548,type:'multi',answer:'AB',stem:'通过IPsec-VPN可建立专有网络VPC与本地数据中心间的VPN连接，在使用IPsec-VPN功能时有较多注意事项，以下注意事项说法正确的是',opts:['本地数据中心和VPC间互通的网段没有重叠。','本地数据中心的网关设备必须配置静态公网IP地址。','一个VPN网关只可以建立一条IPsec连接','创建IPsec连接后，会自动生成VPN网关路由'],exp:'本地数据中心和VPC间互通的网段没有重叠，本地数据中心的网关设备必须配置静态公网IP地址。一个VPN网关可以建立多条IPsec连接。您需要在本地数据中心的网关设备中加载阿里云上VPN网关的配置,而非自动生成。https://help.aliyun.com/document_detail/65279.html'},
  {id:1549,type:'multi',answer:'AB',stem:'阿里云容器服务ACK备份中心为无状态或有状态应用的备份、恢复与迁移提供了一站式的解决方案。支持在云上ACK集群内及同地域ACK集群之间进行应用与数据的备份恢复。针对云上数据，备份中心提供了以下功能。',opts:['定时增量备份能力','按时间点的全量极速快照备份','最小化数据增量、去重复及压缩','崩溃一致性备份'],exp:'支持在云上ACK集群内及同地域ACK集群之间进行应用与数据的备份恢复。您可以在源集群完成备份操作，在目标集群制作快照，并在目标集群实现RTO秒级的应用和数据恢复。针对云上数据，备份中心提供了以下功能。按时间点的全量极速快照备份 定时增量备份能力 TB级云盘的极速快照 应用一致性的备份和恢复https://help.aliyun.com/document_detail/311759.html'},
  {id:1550,type:'multi',answer:'CD',stem:'负载均衡（ServerLoadBalancer）是将访问流量根据转发策略分发到后端多台云服务器（ECS实例）的流量分发控制服务，下列哪几种场景应用负载均衡最适合?',opts:['消除多点故障','夜间8-9点访问量突增，其他时间段访问量较少','同城容灾（多可用区容灾）','高访问量业务'],exp:'访问量暴增需要使用弹性伸缩。'},
  {id:1551,type:'multi',answer:'DE',stem:'某企业应用运维管理员在使用对象存储OSS的时候，为方便管理，在存储空间内创建多个文件夹用来存放不同类型的对象文件，现在该管理员需要直接下载存储空间内的部分文件夹到本地进行管理，可以通过工具实现文件夹的下载。',opts:['ossimport','SDK','ossfs','ossutil','ossbrowser'],exp:'可以参考OSS的图形化管理工具。https://help.aliyun.com/document_detail/44075.html'},
  {id:1552,type:'multi',answer:'ABD',stem:'「容器服务ACK提供高性能可伸缩的容器应用管理能力，支持企业级容器化应用的全生命周期管理，其包含三种产品形：和__-，可根据业务灵活进行选择。',opts:['专有版Kubernetes','Serverless Kubernetes','高可用版Kubernetes','托管版Kubernetes','标准版Kubernetes','共享版Kubernetes'],exp:'ACK包含了专有版Kubernetes（Dedicated Kubernetes）、托管版Kubernetes（Managed Kubernetes）、Serverless Kubernetes三种形态，方便您按需选择。https://help.aliyun.com/document_detail/86737.html'},
  {id:1553,type:'multi',answer:'ACD',stem:'负载均衡SLB仅提供被动访问公网的能力，即后端ECS只能在收到通过负载均衡SLB转发来的公网的请求时，才能访问公网回应该请求，如后端ECS希望主动发起公网访问，用户可以通过配置/购买Q服务实现',opts:['ECS公网带宽','专有网络VPC','弹性公网IP','NAT网关','云解析'],exp:'负载均衡SLB仅提供被动访问公网的能力，即后端ECS只能收到通过负载均衡SLB转发来的公网的请求时，才能访问公网回应请求，如后端ECS希望主动发起公网访问，则需要配置或购买ECS公网带宽、弹性公网IP或NAT网关来实现。参考链接：https://help.aliyun.com/document_detail/27544.html'},
  {id:1554,type:'multi',answer:'BD',stem:'快照和镜像都是云盘的重要功能，二者之间既有联系又有区别。对于快照以及镜像使用和定义的说法中，哪些是正确的？',opts:['需要先创建包含系统盘数据的快照，才能创建自定义镜像','使用系统盘快照创建自定义镜像时，可以添加数据盘快照','使用数据盘快照，可以创建自定义镜像','使用系统盘快照，可以创建自定义镜像'],exp:'自定义镜像是您基于实例或快照创建的镜像，或者从本地导入的镜像。所以不一定必须需要包含数据盘的快照，且不能使用数据盘做快照。参考链接：https://help.aliyun.com/document_detail/172789.html'},
  {id:1555,type:'multi',answer:'ABC',stem:'「阿里云对象存储0SS的存储费用在所有地域支持寺“按量付费”，在部分地域支持“包年包月”和“按量付费”两种方式。用户可以通过“包年包月”的付费方式可以获得得“资源包”，根据业务需求选择合适的资源包可以节约使用OSS的成本。以下有关OSS“包年包月”收费方式的说法中，哪些是正确的？',opts:['费用一次性支付，立即生效','用户购买的“包年包月”资源包在有效期内，扣费方式为先扣除已购买的资源包内的额度，超出部分按量收费','“包年包月”的资源包，采用按存储容量的阶梯计价，容量越大，单价越便宜','存储容量相同的“包年包月”的资源包，购买时长越短，单价越便宜'],exp:'排除法，存储容量相同的“包年包月”的资源包，购买时长越短，单价越贵，购买时长越长，单价越便宜'},
  {id:1556,type:'multi',answer:'BCDEF',stem:'云存储是在云计算上衍生发展出来的一个概念，将存储资源池中的存储和数据服务，通过网络以统一的接口按需提供给授权用户。云存储具备以下哪些特点？',opts:['管理和维护：为了防止出现由意外故障而导致服务终止的现象，用户需要了解数据存储在不同节点上的具体分布','高可靠性和高可用性：通过副本复制以及节点故障自动容错等技术，提供了很高的可靠性和可用性','高可扩展性：云存储的规模可以动态伸缩，满足数据规模增长的需要','透明服务：提供统一的接口，比如RESTful接口的形式提供服务，后端存储节点对用户透明','按需服务：云存储是一个庞大的资源池，用户可按需申请、使用','超大规模：单个用户存储的数据可达ZB级'],exp:'本题多选正确答案为BCDEF。B（高可靠性和高可用性：通过）、C（高可扩展性：云存储的规模）、D（透明服务：提供统一的接口）、E（按需服务：云存储是一个庞）、F（超大规模：单个用户存储的）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1557,type:'multi',answer:'ADE',stem:'「某阿里云用户使用专有网络VPC来规划网络架构，他发现，每个VPC有一张系统自动创建的默认路由表，VPC内的所有交换机默认使用该路由表。他希望灵活地进行网络管理，以下哪些操作是VPC可以支持的？',opts:['创建自定义路由','删除系统路由','删除系统路由表','创建自定义路由表','将交换机从系统路由表解绑'],exp:'创建专有网络后，系统会自动为您创建一张系统路由表并为其添加系统路由来管理专有网络的流量。一个专有网络只有一张系统路由表。该系统路由表在创建专有网络的时候自动为您创建，您不能手动创建也不能删除系统路由表。参考链接：https://help.aliyun.com/document_detail/100380.html 创建专有网络后，系统会自动为您创建一张默认路由表并为其添加系统路由来管理专有网络的流量。您不能创建系统路由，也不能删除系统路由参考链接：https://help.aliyun.com/document_detail/128368.html'},
  {id:1558,type:'multi',answer:'CD',stem:'管理资源？',opts:['文件整理工具','存储空间提醒工具','文件挂载工具','FTP工具'],exp:'OSS提供图形化工具、命令行工具、文件挂载工具、FTP工具等方便您管理OSS资源。参考链接：https://help.aliyun.com/document_detail/52830.html'},
  {id:1559,type:'multi',answer:'ACD',stem:'1某视频公司，使用负载均衡SLB将用户的访问请求分发到20台云服务器ECS实例上，由这些配置相同的ECS实例来响应用户的请求。根据经验预估，春节假期业务量会增加一倍。计划使用阿里云弹性伸缩（AutoScaling)来满足资源的弹性变化的需求。因该公司可以准确的预测业务量变化情况，您推荐以下哪几种模式来满足业务需求？',opts:['定时任务：在假期开始当天，增加ECS实例个数到40台，假期过后减少至20台','云监控报警任务：通过监控CPU，负载等，在资源紧张时动态增加ECS实例，在资源空闲时，减少ECS实例','固定数量模式：从假期开始当天，设置伸缩组的最小实例数为40台，假期过后将该参数调至20台','健康模式：保持伸缩组中当前的所有的ECS实例能正常工作，以满足用户访问请求的响应'],exp:'题目考察的是选择哪几种伸缩模式实现比较合理，并不是说单独需要什么模式来实现。划重点:由于可以准确预测业务量变化情况。所以不需要动态增加机器，所以报警任务不会选。'},
  {id:1560,type:'multi',answer:'AB',stem:'某管理员在专有网络下搭建了一台私网访问的应用服务器，测试完成后希望面向Internet提供服务，可以通过服务实现公网访问。',opts:['负载均衡','NAT网关','云企业网','智能接入网关'],exp:'本题多选正确答案为AB。A（负载均衡）、B（NAT网关）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1561,type:'multi',answer:'ACE',stem:'1阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，可以通过流量分发扩展应用系统对外的服务能力，通过消除单点故障提升应用系统的可用性。以下哪些说法是正确的？',opts:['有公网IP的负载均衡SLB实例删除后重建会分配一个新的公网IP，原有公网IP不可恢复','在通过负载均衡SLB实例对外提供服务前，要确保已经完成并正确配置了所有负载均衡SLB实例后端云服务器ECS实例上的应用服务','负载均衡SLB实例配置了健康检查，若一部分后端ECS实例宕机且仍有能正常提供对外服务的ECS实例，应用系统仍旧可以继续工作','负载均衡SLB实例提供后端云服务器ECS实例间的数据自动同步功能，采用的是rsync的远程同步技术','负载均衡SLB实例配置了健康检查，若一部分后端ECS实例宕机，负载均衡将移除该部分ECS实例'],exp:'在通过负载均衡SLB实例对外提供服务前，只需要确保SLB后端有一台ECS应用正常运行；若SLB未结合弹性伸缩一起使用，后端ECS实例宕机SLB会将其隔离(不再给其分发请求)，直到该ECS健康检查恢复正常后，还会从隔离区移出，继续分发请求。'},
  {id:1562,type:'multi',answer:'BD',stem:'负载均衡（SLB）支持按量计费模式，按量计费实例可以随时释放。用户可以选择按固定带宽计费或按流量计费。以下关于按固定带宽计费和按流量计费的说法中，哪些是错误的？',opts:['出现资源争抢时，按带宽计费实例的带宽峰值有保证','按流量计费实例的带宽峰值为业务承诺指标','按带宽计费实例的带宽峰值为业务承诺指标','出现资源争抢时，按流量计费实例的带宽峰值有保证'],exp:'按流量计费实例的带宽峰值仅作为参考值和带宽峰值上限，带宽峰值不作为业务承诺指标。 按带宽计费实例的带宽峰值为业务承诺指标。 当出现资源争抢时，按带宽计费实例的带宽峰值有保证，按流量计费实例的带宽峰值可能受到限制。'},
  {id:1563,type:'multi',answer:'BD',stem:'您需要将阿里云的专有网络VPC与传统数据中心组成一个按需定制的网络环境，实现应用的平滑迁移上云。专有网络VPC可以与以下哪些连接方式组合来实现该架构？ 选项：',opts:['vRouter','专线','SDN','VPN'],exp:'根据题意，需要让专有网络VPC与传统数据中心实现内网访问，所以专线和VPN可以满足要求。'},
  {id:1564,type:'multi',answer:'ABD',stem:'某公司未上云前采用“脚本+配置管理+自动化部署工具+监控系统”的方案实现应用层的自动化扩展，无法保证该服务的高可用性与经济性。如果你是阿里云产品经理，你会建议用户上云后，除购买ECS实例外，还可以搭配使用哪些云产品，保证业务应用的高可用与自动扩展？',opts:['弹性伸缩服务ESS','负载均衡服务SLB','关系型数据库服务RDS','云监控服务CMS','消息服务MNS'],exp:'本题多选正确答案为ABD。A（弹性伸缩服务ESS）、B（负载均衡服务SLB）、D（云监控服务CMS）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1565,type:'multi',answer:'CD',stem:'域名是分层结构，域名DNS服务器也是对应的层级结构。有了域名结构，还需要有域名DNS服务器去解析域名，且是需要由遍及全世界的域名DNS服务器去解析，域名DNS服务器实际上就是装有域名系统的主机。关于DNS解析的过程，下列说法正确的是',opts:['用户在Web浏览器中输入“example.com”，会直接提交到根服务器进行查询','客户端有解析需求时，由本地域名服务器采用递归查询的方法，向根域名服务器进行查询','客户端需要访问的服务器IP地址会记录在权威服务器上','DNS查询的结果通常会在本地域名服务器中进行缓存'],exp:'DNS查询的结果通常会在本地域名服务器中进行缓存，如果本地域名服务器中有缓存的情况下，则会跳过如下DNS查询步骤，很快返回解析结果。下面的示例则概述了本地域名服务器没有缓存的情况下，DNS查询所需的8个步骤： 1、用户在Web浏览器中输入“example.com”， 则由本地域名服务器开始进行递归查询。 2、本地域名服务器采用迭代查询的方法，向根域名服务器进行查询。 3、根域名服务器告诉本地域名服务器，下一步应该查询的顶级域名服务器.com TLD的IP地址。 4、本地域名服务器向顶级域名服务器.com TLD进行查询。 5、.com TLD服务器告诉本地域名服务器，下一步查询example.com权威域名服务器的IP地址。 6、本地域名服务器向example.com权威域名服务器发送查询。 7、example.com权威域名服务器告诉本地域名服务器所查询的主机IP地址。 8、本地域名服务器最后把查询的IP地址响应给Web浏览器。 https://help.aliyun.com/document_detail/102237.html(https://help.aliyun.com/document_detail/102237.html)'},
  {id:1566,type:'multi',answer:'ACD',stem:'阿里云OSS图片处理服务(Image Service，简称IMG)的描述中，哪几项是正确的?',opts:['可靠性高','无成本','海量图片处理','通过简单的RESTful接口对图片进行处理'],exp:'OSS的图片处理为收费服务。所以是需要成本的。参考链接：https://help.aliyun.com/document_detail/47735.html'},
  {id:1567,type:'multi',answer:'ABD',stem:'您申请了阿里云的弹性公网IP(EIP)，通过HTTP无法正确地访问该公网IP对应的网页，可能是哪些问题引起的？',opts:['您的账号已经欠费','云服务器ECS实例有安全组策略，禁止80端口访问','EIP选择了华北2(北京)地域，而您从上海地区访问','弹性公网IP没有绑定到云服务器ECS实例上'],exp:'弹性公网IP(ElasticIPAddress，简称EIP)，是可以独立购买和持有的公网IP地址资源，公网访问是支持全国所以地域的访问的。所以不会因为从上海地区的访问华北2的EIP而无法访问的问题。'},
  {id:1568,type:'multi',answer:'ACE',stem:'「1灰度发布（又称为金丝雀发布）是一种平滑过渡的发布方式，将老版本应用与新版本应用同时部署在环境中，让一部分用户继续使用老版本应用，一部分用户开始使用新版本应用，然后根据用户使用情况调整新版本流量占比，逐步把所有用户都迁移到新版本应用。如果想使用ALB实现灰度发布，可选择方式实现。',opts:['基于Cookie实现灰度发布','基于SourceIP实现灰度发布','基于HTTP标头实现灰度发布','基于访问端口实现灰度发布','基于不同服务器组实现灰度发布'],exp:'https://help.aliyun.com/document_detail/251807.html'},
  {id:1569,type:'multi',answer:'ACDEF',stem:'在部分地域(Region)，阿里云的负载均衡SLB支持应用层的WAF安全防护。WAF是WEB应用防火墙的简称(WebApplicationFireWall)，主要用于保护网站(HTTP服务)的安全性，实时对所有的HTTP请求进行合法性检查。阿里云负载均衡SLB的WAF可以提供针对以下哪些攻击类型的安全防护？',opts:['跨站脚本','暴力密码破解','SQL注入','CSRF(Cross-site Request Forgery)','本地文件包含','WebShell'],exp:'暴力密码破解是属于云盾下面安骑士的功能，不属于WEB应用防火墙的功能。参考链接:参考链接：https://help.aliyun.com/document_detail/63632.html，WAF漏洞释义.参考链接：https://help.aliyun.com/knowledge_detail/42197.html'},
  {id:1570,type:'multi',answer:'ABC',stem:'(Auto Scaling)应对业务量突增的情况，既能保证网站系统的正常运营，又能节省成本。关于负载均衡SLB和弹性伸缩(AutoScaling)配合使用的说法中，哪些是正确的？ 选项：',opts:['弹性伸缩(Auto Scaling)中自动产生的ECS实例可以自动配置到负载均衡SLB中去','负载均衡SLB和弹性伸缩(Auto Scaling)必须在同一个地域(Region)','弹性伸缩(Auto Scaling)中的伸缩配置，可以不选择公网带宽','负载均衡SLB和弹性伸缩(Auto Scaling)必须在同一个可用区(Zone)'],exp:'SLB和弹性伸缩ESS只需要在一个地域。创建伸缩配置时，ECS实例可以不选择公网带宽。但是为了方便管理ECS实例，建议您购买至少1Mbps的ECS带宽。参考链接：http://docs-aliyun.cn-hangzhou.oss.aliyun-inc.com/pdf/auto-scaling-common-problem-cn-zh-2017-04-18.pdf'},
  {id:1571,type:'multi',answer:'AC',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，支持4层和7层流量的转发，某用户使用阿里云负载均衡服务对7层访问流量做分发，可选的调度算法有哪些？',opts:['加权轮询(WRR)','加权最短剩余时间(WST)','轮询(RR)','一致性哈希(CH)','加权最小连接数(WLC)'],exp:'SLB四层支持轮询、加权轮询（WRR）和一致性哈希（CH）调度算法。 七层支持轮询、加权轮询（WRR）调度算法。参考链接：https://help.aliyun.com/document_detail/32460.html'},
  {id:1572,type:'multi',answer:'ABCE',stem:'「您希望将您的应用部署在阿里云的产品上，实现降低成本、提升服务的可用性、云服务器快速部署和数据异地备份这些需求，以下哪些阿里云产品可以分别满足这些需求？',opts:['负载均衡SLB配合ECS实例可以提升服务的可用性','合理选择地域来满足应用部署对地域的需求，同时也满足了关键应用、数据对异地备份的需求','云服务器ECS的快照备份满足了应用、数据快速恢复的需求','合理选择内容分发网络CDN可以满足数据异地备份的需求','云服务器ECS的镜像实现了高效、便捷的快速部署'],exp:'内容分发网络CDN只是用来加快静态资源的访问速度，和数据异地备份没有关系。'},
  {id:1573,type:'multi',answer:'AC',stem:'高可用虚拟IP是一种可以独立创建和释放的私网IP资源。HaVip可以与高可用软件配合使用，搭建高可用主备服务，提高业务的可用性。下列关于HaVip说法正确的是',opts:['ECS实例除了可以拥有主私网IP地址外，还可以绑定HaVip，以获得多个私网IP地址。','HaVip可以直接与ECS实例绑定，但只能同时绑定1个ECS实例','HaVip支持绑定ECS实例的主网卡或者ECS实例的辅助网卡','HaVip支持单播、广播和组播'],exp:'HaVip最多支持同时绑定10个不同的ECS实例。HaVip只支持单播。https://help.aliyun.com/document_detail/110065.html'},
  {id:1574,type:'multi',answer:'AB',stem:'某企业网站使用阿里云负载均衡SLB实例来转发用户请求给后端云服务器ECS实例，如果负载均衡SLB实例被释放掉了，可能会对整个系统产生一些影响。以下哪些说法是正确的？',opts:['ECS实例本身不会受到影响','如果部署在后端ECS实例上的应用对应的域名是解析到负载均衡SLB实例IP上的,那么会影响站点的访问','ECS实例会立即被释放','如果部署在后端ECS实例上的应用对应的域名是解析到负载均衡SLB实例IP上的,释放后会导致ECS实例上负载不再均衡,只要保证ECS实例运行状态正常,网站的访问就不会受到影响'],exp:'SLB的释放只会影响到SLB实例，后端的ECS实例没有影响。但是因为域名是解析到SLB的IP的，所以域名访问会受到影响。'},
  {id:1575,type:'multi',answer:'ABC',stem:'您在原有的数据中心已经部署了部分应用，现在需要构建新的应用，但本地的数据中心内的物理资源不够用，也没有办法进行扩容，使用以下哪些方案可以解决该问题？',opts:['在阿里云上申请专有网络VPC服务，并基于VPC申请新的云服务资源，与您原有的数据中心使用相同的内网地址网段','通过专线打通原有数据中心与阿里云上的VPC，实现已有数据中心向云上的平滑迁移','通过VPN打通原有数据中心与阿里云上的VPC，实现已有数据中心向云上的平滑迁移','直接申请阿里云的云服务器无需任何操作就可以与原有的数据中心内网打通，实现已有数据中心向云上的平滑迁移'],exp:'无需任何操作是不会打通的。'},
  {id:1576,type:'multi',answer:'BC',stem:'某企业在华东1地域拥有一个VPC1，在华北1地域拥有一个VPC2。两个VPC均已使用云服务器ECS部署了业务，企业因后续发展，现在需要VPC1和VPC2中的业务可以互相访问。此时管理员可以通过选择产品实现VPC跨地域安全互访。',opts:['智能接入网关','VPN网关','云企业网','VPC对等连接'],exp:'本题多选正确答案为BC。B（VPN网关）、C（云企业网）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1577,type:'multi',answer:'AC',stem:'「1阿里云快照服务是一种无代理的数据备份方式，可以为所有类型的云盘创建崩溃一致性快照，用于备份或者恢复整个云盘。下列关于快照说法正确的是',opts:['全量备份后，后续创建的快照均是增量快照，只存储变化的数据块','云盘第一份快照是全量快照，备份包括空数据块在内的所有数据','支持通过快照创建云盘，实现云盘的快速复制，且支持跨可用区使用快照创建云盘','快照是地域级资源，不支持复制到其他地域'],exp:'云盘创建的第一个快照是全量快照，不备份空数据块。后续创建的快照均是增量快照，仅备份上一个快照以来有变化的数据块。https://help.aliyun.com/document_detail/25392.html 支持使用快照跨可用区创建云盘。https://help.aliyun.com/document_detail/32317.html 您可以将快照从一个地域复制到另一个地域。https://help.aliyun.com/document_detail/159441.html'},
  {id:1578,type:'multi',answer:'AD',stem:'「1某公司将其核心业务电商网站部署在阿里云上，使用多可用区类型的负载均衡SLB做流量分发。由于负载均衡的主备可用区级别的容灾，只有当主可用区整体不可用时，负载均衡才会切换到备可用区。当网络攻击或配置错误等情况导致负载均衡实例不可用时，由于未出现可用区级故障，不会触发负载均衡实例的可用区切换。在此场景下，若该公司要提高负载均衡服务的可用性，建议采取以下哪几种措施？',opts:['创建多个SLB实例，通过云解析DNS对访问进行调度','使用云服务器ECS上部署LVS集群，当SLB实例出现故障时，切换到LVS集群','将多个可用区负载均衡实例改为单可用区实例，发生故障时可切换到同一可用区中的备实例','创建多个SLB实例，通过全球负载均衡解决方案实现跨地域容灾备份'],exp:'参考链接：https://help.aliyun.com/document_detail/67915.html'},
  {id:1579,type:'multi',answer:'AC',stem:'在使用阿里云弹性伸缩(Auto Scaling)时，在用户创建好伸缩组、伸缩配置、伸缩规则、伸缩触发任务以后，伸缩触发任务会按照各自“触发生效的条件”来触发伸缩活动，以下哪几种场景会触发伸缩活动？',opts:['伸缩组内所有云服务器ECS实例的CPU占用率最大值大于60%','伸缩组内所有云服务器ECS实例的IOPS平均值小于100','到了用户配置的定时时间','伸缩组内所有云服务器ECS实例响应的请求中，有超过50%的请求在执行写操作'],exp:'报警任务可以关联CPU、内存利用率、系统平均负载、内网出入流量等监控项统计信息，自动增加或减少ECS实例。且肯定可以设置定时任务，其他条件不能用来设置报警任务。参考链接：https://help.aliyun.com/document_detail/101447.html'},
  {id:1580,type:'multi',answer:'ABD',stem:'「1专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。以下哪些是VPC的必要组件？',opts:['私网网段','路由器','NAT网关','交换机','公网网段'],exp:'每个专有网络都由至少一个私网网段、一个路由器和至少一个交换机组成。参考链接：https://help.aliyun.com/document_detail/34217.html'},
  {id:1581,type:'multi',answer:'BC',stem:'「1阿里云的负载均衡SLB是对多台云服务器ECS实例进行流量分发的服务，支持四层和七层的转发协议。其中七层服务主要是依据以下哪些选项把流量分发给对应的云服务器ECS实例？',opts:['报文中的目标IP地址和端口','负载均衡SLB中设定的转发策略和规则','报文中真正有意义的应用层内容','报文中的源IP地址和端口'],exp:'注意题目考的是七层，四层是通过SLB中设定的转发策略和规则和报文中的目标IP地址和端口分发流量，七层是通过报文中真正有意义的应用层内容和负载均衡SLB中设定的转发策略和规则分发流量。参考链接：https://yq.aliyun.com/articles/554057'},
  {id:1582,type:'multi',answer:'AC',stem:'使用弹性伸缩，可以根据业务需求和策略设置伸缩规则，在业务需求增长时自动增加ECS实例以保证计算能力，在业务需求下降时自动减少ECS实例以节约成本。弹性伸缩的伸缩模式有多种，如定时模式、（）、（）、自定义模式以及健康模式。',opts:['动态模式','自动选择模式','固定数量模式','随机模式'],exp:'弹性伸缩支持多伸缩模式兼容，可灵活调度应对各种复杂场景。伸缩模式包括固定数量、健康、定时、动态、自定义等，其中动态模式支持通过API对接外部的监控系统。参考链接：https://help.aliyun.com/document_detail/25857.html'},
  {id:1583,type:'multi',answer:'AD',stem:'有关操作方法及产生的影响的说法，哪些是正确的？',opts:['将经典网络的RDS实例切换到VPC下，VPC内的云服务器ECS实例可以直接通过内网访问RDS实例，经典网络的其他云服务器ECS实例将无法再访问该RDS实例','给VPC内的云服务器ECS实例绑定EIP，给RDS实例设置外网连接地址，VPC内的云服务器ECS实例通过公网访问RDS实例的公网地址，经典网络的其他云服务器ECS实例将无法再访问该RDS实例','将经典网络的RDS实例切换到VPC下，VPC内的云服务器ECS实例可以直接通过内网访问RDS实例，经典网络的其他云服务器ECS实例依然可以继续访问该RDS实例','给VPC内的云服务器ECS实例绑定EIP，给RDS实例设置外网连接地址，VPC内的云服务器ECS实例通过公网访问RDS实例的公网地址，经典网络的其他云服务器ECS实例还可以继续访问该RDS实例'],exp:'云服务器ECS实例通过公网访问RDS实例的公网地址的时候，不会影响到其他经典网络通过公网访问此RDS实例；在VPC中的RDS，其他经典网络则无法访问该RDS实例。'},
  {id:1584,type:'multi',answer:'BDE',stem:'云服务器ECS实例等同于一台虚拟服务器，除了CPU、内存外，还包含哪些？',opts:['声卡','操作系统','硬盘','磁盘','网络配置'],exp:'一台ECS实例等同于一台虚拟服务器，内含CPU、内存、操作系统、网络配置、磁盘等基础的组件。您可以使用阿里云提供的控制台、API等管理工具创建和管理ECS实例，像使用本地服务器一样管理ECS实例的状态、应用等，还可以灵活地升级计算、存储等能力。参考链接：https://help.aliyun.com/document_detail/25374.html'},
  {id:1585,type:'multi',answer:'ABCEF',stem:'【】阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。以下关于OSS特点的描述中，哪些是正确的？',opts:['存储资源利用率高，按实际使用空间结算，100%利用率','提供对称加密用户验证，签名权限控制及防盗链功能','OSS采用三副本机制，数据可靠性高','服务可用性比自建服务器略低','BGP多线骨干网络接入，全国各地流畅访问','无带宽限制，按实际用量付费'],exp:'服务可用性比自建服务器要高。'},

  {id:1589,type:'multi',answer:'ACD',stem:'「1阿里云的专有网络VPC可以构建出一个隔离的网络环境，在这个网络中可以完全掌控自己的虚拟网络，也可以通过特定的连接方式将VPC与传统数据中心组成一个按需定制的网络环境。以下哪些场景可以通过阿里云的专有网络VPC产品实现？',opts:['通过物理专线将自有数据中心和阿里云VPC连接起来，实现用户网络与阿里云专有网络之间的内网互通','可以将资源部署在同一个VPC网络中处于不同地域的交换机中，从而实现利用阿里云多地域进行容灾','可以将资源部署在处于同一个地域中的不同可用区的交换机中，从而实现利用阿里云的可用区进行容灾','在单个地域内按业务需要私有网络的网段划分和IP分配，并在该专有网络VPC内创建云产品实例'],exp:'同一个VPC只能创建同一个地域不同可用区的交换机实现可用区容灾，不支持跨VPC创建交换机。'},

  {id:1593,type:'multi',answer:'CD',stem:'文件存储CPFS支持两种存储规格，分别为和不同规格的IO带宽、IOPS能力和IO时延不同，管理员可根据业务需求进行选择。',opts:['150 MB/s/TiB基线','300 MB/s/TiB基线','100 MB/s/TiB基线','200 MB/s/TiB基线'],exp:'文件存储CPFS支持两种存储规格，分别为100 MB/s/TiB基线和200 MB/s/TiB基线。https://www.aliyun.com/sswd/8265902-1.html'},
