  {id:1155,type:'multi',answer:'BCD',stem:'OSS提供自动保存访问日志记录功能。Bucket的拥有者可以通过OSS控制台为其所拥有的Bucket开启访问日志记录功能。下列关于OSS开启访问日志说法正确的是？（正确答案的数量：3个）',opts:['开启访问日志记录功能后，访问日志每分钟生成一次','开启访问日志记录功能后，访问日志会按照固定的命名规则，生成一个Object写入用户指定的Bucket','Bucket的拥有者可以通过OSS控制台，为其所有的bucket开启访问日志纪录功能','通过对生成的日志文件进行分析，可以轻松定位在OSS Bucket上的所有操作'],exp:'当一个Bucket(源Bucket，Source Bucket)开启访问日志记录功能后，OSS自动将访问Bucket中文件的的请求访问记录，以小时为单位，按照设置的命名规则，生成一个Object写入用户指定的bucket(目标Bucket，Target Bucket)。日志每一小时自动生成一次，通过对生成的日志文件进行分析，可以轻松定位在OSS Bucket上的所有操作。参考链接：https://help.aliyun.com/knowledge_detail/39654.html'},
  {id:1156,type:'multi',answer:'ABC',stem:'您发现某台阿里云的云服务器ECS实例的磁盘上的数据被误删除，需要回滚到之前某个时刻的数据可以通过对该磁盘进行回滚操作来实现。登录到阿里云的管理控制台进行回滚操作时，您发现不能进行该操作，可能是原因造成的。（正确答案的数量：3个）',opts:['云服务器ECS实例的状态为“启动中”','云服务器ECS实例的状态为“运行中”','云服务器ECS实例的状态为“已过期”','云服务器ECS实例的状态为“已停止”'],exp:'回滚磁盘必须要求云盘必须已经 挂载到某台ECS实例上，而且已经 停止实例。所以不会是“已停止”的状态造成的。'},
  {id:1157,type:'multi',answer:'ABC',stem:'出于业务的需求，您需要对某台阿里云的云服务器ECS实例的磁盘进行初始化操作，可以通过以下方法提前备份重要的数据。（正确答案的数量：3个)',opts:['制作磁盘的快照','如果是系统盘，可以基于快照制作自定义镜像','将数据备份到OSS中','无需任何额外的操作，阿里云会自动进行备份'],exp:'阿里云不会自动帮助用户备份数据'},
  {id:1158,type:'multi',answer:'AD',stem:'某个伸缩组asg-1的默认冷却时间为10分钟。伸缩组内存在一条伸缩规则remove1.，冷却时间为15分钟。在7：55时伸缩规则remove1成功执行了一次伸缩活动。下列选项中的伸缩活动请求会被伸缩组接受并执行的是（正确答案个数：2个）',opts:['定时任务触发请求，时间为8:00','报警任务触发请求，时间为8:00','报警任务触发请求，时间为8:06','伸缩组7:58被停用并再次启用后，报警任务触发请求，时间为8:00'],exp:'在冷却时间内，伸缩组会拒绝由云监控报警任务触发的伸缩活动请求。但其他类型任务（手动执行任务、定时任务）触发的伸缩活动可以立即执行，绕过冷却时间。 如果您停用伸缩组，然后再次启用伸缩组，冷却时间将会失效'},
  {id:1159,type:'multi',answer:'BC',stem:'在使用阿里云弹性伸缩(AutoScaling)中，用户希望能在某个时间点执行某种预定义好的规则，如每天晚上00:00减少一台云服务器ECS实例，在已启用的伸缩组中，可以通过以下哪两个操作配合实现？（正确答案的数量 :2个)',opts:['新建一个伸缩组','创建伸缩规则','创建定时任务','创建报警任务'],exp:'本题中伸缩组已经创建了，所以「创建一个伸缩组」不会选，要实现定时任务，需要创建一个规则且添加一个定时任务。和报警任务也没有任何关系哦。'},
  {id:1160,type:'multi',answer:'CD',stem:'阿里云的云盾"DDoS基础防护"功能在管理控制台可以配置针对云服务器的流量清洗的阈值，达到任意一个值即开始流量清洗。清洗阈值包括（正确答案的数量：2个）',opts:['云服务器ECS实例公网IP每天接收的字节数(b)','云服务器ECS实例公网IP每天发送的字节数(b)','云服务器ECS实例公网IP每秒处理的报文数量(PPS)','云服务器ECS实例公网IP每秒处理的流量值（bps）'],exp:'触发清洗阈值：指的是触发流量清洗所需要的最低值，包括每秒流量，每秒报文数量，每秒HTTP请求数三个触发清洗的阈值，用户云服务器的流量超过三个中的任意一个，都会触发清洗。参考链接：https://help.aliyun.com/knowledge_detail/40048.html'},
  {id:1161,type:'multi',answer:'ABD',stem:'阿里云专有网络VPC产品是基于软件定义网络的技术实现的，具备__特点。（正确答案的数量：3个）',opts:['无需购买硬件网络设备可以实现基本的网络设置','可以按需配置网络设置','网络访问控制规则固定，不能进行灵活的配置','管理操作及配置实时生效'],exp:'VPC可以进行灵活的网络定义'},
  {id:1162,type:'multi',answer:'ABC',stem:'在阿里云负载均衡SLB实例和云服务器ECS实例配合使用时，最终服务请求都会被负载均衡SLB实例按照转发的策略和规则分发到ECS实例上去执行。负载均衡SLB实例后端云服务器ECS实例的管理和配置，决定了整个系统的处理能力。以下关于后端云服务器ECS实例，说法正确的有（正确答案的数量：3个）',opts:['负载均衡SLB实例的服务能力与后端ECS实例的公网宽带无关','在使用负载均衡SLB实例的过程中可以随时调整后端ECS实例的数目','不同操作系统的云服务器ECS实例可以同时做为负载均衡SLB实例的后端服务器','禁用后端云服务器ECS实例的公网网卡不会影响负载均衡SLB服务','后端云服务器ECS实例的网络类型必须和负载均衡的实例类型一致'],exp:'如果ECS有公网IP，禁用公网网卡就会影响负载均衡服务。因为在有公网网卡的情况下，默认路由会走公网，如禁用就无法回包从而影响负载均衡服务。建议不要禁止，如一定要这么做，需要修改默认路由为私网才会不影响服务。但需要考虑业务是否对公网有依赖，如通过公网访问RDS等。参考链接：https://help.aliyun.com/knowledge_detail/55193.html后端云服务器ECS的网络类型不一定需要和负载均衡一致。负载均衡可以是公网IP的实例，ECS可以VPC网络类型的实例。'},
  {id:1163,type:'multi',answer:'ABC',stem:'创建阿里云的云服务器ECS实例时，要根据您的业务需求进行实例规格和配置的选择。下列说法中关于实例选择的描述中正确的包括（正确答案的数量：3个）',opts:['企业级异构计算规格族群可以提供更好的浮点运算性能','实例均为 I/O 优化实例，可以发挥磁盘的更好性能','如果您要使用Windows系统的ECS实例部署Web环境，建议选择至少2GB或更高内存的实例规格','需要单独开通云盾的基础防护服务'],exp:'排除法，云盾的基础防护服务在ECS创建完成后自动开通，不需要单独开通。'},
  {id:1164,type:'multi',answer:'BD',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。OSS产品的账单费用由三部分组成，包括：存储空间费用、流量费用和API请求费用。下面对OSS的操作中收取流量费用。（正确答案的数量：2个）',opts:['从本地PC机上传文件到OSS','云服务器ECS实例通过公网IP下载OSS文件','云服务器ECS实例通过内网IP下载OSS文件','从本地PC机下载OSS文件'],exp:'上传：内网，外网都不收取流量费用；下载：内网不收取流量费用，外网收取流量费用。所以过公网IP下载OSS文件，本地PC机下载OSS文件都是收取流量费用的。'},
  {id:1165,type:'multi',answer:'AB',stem:'负载均衡通过健康检查来判断后端服务器（ECS实例）业务可用性，为了避免频繁的健康检查失败引起的切换对系统可用性的冲击，健康检查只有在健康检查时间窗内连续多次检查成功或失败后，才会进行状态切换。TCP/HTTP/HTTPS监听建议使用健康检查配置。 （正确答案个数：2个)',opts:['响应超时时间 5秒','健康检查间隔 2秒','响应超时时间 10秒','健康检查间隔 5秒'],exp:'健康检查间隔UDP监听的默认值为5秒，HTTP/HTTPS/TCP监听的默认值为2秒。 响应超时时间UDP监听的默认值为10秒，HTTP/HTTPS/TCP监听的默认值为5秒'},
  {id:1166,type:'multi',answer:'ABCDE',stem:'云存储是在云计算上衍生发展出来的一个概念，将存储资源池中的存储和数据服务，通过网络以统一的接口按需提供给授权用户。云存储具备以下哪些特点？(正确答案的数量：5个)',opts:['超大规模:云存储具有相当的规模,单个用户存储的数据可达TB级甚至PB级','高可扩展性:云存储的规模可以动态伸缩,满足数据规模增长的需要','高可靠性和高可用性:通过副本复制以及节点故障自动容错等技术,提供了很高的可靠性和可用性','按需服务:云存储是一个庞大的资源池,用户可按需申请、使用','透明服务:提供统一的接口,比如RESTful接口的形式提供服务,后端存储节点对用户透明','管理和维护:为了防止出现由意外故障而导致服务终止的现象,用户需要了解数据存储在不同节点上的具体分布'],exp:'用户虽然需要管理和维护，但是没有必要了解数据的具体节点分布。'},
  {id:1167,type:'multi',answer:'ABC',stem:'Channel是OSS图片服务API的基本概念之一，Channel是IMG上的命名空间，它具有以下哪些功能?（正确答案的数量：3个）',opts:['控制权限','日志记录','计费','管理Object'],exp:'Channel 是 IMG 上的命名空间，也是计费、权限控制、日志记录等高级功能的管理实体。参考链接：https://help.aliyun.com/document_detail/44687.html'},
  {id:1168,type:'multi',answer:'AB',stem:'题干：698/1023、伴随着层出不穷的网络安全事件，人们越来越重视云上系统的安全。某阿里云云上初创团队由于企业资金预算有限在业务上云后无法购买更多的安全服务，但企业希望能够尽可能的保证自身业务应用的安全。团队员工对于安全防护措施的知识了解不多，如果你是阿里云架构经理，你会建议该用户采用以下（正确答案个数：2个） 选项：',opts:['合理规划并配置安全组规则','使用安骑士免费版进行主机安全防护','不去修改阿里云上的各种默认设置','不要通过控制台进行管理，尽量使用AK/SK通过API进行操作'],exp:'在阿里云安全最佳实践中，安全组作为网络访问控制的基础防护手段，正确配置能够有效限制不必要的端口暴露与访问流量。安骑士（云安全中心）免费版提供基础的主机入侵防御、漏洞检测功能，适用于预算有限的初创企业。阿里云官方文档强调默认安全组规则可能存在宽松策略，需根据业务需求调整。通过API管理需谨慎处理AK/SK密钥，避免泄露风险，非技术团队更建议使用控制台的可视化管理。'},
  {id:1169,type:'multi',answer:'ABC',stem:'分布式拒绝服务（DistributedDenialofService，简称DDoS）指借助于客户机/服务器模式，将多个计算机联合起来作为攻击平台，对一个或多个目标发动DDoS攻击，从而成倍地提高拒绝服务攻击的威力。常见的DDoS攻击类型包括（正确答案个数：3个）',opts:['传输层DDoS攻击','Web应用层DDoS攻击','畸形报文','ARP攻击','应用层DDoS攻击'],exp:'https://help.aliyun.com/document_detail/28401.html?spm=a2c4g.11186623.6.578.7cca286fpjWsfF'},
  {id:1170,type:'multi',answer:'AD',stem:'关于阿里云的云监控产品的“自定义监控”是提供给用户自由定义监控项及报警规则的一项功能。以下关于“自定义监控”的描述，正确的是（正确答案的数量：2个）',opts:['用户可以对自己关心的业务进行监控，将采集到监控数据上报至云监控，由云监控进行数据的处理，并根据结果进行报警','只允许用户选择有限的固定模板，监控特定的服务器性能指标','自定义的监控项的数量是有上限的，且上报监控数据的程序必须部署在阿里云的云服务器','自定义的监控项的数量是没有上限的，上报监控数据的程序可以部署在阿里云的云服务器以外的机器'],exp:'自定义的监控项的数量是没有数量限制的，且阿里云提供接口可以给开发者上报数据。'},
  {id:1171,type:'multi',answer:'AC',stem:'阿里云的同一个账号在同一个地域的不同的云服务器ECS实例，可以通过安全组规则设置ECS实例之间内网互通。同一个安全组下的ECS实例默认是内网互通的，不同的安全组下ECS实例默认是内网不通的。如果希望两台ECS实例InstanceA和InstanceB可以内网互通，以下操作中正确的包括（正确答案的数量：2个）',opts:['把ECS实例InstanceA和InstanceB放入到相同的安全组中，就可以满足内网都互通了','为了实现内网互通，一定要把ECS实例InstanceA和InstanceB放在同一个安全组内','如果ECS实例InstanceA和InstanceB不在同一个安全组内，两个安全组各自增加授权另一个安全组可以访问的安全组规则，就可以满足内网都互通了','如果云服务器ECS实例InstanceA和InstanceB不在同一个安全组内，只需要在其中一个安全组内设置内网授权另一个安全组可以访问的安全组规则，就可以满足内网都互通了'],exp:'同一个账号在同一个地域的的情况下，通过安全组实现内网互通，要么是在同一个安全组下面，要么是两个安全组相互授权对方可以访问。'},
  {id:1172,type:'multi',answer:'ABC',stem:'云监控是阿里巴巴集团多年来服务器监控技术研究积累的成果，结合阿里云的云计算平台强大的数据分析能力客户提供各种应用和服务器的第三方监控服务。当用户收到云服务器ECS实例的IOPS使用率超过80%的报警通知且不知道该如何处理时，可以通过向阿里云获得帮助。（正确答案的数量：3个）',opts:['查看云服务器ECS或云监控产品文档','提工单给售后工程师','在阿里云论坛或云栖社区寻找答案','无法从阿里云获得帮助'],exp:'排除法，无法从阿里云获得帮助肯定是不正确的。用户在云监控收到相应的报警信息后，如果不知道解决方法可以在阿里云多种渠道寻求帮助。'},
  {id:1173,type:'multi',answer:'ABD',stem:'阿里云的云服务器ECS产品根据底层使用的硬件不同划分为不同的实例系列。对于实例系列I采用IntelXeonCPU，实例系列III采用HaswellCPU。以下关于云服务器ECS产品的实例系列说法正确的是.(正确答案的数量：3个）',opts:['实例系列II的用户可以获得更大的实例规格','实例系列II相对于实例系列I增加了一些新的指令集，使整数和浮点运算的性能翻倍','ECS实例创建以后可以进行实例系列I与实例系列II的变更','实例系列II全部为 I/O 优化实例，配合SSD云盘使用可以获得更高的I/O性能'],exp:'排除法，实例系列I和实例系列II直接是不同的处理器系列，创建之后不支持变更。'},
  {id:1174,type:'multi',answer:'AD',stem:'近年来，网络安全在互联网世界中困扰不断，安全漏洞频发、服务器被攻击、数据泄露、网络木马植入等各种网络安全事件层出不穷。网络威胁多种多样，造成的结果也各不相同。下列选项中，，可能造成网站无法正常打开。（正确答案个数：2个）',opts:['网站DNS被劫持','CDN缓存失效','受到SQL注入攻击','受到DDoS攻击'],exp:'网络威胁中，DNS劫持会导致用户请求被错误解析至其他地址，直接阻碍对目标网站的访问。CDN缓存失效通常仅影响加载速度而非可用性。SQL注入主要针对数据库安全，与网站连通性无关。DDoS攻击通过海量流量耗尽服务器资源，致使服务瘫痪。来源：《网络安全技术基础》（2021版）。选项A涉及域名系统安全，DNS被篡改引发访问异常。选项D的分布式拒绝服务攻击直接破坏服务可用性。'},
  {id:1175,type:'multi',answer:'AB',stem:'创建专有网络后，用户可以通过创建交换机为专有网络划分一个或多个子网，在设置交换机的IPv4网段时，用户需了解交换机的网段限制，包括但不限于下列选项（正确答案个数：2个）',opts:['交换机网段必须为VPC网段的子集','交换机的网段和要通信的网段不能冲突','交换机网不能大于所属VPC器由表中路由的目标网段范围，但可以相同','交换机网不能大于所属VPC器由表中路由的目标网段范围，但可以相同'],exp:'专有网络（VPC）的子网划分需遵循特定规则。根据阿里云官方文档，交换机的IPv4网段必须属于其所属VPC的网段范围，确保子网是VPC的子集。同时，交换机网段若与其他通信网络（如本地IDC或对端VPC）存在重叠，会导致路由冲突并影响正常通信。选项C/D中的描述与VPC路由表逻辑无关，路由表的目标网段用于定义流量转发规则，而非直接限制交换机网段范围。'},
  {id:1176,type:'multi',answer:'ABCD',stem:'所有接入CDN的域名都要经过审核，发现以下任意一种情况，CDN目前不支持接入的加速域名类型包括？（正确答案的数量：4个）',opts:['无法正常访问或内容不含有任何实质信息；','游戏私服类、传奇类游戏、纸牌类游戏；','P2P类网站、彩票类网站；','违规医院和药品类网站、涉黄、涉毒、涉赌等；'],exp:'所有接入CDN的域名都要经过域名内容审核。CDN目前不支持接入的域名包括但不限于：无法正常访问或内容不含有任何实质信息，游戏私服类，传奇类游戏、纸牌类游戏，盗版软件等无版，下载网站，P2P类金融网站，彩票类网站，违规医院和药品类网站，涉黄、涉毒、涉赌等。参考链接：https://help.aliyun.com/document_detail/27114.html'},
  {id:1177,type:'multi',answer:'ABCD',stem:'阿里云的云服务器ECS实例的生命周期是从创建开始到释放结束',opts:['实例状态可以分为中间状态和稳定状态','处于“已停止”状态的云服务器ECS实例不能对外提供业务','ECS实例进行重新初始化系统盘或数据盘的操作时，将处于“重新初始化中”状态，如果ECS实例长时间处于该状态，则说明该实例出现异常','包年包月的ECS实例到期后因没有及时续费，或者按量付费的实例因账户欠费都会导致ECS实例变成“已过期”状态，“已过期”的ECS实例不能对外提供业务','“运行中”是一个ECS实例的中间状态'],exp:'"运行中"是稳定状态。'},
  {id:1178,type:'multi',answer:'BC',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，可以通过流量分发扩展应用系统对外的服务能力，通过消除单点故障提升应用系统的可用性。阿里云的负载均衡SLB支持4层和7层网络协议的负载均衡服务。（正确答案的数量：2个）',opts:['3层（网络层）','7层（应用层）','4层（传输层）','2层（数据链路层）'],exp:'阿里云的负载均衡SLB目前仅支持4层和7层的负载均衡。'},
  {id:1179,type:'multi',answer:'AB',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，对于公网的负载均衡SLB实例, 支持两种付费模式。（正确答案的数量：2个）',opts:['按使用流量计费','按固定带宽计费','按后端服务器台数计费','按照后端服务器的计算能力计费'],exp:'SLB支持按使用流量或者按照固定宽带付费。'},
  {id:1180,type:'multi',answer:'BC',stem:'阿里云的负载均衡SLB是对多台云服务器ECS实例进行流量分发的服务，支持四层和七层的转发协议。其中七层服务主要是依据把流量分发给对应的云服务器ECS实例。（正确答案的数量：2个）',opts:['报文中的目标IP地址和端口','负载均衡SLB中设定的转发策略和规则','报文中真正有意义的应用层内容','报文中的源IP地址和端口'],exp:'注意题目考的是七层，四层是通过SLB中设定的转发策略和规则和报文中的目标IP地址和端口分发流量，七层是通过报文中真正有意义的应用层内容和负载均衡SLB中设定的转发策略和规则分发流量。参照：https://yq.aliyun.com/articles/554057'},
  {id:1181,type:'multi',answer:'ABCD',stem:'些云盘可以是单块系统盘，也可以是系统盘加数据盘的组合。ECS镜像提供了创建ECS实例所需的信息，在很多场景中都发挥着重要的作用。以下关于镜像使用场景的描述，正确的是（正确答案个数：4个）',opts:['某阿里云用户新购ECS','某电商公司使用AutoScalign做自动弹性伸缩，应对流量峰值','某公司运维人员需要批量部署ECS','某公司将自己的商业软件上架到云市场出售','某公司需要对自身系统日常的业务数据做定期备份','某公司需要将数据库平滑迁移到阿里云上'],exp:'ECS镜像是包含云盘数据的副本文件，用于创建具备预设环境的实例。核心应用场景包括：新购ECS时选择配置模板（A）、弹性伸缩快速部署一致实例（B）、批量复制标准化环境（C）、云市场通过封装软件的镜像商业化分发（D）。镜像侧重系统配置固化，而数据备份（E）通常采用快照，数据库迁移（F）需专用工具保证连续性，故后两者不适用。'},
  {id:1182,type:'multi',answer:'AD',stem:'小明是某企业的运维工程师，发现两台ECS后发现内网无法通讯，造成这种情况的原因可能是（正确答案个数：2个）',opts:['两台云服务器实例在不同地域','两台ECS在同一VPC','两台ECS实例在同一个账号下，同一个地域的不同可用区','两个云服务器ECS实例在不同的安全组'],exp:'ECS内网通信需满足网络互通条件。根据阿里云网络架构，不同地域的实例因物理隔离无法直接内网通信（A正确）；同一VPC内默认互通，但若分属不同安全组且未配置相互授权规则，则流量会被安全组拦截（D正确）。同一账号同地域不同可用区默认互通（C错误），同一VPC本身支持内网通信（B错误）。'},
  {id:1183,type:'multi',answer:'AC',stem:'加入阿里云的云盾先知计划的企业，如果收到网络专家提供的漏洞信息，那么管理员能在先知计划控制台得到',opts:['漏洞等级','状态','漏洞标题及详情','漏洞提交人','出现漏洞的功能是哪个工程师开发的'],exp:'阿里云云盾先知计划中，当企业收到网络专家提供的漏洞信息，管理员在先知计划控制台可获取漏洞等级，用于评估严重程度与紧急性；还能看到漏洞标题及详情，其详细描述漏洞性质、位置等，为分析与修复提供依据。而状态、漏洞提交人、出现漏洞功能对应的开发工程师等信息，在此情境下并非管理员在控制台主要获取内容 。'},
  {id:1184,type:'multi',answer:'ACDE',stem:'互联网的一次标准的网络层会话可以用五个元素来唯一标识,通常被称为“网络通信五元组”，在此基础之上可以对某些传输过程进行安全控制或防护。以下选项属于网络五元组的一部分。（正确答案的数量：4个）',opts:['源IP','应用层协议','目标IP','传输层协议','源端口','MAC地址'],exp:'五元组是通信术语。通常是指源IP地址，源端口，目的IP地址，目的端口和传输层协议。参考链接：https://baike.baidu.com/item/%E4%BA%94%E5%85%83%E7%BB%84/6489646'},
  {id:1185,type:'multi',answer:'AB',stem:'OSS通过服务器端加密机制，提供静态数据保护。适合于对于文件存储有高安全性或者合规性要求的应用场景。例如，深度学习样本文件的存储、在线协作类文档数据的存储。针对不同的应用场景，OSS有两种服务器端加密方式。（正确答案个数：2个）',opts:['使用KMS托管密钥进行加解密','使用OSS完全托管加密','ECS.E85FOSS-SDKAJ11520ME','源站位于ECS.使用ECS加密云盘即可实现'],exp:'OSS服务器端加密功能用于保护静态数据，支持两种方式：由KMS服务提供密钥管理的SSE-KMS方式，以及由OSS完全托管密钥的SSE-OSS方式。阿里云官方文档明确说明这两种加密方式适用于不同安全需求场景。[A]对应KMS托管密钥的加密实现，[B]表明OSS自身管理的加密机制。[C]为无效编码字符串，[D]描述的ECS加密属于块存储服务，与对象存储OSS无关。'},
  {id:1186,type:'multi',answer:'AC',stem:'某公司一名负责运维阿里云产品的员工离职了，应该进行操作可以保证这名离职人员不再收到云监控的报警通知。（正确答案的数量：2个）',opts:['将联系人直接在云监控的报警联系人中删除','需要验证联系人的手机和邮箱后再删除联系人','将联系人从所在的联系组中删除','只能重新编辑报警规则，选择没有该联系人的联系人组'],exp:'只需删除报警人或者所在的组即可'},
  {id:1187,type:'multi',answer:'BCD',stem:'您申请了阿里云的弹性公网IP（EIP），通过HTTP无法正确地访问该公网IP对应的网页，可能是问题引起的。（正确答案的数量：3个）',opts:['EIP选择了华北2（北京）地域，而您从上海地区访问','弹性公网IP没有绑定到云服务器ECS实例上','云服务器ECS实例有安全组策略，禁止80端口访问','您的账号已经欠费'],exp:'弹性公网IP（Elastic IP Address，简称EIP），是可以独立购买和持有的公网IP地址资源，公网访问是支持全国所以地域的访问的。所以不会因为从上海地区的访问华北2的EIP而无法访问的问题。'},
  {id:1188,type:'multi',answer:'ABC',stem:'路由器是阿里云专有网络VPC的枢纽。下列描述中关于路由器的说法中正确的包括(正确答案的数量：3个）',opts:['创建VPC时，系统会自动为每个VPC创建1个路由器','删除VPC时，会自动删除对应的路由器','不支持直接创建和删除路由器','路由器不支持根据具体的路由条目的设置来转发网络流量'],exp:'路由器支持根据具体的路由条目的设置来转发网络流量。路由条目定义了通向指定目标网段的网络流量的下一跳地址。路由表根据具体的路由条目的设置来转发网络流量。参考链接：https://www.alibabacloud.com/help/zh/doc-detail/53682.htm'},
  {id:1189,type:'multi',answer:'ABD',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。场景适合使用OSS服务。（正确答案的数量：3个）',opts:['手机APP应用的升级包下载','海量图片文件的存储','结构化数据的存储和查询','海量视频文件的存储'],exp:'结构化数据的存储和查询比较适合用RDS等数据库产品解决，不适合使用对象存储OSS服务。'},
  {id:1190,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS的存储费用在所有地域支持“按量付费”，在部分地域支持“包年包月”和“按量付费”两种方式。用户可以通过“包年包月”的付费方式可以获得“资源包”，根据业务需求选择合适的资源包可以节约使用OSS的成本。以下有关OSS“包年包月”收费方式的说法中是正确的。（正确答案的数量：3个） 选项：',opts:['费用一次性支付，立即生效','用户购买的“包','“包年包月”的资源包，采用按存储容量的阶梯计价，容量越大，单价越便宜','存储容量相同的“包年包月”的资源包，购买时长越短，单价越便宜'],exp:'排除法，存储容量相同的“包年包月”的资源包，购买时长越短，单价越贵，购买时长越长，单价越便宜'},
  {id:1191,type:'multi',answer:'AB',stem:'某小企业的业务系统部署在阿里云ECS上，偶尔会遇到操作系统无响应，异常重启或者无法连接实例等问题，其运维人员需要对其进行排查，但是由于服务器ECS是虚拟化的云上服务，用户无法接入显示设备，也无法手动截屏，那么，推荐他采取的措施是（正确答案个数：2个）',opts:['使用云监控服务，查看此故障的详细信息','使用阿里云日志服务SLS，对此类日志进行收集和分析','通过控制台实例详情页查看实例系统日志','通过控制台实例详情页查看实例屏幕截图'],exp:'阿里云监控服务（CloudMonitor）提供ECS实例性能指标和事件监控，能追踪CPU、内存使用情况及系统事件，帮助识别故障触发原因。阿里云日志服务（SLS）支持日志采集、存储、分析，通过自定义查询关键字快速定位系统日志中的异常信息。控制台实例详情页的系统日志（选项C）通常仅记录实例启动过程中的初始化日志，无法反映运行时问题；屏幕截图（选项D）功能在虚拟化环境中不可用。参考阿里云官方文档《云监控产品文档》及《日志服务用户指南》，选项A、B为正确措施。'},
  {id:1192,type:'multi',answer:'ABCDF',stem:'互联网的一次标准的网络层会话可以用五个元素来唯一标识,通常被称为“网络通信五元组”，在此基础之上可以对某些传输过程进行安全控制或防护。网络五元组由五部分组成。（正确答案的数量：5个）',opts:['源IP','传输层协议','目标IP','源端口','应用层协议','目标端口'],exp:'五元组是通信术语。通常是指源IP地址，源端口，目的IP地址，目的端口和传输层协议。参考链接：https://baike.baidu.com/item/%E4%BA%94%E5%85%83%E7%BB%84/6489646'},
  {id:1193,type:'multi',answer:'BCDE',stem:'某社交网站的整个平台基于阿里云的负载均衡SLB、云服务器ECS和云数据库RDS构建，原来只提供WEB纯动态的文字信息交流。最近网络直播很流行，运营团队为了增加会员活跃度，也准备开设网络直播业务，实现全国20万会员随时随地快速观看直播，预计同步在线人数3000人。需要再开通阿里云的产品来支撑这个业务。（正确答案的数量：4个）',opts:['高性能计算 HPC (AliCloud HPC)','弹性伸缩(Auto Scaling)','对像存储OSS','媒体转码（Media Transcoding）','内容分发网络CDN'],exp:'题目中要求创建是社交网站，需要支持直播，所以需要媒体转码（Media Transcoding）服务；同时支持全国的会员随时随地快速观看，所以需要用到对象存储OSS来保存直播视频内容且配合内容分发网络CDN实现全国地区的加速观看。'},
  {id:1194,type:'multi',answer:'AB',stem:'CDN的URL预热功能是指将URL提前上传到CDN的L2节点上，再次访问时无需从源站获取资源，虽然预热没有直接提升L1的命中率，但是提升了CDN的真实命中率。下列场景中CDN缓存命中率均较低，用户可以通过预热URL提升命中率的场景包括（正确答案个数：2个）',opts:['因加速域名流量较低导致从CDN缓存节点提前清除','业务高峰期，源站访问压力大，静态资源访问效率低','静态资源未返回响应头Etag，缓存失败','URL请求带有可变参数导致资源重新回源'],exp:'您可以在业务高峰前预热热门资源，也可以预热流量较低的加速域名，'},
  {id:1195,type:'multi',answer:'ABC',stem:'云服务器ECS系统资源监控DashBoard页面内容有哪些？（正确答案的数量：3个）',opts:['CPU使用率','磁盘IO','网络带宽','TPS'],exp:'DashBoard不支持对TPS的监控'},
  {id:1196,type:'multi',answer:'AB',stem:'您可L以通过方式进行您的阿里云的云服务器ECS实例的运行数据的监控，从而进行监控信息的分析来判断业务的运行状态。 (正确答案的数量：2个)',opts:['通过阿里云的ECS管理控制台的实例详情页面进行CPU利用率和网络的出网和入网情况的监控','通过云监控服务的管理控制台进行实例运行情况的监控，并设置报警规则进行定制化的监控','通过云服务器ECS的管理控制台可以进行监控告警的设置','通过云盾进行ECS实例CPU利用率情况的监控'],exp:'目前只支持在云监控的管理控制台来进行监控告警的设置。'},
  {id:1197,type:'multi',answer:'ABD',stem:'某创业团队开发了一款提供“公共图片服务”的互联网应用，主要用途是为电商类网站提供图片托管用于文件上传、查询和删除。目前该团队准备把全部应用迁到阿里云上，至少应该开通阿里云上的产品。（正确答案的数量：3个）',opts:['对像存储OSS','云服务器ECS','弹性伸缩(Auto Scaling)','内容分发网络CDN'],exp:'题目中说了，需要图片托管，所以需要OSS，需要快速访问，所以需要CDN，需要"自主开发的API接口用于文件上传、查询和删除"，所以需要ECS来部署。没有说到弹性伸缩(Auto Scaling)的要求。'},
  {id:1198,type:'multi',answer:'ABD',stem:'OSS为权限控制提供访问控制列表（ACL），ACL是授予存储空间和对象访问权限的访问策略，OSS支持的ACL权限有这三种。（正确答案个数：3个）',opts:['private','public-read','protected','public-read-write'],exp:'https://help.aliyun.com/document_detail/100676.html?spm=5176.11065259.1996646101.searchclickresult.73217f34jF753W'},
  {id:1199,type:'multi',answer:'AC',stem:'下列ECS实例的生命周期的状态哪些属于中间状态?（正确答案的数量：2个）',opts:['重置中','运行中','停止中','已过期'],exp:'云服务器ECS的运行中和已过期属于稳定状态。'},
  {id:1200,type:'multi',answer:'ABD',stem:'若VPC中创建了ECS实例规格族限制中的ECS实例，则该VPC不支持使用高级功能。专有网络(VPC)的高级功能包括（正确答案个数：3个）',opts:['网络ACL','流日志','自定义交换机','自定义路由表','智能接入'],exp:'专有网络（VPC）的高级功能包括网络ACL、流日志和自定义路由表。'},
  {id:1201,type:'multi',answer:'ABD',stem:'您创建了一台操作系统为Windows的阿里云的云服务器ECS实例，您本地的机器采用的是Windows系统，可以采用（）方式进行登录该ECS实例。（正确答案的数量：3个) 选项：',opts:['ECS实例有公网带宽的情况下，可以通过远程桌面连接（Microsoft Terminal Services Client，MSTSC）登录ECS实例','无论您在创建ECS实例时是否购买了带宽，都可通过阿里云的管理控制台的管理终端登录ECS实例','只有ECS实例有公网带宽的情况下，才可以通过阿里云的管理控制台的管理终端登录实例','ECS实例有公网带宽的情况下，可以通过手机上的远程桌面APP（例如 微软远程桌面MSTSC APP)登录ECS实例'],exp:'实例有无公网带宽，均可通过控制台登陆'},
  {id:1202,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。在OSS里存储文件前首先要创建一个存储空间Bucket,之后才能在Bucket中进行文件的上传和管理。以下有关Bucket的描述中正确的包括（正确答案的数量：3个） 选项：',opts:['同一个Bucket内部的空间是扁平的，所有的对象都是直接隶属于其对应的Bucket','每个用户可以拥有多个Bucket','Bucket的名称在OSS范围内必须是全局唯一的，一旦创建之后无法修改','Bucket在创建时需要指定容量上限'],exp:'Bucket容量是没有上限的，所以无需在创建时指定。'},
  {id:1203,type:'multi',answer:'CDE',stem:'某阿里云用户使用专有网络VPC良规划网络架构，他发现，每个VPC有一张系统自动创建的默认路由器表，VPC的所有交换机默认使用该路由表。他希望灵活地进行网络管理，以下-------动作是VPC可以支持的。（正确答案个数：3个）',opts:['删除系统路由表','删除系统路由','创建自定义路由表','创建自定义路由','将交换机从系统路由表解绑'],exp:'阿里云VPC中，系统路由表随VPC自动创建且不可删除，用户无法移除，但允许修改其路由条目。自定义路由表可被创建并绑定到交换机，实现不同子网的路由策略隔离。交换机默认关联系统路由表，但支持解绑并关联至自定义路由表。阿里云文档指出，用户可增删自定义路由表中的路由条目，交换机的路由表绑定关系可调整。选项A删除系统路由表不可行；B删除系统路由可能存在限制（如默认VPC内通信路由不可删）；C、D、E分别对应创建自定义路由表、添加自定义路由条目、调整交换机绑定关系，均支持。'},
  {id:1204,type:'multi',answer:'ABD',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。为了方便用户把OSS服务集成到自己的网站或应用中，OSS提供了“自定义域名绑定”的功能，通过该功能用户可以实现通过自己的域名来访问OSS中的文件（如：http://img.mydomain.net/xxxx)。以下有关OSS绑定域名的相关说法是正确的。（正确答案的数量：3个）',opts:['如果用户绑定的域名和OSS服务在同一个阿里云帐号中管理，在OSS管理控制台中可以选择自动添加或修改域名的CNAME记录','不管域名是否在阿里云管理，绑定到OSS的域名必须在工信部备案','如果在OSS绑定域名时提示绑定的域名已经被其他用户绑定，此时用户无需额外操作即可进行强制绑定','绑定域名的时候可以选择“自动”或“手动”添加域名解析'],exp:'在OSS绑定域名时提示绑定的域名已经被其他用户绑定，需要验证域名所有权后才可继续进行绑定操作。参考链接：https://help.aliyun.com/knowledge_detail/39675.html'},
  {id:1205,type:'multi',answer:'ABC',stem:'在对阿里云的云服务器ECS实例进行续费操作时还可以做一些云服务器变配的操作，可以实现的操作包括（正确答案的数量：3个）',opts:['将云服务器ECS实例的CPU规格从8核降到4核','将云服务器ECS实例的内存空间从4GB提升到8GB','将云服务器ECS实例的固定带宽模式，变为按量计费方式','在实例操作系统内重启后，新配置会立即生效'],exp:'修改配置操作完成后，您必须通管理控制台重启实例或使用 RebootInstance 接口重启实例，新配置才能生效。而非操作系统内重启。'},
  {id:1206,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS是阿里云',opts:['从管理控制台批量选择并删除','如果名称有一定的规则，可以调用OpenAP或SDK去删除','可以通过OSS管理控制中的“生命周期管理（LifeCycle）”自动删除','通过OSS的碎片管理功能去删除'],exp:'碎片管理功能是用来删除一些文件删除残留的'},
  {id:1207,type:'multi',answer:'BD',stem:'您需要将阿里云的专有网络VPC与传统数据中心组成一个按需定制的网络环境，实现应用的平滑迁移上云。专有网络VPC可以与连接方式组合良实现该架构。（正确答案的数量：2个）',opts:['vRouter','专线','SDN','VPN'],exp:'根据题意，需要让专有网络VPC与传统数据中心实现内网访问，所以专线和VPN可以满足要求。'},
  {id:1208,type:'multi',answer:'ABC',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，具有高可用、低成本、安全可靠等特点。关于阿里云的负载均衡SLB的说法正确的有（正确答案的数量：3个）',opts:['无需一次性采购昂贵的负载均衡设备','解决了单台ECS实例的单点问题','支持同城容灾','结合云盾提供免费的20G以上的防DDoS攻击能力','无论公网还是私网类型实例都支持按流量计费'],exp:'SLB不需要购买设备，同时支持同城容灾。结合云盾提供免费的5G防DDoS攻击能力；负载均衡SLB的作用就是为了解决单台云服务器单点问题，负载均衡后端多台ECS同时对外提供服务从而扩展了应用的服务能力，增强了应用的可用性；SLB实例的收费不仅有流量费还要实例费/规格费（参考链接：https://help.aliyun.com/document_detail/27692.html'},
  {id:1209,type:'multi',answer:'AC',stem:'某用户在手动释放经典网络ECS实例时，希望能够保留实例的公网IP继续作为对外服务的IP地址。该用户在手动释放时选择将公网IP转换为弹性公网IP，操作成功后（正确答案个数：2个）',opts:['一般情况下，公网带宽值和原ECS实例保持一致','公网网卡和相应的Mac地址仍被保留','EIP采用按使用流量计费方式','EIP仍可以选择挂载到经典网络类型ECS实例'],exp:'经典网络公网IP转换为EIP后： • 采用按使用流量计费方式。 • 公网带宽值和原ECS实例保持一致，您可以按需在专有网络管理控制台上升配EIP的公网带宽。但是，如果转换前经典网络类型ECS实例带宽为0Mbit/s，转换后的EIP带宽自动升级为1Mbit/s。 • 不能挂载到经典网络类型ECS实例上。 • 不同于专有网络VPC类型ECS实例，经典网络类型ECS实例具有公网网卡。如果您将经典网络公网IP转换为EIP，则无法保留该公网网卡和相应的Mac地址。'},
  {id:1210,type:'multi',answer:'AB',stem:'阿里云的云监控的“站点监控”功能可以对目标站点服务的可用性以及响应时间进行监控。系统已经默认预置了8种监控类型，包括http监控、ping监控、tcp监控、udp监控、DNS监控、pop监控、Smtp监控、ftp监控，其中每种监控类型里面包含了两个监控项，分别是和（正确答案的数量：2个）',opts:['响应时间：responsetime','状态码：status','响应内容长度：length','请求时间：requestime'],exp:'站点监控可以对目标站点服务的可用性以及响应时间进行监控。系统已经默认预置了8种监控类型，包括http监控、ping监控、tcp监控、udp监控、DNS监控、pop监控、smtp监控、ftp监控。其中每种监控类型里面包含了两个监控项：status和responsetime。参考链接：https://wenku.baidu.com/view/d2f007b1482fb4daa48d4b39.html'},
  {id:1211,type:'multi',answer:'AB',stem:'阿里云ECS有两种网络类型经典网络与专有网络，这两种类型的区别分别是（正确答案个数：2个)',opts:['经典网络由阿里云统一规划和管理，更适合对网络易用性要求比较高的用户','专有网络是指用户在阿里云的基础网络内建立一个可以自定义的专有网络隔离网络','经典网络可以进行自定义网络，专有网络无法自定义','经典网络需要用户进行管理，专有网络更加的简单无需专业的网络管理'],exp:'阿里云官网文档对ECS网络类型的说明中，经典网络属于统一规划管理的网络资源，用户无需自行配置，适合快速部署和简单使用场景。选项A准确描述这一特性。专有网络（VPC）允许用户在云端创建逻辑隔离的自定义私有网络，用户可自主划分网段、配置路由和网关。选项B符合VPC的定义。选项C错误，因VPC支持自定义而经典网络不支持。选项D错误，因VPC需要用户进行网络配置管理，而经典网络由阿里云托管。'},
  {id:1212,type:'multi',answer:'ABCD',stem:'以下哪些配置是在购买ECS时需要指定的？（正确答案的数量：4个）',opts:['CPU','内存','地域','镜像','IP地址'],exp:'IP地址是购买ECS随机分配的，不支持指定。'},
  {id:1213,type:'multi',answer:'ABC',stem:'地域指的是阿里云的云服务器ECS实例所在的物理位置。用户可以根据自己的客户群体分布的不同选择不同地域的云服务器ECS实例提供服务。以下关于ECS实例的地域说法正确的是（正确答案的数量：3个）',opts:['同一地域内的ECS实例内网间是可以互通的','不同地域之间的ECS实例内网不互通','不同地域之间的不同云产品，内网不互通','华北1（青岛）的ECS实例可以通过内网访问华东1（杭州）的云数据库RDS实例','美西（硅谷）的ECS实例可以通过内网访问亚太（新加坡）的OSS Bucket'],exp:'同一个地域之间内网是互通的，不同的地域之前内网默认不互通。所以华北1（青岛）的ECS实例是不可以通过内网访问华东1（杭州）的云数据库RDS实例；美西（硅谷）的ECS实例是不可以通过内网访问亚太（新加坡）的OSS Bucket。'},
  {id:1214,type:'multi',answer:'ABCD',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。OSS服务的使用费由“存储费用”、“流量费用”、“API请求费用”三部分组成。在实际业务场景中，用户可以根据实际情况优化使用方式来降低OSS的使用成本。以下是某管理员提出的几项优化建议，您认为可以直接降低OSS使用成本。（正确答案的数量：4个）',opts:['如果OSS服务产生的费用中外网流量费用占比较大，可以结合阿里云CDN服务来降低OSS的流量费用','如果云服务器ECS和OSS在同一地域，可以使用OSS内网地址通信，降低流量费用','如果业务的访问量比较平稳，存储空间和外网流量可预测，可以购买包年包月的资源包来降低存储和流量两项费用','定期删除已经过期不用的文件，降低占用的OSS存储空间，节约存储费用','对OSS的大批量操作尽量安排在晚上，夜间的API请求费用更低'],exp:'排除法，OSS是收费是统一的，不会因为时间的差异而导致相应的费用差异。'},
  {id:1215,type:'multi',answer:'ABC',stem:'云计算是分布式计算的一种，指的是通过网络”云”将巨大的数据计算处理程序分解成无数个小程序，然后,通过多部服务器组成的系统进行处理和分析这些小程序得到结果并返回给用户.以下关于云计算特点的说法正确的是（正确答案个数：3个）',opts:['虚拟化','超大规模','高可靠性','只支持单租户','费用昂贵'],exp:'云计算特点来源于其技术架构与应用模式。虚拟化（A）指通过技术将物理资源抽象为逻辑资源，实现资源灵活分配。超大规模（B）体现在服务提供商的全球分布式数据中心和庞大的服务器集群，支持海量数据处理。高可靠性（C）通过冗余设计、负载均衡、容错机制保障服务连续性。多租户而非单租户（D错误）是云计算基础特性，资源池化后供多用户共享。费用昂贵（E错误）不符实际，因云计算通常采用按需付费模式，降低前期投入成本。参考《NIST云计算定义》及主流云服务商技术白皮书。'},
  {id:1216,type:'multi',answer:'BCD',stem:'阿里云官网有很多阿里云内容分发网络CDN与其它云产品组合的方案与业务场景供用户参考。以下选项中场景适合使用阿里云内容分发网络CDN。（正确答案的数量：3个）',opts:['日访问次数低于100的BBS论坛','日访问次数大于10万次的阿里云虚拟主机纯静态站点','某中型电商类网站中的图片、html、css、js文件','新闻门户网站，日访问人数超过3000万次，用户遍布全国各地'],exp:'日均低于100的访问次数，不适合用CDN，因为热点不够，可能不足够形成CDN热点文件。同时从成本出发也不适合使用。'},
  {id:1217,type:'multi',answer:'AB',stem:'如果您需要对阿里云的专有网络VPC下的云服务器ECS实例的私网IP进行修改，可以通过以下方式变更。（正确答案的数量：2个）',opts:['当需要修改的地址超出ECS实例所在的交换机的地址范围时，可以变更云服务器ECS实例所在的交换机，并变更云服务器ECS实例的私网IP','当需要修改的地址没有超过ECS实例所在的交换机的地址范围时，可直接变更云服务器ECS实例的私网IP','当需要修改的地址超出ECS实例所在的路由器的地址范围时，变更云服务器ECS实例所在的路由器，并变更云服务器ECS实例的私网IP','当需要修改的地址没有超过ECS实例所在的路由器的地址范围时，可直接变更云服务器ECS实例的私网IP'],exp:'修改私网IP地址有两种方式：如果您不需要更换交换机，则直接修改私网IP即可。如果需要更换交换机，则可以变更云服务器ECS实例所在的交换机，然后直接修改云服务器ECS实例的私网IP。参考链接：https://help.aliyun.com/document_detail/27733.html，https://help.aliyun.com/document_detail/27733.html'},
  {id:1218,type:'multi',answer:'ACD',stem:'您希望将您的应用部署在阿里云的产品上，并具备较高的可用性，以下可以满足您提升应用可用性的需求。（正确答案的数量：3个）',opts:['使用负载均衡SLB挂载同一个地域的不同可用区的云服务器ECS实例来提升同一个地域的服务可用性','使用负载均衡SLB挂载不同地域的云服务器ECS实例来提升服务的可用性','在不同的地域中请负载均衡SLB挂载同一地域的不同可用区的云服务器ECS实例，同时结合CNS域名解析与多个负载均衡SLB结合使用，来提升服务的可用性','使用多个地域的云服务器ECS实例来部署服务，提升服务的可用性'],exp:'同一个负载均衡不可以挂载多个地域的云服务器'},
  {id:1219,type:'multi',answer:'ABCE',stem:'您已经购买了阿里云的一台云服务器ECS实例并挂载3块数据盘，现在需要对该云服务器ECS实例进行升级，可以升级的配置包括（（正确答案的数量：4个）',opts:['有限的扩展磁盘的容量','CPU','内存','无上限的增加数据盘','带宽'],exp:'一台ECS实例最多能挂载16块云盘作数据盘用，所以并不支持无上限的增加数据盘。参考链接：https://help.aliyun.com/document_detail/25446.html'},
  {id:1220,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力方面具备明显的优势。属于OSS可靠性方面的优势。（正确答案的数量：3个）',opts:['服务可用性不低于99.9%，不受限于硬件可靠性','存储规模可自动扩展，OSS对外服务不中断','数据自动多重冗余备份','底层数据异地存储（自动在多个地域分散保存）'],exp:'参考链接：https://help.aliyun.com/document_detail/31818.html'},
  {id:1221,type:'multi',answer:'BC',stem:'D公司两年前使用阿里云对象存储OSS和云服务器ECS实例构建了视频内容的展示和下载的网站。为了提高用户的体验，该网站不再提供视频下载，变为视频在线播放，同时覆盖全国范围内2000万的用户群，为了让不同地域的用户都获得良好的播放体验，D公司应该至少增加阿里云的产品。 （正确答案的数量：2个)',opts:['云数据库RDS','音视频转码服务MTS','内容分发网络CDN','云服务器ECS'],exp:'划重点：不再提供视频下载，变为视频在线播放。时覆盖全国范围内2000万的用户群。所以需要视频解码MTS和内容分发CDN。'},
  {id:1222,type:'multi',answer:'AD',stem:'开启OSS的存储空间(Bucket)版本控制特性后，针对数据的覆盖和删除操作将会以历史版本的形式保存下来，以下关于该特性的描述中，正确的有（正确答案个数：2个）',opts:['Bucket开启版本控制后，被覆盖或删除的文件都会成为历史版本被保存下来','Bucket开启版本控制后，被覆盖或删除的文件都不会被保存下来','Bucket开启版本控制，可与设置合规保留策略搭配使用','开启Bucket版本控制后，无法返回到非版本化状态'],exp:'阿里云对象存储OSS的版本控制功能启用后，覆盖或删除操作将生成历史版本。选项A指出覆盖或删除的文件保存为历史版本，与官方文档描述一致。选项D提到无法返回非版本化状态，OSS支持暂停版本控制但不允许完全关闭，符合产品特性。选项C的合规保留策略需结合具体功能实现，此处未明确对应。选项B与版本控制机制直接矛盾。参考阿里云OSS版本控制相关文档。'},
  {id:1223,type:'multi',answer:'ACE',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，可以通过流量分发扩展应用系统对外的服务能力，通过消除单点故障提升应用系统的可用性。以下说法中正确的有）（正确答案的数量：体3个)',opts:['有公网IP的负载均衡SLB实例删除后重建会分配一个新的公网IP，原有公网IP不可恢复','在通过负载均衡SLB实例对外提供服务前，要确保已经完成并正确配置了所有负载均衡SLB实例后端云服务器ECS实例上的应用服务','负载均衡SLB实例配置了健康检查，若一部分后端ECS实例宕机且仍有能正常提供对外服务的ECS实例，应用系统仍旧可以继续工作','负载均衡SLB实例提供后端云服务器ECS实例间的数据自动同步功能，采用的是rsync的远程同步技术','负载均衡SLB实例配置了健康检查，若一部分后端ECS实例宕机，负载均衡将移除该部分ECS实例'],exp:'在通过负载均衡SLB实例对外提供服务前，只需要确保SLB后端有一台ECS应用正常运行；若SLB未结合弹性伸缩一起使用，后端ECS实例宕机SLB会将其隔离（不再给其分发请求），直到该ECS健康检查恢复正常后，还会从隔离区移出，继续分发请求。'},
  {id:1224,type:'multi',answer:'AB',stem:'CDN提供两种计费方式任选：按流量或按带宽峰值。为什么CDN实际产生的流量却要比应用层统计到的流量要高？（正确答案的数量：2个）',opts:['TCP/IP包头的消耗','TCP重传','链路消耗','设备消耗'],exp:'文档的原话，加速域名日志中记录的流量数据，是我们应用层日志统计出的流量，但是实际产生的网络流量却要比应用层统计到的流量要高出7%-15%；这个主要的原因有两个：1、TCP/IP包头的消耗，2、TCP重传。参考链接：https://help.aliyun.com/knowledge_detail/40164.html'},
  {id:1225,type:'multi',answer:'ABC',stem:'阿里云负载均衡SLB是对多台云服务器ECS实例进行流量分发的服务。配置和管理一个负载均衡SLB实例，主要涉及以下操作。 （正确答案的数量：3个)',opts:['负载均衡SLB实例的属性配置','负载均衡SLB实例的监听配置','负载均衡SLB实例的后端ECS实例配置','负载均衡SLB的公网IP','负载均衡SLB的操作日志存储位置'],exp:'公网IP是购买负载均衡SLB时候系统分配的，或者你单独购买EIP后单独给负载均衡SLB绑定。并不是在你在负载均衡的配置和管理里面可以设定的。'},
  {id:1226,type:'multi',answer:'BCD',stem:'SLB中的四层负载均衡采用开源软件LVS，并根据云计算的需求对其官方进行了定制化，下列哪些属于阿里云在LVS官方问题上进行了定制化？（正确答案的数量：3个）',opts:['采用Tengine实现负载均衡','DDoS攻击防御功能','采用LVS集群部署方式','优化keepalived性能'],exp:'这个是文档原话：优化了以下问题： 解决1：新增转发模式FULLNAT，实现LVS-RealServer间跨vlan通讯； 解决2：新增synproxy等攻击TCP标志为DDOS攻击防御功能； 解决3：采用LVS集群部署方式； 解决4：优化keepalived性能； 但是此处需注意的是采用LVS集群部署方式不是阿里进行定制化的，而是LVS自带此功能'},
  {id:1227,type:'multi',answer:'ABCDE',stem:'阿里云的云服务器ECS产品拥有传统服务器和虚拟主机无法企及的优势。在易用性方面，云服务器ECS产品具备明显特点。（正确答案的数量：5个）',opts:['阿里云的云市场提供了丰富的操作系统和应用软件','通过镜像可一键部署相同的操作系统和软件环境','可快速复制多台ECS实例','支持自定义镜像、数据盘快照','通过阿里云的管理控制台可以在任何地方进行云服务器ECS实例的管理','可以任意修改云服务器ECS实例的各种系统配置，也不会影响ECS实例的正常使用'],exp:'任意修改云服务器ECS实例的各种系统配置可能会导致服务器出现异常。'},
  {id:1228,type:'multi',answer:'ACDE',stem:'IT系统的安全构成按照等保的划分维度，包括哪几个',opts:['物理和环境安全','地域和选址安全','网络和通信安全','设备和计算安全','应用和数据安全','团队意识安全'],exp:'《信息安全技术网络安全等级保护基本要求》（等保2.0）将安全措施划分为物理和环境、网络和通信、设备和计算、应用和数据四个技术层面。物理和环境安全（A）涉及机房、防火防雷等基础设施；网络和通信安全（C）包括网络边界防护、访问控制；设备和计算安全（D）涵盖终端设备、操作系统安全；应用和数据安全（E）指业务应用系统的身份鉴别、数据完整性保护。选项B（地域选址）属于物理安全子项而非独立维度，F（团队意识）属管理范畴，不属于技术层面的风控构成。'},
  {id:1229,type:'multi',answer:'AB',stem:'当您发现无法将指定的阿里云的块存储挂载到某台的云服务器ECS实例上时，可能是原因造成的。（正确答案的数量：2个）',opts:['云服务器ECS实例已经挂载的数据盘数量达到上限','购买的块存储和云服务器ECS实例不在同一个可用区','云服务器ECS实例处于已停止状态','云服务器ECS实例没有公网IP'],exp:'题目中所说的是无法将数据盘挂载到ECS上面，请分析一下原因。分析一下挂载云盘的注意事项：https://help.aliyun.com/document_detail/25446.html，发现 一台ECS实例最多能挂载16块云盘作数据盘用，且云盘只能挂载到同一地域下同一可用区内的实例上，不能跨可用区挂载。'},
  {id:1230,type:'multi',answer:'D',stem:'阿里云的弹性伸缩、云服务器ECS以及负载均衡SLB实例三者搭配可以实现高可用架构，可实现弹性伸缩自动负载均衡，大大降低了成本等，其中关于阿里云弹性伸缩下列说法正确的是（正确答案个数：2个）',opts:['同一个伸缩组中的云服务器ECS实例配置一定相同','同一伸缩组内，同一时刻可以有多个伸缩活动在执行','支持多种阿里云产品的动态伸缩，包括云服务器ECS、云数据库RDS、负载均衡SLB以及表格存储','伸缩模式丰富，可同时配置多种伸缩模式'],exp:'其他三个答案都是错的，这题有问题 具体的根据自己判断选择，原题就是这样'},
  {id:1231,type:'multi',answer:'ABC',stem:'虚拟化（英语：Virtualization）是云计算的底层结构。它是一种资源管理技术，是将计算机的各种可以比原本的组态更好的方式来应用这些资源。对于虚拟实例的实现方式，包括下面几类：（正确答案的数量：3个）',opts:['全虚拟化','半虚拟化','硬件辅助虚拟化','分布式虚拟化'],exp:'虚拟化技术包括：全虚拟化，半虚拟化，硬件辅助虚拟化。参考链接：https://www.jianshu.com/p/312056e70387'},
  {id:1232,type:'multi',answer:'ACD',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力方面具备明显的优势。属于OSS安全方面的优势。（正确答案的数量：3个）',opts:['免费支持防DDoS攻击、自动流量清洗及黑洞功能','流量清洗和黑洞设备需要另外购买，OSS提供强大的API支持','多用户资源隔离机制','提供多种鉴权和授权机制及白名单、防盗链、主子账号功能'],exp:'题目中问的是OSS安全方面的优势，OSS提供企业级多层次安全防护，无需另外购买清洗和黑洞设备。参考链接：https://help.aliyun.com/document_detail/31818.html'},
  {id:1233,type:'multi',answer:'AC',stem:'对象存储服务（Object Storage Service，OSS）是一种海量、安全、低成本、高可靠的云存储服务，支持不同的存储类型，其中，关于归档存储类型特性，描述正确的有（正确答案个数：2个）',opts:['数据可靠性与标准存储类型相同','服务可用性与标准存储类型相同','不支持实时访问','不支持图片处理'],exp:'https://help.aliyun.com/document_detail/51374.html?spm=a2c4g.11174283.6.617.67947da2ZZHZkh'},
  {id:1234,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS里存储的所有文件必须隶属于某个存储空间Bucket，当一个用户创建了多个Bucket，每个Bucket为不同的应用服务时，最安全的方法是让每个应用只能访问对应的Bucket。阿里云的OSS与访问控制RAM配合可以满足此类业务需求。OSS配合RAM的方案描述正确的是（正确答案的数量：3个）',opts:['开发环境和正式线上环境中的应用使用不同的Bucket','允许某个应用读，另一个应用写同一个Bucket里的文件','让某个应用临时读写某个Bucket，凭证过期后无法访问','不同的应用访问不同的Bucket，但是权限只有“允许”和“拒绝”，不区分“读”和“写”'],exp:'不同的应用是应该访问不同的Bucket，权限不仅需要有“允许”和“拒绝”，而且为了安全，也需要区分“读”和“写”。'},
  {id:1235,type:'multi',answer:'BC',stem:'某公司将其核心业务电商网站部署在阿里云上使用多可用区类型的负载均衡SLB做流量分发。由于负载均衡的主备可用区级别的容灾。只有当主可用区整体不可用时，负载均衡才会切换到备可用区。当网络攻击或配置错误等情况导致负载均衡实例不可用时，由于未出现可用区级故障，不会触发负载均衡实例的可用区切换。在此场景下，若该公司要提供负载均衡服务的可用性，建议采取的措施是。（正确答案个数：2个）',opts:['将多个可用区负载均衡实例改为单可用区实例，发生故障时可切换到同一可用区中的备实例','创建多个SLB实例，通过云解析DNS对访问进行调度','创建多个SLB实例，通过全球负载均衡解决方案实现跨地域容灾备份','使用云服务器ECS上部署LVS集群，当SLB实例出现故障时，切换到LVS集群'],exp:'https://help.aliyun.com/document_detail/67915.html?spm=5176.11065259.1996646101.searchclickresult.2303336aQb309g'},
  {id:1236,type:'multi',answer:'AC',stem:'专有网络是基于阿里云构建的一个隔离的网络环境，专有网络之间逻辑上彻底隔离。可以自定义这个专有网络的拓扑和IP地址，适用于对网络安全性要求较高和有一定网络管理能力的用户。IP地址是访问ECS实例或者用户访问部署在ECS实例上的服务的主要方式，专有云网络VPC类型的ECS实例有两种IP地址，分为和（正确答案个数：2个）',opts:['私有IP','私网IP','公网IP','内网IP'],exp:'IP地址是您访问ECS实例或者您的用户访问部署在ECS实例上的服务的主要方式。专有网络VPC类型的ECS实例有两种IP地址，分为私有IP地址和公网IP地址'},
  {id:1237,type:'multi',answer:'ACD',stem:'阿里云弹性伸缩(AutoScaling)中的伸缩组，是指具有相同应用场景的ECS实例集合。当用户创建一个伸缩组时需要包含以下哪些内容？（正确答案的数量：3个）',opts:['伸缩规则','伸缩活动','伸缩配置','伸缩触发任务'],exp:'创建一个伸缩组时必须包含的内容有：伸缩规则（定义如何伸缩）、伸缩配置（定义启动新实例的模板）、伸缩触发任务（定义何时触发伸缩）。伸缩活动是伸缩组根据规则和触发条件执行伸缩动作的过程记录，是创建组之后运行时产生的，不属于创建时的必需内容。因此答案为ACD'},
  {id:1238,type:'multi',answer:'ABCD',stem:'云监控是阿里巴巴集团多年来服务器监控技术研究积累的成果，结合阿里云的云计算平台强大的数据分析能力客户提供各种应用和服务器的第三方监控服务，当出现异常时可以通过以下哪些方式进行报警通知？（正确答案的数量：4个）',opts:['手机短信','钉钉机器人','电子邮件','电话','微信','QQ'],exp:'目前云监控报警支持的通知方式为：电话+短信+邮件+钉钉机器人。参考连接：https://help.aliyun.com/document_detail/35179.html'},
  {id:1239,type:'multi',answer:'ABC',stem:'Google在2003年到2006年期间陆续公布了三篇技术论文，这也逐渐成为云计算发展的基石。这三篇论文主要阐述的内容和以下哪几项技术相关？（正确答案数量：3个） 选项：',opts:['GFS','BigTable','MapReduce','HBase'],exp:'Google 在 2003 年到 2006 年公布了关于 GFS、MapReduce 和 BigTable 三篇技术论文。参考链接：https://wenku.baidu.com/view/7ac65964a8114431b80dd84c.html'},
  {id:1240,type:'multi',answer:'AD',stem:'在使用阿里云弹性伸缩(AutoScaling)时，在用户创建好伸缩组、伸缩配置、伸缩规则、伸缩触发任务以后，伸缩触发任务会按照各自“触发条件”来触发伸缩活动，以下哪些情况不会触发伸缩活动？（正确答案的数量:2个)',opts:['伸缩组内所有云服务器ECS实例的CPU占用率最大值大于60%','伸缩组内所有云服务器ECS实例的IOPS平均值小于100','到了用户配置的定时时间','伸缩组内所有云服务器ECS实例响应的请求中，有超过50%的请求在执行写操作'],exp:'阿里云弹性伸缩的触发条件基于配置的具体指标，如CPU平均利用率、系统负载或定时任务等。根据官方文档，伸缩活动触发需满足定义的云监控指标阈值，且需在伸缩规则中明确指定相关参数。选项A中“最大值大于60%”可能与实际触发条件（如平均CPU使用率）不符，无法触发；选项D中请求类型（写操作比例）并非弹性伸缩支持的监控指标，因此不会触发。选项B可能对应缩容规则中的IOPS条件，选项C对应定时任务，均符合触发条件。答案参考阿里云弹性伸缩产品文档关于伸缩触发条件的说明。'},
  {id:1241,type:'multi',answer:'AD',stem:'负载均衡SLB到期之后，会对SLB的后端ECS实例造成什么影响？（正确答案的数量：2个）',opts:['云服务器ECS本身不会受到影响','如果域名是解析到SLB上的，那么不会影响站点的访问','ECS服务器会同时到期','如果部署在ECS上的应用对应的域名是解析到SLB上的，那么会影响站点的访问'],exp:'负载均衡SLB到期，导致用户无法访问负载均衡SLB服务，影响站点的访问。同时负载均衡SLB也无法将请求分发至后端的服务器。但是云服务器ECS本身的服务还是会正常提供不受影响的。'},
  {id:1242,type:'multi',answer:'ACDE',stem:'您基于业务需求的需要，需要创建一台新的云服务器ECS实例来满足业务的需求，创建该ECS实例时需要要考虑如下哪些条件的限制？（正确答案的数量：4个）',opts:['原有的服务部署的云服务器ECS实例所在的地域和可用区','服务器ECS实例是否能够支持基础DDoS攻击','云服务器ECS实例的地域','云服务器ECS实例的操作系统','云服务器ECS实例所在的可用区'],exp:'题目中问的是创建一个新的云服务器ECS实例与之前的实例搭配来完成需求，因为云服务器ECS实例支持5G以下的基础DDoS攻击，所以不需要考虑。'},
  {id:1243,type:'multi',answer:'AB',stem:'您已经基于阿里云的云服务器ECS实例构建好了一个web网站，向外提供服务，最近你发现随着访问量的上涨，您的客户访问图片的速度有的时候会很慢，你发现网页通过手机和pad等进行访问的时候，图片的适配也做的不太好，有些影响业务。通过方式可以最高效率地解决您碰到的问题。（正确答案的数量：2个）',opts:['将网站的图片内容存放到OSS中,并开通图片处理的功能，在不同的性能访问时再将图片处理能力进行实时处理中解决适配问题','将网站的图片内容存放到对象存储OSS中解决访问速度慢的问题','自己开发图片适配的能力来匹配不同的终端访问','将网站的图片内容存放到RDS中解决访问速度慢的问题'],exp:'题目中说了会有图片访问速度很慢，以及图片的适配较差，所以需要用对象存储OSS中解决访问速度慢的问题，结合对象存储OSS中的图片处理能力来解决图片适配差的问题。'},
  {id:1244,type:'multi',answer:'ACD',stem:'创建阿里云的云服务器ECS实例时需要选择地域，地域有时候也被称为“节点”，是指实例所在的地理位置。关于ECS实例地域的说法正确的包括（正确答案的数量：3个）',opts:['地域与用户距离越近，延迟越少，下载速度越快。例如，您的用户都分布在华北地区，则可以选择在华北2（北京）地域创建ECS实例实现更快的访问','云服务器ECS实例创建完成后可以更换地域','不同地域提供的可用区数量、实例系列、存储类型、实例价格等会有所差异，可以根据业务需求进行选择','不同地域间的内网不能互通'],exp:'云服务器ECS不支持更换地域，也不支持更换可用区。'},
  {id:1245,type:'multi',answer:'ABCD',stem:'阿里云弹性伸缩(Auto Scaling)中的伸缩触发任务用于触发伸缩规则的任务，常见的有定时任务、云监控的报警任务等。对于报警任务，支持以下哪些触发条件？（正确答案的数量：4个） 选项：',opts:['CPU负载','内存利用率','系统平均负载','外网和内网出入流量','磁盘IOPS'],exp:'报警任务支持：CPU，内存，系统平均负载，内外网出和入流量，TCP总连接数和已建立连接数。系统盘读和写BPS，系统盘读和写IOPS，内网网卡收包数和发包数。磁盘IOPS不是具体的确定的属性，具体的要区分具体的系统盘读和写BPS，系统盘读和写IOPS。'},
  {id:1246,type:'multi',answer:'ABCE',stem:'阿里云弹性伸缩(AutoScaling)，是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务。以下关于阿里云弹性伸缩的优势说法正确的有（正确答案的数量：4个）',opts:['根据设定策略自动调整弹性计算资源，满足业务波动性比较大的场景','伸缩模式丰富，可同时配置多种伸缩模式','按规则自动创建和释放云服务器ECS实例，自动配置RDS访问白名单','支持多种阿里云产品的动态伸缩，包括云服务器ECS、云数据库RDS、负载均衡SLB以及表格存储（Table Store，原OTS）','根据需求分配资源，在无法准确预测业务变化时，解决业务连续性的问题'],exp:'弹性伸缩目前只支持ECS及其数据盘的弹性伸缩，不支持云数据库RDS、负载均衡等云产品的弹性伸缩。'},
  {id:1247,type:'multi',answer:'ACD',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。OSS免费提供了多种监控报表，方便用户随时关注OSS中文件的访问和资源占用情况。OSS支持监控功能。（正确答案的数量：3个)',opts:['存储空间的监控','访问OSS文件的用户终端类型（PC端或手机端）的监控','对OSS服务请求的PV访问量（包括PUT、GET的请求数）的监控','对OSS服务请求的UV访问人次的监控'],exp:'OSS不支持对终端的类型进行监控。'},
  {id:1248,type:'multi',answer:'ABCDE',stem:'您在创建阿里云的云服务器ECS实例时可选的镜像包括（正确答案的数量：5个）',opts:['阿里云提供的公共镜像','阿里云镜像市场的镜像','基于云服务器ECS实例制作的自定义镜像','其他阿里云用户共享给您的自定义镜像','从其他地域复制过来的自定义镜像','用户上传的镜像'],exp:'题目中问的是创建阿里云的云服务器ECS实例时可选的镜像，虽然用户是可以自己上传本地镜像的，但是上传的本地镜像需要用户把本地镜像制作为自定义镜像，所以在创建云服务器ECS的时候是没有用户上传的镜像的选项的。'},
  {id:1249,type:'multi',answer:'ABC',stem:'专有网络VPC是用户在阿里云上创建的自定义的私有网络，不同的专有网络VPC之间彻底逻辑隔离。以下功能是专有网络VPC提供的。（正确答案的数量：3个）',opts:['设置私有IP地址范围','划分网段','配置路由表','VPN连接'],exp:'VPC支持VPN连接 但是这不是他提供的功能，VPN连接还是依赖于其他设备和网络。'},
  {id:1250,type:'multi',answer:'BCD',stem:'阿里云的云服务器ECS实例的可用区是指在同一地域内，电力和网络互相独立的物理区域。关于云服务器ECS可用区的说法正确的是（正确答案的数量：3个）',opts:['如果您的应用需要较高的容灾能力，建议您将云服务器ECS实例部署在同一地域的同一可用区内','同一可用区内的ECS实例之间的网络延时更小','在同一地域内不同可用区之间内网互通，可用区之间能做到机房级别的故障隔离','是否将云服务器ECS实例放在同一个可用区内，主要取决于对容灾能力和网络延时的要求','如果您的应用在ECS实例之间需要非常低的网络时延，则建议您将ECS实例创建在不同的可用区内'],exp:'看清题意，如果您的应用需要较高的容灾能力，建议您将云服务器ECS实例部署在同一地域的不同可用区内；如果您的应用在ECS实例之间需要非常低的网络时延，则建议您将ECS实例创建在相同的可用区内。'},
  {id:1251,type:'multi',answer:'AC',stem:'创建阿里云专有网络VPC的网段为172.16.0.0/12，在该VPC下创建交换机的时候可以使用的私有网段是',opts:['172.16.0.0/16','172.15.0.0/16','172.30.0.0/24','172.32.0.0/16'],exp:'专有网络VPC的网段为172.16.0.0/12，其地址范围是172.16.0.0至172.31.255.255。交换机子网必须是VPC网段的子集，且掩码长度不能小于VPC掩码（/12）。选项A 172.16.0.0/16在VPC范围内且掩码更长，符合要求；选项C 172.30.0.0/24也在VPC范围内且掩码更长，符合要求；选项B 172.15.0.0/16不在VPC范围内；选项D 172.32.0.0/16超出VPC上限172.31.255.255，均错误。'},
  {id:1252,type:'multi',answer:'ABC',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，可以通过流量分发扩展应用系统对外的服务能力，通过消除单点故障提升应用系统的可用性。阿里云的负载均衡SLB包括等主要的组成部分。（正确答案的数量：3个）',opts:['LoadBalancer','Listener','Backend Server','Heartbeat'],exp:'考察负载均衡由以下三个部分。参考链接：https://help.aliyun.com/document_detail/27539.html'},
  {id:1253,type:'multi',answer:'ABC',stem:'阿里云的云盾的先知计划，是调动众多网络安全专家的力量一起维护互联网平台和业务的安全，降低客户的安全损失。适合使用先知计划的用户包括（正确答案的数量：3个）',opts:['网站曾经被入侵，导致数据被泄露或者业务被篡改，造成公关风险，影响了公司形象和业务，正在寻求互联网安全解决方案','网站漏洞多次被曝光，被竞争对手恶意炒作，正在寻求互联网安全解决方案','买了很多安全产品和设备，但还是出现被攻击和入侵的情况，正在寻求互联网安全解决方案','用户的业务全部部署在自己的局域网，在公共互联网上无法访问，正在寻求内网安全的解决方案'],exp:'排除法，用户的业务全部部署在自己的局域网，则在公网无法访问，所以无法适用于先知的使用场景。'},
  {id:1254,type:'multi',answer:'ABCE',stem:'阿里云的负载均衡SLB支持多种协议的转发服务，其中就包括UDP，它是面向非连接的协议，发送数据包前并不会与对方建立连接，且不提供差错恢复和数据重传。它的优点是速度快，效率高，对某些特定的场景来说非常适合。您手上有几家正在使用负载均衡SLB的客户，以下场景中适合使用基于UDP协议的负载均衡SLB。（正确答案的数量：4个）',opts:['某视频点播网站，用户观通过点播观看视频','某新媒体公司，通过手机APP端提供资讯服务，在客户刷新的时候推送新闻到客户端','某在线交友网站的视频聊天室','某公司提供的域名解析服务','某在线语音图片等智能识别网站，要求将用户需求中的音频请求发送至音频服务器处理，需求中的对图片的请求发送至图片服务器处理','某邮件服务商提供的发送或接收邮件功能'],exp:'域名解析服务和邮件服务并不是走UDP协议。'},
  {id:1255,type:'multi',answer:'AC',stem:'C公司基于阿里云的产品构建了一个共享软件下载的WEB网站，所有下载内容保存在阿里云对象存储OSS中，用户可以直接访问OSS为每个对象提供的链接完成下载。最近一年的业务增长很快，下载量同比增加了300%，每月下载流量超过500Tb。公司的运营团队想通过架构升级来降低网站的云资源使用成本（至少降低20%），同时提升用户的下载速度。该网站通过可以达到预期目标。（正确答案的数量：2个）',opts:['使用内容分发网络(CDN)提升用户下载速度，并降低网络流量成本','新增多台云服务器ECS实例','通过购买对象存储服务OSS的流量包节省成本','使用加密DNS服务（HTTPDNS）'],exp:'题目中说了，公司团队需要降低网站的云资源使用成本，同时提升用户的下载速度。所以需要购买对象存储服务OSS的流量包节省流量使用成本，使用内容分发网络(CDN)提升用户下载速度，同时降低网络流量成本。'},
  {id:1256,type:'multi',answer:'ACD',stem:'阿里云的云盾数据风控产品是通过领先的行为收集技术和机器学习模型，解决账号、活动、支付等关键业务环节存在的欺诈威胁，降低企业经济损失。数据风控产品具体可以防范安全威胁。（正确答案的数量：3个）',opts:['垃圾注册','CC攻击','营销作弊','盗卡支付'],exp:'CC注册是Web应用防火墙的功能，数据风控的防护点列表参考：https://help.aliyun.com/document_detail/28311.html'},
  {id:1257,type:'multi',answer:'AC',stem:'如何避免SLB服务本身故障导致的单点问题？（正确答案的数量：2个）',opts:['在不同地域（Region）创建多个SLB实例， 通过DNS轮询的方式对外提供服务，从而提高跨地域的可用性','SLB实例后端的ECS可以是不同Zone下的机器， 从而提高本地可用性','在同一地域 （Region）创建多个SLB实例，通过DNS轮询的方式对外提供服务，从而提高本地可用性','无法避免'],exp:'题目说了是避免SLB服务本身故障，SLB就算挂多个可用区的ECS，但负载均衡SLB实例挂了就会导致整个服务挂了，所以需要用到多个SLB实例。'},
  {id:1258,type:'multi',answer:'AD',stem:'阿里云专有网络VPC支持多种的网络连接方式，打通您的VPC与传统数据中心。目前阿里云支持的网络连接方式包括（正确答案的数量：2个）',opts:['VPN','HTTP代理','跳板机中转','专线连接'],exp:'打通您的VPC与传统数据中心，所以需要基于公网的VPN或者专线。'},
  {id:1259,type:'multi',answer:'AB',stem:'阿里云的云盾的先知计划产品是调动众多网络安全专家的力量一起维护互联网平台和业务的安全，降低客户的安全损失。先知计划是由为企业提供众测服务。（正确答案的数量：2个）',opts:['通过实名认证的白帽子','多家经阿里云授权的安全公司','阿里自己的渗透测试团队','具有一定安全知识的网民'],exp:'先知计划是由独立于阿里云的安全服务的提供者“白帽子”或“安全公司”为企业提供众测服务。参考漏洞收集操作步骤部分：https://help.aliyun.com/document_detail/28382.html'},
  {id:1260,type:'multi',answer:'BCE',stem:'某创业团队开发了一款手机游戏，第一个版只使用阿里云的1台最高配置的云服务器ECS实例和云数据库RDS实例。上线3周后做了一次推广，用户量以每天300人的速度在增长，该ECS实例的负载越来越高，已无法正常响应用户请求。并且在上周连续受到了两次6Gb的DDoS攻击，服务累计中断了3小时，使这个小团队感觉到网络安全和高可用是当下最需要解决的两个问题。这种情况下，通过增加阿里云的产品可以解决这些问题。（正确答案的数量：3个)',opts:['对像存储OSS','负截均衡SLB','DDoS高防IP','DDoS基础防护','云服务器ECS实例'],exp:'题目中主要遇到两个问题：第一是ECS实例的负载越来越高，所以需要增加云服务器ECS实例，然后配置到负截均衡SLB后端来实现负载，实现均衡负载来减轻当前ECS实例的压力。第二是受到了两次6Gb的DDoS攻击，攻击的流量大于5G，所以需要采用DDoS高防IP来提供DDoS防护能力。'},
  {id:1261,type:'multi',answer:'AD',stem:'阿里云弹性伸缩（AutoScaling）的移出策略（RemovalPolicy）是指当需要从伸缩组移出云服务器ECS实例并且有多种选择时，则按该策略选择需要移出的云服务器ECS实例。假设您需要添加N台包年包月ECS实例加入伸缩组，并且希望这些ECS实例不会自动被移出，那么您需要做以下哪两个配置？（（正确答案的数量：2个）',opts:['将最小实例数（MinSize）设置为N或者大于N','将移出策略的第一条挑选规则设置为“最早伸缩配置对应的实例”','将最大实例数（MaxSize）设置为N或者大于N','将移出策略的第一条挑选规则设置为“最新创建的实例”'],exp:'正确选项为A和D。\\nA选项正确，将最小实例数（MinSize）设为≥N时，伸缩组缩容不会减少到低于N，确保包年包月实例保留。D选项正确，移出策略第一条设为“最新创建的实例”，优先移出新创建的按量付费实例，保护较早添加的包年包月实例。B选项若设为“最早伸缩配置对应的实例”可能导致包年包月实例被优先移出，故错误。C选项中最大实例数与防止移出无关'},
  {id:1262,type:'multi',answer:'ACD',stem:'您在通过OpenAPI制作阿里云的云服务器ECS实例的自定义镜像的时候失败了，有可能是原因引起的。（正确答案的数量：3个）',opts:['选择数据盘快照制作','选择系统盘快照制作','没有设置自定义镜像的名称','没有设置自定义镜像的描述'],exp:'阿里云ECS实例创建自定义镜像时，若选择数据盘快照而非系统盘快照（A），API会因缺少系统盘快照参数而报错。根据Open API规范，`ImageName`为必填项，未提供名称（D）直接导致请求无效。规范未强制要求`Description`字段（B），但若题目限定调用场景或接口版本强制校验描述信息，则缺少描述可能触发参数校验失败。官方明确指出自定义镜像依赖系统盘快照，数据盘快照无法单独生成镜像。正确选项中，A涉及镜像生成逻辑错误，D违反必填参数规则，B可能关联特定校验条件。错误选项C符合正常操作流程。'},
  {id:1263,type:'multi',answer:'ABCD',stem:'阿里云内容分发网络CDN建立并覆盖在承载网之上，由分布在不同区域的边缘节点服务器群组成的分布式网络替代传统以WEBSerVer为中心的数据传输模式。如果用户在使用CDN的过程中发现CDN缓存的”命中率“比较低，可能的原因是（正确答案的数量：4个）',opts:['网站访问量较低，文件热度不够，CDN收到请求较少无法有效命中缓存','缓存配置不合理，针对某些文件设置较短，导致CDN节点频繁回源','HTTP Header设置导致无法缓存，需要用户检查源站的 Cache-Control 设置或者 Expires 的设置','源站动态资源较多，多为不可缓存的内容，也会导致频繁回源拉取','开通CDN时选择的带宽不足，服务能力已达到上限'],exp:'排除法，CDN是按照按每日带宽峰值计费，所以不存在带宽不足，服务能力达上限的问题'},
  {id:1264,type:'multi',answer:'ABDF',stem:'弹性伸缩不仅提供了在业务需求高峰或低谷时自动调节ECS实例数量的能力，而且提供了在ECS实例上自动部署应用的能力。弹性伸缩的伸缩配置支持多种特性，例如，帮助您高效、灵活地自定义ECS实例配置，满足业务需求。（正确答案个数：4个）',opts:['标签','SSH密钥对','事件通知','实例RAM角色','生命周期挂钩','实例自定义数据'],exp:'弹性伸缩的伸缩配置允许用户定义ECS实例的启动模板。阿里云文档指出，伸缩配置支持为实例添加标签（A），便于资源分类和管理；配置SSH密钥对（B）增强实例访问安全性；指定实例RAM角色（D），赋予实例访问其他云服务的权限；通过实例自定义数据（F），可在实例启动时执行自定义脚本。C选项的事件通知属于弹性伸缩通知功能，E选项的生命周期挂钩用于控制伸缩活动流程，两者均不直接属于伸缩配置支持的ECS实例配置特性。'},
  {id:1265,type:'multi',answer:'BC',stem:'A公司基于阿里云服务构建了一套销售管理平台，采用三台云服务器ECS实例进行构建，其中一台ECS实例安装了MySQL，作为平台的数据库服务器，另外两台当作WEB服务器。经过一段时间的发展，员工人数激增，销售统计需求增多，平台响应速度逐渐受到挑战，通过云监控发现两台ECS实例的CPU占用率平均超过70%，数据库的负载接近75%。遇到这种情况可以选择阿里云的服务来优化性能。（正确答案数量：2个）',opts:['使用内容分发网络CDN，将平台的css，javascript文件做加速缓存','通过增加负载均衡SLB，并新增ECS实例的方式缓解现有ECS实例的负载','使用云数据库RDS代替自建MySQL，获得更好的数据库性能；并创建RDS只读实例分流数据库读请求，降低RDS实例主库的压力','将数据导入到对象存储OSS，分担平台的存储压力'],exp:'题目中说到遇到了以下两个问题：两台ECS实例的CPU占用率平均超过70%，数据库的负载接近75%，所以需要通云数据库RDS产品来解决数据库性能问题；需要通过新增ECS实例并将其加入负载均衡SLB来解决ECS实例性能问题。'},
  {id:1266,type:'multi',answer:'BC',stem:'阿里云的云盾的服务可以进行DDoS攻击防护。(正确答案的数量：2个)',opts:['态势感知','DDoS基础防护','DDoS高防IP','内容安全（原名：绿网）'],exp:'可以进行DDoS攻击防护，很明显是DDoS基础防护，DDoS高防IP。'},
  {id:1267,type:'multi',answer:'AB',stem:'阿里云的负载均衡SLB是对多台云服务器ECS实例进行流量分发的服务，支持四层和七层的转发协议。其中四层服务主要是依据把流量分发给对应的云服务器ECS实例。（正确答案的数量：2个）',opts:['报文中的目标IP地址和端口','负载均衡SLB中设定的转发策略和规则','报文中真正有意义的应用层内容','报文中的源IP地址和端口'],exp:'注意题目考的是四层，四层是通过SLB中设定的转发策略和规则和报文中的目标IP地址和端口分发流量，七层是通过报文中真正有意义的应用层内容和负载均衡SLB中设定的转发策略和规则分发流量。参照：https://yq.aliyun.com/articles/554057'},
  {id:1268,type:'multi',answer:'ACD',stem:'阿里云对象存储OSS自动为每个Bucket分配一个“外网地址”和“内网地址”。正确使用OSS的内网地址，可以节省OSS与云服务器ECS实例之间的流量费用，云服务器ECS实例通过内网访问OSS能够有效的提升上传和下载的质量。场景可以使用OSS的“内网地址”通信。（正确答案的数量：3个）',opts:['OSS Bucket在R1地域,用户有两台云服务器ECS实例分别在该地域的可用区A和可用区B,两台ECS实例上的访问日志都要保存到OSS中','OSS Bucket在R2地域,用户在R1地域的可用区A有1台云服务器ECS实例,此台ECS实例上的访问日志要保存到OSS中','OSS Bucket在R1地域,在该地域的可用区B用户有1台云服务器ECS实例,此台ECS实例上的访问日志要保存到OSS中','OSS Bucket在R1地域,用户有1台云服务器ECS实例在R1地域的可用区A,此台ECS实例上的访问日志要保存到OSS中'],exp:'题目中问的是云服务器ECS实例通过内网访问OSS，所以要求云服务器ECS和OSS需要处于同一个地域，"OSS Bucket在R2地域,用户在R1地域的可用区A有1台云服务器ECS实例"明显不符合要求。'},
  {id:1269,type:'multi',answer:'BD',stem:'云计算服务面临的安全威胁主要来自：可用性、完整性和保密性三个方面，威胁直接影响云计算服务的可用性。（正确答案的数量：2个） 选项：',opts:['服务器口令暴力破解','大规模分布式拒绝服务攻击（DDoS）','网站后门植入','CC攻击（ChallengeCollapsar）'],exp:'题目问的是直接影响到云计算服务的可用性方面的威胁，所以需要选择DDoS攻击和CC攻击。DDoS攻击和CC攻击会直接影响到服务，导致服务不能正常访问。'},
  {id:1270,type:'multi',answer:'AD',stem:'云防火墙是阿里云云盾团队结合云的部署便捷、弹性扩展等技术优势，为云上客户量身定制的融合访问控制、业务隔离、流量识别等功能的网络安全产品，关于云防火墙的构成，以下说法正确的是（正确答案个数：2个）',opts:['南北向流量控制模块：主要用于实现互联网到主机间的访问控制，支持4-7层访问控制','南北向流量控制模块：主要用于实现互联网到主机间的访问控制，实现4层访问控制','东西向流量控制模块：主要是利用安全组对主机之间的交互流量进行控制，支持4-7层访问控制','东西向流量控制模块：主要是利用安全组对主机之间的交互流量进行控制，实现4层访问控制'],exp:'南北向流量控制模块：主要用于实现互联网到主机间的访问控制，支持4-7层访问控制。 东西向流量控制模块：主要是利用安全组对主机之间的交互流量进行控制，实现4层访问控制'},
  {id:1271,type:'multi',answer:'ABC',stem:'您可以使用阿里云的云服务器ECS实例的内网IP进行通信来提升通信效率的同时还节省流量费用，以下哪些云产品之间的通信可以通过内网IP并不需要其他产品的辅助',opts:['相同地域的不同的云服务器ECS实例之间','相同地域的云服务器ECS实例与对象存储OSS之间','相同地域的云服务器ECS实例与云服务器RDS实例之间','不同地域的不同的云服务器ECS实例之间'],exp:'不同地域之前的ECS不支持通过内网地址互相访问。'},
  {id:1272,type:'multi',answer:'ACD',stem:'云服务器ElasticCompute Service（ECS）是阿里云提供的一种基础云计算服务。云服务器ECS与传统IDC比较优点有哪些？（正确答案的数量：3个）',opts:['用户自定义快照','以单线和双线为主','快速自动故障恢复','内置主流的操作系统'],exp:'云服务器是BGP多线机房，全国访问流畅均衡，传统IDC是以单线和双线为主。参考地址：https://bbs.aliyun.com/simple/t538527.html'},
  {id:1273,type:'multi',answer:'ABCD',stem:'下列属于阿里云的云',opts:['宽带升降更敏捷','无需自建，云服务器启动就自动具备防护DDoS攻击的能力','无需额外开发，云服务器支持宕机迁移，可用性更高','云服务器的交付周期短','云服务器可以运行传统物理服务器不可以运行的应用'],exp:'题目中问的是阿里云云服务器ECS和传统的物理服务器的优势，其中云服务器的系统和传统服务器的系统内核都是一致的，所以不会存在云服务器可以运行传统物理服务器不可以运行的应用。'},
  {id:1274,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。在OSS中文件都隶属于某一个存储空间Bucket，并且能以Bucket为单位设置相关的属性，以决定整个Bucket里的文件对外展现的形式和特定的功能。以下可以通过Bucket属性设置的。（正确答案的数量：3个）',opts:['读写权限（ACL）设置','防盗链设置','自定义域名绑定','设置OSS文件被访问时的HTTP头（Header）'],exp:'目前在OSS的控制台的属性设置里面，是没有设置OSS文件被访问时的HTTP头（Header）这个操作，具体的可以实践操作了解。'},
  {id:1275,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。除了基本的存储功能外，OSS还提供了强大的图片处理能力，可根据实际业务需要对图片进行加工和转换。OSS的图片处理能力包括（正确答案的数量：3个） 选项：',opts:['图片缩放、添加水印','图片格式转换（例如：由jpg转换成png）','图片360度范围内旋转','OCR文字识别（将图片中的文字直接转成文本）'],exp:'OSS目前不具备OCR文字识别的处理能力。'},
  {id:1276,type:'multi',answer:'BC',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，具有高可用、低成本、安全可靠等优点。关于低成本以下说法中正确的有（正确答案的数量：2个）',opts:['无论公网还是私网类型实例都支持按流量和带宽计费','无需一次性采购昂贵的负载均衡设备','运维投入大大减少','只收取流量费用，即根据实际使用流量付费，无需为负载均衡支付租费'],exp:'题目中问的是负载均衡SLB低成本的描述正确的是，"无论公网还是私网类型实例都支持按流量和带宽计费"，显然是不正确的，私网是收取实例费的而不是按照流量和带宽收费。"只收取流量费用，即根据实际使用流量付费，无需为负载均衡支付租费"是不正确的，SLB不仅收取实际使用公网流量费用，还收取实例费用。'},
  {id:1277,type:'multi',answer:'BCD',stem:'在整个互联网的安全链条中，有些环节是和最终用户（网民）直接相关的，而且很难从服务器端完全避免。以下不安全行为中是和最终用户（网民）相关的。（正确答案的数量：3个)',opts:['通过Email发送钓鱼网站链接','免费软件中携带盗号木马','通过Email图文发送系统登录账号和密码','发现应用系统的安全漏洞，很长时间不修复'],exp:'题目问的是和最终用户相关不安全行为，排除法，通过Email发送钓鱼网站链接是黑客的行为，是和最终用户没有关联的。'},
  {id:1278,type:'multi',answer:'BD',stem:'阿里云的云服务器ECS产品支持的SSD云盘，可以用于I/O密集型应用、中大型关系型数据库及NoSQL数据库中。以下哪些是SSD云盘独有的优势？（正确答案的数量：2个）',opts:['采用分布式三副本机制，提供 99.9999999% 的数据可靠性','SSD云盘的随机和顺序读写的IOPS都比普通云盘高','单块云盘最大提供 32768 GB 存储空间','访问时延可以达到 0.5−2 ms'],exp:'题目中问的是：SSD云盘独有的优势。所以需要普通云盘没有的优势。其中三副本机制的高可靠性以及最大提供 32768 GB 存储空间普通云盘也有这个特性。SSD云盘的顺序读写的IOPS都比普通云盘要高，以及访问延时很低，这个是它独有的优势。'},
  {id:1279,type:'multi',answer:'BD',stem:'某电商公司的平台建在阿里云上，为了参加一个月以后的双11促销，50人的团队进行了精心的准备，公司上下都希望双11当天平台能稳定运行，产品可以大卖。公司CTO非常担心网络攻击和服务器存在系统级漏洞,上个月已经历了3次DDoS攻击，攻击带宽每次都在20G以上。这种情况下阿里云的产品可以帮到该公司。（正确答案的数量：2个）',opts:['安全管家','安骑士','绿网','DDoS高防IP'],exp:'划重点：担心网络攻击和服务器存在系统级漏洞，经历了3次DDoS攻击。安骑士企业版可以检测并修复漏洞，DDoS高防IP可以防止DDoS攻击。'},
  {id:1280,type:'multi',answer:'ABE',stem:'阿里云负载均衡服务SLB提供性能保障型实例，该类型实例提供了可保障的性能指标，那么它的关键指标有（正确答案的数量：3个）',opts:['最大连接数-Max Connection','每秒新建连接数-Connection Per Second (CPS)','连接响应超时时间Connection Response timeout retry times','连接响应超时重试次数 Connection Response timeout retry times','每秒查询数-Query Per Second (QPS)'],exp:'考察的是：性能保障型实例的三个关键指标，性能保障型实例的三个关键指标如下： 1.最大连接数-Max Connection 2.每秒新建连接数-Connection Per Second (CPS) 3.每秒查询数-Query Per Second (QPS) 参考链接：https://help.aliyun.com/document_detail/85939.html'},
  {id:1281,type:'multi',answer:'ADE',stem:'客户需要使用CDN加速指定网站上的业务，则需要将该网站作为源站，为其创建加速域名。CDN通过加速域名将源站上的资源缓存到CDN的加速节点，实现资源访问加速。在添加域名页面，源站信息我们可以选择（正确答案个数：3个）',opts:['源站域名','DNS域名','ECS域名','函数计算域名','oSS域名'],exp:'https://help.aliyun.com/document_detail/119807.html?spm=5176.11065259.1996646101.searchclickresult.76924ff2L52F0Y'},
  {id:1282,type:'multi',answer:'BD',stem:'权重越高的ECS实例将被分配到更多的访问请求。您可以根据后端ECS实例的对外服务能力和情况来区别设定。SLB权重设置为0会发生什么情况？（正确答案的数量：2个)',opts:['服务器优先级最高','服务器优先级最低','能正常提供服务','不能正常提供服务'],exp:'将负载均衡后端ECS的权重置零，相当于将该ECS手工下线，用于对相应ECS进行重启、配置调整等主动运维。而由于该状态下，业务数据是无法经负载均衡转发到该服务器的，所以健康检查相应的自然会显示异常。'},
  {id:1283,type:'multi',answer:'AB',stem:'通过修改域名的DNS解析设置，将网站流量解析到Web应用防火墙，Web应用防火墙将处理后的博求转发回源站服务器，该方式需要在Web应用防火墙控制台添加域名井修改域名的DNS解析设置，支持和两种方式。（正确答案个数：2个）',opts:['域名手动接入','域名一键接入','手动添加网站','自动添加网站'],exp:'题目涉及Web应用防火墙（WAF）的域名接入方式。根据题目要求，需选择两种支持方式： 1. **域名手动接入（A）**：需用户在WAF控制台手动配置域名信息，并自行修改DNS解析记录指向WAF的IP地址。 2. **域名一键接入（B）**：通过系统自动生成CNAME记录，用户只需在DNS服务商处添加该记录即可完成解析配置。 选项C和D描述的是网站添加方式，与题目中强调的“域名解析设置”无关，故排除'},
  {id:1284,type:'multi',answer:'AC',stem:'阿里云对象存储OSS提供了静态网站托管的功能，A公司的架构师小明一年前基于此功能为公司建设了一个企业门户网站。出于业务发展的需要，现在网站需要支持动态功能，包括产品信息的动态增加和展示，数据总量预估在2G左右。公司目前没有数据库开发和管理的人员，小明至少需要选择阿里云的产品配合OSS一起实现这个方案。（正确答案的数量：2个）',opts:['云服务器ECS','分布式关系型数据库服务（Distributed Relational Database Service，简称DRDS）','云数据库RDS','云盾DDoS高防IP'],exp:'划重点：公司需要实现网站的动态功能，包括产品信息的动态增加和展示。所以需要云服务器ECS来实现网站的动态部署，需要云数据库RDS来保存产品的信息。'},
  {id:1285,type:'multi',answer:'ABD',stem:'您创建了一台操作系统为Windows的阿里云的云服务器ECS实例，您本地的机器采用的是Windows系统，可以采用方式进行登录该ECS实例。（正确答案的数量：3个）',opts:['ECS实例有公网带宽的情况下，可以通过远程桌面连接 (Microsoft Terminal Services Client, MSTSC)登录ECS实例','无论您在创建ECS实例时是否购买了带宽，都可以通过阿里云的管理控制台的管理终端登录ECS实例','只有ECS实例有公网带宽的情况下，才可以通过阿里云的管理控制台的管理终端登录实例','ECS实例有公网带宽的情况下，可以通过手机上的远程桌面 APP （例如 微软远程桌面MSTSC APP）登录ECS实例'],exp:'阿里云的管理控制台在Windows的实例没有公网的时候，也是可以连接的。'},
  {id:1286,type:'multi',answer:'AD',stem:'DDoS攻击是近年来对企业业务危害最大的攻击手段之一。OSS高防是对象存储OSS结合DDoS高防推出的DDoS攻击代理防护服务，可以有效保护OSS中的存储空间免受DDoS流量攻击，下列关于OSS高防说法正确的是',opts:['OSS高防只在攻击频率超出DDoS原生防护的防御阈值时才生效','每个地域可以创建一个高防OSS实例，每个实例可以绑定不限数量的Bucket','在Bucket绑定高防实例后，可以正常通过浏览器预览Bucket内的资源','OSS高防默认不对Bucket关联的自定义域名进行防护'],exp:'每个地域可以创建一个高防OSS实例，每个实例最多只能绑定同一地域下的10个Bucket。在Bucket绑定高防实例后，您无法通过浏览器预览Bucket内的资源。 https://help.aliyun.com/document_detail/198761.html(https://help.aliyun.com/document_detail/198761.html?spm=a2c4g.750001.0.0)'},
  {id:1287,type:'multi',answer:'BCD',stem:'1阿里云的云服务器ECS实例的磁盘快照是对某一个时刻的磁盘数据的备份，基于快照进行磁盘回滚操作时会把磁盘上的数据恢复到快照制作时的数据，在执行回滚快照操作时，以下哪些说法是正确的？',opts:['磁盘在未创建快照的情况下也允许通过其他磁盘的快照进行回滚或数据恢复','回滚快照操作时必需在云服务器ECS实例的状态为“停止”时才能进行','回滚快照操作只能针对打过快照的磁盘进行','回滚快照会把磁盘上的数据回滚到快照制作时的数据，快照制作时间点到当前时间之间该磁盘上的数据变化将会丢失'],exp:'磁盘在未创建快照的情况下是不允许通过其他磁盘的快照进行回滚或数据恢复'},
  {id:1288,type:'multi',answer:'BD',stem:'1路由表是阿里云专有网络VPC路由器上管理路由条目的列表，路由条目定义了通向指定目标网段的网络流量的下一跳地址。路由表支持通过以下哪些方式进行配置？',opts:['进入机房直接对路由器进行控制','专有网络VPC的管理控制台','远程登录到路由器进行控制','阿里云VPC的OpenAPI'],exp:'您可以通过专有网络VPC的管理控制台以及专有网络VPC的相关路由表接口来管理配置路由表.参考链接：https://help.aliyun.com/document_detail/87057.html'},
  {id:1289,type:'multi',answer:'BC',stem:'1阿里云上的很多云产品都有区分地域与可用区，每个地域完全独立。每个可用区完全隔离，但同一个地域内的可用区之间使用低时延链路相连。在使用ECS时，以下哪些说法是正确的？',opts:['一个实例能挂载同一个Region中不同Zone的磁盘','安全组可以跨可用区','快照和镜像在一个Region中可见，可以跨可用区使用','实例可以跨地域进行迁移'],exp:'本题多选正确答案为BC。B（安全组可以跨可用区）、C（快照和镜像在一个Regi）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1290,type:'multi',answer:'AB',stem:'1阿里云的负载均衡SLB是对多台云服务器ECS实例进行流量分发的服务，支持四层和七层的转发协议。其中四层服务主要是依据以下哪些选项把流量分发到对应的云服务器ECS实例上去的？',opts:['报文中的目标IP地址和端口','负载均衡SLB中设定的转发策略和规则','报文中真正有意义的应用层内容','报文中的源IP地址和端口'],exp:'注意题目考的是四层，四层是通过SLB中设定的转发策略和规则和报文中的目标IP地址和端口分发流量，七层是通过报文中真正有意义的应用层内容和负载均衡SLB中设定的转发策略和规则分发流量。参考链接：https://yq.aliyun.com/articles/554057'},
  {id:1291,type:'multi',answer:'AB',stem:'您已经基于阿里云的云服务器ECS实例构建好了一个web网站并向外提供服务，最近发现随着访问量的上涨，客户访问速度有的时候会慢，尤其是页面中的图片和视频，而且在不同的地域的访问速度也不一致，开始影响用户体验了。以下哪些操作可以解决该问题。',opts:['将网站的图片和视频等静态内容存放到对象存储OSS中解决访问速度慢的问题','开通CDN服务来解决不同地域的用户访问速度不同的问题','将网站的图片和视频等静态内容存放到RDS中解决访问速度慢的问题','将网页中的动态内容存放到OSS中解决访问速度慢的问题'],exp:'题目中主要是遇到以下两个问题：第一是随着业务量上当客户访问速度慢，所以可以通过将网站的图片和视频等静态内容存放到对象存储OSS中解决访问速度慢的问题。第二是不同的地域的访问速度也不一致，所以可以通过CDN服务来解决不同地域的用户访问速度不同的问题。'},
  {id:1292,type:'multi',answer:'BD',stem:'1阿里云OSS原生处理服务包括图片处理和视频截帧，其中图片处理包括图片的缩略、裁剪、参数调节等。以下关于图片处理限制说法中，哪些是正确的？',opts:['不支持gif图片格式','调用resize默认不允许放大','对缩略后图片大小无限制','支持bmp、webp图片格式'],exp:'原图限制: 图片格式只能是：JPG、PNG、BMP、GIF、WebP、TIFF。其中GIF格式的图片支持指定宽高缩放，不支持等比缩放（等比缩放情况下，动态图会变成静态图）。 原图大小不能超过20MB。 宽或高不能超过30,000px，且总像素不能超过2.5亿px。 动态图片（例如GIF图片）的像素计算方式为宽∗高∗图片帧数；非动态图片（例如PNG图片）的像素计算方式为宽∗高。参考链接：https://help.aliyun.com/document_detail/44688.html'},
  {id:1293,type:'multi',answer:'AB',stem:'成功创建或成功导入自定义镜像后，镜像的状态为可用。如果某用户需要华北2的镜像在华东3可用。并且还需要给其他账号使用，需要进行哪些操作？',opts:['复制镜像','共享镜像','重做镜像','自定义镜像'],exp:'首先要从华北2复制到华北3，然后共享给其他用户，或者反过来'},
  {id:1294,type:'multi',answer:'AB',stem:'「某大型企业在上海、杭州、宁波各拥有一个办公点，在阿里云华东1（杭州）地域拥有一个VPC1，VPC1中使用云服务器ECS部署了相关业务，当前各个办公点之间，各个办公点与VPC1之间互不相通。因业务发展，现在企业需要使用VPN网关产品，通过VPN网关的Hub功能快速实现上海办公点、杭州办公点、宁波办公点和VPC1之间相互通信。为实现这一场景需求，下列说法正确的是',opts:['需要创建一个VPN网关，并创建三个IPsec连接实现','需要获取各个办公点本地网关设备的公网IP地址','创建VPN网关时，可选择VPN网关实例所属的地域为上海','IPsec连接的路由模式必须选择目的路由模式'],exp:'VPN 网关 Hub 模式支持多个本地网关与同一 VPC 建立连接，需为每个办公点创建独立的 IPsec 连接，因此需要创建三个 IPsec 连接。每个 IPsec 连接必须基于本地网关设备的公网 IP 地址进行配置，否则无法建立加密隧道。IPsec 路由模式可选策略路由或目的路由，非强制要求目的路由。VPN 网关实例地域必须与目标 VPC 所在地域一致，VPC1 在杭州，故网关只能创建于杭州，不可选上海。'},
  {id:1295,type:'multi',answer:'AC',stem:'FTP服务器是在互联网上提供文件存储和访问服务的计算机，在阿里云上，想要部署FTP服务器并可以进行公网访问。需要以下哪些产品？',opts:['EIP','SLB','ECS','RDS'],exp:'本题多选正确答案为AC。A（EIP）、C（ECS）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1296,type:'multi',answer:'ACD',stem:'数字证书管理服务是由阿里云联合全球多家数字证书颁发机构，在阿里云平台上直接提供数字证书申请、管理、部署等的服务。支持购买和三种类型的证书，可根据对安全性的要求和网站类型进行选择匹配。',opts:['DV域名型','SV标准型','OV企业型','EV企业增强型','SV单域名','WV通配型'],exp:'阿里云 数字证书管理服务支持购买DV证书、OV证书和EV证书三种类型的SSL证书。不同类型证书的安全性、支持的证书品牌和适用的网站类型不同。参考链接：https://help.aliyun.com/document_detail/197871.html'},
  {id:1297,type:'multi',answer:'AB',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，支持4层和7层流量的转发，若4层（TCP/UDP）健康检查出现异常，可能是以下哪几种原因导致的？',opts:['ECS的安全组规则入方向配置错误','后端服务器负载过高','SLB的安全组规则出方向配置错误','SLB与后端ECS的网络类型不一致，SLB为经典网络，ECS为专有网络'],exp:'可通过如下两类问题进行检查。①安全类防护软件问题,确认后端服务器上没有对SLB内网地址段100.64.0.0/10进行过任何形式的屏蔽②后端服务器负载过高。参考链接：https://help.aliyun.com/document_detail/98222.html'},
  {id:1298,type:'multi',answer:'AD',stem:'「1',opts:['云盘和本地盘的性能均与其容量大小有关','云盘和本地盘均采用多副本的机制保证数据可靠性','云盘和本地盘均支持快照','云盘和本地盘均支持SSD'],exp:'本地盘不支持创建快照，也不保障数据安全。参考链接：https://help.aliyun.com/document_detail/63138.html'},
  {id:1299,type:'multi',answer:'AC',stem:'1某企业在阿里云云服务ECS上部署了核心业务系统，并选用云数据库RDSMYSQL作为数据库。同时为了解决数据库可用性和吞吐量的问题，选择了高可用实例版和只读实例。现监管要求数据库需要具备异地灾备能力，于是该企业管理员创建了异地灾备实例，关于异地灾备实例下列说法正确的是',opts:['RDS通过数据传输服务(DTS)实现主实例和异地灾备实例之间的实时同步','灾备实例切换后将变成一个常规主实例，后续可切换回灾备类型','异地灾备实例切换为主实例后，需要在应用端修改数据库连接地址，恢复业务系统','在主实例中进行删库操作，该操作会同步至灾备实例'],exp:'RDS通过数据传输服务（DTS）实现主实例和异地灾备实例之间的实时同步。 主实例和灾备实例均搭建主备高可用架构，当主实例所在区域发生突发性自然灾害等状况， 主实例（Master）和备实例（Slave）均无法连接时，可将异地灾备实例切换为主实例，在应用端修改数据库连接地址后，即可快速恢复应用的业务访问。https://www.alibabacloud.com/help/zh/'},
  {id:1300,type:'multi',answer:'ABD',stem:'「1SLB中的四层负载均衡采用开源软件LVS，并根据云计算的需求对其内核进行了定制化，下列哪些属于阿里云进行的定制操作？',opts:['采用LVS集群部署方式','DDoS攻击防御功能','采用Tengine实现负载均衡','优化Keepalived性能'],exp:'这个是文档原话:优化了以下问题: 解决1:新增转发模式FULLNAT，实现LVS-RealServer间跨vlan通讯； 解决2:新增synproxy等攻击TCP标志为DDOS攻击防御功能； 解决3:采用LVS集群部署方式； 解决4:优化keepalived性能； 但是此处需注意的是采用LVS集群部署方式不是阿里进行定制化的，而是LVS自带此功能'},
  {id:1301,type:'multi',answer:'ACE',stem:'阿里云内容分发网络CDN是建立并覆盖在承载网之上，由遍布全球的边缘节点服务器群组成的分布式网络。由和支撑系统这四大系统组成。',opts:['缓存系统','回源拉取系统','调度系统','管控系统','链路质量系统','监测系统'],exp:'以下为阿里云CDN的产品架构图，由调度系统、链路质量系统、缓存系统和支撑系统这四大系统组成。https://help.aliyun.com/document_detail/27101.html'},
  {id:1302,type:'multi',answer:'BC',stem:'阿里云对象存储OSS，是阿里云提供的海量、安全、低成本、高可靠的云存储服务，拥有丰富、强大的增值服务，如图片处理等，但是不支持对以下哪几种格式的图片进行处理？',opts:['原图片格式为PNG','原图大小40M','需要使用图片旋转的原图宽4096px，高5000px','原图单边大小为28999px'],exp:'使用图片处理服务时有如下限制：原图限制图片格式只支持JPG、PNG、BMP、GIF、WebP、TIFF。原图大小不能超过20MB。除图片旋转对应的原图高或者宽不能超过4,096x外，其他图片操作对应的原图高或者宽不能超过30,000px,且总像素不能超过2.5亿x。动态图片（例如GF图片）的像素计算方式为宽∗高∗图片帧数；非动态图片（例如PNG图片）的像素计算方式为宽∗高。动态图片限制仅支持对动态图片（例如GF格式图片)进行缩放、裁剪、旋转以及添加图片水印的操作。缩放后图片限制宽或高不能超过16,384px,且总像素不能超过16,777,216x。样式限制每个存储空间下最多能创建50个样式。如您的业务有更多样式的需求，请联系技术支持。'},
  {id:1303,type:'multi',answer:'ABEF',stem:'「1镜像文件相当于副本文件，该副本文件包含了一块或多块云盘中的所有数据，对于ECS实例而言，这些云盘可以是单块系统盘，也可以是系统盘和数据盘的组合。ECS镜像提供了创建ECS实例所需的信息，在很多场景中都发挥着重要的作用。以下关于镜像使用场景的描述，哪些是正确的？',opts:['某公司运维人员需要批量部署ECS','某阿里云用户新购ECS','某公司需要对自身系统日常的业务数据做定期备份','某公司需要将数据库平滑迁移到阿里云上','某公司将自己的商业软件上架到云市场出售','某电商公司使用AutoScalign做自动弹性伸缩，应对流量峰值'],exp:'本题多选正确答案为ABEF。A（某公司运维人员需要批量部）、B（某阿里云用户新购ECS）、E（某公司将自己的商业软件上）、F（某电商公司使用AutoS）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1304,type:'multi',answer:'BC',stem:'某企业的业务系统使用了阿里云云数据库RDSMySQL存放结构化数据，由于该业务的特殊性，业务系统对数据库写请求较少，但是有大量的读请求，导致RDS实例读取压力过大。此时可以创建一个或多个只读实例，利用只读实例来满足大量的数据库读取需求，增加应用的吞吐量。下列关于MySQL只读实例说法正确的是',opts:['只读实例和主备实例可以在不同地域','创建只读实例时是从备实例复制数据','只能在主实例内创建只读实例，不能将已有实例切换为只读实例','主实例的数据更新后需要手动触发同步到只读实例'],exp:'只读实例和主备实例在同一地域，可以在不同可用区。创建只读实例时会从备实例复制数据，数据与主实例一致，主实例的数据更新也会在主实例完成操作后立即自动同步到所有只读实例。https://help.aliyun.com/document_detail/26136.html'},
  {id:1305,type:'multi',answer:'AC',stem:'安全组是一种虚拟防火墙，用于控制安全组内ECS实例的入流量和出流量，从而提高ECS实例的安全性。用户在将实例加入安全组时，以下说法正确的是',opts:['实例至少加入一个安全组','实例支持同时加入普通安全组和企业安全组','实例上挂载的弹性网卡中，辅助网卡可以加入和实例不同的安全组','实例不可以同时加入多个安全组'],exp:'在ECS实例关联多个安全组时，多个安全组只能是普通安全组或企业级安全组两种类型中的一种。https://help.aliyun.com/document_detail/605897.html'},
  {id:1306,type:'multi',answer:'ABC',stem:'「1阿里云负载均衡SLB是对多台云服务器ECS实例进行流量分发的服务。配置和管理一个负载均衡SLB实例，主要涉及以下哪些操作？ 选项：',opts:['负载均衡SLB实例的属性配置','负载均衡SLB实例的监听配置','负载均衡SLB实例的后端ECS实例配置','负载均衡SLB的公网IP','负载均衡SLB的操作日志存储位置'],exp:'公网IP是购买负载均衡SLB时候系统分配的，或者你单独购买EIP后单独给负载均衡SLB绑定。并不是在你在负载均衡的配置和管理里面可以设定的。'},
  {id:1307,type:'multi',answer:'BC',stem:'您已经基于阿里云的云服务器ECS实例构建好了一个Web网站，向外提供服务，最近你发现随着访问量的上涨，您的客户访问图片的速度有的时候会很慢，你发现网页通过手机和pad等进行访问的时候，图片的适配也做得不太好，有些影响业务。以下哪些操作可以解决该问题？',opts:['将网站的图片内容存放到RDS中解决访问速度慢的问题','将网站的图片内容存放到对象存储OSS中，可以解决访问速度慢的问题','将网站的图片内容存放到OSS中,并开通图片处理的功能，在不同的终端访问时调用图片处理能力进行实时处理来解决适配问题','自己开发图片适配的能力来匹配不同的终端访问'],exp:'题目中说了会有图片访问速度很慢，以及图片的适配较差，所以需要用对象存储OSS中解决访问速度慢的问题，结合对象存储OSS中的图片处理能力来解决图片适配差的问题。'},
  {id:1308,type:'multi',answer:'AD',stem:'SLB负载均衡支持TCP监听方式，TCP监听方式支持哪几种健康检查方式？',opts:['HTTP','upd','Https','TCP'],exp:'选择健康检查协议类型，监听为TCP协议时，健康检查方式可选TCP或参考链接：http模式。参考链接：https://help.aliyun.com/document_detail/85959.html'},
  {id:1309,type:'multi',answer:'BC',stem:'「1飞天分布式操作系统是由阿里云自主研发、服务全球的超大规模通用计算操作系统，它可以将遍布全球的百万级服务器连成一台超级计算机，以在线公共服务的方式为社会提供计算能力。以下不属于飞天操作系统构成的是',opts:['分布式文件系统盘古','集群部署夸父','弹性裸金属神龙','任务调度伏羲'],exp:'飞天（Apsara）系统中，夸父，主要负责网络；女娲，主要负责协同；伏羲，主要负责调度；盘古，主要负责存储；神农，主要负责监控。'},
  {id:1310,type:'multi',answer:'AD',stem:'ossutil是一种管理OSS数据的工具，提供方便、简洁、丰富的Bucket和Object管理命令。下列关于ossutil通用命令的描述中，哪些是正确的？',opts:['-C 配置文件路径','-e 访问OSS使用的AccessKeyID','-K 用于指定Bucket的Endpolnt','--acl 配置ACL信息'],exp:'参考链接：https://help.aliyun.com/document_detail/50455.html'},
  {id:1311,type:'multi',answer:'ABC',stem:'您发现某台阿里云的云服务器ECS实例的磁盘上的数据被误删除，需要回滚到之前某个时刻进行数据恢复，可以通过对该磁盘进行回滚操作来实现。登录到阿里云的管理控制台进行回滚操作时，您发现不能进行该操作，可能是以下哪些原因造成的？',opts:['云服务器ECS实例的状态为“运行中”','云服务器ECS实例的状态为“启动中”','云服务器ECS实例的状态为“已过期”','云服务器ECS实例的状态为“已停止”'],exp:'回滚磁盘必须要求云盘必须已经挂载到某台ECS实例上，而且已经停止实例。所以不会是“已停止”的状态造成的。参考链接：https://help.aliyun.com/document_detail/25456.html'},
  {id:1312,type:'multi',answer:'BC',stem:'阿里云ECS有两种网络类型经典网络与专有网络，关于这两种网络类型的区别，以下哪些说法是正确的？',opts:['经典网络可以进行自定义网络，专有网络无法自定义','经典网络由阿里云统一规划和管理，更适合对网络易用性要求比较高的用户','专有网络是指用户在阿里云的基础网络内建立一个可以自定义的专有隔离网络','经典网络需要用户进行管理，专有网络更加的简单无需专业的网络管理'],exp:'经典网络无法自定义且无需用户进行管理，专有网络可以进行自定义且需要用户自行管理设置。参考链接：https://help.aliyun.com/document_detail/61651.html'},
  {id:1313,type:'multi',answer:'ACD',stem:'阿里云的负载均衡SLB的Listener是服务监听，每个监听都对应了后端的一个应用服务。服务监听(Listener)包含了以下哪些内容？',opts:['监听端口','后端ECS实例个数','负载均衡策略','健康检查配置','负载均衡SLB实例的IP地址'],exp:'本题多选正确答案为ACD。A（监听端口）、C（负载均衡策略）、D（健康检查配置）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1314,type:'multi',answer:'ACD',stem:'OSS提供自动保存访问日志记录功能，Bucket的拥有者可以通过OSS控制台为其所拥有的Bucket开启访问日志记录功能。下列关于OSS开启访问日志记录功能的说法中，哪些是正确的？',opts:['Bucket的拥有者可以通过OSS控制台，为其所有的bucket开启访问日志纪录功能','开启访问日志记录功能后，访问日志每分钟生成一次','通过对生成的日志文件进行分析，可以轻松定位在OSS Bucket上的所有操作','开启访问日志记录功能后，访问日志会按照固定的命名规则，生成一个Object写入用户指定的Bucket'],exp:'当一个Bucket(源Bucket，SourceBucket)开启访问日志记录功能后，OSS自动将访问Bucket中文件的的请求访问记录，以小时为单位，按照设置的命名规则，生成一个Object写入用户指定的bucket(目标Bucket，Target Bucket)。日志每一小时自动生成一次，通过对生成的日志文件进行分析，可以轻松定位在OSS Bucket上的所有操作。参考链接：https://help.aliyun.com/knowledge_detail/39654.html'},
  {id:1315,type:'multi',answer:'ACD',stem:'1您可以使用阿里云的云服务器ECS实例的内网IP进行通信，提升通信效率的同时还节省流量费用，以下哪些云产品之间的通信不需要其他产品的辅助，通过内网IP直接完成？',opts:['相同地域的云服务器ECS实例与云服务器RDS实例之间','不同地域的不同的云服务器ECS实例之间','相同地域的云服务器ECS实例与对象存储OSS之间','相同地域的不同的云服务器ECS实例之间'],exp:'不同地域之前的ECS不支持通过内网地址互相访问。'},
  {id:1316,type:'multi',answer:'BC',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，具有高可用、低成本、安全可靠等优点。关于低成本，以下哪些说法是正确的？',opts:['无论公网还是私网类型实例都支持按流量和带宽计费','无需一次性采购昂贵的负载均衡设备','运维投入大大减少','只收取流量费用，即根据实际使用流量付费，无需为负载均衡支付租费'],exp:'题目中问的是负载均衡SLB低成本的描述正确的是，"无论公网还是私网类型实例都支持按流量和带宽计费"，显然是不正确的，私网是收取实例费的而不是按照流量和带宽收费。"只收取流量费用，即根据实际使用流量付费，无需为负载均衡支付租费"是不正确的，SLB不仅收取实际使用公网流量费用，还收取实例费用。'},
  {id:1317,type:'multi',answer:'CDE',stem:'「1某公司希望利用弹性伸缩服务应对周期性业务高峰，同时希望尽可能降低使用成本，您推荐该公司选用以下哪几种方案？',opts:['使用实例自定义数据，设置规则，在不同时段创建不同规格的实例','尽量使用监控报警任务而不是定时任务，仅为实际使用的资源付费','针对非高峰时段，购买包年包月ECS实例','针对高峰时段，组合使用按量实例和抢占式实例','针对高峰时段，指定多种弹性伸缩服务的伸缩配置（实例规格）'],exp:'针对高峰时段，指定多种实例规格，并组合使用按量实例和抢占式实例，以更低成本购买ECS实例。伸缩组会按照单位vCPU的价格从低到高排序，优先选择单位vCPU价格更低的实例规格。参考链接：https://help.aliyun.com/document_detail/148120.html'},
  {id:1318,type:'multi',answer:'BD',stem:'小明是某企业的运维工程师，登录两台ECS后发现内网无法通讯，以下哪些可能是造成这种情况的原因？',opts:['两台ECS在同一VPC','两台云服务器实例在不同地域','两台ECS实例在同一个账号下，同一个地域的不同可用区','两个云服务器ECS实例在不同的安全组'],exp:'本题多选正确答案为BD。B（两台云服务器实例在不同地）、D（两个云服务器ECS实例在）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1319,type:'multi',answer:'AB',stem:'【】关于阿里云的云服务器ECS实例是否支持安装虚拟化程序的说法中，哪些是正确的？',opts:['云服务ECS实例是基于虚拟化平台运行的，不支持部署虚拟化程序','如果在云服务器ECS实例中部署虚拟化程序，会导致服务器出现不可预测的问题','可以在云服务器ECS实例中部署虚拟化程序，阿里云提供相应的技术支持','如果在云服务器ECS实例中部署虚拟化程序，服务器出现的问题是可以预测的'],exp:'阿里云云服务ECS实例是基于虚拟化平台运行的，不支持部署虚拟化程序，部署虚拟化程序，可能出现不可预测的故障。'},
  {id:1320,type:'multi',answer:'BD',stem:'阿里云的云服务器ECS产品支持的SSD云盘，可以用于I/O密集型应用、中大型关系型数据库及NoSQL数据库中。以下哪些是SSD云盘独有的优势？',opts:['采用分布式三副本机制，提供 99.9999999% 的数据可靠性','SSD云盘的随机和顺序读写的IOPS都比普通云盘高','单块云盘最大提供 32768 GB 存储空间','访问时延可以达到 0.5−2 ms'],exp:'题目中问的是:SSD云盘独有的优势。所以需要普通云盘没有的优势。其中三副本机制的高可靠性以及最大提供32768GB存储空间普通云盘也有这个特性。SSD云盘的顺序读写的IOPS都比普通云盘要高，以及访问延时很低，这个是它独有的优势。'},
  {id:1321,type:'multi',answer:'BC',stem:'OSS是按使用收费的服务，为了防止您在OSS上的数据被其他人盗链，OSS支持基于HTTPheader中表头字段referer的防盗链方法。用户在进行下面哪些访问操作的时候，OSS会进行防盗链验证？',opts:['请求的Header中有“Authorization”字段的访问object','通过URL签名访问object','匿名访问object','白名单访问object'],exp:'用户只有通过URL签名或者匿名访问Object时，才会做防盗链验证。请求Header中有Authorization字段时，不会做防盗链验证。'},
  {id:1322,type:'multi',answer:'ABE',stem:'「云计算是分布式计算的一种，指的是通过网络”云”将巨大的数据计算处理程序分解成无数个小程序，然后，通过多部服务器组成的系统进行处理和分析这些小程序得到结果并返回给用户。以下关于云计算特点的说法中，哪些是正确的？',opts:['高可靠性','超大规模','只支持单租户','费用昂贵','虚拟化'],exp:'本题多选正确答案为ABE。A（高可靠性）、B（超大规模）、E（虚拟化）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1323,type:'multi',answer:'AB',stem:'SLB实例后端ECS实例权重设置为零时，对健康检查产生哪些影响？',opts:['负载均衡不会再将流量转发给该ECS实例，且四层监听的后端服务器健康检查会显示异常','相当于将该ECS实例移出负载均衡','没有影响，只是分配的流量减少','有影响后端ECS会直接释放掉'],exp:'参考链接：https://help.aliyun.com/document_detail/55205.html'},
  {id:1324,type:'multi',answer:'AD',stem:'已知对象存储服务OSS中，低频访问类型的Object的最短存储周期为30天。对象文件abc.txt作为标准存储类型已存储了10天，当分别通过生命周期和手动方式转换为低频访问类型时，需要继续存储多少天才能满足最短存储周期要求？',opts:['生命周期，20天','生命周期，30天','手动转换，20天','手动转换，30天'],exp:'参考链接：https://help.aliyun.com/document_detail/90090.html'},
  {id:1325,type:'multi',answer:'AB',stem:'「1使用阿里云负载均衡SLB将负载分发到多台云服务器ECS实例上去的时候，可以通过以下哪些方式获得发起请求的用户的真实IP？',opts:['7层服务可以通过Http Header:X-Forwarded-For获取来访者真实IP,并保证配置负载均衡SLB监听时开启“获取真实访问IP”','4层服务可以直接获取,无需额外配置','4层服务可以通过Http Header:X-Forwarded-For获取来访者真实IP,并保证配置负载均衡SLB监听时开启“获取真实访问IP”','7层服务可以直接获取,无需额外配置'],exp:'针对4层(TCP协议)负载均衡服务，可以直接获取用户IP，七层则需要通过请求头中的X-Forwarded-For获取。'},
  {id:1326,type:'multi',answer:'BC',stem:'【】交换机是阿里云专有网络VPC的基础网络设备，可以连接不同的云产品实例。下列关于交换机的说法，哪些是正确的？',opts:['VPC的交换机是个3层交换机，不支持2层广播和组播','交换机创建完成之后，无法修改CIDRBlock','删除交换机之前，必须先删除目标交换机所连接的云产品实例','新建交换机所使用的CIDRBlock可以与已经存在的交换机的CIDRBlock重复'],exp:'交换机不支持组播和广播，但VPC的交换机是存2层交换机。 交换机创建后，不能再修改网段。详见创建交换机参考链接：https://help.aliyun.com/document_detail/65387.html 删除交换机前，确保满足以下条件: 1、您已经删除交换机下创建的云资源，例如ECS实例、SLB实例和RDS实例等。 2、如果要删除的交换机下配置了SNAT条目、高可用虚拟IP等，请确保您已经删除了这些关联的资源。 3、交换机网段不能与所属VPC下其他交换机的网段重叠。如有网段重叠，请修改为其他网段。参考链接：https://help.aliyun.com/document_detail/65387.html'},
  {id:1327,type:'multi',answer:'ABD',stem:'1您创建了一台操作系统为Windows的阿里云的云服务器ECS实例，您本地的机器采用的是Windows系统，可以采用以下哪些方式登录该ECS实例？',opts:['ECS实例有公网带宽的情况下，可以通过手机上的远程桌面 APP (例如 微软远程桌面MSTSC APP)登录ECS实例','无论您在创建ECS实例时是否购买了带宽，都可以通过阿里云的管理控制台的管理终端登录ECS实例','只有ECS实例有公网带宽的情况下，才可以通过阿里云的管理控制台的管理终端登录实例','ECS实例有公网带宽的情况下，可以通过远程桌面连接 (Microsoft Terminal Services Client, MSTSC)登录ECS实例'],exp:'阿里云的管理控制台在Windows的实例没有公网的时候，也是可以连接的。'},
  {id:1328,type:'multi',answer:'BCE',stem:'地域指的是阿里云的云服务器ECS实例所在的物理位置。用户可以根据自己的客户群体分布的不同，选择不同地域的云服务器ECS实例提供服务。以下关于ECS实例的地域说法，哪些是正确的？',opts:['美西(硅谷)的ECS实例可以通过内网访问亚太(新加坡)的OSS Bucket','同一地域内的ECS实例内网间是可以互通的','不同地域之间的ECS实例内网不互通','华北1(青岛)的ECS实例可以通过内网访问华东1(杭州)的云数据库RDS实例','不同地域之间的不同云产品，内网不互通'],exp:'同一个地域之间内网是互通的，不同的地域之前内网默认不互通。所以华北1(青岛)的ECS实例是不可以通过内网访问华东1(杭州)的云数据库RDS实例；美西(硅谷)的ECS实例是不可以通过内网访问亚太(新加坡)的OSSBucket。'},
  {id:1329,type:'multi',answer:'ABCD',stem:'「1阿里云内容分发网络CDN建立并覆盖在承载网之上，由分布在不同区域的边缘节点服务器集群组成的分布式网络，替代以WebServer为中心的传统数据传输模式。如果用户在使用cDN的过程中发现CDN缓存的命中率“比较低，以下哪些是可能的原因？',opts:['网站访问量较低，文件热度不够，CDN收到请求较少无法有效命中缓存','缓存配置不合理，针对某些文件设置较短，导致CDN节点频繁回源','HTTP Header设置导致无法缓存，需要用户检查源站的 Cache-Control 设置或者 Expires 的设置','源站动态资源较多，多为不可缓存的内容，也会导致频繁回源拉取','开通CDN时选择的带宽不足，服务能力已达到上限'],exp:'排除法，CDN是按照按每日带宽峰值计费，所以不存在带宽不足，服务能力达上限的问题'},
  {id:1330,type:'multi',answer:'BC',stem:'1在创建ECS实例时选择了错误的操作系统，可以通过更换系统盘来更换操作系统，更换系统盘是指为ECS实例重新分配一块系统盘，旧系统盘会被释放。新系统盘的云盘类型外还有哪些保持不变？',opts:['系统盘ID','实例IP','弹性网卡MAC','部署的应用'],exp:'更换操作系统后，阿里云会为您的ECS实例重新分配一块新系统盘，此时系统盘ID会更新，旧系统盘会被释放。系统盘的云盘类型、实例IP地址以及弹性网卡MAC地址保持不变。参考链接：https://help.aliyun.com/document_detail/50134.html'},
  {id:1331,type:'multi',answer:'AC',stem:'客户在11:00:00创建了一台按量付费ECS实例，实例规格为ecs.g5.large，并在11:30:00升配为ecs.g5.4xlarge。则在11:00～12:00间会产生以下哪几种计费信息？',opts:['第一条对应11:00:00~11:30:00，实例规格按照ecs.g5.large计费','第一条对应11:00:00~11:30:00，实例规格按照ecs.g5.4xlarge计费','第二条对应11:30:00~12:00:00，实例规格按照ecs.g5.4xlarge计费','第二条对应11:30:00~12:00:00，实例规格按照ecs.g5.xlarge计费'],exp:'官方文档原话:变更配置后计费，您在11:00:00创建了一台按量付费实例，实例规格为ecs.g5.large，并在11:30:00升配为ecs.g5.4xlarge。则在11:00～12:00间会产生两条计费信息。 第一条对应11:00:00～11:30:00，实例规格按照ecs.g5.large计费。 第二条对应11:30:00～12:00:00，实例规格按照ecs.g5.4xlarge计费。参考链接：https://help.aliyun.com/document_detail/40653.html'},
  {id:1332,type:'multi',answer:'BD',stem:'「客户在处理OSS中存储的图片时，可以对OSS中存储的图片执行不同的操作，例如格式转换、（）、缩放、（）、水印和样式封装等。',opts:['任何格式的图片质量转换','裁剪','更改图片颜色','旋转'],exp:'参考链接：https://help.aliyun.com/document_detail/48113.html'},
  {id:1333,type:'multi',answer:'AC',stem:'在阿里云上使用云数据库RDS MySQL时，需要先创建RDS MySQL实例，然后创建数据库和账号，而后可以通过DMS登录RDSMySQL。其中创建管理账号时支持两种数据库账号：高权限账号和普通账号。关于这两种账号说法正确的是',opts:['如果高权限账号自身出现问题，例如权限被意外回收，可以通过重置账号权限的方法恢复','一个实例可以创建多个普通账号','账号创建后，账号类型可以根据需要切换','高权账号可以管理所有普通账号和数据库','一个实例中可以创建多个高权限账号','可以通过SQL语句创建和管理高权账号'],exp:'https://help.aliyun.com/document_detail/96089.html'},
  {id:1334,type:'multi',answer:'ABDE',stem:'内容安全是一款多媒体内容智能识别服务，支持对图片、视频、文本、语音等对象进行多样化场景检测。可通过内容检测API调用阿里云提供的接口来进行内容检测，提供功能。',opts:['人工审核','人脸识别','增量扫描','内容审核','图片OCR识别','存量扫描'],exp:'https://help.aliyun.com/document_detail/50168.html'},
  {id:1335,type:'multi',answer:'AB',stem:'云数据库Redis版是兼容开源Redis协议标准、提供混合存储的内存数据库服务，用来解决企业高吞吐、低延迟及弹性变配等业务需求。云数据库Redis实例类型提供和两种版本可按需选择。',opts:['企业版','社区版','共享版','集群版'],exp:'https://help.aliyun.com/document_detail/26342.html'},
  {id:1336,type:'multi',answer:'ABCE',stem:'创建阿里云的云服务器ECS实例后，用户无需购买单独的服务就可以抵御的安全攻击包括以下哪几项？',opts:['DDos攻击','异地登陆','暴力密码破解','敏感信息泄露','Web漏洞发现'],exp:'本题多选正确答案为ABCE。A（DDos攻击）、B（异地登陆）、C（暴力密码破解）、E（Web漏洞发现）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1337,type:'multi',answer:'AE',stem:'随着金融证券行业云上业务规模的扩大，多网络间进行私网互通时，会遇到被监管机构要求使用固定私网地址访问的场景，此时可以使用产品实现固定私网地址访问。',opts:['VPC NAT网关','全球加速','负载均衡','公网NAT网关','云企业网','高速通道'],exp:'随着金融证券行业云上业务规模的扩大，多网络间进行私网互通时，会遇到被监控机构要求使用固定私网地址访问的场景。您可以使用VPC NAT网关的SNAT功能和DNAT功能实现固定私网地址访问的场景。https://help.aliyun.com/document_detail/395510.html'},
  {id:1338,type:'multi',answer:'BC',stem:'阿里云内容分发网络CDN建立并覆盖在承载网之上，由分布在不同区域的边缘节点服务器群组成的分布式网络，替代以WebServer为中心的传统数据传输模式。用户使用阿里云CDN时，以下哪些步骤是必须的？ 选项：',opts:['手动刷新缓存','添加“加速域名”','CNAME域名解析','CDN使用资源监控'],exp:'参考链接：https://help.aliyun.com/document_detail/27112.html'},
  {id:1339,type:'multi',answer:'AB',stem:'有两种模式来删除阿里云弹性伸缩(Auto Scaling)的伸缩组:强制删除和非强制删除。在非强制删除模式下，必须满足以下哪两个条件才可以删除？',opts:['伸缩组没有任何伸缩活动正在执行','伸缩组当前的ECS实例数量为0','伸缩组没有对应的定时任务以及报警任务','伸缩组没有和负载均衡SLB，云数据库RDS配合使用'],exp:'如果Forcedelete属性为false，必须满足以下两个条件，才能删除伸缩组:1.伸缩组没有任何伸缩活动正在执行。2.伸缩组当前的ECS实例数量(TotalCapacity)为 0。'},
  {id:1340,type:'multi',answer:'AB',stem:'题干：563/820、「1某电商平台为吸引用户，除定期推出优惠活动外，还会在节假日、会员日、购物节开展线上大促。为顺利承载活动带来的流量，运维人员可以分析活动历史数据，提前预估新活动所需的计算资源。但如果高峰期流量超出预估，仍需要临时手动创建ECS实例，存在可用性风险。您推荐选用以下哪几种方案满足业务需求？ 选项：',opts:['针对日常业务流量，购买包年包月ECS实例','针对计划外突增流量，通过弹性伸缩监控负载变化并实现自动创建ECS实例','使用OSS来解决该问题','使用大量的服务器来应对该问题'],exp:'本题多选正确答案为AB。A（针对日常业务流量，购买包）、B（针对计划外突增流量，通过）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1341,type:'multi',answer:'ABC',stem:'［MapReduce是一种编程模型，用于大规模数据集的并行运算，可以非常好地和云计算相结合以处理海量数据计算。MapReduce的设计目标包括以下哪些项?',opts:['易于编程','易于扩展','高容错性','实时性','易于迁移'],exp:'MapReduce将自己的程序运行在分布式系统上，他的计算速度比较慢，计算出来的中间结果等等都会写到磁盘上，输出的结果也会到磁盘上，读写磁盘就意味着性能不能达到实时的要求。做历史数据的批处理比较好。'},
  {id:1342,type:'multi',answer:'ABDF',stem:'阿里云关系型数据库RDS是一种稳定可靠、可弹性伸缩的在线数据库服务。RDS支持多种数据库引擎，包括和，企业可以根据需要灵活进行选择。',opts:['SQL Server','PostgreSQL','MongoDB','MySQL','Oracle','MariaDB TX'],exp:'RDS支持MySQL、SQL Server、PostgreSQL和MariaDB引擎，并且提供了容灾、备份、恢复、监控、迁移等方面的全套解决方案.https://help.aliyun.com/document_detail/26092.html'},
  {id:1343,type:'multi',answer:'ABE',stem:'阿里云负载均衡服务SLB提供性能保障型实例，该类型实例提供了可保障的性能指标，那么它的关键指标有哪些？',opts:['最大连接数-Max Connection','每秒新建连接数-Connection Per Second (CPS)','连接响应超时时间Connection Response timeout retry times','连接响应超时重试次数 Connection Response timeout retry times','每秒查询数-Query Per Second (QPS)'],exp:'考察的是:性能保障型实例的三个关键指标，性能保障型实例的三个关键指标如下: 1.最大连接数-MaxConnection 2.每秒新建连接数-ConnectionPerSecond(CPS) 3.每秒查询数-QueryPerSecond(QPS)参考链接：https://help.aliyun.com/document_detail/85939.html'},
  {id:1344,type:'multi',answer:'ACE',stem:'「某电商物网站，为用户设计了购物车的功能。该网站搭建在阿里云上，选用了云服务器ECS实例和负载均衡SLB实例，应用程序将会话信息和购物车信息都只保存在了应用程序的内存中，公测期间发现绝大部分测试用户的购物车功能没有问题，但一小部分用户的购物车发生了最早添加的商品随机丢失的现象。试分析以下哪些原因可能会造成这种情况？',opts:['负载均衡SLB实例进行主备可用区切换导致部分用户数据丢失','用户使用手机登录，一次购物的过程中，发生过网络的切换导致的重新链接','用户购物的时长超过了负载均衡SLB实例中定义的会话保持的超时时间','负载均衡SLB实例未开启会话保持功能','某云服务器ECS实例状态不正常，导致这部分用户前期的购物篮记录被清空'],exp:'商品的数据都保存在内存中，那既然出现了数据丢失，出现的问题要么是用户没有访问保存购物数据的那台机器，要么是保存他那台数据的机器出问题了。'},
  {id:1345,type:'multi',answer:'AC',stem:'某用户因业务需要将多台ECS实例从经典网络迁移到专有网络VPC中，为避免迁移对用户的业务应用造成影响，用户需要提前评估迁移对ECS实例的影响。对于ECS在迁移后的变化，以下哪些说法是正确的？',opts:['实例用户名和密码不变','私网IP会变化','公网IP会变化','实例ID会变化'],exp:'本题多选正确答案为AC。A（实例用户名和密码不变）、C（公网IP会变化）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:1346,type:'multi',answer:'ACD',stem:'路由器是阿里云专有网络VPC的枢纽。下列描述中关于路由器的说法中，哪些是正确的？',opts:['删除VPC时，会自动删除对应的路由器','路由器不支持根据具体的路由条目的设置来转发网络流量','创建VPC时，系统会自动为每个VPC创建1个路由器','不支持直接创建和删除路由器'],exp:'路由器支持根据具体的路由条目的设置来转发网络流量。路由条目定义了通向指定目标网段的网络流量的下一跳地址。路由表根据具体的路由条目的设置来转发网络流量。参考链接：https://www.alibabacloud.com/help/zh/doc-detail/53682.html'},
  {id:1347,type:'multi',answer:'ACDE',stem:'阿里云的云服务器ECS实例的生命周期是从创建开始到释放结束。释放方式包括包年包月的实例到期、按量付费的实例欠费停机、按量付费实例的用户主动释放。在ECS实例的生命周期中有不同的实例状态，关于ECS实例状态的说法，哪些是正确的？',opts:['ECS实例进行重新初始化系统盘或数据盘的操作时，将处于“重新初始化中”状态，如果ECS实例长时间处于该状态，则说明该实例出现异常','“运行中”是一个ECS实例的中间状态','包年包月的ECS实例到期后因没有及时续费，或者按量付费的实例因账户欠费都会导致ECS实例变成“已过期”状态，“已过期”的ECS实例不能对外提供业务','实例状态可以分为中间状态和稳定状态','处于“已停止”状态的云服务器ECS实例不能对外提供业务'],exp:'运行中是稳定状态。'},
  {id:1348,type:'multi',answer:'AD',stem:'某个伸缩组asg-1的默认冷却时间为10分钟，伸缩组内存在一条伸缩规则remove1，冷却时间为15分钟。在7：55时伸缩规则remove1成功执行了一次伸缩活动。下列选项中，哪几项伸缩活动请求会被执行？',opts:['定时任务触发请求，时间为8:00','报警任务触发请求，时间为8:00','报警任务触发请求，时间为8:06','伸缩组7:58被停用并再次启用后，报警任务触发请求，时间为8:00'],exp:'在冷却时间内，伸缩组会拒绝由云监控报警任务触发的伸缩活动请求。但其他类型任务(手动执行任务、定时任务)触发的伸缩活动可以立即执行，绕过冷却时间。 如果您停用伸缩组，然后再次启用伸缩组，冷却时间将会失效'},
  {id:1349,type:'multi',answer:'AB',stem:'在使用云服务器ECS的过程中，如果按量付费实例承载了企业的关键业务，可以为按量付费实例开启实例释放保护，防止手动释放按量付费实例，有效避免因操作疏忽、团队成员沟通不及时等原因造成不可挽回的后果。某企业管理员为实例设置了实例释放保护，但是发现实例仍然被自动释放，可能的原因是',opts:['账号欠费超过15天，实例被自动释放','实例设置了自动释放时间，到期后被自动释放','实例关机超过15天被自动释放','实例自动备份失败触发了实例释放操作'],exp:'实例释放保护不能阻止因合理原因自动执行的释放行为，包括但不限于：账号欠费超过15天，实例被自动释放。实例设置了自动释放时间，到期后被自动释放。实例存在安全合规风险，被停止或释放。实例由弹性伸缩自动创建，在缩容时被移出伸缩组并释放。https://help.aliyun.com/document_detail/101256.html'},
  {id:1350,type:'multi',answer:'BCD',stem:'云服务器ECS实例的付费方式包括包年包月和按量付费两种。对于按量付费的云服务器ECS实例的操作，以下哪些说法是正确的？',opts:['不能取消已经设置的云服务器ECS实例的自动释放时间','可以查看云服务器ECS实例的消费记录','可以设置云服务器ECS实例的自动释放时间','可以随时释放不使用的云服务器ECS实例，不会引起费用的浪费'],exp:'可以随时取消已经设置的云服务器ECS实例的自动释放时间'},
  {id:1351,type:'multi',answer:'AB',stem:'题干：574/820、RAM(Resource Access Management)和STS(Security Token Service)是阿里云提供的权限管理系统，以下关于这两种权限管理机制的描述中，哪些是正确的？ 选项：',opts:['RAM提供一种长期有效的权限控制机制','通过STS可以返回一临时的AccessKey和Token，这些信息可以直接发给临时用户用来访问OSS','一般来说，从RAM获取的权限会受到更加严格的限制，','STS通过分出不同权限的子账号，将不同的权限分给不同的用户，这样一旦子账号泄露也不会造成全局的信息泄露'],exp:'RAM提供了一种长期有效的权限控制机制，通过分出不同权限的子账号，将不同的权限分给不同的用户，即使子账号泄露也不会造成全局的信息泄露。子账号在一般情况下是长期有效的。因此，子账号的AccessKey是不能泄露的。相对于RAM提供的长效控制机制，STS提供的是一种临时访问授权，通过STS可以返回临时的AccessKey和Token,这些信息可以直接发给l临时用户用来访问表格存储。一般来说，从STS获取的权限会受到更加严格的限制，并且拥有时间限制，因此即使这些信息泄露，对于系统的影响也很小。'},
  {id:1352,type:'multi',answer:'AB',stem:'「1阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，对于公网的负载均衡SLB实例，支持哪几种付费模式？',opts:['按使用流量计费','按固定带宽计费','按后端服务器台数计费','按照后端服务器的计算能力计费'],exp:'SLB支持按使用流量或者按照固定宽带付费。'},
  {id:1353,type:'multi',answer:'BD',stem:'「1某公司运维人员开通阿里云负载均衡SLB实例时选择了华东1内多可用区类型，为实现同地域容灾方案，其中主可用区选择了可用区A，备可用区设置了可用区B，后端服务器设置了4台ECS实例，其中2台在华东1的可用区A，另外2台在华东1的可用区B，以下哪些说法是正确的？',opts:['当可用区A发生故障时，用户可以手动快速将负载均衡切换到另外一个备可用区以恢复服务能力','当可用区A发生故障时，用户访问流量将转发至备可用区B内的ECS实例','当主可用区A恢复时，用户可以手动快速将负载均衡会切换到主可用区提供服务','当主可用区A恢复时，负载均衡会自动切换到主可用区提供服务'],exp:'当主机工作正常时，流量将直接转发至主机；当主机宕机时，流量将切换至备机。参考链接：https://help.aliyun.com/document_detail/85965.html'},
  {id:1354,type:'multi',answer:'ABC',stem:'使用阿里云的高速通道可以实现专有网络VPC之间的互联和私网通信。以下哪些场景可以通过高速通道实现。',opts:['同一个帐号下在同一地域内的两个VPC之间的私网通信','不同账号下的两个网段不同的VPC之间可以通过高速通道进行私网通信','同一个帐号处于两个不同地域的VPC之间进行私网通信','同一个账号下的VPC与经典网络的云服务器ECS实例的私网通信'],exp:'高速通道(ExpressConnect)是一款基于IPVPN的便捷高效的网络服务，用于在云上的不同网络环境间实现高速、稳定、安全的私网通信，包括跨地域/跨用户的VPC 内网互通、专线接入等场景，有效的帮助您提高网络拓扑的灵活性和跨网络通信的质量和安全性。VPC中的ECS不可以和经典网络的ECS实现高速通道的通信。'},
  {id:1355,type:'multi',answer:'AD',stem:'建立数据通信前，安全组逐条匹配安全组规则查询是否放行访问请求。假设用户创建了两条安全组规则1和2，两条安全组规则的协议类型、端口范围、授权类型、授权对象都相同，不同的是规则1是拒绝策略，规则2是允许策略，那么，以下哪些说法是正确的？',opts:['若规则1和规则2优先级相同：拒绝策略的规则优先生效，允许策略的规则不生效','若规则1和规则2优先级相同：允许策略的规则优先生效，拒绝策略的规则不生效','若规则1和规则2优先级不同：优先级数字大的规则生效','若规则1和规则2优先级不同：优先级数字小的规则生效'],exp:'安全组的允许和拒绝策略，如果规则只有授权策略不同，则拒绝策略的安全组规则生效。 优先级的取值范围为1~100，数值越小，代表优先级越高。参考链接：https://help.aliyun.com/document_detail/271831.html'},
  {id:1356,type:'multi',answer:'BCD',stem:'「对象是阿里云对象存储OSS存储数据的基本单元，也被称为OSS的文件。每个对象由文件名(Key)，用户数据(Data)和元信息(Object Meta)组成。其中，对象的元信息是一组键值对，表示对象的一些属性。以下哪些属于OSS支持的文件操作？',opts:['文件修改','文件创建','文件删除','文件读取'],exp:'OSS的文件(Object)不支持修改。参考链接：https://help.aliyun.com/knowledge_detail/65426.html'},
  {id:1357,type:'multi',answer:'CD',stem:'.在CDN分发的内容默认为公开资源，用户拿到URL后均可访问，为防止站点资源被恶意下载盗用，可配置Referer防盗链进行访问控制，以下关于Referer防盗链说法正确的是',opts:['Referer防盗链功能默认启用','配置Referer类型只支持白名单方式','支持添加多个Referer名单','基于HTTP请求头中Referer字段来设置访问控制规则'],exp:'Referer防盗链，是基于HTTP请求头中Referer字段（例如，Referer黑白名单）来设置访问控制规则，实现对访客的身份识别和过滤，防止网站资源被非法盗用。本文介绍如何配置Referer防盗链。该功能默认不启用。https://help.aliyun.com/document_detail/27134.html'},
  {id:1358,type:'multi',answer:'ABC',stem:'【】下列关于OSS静态网站托管的说法中，哪些是正确的？',opts:['用户可以通过OSS将自己的Bucket配置成静态网站托管模式','通过Bucket域名访问Bucket配置的静态网站','如果默认页面为空，则表示不启用静态页面托管','OSS Bucket静态托管中的默认首页不支持html格式文件'],exp:'OSS的静态托管是支持html格式的文件的。参考链接：https://help.aliyun.com/document_detail/31872.html'},
  {id:1359,type:'multi',answer:'BC',stem:'您所在的企业准备上线',opts:['单独购买多线BGP服务来降低用户访问等待时间','OSS作为静态图片、视频、下载包的存储，以降低存储费用','配合CDN进行静态内容的加速 ，可以减少用户访问等待时间','使用专有网络VPC来提升网络可用性'],exp:'划重点:降低存储的费用，降低用户的访问等待时间。所以需要选择对象存储OSS以及内容分发CDN。'},
  {id:1360,type:'multi',answer:'AC',stem:'阿里云对象存储OSS提供了静态网站托管的功能，A公司的架构师小明一年前基于此功能为公司建设了一个企业门户网站。出于业务发展的需要，现网站需要支持动态功能，包括产品信息的动态增加和展示，数据总量预估在2GB左右。公司目前没有数据库开发和管理的人员，为满足业务需求，小明至少还需要选择阿里云的哪几种产品？ 选项：',opts:['云服务器ECS','分布式关系型数据库服务(Distributed Relational Database Service，简称DRDS)','云数据库RDS','云盾DDoS高防IP'],exp:'划重点:公司需要实现网站的动态功能，包括产品信息的动态增加和展示。所以需要云服务器ECS来实现网站的动态部署，需要云数据库RDS来保存产品的信息。'},
  {id:1361,type:'multi',answer:'BCD',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力方面具备明显的优势。以下哪几项属于OSS安全方面的优势？',opts:['流量清洗和黑洞设备需要另外购买，OSS提供强大的API支持','免费支持防DDoS攻击、自动流量清洗及黑洞功能','多用户资源隔离机制','提供多种鉴权和授权机制及白名单、防盗链、主子账号功能'],exp:'题目中问的是OSS安全方面的优势，OSS提供企业级多层次安全防护，无需另外购买清洗和黑洞设备。参考链接：https://help.aliyun.com/document_detail/31818.html'},
  {id:1362,type:'multi',answer:'ADF',stem:'使用数字证书管理服务申请证书时，需要选择加密算法，通过加密算法得到的密钥对可以保证在世界范围内是唯一的。阿里云SSL证书服务支持和三种加密算法，可根据不同证书品牌进行选择。',opts:['ECC','MD5','AES','RSA','SHA-512','SM2'],exp:'阿里云提供SSL证书(服务端和客户端),且均支持ECC、RSA 或 SM(国密) 三种加密方式。'},
  {id:1363,type:'multi',answer:'ABD',stem:'阿里云内容分发网络CDN和传统厂商的CDN相比，具有稳定快速、节约成本和简单易用三个特点。以下关于阿里云CDN易用性优势的描述中，哪些是正确的？',opts:['可通过OpenAPI和SDK对CDN进行开通和关闭','WEB管理控制台提供了丰富简洁的配置界面，支持自定义防盗链、缓存策略、HTTP响应头等功能','用户只能通过OpenAPI下载CDN访问日志','如果CDN服务和加速域名同在一个阿里云帐号下管理，可以实现自动修改解析'],exp:'CDN控制台也是可以下载CDN访问日志的，OpenAPI并不是唯一途径。'},
  {id:1364,type:'multi',answer:'ACD',stem:'为了保障全体的CDN租户的使用体验，接入阿里云内容分发网络CDN前需要满足一些条件.以下关于阿里云CDN准入条件的描述中，哪些是正确的？',opts:['阿里云官网完成帐号实名认证','加速域名可以是彩票类网站','加速的域名必须在工信部完成备案，推荐接入阿里云备案','加速域名的源站内容，可选择保存于云服务器ECS实例或对象存储OSS；如源站内容不在阿里云，接入需经过人工审核'],exp:'彩票类的网站审核在接入的时候会审核不通过。'},
  {id:1365,type:'multi',answer:'ABC',stem:'「路由表中的每一项是一条路由条目。路由条目包括系统路由和自定义路由。路由条目指定了网络流量的导向目的地，由哪些部分组成？下一跳三部分组成。',opts:['目标网段','下一跳','下一跳类型','源地址'],exp:'路由表中的每一项是由一条路由条目。路由条目指定了网络流量的导向目的地，由目标网段、下一跳类型、下一跳三部分组成。路由条目包括系统路由和自定义路由。无论是系统路由表还是自定义路由表，都可以添加自定义路由条目。'},
  {id:1366,type:'multi',answer:'CD',stem:'某用户希望将其OSS存储空间上的数据集文件共享给多个合作伙伴，但不希望由自己支付费用，该用户开通了OSS服务的请求者付费模式。此时，合作伙伴需要支付访问数据的哪几种费用？',opts:['传输加速费用','存储费用','流量费用','请求费用'],exp:'对象存储OSS的请求者付费模式是指由请求者支付访问存储空间（Bucket）内数据时产生的费用，而Bucket拥有者仅支付存储费用。当您希望共享数据，但又不希望支付因共享数据产生的额外费用时，您可以开启此功能。参考链接：https://help.aliyun.com/document_detail/91337.html'},
  {id:1367,type:'multi',answer:'ABC',stem:'「阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务，具有高可用、低成本、安全可靠等特点。关于阿里云的负载均衡SLB的说法中，哪些是正确的？',opts:['无需一次性采购昂贵的负载均衡设备','解决了单台ECS实例的单点问题','支持同城容灾','结合云盾提供免费的20G以上的防DDoS攻击能力','无论公网还是私网类型实例都支持按流量计费'],exp:'SLB不需要购买设备，同时支持同城容灾。结合云盾提供免费的5G防DDoS攻击能力；负载均衡SLB的作用就是为了解决单台云服务器单点问题，负载均衡后端多台ECS同时对外提供服务从而扩展了应用的服务能力，增强了应用的可用性；SLB实例的收费不仅有流量费还要实例费/规格费参考链接：https://help.aliyun.com/document_detail/27692.html'},
  {id:1368,type:'multi',answer:'AC',stem:'边界路由器VBR是CPE(Customer-premises equipment)设备和VPC之间的一个路由器，作为数据从VPC到本地数据中心的转发桥梁。以下哪些说法是正确的？',opts:['决定物理专线端口模式，三层路由接口或基于VLAN的三层子接口','VBR与VPC之间不在需要使用静态路由','支持BGP协议','不需要管理路由表'],exp:'边界路由器功能中原话“决定物理专线端口模式为三层路由接口或基于VLAN的三层子接口”“支持边界路由协议BGP” 其他选项中VBR和VPC中的路由器类似，管理着一张路由表而非不需要管理路由表。参考链接：https://help.aliyun.com/document_detail/44854.html'},
  {id:1369,type:'multi',answer:'ABE',stem:'「1在阿里云负载均衡SLB实例和云服务器ECS实例配合使用时，最终的服务请求都会被负载均衡SLB实例按照转发的策略和规则分发到ECS实例执行。负载均衡SLB实例后端云服务器ECS实例的管理和配置，决定了整个系统的处理能力。以下关于后端云服务器ECS实例，哪些是正确的？',opts:['在使用负载均衡SLB实例的过程中可以随时调整后端ECS实例的数目','不同操作系统的云服务器ECS实例可以同时做为负载均衡SLB实例的后端服务器','禁用后端云服务器ECS实例的公网网卡不会影响负载均衡SLB服务','后端云服务器ECS实例的网络类型必须和负载均衡的实例类型一致','负载均衡SLB实例的服务能力与后端ECS实例的公网宽带无关'],exp:'如果ECS有公网IP，禁用公网网卡就会影响负载均衡服务。因为在有公网网卡的情况下，默认路由会走公网，如禁用就无法回包从而影响负载均衡服务。建议不要禁止，如一定要这么做，需要修改默认路由为私网才会不影响服务。但需要考虑业务是否对公网有依赖，如通过公网访问RDS等。后端云服务器ECS的网络类型不一定需要和负载均衡一致。负载均衡可以是公网IP的实例，ECS可以VPC网络类型的实例。 参考链接：https://help.aliyun.com/knowledge_detail/55193.html'},
  {id:1370,type:'multi',answer:'ACD',stem:'您希望将本地已经在运行的业务系统(包括服务器及Mysql数据库)迁移到阿里云上，增加系统的可扩展性，并且降低运维成本，以下哪些是可行的操作？',opts:['使用数据传输DTS的增量数据同步功能将自建机房的MySQL实例的数据迁移到RDS for MySQL','基于本地的应用服务器制作镜像上传到阿里云，直接生成新的云服务器ECS实例，提供服务','将本地的应用部署到阿里云的云服务器ECS实例上','通过已经部署好的云服务器ECS实例制作镜像，进行应用的快速复制，生成更多的应用服务器'],exp:'本地的应用服务器制作镜像不支持上传到阿里云作为镜像提供服务。'},
  {id:1371,type:'multi',answer:'ABD',stem:'阿里云的云服务器ECS产品根据底层使用的硬件不同划分为不同的实例系列。对于实例系列采用lntelXeonCPU，实例系列II采用HaswellCPU。以下关于云服务器ECS产品的实例系列说法，哪些是正确的？',opts:['实例系列II的用户可以获得更大的实例规格','实例系列II相对于实例系列I增加了一些新的指令集，使整数和浮点运算的性能翻倍','ECS实例创建以后可以进行实例系列I与实例系列II的变更','实例系列II全部为 I/O 优化实例，配合SSD云盘使用可以获得更高的I/O性能'],exp:'系列II较系列I进行了硬件升级，采用HaswellCPU、DDR4内存，并默认为I/O优化实例，同时增加了一些新的指令集，使整数和浮点运算的性能翻倍，整体计算能力更强。但是不支持实例系列I与实例系列II之间可以互相升降配。'},
  {id:1372,type:'multi',answer:'AB',stem:'容器服务ACK集成Kubernetes网络、阿里云VPC、阿里云SLB，为用户提供稳定高性能的容器网络。容器化应用会在同一个节点上部署多个业务，而每个业务都需要自己的网络空间。下列关于容器网络说法正确的是',opts:['同一个VPC下的ECS可以直接访问Pod','每个Pod都拥有自己独立的网络栈和IP地址','Pod之间不可以互相访问','不同Pod的应用必须监听不同的端口以避免冲突'],exp:'每个Pod都拥有自己独立的网络空间和IP地址。不同Pod的应用可以监听同样的端口而不冲突。 Pod可以通过各自的IP地址互相访问。集群中Pod可以通过它独立的IP地址与其他应用互通： 同一个集群中，Pod之间相互访问。 Pod直接访问同一个VPC下的ECS。 同一个VPC下的ECS直接访问Pod。 https://help.aliyun.com/document_detail/97823.html(https://help.aliyun.com/document_detail/97823.html)'},
  {id:1373,type:'multi',answer:'CD',stem:'1某用户在手动释放经典网络ECS实例时，希望能够保留实例的公网IP继续作为对外服务的IP地址。该用户在手动释放时选择将公网IP转换为弹性公网IP，操作成功后，以下哪些说法是正确的？',opts:['公网网卡和相应的Mac地址仍被保留','EIP仍可以选择挂载到经典网络类型ECS实例','EIP采用按使用流量计费方式','一般情况下，公网带宽值和原ECS实例保持一致'],exp:'经典网络公网IP转换为EIP后: • 采用按使用流量计费方式。 • 公网带宽值和原ECS实例保持一致，您可以按需在专有网络管理控制台上升配EIP的公网带宽。但是，如果转换前经典网络类型ECS实例带宽为0Mbit/s，转换后的EIP带宽自动升级为1Mbit/s。 • 不能挂载到经典网络类型ECS实例上。 • 不同于专有网络VPC类型ECS实例，经典网络类型ECS实例具有公网网卡。如果您将经典网络公网IP转换为EIP，则无法保留该公网网卡和相应的Mac地址。'},
  {id:1374,type:'multi',answer:'ABD',stem:'「1某创业团队开发了一款提供“公共图片服务”的互联网应用，主要用途是为电商类网站提供图片托管，实现海量小图片存储和全国快速访问，每日平均增加500Gb图片文件，访问PV每日3000万次。通过自主开发的AP接口用于文件上传、查询和删除。目前该团队准备把全部应用迁到阿里云上，至少应该开通阿里云上的产品。',opts:['对像存储OSS','云服务器ECS','弹性伸缩ESS','内容分发网络CDN'],exp:'题目中说了，需要图片托管，所以需要OSS，需要快速访问，所以需要CDN，需要"自主开发的API接口用于文件上传、查询和删除"，所以需要ECS来部署。没有说到弹性伸缩(AutoScaling)的要求。'},
  {id:1375,type:'multi',answer:'ABE',stem:'阿里云的负载均衡SLB、云服务器ECS以及弹性伸缩(AutoScaling)三者合理的搭配使用，可以发挥出各自的优势，比如部署简单、安全可靠、无单点故障、可弹性伸缩、自动负载均衡、使用成本大幅度降低等，其中云服务器ECS承载了最终的计算、处理任务。在三者配合使用时，关于云服务器ECS的说法中，哪些是正确的？',opts:['同一个云服务器ECS实例只能添加到同一个伸缩组中','云服务器ECS实例的状态必须为运行中才能添加到伸缩组中去','同一个伸缩组中的云服务器ECS实例配置一定相同','云服务器ECS实例的付费类型必须为按量付费','同一个伸缩组中云服务器ECS实例必需加入负载均衡SLB白名单'],exp:'同一个伸缩组中的云服务器ECS实例配置可以不用相同。你可以手动添加闲置的不同配置的ECS进去，所以云服务器ECS实例的付费类型不是必须为按量付费，也可以的包年包月。'},
  {id:1376,type:'multi',answer:'BCE',stem:'LVS采用IP负载均衡技术和基于内容请求分发技术，实现了Linux平台下的简单负载均衡。一般来说，LVS集群采用三层结构，主要组成部分包括以下哪几项？',opts:['DNS解析','负载均衡器','服务器池','共享网络','共享存储'],exp:'参考链接：https://developer.aliyun.com/article/238458'},
  {id:1377,type:'multi',answer:'AB',stem:'创建专有网络后，用户可以通过创建交换机为专有网络划分一个或多个子网，在设置交换机的IPv4网段时，用户需了解交换机的网段限制，包括但不限于以下哪些选项？',opts:['交换机网段必须为其VPC网段的子集','交换机的网段和要通信的网段不能冲突','交换机网段不能大于所属VPC路由表中路由的目标网段范围，但可以相同','交换机创建后，可以视用户业务修改网段'],exp:'参考链接：https://help.aliyun.com/document_detail/65387.html'},
  {id:1378,type:'multi',answer:'BDE',stem:'「域名越来越稀少，好域名越来越贵，域名一旦被盗则令人费心费力，且不一定能够找回被盗域名，因此域名所有者需要提前做好域名防盗措施。注册局安全锁是目前最高等级的域名安全保护措施，由注册局在根服务器层面操作，开启注册局安全锁后，域名将被置为三种锁定状态：和',opts:['注册局设置禁止查询','注册局设置禁止转移','注册局设置禁止赎回','注册局设置禁止更新','注册局设置禁止删除','注册局设置禁止交易'],exp:'域名支持开启注册局安全锁。开启注册局安全锁后，域名将被置为以下三种锁定状态： 注册局设置禁止删除（serverDeleteProhibited） 注册局设置禁止转移（serverTransferProhibited） 注册局设置禁止更新（serverUpdateProhibited） https://help.aliyun.com/document_detail/35824.html(https://help.aliyun.com/document_detail/35824.html)'},
  {id:1379,type:'multi',answer:'BCD',stem:'出于业务的需求，您需要对某台阿里云的云服务器ECS实例的磁盘进行初始化操作，可以通过以下哪些方法提前备份重要的数据？',opts:['无需任何额外的操作，阿里云会自动进行备份','制作磁盘的快照','将数据备份到OSS中','如果是系统盘，可以基于快照制作自定义镜像'],exp:'阿里云不会自动帮助用户备份数据'},
  {id:1380,type:'multi',answer:'ABC',stem:'「用户可以通过控制台或API配置监听的健康检查。下列哪些属于SLB健康检查必选的参数配置？',opts:['响应超时时间','健康检查间隔','不健康阀值','健康检查请求'],exp:'注意题目要求的是必选参数，考的是配置健康检查的实际操作能力，健康检查请求不是必须的配置参数。参考链接：https://help.aliyun.com/document_detail/55477.html'},
