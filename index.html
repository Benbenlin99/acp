  {id:213,type:'single',answer:'B',stem:'在创建阿里云的云产品实例时，可以选择默认类型的专有网络VPC和交换机，这两项配置确定了专有网络类型的云产品创建时在相应地域和可用区下唯一的默认网络位置，与非默认的专有网络VPC和交换机之间的区别主要在于默认类型的VPC和交换机只能由阿里云为您创建。下列关于默认交换机的描述错误的是',opts:['默认交换机只能创建在默认专有网络中','如果您有已经创建的专有网络VPC和交换机，在创建专有网络VPC类型的云产品实例时，云产品实例就不会创建在默认交换机中','默认交换机与非默认交换机支持相同操作方式，且规格限制一致','默认交换机由阿里云为您创建，您自行创建的均为非默认交换机'],exp:'选项B描述错误，因为即使有自建的VPC和交换机，在创建云产品实例时，用户仍可选择默认VPC和默认交换机，实例可能创建在默认交换机中，表述过于绝对。选项A正确，默认交换机仅存在于默认VPC中；选项C正确，默认交换机与非默认交换机在操作方式和规格限制上基本一致；选项D正确，默认交换机由阿里云创建，用户创建的是非默认交换机'},
  {id:214,type:'single',answer:'A',stem:'阿里云负载均衡服务SLB支持用户可以同时设置实例维度上的“后端服务器”、监听维度上的“虚拟服务器组”和“转发规则”，那么当用户流量经过负载均衡某端口时，关于SLB判断流量转发的顺序，以下说法正确的是',opts:['先判断其是否能够匹配上某条“转发规则”，如果匹配，则将流量转发到该规则的后端服务器组上；','先判断该监听上是否设置了虚拟服务器组，如何设置，那么将流量转发到该虚拟服务器组上；','先判断是否有实例维度上的“后端服务器”，如果存在，那么即将流量转发到实例级别添加的各后端服务器中','支持用户同时在这三个维度上的设置，但三者添加的服务器之间有约束关系，所以无需考虑转发顺序'],exp:'注意以下描述的首先和其次的顺序：当用户流量经过负载均衡某端口时，我们首先判断其是否能够匹配上某条“转发规则”，如果匹配，则将流量转发到该规则的后端服务器组上；若不匹配并且在该监听上设置了虚拟服务器组，那么将流量转发到该虚拟服务器组上；若用户没有在该监听上设置虚拟服务器组，即将流量转发到实例级别添加的各后端服务器中。'},
  {id:215,type:'single',answer:'A',stem:'阿里云内容分发网络CDN在实际应用中，CDN效果的好坏与是否正确使用非常相关。以下场景不适合使用CDN。',opts:['重复访问率不高的个人网盘业务','纯静态页的企业门户网站','短视频分发网站','手机APP的升级包下载站'],exp:'重复访问率不高的个人网盘业务的回源次数太高，不适合使用CDN。'},
  {id:216,type:'single',answer:'B',stem:'阿里云的云服务器ECS产品的应用非常广泛，既可以单独的作为Web服务器，也可以与其他阿里云产品配合提供多媒体解决方案。在多媒体、大流量的APP或网站应用场景下，云服务器ECS实例与阿里云的产品搭配，可大幅减少用户访问的等待时间并降低带宽费用。',opts:['对象存储OSS','内容分发网络CDN','弹性伸缩Auto Scaling','负载均衡SLB'],exp:'题目中说了大幅减少用户访问的等待时间并降低带宽费用，意思就是加速访问，节省带宽，所以需要内容分发网络CDN来实现。'},
  {id:217,type:'single',answer:'C',stem:'阿里云负载均衡服务SLB支持配置域名或者URL转发策略，将来自不同域名或者URL的请求转发给不同的ECS处理，关于域名或者URL转发策略支持的协议，以下说法正确的是',opts:['只有4层监听（TCP和UDP协议）支持配置转发策略','只有7层监听（HTTP协议）支持配置转发策略','只有7层监听（HTTP和HTTPS协议）支持配置转发策略','4层监听（TCP和UDP协议）和7层监听（HTTP和HTTPS协议）都支持配置转发策略'],exp:'只有7层监听（HTTPS/HTTP协议）支持配置URL转发策略。参考链接：https://help.aliyun.com/document_detail/85955.html'},
  {id:218,type:'single',answer:'C',stem:'您基于阿里云的云服务器ECS实例部署了MySQL数据库，随着业务量的不断上涨，您自己部署的数据库的服务能力越来越不足，表现在并发连接数不足，磁盘的IOPS不能满足业务需要等，可以采用阿里云的产品来解决这些问题。',opts:['对象存储OSS','表格存储','云数据库RDS','大数据分析ODPS'],exp:'题目中说遇到了自己部署的数据库的服务能力越来越不足的问题，所以可以通过云数据库RDS来解决问题。'},
  {id:219,type:'single',answer:'C',stem:'云盘是阿里云为云服务器ECS提供的数据块级别的块存储产品，具有低时延、高性能、持久性、高可靠等特点。创建云盘后，用户可以在控制台对其进行管理，云盘的管理控制台直接支持的功能不包括 选项：',opts:['扩容磁盘','回滚磁盘','共享磁盘','备份磁盘'],exp:'阿里云云盘的管理控制台支持的功能包括扩容磁盘(A)、通过快照回滚磁盘(B)和备份磁盘(D)。共享磁盘(C)需使用特定的共享块存储类型且通常依赖API或CLI配置，控制台界面不直接提供此功能，因此正确选项为C'},
  {id:220,type:'single',answer:'D',stem:'在阿里云上创建专有网络VPC时，VPC会自动为用户创建1条系统路由，这条路由的作用是',opts:['没有任何作用','用于专有网络外的云产品实例访问专有网络内的云产品实例','用于专有网络内的云产品实例访问专有网络外的云服务（该云服务支持VPC内的云产品实例直接访问）','用于专有网络内的云产品互访'],exp:'以100.64.0.0/10为目标网段的路由条目，用于VPC内的云产品通信。参考链接：https://help.aliyun.com/document_detail/49002.html'},
  {id:221,type:'single',answer:'C',stem:'阿里云弹性伸缩服务AutoScaling可以根据业务需求和策略自动调整弹性计算资源。在业务需求增长时无缝增加ECS实例，满足计算需要。在创建伸缩配置时，不需要填写_信息。',opts:['镜像','计费方式','登录密码','安全组'],exp:'阿里云弹性伸缩服务(AutoScaling)可以根据业务的需求和预设策略自动地调整弹性计算资源。在其创建伸缩配置的过程中，某些信息是必要的，而某些则可以不用填写。在所给的选项中： A. 镜像：这是必要的，因为ECS实例需要一个镜像来启动和运行。 B. 计费方式：这也是必要的信息，因为不同的计费方式会影响到成本和资源使用情况。 C. 登录密码：在创建伸缩配置时，通常不需要单独填写登录密码，因为密码通常是在创建ECS实例时设置的，并且可以通过其他安全措施如密钥对来管理访问。 D. 安全组：安全组用于管理网络访问规则，是在ECS实例创建后配置的，不是在创建伸缩配置时需要的信息。 因此，在创建伸缩配置时，不需要填写的是登录密码，即选项C是正确的。虽然镜像和计费方式是重要的信息，但题目中并没有明确指出它们在创建伸缩配置时是否需要填写，所以答案专注于解释为什么登录密码是不需要填写的。'},
  {id:222,type:'single',answer:'D',stem:'下面不是安骑士包含的功能？',opts:['木马文件检查','异地登录报警','高危漏洞修复','防WEB应用系统密码破解'],exp:'防WEB应用系统密码破解是属于Web应用防火墙的功能，是需要收费的服务。参考链接：https://help.aliyun.com/knowledge_detail/53966.html'},
  {id:223,type:'single',answer:'A',stem:'实例启动模板可用于快速创建ECS实例，模板中包含了用户自主选择的用于创建实例的配置信息，所有配置为可选，能够满足不同场景的个性化需求。下列选项中不属于实例启动模板可包含的配置信息。',opts:['密码','RAM角色','实例类型','密钥对'],exp:'实例启动模板是一项持久化ECS实例配置的功能，可用于快速创建实例。实例启动模板中包含了用于创建实例的配置信息，可以存储除了密码以外的任意配置信息，包括密钥对、RAM角色、实例类型和网络设置等。'},
  {id:224,type:'single',answer:'D',stem:'安全大屏将安全攻防数据转换并呈现到安全大屏上，秒级更新实时数据，可实时展现资产、漏洞、基线情况，以下关于安全大屏的描述，错误的是',opts:['安全大屏支持展示资产、漏洞、基线、告警、安全运营、业务运营和云平台配置检查相关的数据','为满足不同业务领域展示不同场景数据的需要，安全大屏支持自定义场景','荷鲁斯之眼提供云上资产安全态势全景、网络拓扑和安全风险处理入口，帮助用户统一管控云上资产进行安全运营','为保证访问安全，大屏不能直接免密访问，可单击免登配置创建大屏免登地址，方便用户在不登录云安全中心控制台的情况下直接通过免登链接打开安全大屏页面'],exp:'安全大屏可设置免密访问，通过单击免登配置创建大屏免登地址，用户能在不登录云安全中心控制台时直接通过免登链接打开，D选项描述错误。'},
  {id:225,type:'single',answer:'A',stem:'阿里云负载均衡SLB实例中的后端服务器ECS实例需要设置权重，可以给对外服务能力更强的ECS实例设置更大的权重，这些ECS实例就会有机会处理更多的访问请求。在提供稳定服务的同时，充分的利用了已有资源。如果将一台ECS实例的权重设置为O，以下说法正确的是',opts:['该ECS实例不会再得到负载均衡SLB实例分发的外部访问请求','所有外部访问请求都被分发到这台ECS实例上','该ECS实例会被认为状态异常，负载均衡SLB会把它移出后端服务器池','负载均衡SLB会分发外部请求给这台ECS实例，分发量的大小等于总请求数除以后端服务器ECS实例个数'],exp:'将负载均衡后端 ECS 的权重置零，新发起的业务请求是无法经负载均衡转发到该服务器的，健康检查相应的会显示异常。所以该ECS实例不会再得到负载均衡SLB实例分发的外部访问请求。参考链接：https://help.aliyun.com/knowledge_detail/39492.html'},
  {id:226,type:'single',answer:'C',stem:'在创建ECS实例后，如果需要更换ECS实例的操作系统，用户可以通过更换系统盘来更换操作系统。用户进行更换系统盘操作后，下列选项中不一定发生的是',opts:['旧系统盘会被释放','系统盘ID会更新','原系统盘自动快照被自动删除','原自动快照策略失效'],exp:'您手动创建的快照不会被释放，这些快照仍可以创建自定义镜像。如果旧系统盘设置了自动快照随磁盘释放，则自动快照会被自动删除。 旧系统盘上应用的自动快照策略自动失效'},
  {id:227,type:'single',answer:'B',stem:'多用户将系统迁移上云时，期待能够大幅度节约成本，但是，在上云的过程中，导致最终的云上成本大于线下每年的平摊成本。对导致该现象的的原因分析，正确的是',opts:['线下很多库是单机库，到云上釆用的是RDS高可用版本，相对来说成本会増加','计算成本时，只计算了购买/租用设备的成本，忽略了线下的维护成本、人员成本、机房和电力成本等等','线下使用的虚拟化方案由于采用超额预定，在同等效果下，比云服务器的资源利用率更高','云服务器的配置完全按照云下配置1:1选型，实际利用率较低，不符合云上架构最佳实践'],exp:'云计算成本管理。迁移至云环境时，成本计算需考虑整体拥有成本（TCO）。题干现象通常源于忽略线下隐性成本，如维护、人力、基础设施等。选项B直接指出片面计算设备成本的问题，与云计算成本评估原则一致。其他选项描述技术因素但非题干核心原因。参考《云计算架构设计与实施》中TCO分析章节。'},
  {id:228,type:'single',answer:'D',stem:'某客户的业务是抢票应用服务，业务系统全部放在了阿里云中，使用了阿里云的ECS实例和RDS实例，现客户想要对磁盘使用率和CPU使用率以及使用的云产品做一个监控，并且可以在业务高峰期时收到预警，如果是阿里云的运维人员可以建议客户使用来实现。',opts:['阿里绿网','CDN','SLB','云监控'],exp:'云监控是阿里云提供的全方位资源监控服务，可实时采集ECS实例的CPU使用率、磁盘使用率等指标，并支持设置阈值告警，在业务高峰期自动推送预警通知，满足客户对云产品使用情况的监控与告警需求。'},
  {id:229,type:'single',answer:'B',stem:'在OSS中，用户操作的基本数据单元是Object，Object中不包含哪个元素?',opts:['Key','id','meta','data'],exp:'对象是 OSS 存储数据的基本单元，也被称为 OSS 的文件。对象由元信息（Object Meta），用户数据（Data）和文件名（Key）组成。'},
  {id:230,type:'single',answer:'C',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。在OSSBucket中所有元素都是以来存储的。',opts:['key','value','object','bucket'],exp:'Bucket中所有元素都是以对象（也可以叫文件、Object）来存储的。参考链接：https://help.aliyun.com/document_detail/31817.html'},
  {id:231,type:'single',answer:'B',stem:'作为架构师，您在给某公司设计架构方案，首先手机APP客户端的请求最终使用云服务器ECS实例来进行处理，其次使用负载均衡SLB实例来做流量分发，使得后台各台ECS实例的负载大致均匀，为了应对业务量的大幅波动(周末访问量比较大)，您还建议他们使用弹性伸缩(AutoScaling)动态的增加或减少计算资源。他们对您的方案比较满意，作为一个特别看重用户体验的创业型公司，他们有一个比较担心的问题:在后端云服务器ECS实例相对空闲时，可能会触发减少ECS实例的伸缩活动，这时候运行在即将移出伸缩组的ECS实例上的应用会被终止，那么发起这些应用的用户的体验会变差。您应该向客户推荐以下哪种解决方法来消除客户的后顾之忧？',opts:['弹性伸缩中， 伸缩组对应的伸编配置使用的自定义镜像里存放执行脚本，井设置命令在操作系统关机时自动执行该脚本，其中该脚本中存放了此种状况下的处理逻辑','在负载均衡SLB实例的后端服务器池中，找到将要被移出的ECS实例，自动设定该ECS实例的权重为0，则该实例将不会被分到新的请求，在处理完成已有的需求后，将被自动移出后端服务器池','在负载均街SLB实例的后端服务器池中，找到将要被移出的ECS实例，手工将该实例从后端服务器池中移出，则正在此ECS实例上运行的应用会正常返回结果，但是不会再被分到新的请求','在负载均衡SLB实例中，开启后端服务器的数据同步选项，同时开启后端服务器的应用漂移选项，则在伸缩活动将某台EC S实例从伸缩组中移走时，其上的数据和正在运行的应用将由同个伸缩组中的另-台ECS实例接管'],exp:'ECS实例的权重为0，则该实例将不会被分到新的请求，在处理完成已有的需求后，将被自动移出。'},
  {id:232,type:'single',answer:'B',stem:'SLB是将访问流量根据转发策略分发到后端多台云服务器（ECS实例）的流量分发控制服务。下列关于SLB说法错误的是？',opts:['SLB的服务能力与后端ECS的公网宽带规格无关','同一组ECS不可以搭建多个网站并同时进行负载均衡','在使用SLB的过程中随时调整后端ECS的数目','不同操作系统的ECS可以同时做为SLB服务的后端服务器'],exp:'同一组ECS可以同时搭建多个网站并进行负载均衡。'},
  {id:233,type:'single',answer:'A',stem:'某公司有一个阿里云官网账号，并通过此账号申请使用了阿里云的负载均衡SLB实例，公司的账号的管理员创建了子账号，并将负载均衡SLB实例的只读权限授予该子账号，该子账号的拥有者可以查看SLB服务，但是无法对其进行修改。上述授权操作使用了阿里云的 选项：',opts:['RAM (Resource Access Management)','资源编排','DAC（Discretionary Access Control）','MAC（Mandatory Access Control）'],exp:'提及到"子账号"，所以需要通过阿里云的RAM (Resource Access Management) ，即用户身份管理与资源访问控制服务。参考链接：https://help.aliyun.com/document_detail/28627.html'},
  {id:234,type:'single',answer:'B',stem:'阿里云对象存储OSS出于安全考虑，直接在浏览器地址栏输入OSS通信域名(oss.aliyuncs.com)，如访问：http://bucketname.oss.aliyuncs.com/a.jpg(文件类型包括：txt、html、htm、图片格式、视频格式、音频格式等安全敏感文件)，均限制在浏览器客户端以“另存为”下载的方式打开文件。若需要直接在浏览器打开这类文件，需要如何配置？',opts:['在OSS的安全管理菜单中修改ACL，允许浏览器直接访问，设置时需要短信验证','绑定用户自定义的域名（可以是三级域名）','在OSS管理控制台-->Object管理中，修改文件的HTTP头信息','OSS不直接提供这样的功能，需要二次开发'],exp:'如果您使用OSS自带域名，如http://bucketname.oss.aliyuncs.com/objcet访问静态文件时（文件类型包括：txt、html、htm、图片格式、视频格式、音频格式等），均限制在浏览器中以“另存为”下载的方式打开文件，而不能直接浏览该文件。因此您需要将自定义的域名访问绑定在属于自己的Bucket上面，即CNAME。域名绑定成功后，为了使用域名正常访问 OSS，还需要添加 CNAME 记录指向存储空间对应的外网域名。参考链接：https://www.alibabacloud.com/zh/getting-started/projects/host-a-static-website-on-oss'},
  {id:235,type:'single',answer:'A',stem:'阿里云弹性伸缩(Auto Scaling)是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务，必须和配合使用。',opts:['云服务器ECS','云数据库RDS','云监控','块存储'],exp:'阿里云弹性伸缩服务必须与云服务器 ECS 配合使用，因为弹性伸缩的核心功能是根据负载自动增加或减少 ECS 实例数量，以实现计算资源的动态调整。其他选项如云数据库 RDS、云监控和块存储虽可作为辅助组件，但不具备直接承载伸缩实例的能力。'},
  {id:236,type:'single',answer:'C',stem:'以下安全事件是不能由阿里云态势感知集中管理的。',opts:['发现主机有异常进程','发现主机成为肉鸡','机房断电','发现网站被DDoS攻击成功'],exp:'机房断电是态势感知不能预测到的故障。'},
  {id:237,type:'single',answer:'D',stem:'关于OSS域名绑定描述正确的是',opts:['OSS域名绑定（CNAME）功能目前仅支持OSS以二级域名访问方式进行绑定。','OSS域名绑定时的访问方式为（Bucket name）.${zone}.aliyuncs.com','OSS cname绑定的域名必须经过阿里云备案','以上都不对'],exp:'OSS域名绑定（CNAME）功能目前仅支持OSS以三级域名访问方式进行绑定。即您的OSS访问方式为（Bucket name）.${region}.aliyuncs.com。OSS cname绑定的域名不是必须经过阿里云备案而是必须经过工信部的备案。参考链接：https://help.aliyun.com/knowledge_detail/39614.html'},
  {id:238,type:'single',answer:'A',stem:'阿里云弹性伸缩(Auto Scaling)中，可以配置伸缩规则来定义具体的扩展和收缩操作。以下是伸缩规则。',opts:['加入或移出3个云服务器ECS实例','配置周期性任务，每天13:00点定时触发','自动创建云服务器ECS实例时，使用的配置以及镜像','是否将不健康的云服务器ECS实例移出'],exp:'伸缩规则（Scaling Rule）定义了具体的扩展或收缩操作，例如加入或移出N个实例。'},
  {id:239,type:'single',answer:'A',stem:'如果您在创建Windows操作系统的阿里云的云服务器ECS实例时选择了数据盘，在登录实例后要完成操作才可以正常使用该数据盘。',opts:['格式化数据盘','挂载数据盘','对数据盘进行多分区配置','不需要任何操作'],exp:'如果在创建Windows实例时配了数据盘，您需要先格式化并分区数据盘后才能正常使用数据盘。参考链接：https://help.aliyun.com/document_detail/25418.html'},
  {id:240,type:'single',answer:'A',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。如果您有一个网站是纯静态页的，或者是对某复杂网站做过动静分离，您可以直接将静态网页通过OSS提供服务，不仅如此，OSS还可以与产品结合起来提供加速服务。',opts:['内容分发网络CDN','云服务器ECS','高性能计算 HPC','专有网络 VPC'],exp:'题目是说到了加速服务。所以需要通过内容分发网络CDN来实现。'},
  {id:241,type:'single',answer:'C',stem:'阿里云的云服务器ECS实例的安全组实现了类似虚拟防火墙的功能，用于设置单个或多个云服务器ECS实例的网络访问策略。对于云服务器安全组使用的说法正确的是',opts:['每个ECS实例只能属于一个安全组','每个ECS实例可以加入多个安全组，无数量上限','ECS实例必须加入安全组','ECS实例可以不加入安全组'],exp:'每个ECS实例最多可以加入 5 个安全组，且ECS至少加入一个安全组、https://help.aliyun.com/knowledge_detail/87018.html?spm=5176.2000002.0.0.14222621oEcXv4'},
  {id:242,type:'single',answer:'A',stem:'下列关于SLBAPlServerCertificate的说法错误的是',opts:['一次可以上传多份证书','证书和PrivateKey一定要对应','一次只能上传一个PrivateKey','返回结果为成功或者错误码'],exp:'目前使用UploadServerCertificate接口一次只能上传一份服务器证书和对应的私钥。参考链接：https://help.aliyun.com/document_detail/104125.html?spm=a2c4g.11186623.6.1285.6d946f7dZr67Du'},
  {id:243,type:'single',answer:'D',stem:'某用户为其SLB实例的一个HTTP监听配置了多条域名转发策略，包括：精确域名：www.aliyun.com,精确域名：market.aliyun.com，泛域名：*.aliyun.com，泛域名：*.market.aliyun.com,已知当前某个请求访问域名为info.market.aliyun.com，该条请求匹配的域名转发对应',opts:['精确域名：www.aliyun.com，','精确域名：market.aliyun.com','泛域名：*.aliyun.com','泛域名：*.market.aliyun.com'],exp:'域名转发策略匹配规则中，精确域名优先级高于泛域名，泛域名之间更长的前缀更优先。访问域名info.market.aliyun.com未命中精确域名market.aliyun.com，但符合泛域名*.market.aliyun.com的规则。相比*.aliyun.com，*.market.aliyun.com前缀更长、更具体，优先匹配。参考阿里云SLB文档关于域名转发策略优先级说明，当多个泛域名存在时，更长的子域名泛域名优先。'},
  {id:244,type:'single',answer:'B',stem:'在跨国公司在美国硅谷和中国上海均有办公点，且该跨国公司在美国（硅谷)和华东2（上海)地域分别创建了VPC1和VPC2，并在两个VPC中部署了应用系统。因业务发展，需要美国硅谷的两个办公点、中国上海的两个办公点、VPC1、VPC2全互通（已知业务之间数据日传输量在100M以内)。如果你是阿里云产品经理，你会建议用户采用的最为高效经济的方案是',opts:['使用高速通道对办公地点和VPC进行数据打通','使用VPN连接办公地点与所在地VPC，将两个VPC加载到同一云企业网中','为VPC内的ECS实例绑定弹性公网IP，办公点与VPC以及VPC间通过公网访问','为VPC网络搭配负载均衡服务，配合云解析实现网络流量互访'],exp:'您可以通过云企业网实现任意两个地域下的网络实例互通，例如使北京地域VPC与杭州地域VPC互通。您首先需要创建一个云企业网实例，然后将要互通的网络实例（专有网络和边界路由器）加载到云企业网实例，再购买一个带宽包，设置跨地域互通带宽即可。 https://help.aliyun.com/document_detail/68503.html?spm=a2c4g.11186623.6.554.1a4a13cfBYHbGA'},
  {id:245,type:'single',answer:'A',stem:'与传统的软件运行和维护模式相比，云计算要求硬件资源和软件资源能够更好地共享，任何一个企业用户都能够按照自己的需求对SaaS软件进行客户化配置而不影响其他用户的使用。云计算环境中能够满足上述需求的技术是',opts:['多租户技术','计算资源隔离技术','VPC技术','CDN技术'],exp:'简单说就是充分利用计算机资源，将资源共享给多个需要租用的用户，且每个用户之间数据是隔离的。参考链接：https://www.cnblogs.com/pingfan21/p/7478242.html'},
  {id:246,type:'single',answer:'C',stem:'某大型互联网公司，原来的业务都运行在物理机上，并且有自建的监控和报警系统，最近准备把一部分业务迁到阿里云上，并通过云监控来监控云服务器ECS实例并设置报警。用户需要才能快速将云监控现有的报警通知对接到自建的报警系统，并在自建的报警系统中综合处理物理机和云服务器ECS实例的报警信息。',opts:['无法实现','使用云监控提供的事件订阅功能，从消息队列消费报警信息','调用云监控提供的查询数据的接口，定时查询，然后自己写code判断指标是否异常','调用查询旺旺信息的API，获取发送到旺旺的报警通知'],exp:'题目中说了需要"在自建的报警系统中综合处理物理机和云服务器ECS实例的报警信息"，所以需要通过云监控提供的API接口获取指定的指标数据。'},
  {id:247,type:'single',answer:'D',stem:'您所在的公司半年前在自建机房内刚刚构建了一套财务系统，计划上线的客户管理系统准备基于阿里云的产品构建，同时财务系统与客户管理系统之间需要通过内网互联互通，方案可以最大限度的使用已有的系统投资并满足新的业务需求。',opts:['基于经典网络的云产品实例构建客户管理系统，结合专线来实现两个系统之间的内网互联互通','基于阿里云专有网络VPC购买云产品实例来构建客户管理系统，不需要任何额外的操作，就可以直接实现两个系统的安全内网互联','将财务系统迁移到阿里云上','基于阿里云专有网络VPC购买云产品实例来构建客户管理系统，结合专线或者VPN，实现两个系统之间的内网互联互通'],exp:'划重点：同时财务系统与客户管理系统之间需要通过内网互联互通，就是阿里云连接传统机房IDC，可以选择专线或者VPN连接。'},
  {id:248,type:'single',answer:'B',stem:'小张管理的网站选择部署在阿里云的云服务器ECS实例上，最近发现一个现象，网站首页的宣传视频在某些区域播放速度良好，但是在其它地区播放速度很慢。为了解决此问题，你会选择阿里云产品。',opts:['负载均衡SLB','内容分发网络CDN','云数据库RDS','对象存储OSS'],exp:'题目中遇到的问题是在某些区域播放良好，但是在其他地区播放较差，所以需要内容分发网络CDN来解决其他地域访问速度慢的问题。'},
  {id:249,type:'single',answer:'A',stem:'某在线教育网站是基于云服务器ECS+负载均衡SLB+弹性伸缩（AutoScaling）的方案实现的，在保证系统稳定、客户体验良好的前提下，大大节省了资源成本和运维成本。现在他们想把用户的访问信息（如来源IP、访问页面URL等)保存分析，以下错误的是',opts:['伸缩组中的每台ECS实例，均保存各自处理的用户访问信息，这些ECS实例上的数据随时可以访问、分析，这种方案简单高效、稳定可靠，同时节省成本','将用户相关的访问信息实时或者准实时的同步到对象存储OSS中，供后续使用','将用户相关的访问信息实时或者准实时的保存到云数据库RDS MySQL版中去，后续的查询、分析均通过RDS实现','将用户相关的访问信息实时或者准实时的同步到云数据库Memcache版（原OCS）中去，后续通过应用访问OCS，或者按照一定规则将OCS中的数据持久化，然后使用持久化后的数据'],exp:'因为涉及到多台ECS且将ECS挂载到到了负载均衡的后端，上云最佳实践中，不能在每台ECS中各自保存用户的访问信息，这样会导致之后的请求的数据不同步，最佳的解决方案是将用户的信息保存到统一的云产品（比如云数据库RDS）中，所有的ECS都通过该云产品来调用访问用户信息。'},
  {id:250,type:'single',answer:'C',stem:'阿里云的云盾数据风控是通过领先的行为收集技术和机器学习模型，解决账号、活动、支付等关键业务环节存在的欺诈威胁，最终实现降低企业损失。该项服务是基于阿里巴巴的能力开发的。',opts:['BGP网络','弹性计算','大数据风控','DDoS攻防经验'],exp:'云盾数据风控是基于阿里大数据风控服务能力，通过领先的行为收集技术和机器学习模型，解决账号、活动、支付等关键业务环节存在的欺诈威胁，降低企业经济损失。'},
  {id:251,type:'single',answer:'B',stem:'D公司在线视频业务全国排名前五，整个业务系统全部建设在阿里云之上，使用的云产品有云服务器ECS、对象存储OSS、内容分发网络CDN。最近发现有黑客恶意下载公司的正版视频，在国外社区里分发。假设你是D公司的系统管理员，从技术上可以如何解决这个问题？',opts:['启用阿里云CDN的IP黑名单功能','启用阿里云CDN的URL鉴权功能','启用阿里云OSS的Refer黑名单功能','启用云服务顺的安全组功能'],exp:'划重点：公司使用了CDN，黑客恶意下载公司的正版视频。所以需要对CDN的访问进行保护，但是题目中并不知道黑客的具体IP或者某一段IP，知道具体IP的话可以直接把具体IP或者这段IP加入黑名单，所以只能需要采用CDN的URL鉴权功能防止在社区在分发的问题。'},
  {id:252,type:'single',answer:'A',stem:'使用阿里云的负载均衡SLB实例时，可以通过健康检查来判断后端云服务器ECS实例的可用性。针对4层服务务（TCP协议），负载均衡SLB实例通过来判断云服务器ECS实例是否可用。',opts:['端口检查是否超时','云服务器ECS实例的服务器端返回的报文内容中的特殊字符','云服务器ECS实例的服务器端返回的状态码','云服务器ECS实例的服务器端返回的字节数'],exp:'四层是检查端口，七层是检查服务器端返回的状态码。'},
  {id:253,type:'single',answer:'C',stem:'C公司是一个互联网金融创业企业，自去年下半年开始公司上线的P2P理财项目规模增长了500倍，日参与融资和理财的客户数量超过8万人。一边是业务规模快速增长，一边是用户体验停滞不前。经过架构师团队仔细评估后。C公司可以选择阿里云的产品组合解决这两个问题。',opts:['阿里云的云解析和内容分发网络CDN','阿里云的云解析和对象存储OSS','阿里云HTTPDNS和内容分发网络CDN','阿里云HTTPDNS和对象存储OSS'],exp:'HTTPDNS 是面向移动开发者推出的一款域名解析产品，具有域名防劫持、精准调度等特性。主要是用在客户端的时候请求URL防止域名劫持的情况。参考链接：https://help.aliyun.com/document_detail/30102.html'},
  {id:254,type:'single',answer:'B',stem:'阿里云的云服务器ECS实例的快照是指某一个时间点上某一块磁盘的数据拷贝。下列关于云服务器ECS实例快照的说法错误的是',opts:['用户可以手动创建快照和也可以设置自动快照策略','可以保留自动快照到用户自己的OSS Bucket中','系统盘和数据盘都可以制作快照','云服务器ECS实例到期后或手动释放磁盘时，手动创建的快照不会同时释放'],exp:'自动快照是保存在OSS里面，但是是保存在独立于用户自己的OSS Bucket里面，而不是用户的Bucket里面。参考链接：https://help.aliyun.com/knowledge_detail/52045.html'},
  {id:255,type:'single',answer:'A',stem:'某视频公司的服务部署在阿里云的云服务器ECS上，春晚或每周五热门节目来临时，如临大敌，又不想长期采购大量的云服务器ECS实例提供服务，可以采用阿里云提供的产品来低成本地解决这个问题。',opts:['弹性伸缩Auto Scaling','表格存储','专有网络VPC','对象存储OSS'],exp:'题目中要求需要解决，春晚或每周五服务器压力比较大的问题，但是又不想长期采购云服务器ECS，所以可以通过弹性伸缩来解决上述问题。'},
  {id:256,type:'single',answer:'B',stem:'某用户的业务系统搭建在云上，由ECS实例对外提供服务，为了应对业务系统的突发流量，该用户还开通了弹性伸缩服务。已知架构中某一台ECS实例承载了关键业务，为保证业务正常运行，该用户开启了实例释放保护。下列选项中，不会释放掉该ECS实例。',opts:['实例达到自动释放时间','用户手动释放','账号欠费超过15天','实例由弹性伸缩自动创建，在缩容时被移出伸缩组'],exp:'实例释放保护不能阻止因合理原因自动执行的释放行为，包括但不限于： 账号欠费超过15天，实例被自动释放。 实例设置了自动释放时间，到期后被自动释放。 实例存在安全合规风险，被停止或释放。 实例由弹性伸缩自动创建，在缩容时被移出伸缩组并释放。'},
  {id:257,type:'single',answer:'C',stem:'阿里云的云盾会检查通过公共互联网登录云服务器ECS的来源IP，登录方式包括SSH和远程桌面，当来自某个IP的登录请求出现多次密码错误的情况时，会发出“ECS遭遇密码暴力破解”的报警，当收到这个报警后，最安全的处理方法应该是',opts:['通知自己业务平台的所有用户立即修改密码，并通过技术手段杜绝简单密码','这个报警无关紧要，可以忽略','立即更新云服务器ECS实例的系统用户的密码，并启用安全组防火墙，只允许特定IP连接ECS实例','立即登录云服务器ECS实例，检查登录日志，如果没有异常登录成功的记录，可直接忽略'],exp:'当某个IP的尝试多次登录云服务器ECS的时候，为了防止密码被破解，建议立即修改云服务器ECS的密码，并启动安全组防火墙，只允许特定IP登录该ECS。'},
  {id:258,type:'single',answer:'A',stem:'ECS的更换系统盘是指为ECS实例重新分配一块系统盘，系统盘ID会更新，旧系统盘会被释放。系统盘的、实例IP地址以及弹性网卡MAC地址保持不变。',opts:['云盘类型','系统类型','原有业务','原系统盘存在的数据'],exp:'在ECS更换系统盘的过程中，会重新分配系统盘，系统盘ID更新且旧盘释放，但云盘类型不会改变，实例IP地址和弹性网卡MAC地址也保持不变。而系统类型可能会因更换不同操作系统而改变；原有业务会因系统盘更换受到影响；原系统盘存在的数据在更换后一般不复存在（除非提前备份迁移）。所以正确答案是A'},
  {id:259,type:'single',answer:'A',stem:'存储空间名称规范的是',opts:['12-test','#REF!','Test-12','12Test-'],exp:'所选定的存储空间名称在阿里云OSS的所有现有存储空间名称中必须具有唯一性。 只能包括小写字母、数字和短划线（-）。 必须以小写字母或者数字开头和结尾。 长度必须在3~63字节之间。'},
  {id:260,type:'single',answer:'A',stem:'在阿里云的专有网络VPC中，是用于连接VPC内的各个交换机的设备。',opts:['路由器','路由表','云服务器ECS','负载均衡SLB'],exp:'路由器（VRouter）是专有网络的枢纽。作为专有网络中重要的功能组件，它可以连接VPC内的各个交换机，同时也是连接VPC和其他网络的网关设备。每个专有网络创建成功后，系统会自动创建一个路由器。每个路由器关联一张路由表。 详细信息，请参见路由表概述。 参考链接： https://helpcdn.aliyun.com/document_detail/34217.html'},
  {id:261,type:'single',answer:'C',stem:'下列关于SLB说法错误的是',opts:['不同操作系统的ECS可以同时做为SLB服务的后端服务器','SLB的服务能力与后端ECS的公网宽带规格无关','同一组ECS不可以搭建多个网站并同时进行负载均衡','在使用SLB的过程中随时调整后端ECS的数目'],exp:'同一组ECS可以同时搭建多个网站并进行负载均衡。'},
  {id:262,type:'single',answer:'A',stem:'执行伸缩规则、手动添加或移除已有ECS实例时，均会触发___实现扩容或收缩',opts:['伸缩活动','定时任务','告警任务','自动伸缩'],exp:'执行伸缩规则、手动添加或移除已有 ECS 实例时，均会触发伸缩活动实现扩张或收缩。伸缩活动是弹性伸缩服务中执行实例增减操作的基本单元，任何触发伸缩行为的指令都会生成并执行一个伸缩活动，是系统响应伸缩需求的直接机制。'},
  {id:263,type:'single',answer:'D',stem:'阿里云的云盾具备不同级别的DDoS防护产品，当有DDoS攻击的情况下，业务可用性需要保持在99.9%以上时，最适合使用的产品是',opts:['DDoS基础防护','安全管家','态势感知','DDoS高防IP'],exp:'阿里云云盾产品中，DDoS高防IP专为应对大规模DDoS攻击设计，提供T级防护能力，通过流量清洗确保业务可用性。DDoS基础防护默认阈值较低，难以应对高流量攻击；安全管家侧重安全服务，态势感知用于威胁分析，均非直接防护。题目要求99.9%可用性对应高防场景，需高防IP的强力清洗能力。《阿里云官方文档》明确高防IP适用于保障业务连续性，符合题干需求。选项D满足防御要求。'},
  {id:264,type:'single',answer:'B',stem:'想要实现同一个阿里云账号下的不同云服务器ECS实例之间的网络访问控制，可以通过阿里云管理控制台提供的功能实现。',opts:['云盾','安全组','绿网','防火墙'],exp:'题目中说不同云服务器ECS实例之间的网络访问控制，注意是网络访问控制，所以需要通过安全组来实现。'},
  {id:265,type:'single',answer:'C',stem:'您已经有一台运行状态的云服务器ECS实例，并完成了所需的应用软件的部署。如果您希望创建一个部署同样软件的新的云服务器ECS实例，可以采用以下方式最高效地获得。',opts:['基于现有的云服务器ECS实例的系统盘制作快照，并基于该快照生成新的云服务器ECS实例','直接生成一台新的云服务器ECS实例，并进行所需软件的部署','基于现有的云服务器ECS实例的系统盘制作自定义镜像，并基于该自定义镜像生成新的云服务器ECS实例','上传本地制作好的镜像，并基于该镜像创建一台新的云服务器ECS实例'],exp:'题目中说需要创建一个部署同样软件的新的云服务器ECS实例，所以需要通过制作镜像来实现快速复制，'},
  {id:266,type:'single',answer:'D',stem:'下列关于ECS连接实例的说法错误的是',opts:['Windows 2008默认允许最多2个session远程连接','可以通过两种方式连接和管理用户实例：远程连接客户端和阿里云ECS控制台','Linux或Mac OS X环境连接Linux实例，直接使用ssh命令','如果用户使用远程连接的工具访问ECS实例，使用公网和私网IP的实例都能被远程连接'],exp:'用户使用远程连接工具访问ECS实例，只有在ECS开通公网的情况才能访问。只有用户在阿里云的控制台上，才能实现题目中的使用公网和私网IP的实例都能被远程连接。'},
  {id:267,type:'single',answer:'D',stem:'弹性伸缩服务使用户可以根据业务需求和策略设置伸缩规则，适合业务量不断波动的应用程序。关于弹性伸缩服务，下列说法不正确的是',opts:['不支持纵向扩展','ECS实例上的应用必须是无状态井且可横向扩展的','伸缩组内ECS不适合保存会话记录、应用数据、日志等信息','不支持自动在RDS访问白名单中添加或移除ECS实例的IP'],exp:'自动添加ECS实例到负载均衡实例的后端服务器和RDS实例的访问白名单中。 https://help.aliyun.com/document_detail/25857.html?spm=a2c4g.11174283.6.544.6bfb73004Jdx96'},
  {id:268,type:'single',answer:'C',stem:'您在阿里云的云服务器ECS实例的使用中，要创建新的安全组规则时，不可以规定类型的授权。',opts:['IP授权','端口授权','MAC授权','安全组授权'],exp:'安全组规则是不支持MAC授权的。'},
  {id:269,type:'single',answer:'A',stem:'弹性公网IP（ElasticIPAddreSS，简称EIP），是可以独立购买和持有的公网IP地址资源，能动态绑定到不同的ECS实例上，绑定和解绑时无需停机。下面关于弹性公网IP说法错误是哪个？',opts:['弹性公网 IP可以绑定在任意规格的云服务器ECS实例上；','1个弹性公网IP只能绑定到 1 个 ECS 实例上；','弹性公网IP只能绑定在相同地域的VPC类型的云服务器ECS实例上；','要绑定弹性公网IP的ECS实例必须处于运行中或停止状态。'],exp:'通用限制 每个账号最多可申请20个EIP，如果您需要更多的EIP，请提交工单申请。 只有可用状态的EIP才能够进行绑定操作。 EIP绑定成功后立刻生效。 一个EIP同一时间只能绑定在一个资源上。 因安全原因被锁定的EIP无法进行绑定和解绑操作。 绑定ECS实例限制 ECS实例的网络类型必须是专有网络。 ECS实例的地域必须和EIP的地域相同。 ECS实例必须处于运行中或停止状态。 ECS实例没有配置固定公网IP或绑定其他EIP。 一个资源实例只能绑定一个EIP。 绑定NAT网关限制 NAT网关的所属账号在2017年11月3日前没有购买过NAT带宽包。 NAT网关的地域必须和EIP的地域相同。 一个NAT网关最多可以绑定20个EIP。 绑定SLB实例限制 SLB实例的网络类型必须是专有网络。 SLB实例的地域必须和EIP的地域相同。 一个SLB实例只能绑定一个EIP。'},
  {id:270,type:'single',answer:'B',stem:'阿里云对象存储OSS是按使用量收费的服务，为了防止用户在OSS上的数据被其他人盗链而产生不必要的支出，OSS设计了防盗链功能，以下有关OSS防盗链实现机制的说法正确的是',opts:['基于IP黑、白名单机制','基于HTTP header中表头字段referer实现','基于HTTP的Authorization实现','基于SSL密钥实现'],exp:'对象存储OSS的防盗链是基于HTTP或HTTPS header中包含Referer字段来实现的。参考链接：https://help.aliyun.com/document_detail/32021.html'},
  {id:271,type:'single',answer:'C',stem:'如果您不再需要某个阿里云的按量付费的云服务器ECS实例，可以将其释放。关于按量付费的实例释放的操作中，错误的是',opts:['您可以再次设置自动释放的时间并覆盖前一次的设置','通过定时释放设置为您的按量付费实例安排释放计划，选择一个未来的时间释放资源','不可以随时释放按量付费的实例','可以立即释放该按量付费的实例'],exp:'自动释放时间可以多次设置，且随时可以取消之前的设置，实现随时释放按量付费的实例。'},
  {id:272,type:'single',answer:'B',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。在安全性方面OSS服务本身具备了防DDoS攻击和自动黑洞清洗的功能，如果采用传统IT的解决方案，实现和OSS类似的防DDoS功能，需要做什么投入',opts:['只需要在存储服务器内安装特定的安全软件','需要购买专业的流量清洗和黑洞设备，同时按预期的防护能力购买相应的IDC入口带宽','购买多台存储服务器，同时启用，可实现相同级别的抗DDoS功能','专业的存储服务器都自带了防DDoS功能，无需客户购买'],exp:'题目问的是传统IT的解决方案需要实现防DDos功能，所以需要购买专业的流量清洗和黑洞设备，同时按预期的防护能力购买相应的IDC入口带宽。'},
  {id:273,type:'single',answer:'A',stem:'阿里云对象存储OSS为每个存储空间Bucket自动分配一个内网地址和一个外网地址，如果正确使用内网地址，一方面可以实现OSSBucket与云服务器ECS实例之间的流量免费，另一方面云服务器ECS实例通过内网访问OSSBucket的网络质量较好，能够有效的提升部署在ECS实例上的应用的上传和下载质量。以下关于OSSBucket内网地址的描述正确的是',opts:['如果ECS实例需要访问OSS Bucket的内网地址，只能访问与ECS实例在同一地域的Bucket','从公共云上的任意一台ECS实例都可以通过内网访问任何地域的OSS Bucket','只要ECS实例和OSS Bucket属于同一用户，ECS实例就可以通过内网访问OSS Bucket','如果ECS实例使用OSS Bucket内网地址，只能访问与ECS实例在同一地域且在同一可用区的OSS Bucket'],exp:'ECS需要通过内网访问OSS的Bucket的话，需要和此Bucket处于同一地域。'},
  {id:274,type:'single',answer:'C',stem:'题干：274/1023、阿里云的云盾DDoS高防IP是阿里云在“基础DDoS防护”之上提供的高级防护产品，支持四层和七层的抗攻击能力，以下关于云盾DDoS高防IP的功能描述错误的是',opts:['防护多种DDoS类型攻击，包括但不限于以下攻击类型 ICMP Flood、UDP Flood、TCP Flood、SYN Flood、ACK Flood 等','支持弹性按天计费','DDoS防护阈值弹性调整，您可以随时升级更高级别的防护，调整过程服务中断时间不超过5分钟','提供实时精准的流量报表及攻击详情，让您及时准确获得当前服务详情'],exp:'调整DDoS防护阈值并不会导致服务的中断。'},
  {id:275,type:'single',answer:'D',stem:'以下对ECS的带宽临时升级操作的描述错误的是',opts:['支持在当前生命周期内，设定时间段区间内临时增加带宽','可以多次叠加操作，支持随时操作，不受任何操作影响','可以按天进行升级，升级后如如云服务器ECS续费，仍然按照原基础带宽进行续费','不支持按天升级，升级之后按升级之后的带宽进行续费'],exp:'ECS的带宽是带宽支持临时升级操作，但是临时升级只能升级到云服务的有效期的结束时间，所以在升级之后仍然按照升级之前的带宽进行续费。'},
  {id:276,type:'single',answer:'D',stem:'如果您在非阿里云的服务器上安装了云盾安骑士客户端，通过可以确保在您的管理控制台中能查到此服务器的相关报告。',opts:['报告无法在阿里云的管理控制台查看','通过阿里云官网帐号关联','非阿里云服务器不支持安骑士','在安装安骑士的过程中需要输入“安装验证key”，通过此Key关联用户的管理控制台'],exp:'安装“安骑士客户端”后，需要用在管理控制台生成的安装验证key与指定的阿里云官网帐号关联。参考链接：https://help.aliyun.com/document_detail/28457.html'},
  {id:277,type:'single',answer:'B',stem:'阿里云的云盾加密服务通过在阿里云上使用经国家密码管理局检测认证的硬件密码机，帮助用户满足数据安全方面的监管合规要求，保护云上业务数据的隐私性和机密性。云盾加密服务的密钥由负责保管。',opts:['阿里云的系统管理员','客户','客户和阿里云的系统管理员','阿里云的第三方合作伙伴'],exp:'客户通过VPN或专线接入VPC，使用USB Key对加密服务实例进行初始化并管理密钥。'},
  {id:278,type:'single',answer:'D',stem:'一个负载均衡实例是一个运行的负载均衡服务，用来接收流量并将其分配给后端服务器。要使用负载均衡服务',opts:['公司IP','EIP','数据盘','监听'],exp:'创建负载均衡实例后，您需要为实例配置监听。'},
  {id:279,type:'single',answer:'C',stem:'您希望在阿里云上构建一个安全隔离的网络环境，并且在这个网络环境中可以按自己的需求进行网络拓扑的设计和私网IP地址网段的划分，可以采用产品来满足这个需求。',opts:['弹性伸缩','高速通道','专有网络VPC','专线'],exp:'题目中问的是需要实现网络的拓扑的设计和私网IP地址网段的划分，所以需要通过专有网络VPC来实现。'},
  {id:280,type:'single',answer:'D',stem:'由于业务的流量增长，您需要对您的阿里云的包年包月的云服务ECS实例的带宽进行临时升级操作，以下的描述中错误的是_。',opts:['可以为ECS实例设定当月内指定时间段内的带宽临时增加','可以多次叠加操作临时升级操作','可以按天进行升级，升级后如果云服务器ECS实例下个月进行续费，仍然按照升级前的基础带宽进行续费','支持按天升级，升级后如果云服务器ECS实例下个月进行续费，按照升级后的带宽进行续费'],exp:'可以按天进行升级，升级后如果云服务器ECS实例下个月进行续费，仍然按照升级前的基础带宽进行续费'},
  {id:281,type:'single',answer:'A',stem:'阿里云的负载均衡SLB包含了几个主要的部分：来自外部的访问请求、Listener、LoadBalancer、BackendServer等，关于Listener的说法中正确的是',opts:['主要包括用户定制的负载均衡策略和转发规则','提供对外服务的ECS实例集合','是指负载均衡SLB实例','通过配置监控规则，可以生成负载均衡SLB实例的监控指标'],exp:'Listener：用户定制的监听器，定义了负载均衡策略和转发规则。参考链接：https://yq.aliyun.com/articles/311875'},
  {id:282,type:'single',answer:'A',stem:'阿里云的负载均衡SLB提供对多台云服务器进行流量分发的服务，支持四层和七层的流量转发。其中四层流量转发是通过实现的。',opts:['LVS','Nginx','Tengine','Heartbeat'],exp:'流量转发四层是通过LVS实现，七层是通过Tengine实现'},
  {id:283,type:'single',answer:'C',stem:'.打开云服务器管理控制台；2.找到对应的需要切换/迁移的云服务器；3.选择您所需的交换机，同时指定新交换机下的IP；4.修改云服务器的私网地址；',opts:['1，2，3，4','1，2，4，3','1，3，2，4','1，3，4，2'],exp:'题目问是的如何切换ECS的交换机，正确操作应该是从云服务器管理控制台后选择您所需切换的的交换机，同时指定新交换机下的IP。然后找到对应的需要切换/迁移的云服务器，修改云服务器的私网地址'},
  {id:284,type:'single',answer:'B',stem:'想要通过设置虚拟服务地址，将添加的同一地域的多台ECS实例虚拟成一个高性能、高可用的后端服务池，并根据转发规则，将来自客户端的请求分发给后端服务器池中的ECS实例，可以使用阿里云的来实现。',opts:['弹性伸缩AutoScaling','负载均衡SLB','云数据库RDS','内容分发网络SDN'],exp:'阿里云负载均衡SLB支持将同一地域的多台ECS实例组成后端服务器组，通过虚拟服务地址对外提供服务，并按照指定策略分发客户端请求。其作用包括流量分发、扩展应用服务能力、消除单点故障提升可用性。弹性伸缩用于自动调整计算资源，云数据库RDS属于关系型数据库服务，内容分发网络SDN主要用于加速内容传输。阿里云官方文档明确将SLB定义为实现流量分发的服务组件。选项B对应这一功能场景。'},
  {id:285,type:'single',answer:'B',stem:'创建专有网络后，可以通过创建交换机为专有网络划分一个或多个子网.同一专有网络内的不同交换机之间，云资源必须部署在交换机内，可以将应用部署在不同可用区的交换机，提高应用的可用性',opts:['互不干扰','内网互通','相互隔离','可以指定互通'],exp:'创建专有网络后，您可以通过创建交换机为专有网络划分一个或多个子网。同一专有网络内的不同交换机之间内网互通。 参考链接： https://help.aliyun.com/document_detail/65387.html?spm=a2c4g.11186623.6.568.717053235irWl8'},
  {id:286,type:'single',answer:'C',stem:'题干：286/1023、阿里云的弹性公网IP支持与云服务器ECS实例的动态绑定和解绑。下列关于弹性公网IP说法中错误的是 选项：',opts:['1个弹性公网IP只能绑定到1个ECS实例上','弹性公网IP不能绑定在经典网络的云服务器ECS实例上','弹性公网IP只能绑定在同一个地域的特定可用区的VPC类型的云服务器ECS实例上','弹性公网IP只能绑定在相同地域的VPC类型的云服务器ECS实例上'],exp:'题目问的是描述错误的选项，每个弹性公网IP只能绑定到同一地域的一个VPC网络的云产品实例上。不一定要求是在同一个可用区。'},
  {id:287,type:'single',answer:'A',stem:'实例启动自动模板可用于快速创建ECS实例，模板中包含了用户自主选择的用于创建实例的配置信息，所有配置为可选，能够满足不同场景的个性化需求。下列选项中不属于实例启动模板可包含的配置信息。',opts:['密码','RAM角色','实例类型','秘钥对'],exp:'实例启动模板是一项持久化ECS实例配置的功能，可用于快速创建实例。实例启动模板中包含了用于创建实例的配置信息，可以存储除了密码以外的任意配置信息，包括密钥对、RAM角色、实例类型和网络设置等。'},
  {id:288,type:'single',answer:'C',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，功能是阿里云SLB不支持的。',opts:['会话保持','健康检查','生命周期挂钩','域名URL转发'],exp:'负载均衡 SLB 支持会话保持、健康检查和域名 URL 转发，用于保障服务可用性与流量精准分发。生命周期挂钩是弹性伸缩服务的功能，用于在实例伸缩过程中执行自定义操作，不属于 SLB 的核心能力范畴。'},
  {id:289,type:'single',answer:'B',stem:'阿里云负载均衡SLB中提供了证书上传和管理的服务，在需要进行加密传输时，用户可以将证书上传到负载均衡SLB实例，在创建监听的时候绑定证书。证书是为了支持HTTPS协议。',opts:['HTTP','HTTPS','TCP','PPPoE'],exp:'绑定证书是为了满足加密传输的HTTPS要求。'},
  {id:290,type:'single',answer:'A',stem:'阿里云绿网是云盾体系内的业务防护模块，它的作用是保护网站内容的安全，提前发现不符合政策规定的信息。以下对绿网功能的描述最准确的是 选项：',opts:['自动判别文本内容和图片是否合规，支持API批量检测图片','只支持文本内容的识别','可以限制服务器对外访问的资源，防止ECS云主机中毒后破坏内容的完整性','用来限制访问ECS云主机的源IP，防止黑客篡改内容'],exp:'支持API批量检测图片和识别的文字，参考链接：https://help.aliyun.com/document_detail/70430.html'},
  {id:291,type:'single',answer:'C',stem:'您需要进行某台云服务ECS实例的磁盘快照的创建，只有该云服务器ECS实例处于状态下时才可以进行快照创建的操作。',opts:['启动中','创建中','运行中','停止中'],exp:'注意停止中和已停止的区别，根据实例创建快照时，实例必须处于 运行中 或 已停止 状态。参考链接：https://help.aliyun.com/document_detail/25455.html'},
  {id:292,type:'single',answer:'B',stem:'阿里云内容分发网络CDN系统能够实现内容加速的功能，需要智能DNS解析的支持，以下功能不是智能DNS解析系统具备的。 选项：',opts:['可以根据不同的访问者IP把同一个域名分别解析成不同的IP地址','智能DNS解析系统具备网页内容缓存的功能，用户首次访问时从源站抓取数据，之后的请求优先从缓存中读取','可以根据预先配置好的IP段位置信息，将用户请求指向离客户最近的服务器','如果用户在多个机房放置相同的镜像站点，可以让不同的地方客户访问不同的站点，实现负载均衡'],exp:'目前智能DNS解析是不支持网页内容缓存的功能的。参考链接：https://help.aliyun.com/document_detail/29730.html'},
  {id:293,type:'single',answer:'A',stem:'阿里云对象存储OSS的图片处理服务中，所有对图片的转换参数都会加在图片文件的URL后面，使URL变得冗长，不方便管理与阅读。为了简化操作，OSS图片处理服务提供了功能，可以将常见的转换参数保存起来多次使用。',opts:['样式','方案','短网址','管道'],exp:'对图片进行处理后，所有的操作都会以参数形式加在图片的URL之后，导致图片URL变得冗长，不便于管理与阅读。OSS的图片处理服务允许您将常见的操作保存为一个别名，即样式（Style）。利用样式功能，只需一个很短的图片URL就能实现对图片的复杂操作。参考链接：https://help.aliyun.com/document_detail/48884.html'},
  {id:294,type:'single',answer:'B',stem:'当客户开通云盾安骑士功能后经常能收到一些安全的报警信息，但是没有时间处理，为了避免安全风险的发生，客户还可以选择云盾的服务，让阿里云专业的工程师代为处理。',opts:['态势感知','安全管家','内容安全（原名：绿网）','DDoS高防IP'],exp:'安全管家有专业技术人员可以帮你运维机实例，参考链接：https://help.aliyun.com/document_detail/31742.html'},
  {id:295,type:'single',answer:'C',stem:'专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。以下关于VPC中交换机与其他组件的对应关系，错误的是',opts:['子网是与交换机绑定的','网络ACL是与交换机绑定的','安全组是与交换机绑定的','路由表是与交换机绑定的'],exp:'专有网络VPC中，交换机作为子网的载体，子网划分依赖于交换机。网络ACL作为子网级别的防火墙，直接关联到交换机控制出入流量。安全组作用于实例级别，而非交换机，用于管理单台ECS的流量。路由表则为交换机指定网络流量的转发规则。参考阿里云VPC文档，安全组与交换机无绑定关系。选项C描述错误。'},
  {id:296,type:'single',answer:'C',stem:'阿里云提供的安全产品云盾涵盖从网络、主机、应用、数据、图片识别、混合云到数字证书和业务风控、保险等多个子产品，遇到不同的风险时选择合适的产品可以做到事半功倍。当客户服务器经常遭受大流量的攻击，导致服务器无法正常对外提供服务时，选择产品进行防护最合适。',opts:['安全众测','WEB应用防火墙（WAF）','DDoS高防IP','安全管家服务','渗透测试','云安全中心'],exp:'划重点：客户服务器经常遭受大流量的攻击。所以需要通过配置DDoS高防IP，将攻击流量引流到高防IP，确保源站的稳定可靠。参考链接：https://help.aliyun.com/document_detail/28464.html'},
  {id:297,type:'single',answer:'A',stem:'跨站脚本攻击（Cross-site scripting，通常简称为XSS）可被用于进行窃取隐私、钓鱼欺骗、偷取密码、传播恶意代码等攻击行为。请问XSS攻击主要发生在 选项：',opts:['用户浏览器','WEB应用的服务器','数据库','缓存服务器'],exp:'XSS, 即为（Cross Site Scripting）, 中文名为跨站脚本, 是发生在目标用户的浏览器层面上的，当渲染DOM树的过程成发生了不在预期内执行的JS代码时，就发生了XSS攻击。参考链接：https://www.cnblogs.com/unclekeith/p/7750681.html'},
  {id:298,type:'single',answer:'D',stem:'您希望通过管理控制台进行阿里云的专有网络VPC内的云服务器ECS实例的私网IP地址的修改，但发现操作的菜单不可用，是原因引|起的。',opts:['该云服务器ECS实例没有绑定EIP','该云服务器ECS实例所在的VPC类型是默认专有网络','该云服务器ECS实例不是运行状态','没有针对该云服务器ECS实例进行停止操作，且该云服务器ECS实例不是停止状态'],exp:'修改云服务器ECS的私网IP地址需要云服务器ECS处于停止的状态，所以是"没有针对该云服务器ECS实例进行停止操作，且该云服务器ECS实例不是停止状态"的原因造成的。参考链接：https://help.aliyun.com/document_detail/27733.html'},
  {id:299,type:'single',answer:'A',stem:'使用阿里云的负载均衡SLB实例时，可以通过健康检查来判断后端云服务器ECS实例上的可用性。针对7层服务，负载均衡SLB实例的健康检查机制为：默认由负载均衡SLB实例向后端云服务器ECS实例的内网IP地址的应用服务器配置的缺省首页发起请求，如果返回1“200OK”，将认为后端云服务器ECS实例运行正常，否则视为运行异常。',opts:['http','ssh','telnet','ICMP'],exp:'7层服务的监控检查机制为由负载均衡SLB实例向后端云服务器ECS实例的内网IP地址的应用服务器配置的缺省首页发起HTTP请求，然后判断请求的返回码来进行健康检查操作，参考链接：https://help.aliyun.com/document_detail/98226.html'},
  {id:300,type:'single',answer:'A',stem:'WindoWs实例的系统盘由40GB扩容到100GB，确认扩容已经完成，计算机分区C显示大小99.9GB，但是可用空间（百分比)反而比之前更小。这个错误出现的原因是',opts:['虚拟内存被开启且设置的是系统自动管理','windows目前不支持在线扩容','更换系统盘错误','内存满板占满'],exp:'https://help.aliyun.com/knowledge_detail/150589.html?spm=5176.11065259.1996646101.searchclickresult.7c4197507kuSem'},
  {id:301,type:'single',answer:'D',stem:'当云服务器ECS实例选择了CentOS系统时，本地为Windows操作系统，采用方式无法正确的登录该ECS实例。',opts:['阿里云管理控制台','SecureCRT','Putty','Windows自带的远程桌面客户端'],exp:'Windows自带的远程桌面客户端只能连接Windows系统的远程界面，不能连接Centos系统（Linux系统）。'},
  {id:302,type:'single',answer:'A',stem:'开通阿里云对象存储OSS服务后，您首先需要使用OSS管理控制台或OpenAPI创建存储空间Bucket以用来存储文件，以下有关Bucket的说法是正确的。',opts:['Bucket的名称要求全局唯一，且创建后不支持更改','Bucket的名称要求全局唯一，创建后支持更改','Bucket的名称只要求在本帐号内唯一，创建后支持更改','Bucket的名称要求在本帐号内唯一，且创建后不支持更改'],exp:'每个Bucket存储空间的名字全局唯一，Bucket存储空间一旦创建成功，名称和所处地域不能修改。参考链接：https://help.aliyun.com/document_detail/31842.html'},
  {id:303,type:'single',answer:'C',stem:'用户A是公司的系统管理员，经常去上海出差，每当他在上海远程登录服务器时系统就会发出报警信息，提示“有人异地登录，请注意服务器安全”。通过方法可以快速、自助解决这个问题。',opts:['立即提交工单，咨询阿里云工程师','向公司领导请求帮助','登录阿里云管理控制台，在安骑士配置项里填加“常用登录地点”','向朋友电话求助，他是业界有名的黑客高手'],exp:'题目中说的是系统管理员每次在上海出差时候远程登录服务器就会发出异地的报警信息，所以需要通过控制台的添加“常用登录地点”来解决这个报警信息的问题。'},
  {id:304,type:'single',answer:'C',stem:'专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。创建专网络后，系统会在路由表中自动添加一条以为目标网段的路由条目，用于VPC内的云产品通信。',opts:['172.16.0.0/12','10.0.0.0/8','100.64.0.0/10','192.168.0.0/16'],exp:'专有网络VPC是用户在云上创建的独立虚拟网络。创建VPC时，系统确实会在路由表中自动添加一条特殊的路由条目，用于VPC内的云产品通信。这条路由的目标网段是专为私有网络设计的特殊IP地址段。根据提供的选项，答案C中的`100.64.0.0/10`是常见的私有IP地址范围之一，常用于大型组织或企业的内部网络。因此，系统在路由表中自动添加的以`100.64.0.0/10`为目标网段的路由条目，正是用于VPC内的云产品通信。所以正确答案是C。'},
  {id:305,type:'single',answer:'A',stem:'当阿里云用户想要通过API进行ECS实例删除的操作的时候，必须保证ECS实例状态为，才可以进行删除操作，删除后实例的状态变为',opts:['Stopped；Deleted','Stopped；Starting','Stopping；Deleted','Stopping；Starting'],exp:'删除云服务器ECS必须保证ECS实例状态为已停止 Stopped，删除了以后状态为已删除：Deleted。'},
  {id:306,type:'single',answer:'C',stem:'云服务器ECS服务的API服务地址是',opts:['ecsapi.aliyuncs.com','ecs.aliyun-api.com','ecs.aliyuncs.com','ecs.aliyun.com'],exp:'阿里云ECS的API为：ecs.aliyuncs.com，参考链接：https://help.aliyun.com/document_detail/25489.html'},
  {id:307,type:'single',answer:'A',stem:'某企业采取阿里云负载均衡SLB和弹性伸缩(AutoScaling)配合使用的方案，希望在拥有良好的稳定性、可靠性的同时，还能节省运维成本和资源使用成本。由于此前没有相关的使用经验，他们根据自己的理解列出了一些应该注意的事项，然后向您咨询意见。作为阿里云产品专家，您判断出只有是正确的，在该公司后续的项目建设过程中也逐一得到验证。',opts:['负载均衡SLB实例必须开启健康检查，否则无法和弹性伸缩一起使用','负载均衡SLB实例下的所有的ECS实例操作系统一定相同','负载均衡SLB实例下的所有后端服务器必须都有相应的伸缩组','负载均衡SLB实例下的所有后端服务器的配置必须相同'],exp:'假如需要和弹性伸缩ESS配合使用的话，负载均衡SLB下面的ECS必须开启健康检查，否则负载均衡SLB无法监听到后端ECS的状态则无法正常弹性伸缩。SLB下面可以添加多个伸缩组，所以后端ECS可能来自用户手动添加非伸缩的ECS。'},
  {id:308,type:'single',answer:'A',stem:'下面哪种镜像可以进行复制？',opts:['自定义镜像','公共镜像','镜像市场镜像','共享的镜像'],exp:'复制镜像仅适用于自定义镜像。如果您需要复制其他类型的镜像，可先使用镜像创建实例，再使用该实例创建自定义镜像。然后，复制该自定义镜像。参考链接：https://help.aliyun.com/document_detail/25462.html'},
  {id:309,type:'single',answer:'C',stem:'阿里云的云服务器ECS实例的磁盘快照是某一个时间点上某一个磁盘的数据拷贝。以下针对云服务器ECS实例的磁盘快照的描述正确的是',opts:['快照被存放在用户自己的磁盘中','自定义快照名称可以以auto开头','快照存放在OSS上','只有系统盘支持自动快照'],exp:'快照不会自动保存到已有的OSS Bucket。快照存放的位置与您自建的OSS Bucket相互独立，您无需为快照创建新的Bucket。总结就是快照保存在独立于你自建的OSS空间内。参考链接：https://help.aliyun.com/knowledge_detail/52045.html'},
  {id:310,type:'single',answer:'D',stem:'假设网络管理员需要随时随地通过公网对阿里云专有网络VPC下的多台云服务器ECS实例进行管理，通过哪种方式可以既安全又低成本的实现。',opts:['修改VPC的安全组策略，允许公网的访问','其他答案都不对','为每一台云服务器ECS实例绑定一个EIP，登录各个云服务器ECS实例进行管理','在VPC内选择一台云服务器ECS实例作为堡垒机，申请一个EIP绑定到该ECS实例，通过该堡垒机进行其他云服务器ECS实例的管理'],exp:'为某台ECS申请了EIP，则可以通过公网访问这台ECS，然后通过这台ECS管理VPC内的其他ECS实例。'},
  {id:311,type:'single',answer:'C',stem:'云盾是阿里云整体安全体系的一部分，为云上客户和阿里云自身提供多方面的安全保障功能。以下关于云盾的描述，正确的是',opts:['是一款软件产品，用户开通云产品后需要安装才能使用','是一款硬件产品','是阿里云为用户提供的，包括安全漏洞检测、网页木马检测以及主机入侵检测、防DDoS攻击等功能的一站式安全服务','云盾的所有功能都需要付费使用'],exp:'云盾是阿里巴巴集团多年来安全技术研究积累的成果，结合阿里云云计算平台强大的数据分析能力。为中小网站提供如安全漏洞检测、网页木马检测以及面向云服务器用户提供的主机入侵检测、防DDOS等一站式安全服务。云盾的功能产品部分是可以免费使用的。'},
  {id:312,type:'single',answer:'A',stem:'阿里云的专有网络VPC可以帮助您基于阿里云的产品构建出一个隔离的网络环境。通过与连接方式结合，可以实现专有网络VPC与传统数据中心组成一个按需定制的网络环境。',opts:['VPN','负载均衡SLB','域名解析DNS','云监控'],exp:'通过VPN专线可以将该网络与传统数据中心组成一个按需定制的网络环境。'},
  {id:313,type:'single',answer:'A',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。可以广泛应用于各种场景。例如：图片和音视频类应用的海量存储、静态网站、应用中的静态网页。以下场景适合使用OSS服务。',opts:['客户A是一个网店老板,每天产生10Gb的高清图片,需要稳定可靠的存储','客户B的一个在线应用,采用自建MySQL数据库保存订单信息,该应用每天产生2000万条订单数据,预计2周后存储容量达到服务器上限,希望通过阿里云产品解决订单存储问题','客户C想对当前业务系统积累了5年的数据进行数据挖掘,为新财年的营销策略制定提供数据支持','客户D的小型电子商务系统由于业务量爆增,计算能力明显不足,每天业务高峰期时服务器的CPU利用率都超过90%,正在寻找优化方案'],exp:'OSS仅适合存放静态非结构化数据，所以数据库的数据是不行的。'},
  {id:314,type:'single',answer:'D',stem:'在对ECS实例进行续费操作时，无法实现以下操作？',opts:['增加CPU规格','带宽升级','增加内存空间','无需重启即可享受升级后的配置'],exp:'ECS升级CPU或内存等配置需要重启才可享受升级后的配置。'},
  {id:315,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)提供了“弹性自愈"功能，能保持伸缩组中的云服务器ECS实例都处在正常状态，从而使业务始终保持正常的负载，提高系统的稳定性。关于"弹性自愈”，以下说法中正确的是？',opts:['如果伸缩组中某台ECS实例状态不是运行中，则该ECS实例会被移出伸缩组，同时自动创建一台新的ECS实例，添加到伸缩组中来','如果伸缩组中某台ECS实例的状态不是运行中，阿里云弹性伸缩会启动ECS实例的故障检查与修复进程，对ECS实例进行自动修复','如果伸缩组中某台ECS实例状态不是运行中，阿里云弹性伸缩首先会自动重启该ECS,重启成功后继续保持在伸缩组中，如果重启失败，则从伸缩组中移除，同时创建新的ECS实例键入到伸缩组中来','如果伸缩组中某台ECS实例状态不是运行中，阿里云弹性伸缩首先会自动重启该ECS,重启成功后继续保持在伸缩组中，如果重启失败，则会使用指定的镜像恢复该ECS实例到初始状态，继续保持在伸缩组中'],exp:'当检测到某台ECS实例处于不健康状态时。弹性伸缩自动释放不健康ECS实例并创建新的ECS实例，自动添加新ECS实例到负载均衡实例的后端服务器和RDS实例的访问白名单中。'},
  {id:316,type:'single',answer:'B',stem:'题干：316/1023、阿里云对象存储OSS提供了丰富的文件上传和下载接口，用户可以通过API方便地实现大容量存储空间的管理。如果您想建立一个大型图片分享站点，该网站允许大量用户通过WEB方式进行图片的上传和分享，可以使用阿里云的产品与OSS配合实现。',opts:['负载均衡SLB','云服务器ECS','云数据RDS','内容分发网络CDN'],exp:'题目中要求允许大量用户通过WEB方式进行图片的上传和分享，所以需要云服务器ECS来提供WEB服务支持。'},
  {id:317,type:'single',answer:'D',stem:'精准访问规则指对常见的HTTP字段进行条件组合，支持业务场景的定制化防护策略，可用于盗链防护、网站管理后台保护等。以下不属于精准防护支持的字段是',opts:['Params、URL','IP、Referer','User-Agent','Source-Adress'],exp:'高级版WAF实例仅支持IP、URL、Referer、User-Agent、Params匹配字段 https://help.aliyun.com/document_detail/42780.html?spm=5176.11065259.1996646101.searchclickresult.7116428aPlNpXe#section-cai-862-bfh'},
  {id:318,type:'single',answer:'C',stem:'您在阿里云的某台云服务器ECS实例上运行的服务出现响应缓慢的情况，通过云监控发现目前该ECS实例的带宽利用率已经达到80%以上。在不希望对云服务器ECS实例重启的前提下，可以尝试通过操作来缓解服务响应缓慢的问题。',opts:['升级ECS实例的CPU和内存','为ECS实例增加磁盘','升级ECS实例的带宽','其他三个都不需要'],exp:'题目中说了是因为带宽利用率太高，导致了解服务响应缓慢的问题，所以需要通过升级ECS实例的带宽的方式减轻带宽压力。'},
  {id:319,type:'single',answer:'B',stem:'云盾是一款多媒体内容智能识别服务，支持对图片、视频、文本、语音等对象进行多样化场景检测，帮助企业、开发者在复杂多变的互联网环境下快速发现文本、图片、视频、语音的各类风险。',opts:['安全管家','内容安全','云安全中心','内容审计'],exp:'内容安全是一款多媒体内容智能识别服务，支持对图片、视频、文本、语音等对象进行多样化场景检查，有效帮助您降低内容违规风险。常用的检测场景包括：智能鉴黄、暴恐涉政识别、图文广告识别、logo识别、敏感人脸识别、二维码识别、OCR图文识别、文本反垃圾、语音反垃圾、文件内容反垃圾等。内容安全提供站点检测公共，可以定期自动检测您的网站上的风险和违规内容；OSS违规检测功能，对您指定的OSS空间中的图片和视频进行涉黄、涉政检测；您也可以直接调用内容检测API，提交指定场景的机器识别任务。 参考链接： https://help.aliyun.com/product/28415.html?spm=a2c4g.11186623.6.191.26681d51kWsd7W'},
  {id:320,type:'single',answer:'C',stem:'阿里云的云服务器ECS产品的应用非常广泛，既可以单独的作为Web服务器，也可以与其他阿里云产品配合提供多媒体解决方案。在多媒体、大流量的APP或网站应用场景下，云服务器ECS实例与阿里云的产品，可以实现在业务量增长时自动增加ECS实例，并在业务量下降时自动减少ECS实例，保证满足访问量达到峰值时对资源的要求，同时降低了系统资源的拥有成本。',opts:['对象存储OSS','内容分发网络CDN','弹性伸缩Auto Scaling','云监控'],exp:'题目中说：“业务量增长时自动增加ECS实例，并在业务量下降时自动减少ECS实例“，顾名思义是弹性伸缩Auto Scaling。'},
  {id:321,type:'single',answer:'A',stem:'阿里云对象存储服务（Object Storage Service，简称 OSS），是阿里云提供的海量、安全、低成本、高可靠的云存储服务。用户操作OSS的基本数据单元是什么？',opts:['Object','Bucket','Service','安全组'],exp:'OSS的基本数据单元是对象/文件（Object）。参考链接：https://help.aliyun.com/document_detail/31817.html'},
  {id:322,type:'single',answer:'C',stem:'某公司有两个业务，要购买阿里云产品ECS服务器，要求两个业务之间的网络延时较低，可以将两个业务实例创建在',opts:['不同地域','同地域的不同可用区内','同一可用区内','同一个安全组'],exp:'如果您的应用需要较高的容灾能力，建议您将实例部署在同一地域的不同可用区内。 如果您的应用要求实例之间的网络延时较低，建议您将实例创建在同一可用区内。 https://help.aliyun.com/document_detail/123712.html?spm=a2c4g.11174283.6.551.71d652fen54CFu'},
  {id:323,type:'single',answer:'C',stem:'使用阿里云云服务器ECS的过程中，如果发现Windows磁盘空间满了，可以通过清理磁盘中不需要的文件，或者扩容磁盘来解决。此外，日常也应养成良好的磁盘使用习惯，这些习惯不包括',opts:['文件压缩保存','定期清理不必要的应用程序','磁盘快照压缩保存','设置磁盘监控'],exp:'日常需要养成良好的磁盘使用习惯，本文推荐以下几个磁盘使用的最佳实践： 压缩保存文件 定期清理不必要的应用程序 设置磁盘监控'},
  {id:324,type:'single',answer:'A',stem:'您希望基于已有的磁盘快照在青岛可用区A的云服务器ECS实例创建一个新的块存储磁盘，您可以使用快照创建该磁盘。',opts:['青岛可用区A的某个ECS实例的系统盘快照','北京可用区A的某个ECS实例的数据盘快照','香港可用区A的某个ECS实例的数据盘快照','以上都不行'],exp:'题目中要求的是在ECS上面新挂载一块数据盘，所以可以使用和它同一个可用区的系统盘快照来创建。'},
  {id:325,type:'single',answer:'C',stem:'根据ECS实例加入伸缩组的方式，ECS实例可以分为自动创建的ECS实例和手动创建的ECS实例。对于手动创建的ECS实例，如果某用户想要设置由伸缩组在弹性收缩时负责停止和释放ECS实例，用户需要设置ECS实例',opts:['转为备用状态','移出保护状态','托管给伸缩组','托管给SLB实例'],exp:'弹性伸缩组中手动添加的ECS实例默认不具备由伸缩组自动管理的特性。阿里云文档指出，若需伸缩组在缩容时处理手动加入的实例，必须将其设置为托管状态。选项C对应的操作允许伸缩组接管实例的生命周期管理。其他选项涉及备用状态、保护状态解除或负载均衡托管，均与伸缩组自动释放实例无关。'},
  {id:326,type:'single',answer:'D',stem:'阿里云对象存储OSS支持分块上传操作，即可以将大文件进行分块处理后再分别上传，该操作适合在上传大文件或者网络较差的情况下使用。在分块上传的所有任务完成之后，如果没有调用CompleteMultipartUpload接口，就会产生一些不完整的文件，这些不完整的文件会占用用户bucket的空间。为了方便用户删除这些不完整的文件，OSS专门提供了功能。',opts:['在线批量删除','OpenAPI批量删除','Bucket清空','碎片管理'],exp:'题目中说了需要删除不完整的碎片文件，所以需要用到碎片管理功能来删除这些不完整的文件。参考链接：https://help.aliyun.com/document_detail/31916.html'},
  {id:327,type:'single',answer:'D',stem:'当ECS处于以下状态时可以挂载磁盘？',opts:['更换系统中','启动中','重置中','已停止'],exp:'挂载云盘（磁盘）需要实例状态必须为 运行中（Running）或者 已停止（Stopped），不能为 已锁定（Locked）。参考链接：https://help.aliyun.com/document_detail/25446.html'},
  {id:328,type:'single',answer:'A',stem:'某企业使用公共云搭建了一个门户网站，目前访问缓慢。为了提升网站的响应速度，又购置了多台云服务器，希望新增加的服务器和原有服务器一起对外提供服务，需要哪种技术配合实现这个方案',opts:['负载均衡','VPC（虚拟专用网）服务','CDN（内容分发网络）','容器服务'],exp:'题目中说"希望新增加的服务器和原有服务器一起对外提供服务"的技术，所以选择把新加的机器作为负载均衡SLB后端的机器一起提供服务，所以选择负载均衡SLB。'},
  {id:329,type:'single',answer:'A',stem:'您的应用系统部署在阿里云的云服务器ECS实例上，系统每天晚上会进行当天运营数据的报表统计，在凌晨3点钟会出现短暂的统计服务响应变慢的情况，但很快会自动消失，很可能是云服务器ECS实例自身的（）操作引起的。',opts:['云服务器ECS实例的自动快照的时间设置在每天凌晨3点','互联网网络不稳定','云服务器ECS实例的自动镜像服务设置在凌晨3点','云服务器ECS实例自动休眠了'],exp:'设置自动快照创建时间和重复日期时应尽量避开业务高峰，因为创建快照可能会轻微降低磁盘的性能，出现短暂瞬间变慢。 参考链接：https://help.aliyun.com/document_detail/25456.html'},
  {id:330,type:'single',answer:'D',stem:'某视频公司，使用负载均衡SLB将用户的访问请求分发到30台云服务器ECS实例上去，由这些配置相同的ECS实例来响应用户的请求。每天晚上20:00到次日凌晨2:00期间，业务量会大幅增加，基本上会比其他时间段增加1倍左右，为了能正常响应视频用户的请求，',opts:['使用自定义的镜像，手工创建30台云服务器ECS实例，在每天晚上20:00前，手工增加到SLB中去，次日凌晨2:00再从SLB中移除','使用阿里云弹性伸缩（Auto Scaling），通过合适的配置，自动提升每台ECS实例的规格','基于自定义的镜像创建30台云服务器ECS实例，添加到SLB中去，通过设置权重，让这些ECS实例在每天晚上20:00到次日凌晨2:00之间可以响应用户需求，其他时间段权重修改为0','使用阿里云弹性伸缩（Auto Scaling），通过合适的配置，自动增加ECS实例或者减少ECS实例'],exp:'题目要求成本和容易的角度，所以是通过动态伸缩更加简单和节省成本。'},
  {id:331,type:'single',answer:'A',stem:'阿里云的负载均衡SLB中的证书（Certificate）用于HTTPS协议，在需要使用加密协议时，用户可以将证书上传至负载均衡SLB实例中，在创建HTTPS协议监听时绑定证书，提供HTTPS服务。目前阿里云的负载均衡SLB只支持PEM格式的证书。',opts:['PEM','P7B','PFX','DER'],exp:'负载均衡只支持PEM格式的证书。参考链接：https://help.aliyun.com/document_detail/85968.html'},
  {id:332,type:'single',answer:'D',stem:'ECS外部系统可以通过API在请求时传入参数来指定返回的数据格式，默认为格式？',opts:['JSP','HTTP','JSON','XML'],exp:'API默认返回是XML格式，参考链接：https://help.aliyun.com/document_detail/25490.html'},
  {id:333,type:'single',answer:'A',stem:'阿里云OSS产品的账单费用由三部分组成，包括：存储空间费用、流量费用和OSSAPI请求费用。其中存储费用是根据应用所占用的存储空间的大小计费，存储费用的付费方式支持',opts:['包年包月和按量付费','只有按量付费','只有包年包月','按天计费和按量付费'],exp:'存储费用支持包年包月和按量付费。参考链接：https://help.aliyun.com/document_detail/59636.html'},
  {id:334,type:'single',answer:'D',stem:'阿里云弹性伸缩服务AutoScaling可以根据业务需求和策略自动调整弹性计算资源。在业务需求增长时无缝增加ECS实例，满足计算需要；在业务需求下降时，自动减少ECS实例节约成本。在创建弹性伸缩组时，需要填写的信息不包括 选项：',opts:['伸缩组名称','组内最大实例数','组内最小实例数','伸缩配置'],exp:'弹性伸缩组创建核心需定义基础容量规则，包括名称（A）、最大实例数（B）、最小实例数（C）以确保资源动态范围，而伸缩配置属于独立定义的实例规格参数（如镜像、磁盘类型），需关联已有配置至伸缩组而非创建时填写，故D不包含。'},
  {id:335,type:'single',answer:'A',stem:'如果ECS实例采用linux系统，关于能否开启NetWorkManager服务说法正确的是',opts:['linux系统请不要开启NetWorkManager服务，该服务会跟系统内部网络服务出现冲突，导致网络异常','linux系统可以开启NetWorkManager服务','linux系统请可以开启NetWorkManager服务，但需要进行相应的配置调整','以上都不对'],exp:'NetworkManager服务来实现网络的配置和管理，NetworkManager服务启动以后可能会导致系统内部的网络配置出现紊乱。'},
  {id:336,type:'single',answer:'A',stem:'您已经创建好了一块新的块存储，想要通过阿里云的管理控制台进行磁盘挂载到云服务器ECS实例上的操作，却找不到想挂载的云服务器实例，一定不是因为原因引|起的。',opts:['块存储与云服务器ECS实例在同一个可用区','云服务器ECS实例已经释放','块存储与云服务器ECS实例不在一个可用区','块存储与云服务器ECS实例在同一个地域'],exp:'云盘只能挂载到同一地域下同一可用区内的实例上，不能跨可用区挂载。题目中问的是一定不是因为什么原因，所以在一个可用区不会导致找不到挂载的ECS的情况。'},
  {id:337,type:'single',answer:'A',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。用OSS管理的文件可以很方便地对外提供分享，分享前点击文件后面的“获取地址”文字链接即可得到当前文件的地址，这个分享使用的是应用层（七层）协议。',opts:['HTTP','FTP','SMTP','TCP'],exp:'文件的分享地址，是在OSS应用的控台操作的，所以属于HTTP的第七层应用层。'},
  {id:338,type:'single',answer:'C',stem:'题干：338/1023、某用户在阿里云控制台查看到某台ECS实例状态为保护中，这种状态下，ECS实例正常提供服务，弹性伸缩不会检查ECS实例健康状态，也不会释放ECS实例，需要用户手动管理该台ECS实例生命周期。',opts:['备用中','使用中','保护中','挂起中'],exp:'处于保护状态的ECS实例负载均衡权重不受影响。弹性伸缩不会检查处于保护状态的ECS实例健康状态，也不会释放ECS实例。'},
  {id:339,type:'single',answer:'C',stem:'某大型购物商城新上了一套视频监控系统，在商城所在一个5层高的大楼里共安装了35个高清摄像头，用于监控主要的出口通道。该系统的应用部署在一台阿里云的云服务器ECS实例上，该ECS实例上挂了4块2T的数据盘来存储视频数据。上线后一周后发现视频数据的增速过快，预计8T硬盘不出1个月就会用完。您认为使用阿里云的产品可以最好地解决该客户的存储问题，同时在需要的时候快速读取到历史的视频数据。',opts:['归档存储（Archive Storage）','多台云服务器ECS','对象存储OSS','内容分发网络CDN'],exp:'题目中要求需要解决数据增长过快的问题，需要可以通过将视频文件存储到OSS中来解决问题，因为OSS没有空间上限，不需要担心增长过快的问题，同时还可以满足快速读取的要求。（归档存储无法快速读取数据）'},
  {id:340,type:'single',answer:'B',stem:'作为一个互联网初创企业的技术负责人，小A在早期选择了阿里云的云服务器ECS并将Java应用程序、数据库MySQL等部署在了一台云服务器ECS实例上。随着业务发展和用户量增加，发现部署在这台ECS实例上数据库性能出现瓶颈。为了最快速度解决该问题，同时提高系统安全性和稳定性，您建议选择阿里云的产品。',opts:['负载均衡SLB','云数据库RDS','对象存储OSS','专有云VPC'],exp:'这台ECS实例上数据库性能出现瓶颈，所以需要选择阿里云的RDS解决性能问题。'},
  {id:341,type:'single',answer:'B',stem:'题干：341/1023、某创业团队基于阿里云的产品构建了一个网盘应用，允许用户通过WEB方式进行文件的上传和下载。当前版本的实现方式是所有文件都保存在多台云服务器ECS实例的数据盘上。随着业务量的增长，ECS实例的数量也同步增加，系统整体的运维成本越来越高。如果用户开通阿里云的产品与ECS实例搭配，可以很好地降低运维成本。',opts:['负载均衡SLB','阿里云对象存储OSS','内容分发网络CDN','关系型云数据库RDS'],exp:'划重点：保存在多台云服务器ECS实例的数据盘上，需要降低运维成本。所以需要把文件文件转存到对象存储OSS上面。'},
  {id:342,type:'single',answer:'A',stem:'某阿里云负载均衡SLB实例下，后端多台云服务器ECS实例配置权重都一样，但是实际上ECS实例负载却不一样，可能是因为 选项：',opts:['开启了会话保持功能','开启了获取真实IP的功能','ECS实例在不同的地域（Region），网络延迟不同','采用的转发规则不同'],exp:'负载均衡请求不均衡可能有以下几种原因：1. ECS实例请求连接数较少。2. 不同ECS实例的性能不同导致请求不均衡。3. 开启了会话保持功能。4. ECS健康检查异常。5. TCP Keepalive保持长连接。参考链接：https://help.aliyun.com/knowledge_detail/66280.html'},
  {id:343,type:'single',answer:'C',stem:'有很多10或100开头的IP在频繁访问我SLB的后端ECS实例，而安全检查没有报告问题，可能的原因是',opts:['ECS服务器故障','正在遭受网络攻击','SLB系统的健康检查和可用性监控','真实用户的访问'],exp:'有10或100开头的IP在频繁访问ECS是因为负载均衡系统除了会通过系统服务器的内网IP将来自外部的访问请求转到后端ECS上之外，还会对ECS进行健康检查（前提是您已经开启了这一功能）和对您的负载均衡服务进行可用性监控，这些访问的来源都是由负载均衡系统发起的。参考链接：https://yq.aliyun.com/ask/58922'},
  {id:344,type:'single',answer:'C',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力等几个方面都具有优势。以下是OSS在安全性方面表现出来的优势。',opts:['流量清洗和黑洞设备需要另外购买，阿里云的云市场有多家优质的供应商可供选择','OSS提供灵活的开发接口，兼容市面上主流的安全防护设备和协议','提供多种鉴权和授权机制，以及白名单、防盗链、主子账号功能','阿里云提供地定制化的安全服务，可以根据用户需要一对一定制开发'],exp:'其他均不属于安全方面优势'},
  {id:345,type:'single',answer:'A',stem:'通过操作，可以实现在阿里云的同一个专有网络VPC下的三个交换机下的云服务器ECS实例之间内网互相不能访问，但并不影响该专有网络VPC的内网其他流量？',opts:['创建三个安全组，分别包含三个交换机下的所有云服务器ECS实例，先为每个安全组设置允许所有网段访问的规则，再设置禁止另外两个交换机所在网段访问的规则（优先级要高于前者）','创建三个安全组，分别包含三个交换机下的所有云服务器ECS实例，先为每个安全组设置允许所有网段访问的规则，再设置禁止另外两个交换机所在网段访问的规则（优先级要低于前者）','创建一个安全组包含三个交换机下的所有云服务器ECS实例，先为该安全组设置允许所有网段访问的规则，再设置禁止另外两个交换机所在网段访问的规则（优先级要高于前者）','其他答案都不对'],exp:'阿里云安全组规则优先级数值越小优先级越高。选项A正确配置了三个独立安全组，每个安全组允许所有流量（低优先级），再添加拒绝另两个交换机网段的规则（高优先级）。当ECS实例位于不同安全组时，拒绝规则优先生效，阻断三个交换机间的访问，同时不影响其他内网流量。选项B优先级设置错误，选项C无法区分交换机，选项D不成立'},
  {id:346,type:'single',answer:'C',stem:'阿里云对象存储OSS里存储的文件可以进行分享和下载，当文件所在的Bucket的读写权限为“私有”时，OSS分享链接采用的安全机制是',opts:['在管理控制台中获取文件访问URL时设置分享链接的访问密码，访客下载文件时凭密码访问','“私有”权限的文件对外享时，访客只能看到文件的一部分内容（前500K）','在管理控制台中获取文件访问URL时设置分享链接有效的时间，超过设定时间就无法下载','“私有”权限的文件对外分享时，系统会检查文件的大小，超过2M的文件不允许分享'],exp:'出于安全考虑，目前控制台针对私有bucket的获取URL链接签名操作做了优化，使用的AccessKey是临时生成的密钥对，主账号用户最长有效时间是64800秒（18小时），RAM子账号用户以及sts用户最长有效时间是3600秒（1小时），超时后链接就无法访问了。参考链接：https://help.aliyun.com/knowledge_detail/39530.html'},
  {id:347,type:'single',answer:'B',stem:'某公司属于传统行业，一年前刚刚发展互联网线上业务，用了5台云服务器ECS实例，没有专门的系统管理员，最近半年来线上系统总是出现各种安全问题，几次高危漏洞被黑客利用，差点将核心数据泄露。使用阿里云的可以快速解决这个问题。',opts:['安骑士','安全管家','内容安全（原名：绿网）','DDoS高防IP'],exp:'划重点：没有专门的系统管理员。所以需要用到阿里云的安全管家服务来托管公司的ECS服务器。参考链接：https://help.aliyun.com/document_detail/31742.html'},
  {id:348,type:'single',answer:'C',stem:'某公司使用阿里云对象存储OSS存储文件，其管理员发现某个Bucket每天会自动生成名称中包含日期的Object，最可能的原因是',opts:['该Bucket开启了LifeCycle生命周期规则','该Bucket开启了版本控制功能','某个Bucket开启了日志存储，并且将日志的存储路径设置为上述Bucket','某个Bucket开启了跨区域复制功能，并且将复制的目标路径设置为上述Bucket'],exp:'阿里云对象存储OSS的日志存储功能允许将Bucket的访问日志记录到指定路径。当为某个Bucket启用日志存储并设置目标路径为另一Bucket时，OSS每天会自动生成日志文件，文件名通常包含日期（如`/YYYY-mm-DD-HH-MM-SS-UniqueString`）。选项C描述的正是此场景。选项A生命周期规则主要用于自动删除或转储文件，选项B版本控制用于保留历史版本，选项D跨区域复制用于同步数据到不同区域，均不会自动生成带日期的Object。参考阿里云官方文档“日志管理”章节。'},
  {id:349,type:'single',answer:'C',stem:'ECS服务器会对每个访问的请求进行身份验证，以下哪一个是用于标识访问者身份的？',opts:['Access Key Secret','RequestId','Access Key Id','User name'],exp:'注意不是Access Key Secret，Access Key Secret是用来_x005F鉴权校验的，Access Key Id是用来区分用户的。阿里云 access key ID 和 access key secret 是您访问阿里云API的唯一凭证。Access key ID 是类似身份的标识，而 access key secret 的作用是签名您的访问参数，以防被篡改。Access key secret 类似您的登录密码，不要向任何人泄漏。参考链接：https://help.aliyun.com/knowledge_detail/43189.html'},
  {id:350,type:'single',answer:'B',stem:'在创建阿里云ECS时，每台服务器必须要包含用来存储操作系统和核心配置。',opts:['镜像','系统盘','实例','数据盘'],exp:'每台阿里云ECS实例必须绑定系统盘，用于存储操作系统和核心配置。系统盘是实例运行的基础存储单元，镜像用于创建系统盘的内容，数据盘为额外存储，实例是服务器的逻辑实体。只有系统盘直接承载操作系统。'},
  {id:351,type:'single',answer:'D',stem:'安全组是一种虚拟防火墙，由同一地域内具有相同保护需求并相互信任的实例组成，具备状态检测和数据包过滤能力，用于在云端划分安全域，可以通过创建安全组。',opts:['1、创建安全组； 2、 ECS加入安全组 3、添加安全组规则 4、管理安全组； 5、管理安全组规则','1、创建安全组； 2、添加安全组规则 3、弹性网卡加入安全组； 4、管理安全组； 5、 ECS实例绑定弹性网卡; 6、管理安全组规则','1、创建安全组； 2、添加安全组规则 3、 ECS加入安全组; 4、管理安全组规则 5、管理安全组','1、创建安全组； 2、添加安全组规则 3、 ECS加入安全组; 4、管理安全组 5、管理安全组规则'],exp:'安全组用于在云端划分安全域，其创建涉及多个步骤。根据常见云计算平台（如阿里云）的操作逻辑，安全组流程通常为：创建安全组→配置规则→关联实例→管理规则→调整策略。选项C的步骤顺序符合这一逻辑：创建后立即添加规则，确保实例加入时已有基础策略；管理规则与安全组本身分开操作，层级清晰。其他选项中，A未区分规则管理与组管理，B引入弹性网卡步骤偏离核心流程，D的管理顺序可能导致规则调整滞后。'},
  {id:352,type:'single',answer:'B',stem:'使用阿里云弹性伸缩(AutoScaling)来实现计算资源的弹性配置时，做了如下设置：伸缩组的属性中设置MinSize=6，MaxSize=8，伸缩规则为“减少5台ECS”，伸缩配置也进行了正常的配置。该伸缩组当前的云服务器ECS实例数为8台，通过设置',opts:['1台','2台','0台','5台'],exp:'注意：MinSize=6，所以执行定时任务每次减少5台，但是最少需要有6台机器，所以执行一次后最多只能减少2台。'},
  {id:353,type:'single',answer:'C',stem:'阿里云会为每个云服务器ECS实例分配一个私网IP。以下关于云服务器ECS实例的私网IP说法正确的是',opts:['私网IP不可以用于SLB的负载均衡','同一地域内实例之间通过私网IP进行的通讯流量是收费的','不要在操作系统内部自行变更私网IP，否则可能会导致私网通讯中断','私网不允许同一帐号下的云服务器ECS实例之间或者云服务器ECS实例与其他云服务之间互访'],exp:'私网IP是可以用于SLB的负载均衡，同一地域内实例之间通过私网IP进行的通讯是不收取流量费的。'},
  {id:354,type:'single',answer:'D',stem:'阿里云对象存储OSS的一个突出特点就是提供了极高的数据可靠性，谈到可靠性自然离不开备份的技术和策略，以下关于OSS备份的说法，正确的是？',opts:['OSS提供三重备份（每份数据保留三个副本），出现故障时在人工参与下可快速恢复','用户需要自己考虑数据的安全性，OSS提供了丰富的备份接口，方便用户将数据进行异地备份','OSS服务的备份是采用的物理机磁盘的RAID0+1技术方案，两块硬盘同时出现故障也不影响服务','OSS提供三重备份（每份数据保留三个副本），出现故障时自动恢复'],exp:'这个是OSS的数据可靠性的描述，OSS默认支持三份副本，通过校验保证三份副本一致，单副本损坏或丢失，会触发拷贝，保持三份。参考链接：https://help.aliyun.com/document_detail/31818.html'},
  {id:355,type:'single',answer:'B',stem:'伴随着层出不穷的网络安全事件，人们',opts:['通过云安全中心对日常安全漏洞、安全事件进行响应处理，防勒素、防病毒、防篇改、合规检查','采用实人认证服务，核验平台用户的自然人真实身份','针对线上电商促销活动场景，采用风险识别服务，防护羊毛党、网络爬虫等业务安全威胁，降低业务营销的损失','采用应急响应服务，在重大活动期间进行安全保障'],exp:'题干考察云安全方案适用性。选项A涉及日常安全防护与合规检查，属于基础安全措施；C针对业务安全威胁，符合促销场景需求；D保障重大活动期间安全，属于常规实践。B的实人认证用于核验用户真实身份，虽有助于身份验证，但在酒饮服务场景中，用户年龄验证更关键，而实人认证无法直接解决年龄合规问题，反而可能增加复杂性和隐私风险，与核心业务安全需求关联性较弱。'},
  {id:356,type:'single',answer:'A',stem:'小王是某新闻网站的技术负责人，该网站目前部署在一台阿里云的云服务器ECS实例上。随着用户访问量的增加，小王发现用户访问网站的响应速度在变慢，通过分析发现是应用服务器的Web会话数量太多且CPU使用率超过75%。为了快速缓解该应用服务器的压力，您认为最紧要的事情是',opts:['增加一台云服务器ECS实例，并采用负载均衡SLB进行负载分担','采用云数据库RDS进行新闻数据存储','采用对象存储OSS进行内容的存储','采用专有云VPC提升运维效率'],exp:'划重点：应用服务器的CPU利用率超过75%，所以需要增加ECS来减轻这台服务器的压力，同时需要通过负载均衡SLB来实现他们的负载分担。'},
  {id:357,type:'single',answer:'A',stem:'云盾先知计划的目的是帮助企业建立私有的什么中心？',opts:['应急响应中心','病毒防护中心','私有数据中心','远程备份中心'],exp:'先知计划是一个帮助企业建立私有应急响应中心的平台（帮助企业收集漏洞信息）。注意和其他题目的题干的区别。'},
  {id:358,type:'single',answer:'A',stem:'题干：358/1023、某视频直播公司采用阿里云弹性伸缩(AutoScaling）来实现动态添加或者减少云服务器ECS实例以应对业务量的变化。由于该公司的系统刚上线不久，没有历史数据做参考，同时也不能预估业务量的变化，他们希望通过ECS实例资源的使用情况（比如CPU利用率、系统负载Load等）来弹性伸缩计算资源。他们应该选择以下哪种伸缩模式？',opts:['动态模式','定时模式','固定数量模式','lazy模式'],exp:'因为题目中的场次是弹性伸缩且没有任何历史数据作为参考，即无法确定需要伸缩的ECS的数量。所以本题是动态模式最合适。'},
  {id:359,type:'single',answer:'C',stem:'在创建VPC和交换机时，必须无类域间路由块（CIDRblock）的形式为专有网络划分私网网段，以下关于网段的实践中，错误的是',opts:['可以使用192.168.0.0/16/10.0.0/8这三个私网网段及其子网作为VPC的私网地址范围','交换机的网段的大小在16位网络掩码与29位网络掩码之间，可提供8-65536个地址。16位掩码能支持65532个ECS实例，而小于29位掩码又太小，没有意义。','每个交换机的第一个和最后两个IP地址为系统保留地址。以192.168.1.0/24为例，192.168.1.0/192.168.1.254和192.168.1.255这些地址是系统保留地址','当有VPC与VPC互通或VPC与本地IDC互通的需求时，需要确保VPC的网段和要互通的网络的网段都不冲突'],exp:'交换机的网段的大小在16位网络掩码与29位网络掩码之间，可提供8-65536个地址。16位掩码能支持65532个ECS实例，而小于29位掩码又太小，没有意义。 每个交换机的第一个和最后三个IP地址为系统保留地址。以192.168.1.0/24为例，192.168.1.0、 192.168.1.253、192.168.1.254和192.168.1.255这些地址是系统保留地址。'},
  {id:360,type:'single',answer:'A',stem:'阿里云提供了多种连接ECS实例的方式，如果使用SSH方式登录ECS（Linux）失败，且没有明确的报错信息，首先应该采取的处理措施是',opts:['检查ECS运行状态','检查ECS安全组规则','尝试使用控制台VNC登录','发起工单流程'],exp:'无论何种原因导致无法远程登录ECS实例，请先检查实例的状态。只有当ECS实例为运行中状态时，才能对外提供业务访问'},
  {id:361,type:'single',answer:'A',stem:'某在线考试网站提供在线的认证考试服务，用户登录网站后，需要在120分钟时间内完成答卷。该网站使用了阿里云的云服务器ECS以及负载均衡SLB实现，上述场景中，如果要保持120分钟之内用户和服务器之间的连接不间断，可以通过负载均衡SLB的功能实现。',opts:['会话保持','加权轮询','弹性自愈','会话同步'],exp:'划重点：保持120分钟之内用户和服务器之间的连接不间断。所以选择会话保持。'},
  {id:362,type:'single',answer:'B',stem:'C公司基于阿里云对象存储OSS和云服务器ECS实例构建了一个网站，ECS实例与OSS之间有频繁的文件上传和下载需求。系统管理员小赵最近通过阿里云管理控制台中的费用中心发现OSS的流量费用增长很快，但是从ECS实例上部署的应用系统日志里没有发现网站访问量有明显增长。请您帮小赵判断一下有可能是原因导致的。',opts:['系统架构中缺少云数据库RDS','可能是ECS实例通过公网地址调用OSS的API','ECS实例的系统配置不足,需要增加内存','系统架构中缺少负载均衡SLB'],exp:'题目中说：ECS和OSS之前有频繁的上传和下载的需求，但是ECS的访问量很小，但公网流量增长却很快，所以可以判断是ECS通过公网API访问OSS导致的公网流量。'},
  {id:363,type:'single',answer:'C',stem:'除了通过PUTObject接口上传文件到OSS以外，OSS还提供了另外一种上传模式是',opts:['Get Object','Put Bucket','Multipart Upload','Head Object'],exp:'除了通过PUT Object接口上传文件到OSS以外，OSS还提供了另外一种上传模式——Multipart Upload。参考链接：https://help.aliyun.com/document_detail/31991.html'},
  {id:364,type:'single',answer:'D',stem:'用户通过阿里云管理控制台创建ECS实例时，若未在该地域创建安全组，阿里云会在创建该ECS实例的同时，为用户创建一个默认安全组，默认安全组为普通安全组，网络类型和ECS实例一致，默认打开的端口不包括',opts:['ICMP协议','SSH22端口','RDP 3389端口','HTTP 80端口'],exp:'阿里云ECS实例的默认安全组规则中，入方向允许ICMP协议、SSH 22端口（Linux远程连接）、RDP 3389端口（Windows远程桌面），而HTTP 80端口需要用户手动添加。官方文档明确默认安全组仅包含上述三个常见管理端口，未包含HTTP/HTTPS等应用层协议端口。选项D的HTTP 80端口未被默认开启，符合阿里云安全组默认配置规范。'},
  {id:365,type:'single',answer:'D',stem:'是一种云战略，用于以及时，受保护和负担得起的方式促进业务关键型数据的可访问性，它依赖于这样的原则：无论消费者和提供者之间是否存在任何组织或地理分离，都可以按需向用户提供指定的有用数据。',opts:['IAAS','PAAS','SAAS','DAAS'],exp:'DaaS是Data as a Server的缩写，意思是数据即服务。'},
  {id:366,type:'single',answer:'B',stem:'下列关于RDS内网连接说法错误的是',opts:['用户可以在RDS内网和外网间切换','RDS实例内外网切换不会影响其他与RDS实例的连接','ECS可以使用内网地址连接RDS实例','用户可以在RDS管理控制台的实例基本信息中查看当前实例使用的连接方式'],exp:'RDS实例内外网切换会影响其他与RDS实例的连接。'},
  {id:367,type:'single',answer:'A',stem:'阿里云弹性伸缩(Auto Scaling)器处在正常状态，从而使业务始终保持正常的负载，提高系统的稳定性。关于“弹性自愈”，以下说法中正确的是？',opts:['如果伸缩组中某台ECS实例状态不是运行中，则该ECS实例会被移出伸缩组，同时自动创建一台新的ECS实例，添加到伸缩组中来','如果伸缩组中某台ECS实例的状态不是运行中，阿里云弹性伸缩会启动ECS实例的故障检查与修复进程，对ECS实例进行自动修复','如果伸缩组中某台ECS实例状态不是运行中，阿里云弹性伸缩首先会自动重启该ECS，重启成功后继续保持在伸缩组中，如果重启失败，则从伸缩组中移除，同时创建新的ECS实例键入到伸缩组中来','如果伸缩组中某台ECS实例状态不是运行中，阿里云弹性伸缩首先会自动重启该ECS，重启成功后继续保持在伸缩组中，如果重启失败，则会使用指定的镜像恢复该ECS实例到初始状态，继续保持在伸缩组中'],exp:'弹性自愈即当检测到某台ECS实例处于不健康状态时。弹性伸缩自动释放不健康ECS实例并创建新的ECS实例，自动添加新ECS实例到负载均衡实例和RDS实例的访问白名单中。参考链接：https://help.aliyun.com/document_detail/ess/product-description/product-description.html 最后的介绍。'},
  {id:368,type:'single',answer:'C',stem:'渗透测试是通过模拟恶意黑客的攻击方法，来评估计算机网络系统安全的一种评估方法',opts:['网络专家','高并发客户','恶意黑客','正常客户'],exp:'渗透测试是通过模拟恶意黑客的攻击方法。'},
  {id:369,type:'single',answer:'C',stem:'您的两台阿里云的云服务器ECS实例之间内网不能通信，一定不是由于原因引起的。',opts:['两台云服务器实例在不同地域','其中一台云服务器ECS实例修改过私网IP','两台ECS实例在同一个账号下，同一个地域的不同可用区','两个云服务器ECS实例在不同的安全组'],exp:'两台云服务器ECS实例之间内网不能通信，题目中问的一定不是什么原因导致的，所以在同一账号的同一地域是不会导致云服务器ECS实例之间内网不能通信的。'},
  {id:370,type:'single',answer:'B',stem:'云计算服务商都支持用户以Web方式自助获得计算资源并对其进行管理。为了提供更好的开放性，云计算平台都支持通过API开放服务，这些API最不可能通过哪个协议进行开放？',opts:['Restful','PPPoE','HTTP','Web Service'],exp:'PPPoE是拨号上网相关协议，已经过时了。不可能在API协议中使用。'},
  {id:371,type:'single',answer:'C',stem:'阿里云的负载均衡SLB可以把用户请求分发到多台云服务器ECS实例上去，其中口“加权轮询模式”的转发策略是指',opts:['将访问请求分发给目前负载最低的后端云服务器ECS实例','将等待最久的访问请求分发给后端云服务器池中处理能力最强的ECS实例','将访问请求按照后端云服务器ECS实例的权重依次分发','将优先级最高的访问请求优先分发给后端云服务器ECS实例'],exp:'加权轮询：权重值越高的后端服务器，被轮询到的次数（概率）也越高。参考链接：https://help.aliyun.com/document_detail/53858.html?spm=5176.11065259.1996646101.searchclickresult.7c265aae5Bg9yW'},
  {id:372,type:'single',answer:'D',stem:'题干：372/1023、某保险公司的线上平台每天在线订单量超过20万笔，一年来频繁受到大流量攻击（超过10G），使服务断断续续，严重影响了公司的品牌和业务量。如果该客户使用阿里云的产品可以抵御这类攻击，保证业务的高可用性。 选项：',opts:['DDoS基础防护','安全管家','态势感知','DDoS高防IP'],exp:'DDoS基础防护只能防护5GB以下的DDoS攻击，超过5GB的DDoS攻击需要用到DDoS高防IP。'},
  {id:373,type:'single',answer:'B',stem:'使用阿里云弹性伸缩(AutoScaling)来实现计算资源的弹性配置时，做了如下设置：伸缩组的属性中设置MinSize=2，MaxSize=7，伸缩规则为“增加6台ECS”，伸缩配置也进行了正常的配置。该伸缩组当前的云服务器ECS实例数为3台，通过设置定时任务来执行，执行一次后，会增加云服务器ECS实例。',opts:['6台','4台','2台','0台'],exp:'注意：MaxSize=7，所以执行定时任务每次增加6台，但是最多只能增加到7台，所以执行一次后会增加7-3=4台ECS实例'},
  {id:374,type:'single',answer:'A',stem:'以下针对ECS地域和可用区的描述不正确的是',opts:['同账号下，同一地域不同可用区的ECS实例内网不能互通','若购买的ECS需要和阿里其他服务搭配使用，建议选择相同地域','一个地域拥有多个可用区','在购买了ECS实例后，地域不可更改'],exp:'同账号下，同一地域ECS实例内网都可以互通。'},
  {id:375,type:'single',answer:'A',stem:'某工程企业拥有数十台阿里云ECS实例，由于经常受遭受到大流量的DDOS攻击，所以使用了阿里云的DDOS高防服务，并且由于客户业务量较大，拥有数十个账号，现在客户想要了解每个账号的活动，可以使用阿里云的产品来监控包括某个账号使用阿里云控制台、云上产品等行为，可以下载到本地以进行安全分析。',opts:['操作审计','云安全中心','堡垒机','数据审计'],exp:'操作审计用于记录阿里云账号在控制台和API调用中的操作行为，支持日志下载与安全分析，符合题干中监控各账号活动并导出本地分析的需求。云安全中心侧重资产安全风险检测，堡垒机用于运维权限管控，数据审计不提供完整操作行为追踪。'},
  {id:376,type:'single',answer:'B',stem:'用户通过ECS管理控制台查看其拥有的某个区域拥有的所有ECS实例的步骤包括：a.进入ECS管理控制台；b.选择地域；c.选择ECS实例管理，则正确的排列顺序是？',opts:['b;a;c','a;b;c','a;c;b','c;b;a'],exp:'操作ECS实例的标准流程是：首先登录进入ECS管理控制台（a），然后在控制台内选择目标地域（b），最后在该地域下进入ECS实例管理页面查看实例（c）。因此正确的顺序是 a -> b -> c'},
  {id:377,type:'single',answer:'A',stem:'在服务器上手动安装阿里云的云盾客户端安骑士时需要权限。',opts:['系统管理员权限','系统普通用户权限','FTP服务权限','数据库权限'],exp:'在服务器上手动安装安骑士时需要管理员权限。参考链接：https://help.aliyun.com/document_detail/28457.html'},
  {id:378,type:'single',answer:'D',stem:'www.bestcar.com是一个刚建立的汽车资讯车友交流网站。主站用Php搭建，有10GB的图片素材：部分JS文件。目前购买一台ECS放置所有程序代码，并在ECS上安装MySQL数据库。随着用户访问量的不断增长，访问网站的速度越来越慢，图片加载慢，网站响应慢。用户上传的图片每周增长50GB。以下哪种产品组合方案可以同时解决大量图片存储和快速访问两个问题',opts:['采用OSS+ECS组合','采用OSS+MTS组合','采用OSS+RDS组合','采用OSS+CDN组合'],exp:'题目中说了需要需要同时解决大量图片存储和快速访问，解决大量图片所以需要用OSS来存储，实现快速访问所以需要用CDN来配合加速访问。'},
  {id:379,type:'single',answer:'B',stem:'您基于阿里云的专有网格VPC环境构建应用，只想购买一个的弹性IP(EIP)，但是该VPC内有多台云服务器ECS实例需要对外提供服务时，可以采用以下方式解决该问题。',opts:['不用任何操作，某台云服务器ECS实例确定EIP之后，外网可以直接访问该VPC内的所有云服务器ECS实例','可以通过端口映射的方式，先将EIP确定到某台云服务器ECS实例A上，并将实例A的端口映射到其他的云服务器ECS实例上','在所有云服务器ECS实例所在的安全组增加一条策略，允许所有外网的访问流量','其他的选择都不对'],exp:'可分配不同端口映射到不同服务器，实现均可以对外服务'},
  {id:380,type:'single',answer:'B',stem:'网络安全是指网络系统的硬件、软件及其系统中的数据受到保护，不因偶然的或者恶意的原因而遭受到破坏、更改、泄露，系统连续可靠正常地运行，网络服务不中断。对于网络上常见的CC攻击主要破坏了网络安全的 选项：',opts:['保密性','可用性','完整性','不可抵赖性'],exp:'CC攻击通过大量请求耗尽目标服务器资源，导致合法用户无法访问服务，直接破坏了网络服务的持续可用能力。网络安全的可用性指系统和数据在需要时可被授权用户正常访问和使用。保密性防止信息泄露，完整性防止数据被篡改，不可抵赖性确保行为可追溯，均非CC攻击主要目标。'},
  {id:381,type:'single',answer:'B',stem:'某用户在对其账号下的ECS实例进行高危操作三（更换系统盘）时，为了避免数据丢失，需要对磁盘数据进行提前备份。同时因为业务需要要求缩短制作快照的等待时间，这种情况下，该用户可选择创建',opts:['普通快照','本地快照','加密快照','自动快照'],exp:'本地快照是云盘数据在某个时刻的完整拷贝，是重要的数据容灾手段。本地快照的快照数据存储在云盘所在的集群中，支持快速备份和恢复，当数据丢失时，您可以通过快照将数据恢复到快照时间点。'},
  {id:382,type:'single',answer:'B',stem:'云计算一个重要特点是弹性，阿里云的用户可以根据业务需求和策略实现计算资源的自动调整。在业务量高峰时增加ECS实例来提升系统的处理能力，在业务量低谷时自动减少ECS实例以节约成本。针对此场景，阿里云的产品可以和云服务器ECS实例配合使用实现弹性计算。',opts:['负载均衡SLB','弹性伸缩Auto Scaling','云数据库RDS','专有网络VPC'],exp:'题目中说需要自动根还有业务量来自动调节ECS实例的数目，所以需要选择弹性伸缩Auto Scaling。'},
  {id:383,type:'single',answer:'D',stem:'与专有云相比，公共云天生就暴露在互联网上。公共云在为企业应用带来与生俱来的互联网+的特性，同时也带来了来自互联网的安全威胁。由于云计算模式基于网络提供服务，面向相对开放的环境，在技术上，除了仍然面临传统IT系统在物理、网络、系统等方面的安全问题之外，也面临着一些新的和云计算特征结合紧密的安全问题。阿里云是通过产品来提供云计算服务的基础安全加固和防护的（比如常见的防DDoS攻击）？',opts:['云数据库','云服务器','云监控','云盾'],exp:'题目中问的什么云产品是供云计算服务的基础安全加固和防护的，所以选择云盾平台。'},
  {id:384,type:'single',answer:'A',stem:'是阿里云提供的海量、安全、低成本、高可靠的云存储服务。其数据设计持久性不低于99.9999999999%（12个9)，服务可用性（或业务连续性)不低于99.995%',opts:['对象存OSS','负载均衡SLB','云数据库RDS','ESSD云盘'],exp:'阿里云对象存储OSS专为海量数据存储设计，支持非结构化数据存储，提供高持久性（12个9）和高可用性（99.995%）。负载均衡SLB用于流量分发，云数据库RDS属于关系型数据库服务，ESSD云盘为块存储设备。阿里云官方文档明确对象存储OSS的持久性和可用性指标符合题干描述。选项A对应题干描述的核心功能与性能参数。'},
  {id:385,type:'single',answer:'B',stem:'目前客户的应用急速发展，用户遍布全国。过去3个月内频繁受到10G以上的DDoS攻击，适合选择以下产品进行防护。 选项：',opts:['云安全中心','新BGP高防（DDoS高防）','Web应用防火墙','DDoS基础防护'],exp:'划重点："过去3个月内频繁受到10G以上的DDoS攻击"，DDoS基础防护只能防护5GB以下的DDoS攻击，超过5GB的DDoS攻击需要用到DDoS高防IP（新BGP）。参考链接：https://help.aliyun.com/document_detail/69319.html'},
  {id:386,type:'single',answer:'C',stem:'阿里云OSS图片处理服务（ImageService）是阿里云OSS对外提供的图片处理服务。用户将原始图片上传保存在OSS上，通过简单的RESTful接口，可以在任何时间、任何地点、任何互联网设备上对图片进行处理。以下有关OSS图片处理服务说法正确的',opts:['可以处理来自于阿里云OSS以外的图片','处理完的图片会保存在OSS中','处理的图片是OSS用户上传到Bucket里的Object','其它答案都正确'],exp:'图片处理第一步就是需要将图片上传到用户指定的Bucket，所以处理图片是基于Bucket里面的图片文件来处理的。处理完的图片并不会保存到OSS，而是直接返回给请求的用户。参考链接：https://help.aliyun.com/document_detail/44686.html'},
  {id:387,type:'single',answer:'B',stem:'A公司将最近两年的内部培训录像都保存在阿里云对象存储OSS中，以方便员工在需要的时候学习。随着智能手机的普及，很多员工希望通过手机来观看视频，但是保存在OSS中的视频格式无法在手机上直接播放，遇到这种问题时客户可以使用阿里云的产品很高效地解决。',opts:['云服务器ECS','阿里云媒体转码（Media Transcoding，简称MTS）','云数据库RDS','负载均衡SLB'],exp:'划重点：OSS中的视频格式无法在手机上直接播放，所以需要用到视频解码来解决直接播放的问题。'},
  {id:388,type:'single',answer:'B',stem:'某摄影网站购买了阿里云OSS产品来存放和处理大量的摄影图片，但是发现大量的图片下载量产生了巨额的外网流量费用，而且无法保证远距离传输的资源质量，经咨询阿里运维人员又购买了CDN产品，又有用户反映手机端携带了图片处理参数访问经过CDN加速的图片时变成空白图片，刷新后可以访问，电脑访问正常。针对此问题，以下排查方法不正确的是 选项：',opts:['使用手机直接访问OSS查看图片访问是否正常。若直接访问OSS查看图片正常，而通过CDN访问异常，说明CDN节点网络问题导致加载失败或CDN缓存了错误内容','使用手机直接访问OSS查看图片访问是否正常，若直接访问OSS也异常，CDN访问正常，说明OSS节点网络问题导致加载失败','使用电脑端直接访问OSS查看图片访问是否正常，若电脑端访问正常，则问题出现在手机端','使用电脑端直接访问OSS查看图片是否正常，若电脑访问也异常，可能是图片出现问题了'],exp:'选项B的结论错误。若手机直接访问OSS异常，说明源站OSS有问题，此时经过CDN访问同样应异常，因为CDN依赖OSS源站。选项B中假设CDN访问正常而OSS异常，这在逻辑上矛盾，故B不正确。其他选项均符合合理排查逻辑：A检查CDN缓存或网络问题，C排查手机端兼容性，D检查源站图片问题。问题根源可能是CDN未正确处理带参数的手机端请求，导致首次缓存失败，刷新后回源成功'},
  {id:389,type:'single',answer:'C',stem:'当收到阿里云的云盾检测出的安全报警信息后，正确的处理方法是',opts:['无需理会，阿里云的云盾会搞定一切','屏蔽报警信息，一点都不重要','云盾只是一个产品，不能处理一切风险。当用户收到报警信息后需判断具体的风险点，主动修复。如:安装杀毒软件、修改管理密码、升级应用软件等','云盾报警是非常可怕的，应立即向公安机关报案'],exp:'云盾检测出的安全报警信息后，用户需要认证对待，判断具体的风险点并尽早主动修复。'},
  {id:390,type:'single',answer:'A',stem:'阿里云的云盾补丁管理服务里发布的补丁来自',opts:['阿里云自己研发','应用厂商官方发布','开源社区网友的贡献','操作系统厂商官方发布'],exp:'云盾依靠积累的安全大数据，每天自动分析0day，第一时间会进行补丁自研，若开通补丁管理功能，可直接进行修复，防止损失的扩大，一般自研补丁，均快于官方，在漏洞爆发和官方未发布补丁的窗口期，把黑客拦截在外。'},
  {id:391,type:'single',answer:'B',stem:'某个SLB实例的健康检查配置如下：响应超时时间：5秒，成功响应时间：1秒，健康检查间隔：2秒，健康阀值：3次，不健康阈值：3次。该SLB实例的健康检查失败的间隔时间和健康检查成功间隔时间分别是和秒。',opts:['21，7','19，7','21，9','19，9'],exp:'1.健康检查失败时间窗=响应超时时间×不健康阈值+检查间隔×（不健康阈值-1）既：5*3+2*（3-1）=19 2.健康检查成功时间窗= （健康检查成功响应时间x健康阈值）+检查间隔x（健康阈值-1）既：（1*3）+2*（3-1）=7 参考链接： https://help.aliyun.com/document_detail/85958.html?spm=a2c4g.11174283.6.626.30701192zRHFI9'},
  {id:392,type:'single',answer:'B',stem:'服务器安全托管是阿里云云盾的一项高级服务，服务内容包括专家人工安全体检、清除木马，VIP技术支持等，此服务是针对阿里云产品提供的。',opts:['云数据库RDS','云服务器ECS','负载均衡SLB','专有网络VPC'],exp:'划重点：服务器安全托管服务，服务器安全托管是由阿里云/阿里云授权安全合作伙伴为您提供的针对云上ECS主机的安全托管服务。参考链接：https://help.aliyun.com/document_detail/73743.html'},
  {id:393,type:'single',answer:'A',stem:'云产品的可用区指的是一套独立的基础设施，不同的可用区之间基础设施西（网络，电力和空调等）相互独立，即一个可用区出现基础设施故障不影响另外一个可用区。下列关于阿里云ECS的可用区说法正确的是？',opts:['可用区是在用户购买时指定的，购买后不支持更改','可用区之间内网互通','可用区内网络延时小于1s','若要提高应用的容灾能力则可以将实例创建在同一可用区'],exp:'只有在同一个地域前提下，可用区之间的内网才是互通的。可用区是指在同一地域内，电力和网络互相独立的物理区域。所以云产品一旦购买了，不支持更改可用区。'},
  {id:394,type:'single',answer:'C',stem:'阿里云提供了多种多样的ECS供用户选择，某用户希望能够选择最适合自己的ECS，其需要考虑的因素不包括',opts:['价值','地理位置','宿主机配置','应用场景'],exp:'阿里云ECS实例的选择涉及多个因素。用户主要关注实例规格、价格、所在区域及适用场景，而宿主机作为底层基础设施由云平台统一管理，其配置对用户透明。地理位置影响延迟和合规性，应用场景决定实例类型，价值关系到成本效益，这些都是用户决策的关键要素。宿主机配置属于云服务商的管理范畴，用户无需也无法选择。'},
  {id:395,type:'single',answer:'B',stem:'购买的块存储无法挂载到指定的ECS上时，可能的原因是',opts:['该ECS已停止状态','购买的块存储和ECS不在同一个可用区','ECS是按量付费','ECS没有公网IP'],exp:'被挂载的实例和云盘在同一个可用区。 被挂载的实例的状态为运行中（Running）或者已停止（Stopped），不能为已锁定（Locked）。 云盘的状态为待挂载（Available）。 您的账号不欠费。'},
  {id:396,type:'single',answer:'A',stem:'阿里云的云盾数据风控可以很好地解决WEB应用中常见的垃圾注册、刷库等业务风险识别的难题，要想使用这项服务首先得进行业务数据的采集，对于WEB应用系统，可以采用方式来采集信息。',opts:['JavaScript','SDK','JavaScript和SDK','HTML5'],exp:'数据风控目前只支持在Web中插入指定的JS代码，其他的暂时还不支持，参考链接：https://help.aliyun.com/document_detail/44822.html'},
  {id:397,type:'single',answer:'A',stem:'某公司很多系统都架构在阿里云上，使用了多个阿里云弹性伸缩（AutoScaling）的伸缩组来实现动态资源管理。现有一台包年包月的云服务器ECS实例还未到期，且处于闲置状态，出于避免资源浪费的考虑，想把它更好的利用起来。以下说法中正确的是？',opts:['可以把它手工添加到同一个地域（Region）的任意一个伸缩组中去','如果该ECS的处理能力很强的话，可以加入到同一个可用区（Zone）的多个伸缩组中去，前提是要部署多个应用处理的环境','只能把加到同一个可用区（Zone）的某一个伸缩组中去，前提是它的规格要符合该伸缩组伸缩配置规定的规格','只能把加到同一个地域（Region）的某一个伸缩组中去，前提是它的规格要符合该伸缩组伸缩配置规定的规格'],exp:'弹性伸缩是有地域的限制，手动添加的ECS必须与伸缩组处于同一个地域。但是不需要要求ECS符合该伸缩组伸缩配置规定的规格。参考链接：https://help.aliyun.com/document_detail/25901.html'},
  {id:398,type:'single',answer:'C',stem:'在启动弹性伸缩前，需要设置条件，可实现在业务需求增长时自动增加ECS实例以保证计算能力，在业务需求下降时自动减少ECS实例以节约成本。',opts:['伸缩配置','触发条件','伸缩规则','伸缩策略'],exp:'伸缩规则定义了在业务需求增长时自动增加ECS实例、需求下降时自动减少ECS实例的具体行为逻辑，是实现动态调整计算资源的核心配置。伸缩配置用于指定实例的规格与镜像，触发条件用于监测指标阈值，伸缩策略是伸缩规则的执行机制，但题干所指“设置条件以实现自动增减”直接对应伸缩规则这一核心控制单元。'},
  {id:399,type:'single',answer:'D',stem:'您希望通过华北2（北京)地域的阿里云专有网络VPC中的云服务器ECS实例通过内网访问OSS，但是连接oss-cn-beijing-internal.aliyuncs.com（华北2（北京）地域的通用内网地址）失败，可以通过解决。',opts:['只能通过外网地址进行访问','其他方式都不能解决','换其他地域的内网地址进行访问，如华北1（青岛）地域的通用内网地址（oss-cn-qingdao-internal.aliyuncs.com）','通过VPC专用的OSS内网地址进行访问，vpc100-oss-cn-beijing.aliyuncs.com'],exp:'在VPC的环境中ECS连接oss-cn-beijing-internal.aliyuncs.com这个地址不通。这个是因为OSS针对VPC是有一套自己的内网地址，所以需要用北京：vpc100-oss-cn-beijing.aliyuncs.com，参考链接：http://docs-aliyun.cn-hangzhou.oss.aliyun-inc.com/pdf/vpc-troubleshooting-intl-zh-2017-02-06.pdf'},
  {id:400,type:'single',answer:'C',stem:'网安法提出：“网络运营者应当采取技术措施和其他必要措施，确保其收集的个人信息安全，防止信息泄露、毁损、丢失”。小李是某网站站长，为了保护网站页面中出现的网站用户手机号等敏感隐私数据，小李可以使用WAF防火墙提供的功能。',opts:['HTTPS高级配置','网页防篡改','防敏感信息池露','黑白名单配置'],exp:'根据《网络安全法》要求，网络运营者需确保个人信息安全。WAF（Web应用防火墙）中的防敏感信息泄露功能可实时监控并拦截服务器响应中的敏感数据（如手机号），通过规则匹配或数据脱敏技术防止其被意外传输或展示。HTTPS配置侧重于加密传输，防篡改保护页面内容完整性，黑白名单用于访问控制，均不直接针对敏感数据泄露防护。选项C符合题干需求。答案对应《网络安全法》第四十二条相关规定。'},
  {id:401,type:'single',answer:'D',stem:'在管理控制台，对阿里云CDN加速域名进行“停用”或“删除”前，需要做操作，以确保网站可以正常访问？',opts:['保证源站服务器的带宽充足就够了','不需要做什么','保证源站服务器正常开启即可','到该域名所在的域名解析服务商处恢复域名A记录'],exp:'停用CDN加速域名，可以删除解析到此加速域名的记录，并到该域名所在的域名解析服务商处恢复原来域名解析的A记录。'},
  {id:402,type:'single',answer:'A',stem:'用户开通并配置WAF防火墙，控制台提示“未检测到CNAME接入且无流量”，或是“当前无流量”等错误信息，可能的原因不包括',opts:['机房故障的极端情况下，WAF无法正常使用','精准域名接入状态下，无CNAME接入且没有流量','泛域名接入状态下，无流量或流量很低','WAF之外还部署了CDN等代理，域名解析CDN上'],exp:'https://help.aliyun.com/knowledge_detail/45088.html'},
  {id:403,type:'single',answer:'C',stem:'在传统IT解决方案中，要想对海量数据存储实现高于99.99999999%的数据可靠性，并且在单台物理硬件发生损坏的情况下不影响正常服务，至少需要购买多台专业的存储服务器，配合双电源+双控制器+磁盘冗余+故障报警等功能才有可能完成。阿里云的服务天然就具备这个特性，即开即用。',opts:['负载均衡SLB','云数据库RDS','对象存储OSS','内容分发网络CDN'],exp:'划重点：对海量数据存储实现高于99.99999999%的数据可靠性。所以需要使用对象存储OSS服务。'},
  {id:404,type:'single',answer:'A',stem:'您部署在阿里云云服务器ECS上的服务，希望能够通过阿里云的产品来提升该服务的可用性，以下哪种方案的可用性最高？',opts:['在同一个地域的多个可用区的多台云服务器上部署应用，并挂载在同一个负载均衡实例后面','在同一个地域的同一个可用区的多台云服务器上部署应用，并挂载在同一个负载均衡实例后面','在不同地域的多个可用区的多台云服务器上部署应用，并挂载在同一个负载均衡实例后面','在不同地域的同一个可用区的多台云服务器上部署应用，并挂载在同一个负载均衡实例后面'],exp:'同一个负载均衡并不支持跨区域，所以需要在同一个地域多个可用区的服务器部署服务，从而实现高可用。'},
  {id:405,type:'single',answer:'B',stem:'对于不同类型协议的监听，负载均衡服务的健康检查功能发送不同的探测请求。针对四层UDP监听，健康检查通过探测来获取ECS实例的状态信息',opts:['UDP HEAD请求','UDP报文','UDP SYN数据包','UDP RST数据包'],exp:'针对四层UDP监听，健康检查通过UDP报文探测来获取状态信息 参考链接： https://help.aliyun.com/document_detail/85958.html?spm=a2c4g.11186623.6.626.7f5d5c4bZZHj45'},
  {id:406,type:'single',answer:'D',stem:'如果您在创建Linux操作系统的云服务器ECS实例的同时选择增加了数据盘，以下关于系统',opts:['在数据盘使用前，需要先格式化mount数据盘','可以根据业务需要，对数据盘进行多分区配置','支持对数据盘进行二次分区','如果对系统盘进行二次分区操作，不会发生什么异常'],exp:'使用第三方工具对系统盘进行二次分区操作，可能会导致云服务器ECS出现异常。'},
  {id:407,type:'single',answer:'A',stem:'弹性扩张时，弹性伸缩使用伸缩组的组内实例配置信息自动创建ECS实例，实例配置信息支持实例的规格、操作系统、用户自定义数据等。',opts:['操作系统','自定义公网IP','地域','自定义内网IP'],exp:'弹性伸缩组的实例配置信息包括实例规格、操作系统和用户自定义数据。操作系统是实例运行的基础环境，由镜像决定，属于实例配置的核心组成部分。自定义公网IP、自定义内网IP和地域均不属于实例配置项，其中地域在伸缩组层级统一设定，IP地址由系统自动分配，不可在配置中指定。'},
  {id:408,type:'single',answer:'B',stem:'安全组是ECS实例的虚拟防火墙，用于设置单个或多个ECS实例的网络访问控制。下列关于安全组网络隔离的描述，是不正确的。',opts:['安全组内网络隔离是ECS实例之间的隔离','安全组内网络隔离是一种自定义的网络连通策略，对于默认安全组和新建的安全组无效','设置了组内网络隔离的安全组，仅在安全组内没有任何自定义规则的情况下保证安全组内实例之间网络隔离。','安全组内既设置了组内隔离，又设置了让组内实例之间可以互相访问的ACL，所以这种情况设置了组内网络隔离但实例仍然互通'],exp:'安全组内网络隔离是一种可配置的虚拟防火墙策略，用于控制同一安全组内ECS实例之间的网络访问。在阿里云中，该功能适用于所有安全组，包括默认安全组和新建的安全组，但需手动设置启用。选项B错误地声称其对默认和新建安全组无效，与实际机制不符'},
  {id:409,type:'single',answer:'D',stem:'某行业大牛的个人博客只有一些静态页面，他想用最经济且简单的方式将网站部署在阿里云上，另外，由于很多浏览器已经把没有使用HTTPS协议的网站全部标记为不安全，他想要为网站开启HTTPS协议支持。根据该用户的情况，最推荐的阿里云方案是',opts:['使用虚拟主机部署博客网站，并在虚拟主机中部署SSL证书','使用云服务器ECS部署博客网站，并在ECS中部署SSL证书','使用云服务器ECS和负载均衡SLB部署网站，将SSL证书托管在SLB上','使用对象存储OSS存储网站静态页面，绑定自定义域名，并开启证书托管'],exp:'https://help.aliyun.com/document_detail/67323.html?spm=a2c4g.11186623.6.714.205c300e2uEQAZ'},
  {id:410,type:'single',answer:'D',stem:'以下安全功能需要单独购买，不是在创建阿里云的云服务器ECS实例的同时可以免费获得的。',opts:['基础DDoS防护','木马查杀','防暴力破解','DDoS高防IP'],exp:'DDoS高防IP是需要付费购买的功能。基础DDoS防护是可以免费开通的。'},
  {id:411,type:'single',answer:'B',stem:'某企业托管到传统IDC机房的服务器（包括windows和Linux两种操作系统），每天晚上有来自很多国家的IP地址对其管理密码进行尝试破解。为此管理员小王很是担心，因为工作需要，远程管理端口必须对公网开放。小王听说阿里云的云盾可以帮助客户提升安全防护的能力，想把系统迁到阿里云上。在阿里云上开通功能可以减少密码被暴力破解的可能。',opts:['内容安全（原名：绿网）','安骑士','DDoS基础防护','态势感知'],exp:'题目中问的是防止密码破解，这个是安骑士的功能点。'},
  {id:412,type:'single',answer:'A',stem:'在使用阿里云负载均衡SLB产品时，如果从负载均衡服务中移除ECS实例，直接将ECS实例从负载均衡实例中移除，可能会造成业务闪断。建议先执行以下哪个步骤？',opts:['将ECS实例权重修改为0','先停止ECS实例上web服务','在管理控制台里将ECS实例停止','将负载均衡的健康检查功能关闭'],exp:'题目问的是：直接将ECS实例从负载均衡实例中移除，可能会造成业务中断。因为有部分用户的请求可能这台ECS此时正在处理，所以如何保证业务不中断也能把ECS给下线（从负载均衡中移除）了。所以最好的办法就是”将ECS实例权重修改为0“。这样ECS就不会再被分配新的请求了，同时待权重修改之前的请求处理完成了，就可以把该ECS直接从负载均衡中移除了。文档释义：将负载均衡后端ECS的权重置零，相当于将该ECS手工下线，用于对相应ECS进行重启、配置调整等主动运维。而由于该状态下，业务数据是无法经负载均衡转发到该服务器的，所以健康检查相应的自然会显示异常。'},
  {id:413,type:'single',answer:'D',stem:'在OSS中，用户操作的基本数据单元是文件(Object)。单个文件的最大允许大小根据上传数据方式不同而不同。下列哪种描述不属于OSS分块上传？',opts:['支持断点上传','网络条件较差，经常连接断开','上传超过100MB文件','上传最大不得超过5GB'],exp:'OSS分块上传适用于大文件（如超过100MB），支持断点续传，适合网络条件差的情况。选项D中“上传最大不得超过5GB”描述错误，因为分块上传允许文件大小远超过5GB（如可达48.8TB），这通常是简单上传的限制'},
  {id:414,type:'single',answer:'A',stem:'创建阿里云弹性伸缩(AutoScaling)伸缩组的时候，可以配置“移出策略”。现将移出策略配置为“最早伸缩配置对应的实例”，以下说法中正确的是？',opts:['只移除通过弹性规则创建的ECS实例，并且是按照伸缩配置创建ECS实例的时间先后顺序优先移出先建的ECS实例','根据ECS实例的创建时间判断，优先移出先建的ECS实例','只移除手工添加的ECS实例，并且是按照伸缩配置创建ECS实例的时间先后顺序优先移出先建的ECS实例','根据ECS实例添加到伸缩组的时间判断，优先移出先添加ECS实例'],exp:'顾名思义，最先的，伸缩配置创建的实例。'},
  {id:415,type:'single',answer:'C',stem:'阿里云内容分发网络CDN在基本配置之上为用户开放了很多优化功能，包括：页面优化、智能压缩、过滤参数、拖拽播放等。以下关于这些优化功能的描述，错误的是',opts:['可以压缩与去除页面中无用的空行、回车等内容，有效缩减页面大小','支持多种内容格式的智能压缩，有效减少用户传输内容的大小','可以提高站点的整体安全性，防止源站服务器帐号被爆力破解','可实现视频、音频点播的随机拖拽播放功能'],exp:'提高站点的整体安全性不属于CDN性能优化的一部分，参考链接（性能优化部分）：https://www.alibabacloud.com/help/zh/doc-detail/64935.htm'},
  {id:416,type:'single',answer:'A',stem:'题干：416/1023、某视频公司，使用负载均衡SLB将用户的访问请求分发到30台云服务器ECS实例上去，由这些配置相同的ECS实例来响应用户的请求。每天晚上20：00到次日凌晨2：00期间，业务量会大幅增加，基本上会比其他时间段增加1倍左右，为了能正常响应用户的请求，从成本和容易实现的角度，以下哪种解决办法最可取？',opts:['使用阿里云弹性伸缩（Auto Scaling），通过合适的配置，自动增加ECS实例或者减少ECS实例','使用自定义的镜像，手工创建30台云服务器ECS实例，在每天晚上20:00前，手工增加到SLB中去，次日凌晨2:00再从SLB中移除','基于自定义的镜像创建30台云服务器ECS实例，添加到SLB中去，通过设置权重，让这些ECS实例在每天晚上20:00到次日凌晨2:00之间可以响应用户需求，其他时间段权重修改为0','使用阿里云弹性伸缩（Auto Scaling），通过合适的配置，自动提升每台ECS实例的规格'],exp:'题目要求成本和容易的角度，所以是通过动态伸缩更加简单和节省成本。'},
  {id:417,type:'single',answer:'B',stem:'您在阿里云购买了一台云服务器ECS实例，部署好Python环境后，通过能最简单快捷的监控Python进程是否持续运行，当进程不存在时发出报警信息。',opts:['自己写脚本监控','使用ECS监控中的进程监控','使用站点监控','去ECS控制台查看'],exp:'题目中要求最简单查看Python进行是否在运行，所以最简单是通过ECS监控直接查看Python的进程。'},
  {id:418,type:'single',answer:'C',stem:'在众多的网络攻击类型中，“钓鱼网站”是最常见的攻击之一。钓鱼网站的页面看上去与真实网站界面完全一致，要求访问者提交账号和密码，以此来骗取用户银行或信用卡账号、密码等私人资料。以下有关钓鱼网站的传播手段，说法错误的是',opts:['通过QQ、旺旺等客户端聊天工具发送传播钓鱼网站链接','在搜索引擎、中小网站投放广告，吸引用户点击钓鱼网站链接','银行在官方网站的显著位置发布钓鱼网站链接','通过Email、论坛、博客、SNS网站批量发布钓鱼网站链接'],exp:'钓鱼网站不会在银行的官方网站发布钓鱼链接，参考链接：https://help.aliyun.com/knowledge_detail/56273.html'},
  {id:419,type:'single',answer:'D',stem:'中国大陆范围内的网站都需要做ICP备案，在架构设计时应该告诉客户提前就需要准备提交备案？',opts:['网站上线前一天','网站上线当天','网站上线前一周','网站上线前一个月'],exp:'为了保证网站能按时上线，需要在网站上线前一个月提交备案资料，保证留有充足的备案时间来完成备案操作。'},
  {id:420,type:'single',answer:'C',stem:'SLB支持同城Region跨数据中心容灾还可以通过哪种服务结合支持跨Region容灾？',opts:['云数据库RDS','负载均衡SLB','DNS轮询','弹性伸缩Auto Scaling'],exp:'跨Region容灾需要全局流量调度能力。DNS轮询通过将域名解析指向不同Region的IP地址池，实现跨地域流量切换。当主Region故障时，DNS解析可快速切换至备Region的SLB实例，配合SLB的本地容灾能力形成多级容灾体系。其他选项中，RDS用于数据库高可用，Auto Scaling用于弹性扩容，均不直接参与跨地域流量调度'},
  {id:421,type:'single',answer:'A',stem:'云计算的一个显著特点是提供按需供应、按需付费的服务。所有的资源以资源池的方式存在，提供配置化的访问方式，资源类型包括网络、服务器、存储、应用和服务。关于资源池的说法错误的是？',opts:['资源池无法突破单台物理机所拥有的资源','资源池包含了多个相同类型的资源','资源池是实现计算服务化的基础','不同的资源池有不同的资源池优化方法'],exp:'资源池的解释：云计算的核心理念就是通过互联网络为用户提供按需的IT资源服务。为了达到这个目标，云服务提供商首先要保证拥有一个容量充足的资源池以满足在并发的业务高峰时刻仍能满足用户的服务要求。参考链接：http://book.51cto.com/art/201202/319793.htm'},
  {id:422,type:'single',answer:'A',stem:'云计算以多种形式对外提供服务，比如提供给消费者的服务是运行在云计算基础设施上的应用程序，消费者可以在各种设备上通过瘦客户端界面访问，如浏览器（例如基于Web的邮件），不需要管理或控制任何云计算基础设施，包括网络、服务器、操作系统、存储，甚至独立的应用能力等等，仅需要对应用进行有限的、特殊的配置。这种服务形式被称作',opts:['SaaS(软件即服务)','PaaS(平台即服务)','IaaS(基础设施即服务)','DaaS(数据存储即服务)'],exp:'题目中说了是消费者通过搜客户端界面访问，提到客户端那就相当于日常使用的软件，所以选择SaaS(软件即服务)。'},
  {id:423,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling),是根据用户的业务需要和策略,自动调整其弹性计算资源的管理服务。支持用户添加已有的云服务器ECS实例到伸缩组中去，但是对云服务器ECS实例所在地域有一定要求。以下说法中正确的是？ 选项：',opts:['该实例和伸缩组必须在同一个地域(Region)中,对可用区(Zone)没有要求','该实例和伸缩组必须在同一个地域(Region)的同一个可用区(Zone)中','对该实例和伸缩组的地域(Region)和可用区(Zone)没有要求,','一个伸缩组最多可以跨两个地域(Region),添加完ECS实例后,要保证伸缩组中的所有ECS实例所在的区域不超过两个'],exp:'添加的ECS需要和伸缩组处于同一个地域(Region)'},
  {id:424,type:'single',answer:'C',stem:'负载均衡提供性能共享型实例和性能保障型实例，性能保障型实例提供可靠的性能指标。下列选项中不属于性能保障型实例的关键指标。',opts:['最大连接数','每秒新建连接数','每秒新增查询数','每秒查询数'],exp:'实例规格 负载均衡提供性能共享型实例和性能保障型实例，性能保障型实例提供可靠的性能指标。'},
  {id:425,type:'single',answer:'C',stem:'云盾反欺诈服务是阿里巴巴的什么能力开发的？',opts:['BGP网络','DDos攻防经验','大数据风控服务','弹性计算'],exp:'云盾反欺诈服务是阿里巴巴的大数据风控服务能力开发。参考链接：https://help.aliyun.com/knowledge_detail/39305.html'},
  {id:426,type:'single',answer:'C',stem:'负载均衡的操作日志需要在控制台查看。操作审计记录云账号资源操作，提供操作记录查询，并可以将记录文件保存到指定的OSS存储空间。',opts:['KMS','ConsoleSignin','ActionTrail','RAM'],exp:'题目中描述的是关于操作审计记录云账户资源操作，提供操作记录查询并可以将记录文件保存到指定的OSS存储空间的功能。现在我们来逐一分析选项： A. KMS（Key Management Service）：这是密钥管理服务，主要用于加密密钥的创建、管理和使用，与操作审计记录云账户资源操作无关。 B. ConsoleSignin：这通常指的是控制台登录事件，它记录的是用户登录控制台的行为，并不涉及对云账户资源的具体操作记录。 C. Action Trail：这正是操作审计服务，它能够记录云账户资源操作，提供操作记录查询，并且支持将记录文件保存到指定的OSS存储空间，与题目描述完全吻合。 D. RAM（Resource Access Management）：这是资源访问管理服务，主要用于管理用户对云资源的访问权限，不涉及操作审计记录。 综上所述，正确答案是C选项，即Action Trail。'},
  {id:427,type:'single',answer:'C',stem:'对于入网流量，负载均衡会根据用户在控制台或API上配置的转发策略，对来自前端的访问请求进行转发和处理，如果相应的负载均衡实例服务端口使用的是那么LVS集群内每个节点都会根据负载均衡实例负载均衡策略，将其承载的服务请求按策略直接分发到后端ECS服务器。',opts:['二层协议','三层协议','四层协议','七层协议'],exp:'四层采用开源软件LVS（Linux Virtual Server）+ keepalived的方式实现负载均衡，并根据云计算需求对其进行了个性化定制。'},
  {id:428,type:'single',answer:'C',stem:'阿里云的云盾安骑士可以记录远程访问服务器的源IP地址，并对频繁连接的可疑IP进行屏蔽，日常运维过程中需要通过功能对系统管理员常用的IP进行设置。',opts:['安全组','webshell云查杀','IP白名单','常用登录地管理'],exp:'题目中明确说了对频繁连接的可疑IP进行屏蔽，所以通过IP白名单直接只允许指定的IP访问即可。'},
  {id:429,type:'single',answer:'A',stem:'负载均衡SLB是对多台服务器进行流量分发的负载均衡服务，提供公网和私网两种类型的负载均衡实例。关于公网类型负载均衡的IP地址，以下说法正确的是',opts:['系统会为其分配一个公网服务地址','系统会为其分配一个弹性公网IP','系统会为其分配一个弹性公网IP','系统会为其分配一个弹性公网IP和一个私网服务地址'],exp:'在您创建公网负载均衡实例后，系统会为其分配一个公网服务地址，您可以将您的域名和该公网服务地址进行绑定，对外提供服务。 参考链接： https://help.aliyun.com/document_detail/85931.html?spm=a2c4g.11186623.6.568.15f27ebc7rVBln'},
  {id:430,type:'single',answer:'A',stem:'在互联网环境中，云服务器ECS要想被别的应用或网民访问到，就必须开通相应的“端口”，比如常见的HTTP应用工作在80端口，FTP应用工作在21端口，以下是某管理员对云服务器ECS配置的策略，请您选出最安全的一种方法',opts:['云服务器ECS实例购买成功后，立即从管理控制台启用了安全组防火墙，并对公网只开通必要的服务端口','用户打算在1台云服务器ECS实例上搭建多个应用，为了方便管理，采用了默认的设置，开放全部端口','云服务器ECS实例购买成功后，立即从管理控制台启用了安全组防火墙，对公网开放的端口范围是从0到1024','云服务器ECS实例购买成功后，立即从管理控制台启用了安全组防火墙，对公网开放全部端口，ECS实例对外只能访问80端口'],exp:'按照企业上云的最佳安全策略，应该是需要用到ECS的指定的服务端口才去开通必要的服务端口。避免由于端口暴露导致ECS的安全问题。'},
  {id:431,type:'single',answer:'A',stem:'某电商网站被竞争对手攻击，网站遭受大量的恶意CC攻击，长时间占用消耗服务器的核心资源，造成服务器性能瓶颈，如CPU、内存、带宽，导致网站业务响应缓慢或是无法正常提供服务。如果你是阿里云安全工程师，你会建议用户开通 选项：',opts:['WAF防火墙','云安全中心','内容安全','安全众测'],exp:'CC攻击属于应用层DDoS攻击，通过大量合法请求耗尽服务器资源。WAF防火墙可识别并拦截恶意HTTP/HTTPS请求，有效防御CC攻击，保护服务器核心资源不被过度占用。'},
  {id:432,type:'single',answer:'B',stem:'［负载均衡实例采用集群部署，可实现会话同步，以消除服务器单点故障，提升冗余，保证服务的稳定性。来自公网的请求通过等价多路径路由到达LVS集群，LVS集群内的每台LVS通过（）将会话同步到该集群内的其它LVS机器上，从而实现LVS集群内各台机器间的会话同步。',opts:['四层转发','组播报文','七层转发','nginx'],exp:'负载均衡通过设置虚拟服务地址，将添加的同一地域的多台ECS实例虚拟成一个高性能和高可用的后端服务池，并根据转发规则，将来自客户端的请求分发给后端服务器池中的ECS实例。参考链接：https://help.aliyun.com/document_detail/67915.html'},
  {id:433,type:'single',answer:'A',stem:'在购买ECS的时候必须设置安全组，安全组在ECS中是非常重要的服务，其中安全组的主要使用方式为',opts:['白名单的使用','黑名单的使用','黑名单出入网规则限制','内网入流量限制'],exp:'安全组是云服务器的虚拟防火墙，用于控制实例的入站和出站流量，其核心机制是基于白名单策略，仅允许明确授权的流量通过，未列明的默认拒绝。该方式确保最小权限原则下的安全防护，符合主流云平台的安全配置规范。'},
  {id:434,type:'single',answer:'C',stem:'某用户在创建ECS实例（分配了公网IP地址）后的六小时内，想要更换该ECS实例的公网IP地址，但在控制台操作界面找不到更换公网IP选项，这种问题的原因可能是',opts:['创建的ECS实例为经典网络实例','ECS实例处于Stopped状态','ECS实例为VPC网络，停止实例时选择“停机不收费”','ECS实例为VPC网络，且分配了私网IP地址'],exp:'在阿里云VPC网络中，若ECS实例选择"停机不收费"模式，停止实例后公网IP会被自动释放。由于题目中用户已分配公网IP且在控制台找不到更换选项，此时实例可能处于"停机不收费"状态导致公网IP资源已被回收，无法进行更换操作。选项C正确揭示了VPC网络下该特殊停机模式对公网IP的影响机制，其他选项均与题干描述的现象无直接关联'},
  {id:435,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)的冷却时间是指在同一个伸缩组内，当有一个伸缩活动被成功执行后的一段冷却时间内，该伸缩组不执行其他的伸缩活动。以下关于冷却时间的开始计时的时间点的说法正确的是？',opts:['当伸缩组加入或移出多个ECS实例时，最后一个ECS实例加入或移出完成后，整个伸缩组冷却时间才开始计时','当伸缩组加入或移出多个ECS实例时，第一个ECS实例加入或移出完成后，整个伸缩组冷却时间才开始计时','伸缩活动结束后，冷却时间马上开始计时','伸缩活动开始后，冷却时间马上开始计时'],exp:'伸缩活动中，最后一个ECS实例加入或移出完成后，整个伸缩组冷却时间才开始计时，伸缩活动结束并不代表最后一个ECS实例已经加入或移出完成。'},
  {id:436,type:'single',answer:'A',stem:'某新媒体公司通过手机APP提供新闻资讯服务，采用阿里云弹性伸缩(AutoScaling)来实现动态添加或者减少云服务器ECS实例，来应对业务量的变化。该公司的业务人员和技术人员相互配合，估算出他们所需要的资源为闲时10台ECS，但是有几个时间段业务量会比较多，基本上集中在7:30到9:00，18:30到20:00，随着时间点的不同，所需的ECS实例在10到20个之间动态变化。他们在伸缩组中将最小实例个数设置为10，最大实例个数设置为20。从容易部署以及节省成本的角度来考虑，他们还需要配置一个什么模式的任务？ 选项：',opts:['动态模式','定时模式','固定数量模式','lazy模式'],exp:'题目中说了，ECS在这段时间内是动态变化的，以及要从节省成本的角度出发，定时任务一下子从10台增加到20台，这样虽然满足业务要求但是成本增加了，所以选择动态任务既可以满足要求还可以根据需求适当扩展ECS减少成本。'},
  {id:437,type:'single',answer:'A',stem:'OSS提供标准、低频访问、归档三种存储类型，全面覆盖从热到冷的各种数据存储场景。其中类型提供高可靠、高可用、高性能的对象存储服务，能够支持频繁的数据访问。',opts:['标准存储','低频访问','归档存储','标准和归档存储'],exp:'标准存储提供高可靠、高可用、高性能的对象存储服务，支持频繁的数据访问，适用于热数据场景。低频访问存储适用于不频繁访问的数据，归档存储适用于极低访问频率的冷数据。题干中描述的“频繁数据访问”特性仅与标准存储直接对应。'},
  {id:438,type:'single',answer:'B',stem:'阿里云的云盾先知计划的目的是帮助企业建立私有的中心，以较低的成本发现企业自身企业的安全风险，并得到解决方案。',opts:['私有数据中心','应急响应中心','病毒防护中心','远程备份中心'],exp:'先知计划是一个帮助企业建立私有应急响应中心的平台（帮助企业收集漏洞信息）。注意和其他题目的题干的区别。'},
  {id:439,type:'single',answer:'D',stem:'以下关于SLB使用场景的描述，是使用于4层（TCP)协议配置SLB监听规则',opts:['后端服务器应用采用HTTP协议的负载均衡场景','后端服务器应用采用HTTP、HTTPs、TCP协议的负载均衡场景','后端服务器应用采用HTTPs协议的负载均衡场景','后端服务器应用采用TCP协议的负载均衡场景'],exp:'四层负载均衡基于传输层协议，SLB的TCP监听规则对应OSI模型第四层，核心特征是直接转发TCP流量而不解析应用层内容。根据阿里云架构设计，当后端服务器采用TCP协议时需配置四层监听，而HTTP/HTTPS属于七层应用协议需对应七层监听规则，因此仅D选项符合四层协议场景特征。'},
  {id:440,type:'single',answer:'A',stem:'阿里云的专有网络VPC下的云服务器ECS实例如果绑定了EIP，就可以实现该服务器ECS实例对公网的服务。出于安全的考虑要限制某台绑定了EIP的云服务器ECS实例的3389远程端口的访问，可以通过方法来实现。',opts:['在这台云服务器实例的安全组规则中添加一条内网规则，拒绝TCP协议来自3389端口的入方向访问','在这台云服务器实例的安全组规则中添加一条外网规则，拒绝TCP协议来自3389端口的入方向访问','在这台云服务器实例的安全组规则中添加一条内网规则，拒绝TCP协议来自3389端口的出方向访问','在这台云服务器实例的安全组规则中添加一条外网规则，拒绝TCP协议来自3389端口的出方向访问'],exp:'在控制台里面，专用网络VPC下面的ECS，不管是否绑定了EIP，在设置安全组的时候，只可以设置内网规则，外网规则是不可以选的。因为对于其来说，内网规则等同于外网规则，所以不要被题目中的"对公网的服务"误导。所以此题应该选择添加一条内网规则，拒绝TCP协议来自3389端口的入方向访问。'},
  {id:441,type:'single',answer:'C',stem:'随着业务的增长，您现有的阿里云的云服务器ECS实例的系统盘出现了存储资源不足的问题，阿里云',opts:['通过更换ECS实例的系统盘操作来实现系统盘的扩容','扩容ECS实例的系统盘时需要停止您的实例，因此会短暂中断您的业务','扩容系统盘之后您的ECS实例的IP地址会发生变化','扩容系统盘后，用户创建的快照会保留'],exp:'扩容系统盘并不会导致网络层的IP地址会发生变化。'},
  {id:442,type:'single',answer:'A',stem:'将基础设施作为服务的云计算服务类型是服务。',opts:['IaaS','Paas','SaaS','Daas'],exp:'云计算服务模型中，基础设施即服务（IaaS）向用户提供虚拟化的计算资源（如服务器、存储、网络），用户通过互联网按需使用和管理这些资源。PaaS（平台即服务）提供开发和部署环境，SaaS（软件即服务）提供完整应用程序，DaaS（数据即服务）通常指向数据管理相关服务。题干描述符合IaaS的定义，参考《云计算与虚拟化技术》中对云服务层级的划分。选项A正确对应题干特征，其余选项涉及不同层级的服务内容。'},
  {id:443,type:'single',answer:'C',stem:'A公司管理员小牛近期发现公司的网站访问速度越来越慢，偶尔会出现无法打开的现象，从web日志中发现了数据被恶意爬取的行为，且并发访问量较大，这种情况下可以使用阿里云的安全产品进行防护。 选项：',opts:['安全管家','态势感知','Web 应用防火墙（WAF）','云安全中心（安骑士）'],exp:'划重点：从 web 日志中发现了数据被恶意爬取的行为，且并发访问量较大。所以需要用到Web 应用防火墙（WAF）的防爬虫功能。'},
  {id:444,type:'single',answer:'A',stem:'游戏行业有个明显的特点是业务流量很难预估，波动很大，例如今天上线1台云服务器ECS实例就足够处理所有的业务需求，明天可能就需要10台云服务器ECS实例来处理所有的需求。这样的场景下，您不知道所需的云服务器ECS实例的数量，准备的少无法应对业务峰值，投入的多又造成大量的资源浪费。在阿里云上，您认为应对游戏行业这种场景的最佳阿里云产品的组合方式是',opts:['负载均衡SLB+云服务器ECS+云数据库RDS+弹性伸缩Auto Scaling','负载均衡SLB+云服务器ECS+云数据库RDS','云服务器ECS+弹性伸缩Auto Scaling','云服务器ECS'],exp:'题目中游戏行业的服务，1. 需要云服务器ECS来搭建和运行网站服务；2. 需要云数据库RDS来保存用户数据；3. 需要弹性伸缩Auto Scaling跟库业务报警来实现ECS的弹性增加或减少；4. 需要负载均衡SLB来实现多个ECS之间的请求分发。'},
  {id:445,type:'single',answer:'C',stem:'购买了阿里云的云服务器ECS实例之后，对于您来说需要承担的维护工作是',opts:['磁盘设备的维护','硬件服务器的维护','应用软件的升级','网络设备的维护'],exp:'购买了阿里云的云服务器ECS实例之后，你无需关心硬件和网络的运维工作，你仅需要关心云服务器ECS上应用的部署运行情况。'},
  {id:446,type:'single',answer:'D',stem:'网络ACL是专有网络VPC中的网络访问控制功能。用户可以自定义设置网络ACL规则，并将网络ACL与交换机绑定，实现对交换机中ECS的流量的访问控制。下列关于网络ACL功能特性说法错误的是 选项：',opts:['仅过滤绑定的交换机中的ECS流量','规则是无状态的','不过滤同一交换机内的ECS间的流量','无任何规则时，会允许所有出入方向的访问'],exp:'辅助弹性网卡，且辅助弹性网卡绑定了设置网卡可见模式的EIP，那么网络ACL不过滤该ECS实例的流量。 网络ACL的规则是无状态的，设置入方向规则的允许请求后，需要同时设置相应的出方向规则，否则可能会导致请求无法响应。 网络ACL无任何规则时，会拒绝所有出入方向的访问。 网络ACL与交换机绑定，不过滤同一交换机内的ECS实例间的流量。 https://help.aliyun.com/document_detail/116626.html?spm=a2c4g.11174283.6.616.16cb6dd4a7YuHd'},
  {id:447,type:'single',answer:'B',stem:'您在创建阿里云的云服务器ECS实例时必须要选择来指定新建的云服务器ECS实例的系统盘的配置？',opts:['IP地址','镜像','安全组','区域'],exp:'ECS的系统盘的配置需要通过镜像来新建完成。'},
  {id:448,type:'single',answer:'B',stem:'专有网络可以与VPN产品结合使用实现与传统数据中心组成一个按需定制的网络环境，实现应用的平滑迁移上云？',opts:['SLB','VPN','ECS','OCS'],exp:'通过VPN专线可以将该网络与传统数据中心组成一个按需定制的网络环境。'},
  {id:449,type:'single',answer:'A',stem:'云服务器ECS提供了基础安全服务，包括异常登录检测、漏洞扫描、基线配置核查等。如果用户在创建ECS实例时，选择安全加固操作，系统会自动为新创建的ECS实例安装基础安全服务的安全插件Agent。',opts:['安全加固','登录凭证','实例RAM角色','创建部署集'],exp:'您可以按以下方式操作Agent。 • 创建ECS实例时自动安装Agent i. 登录ECS管理控制台。 ii. 在左侧导航栏，选择实例与镜像 > 实例。 iii. 在顶部菜单栏处，选择地域。 iv. 创建一台ECS实例，在镜像配置处，勾选安全加固，系统自动为新建ECS实例安装Agent。详情请参见使用向导创建实例。 参考链接： https://help.aliyun.com/document_detail/121691.html?spm=a2c4g.11186623.6.917.6751b3cf4rt6rr'},
  {id:450,type:'single',answer:'C',stem:'在您进行负载均衡服务监听配置时就可以选择是否开启会话保持。您可以针对不同的监听配置不同的会话保持策略。下列关于SLB的会话保持说法正确的是？',opts:['仅支持基于源IP的TCP层的会话保持','仅支持基于cookie的HTTP层会话保持','同时支持TCP层和HTTP层的会话保持','会话保持针对TCP层和HTTP层都是基于源IP的'],exp:'会话保持现在是既支持TCP也支持HTTP的，但是之前的是不支持tcp层的。'},
  {id:451,type:'single',answer:'B',stem:'阿里云的云服务器ECS相对于传统物理服务器的一个重要特征是，可以更为便捷地进行服务器的配置升级。下列关于云服务器ECS无缝升级的说法错误的是',opts:['云服务器ECS支持变更CPU、内存和宽带升级','云服务器ECS不支持新增数据盘','升级带宽不需要云服务器ECS进行重启','云服务器ECS的配置升级时，用户不需要重新部署环境或者迁移数据'],exp:'云服务器ECS支持变更配置和新增数据盘，变更配置需要重新服务但不会影响到服务器数据。'},
  {id:452,type:'single',answer:'C',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，负载均衡SLB的应用场景，不包括',opts:['消除应用层单点故障','扩展应用系统的服务能力','提高网站首页的加载速度','多可用区容灾'],exp:'负载均衡SLB的核心功能是分发流量、消除单点故障（A）、扩展服务能力（B）以及通过多可用区部署实现容灾（D）。提高网站首页加载速度通常更依赖于内容分发网络（CDN）、缓存、前端优化等技术，并非SLB的直接应用场景，因此不包括C'},
  {id:453,type:'single',answer:'B',stem:'阿里云云服务器ECS提供多种实例规格，满足用户多种业务场景的需要。某中小企业用户想要使用两台ECS，一台部署单个Tomcat服务，另外一台部署Memcache，以下配置最推荐的是 选项：',opts:['Tomcat: 4核4G, Memcache: 2核8G','Tomcat: 4核4G, Memcache: 2核16G','Tomcat: 4核8G, Memcache: 2核8G','Tomcat: 4核8G, Memcache: 2核16G'],exp:'这题本身就不严谨，相对而言选择B'},
  {id:454,type:'single',answer:'C',stem:'题干：454/1023、某客户在阿里云购买了几台ECS实例后，为了增强应用的可用性，实现高可用架构，想要通过负载均衡实现对多台ECS实例进行流量分发的服务，下列选项中可能会造成流量分发失败的选项是',opts:['负载均衡SLB实例和后端提供服务的云服务器ECS实例规格配置可以不同','负载均衡SLB实例和后端提供服务的云服务器ECS实例可以不在同一可用区','负载均衡SLB实例和后端提供服务的云服务器ECS实例可以不在同一地域。','负载均衡SLB实例和后端提供服务的云服务器ECS实例带宽设置可以不同'],exp:'阿里云负载均衡 SLB 实例必须与后端 ECS 实例部署在同一地域，不同地域的实例因网络隔离无法直接通信。SLB 支持跨可用区绑定 ECS（保障高可用），实例规格、带宽差异不影响基础流量分发功能，仅影响性能。参考阿里云负载均衡产品文档的地域约束说明。选项 C 地域不一致会导致流量无法到达后端 ECS，其余选项均符合 SLB 流量分发正常工作的条件。'},
  {id:455,type:'single',answer:'B',stem:'某用户使用负载均衡SLB和云服务器ECS搭建网站，出于安全考虑，网站已部署SSL证书，使用HTTPS协议访问，现在，其希望将用户的HTTP访问重定向至HTTPS，最简单的实现方式是',opts:['开启SLB的证书托管功能','添加一个新的监听，井开启监转发功能','为现有七层监听添加域名转发策略','为现有七层监听添加路径转发策略'],exp:'https://help.aliyun.com/document_detail/89151.html?spm=5176.11065259.1996646101.searchclickresult.5c932000JHUZCJ'},
  {id:456,type:'single',answer:'B',stem:'由于使用隧道封装技术对云服务器的IP报文进行封装，所有云服务器的信息不会进入物理网络，实现了不同云服务器间网络隔离，因此也实现不同专有网络间网络隔离。',opts:['物理层','数据链路层','传输层','应用层'],exp:'由于使用隧道封装技术对云服务器的IP报文进行封装，所以云服务器的数据链路层（二层MAC地址）信息不会进入物理网络，实现了不同云服务器间二层网络隔离，因此也实现了不同专有网络间二层网络隔离。'},
  {id:457,type:'single',answer:'B',stem:'阿里云OSS产品的账单费用由三部分组成，包括：存储空间费用、流量费用和OSSAPI请求费用。每一次对OSS的操作都算作一次API请求，上传文件是PUT请求，下载文件是GET请求。OSSAPI请求费用的付费方式支持',opts:['包年包月和按量付费','只有按量付费','只有包年包月','按天计费和按量付费'],exp:'OSS每小时结算一次调用 OSS API 的请求费用。目前只支持按量付费：每万次请求的单价 * 每小时实际请求次数/10000。参考链接：https://help.aliyun.com/document_detail/173536.html?spm=a2c4g.11186623.6.573.264444ffQ0pYv0'},
  {id:458,type:'single',answer:'A',stem:'下列参数代表的是负载均衡SLB实例的唯一标识？',opts:['LoadBalancerId','RegionId','Address','LoadBalancerName'],exp:'负载均衡实例ID即LoadBalancerId是来区分不同负载均衡SLB实例的唯一标识。'},
