  {id:928,type:'single',answer:'C',stem:'您管理的网站部署在阿里云的云服务器ECS实例上。您非常担心自己的云服务器ECS实例会遭受来自网络的暴力密码破解。阿里云的（）产品提供了检测和防止云服务器ECS实例遭受暴力密码破解的安全防护功能。',opts:['对象存储OSS','云监控','云安全中心','负载均衡SLB'],exp:'对象存储提供静态存储，云监控提供监控功能，SLB提供服务器负载，只有云安全中心提供安全防护功能。'},
  {id:929,type:'single',answer:'C',stem:'「某企业由于历史原因，在企业内部多套业务系统上分别需要使用AD账户、钉钉账户和企业微信账户进行使用，多套账户并存导致管理成本高，账户变更等需要在多点重复操作，容易导致错配、漏配问题，且消耗时间精力。此时可以通过购买阿里云来作为企业账户连接器，打通不同的身份源，简化管理操作。',opts:['终端访问控制系统UEM','办公安全平台SASE','云身份服务 IDaaS','访问控制RAM'],exp:'https://help.aliyun.com/document_detail/408886.html?spm=a2c4g.750001.0.i1'},
  {id:930,type:'single',answer:'D',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，负载均衡SLB的应用场景不包括以下哪一项？',opts:['扩展应用系统的服务能力','消除应用层单点故障','多可用区容灾','提高网站首页的加载速度'],exp:'本题单选正确答案为D。D（提高网站首页的加载速度）符合题意。阿里云ACP云计算工程师认证重点考查ECS、VPC、OSS、RDS、SLB、DNS、CDN等核心云服务的架构与配置。理解各选项对应的产品功能与使用场景，有助于快速定位正确答案，建议结合官方文档深入学习。'},
  {id:931,type:'single',answer:'D',stem:'专有网络的VPC路由条目指定了网络流量的导向目的地，由目标网段、下一跳类型、下一跳三部分组成。某用户需要创建一条自定义路由条目，用于将VPC网络通过高速通道连接到用户本地IDC，该用户的路由条目中，以下哪项是下一跳类型？',opts:['VPN网关','NAT网关','路由器接口(专有网络方向)','路由器接口(边界路由器方向)'],exp:'题干要求以高速通道连接到用户本地IDC，即专线，则需要创建边界路由器VBR，显然下一条类型为路由器接口（边界路由器方向）。参考链接：https://help.aliyun.com/document_detail/97768.html'},
  {id:932,type:'single',answer:'B',stem:'「1硬件虚拟化是使用软件的方法重新定义划分IT资源，可以实现IT资源的动态分配、灵活调度、跨域共享，提高IT资源利用率，是云计算的基础技术。如果一个虚拟机因为错误而崩溃，同一物理主机上的其他虚拟机不会受到影响，这是描述虚拟化技术的哪种特性？',opts:['独立于硬件','隔离性','统一性','兼容性'],exp:'划重点:如果一个虚拟机因为错误而崩溃，同一物理主机上的其他虚拟机不会受到影响。所以描述的是虚拟化技术的隔离性。'},
  {id:933,type:'single',answer:'D',stem:'题干：457/820、「1如果客户想对访问阿里云对象存储OSS的IP进行限制，只允许有限的几个IP地址下载OSS上的文件，可以通过以下哪种方式实现？',opts:['在IP白名单选项中添加IP','OSS本身不提供基于IP限制访问权限的能力，可以在OSS前面部署SLB，然后在SLB上配置IP白名单','在IP黑名单选项中添加IP','添加Bucket授权策略（Bucket Policy）中的IP访问条件'],exp:'新版对象存储添加Bucket授权策略，可对授权资源(整个bucket，指定资源)，授权用户(匿名用户，子账号，其他账号)，授权操作(只读，读写等)，条件(参考链接：/HTTP访问，特定IP访问，特定IP不能访问以及仅限那个VPC网络访问)。'},
  {id:934,type:'single',answer:'C',stem:'某企业想在企业内部签发和管理自签名私有证书，用于企业内部的应用身份认证和数据加解密。此时可选择服务，通过简单的可视化操作，搭建企业自己的私有证书平台仅选择一个选项。合规CA中间CA私有CA证书托管',opts:['合规CA','中间CA','私有CA','证书托管'],exp:'阿里云数字证书管理服务提供PCA（私有CA）服务，您可以在无需自建和维护公共密钥基础设施（PKI）的情况下，以较低的成本创建企业内部CA。 https://help.aliyun.com/document_detail/208553.html'},
  {id:935,type:'single',answer:'D',stem:'开通阿里云对象存储OSS服务后，您首先需要使用OSS管理控制台或OpenAPI创建Bucket来存储文件。创建Bucket时，“所属地域”这个属性必须要确定，尤其是云服务器ECS实例需要通过内网访问OSSBucket的场景，Bucket“所属地域”必须选择与ECS实例相同的地域。以下有关“所属地域”的说法中，哪项是正确的？ 选项：',opts:['Bucket创建后，要想修改“所属地域”属性，需申请特殊权限','Bucket创建后，如果未上传任何文件，则“所属地域”属性可以更改','Bucket创建后，“所属地域”属性可随时更改','Bucket创建后，“所属地域”属性不可更改'],exp:'Bucket创建后，所属地域不可更改。'},
  {id:936,type:'single',answer:'B',stem:'如果你需要为网站防御DDoS攻击，可以将网站接入DDoS高防。接入DDoS高防时，需要在DDoS高防控制台添加一条网站配置，设置网站业务接入DDoS高防后的流量转发信息。在配置网站信息时，如果填写了多个源站IP地址，则DDoS高防默认会以的方式转发网站访问流量至源站，自动实现负载均衡。',opts:['Least time','IP Hash','加权轮询','最小连接数'],exp:'DDoS高防配置多个源站时如何进行负载均衡？ 网站业务通过源地址HASH方式进行负载均衡。非网站业务可通过加权轮询的方式轮询转发。https://help.aliyun.com/document_detail/56296.html'},
  {id:937,type:'single',answer:'B',stem:'网络负载均衡NLB可作为企业业务入口，同时处理海量并发连接，同时可以基于业务变化自动弹性伸缩，业务波动时无需手工干预，降低了运维管理成本。阿里云提供公网和私网两种类型的NLB，关于网络类型说法正确的是',opts:['公网类型的NLB实例不支持拥有私网IP','在创建私网类型的NLB实例时，系统会为其分配私网IP','在创建公网类型的NLB实例时，系统只会为其分配公网IP','NLB实例不支持公网和私网之间的类型转换'],exp:'在创建公网类型的 NLB实例时，系统会为其分配公网IP和私网IP，每个可用区包含一个公网IP和一个私网IP。https://help.aliyun.com/document_detail/439130.html'},
  {id:938,type:'single',answer:'A',stem:'「阿里云OSS产品的账单费用由三部分组成：存储空间费用、流量费用和OSSAPI请求费用。每次对OSS的操作都算作一次API请求，上传文件是PUT请求，下载文件是GET请求。OSSAPI请求支持以下哪种付费方式？',opts:['只支持按量付费','包年包月和按量付费','只支持包年包月','按天计费和按量付费'],exp:'OSS的所有操作都是通过调用OSSAPI实现的，OSS会根据调用的API次数收取请求费用。且OSS请求费用只支持按量付费。参考链接：https://help.aliyun.com/document_detail/173536.html'},
  {id:939,type:'single',answer:'C',stem:'阿里云对象存储OSS里存储的文件可以进行分享和下载，当文件所在的Bucket的读写权限为私有”时，以下哪项是OSS分享链接采用的安全机制？ 选项：',opts:['在管理控制台中获取文件访问URL时，设置分享链接的访问密码，访客下载文件时凭密码访问','“私有”权限的文件对外分享时，访客只能看到文件的一部分内容(前500K)','在管理控制台中获取文件访问URL时，设置分享链接有效的时间，超过设定时间就无法下载','“私有”权限的文件对外分享时，系统会检查文件的大小，超过2M的文件不允许分享'],exp:'出于安全考虑，目前控制台针对私有bucket的获取URL链接签名操作做了优化，使用的AccessKey是临时生成的密钥对，主账号用户最长有效时间是64800秒(18小时)，RAM子账号用户以及sts用户最长有效时间是3600秒(1小时)，超时后链接就无法访问了。参考链接：https://help.aliyun.com/knowledge_detail/39530.html'},
  {id:940,type:'single',answer:'A',stem:'F公司新推出一款手机APP，将安装包链接挂在公司的官网（基于云服务器ECS实例)进行下载(安装包大小:6Mb)，上周公司在CCTV投放广告后，下载量持续爆增，用户下载速度大大降低，官网ECS实例的带宽成本也急剧上升。您建议F公司选用以下哪种阿里云产品组合解决问题？',opts:['对象存储OSS和内容分发网络CDN','对象存储OSS和弹性伸缩(Auto Scaling)','对象存储OSS和云数据库RDS','弹性伸缩(Auto Scaling)和云服务器ECS实例'],exp:'题目需要同时解决下载速度和带宽成本的问题，所以需要将APP存储到对象存储OSS中结合内容分发CDN来解决下载速度和带宽的问题。'},
  {id:941,type:'single',answer:'A',stem:'「1阿里云OSS产品的账单费用由三部分组成，包括：存储空间费用、流量费用和OSSAPI请求费用。其中存储费用是根据应用所占用的存储空间的大小计费，支持以下哪种付费方式？',opts:['只支持按量付费','包年包月和按量付费','只支持包年包月','按天计费和按量付费'],exp:'存储费用支持按量付费和资源包两种付费方式，默认按量付费，但是其他资源包也是一种按量付费的方式。参考链接：https://help.aliyun.com/document_detail/59636.html'},
  {id:942,type:'single',answer:'A',stem:'日志服务SLS提供分析功能，该功能结合了查询功能和SQL计算功能。如果某管理员想要利用分析功能进行实时监控系统的日志分析，则必须将日志存储在中，且在配置索引时打开对应字段的开启统计开关。',opts:['Project','MetricStore','Standard Logstore','Query Logstore'],exp:'日志服务立即开始采集日志，并默认为您创建专属Project、Logstore以及配置索引。https://help.aliyun.com/document_detail/171391.html'},
  {id:943,type:'single',answer:'C',stem:'共享带宽提供地域级带宽共享和复用功能，可以将同地域下的弹性公网IP添加到共享带宽实例中，复用共享带宽中的带宽，节省公网带宽使用成本。某用户购买了包年包月的共享带宽实例，但是在每天中午12点业务访问量大，导致带宽不够，此时可通过功能灵活应对业务带宽峰值波动',opts:['续费变配功能','弹性变配功能','短时升配功能','变配功能'],exp:'https://help.aliyun.com/document_detail/65227.html'},
  {id:944,type:'single',answer:'D',stem:'「云数据库Redis具有性能卓越、架构灵活、安全性强、可用性高等特点，吸引越来越多的应用策略是指Redis周期性地为引擎中保存的数据创建快照，生成文件保存到磁盘中，实现数据的持久化。',opts:['AOF持久化','性能增强型AOF持久化','Redis-shake备份','RDB持久化'],exp:'RDB持久化是指Redis周期性地为引擎中保存的数据创建快照,生成RDB文件,保存到磁盘中,实现数据的持久化。https://help.aliyun.com/document_detail/43886.html'},
  {id:945,type:'single',answer:'B',stem:'阿里云提供了多种连接ECS实例的方式，如果使用SSH方式登录ECS（Linux）失败，且没有明确的报错信息，首先应采取以下哪项处理措施？',opts:['发起工单流程','检查ECS运行状态','检查ECS安全组规则','尝试使用控制台VNC登录'],exp:'SSH登录失败时没有明确的报错信息，可查看官方给出的排查流程图，明确第一步应该先检查ECS运行状态。参考链接：https://help.aliyun.com/document_detail/41470.htm#WDGZz'},
  {id:946,type:'single',answer:'D',stem:'弹性伸缩AS在企业中有广泛的应用场景，不仅适合业务量不断波动的应用程序，同时也适合业务量稳定的应用程序。以下关于弹性伸缩的使用说法正确的是',opts:['弹性伸缩可以用于云数据库RDS的自动扩容','弹性伸缩支持自动将ECS实例或ECI实例添加到Memcache实例的访问白名单','部署在伸缩组内ECS实例或ECI实例上的应用可以是有状态应用','如果某个伸缩组关联的RDS实例、ALB服务器组、CLB实例或者CLB实例的后端服务器组被删除，则伸缩组自动解除与该资源的关联'],exp:'如果某个伸缩组关联的RDS实例、ALB服务器组、CLB实例或者CLB实例的后端服务器组被删除，则伸缩组自动解除与该资源的关联。https://help.aliyun.com/document_detail/25863.html'},
  {id:947,type:'single',answer:'A',stem:'G公司开发了一款购物的APP，系统都基于阿里云的产品构建，使用了华北1（青岛)地域的云服务器ECS实例和对象存储OSS，静态网页和图片全部放在OSS中，上线后在中国大陆范围内访问速度良好。最近公司想拓展美国市场，希望美国用户也能有较快的访问速度。您推荐G公司选用以下哪种阿里云方案？',opts:['启用美西(硅谷)地域的对象存储OSS和内容分发网络CDN','启用弹性伸缩(Auto Scaling)和内容分发网络CDN','启用弹性伸缩(Auto Scaling)和更多的云服务器ECS实例','启用华东1(杭州)和华北2(北京)双地域的对象存储OSS和内容分发网络CDN'],exp:'题目中需要美国用户使用APP时也能实现较快的速度，所以需要在美国地域开启相应的CDN功能，所以选择在美西(硅谷)地域的对象存储OSS和内容分发网络CDN。'},
  {id:948,type:'single',answer:'A',stem:'阿里云对象存储OSS提供了极高的数据可靠性，以下关于OSS可靠性的说法中，哪项是正确的？',opts:['OSS提供三重备份(每份数据保留三个副本)，出现故障时自动恢复','用户需要自己考虑数据的安全性，OSS提供了丰富的备份接口，方便用户将数据进行异地备份','OSS提供三重备份(每份数据保留三个副本)，出现故障时在人工参与下可快速恢复','OSS服务的备份是采用的物理机磁盘的RAID0+1技术方案，两块硬盘同时出现故障也不影响服务'],exp:'这个是OSS的数据可靠性的描述，OSS默认支持三份副本，通过校验保证三份副本一致，单副本损坏或丢失，会触发拷贝，保持三份。参考链接：https://help.aliyun.com/document_detail/31818.html'},
  {id:949,type:'single',answer:'C',stem:'「为帮助遭受DDoS攻击的企业快速止血，阿里云提供短期一天的DDoS攻击应急防护方案，满足申请条件的用户可以申请该应急防护方案。关于该方案的说法正确的是',opts:['DDoS攻击的带宽峰值无上限','只面向三个月内注册的新用户开放','业务从未遭受过DDoS攻击或首次被攻击','每个申请者每年可以申请多次一天应急服务'],exp:'阿里云账号注册期和保有阿里云产品的时间超过三个月。 业务从未遭受过DDoS攻击或首次被攻击。 DDoS攻击的带宽峰值小于100 Gbps。'},
  {id:950,type:'single',answer:'D',stem:'负载均衡实例采用集群部署，可实现会话同步，以消除服务器（），提升冗余，保证服务的稳定性。',opts:['存储成本高','资源浪费','性能瓶颈','单点故障'],exp:'负载均衡的目的是多台服务器同时对外提供服务，其中某台节点服务停止不影响整体，避免的服务器的单点故障。'},
  {id:951,type:'single',answer:'B',stem:'阿里云内容分发网络CDN和传统厂商的CDN相比，具有稳定快速、节约成本和简单易用三个特点。以下关于阿里云CDN稳定快速特点的描述中，哪一项是错误的?',opts:['稳定高效的性能指标，95%以上的命中率，毫秒级响应时间','CDN的全部缓存节点都采用BGP线路','先进的分布式系统架构，在国内、外均有数百个缓存节点，且节点数在不断增加','完善的监控体系和服务体系','充足的带宽和存储资源'],exp:'CDN的全部缓存节点并没有采用BGP线路，BGP线路主要为OSS，和DDoS高防IP提供服务，实现不同运营商的网站都可以快速访问。CDN则是有充足的带宽和存储资源。'},
  {id:952,type:'single',answer:'D',stem:'阿里云提供公网和私网两种类型的负载均衡服务。可以根据业务场景选择配置对外公开或对内私有的负载均衡，系统会根据客户的选择分配公网或私网服务地址，下列关于公网负载均衡的描述中，哪一项是正确的？',opts:['只能在阿里云内部使用，可以转发的请求只能来自具有负载均衡的私网访问权限的客户端','实例的服务地址会从指定的专有网络的交换机网段内分配。该负载均衡服务只能被相同VPC内的ECS实例访问','负载均衡实例的服务地址由阿里云统一分配和管理。该私网负载均衡服务只能被经典网络ECS实例访问','负载均衡实例可以通过internet将客户端请求按照指定的监听规则分发到添加的后端服务器ECS上'],exp:'通过Internet将客户端请求按照您制定的监听规则分发到添加的后端服务器ECS上。参考链接：https://help.aliyun.com/document_detail/85931.html'},
  {id:953,type:'single',answer:'A',stem:'某企业使用阿里云云服务器ECS搭建了高性能Web服务，并计划购买文件存储NAS作为共享存储托管业务数据。由于该业务系统对时延比较敏感，且管理员希望NAS具备快照功能以支持数据恢复，此时可选择满足该场景需求。',opts:['极速型NAS','文件存储CPFS','通用容量型NAS','通用性能型NAS'],exp:'通用型NAS：Linux/Windows企业应用、容器PersistentVolume(PV)、Web内容管理、数据库备份、日志存储、基因计算、Windows用户目录、Linux home目录等通用类文件共享业务。 极速型NAS：Linux时延敏感型企业应用，CI/CD开发测试环境、高性能Web服务、在线教育服务、在线游戏服务、数据库等。 文件存储CPFS：HPC高性能计算、AI训练、自动驾驶、基因计算、影视渲染、EDA仿真、油气勘探、气象分析等高吞吐、高IOPS、海量文件的IO密集型业务。 https://help.aliyun.com/document_detail/425537.html(https://help.aliyun.com/document_detail/425537.html)'},
  {id:954,type:'single',answer:'A',stem:'OSS使用基于（）技术的数据冗余存储机制，将每个对象的不同冗余存储在同一个区域内多个设施的多个设备上，确保硬件失效时的数据可靠性和可用性。',opts:['纠删码','RAID-X','rsync','镜像复制'],exp:'OSS使用基于纠删码、多副本的数据冗余存储机制，将每个对象的不同冗余存储在同一个区域内多个设施的多个设备上，确保硬件失效时的数据持久性和可用性。参考链接：https://help.aliyun.com/document_detail/31827.html'},
  {id:955,type:'single',answer:'C',stem:'「1阿里云的负载均衡SLB提供对多台云服务器进行流量分发的服务，支持四层和七层的流量转发。其中七层流量转发是通过（）实现的。 选项：',opts:['Heartbeat','LVS','Tengine','Nginx'],exp:'流量转发四层是通过LVS实现，七层是通过Tengine实现'},
  {id:956,type:'single',answer:'C',stem:'您所在的公司半年前在自建机房内刚刚构建了一套财务系统，计划上线的客户管理系统准备基于阿里云的产品构建，同时财务系统与客户管理系统之间需要通过内网互联互通，哪种方案可以最大限度的使用已有的系统投资并满足新的业务需求？ 选项：',opts:['将财务系统迁移到阿里云上','基于阿里云专有网络VPC购买云产品实例来构建客户管理系统，不需要任何额外的操作，就可以直接实现两个系统的安全内网互联','基于阿里云专有网络VPC购买云产品实例来构建客户管理系统，结合专线或者VPN，实现两个系统之间的内网互联互通','基于经典网络的云产品实例构建客户管理系统，结合专线来实现两个系统之间的内网互联互通'],exp:'划重点:同时财务系统与客户管理系统之间需要通过内网互联互通，就是阿里云连接传统机房IDC，可以选择专线或者VPN连接。'},
  {id:957,type:'single',answer:'C',stem:'使用阿里云弹性伸缩(AutoScaling)来实现计算资源的弹性配置时，做了如下设置：伸缩组的属性中设置MinSize=6，MaxSize=8，伸缩规则为“调整至10台”。该伸缩组当前的云服务器ECS实例数为6台，通过设置定时任务来执行，执行一次后，该伸缩组中的云服务器ECS实例的个数为几台？',opts:['10','5','8','6'],exp:'阿里云弹性伸缩(Auto Scaling)的伸缩活动受伸缩组属性中MinSize和MaxSize的限制。当伸缩规则指定的目标实例数超出MaxSize时，实际生效的实例数不会超过MaxSize。题目中MaxSize=8，伸缩规则为调整至10台，触发规则后实例数将被限制为8台。参考阿里云官方文档，伸缩组属性优先级高于伸缩规则。选项C符合这一逻辑。'},
  {id:958,type:'single',answer:'C',stem:'您在阿里云的某台云服务器ECS实例上运行的服务出现响应缓慢的情况，通过云监控发现目前该ECS实例的带宽利用率已经达到80%以上。为避免对云服务器ECS实例进行重启，可以尝试通过（）操作来缓解服务响应缓慢的问题。',opts:['升级ECS实例的CPU和内存','为ECS实例增加磁盘','升级ECS实例的带宽','其他三个都不需要'],exp:'题目中说了是因为带宽利用率太高，导致了解服务响应缓慢的问题，所以需要通过升级ECS实例的带宽的方式减轻带宽压力。'},
  {id:959,type:'single',answer:'A',stem:'［对象存储OSS以HTTP RESTful API的形式对外提供服务，可以通过访问域名Endpoint进行访问，下列关于Endpoint说法正确的是',opts:['开启传输加速后，会新增传输加速Endpoint','外网访问产生的流入流量（写）和流出流量（读）按量进行收费','可以通过同一个访问域名Endpoint访问不同地域的OSS对象','通过内网和外网访问同一个Region所需要的Endpoint是相同的'],exp:'通过以下多种方式开启传输加速后，新增以下两种传输加速Endpoint。全球加速Endpoint,非中国内地加速Endpoint。https://help.aliyun.com/document_detail/131312.html'},
  {id:960,type:'single',answer:'D',stem:'［当您的云服务器ECS实例的镜像选择了AliyunLinux，可以兼容以下哪种操作系统?',opts:['OpenSUSE','UBUNTU','Windows Server 2008','CentOS'],exp:'AliyunLinux和Centos都属于RedHat一家的。兼容RedHat。其中包括(RedHatEnterpriseLinux， Fedora，CentOS，ScientificLinux，Oracle Linux)'},
  {id:961,type:'single',answer:'C',stem:'「1阿里云内容分发网络CDN建立并覆盖在承载网之上，由分布在不同区域的边缘节点服务器集群组成的分布式网络，替代以WebServer为中心的传统数据传输模式。以下哪项是阿里云内容分发网络CDN的主要作用？',opts:['提高网站数据的可靠性','提高网站的可用性','提高网站的访问速度','提供网站数据搬迁服务'],exp:'阿里云内容分发网络CDN(ContentDeliveryNetwork)是建立并覆盖在承载网之上，由遍布全球的边缘节点服务器群组成的分布式网络。阿里云CDN能分担源站压力，避免网络拥塞，确保在不同区域、不同场景下加速网站内容的分发，提高资源访问速度。'},
  {id:962,type:'single',answer:'D',stem:'对象存储服务OSS的某个Bucket同时配置了三条生命周期规则，分别是：1、Object保留x天后转换到低频访问 2、Object保留y天后转换到归档冷备 3、Object保留z天后删除 以下哪项x、y、z的取值满足规则要求？',opts:['90，60，30','30，15，60','30，30，30','30，60，90'],exp:'参考链接：https://help.aliyun.com/document_detail/51374.html'},
  {id:963,type:'single',answer:'B',stem:'某用户需要对OSS服务中的多张图片进行相同的操作，该用户可以创建一个图片样式将这些操作封装起来，然后使用创建的样式对多张图片进行操作。用户使用指定处理参数的方式新建图片样式，多个参数之间用以下哪种符号连接？',opts:['顿号(、)','正斜线（/）','空格','短横线(-)'],exp:'使用图片样式对图片进行处理 高级编辑:使用指定处理参数的方式新建图片样式。输入规则名称，然后在代码区域按照以下格式直接输入图片缩放的参数:image/action1,parame_value1/action2,parame_value2/...。'},
  {id:964,type:'single',answer:'C',stem:'「1您部署在阿里云云服务器ECS上的服务，希望能够通过阿里云的产品来提升该服务的可用性，以下哪种方案的可用性最高？',opts:['在不同地域的同一个可用区的多台云服务器上部署应用，并挂载在同一个负载均衡实例后面','在同一个地域的同一个可用区的多台云服务器上部署应用，并挂载在同一个负载均衡实例后面','在同一个地域的多个可用区的多台云服务器上部署应用，并挂载在同一个负载均衡实例后面','在不同地域的多个可用区的多台云服务器上部署应用，并挂载在同一个负载均衡实例后面'],exp:'同一个负载均衡并不支持跨区域，所以需要在同一个地域多个可用区的服务器部署服务，从而实现高可用。'},
  {id:965,type:'single',answer:'C',stem:'某用户是做香蕉销售生意的，所有的在线平台和数据都放在阿里云的云服务器ECS实例和云数据库RDS实例中，现在CEO想对香蕉销售额的变化趋势做一个监控，并在订单量发生较大变化时能收到预警信息，可以使用阿里云的（）产品实现，并在管理控制台中展现结果.',opts:['云服务器ECS','云安全中心','云监控','DDOS防护'],exp:'题目中说需要在管理控制台中展现云产品的监控预警信息，所以需要用到阿里云的云监控。'},
  {id:966,type:'single',answer:'D',stem:'「阿里云对象存储OSS支持分块上传操作，即可以将大文件进行分块处理后再分别上传，该操作适合在上传大文件或者网络较差的情况下使用。在分块上传的所有任务完成之后，如果没有调用CompleteMultipartUpload接口，就会产生一些不完整的文件，这些不完整的文件会占用用户bucket的空间。为了方便用户删除这些不完整的文件，OSS提供了以下哪种功能？',opts:['在线批量删除','Bucket清空','OpenAPI批量删除','碎片管理'],exp:'题目中说了需要删除不完整的碎片文件，所以需要用到碎片管理功能来删除这些不完整的文件。参考链接：https://help.aliyun.com/document_detail/31916.html'},
  {id:967,type:'single',answer:'D',stem:'云服务器ECS镜像提供了创建ECS实例所需的信息。创建ECS实例时，必须选择镜像。ECS镜像根据来源不同，分为公共镜像、自定义镜像、共享镜像、镜像市场镜像和社区镜像。下列关于镜像的说法正确的是',opts:['可以购买镜像市场的镜像创建实例，快速获得预装的ECS实例的运行环境或软件应用。镜像市场的所有镜像均需要收费','公共镜像由阿里云官方提供，但是系统正版授权需要自行购买许可','创建自定义镜像后，支持导出镜像到OSS存储空间，并下载到本地使用','可以将可用状态的自定义镜像发布为社区镜像，社区镜像支持共享、导出与复制'],exp:'社区镜像是一种完全公开的镜像。您可以将制作好的自定义镜像发布为社区镜像供他人使用，也可以获取并使用他人发布的社区镜像。https://help.aliyun.com/document_detail/208369.html'},
  {id:968,type:'single',answer:'B',stem:'专属块存储集群是阿里云提供的一种以集群为整体的块存储服务，具备物理资源隔离、集群内资源独享的特点。某金融企业为了数据安全，购买了专属块存储集群作为ECS实例的云盘，下列关于专属块存储集群说法正确的是',opts:['只支持作为ECS实例的数据盘','属块存储集群中的云盘不支持变配操作','专属块存储集群支持包年包月和按量付费模式','集群分为基础型、容量型和性能型'],exp:'专属块存储集群云盘也持作为ECS实例的系统盘，集群分为基础型和性能型。https://help.aliyun.com/document_detail/208883.html 专属块存储集群仅支持包年包月的计费方式。https://help.aliyun.com/document_detail/208884.html'},
  {id:969,type:'single',answer:'D',stem:'［对象存储OSS是一款海量、安全、低成本、高可靠的云存储服务，在使用OSS之前需要先创建存储空间（Bucket），然后即可将不限数量的对象上传到Bucket中进行存放，下列关于存储空间Bucket说法正确的',opts:['同一阿里云账号在同一地域内创建的存储空间数量无上限','Bucket创建后可以根据需要灵活更改名称或存储类型','在OSS中可以创建多个同名Bucket，用来实现存储空间的高可用性','文件上传至Bucket后，OSS会自动生成文件URL，可以直接通过文件URL访问该文件'],exp:'同一阿里云账号在同一地域内创建的存储空间总数不能超过100个，存储空间名称在OSS范围内必须全局唯一。创建后，其名称、所处地域、存储类型、冗余类型不支持修改。。https://help.aliyun.com/document_detail/54464.html'},
  {id:970,type:'single',answer:'B',stem:'阿里云对象存储OSS中所有数据都保存在Bucket中，当一个OSSbucket设置成（）权限，意味着该OSSBucket允许其他用户访问属于该Bucket下的object',opts:['公共读写','公共读','私有','私有读'],exp:'允许其他用户访问就代表允许公共访问此Bucket，所以选择公共读。'},
  {id:971,type:'single',answer:'A',stem:'某视频社交APP计划将系统部署在阿里云上，其业务系统需要包括视频的原始数据采集、视频上传、存储、视频转码、分发以及视频播放的完整功能。如果你是阿里云产品经理，以下选项中的阿里云方案，你会向用户推荐哪一项？',opts:['对象存储OSS+短视频SDK+媒体处理+内容分发CDN+阿里云播放器','对象存储OSS+视频直播+媒体处理+内容分发CDN+阿里云播放器','文件存储+视频点播+媒体处理+内容分发CDN+阿里云播放器','文件存储+短视频SDK+媒体处理+内容分发CDN+阿里云播放器'],exp:'先把ABCD共有的部分“媒体处理+内容分发CDN+阿里云播放器”排除掉，OSS是用来存储的，排除掉“文件存储”，题干中并没有直播需求，所以无需视频直播。'},
  {id:972,type:'single',answer:'D',stem:'［阿里云的负载均衡SLB中，可以通过健康检查来判断后端云服务器ECS实例的可用性。健康检查可以识别出后端服务器池中是否有不可用的云服务器ECS实例，如果有则不给这些异常的云服务器ECS实例分配任务，直到这些云服务器ECS实例恢复正常，某些特殊应用场景下需要关闭健康检查。以下说法哪一项是正确的？',opts:['无论四层和七层均可以关闭健康检查','无论四层和七层均无法关闭健康检查','四层服务可以关闭健康检查，七层服务无法关闭健康检查','七层服务可以关闭健康检查，四层服务无法关闭健康检查'],exp:'只有HTTP和参考链接：监听支持关闭健康检查。UDP和TCP监听无法关闭健康检查。参考链接：https://help.aliyun.com/document_detail/85960.html'},
  {id:973,type:'single',answer:'B',stem:'云服务器ECS的功能组件主要包含实例、镜像、块存储、快照、安全组、网络。想要恢复某一时间点的数据，可以使用云服务器ECS（）功能。',opts:['镜像','快照','块存储','实例'],exp:'快照用于备份云盘在某一个或者多个时间点的数据。参考链接：https://help.aliyun.com/document_detail/25392.html'},
  {id:974,type:'single',answer:'B',stem:'弹性伸缩可以根据业务需求和策略设置（），可实现在业务需求增长时自动增加ECS实例以保证计算能力，在业务需求下降时自动减少ECS实例以节约成本。',opts:['触发任务','伸缩配置','弹性扩张','伸缩规则'],exp:'弹性伸缩使用伸缩配置作为模板自动创建ECS实例，例如通过定时任务、报警任务触发弹性扩张活动。参考链接：https://help.aliyun.com/document_detail/25890.html'},
  {id:975,type:'single',answer:'A',stem:'阿里云弹性伸缩（AutoScaling），是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务。支持用户添加已有的云服务器ECS实例到伸缩组中去，但对云服务器ECS实例所在地域有一定要求。以下哪项说法是正确的？',opts:['该实例和伸缩组必须在同一个地域（Region）中，对可用区（Zone）没有要求','该实例和伸缩组必须在同一个地域（Region）的同一个可用区（Zone）中','对该实例和伸缩组的地域（Region）和可用区（Zone）没有要求','一个伸缩组最多可以跨两个地域（Region），添加完ECS实例后，要保证伸缩组中的所有ECS实例所在的区域不超过两个'],exp:'添加的ECS需要和伸缩组处于同一个地域(Region)'},
  {id:976,type:'single',answer:'A',stem:'小张管理的网站选择部署在阿里云的云服务器ECS实例上，最近发现一个现象，网站首页的宣传视频在某些区域播放速度良好，但是在其它地区播放速度很慢。为了解决此问题，您建议选择以下哪一种阿里云产品？',opts:['内容分发网络CDN','云数据库RDS','负载均衡SLB','对象存储OSS'],exp:'题目中遇到的问题是在某些区域播放良好，但是在其他地区播放较差，所以需要内容分发网络CDN来解决其他地域访问速度慢的问题。'},
  {id:977,type:'single',answer:'C',stem:'某用户通过阿里云管理控制台创建ECS实例时，若未在该地域创建安全组，阿里云会在创建该ECS实例的同时，为用户创建一个默认安全组，默认安全组为普通安全组，网络类型和ECS实例一致，默认打开的端口不包括以下哪一项？ 选项：',opts:['RDP 3389端口','ICMP协议','HTTP 80端口','SSH22端口'],exp:'默认安全组规则的效果如下： ·规则优先级：100 ·针对TCP协议允许所有IP访问SSH(22)、RDP(3389)端口。 ·针对ICMP(IPv4)协议允许所有IP访问所有端口。 ·如果选中HTTP80端口和参考链接：443端口，还会针对TCP协议允许所有IP访问HTTP(80)、参考链接：(443)端口。参考链接：https://help.aliyun.com/document_detail/25387.html'},
  {id:978,type:'single',answer:'B',stem:'某阿里云负载均衡SLB实例下，后端多台云服务器ECS实例配置的权重都一样，但是实际上ECS实例负载却不一样。以下哪一项是可能的原因？',opts:['ECS实例在不同的地域(Region)，网络延迟不同','开启了会话保持功能','采用的转发规则不同','开启了获取真实IP的功能'],exp:'负载均衡请求不均衡可能有以下几种原因:1.ECS实例请求连接数较少。2.不同ECS实例的性能不同导致请求不均衡。3.开启了会话保持功能。4.ECS健康检查异常。5.TCPKeepalive保持长连接。参考链接：https://help.aliyun.com/knowledge_detail/66280.html'},
  {id:979,type:'single',answer:'D',stem:'弹性伸缩（AutoScaling）支持使用生命周期挂钩挂起创建或移出的ECS实例，并在挂起期间对ECS实例进行自定义操作。生命周期挂钩被触发时，可以选择通过指定的方式发出通知或者自动执行更多操作。生命周期挂钩支持配置的通知方式不包括以下哪一项？',opts:['OOS模板','MNS队列','MNS主题','OSS主题'],exp:'生命周期挂钩被触发时，通过指定的方式发出通知或者自动执行更多操作。支持的选项如下: MNS主题:您需要继续选择MNS主题。 MNS队列:您需要继续选择MNS队列。 OOS模板:您需要继续选择OOS模板。 MNS主题和MNS队列支持填写通知标识。弹性伸缩每次推送消息到通知对象时，会同时发送您预先指定的通知标识，便于管理和标记不同类别的通知信息'},
  {id:980,type:'single',answer:'C',stem:'您基于阿里云的云服务器ECS实例部署了MySQL数据库，随着业务量的不断上涨，您自己部署的数据库的服务能力越来越不足，表现在并发连接数不足，磁盘的IOPS不能满足业务需求等，可以采用以下哪一种阿里云产品来解决这些问题？',opts:['对象存储OSS','表格存储','云数据库RDS','大数据分析ODPS'],exp:'题目中说遇到了自己部署的数据库的服务能力越来越不足的问题，所以可以通过云数据库RDS来解决问题。'},
  {id:981,type:'multi',answer:'ABCD',stem:'您计划基于阿里云的云服务器ECS实例搭建一个网站，有可能会影响网站打开速度的因素包括（正确答案的数量：4个）',opts:['网页内容本身的大小','网络的带宽','是否有大量数据库的操作','是否过多引用了其他网站的内容','云服务器ECS实例的磁盘大小'],exp:'排除法，云服务器ECS实例的磁盘大小是不会影响到网站的访问速度的。'},
  {id:982,type:'multi',answer:'AD',stem:'ECS如何克隆一台一模一样的实例？（正确答案的数量：2个）',opts:['通过快照，创建一个新的系统盘，生成新的实例','对已经配置完成的数据盘进行打快照，然后在购买或者升级页面，添加磁盘的地方点：“用快照创建磁盘”，选择你要的快照即可。','启动新生成的ECS登陆检查数据及环境','通过创建自定义镜像的方式，创建一个自定义镜像，然后使用这个自定义镜像创建ECS即可'],exp:'ECS克隆实例的正确方法有两种： 1. **选项A**：通过系统盘快照创建新实例。对原ECS系统盘制作快照后，使用该快照生成新的系统盘并启动实例，确保系统环境一致。 2. **选项D**：创建自定义镜像。自定义镜像包含系统盘和数据盘的全部配置，可直接用于创建配置完全相同的实例。 选项B仅涉及数据盘的克隆，无法保证系统环境一致；选项C为验证步骤，非克隆方法本身'},
  {id:983,type:'multi',answer:'ABCD',stem:'在使用阿里云云产品时，可以通过以下哪些方式来提供数据库服务？？（正确答案的数量：4个）',opts:['Linux的环境安装包安装数据库','单独购买RDS数据库','使用镜像市场免费配置环境的数据库','Windows的环境安装包安装数据库','用户家里电脑搭建的数据库服务'],exp:'用户家里电脑搭建的数据库服务暂时不推荐用来构建数据库服务。'},
  {id:984,type:'multi',answer:'BC',stem:'阿里云内容分发网络CDN建立并覆盖在承载网之上，由分布在不同区域的边缘节点服务器群组成的分布式网络替代传统WEBSerVer为中心的数据传输模式。用户使用阿里云CDN时，步骤是必须的。（正确答案的数量：2个）',opts:['手动刷新缓存','添加“加速域名”','CNAME域名解析','CDN使用资源监控'],exp:'阿里云CDN的配置流程中，用户需完成加速域名的添加并修改DNS解析。官方操作手册明确指出，使用CDN服务必须先在控制台添加待加速的域名（B选项），获取对应的CNAME记录后，在域名服务商处将原本的A记录变更为CDN提供的CNAME地址（C选项）。A选项缓存刷新属于内容更新后的可选操作，D选项监控属于运维阶段的可选功能，两者并非开通CDN的必要条件。'},
  {id:985,type:'multi',answer:'ABD',stem:'云服务器ECS实例的付费方式包括包年包月和按量付费两种。对于按量付费的云服务器ECS实例的操作，以下描述正确的包括（正确答案的数量：3个）',opts:['可以随时释放不使用的云服务器ECS实例，不会引起费用的浪费','可以设置云服务器ECS实例的自动释放时间','不能取消已经设置的云服务器ECS实例的自动释放时间','可以查看云服务器ECS实例的消费记录'],exp:'可以随时取消已经设置的云服务器ECS实例的自动释放时间'},
  {id:986,type:'multi',answer:'ABCD',stem:'阿里云的云盾的先知计划，是调动众多网络安全专家的力量一起维护互联网平台和业务的安全，降低客户的安全损失。云盾先知计划具有特点。（正确答案的数量：4个）',opts:['私有的安全中心','可靠的安全专家，由实名认证过的白帽子和阿里云授权的安全公司组成','按效果付费','具有完善的漏洞闭环，从漏洞发现到解决建议的完整链接','发现漏洞时直接修复'],exp:'排除法，先知计划发现漏洞并不会直接修复，而是会给企业提供参考的漏洞修复方案，由对应的运维人员来选择处理漏洞的方案。'},
  {id:987,type:'multi',answer:'ABC',stem:'以下哪些状态属于ECS生命周期中的稳定状态？(正确答案的数量：3个) 选项：',opts:['运行中','已停止','已过期','停止中'],exp:'ECS生命周期中的稳定状态指实例处于持久、不会自动迁移的状态。运行中（A）是实例正常工作的状态；已停止（B）是用户主动停止后的静止状态；已过期（C）表示实例资源到期，处于不可用但稳定的保留状态。停止中（D）属于过渡状态，不属于稳定状态'},
  {id:988,type:'multi',answer:'BCD',stem:'CDN缓存是为了加速页面的访问，阿里云CDN提供了哪几种刷新缓存的方法？（正确答案的数量：3个)',opts:['整站刷新','目录刷新','URL 预热','URL 刷新'],exp:'CDN刷新缓存的方式确实有三种，分别是URL刷新，目录刷新，URL预热，参考链接：https://help.aliyun.com/document_detail/27140.html'},
  {id:989,type:'multi',answer:'BCD',stem:'阿里云的云盾态势感知可以全面、快速和准确地捕获能够引发网络安全态势发生变化的要素，然后把用户当前遇到的安全威胁与过去的威胁进行关联回溯和大数据分析，输出可能产生的安全风险和解决建议方案。云盾动态感知支持报警方式。通过这些方式，用户可以在出现防线的第一时刻收到时间通知。（正确答案的数量：3个)',opts:['实时电话','手机','电子邮箱','钉钉'],exp:'题目涉及阿里云云盾态势感知支持的报警方式。根据阿里云官方文档，云盾态势感知的告警通知渠道包括手机短信（B）、电子邮箱（C）和钉钉（D）。实时电话（A）未在标准告警方式中列出，官方主要提供非电话类通知服务。手机通过短信触达，邮箱通过邮件推送，钉钉则通过群机器人实现消息同步，确保用户及时响应安全事件。'},
  {id:990,type:'multi',answer:'ACD',stem:'阿里云的',opts:['阿里云在骨干机房有出口带宽大和云服务器独享的出口带宽的特点','多线接入与云服务的质量无关','通过BGP多线机房，实现全国访问流畅均衡','通过多线接入可以实现更高的云服务质量'],exp:'多线接入与云服务的质量是有关系的。'},
  {id:991,type:'multi',answer:'ABD',stem:'SLB实例监听可选择的协议类型有哪些？（正确答案的数量：3个）',opts:['TCP','HTTPS','FTP','HTTP'],exp:'负载均衡SLB实例监听目前支持，TCP，HTTP，HTTPS协议。'},
  {id:992,type:'multi',answer:'ABCD',stem:'阿里云的云盾提供“DDoS基础防护”功能可以防护攻击。(正确答案的数量：4个) 选项：',opts:['SYN Flood','UDP Flood','ACK Flood','ICMP Flood','密码暴力破解'],exp:'阿里云云盾的DDoS基础防护主要针对网络层和传输层的泛洪攻击。SYN Flood（A）通过伪造大量TCP连接请求耗尽服务器资源，属于典型传输层攻击。UDP Flood（B）利用无连接的UDP协议发送高流量数据包，消耗目标带宽或处理能力。ACK Flood（C）通过发送异常ACK包干扰TCP状态，属于TCP协议层攻击。ICMP Flood（D）通过ICMP报文（如Ping）制造网络层流量洪泛。E选项的密码暴力破解属于应用层攻击，通常由WAF或安全组策略处理，不在此功能范围。相关内容参考阿里云官方文档对DDoS防护类型的说明。'},
  {id:993,type:'multi',answer:'AB',stem:'海量文件存储和快速访问是阿里云对象存储OSS的核心功能。B公司在一年前基于OSS构建了一个公司内部的视频分享站点（未做任何程序开发），管理员定期上传各种培训视频，2000名员工在休息时间可以进行下载和学习。为了鼓励全员一起丰富视频资源库，B公司想扩展站点功能，增加员工自助上传、评价、播放次数统计、排行榜、视频分类、热门推荐等互动功能，假设您是B公司的架构师，您可以推荐公司使用阿里云的产品实现升级方案。(正确答案的数量：2个)',opts:['云服务器ECS','云数据库RDS','加密DNS服务（HTTPDNS）','音视频转码服务(MTS)'],exp:'划重点：2000名员工在休息时间可以进行下载和学习。自助上传、评价、播放次数统计、排行榜、视频分类。所以需要使用用到ECS部署网站，同事需要用到数据库RDS存储员工的文件数据。主要题目中没有提到视频在线播放，所以不需要用到音视频转码服务(MTS)。'},
  {id:994,type:'multi',answer:'BCD',stem:'负载均衡实例监听负责检查连接请求，然后根据调度算法定义的转发策略将请求流量分发至后端服务器。SLB实例监听可选择的协议类型有哪些？（正确答案的数量：3个)',opts:['FTP','HTTP','HTTPS','TCP'],exp:'目前负载均衡SLB监听仅支持 TCP/UDP（4 层） 和 HTTP/HTTPS（7 层） 这 4 种协议。参考链接：https://help.aliyun.com/document_detail/85943.html'},
  {id:995,type:'multi',answer:'ABC',stem:'创建阿里云的云服务器ECS实例之前，需要对ECS实例的配置进行选型，阿里云为用户提供了推荐的配置组合方案来满足大部分用户的需求，这些推荐配置只是作为您开始使用云服务器ECS实例的参考。同时，阿里云还提供了灵活、可编辑的配置修改方式。如果您在使用过程中，发现ECS实例的配置过高或过低，可以随时修改配置进行ECS实例的变配。下列关于ECS实例的变配说法正确的包括（正确答案的数量：3个）',opts:['变配后，云服务器ECS实例的公网和内网的 IP 地址不会改变','变配后，云服务器ECS实例的带宽即时生效','升级云服务器ECS实例的CPU和内存后，必须通过阿里云的管理控制台重启ECS实例才能生效，在ECS实例内重启无效','不支持对云服务器ECS实例的配置进行降级'],exp:'阿里云服务器ECS支持自定义升级，可以根据用户需求，针对CPU、内存、带宽进行升级。其中带宽支持按天来进行升级。'},
  {id:996,type:'multi',answer:'AC',stem:'关于阿里云的云服务器ECS实例是否支持安装虚拟化程序的说法正确的包括（正确答案的数量：2个）',opts:['云服务ECS实例是基于虚拟化平台运行的，不支持部署虚拟化程序','可以在云服务器ECS实例中部署虚拟化程序，阿里云提供相应的技术支持','如果在云服务器ECS实例中部署虚拟化程序，会导致服务器出现不可预测的问题','如果在云服务器ECS实例中部署虚拟化程序，服务器出现的问题是可以预测的'],exp:'阿里云云服务ECS实例是基于虚拟化平台运行的，不支持部署虚拟化程序，部署虚拟化程序，可能出现不可预测的故障。'},
  {id:997,type:'multi',answer:'ACD',stem:'以下哪些存储，数据库类的阿里云产品结合才能满足大多数互联网应用的需求？（正确答案的数量：3个)',opts:['OSS存储服务','ECS云服务器','RDS关系型数据库','OTS结构化数据库'],exp:'阿里云产品中，A选项OSS存储服务提供对象存储，适用于存储非结构化数据；C选项RDS是关系型数据库服务，适合处理结构化数据；D选项OTS（现为Tablestore）是结构化数据库，适用于海量数据的高并发访问。B选项ECS云服务器属于计算资源，不属存储或数据库类产品。这三者结合可满足互联网应用的多样化存储需求'},
  {id:998,type:'multi',answer:'ACD',stem:'某企业想使用云服务器ECS+负载均衡SLB+弹性伸缩（AutoScaling）的架构搭建一个企业级的门户网站，技术负责人对于负载均衡和弹性伸缩配合使用没有经验，于是将他理解的两种产品配合使用的一些技术细节列成了一个表单，并请作为架构师的您帮他做一下鉴别，其中这些项是正确的。（正确答案的数量：3个）',opts:['创建伸缩组时指定的SLB实例必须是已启用状态','创建伸缩组时指定的SLB实例的所有配置的监听端口必须开启健康检查','如果SLB实例已挂载了VPC（指阿里云专有网络，AliCloud VPC）类型的ECS实例，则不支持在该SLB下增加经典网络类型的ECS实例','伸缩组会自动将加入伸缩组的ECS实例添加到指定的SLB实例当中','创建伸缩组时指定的SLB实例必须和该伸缩组在同一个可用区（Zone)'],exp:'如果需要为伸缩组关联负载均衡实例，需确保您持有一个或多个处于运行中状态的负载均衡实例且负载均衡实例必须开启健康检查但并非所有，参考链接：https://help.aliyun.com/document_detail/25882.html； SLB实例只能全部挂在经典网络或全部挂在专有网络，不可混挂； 在负载均衡SLB和弹性伸缩一起使用的时候，负载均衡实例和伸缩组必须位于同一地域。而不是必须在同一个可用区。参考链接：https://help.aliyun.com/document_detail/101364.html'},
  {id:999,type:'multi',answer:'AC',stem:'安全组用于设置单台或多台云服务器的网络访问控制，错误配置的安全组规则可能会导致ECS实例在私网或公网与其他设备之间的访问失败，包括但不限于（正确答案个数：2个）',opts:['无法从本地远程连接（SSH）Linux实例','无法远程ping ECS实例的内网IP','无法通过HTTP或HTTPS协议访问ECS实例提供的Web服务','无法通过内网访问其他地域的RDS实例'],exp:'安全组作为云服务器的虚拟防火墙，控制入站和出站流量。若安全组规则配置错误，可能导致特定协议或端口的访问被阻断。无法SSH连接Linux实例通常因安全组未放行TCP 22端口；HTTP/HTTPS访问失败则因未开放TCP 80或443端口。ICMP协议（ping）在内网默认可能允许，故内网IP无法ping不一定由安全组导致；跨地域内网访问RDS通常受网络架构限制，与安全组规则无关。参考阿里云安全组文档，入站规则需明确允许对应协议和端口。选项A、C涉及常见服务端口未放行的情况，符合题干描述。'},
  {id:1000,type:'multi',answer:'CD',stem:'用户在创建了伸缩组之后，可以将已有的ECS实例手动添加至伸缩组，充分利用已有的计算资源。下列选项中的ECS实例，实例不能够被手动加入到伸缩组。 (正确答案个数：2个)',opts:['与伸缩组相处于同一地域','状态为运行中','已加入到其他伸缩组中','伸缩组的网络类型为专有网络时，ECS实例为经典网络'],exp:'阿里云弹性伸缩服务中，伸缩组添加已有ECS实例需满足特定条件。参考阿里云文档，未被允许的情况包括：实例已归属其他伸缩组（同一实例不可同时加入多个伸缩组），以及ECS实例网络类型与伸缩组不匹配（如伸缩组为VPC而实例为经典网络）。选项C、D分别对应这两种限制。选项A（同一地域）、B（运行中状态）是允许的加入条件，符合官方要求。'},
  {id:1001,type:'multi',answer:'ABD',stem:'阿里云的云服务器ECS实例根据底层支持的硬件不同，而划分为不同的实例系列。对于实例系列I采用Intel Xeon CPU，实例系列II采用HasWell CPU。以下关于实例系列说法正确的是（正确答案的数量：3个）',opts:['实例系列 II 的用户用户可以获得更大的实例规格','实例系列 II 同时增加了一些新的指令集，使整数和浮点运算的性能翻倍','实例系列 I 与实例系列 II 之间可以互相升降配','对于 I/O 优化实例，配合SSD云盘使用获得更高更好的 I/O 性能'],exp:'系列 II 较系列 I 进行了硬件升级，采用 Haswell CPU、DDR4 内存，并默认为 I/O 优化实例，同时增加了一些新的指令集，使整数和浮点运算的性能翻倍，整体计算能力更强。但是不支持实例系列 I 与实例系列 II 之间可以互相升降配。'},
  {id:1002,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(AutoScaling)中，冷却时间是指在同一个伸缩组内，当有一个伸缩活动被成功执行后的一段锁定时间内，该伸缩组不执行其他的伸缩活动。以下关于冷却时间的说法正确的有？（正确答案的数量：3个） 选项：',opts:['冷却时间锁定的是同一个伸缩组的伸缩活动，对于多伸缩组内的不同伸缩活动，不会锁定','当伸缩组处于冷却时间内时，可以通过先停用伸缩组再重新启动伸缩组的方式，让伸缩组的冷却时间提前结束','当伸缩组加入或移出多个ECS实例时，最后一个ECS实例加入或移出完成后，整个伸缩组冷却时间才开始计时','在伸缩组的冷却时间内，云监控报警类型的请求可以绕过冷却时间立即执行伸缩活动，其他类型的触发任务会被拒绝（如用户手工执行伸缩规则、定时任务等）'],exp:'在冷却时间内，伸缩组会拒绝由云监控报警任务触发的伸缩活动请求。但其他类型任务（手动执行任务、定时任务）触发的伸缩活动可以立即执行，绕过冷却时间。参考链接：https://help.aliyun.com/document_detail/25912.html'},
  {id:1003,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(AutoScaling)，是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务。它主要可以提供功能。（正确答案的数量：3个）',opts:['根据客户业务需求横向扩展云服务器ECS实例的数量，即自动增加或减少云服务器ECS实例','支持负载均衡SLB配置：在增加或减少云服务器ECS实例时，自动向负载均衡SLB实例中添加或移除相应的云服务器ECS实例','支持云数据库RDS访问白名单：在增加或减少云服务器ECS实例时，自动向云数据库RDS访问白名单中添加或移出该云服务器ECS实例的IP','根据客户业务需求提升或者缩减单个云服务器ECS实例的配置（包括内存大小、CPU个数等）'],exp:'排除法，弹性伸缩(Auto Scaling)是横向扩展，扩展的是云服务器ECS实例的个数，云服务器ECS实例的配置是不支持伸缩的。所以根据客户业务需求提升或者缩减单个云服务器ECS实例的配置（包括内存大小、CPU个数等）是错误的。'},
  {id:1004,type:'multi',answer:'AB',stem:'ECS自建数据库进行迁移可以使用DTS工具来进行，DTS迁移工具支持数据库迁移。（正确答案个数：2个）',opts:['RDBMS','NoSQL','OcenBase','DB2'],exp:'官网原话'},
  {id:1005,type:'multi',answer:'ABC',stem:'某互联网金融公司为了实现业务快速上线，系统快速部署，基于阿里云搭建IT基础架构。由于其业务特性，不定期会有理财套餐的秒杀、促销活动，为了能够应对更大、更具偶发性的业务压力，需要全面考虑应用、数据库等层面的扩展，以下说法正确的是：（正确答案的数量：3个） 选项：',opts:['使用SLB实现应用层的弹性扩展','使用DRDS实现数据库层的弹性扩展','使用弹性伸缩使云服务器轻松应对秒杀场景扩容','应用之间采用紧耦合架构','将系统搭建在同一地域有利于系统的弹性扩展'],exp:'应用层的弹性,通过SLB后增加机器实现，DRDS就是数据库集群，可以实现数据库的弹性扩展（https://help.aliyun.com/product/29657.html），应用间应该采用松耦合的架构来提高系统的可跨展性，紧耦合不利于维护。弹性扩展和部署在同一地域没有关系，多个地域也可以每个地域单独实现弹性拓展。'},
  {id:1006,type:'multi',answer:'BC',stem:'在使用阿里云弹性伸缩(Auto Scaling)创建伸缩组之后，除地域属性之外,还有以下哪些属性不可以修改？（正确答案的数量：2个）',opts:['伸缩组名称','负载均衡实例','RDS 数据库实例','移出策略'],exp:'伸缩组名称是可以修改成其他名称，移出策略是可以修改为其他策略。'},
  {id:1007,type:'multi',answer:'BCD',stem:'阿里云快照可以为所有类型的云盘创建崩溃一致性快照，是一种便捷高效的数据容灾手段。快照是云盘的重要功能，是某一时间点一块云盘的数据状态文件。以下关于快照使用场景的描述，是正确的。（正确答案个数：3个)',opts:['某阿里云用户需跨地域迁移磁盘数据','某阿里云用户需跨可用区迁移磁盘数据','某公司需要对ECS系统盘中的数据做定期备份','某公司需要对ECS数据做定期备份','某公司需要将数据库平滑迁移到阿里云上','某电商公司使用AutoScaling做自动弹性伸缩，应对流量峰值'],exp:'阿里云快照基于云盘数据状态文件实现崩溃一致性，适用于数据容灾。快照功能支持跨可用区迁移数据，用户可通过快照在不同可用区间复制磁盘数据。对ECS系统盘和数据盘进行定期备份是快照的典型应用场景，可确保数据安全与恢复。跨地域迁移通常需结合其他服务如镜像复制，数据库平滑迁移与Auto Scaling处理流量峰值则依赖不同解决方案。阿里云文档明确快照适用于数据备份与迁移场景。选项B、C、D分别对应跨可用区迁移、系统盘备份、数据备份；A、E、F涉及其他服务或方法。'},
  {id:1008,type:'multi',answer:'ABC',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。如果用户希望基于阿里云的产品实现3万用户同时在线观看视频直播平台，视频资源存储在OSS里，视频资源必须经过授权才能观看。覆盖全国范围内1000万用户群，为了让不同地域的用户都获得良好的播放体验。OSS至少搭配阿里云服务来实现这个方案。（正确答案的数量：3个）',opts:['音视频转码服务MTS','内容分发网络CDN','云服务器ECS','弹性伸缩（Auto Scaling)'],exp:'视频在OSS所以必须使用MTS，用户为全国则需要CDN保证数据访问性能，云服务用作数据鉴权'},
  {id:1009,type:'multi',answer:'BCD',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。与自建存储相比，OSS在可靠性、安全、成本和数据处理能力方面具备明显的优势。下面属于OSS的成本优势。（正确答案的数量：3个)',opts:['OSS首次开通时无需选择容量大小，后续可根据实际需要随时扩容，扩容时业务只中断1-2秒','OSS服务基于多线BGP骨干网络构建，下行无带宽限制，上行流量免费','OSS最终用户不需要投入运维人员与托管费用，后台运维完全由阿里云负责','无需一次按峰值容量的存储硬件设备，按实际使用容量付费'],exp:'OSS的下行的带宽都是没有限制的，上行（即上传）的流量是免费的。同时OSS的Bucket空间是没有上限的，所以不存在扩容的情况，更不存在业务中断的情况。'},
  {id:1010,type:'multi',answer:'ABC',stem:'在阿里云安全体系中，账户安全是非常重要的组成部分，在登录阿里云官网时，免费提供给用户安全验证手段。（正确答案的数量：3个）',opts:['用户名密码校验','登录验证码或安全滑块','多因子（虚拟MFA）认证','为每个用户提供一个USB KEY'],exp:'题目问的是阿里云官网给用户免费提供的安全验证手段，使用排除法，阿里云不会为每个用户提供一个USB KEY'},
  {id:1011,type:'multi',answer:'ABCDE',stem:'云计算是一种商业计算模型，它将计算任务分布在大量计算机组成的资源池上，使各种应用系统能够根据需要获取计算力、存储空间和信息服务。以下关于云计算特点的说法正确的有？（正确答案的数量：5个）',opts:['大规模','高可靠性','按需服务','通用性','虚拟化','仅支持单租户'],exp:'云计算的特点：大规模，虚拟化，高可靠性，通用性，按需服务，高可伸缩性，廉价性。云计算是支持多租户而不是仅支持单租户。'},
  {id:1012,type:'multi',answer:'ABC',stem:'阿里云的负载均衡SLB是对多台云服务器ECS实例进行流量分发的负载均衡服务，支持多种负载均衡的策略，包括（）。（正确答案的数量：3个）',opts:['轮询（RR）','加权轮询（WRR）','加权最小连接数（WLC）','最近最少使用算法（Least Recently Used，简称LRU）','先进先出（FIFO）'],exp:'阿里官方文档明确指出支持三种负载方式：加权轮询模式，加权最小连接数模式，轮询模式'},
  {id:1013,type:'multi',answer:'ABD',stem:'某购物网站使用负载均衡SLB和云服务器ECS搭配来响应买家的请求，同时出于对买家请求波动较大的情况，选用阿里云弹性伸缩（AutoScaling）弹性的分配合适的资源，既能保证网站系统的正常运营，又节省了资源使用的成本以及人工维护成本。关于负载均衡SLB和弹性伸缩（AutoScaling）配合使用的说法中，正确的有（正确答案的数量：3个）',opts:['负载均衡SLB和弹性伸缩（Auto Scaling）必须在同一个地域（Region）','弹性伸缩（Auto Scaling）中的伸缩配置，可以不选择公网带宽','负载均衡SLB和弹性伸缩（Auto Scaling）必须在同一个可用区（Zone）','弹性伸缩（Auto Scaling）中自动产生的ECS实例可以自动配置到负载均衡SLB中去'],exp:'SLB和弹性伸缩ESS只需要在一个地域。创建伸缩配置时，ECS实例可以不选择公网带宽。但是为了方便管理ECS实例，建议您购买至少1Mbps的ECS带宽。参考链接：http://docs-aliyun.cn-hangzhou.oss.aliyun-inc.com/pdf/auto-scaling-common-problem-cn-zh-2017-04-18.pdf'},
  {id:1014,type:'multi',answer:'ABDEF',stem:'阿里云的云服务器ECS应用非常广泛，既可以单独使用作为简单的Web服务器，也可以与其他阿里云产品（如OSS、CDN等）搭配提供强大的多媒体解决方案。以下是云服务器ECS的典型应用场景。（正确答案的数量：5个）',opts:['多媒体、大流量的APP或网站','简单的Web应用','海量的数据分析','企业应用开发环境','访问量波动大的APP或网站','企业官网'],exp:'还想数据分析需要借助Hadoop等软件配合硬件来实现，ECS不适合海量数据分析的工作，也不是ECS的典型应用场景。'},
  {id:1015,type:'multi',answer:'AB',stem:'某阿里云用户开发了一款手机APP游戏，支持上传文字和图片进行互动式交流，很受用户欢迎。最近在运营过程中出现两个问题：每天有超过1000多个用户因本地DNS篡改导致游戏中断；另外用户上传的内容存在违规图片，已收到公安人员的一次正式警告。管理员使用阿里云的产品，可以降低这两个风险。（正确答案的数量：2个)',opts:['阿里绿网','HTTPDNS','DDoS高防IP','安全管家'],exp:'划重点：本地DNS篡改导致游戏中断，上传的内容存在违规图片。所以需要选择HTTPDNS和阿里绿网服务。'},
  {id:1016,type:'multi',answer:'ACD',stem:'为了保障全体的CDN租户的使用体验，接入阿里云内容分发网络CDN前需要满足一些条件，关于阿里云CDN准入条件的描述，正确的是（正确答案的数量：3个）',opts:['阿里云官网完成帐号实名认证','加速域名可以是彩票类网站','加速的域名必须在工信部完成备案，推荐接入阿里云备案','加速域名的源站内容，可选择保存于云服务器ECS实例或对象存储OSS；如源站内容不在阿里云，接入需经过人工审核'],exp:'彩票类的网站审核在接入的时候会审核不通过。'},
  {id:1017,type:'multi',answer:'ABD',stem:'以下是ECS实例数据盘挂载点的是（正确答案的数量：3个）',opts:['/dev/xvdz','/dev/xvdd','/dev/xvda','/dev/xvdb'],exp:'正常情况下用fdisk -l命令,可以查看到新增的硬盘。/dev/xvda为系统盘，/dev/xvdb,/dev/xvdc.../dev/xvdz都是数据盘。所以/dev/xvda为系统盘不会选择。'},
  {id:1018,type:'multi',answer:'ABCEF',stem:'阿里云对象存储OSS是阿里云提供的海量、安全、低成本、高可靠的云存储服务。OSS具有特点。（正确答案的数量：5个）',opts:['存储资源利用率高，按实际使用空间结算，100%利用率','提供对称加密用户验证，签名权限控制及防盗链功能','OSS采用三副本机制，数据可靠性高','服务可用性比自建服务器略低','BGP多线骨干网络接入，全国各地流畅访问','无带宽限制，按实际用量付费'],exp:'服务可用性比自建服务器要高。'},
  {id:1019,type:'multi',answer:'CD',stem:'负载均衡（SLB）支持按量计费模式，按量计费实例可以随时释放。用户可以选择按固定带宽计费或按流量计费。关于按固定带宽计费和按流量计费说法错误的是（正确答案个数：2个） 选项：',opts:['按带宽计费实例的带宽峰值为业务承诺指标','出现资源争抢时，按带宽计费实例的带宽峰值有保证','按流量计费实例的带宽峰值为业务承诺指标','出现资源争抢时，按流量计费实例的带宽峰值有保证'],exp:'按流量计费实例的带宽峰值仅作为参考值和带宽峰值上限，带宽峰值不作为业务承诺指标。 按带宽计费实例的带宽峰值为业务承诺指标。 当出现资源争抢时，按带宽计费实例的带宽峰值有保证，按流量计费实例的带宽峰值可能受到限制。'},
  {id:1020,type:'multi',answer:'BD',stem:'监控ECS实例是否健康非常重要，比如用户需要确保始终可以快速打开网站和应用，或者快速完成数和监控，云监控提供更加精细化的监控粒度。',opts:['防攻击入侵','网络流量','配置自动升降','磁盘I/O'],exp:'本题核心考查阿里云ECS实例监控服务的功能划分。ECS自带监控聚焦基础性能指标，包含vCPU使用率、网络流量（衡量实例通信负载）和磁盘I/O（反映存储设备读写效率）三大核心数据；云监控则通过更细粒度指标扩展监控维度。防攻击入侵属于安全产品范畴，配置自动升降涉及弹性伸缩服务，均非ECS基础监控功能。正确答案对应基础监控层的关键性能参数。'},
  {id:1021,type:'multi',answer:'AD',stem:'云服务器ECS在哪些状态下才能创建快照？（正确答案的数量：2个）',opts:['Running','Stopping','任何状态','Stopped'],exp:'创建快照实例必须处于运行中（Running）或已停止（Stopped）状态。参考链接：https://help.aliyun.com/document_detail/25455.html'},
  {id:1022,type:'multi',answer:'BC',stem:'某企业使用阿里云的专有网络VPC构建了一个隔离的网络环境，并通过VPN专线将该网络与传统数据中心组成一个按需定制的网络环境，这样就可以把一些原来在传统数据中心中运行的应用平滑迁移到了阿里云上。现在需要从公网上接收用户请求，并使用阿里云的负载均衡SLB实例将这些请求分配到VPC中的多台云服务器ECS实例上去。以下说法中正确的有（正确答案的数量：2个）',opts:['用户在VPC内创建负载均衡SLB实例，并挂载VPC内的ECS实例，通过跳板机接收外部请求，然后将这些请求通过负载均衡SLB实例分发给后端ECS实例','用户创建公网IP的负载均衡SLB实例，挂载VPC中的ECS实例，这样来自于公网的请求就会被分流到VPC中的ECS实例上去处理','用户在VPC内创建负载均衡SLB实例，并挂载VPC内的ECS实例，为负载均衡SLB实例绑定一个EIP，即可实现负载均衡SLB实例接受公网请求，并将这些请求分发给后端ECS实例','用户创建公网IP的负载均衡SLB实例，挂载VPC中的ECS实例和本地数据中心的服务器，这样来自于公网的请求就会被分流到VPC中的ECS实例以及本地数据服务器上去处理'],exp:'题目考察的是公网分发请求至SLB的正确方法，按照官方推荐应该是购买公网IP的负载均衡SLB实例接收公网请求，或者创建VPC内的负载均衡SLB实例，然后再给这个SLB绑定EIP来接收公网请求。用跳板机接收外部请求不规范且冗余，既然有了公网IP，就没有必要使用跳板机来接收公网请求。'},
  {id:1023,type:'multi',answer:'AB',stem:'云服务器ECS提供了丰富的管理功能，使用户在不同场景下都能安全便捷地使用。登录Linux类型的云服务器ECS实例可以使用鉴权方式。（正确答案个数：2个）',opts:['用户名和密码','SSH秘钥对','accessKeyld和accessKeySecret','控制台VNC登录密码'],exp:'Linux系统远程登录通常使用SSH协议，主要支持密码和密钥两种鉴权方式。阿里云ECS文档指出，创建Linux实例时可选择设置登录密码或绑定SSH密钥对。accessKey用于API调用，VNC密码属于控制台应急登录方式，非主要鉴权选项。答案AB对应SSH的标准认证方法。'},
  {id:1024,type:'multi',answer:'AD',stem:'快照和镜像都是云盘的重要功能，两者之间既有联系又有区别。对于快照和镜像使用和定义的说法中正确的是（正确答案个数：2个）',opts:['使用系统盘快照，可以创建自定义镜像','使用数据盘快照，可以创建自定义镜像','需要先创建包含系统盘数据的快照，才能创建自定义镜像','使用系统盘快照创建自定义镜像时，可以添加数据盘快照'],exp:'可以不通过快照也能创建自定义镜像，所以C错误'},
  {id:1025,type:'multi',answer:'ABD',stem:'某用户开通了阿里云的云服务器ECS实例，作为管理员的他频繁收到云盾暴力破解的告警，以下措施可以降低密码被破解的风险。（正确答案的数量：3个） 选项：',opts:['修改远程管理服务的端口号','设置8位以上的复杂密码，定期修改','购买DDoS高防IP','在ECS前面增加负载均衡SLB，去掉ECS实例的公网IP，让ECS实例只响应来自SLB的请求'],exp:'DDoS高防IP只功能是防DDoS的大流量攻击，确保云服务稳定正常。'},
  {id:1026,type:'multi',answer:'CD',stem:'云盾”基础DDoS防护“功能在管理控制台可以配置针对云服务器的流量清洗触发值，请选出可配置的所有维度，达到任意一个值即开始流量清洗？（正确答案的数量：2个）',opts:['ECS公网IP每秒接收的字节数(b)','ECS公网IP每秒发送的字节数(b)','ECS公网IP每秒处理的报文数量(PPS)','ECS公网IP每秒处理的流量值（bps）'],exp:'流量清洗的触发指标有公网IP每秒处理的报文数量(PPS)和公网IP每秒处理的流量值（bps）。具体可以参考阿里云的DDoS防护操作文档：https://help.aliyun.com/document_detail/28408.html'},
  {id:1027,type:'multi',answer:'ACD',stem:'DDoS（分布式拒绝服务）攻击是指借助于客户端服务器技术，将多个计算机联合起来作为攻击平台，对一个或多个目标发动DDoS攻击，从而成倍地提高攻击的破坏力，使目标服务器无法提供正常服务。以下属于DDoS攻击。（正确答案的数量：3个）',opts:['ACK Flood','SQL注入','SYN Flood','DNS Flood'],exp:'DDoS有多种类型攻击，包括但不限于以下攻击类型ICMP Flood，UDP Flood、TCP Flood、SYN Flood、ACK Flood等'},
  {id:1028,type:'multi',answer:'CD',stem:'某个用户因业务需要，要求负载均衡SLB实例的后端服务器包括一台主ECS实例和一台备ECS实例，主实例工作正常时，流量转发至主机，主实例宕机时，流量切换至备机。这种情况下该用户可以在SLB实例后端创建主备服务器组，需要用户注意的是，此时只能创建监听。（正确答案个数：2个）',opts:['HTTP','HTTPS','TCP','UDP'],exp:'主备服务器组仅可适用于TCP和UDP监听上。'},
  {id:1029,type:'multi',answer:'ABD',stem:'ECS服务器使用注意事项说法正确的是（正确答案的数量：3个）',opts:['云服务器的内核和操作系统版本不要随意升级','Linux的云服务器数据盘未做分区和格式化，使用前请挂载数据盘','Windows操作系统的云服务器建议使用虚拟内存','网卡的MAC地址不要修改'],exp:'使用Windows操作系统的时候，只有机器内存较低（低于2G）的时候，建议使用虚拟内存。'},
  {id:1030,type:'multi',answer:'AC',stem:'中主可用区选择了可用区A，备可用区设置了可用区B，后端服务器设置了4台ECS实例，其中2台在华东1的可用区A，另外2台在华东1的可用区B，下面说法正确的有（正确答案的数量：2个）',opts:['当可用区A发生故障时，用户访问流量将转发至备可用区B内的ECS实例','当可用区A发生故障时，用户可以手动快速将负载均衡切换到另外一个备可用区以恢复服务能力','当主可用区A恢复时，负载均衡会自动切换到主可用区提供服务','当主可用区A恢复时，用户可以手动快速将负载均衡会切换到主可用区提供服务'],exp:'当主机工作正常时，流量将直接转发至主机；当主机宕机时，流量将切换至备机。参考链接：https://help.aliyun.com/document_detail/85965.html'},
  {id:1031,type:'multi',answer:'BCD',stem:'LVS采用IP负载均衡技术和基于内容请求分发技术，实现了Linux平台下的简单负载均衡。一般来说LVS集群采用三层结构，主要组成部分为（正确答案个数：3个）',opts:['共享网络','负载均衡器','服务器池','共享存储','DNS解析'],exp:'LVS（Linux Virtual Server）的核心架构涉及IP负载均衡技术与内容请求分发，其在Linux环境下构建负载均衡集群的标准三层结构。相关技术文档与官方资料指出，负载均衡器负责接收和分发客户端请求至后端服务器池，服务器池由多个实际处理请求的节点组成，而共享存储确保池内节点访问数据的一致性。选项A提到的共享网络属于网络架构设计，并非LVS结构的必要组成部分；选项E的DNS解析与LVS基于IP和内容分发的机制无关。选项B、C、D对应LVS官方定义的三层组件。'},
  {id:1032,type:'multi',answer:'ABC',stem:'云计算是一种商业计算模型，它将计算任务分布在大量计算机组成的资源池上，使各种应用系统能够根据需要获取计算力、存储空间和信息服务。以下哪些是按照云计算服务的部署方式分类的？（正确答案的数量：3个） 选项：',opts:['公共云','混合云','专有云','能源云'],exp:'能源云并不属于的云计算服务的部署方式。云计算的四种部署方式:私有云、社区云、公有云（公共云）和混合云。参考链接：http://www.enkj.com/idcnews/Article/20180627/13246'},
  {id:1033,type:'multi',answer:'CDE',stem:'部署集是控制ECS实例分布的策略，用户可以使用部署集将业务涉及到的ECS实例分布部署在不同的物理服务器上，以此保证业务的高可用性和底层容灾能力。在使用部署集之前，用户需要注意）（正确答案的数量:体3个)',opts:['一个账号在一个地域内的部署集配额不支持提额','一个部署集内能容纳的实例数量无限额','部署集之间不支持相互合并','部署集内不能创建抢占式实例','部署集不支持创建专有宿主机'],exp:'使用限制官方文档'},
  {id:1034,type:'multi',answer:'CD',stem:'阿里云的经典网络中的云服务器ECS迁移至VPC网络中，ECS的以下参数会改变？ 选项：',opts:['实例ID','实例密码','实例私网IP','实例公网IP'],exp:'在阿里云ECS从经典网络迁移至VPC网络时，实例ID作为唯一标识保持不变；实例密码由用户管理，迁移操作不自动更改。实例私网IP因经典网络与VPC网络架构不同（如IP地址段分配方式差异）会重新分配，因此改变；实例公网IP在迁移过程中，经典网络的公网IP通常无法直接保留，需绑定弹性公网IP（EIP）以维持，否则会改变，故C和D参数会改变'},
  {id:1035,type:'multi',answer:'ABCD',stem:'题干：565/1023、一个日访问量超过10万PV的小型门户网站想迁到阿里云上，主要提供文字和图片类信息服务，已经实现了动静分离，目标是满足全中国网民的快速访问，2年内日PV超过100万。选择阿里云的产品组合起来可以满足这个业务需求。（正确答案的数量：4个） 选项：',opts:['云服务器ECS','对象存储OSS','内容分发网络CDN','云数据库RDS','媒体转码（Media Transcoding）'],exp:'题目中需要将访问量超过10万PV的小型门户网站想迁到阿里云上，主要提供文字和图片类信息服务。已经实现了动静分离，目标是满足全中国网民的快速访问。1. 需要ECS来搭建和运行网站服务；2. 需要RDS来存储门户网站的用户数据。3. 需要对象存储OSS来实现图片等信息的存储。4. 需要内容访问CDN来满足全中国网民的快速访问。'},
  {id:1036,type:'multi',answer:'ABD',stem:'下列哪些云产品可以创建为专有网络类型？（正确答案的数量：3个）',opts:['ECS','RDS','ODPS','SLB'],exp:'目前云服务器ECS，数据库RDS，负载均衡SLB都是支持专用网络VPC网络的。'},
  {id:1037,type:'multi',answer:'BCD',stem:'对象是阿里云对象存储OSS存储数据的基本单元，也被称为OSS的文件。每个对象由文件名（Key），用户数据居（Data）和元信息（Object Meta）组成。其中，对象的元信息是一组键值对，表示对象的一些属性。OSS支持的文件操作包括（正确答案的数量：3个）',opts:['文件修改','文件创建','文件删除','文件读取'],exp:'OSS的文件（Object）不支持修改。参考链接：https://help.aliyun.com/knowledge_detail/65426.html'},
  {id:1038,type:'multi',answer:'AB',stem:'某企业网站使用阿里云负载均衡SLB实例来转发用户请求给后端云服务器ECS实例，如果负载均衡SLB实例被释放掉了，可能会对整个系统产生一些影响。以下说法中正确的有（正确答案的数量：2个）',opts:['ECS实例本身不会受到影响','如果部署在后端ECS实例上的应用对应的域名是解析到负载均衡SLB实例IP上的,那么会影响站点的访问口','ECS实例会立即被释放','如果部署在后端ECS实例上的应用对应的域名是解析到负载均衡SLB实例IP上的,释放后会导致ECS实例上负载不再均衡,只要保证ECS实例运行状态正常,网站的访问就不会受到影响'],exp:'SLB的释放只会影响到SLB实例，后端的ECS实例没有影响。但是因为域名是解析到SLB的IP的，所以域名访问会受到影响。'},
  {id:1039,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(AutoScaling)，是根据用户的业务需要和策略，自动调整其弹性计算资源的管理服务。它主要可以提供功能。（正确答案的数量：3个）',opts:['根据客户业务需要横向扩展云服务器ECS实例的数量，即自动增加或减少云服务器ECS实例','支持负载均衡SLB配置，在增加或减少云服务器ECS实例时，自动向负载均衡SLB实例中添加或移除相应的云服务器ECS实例','支持云数据库RDS访问白名单：在增加或减少云服务器ECS实例时，自动向云数据库RDS访问白名单中添加或移出该云服务器ECS实例的IP','根据客户业务需求提升或者缩减单个云服务器ECS实例的配置（包括内存大小、CPU个数等）'],exp:'云弹性伸缩(Auto Scaling)是不支持单个云服务器ECS实例的配置的弹性伸缩的。'},
  {id:1040,type:'multi',answer:'ABD',stem:'您已经创建好了阿里云的云服务器ECSLinux实例，并承担该云服务器的系统管理员角色，当发生无法远程连接该云服务器ECS实例时，以下检查方法中正确的是？（正确答案的数量：3个）',opts:['如果在本地无法telnet到云服务器ECS实例的ssh远程端口，可以通过管理控制台的远程终端登陆到云服务器ECS实例后，查看一下服务器上的ssh服务是否正常启动','查看一下云服务器ECS实例上是否有运行NetworkManeger的服务，这个服务可能会影响到您的网络，可以使用Service NetworkManager Status查看一下服务状态','检查本地客户端的TCP端口21对外网络访问是否正常','查看一下云服务器ECS实例上的防火墙是否拦截了ssh端口，可以先关闭防火墙进行测试'],exp:'题目是遇到的问题是无法远程连接该云服务器ECS实例，需要分别从防火墙，端口，以及可能影响网络的服务入手，同时检查你所需要连接的本地客户端是否已经成功联网也是有必要的。'},
  {id:1041,type:'multi',answer:'BCDEF',stem:'您已经创建好的阿里云的云服务器ECS实例上部署了服务A，当服务A不再需要提供服务时，可以使用该云服务器部署服务B，如果服务A和B所需的操作系统不同，则需要更换该ECS实例的系统盘。在执行该操作的过程中，以下说法正确的是？（正确答案的数量：5个）',opts:['更换系统盘之后，您的云服务器ECS实例的IP地址会发生变化','更换系统盘之后，您现有系统盘的自动快照及其上的数据会丢失','更换系统盘时可以选择用户自定义镜像、阿里云为您提供的公共镜像','在有数据盘的情况下，如果是Windows系统更换至Linux系统，由于Linux默认无法识别NTFS格式，需要您单独安装软件识别，例如ntfs-3G等','更换系统盘前云服务器ECS实例要处于"已停止"状态','在有数据盘的情况下，如果是Linux系统更换至Windows系统，由于Windows系统默认无法识别ext3，ext4，xfs等文件系统格式的磁盘，需要您单独安装软件识别，例如 ext2read ext2fsd 等'],exp:'排除法，更换系统盘并不是导致网络层的IP地址会发生变化。'},
  {id:1042,type:'multi',answer:'ACD',stem:'阿里云OSS图片处理服务(ImageService，简称IMG），阿里云OSS图片处理服务有哪些性能?(正确答案的数量：3个）',opts:['海量图片处理','无成本','通过简单的RESTful接口对图片进行处理','可靠性高'],exp:'OSS的图片处理为收费服务。所以是需要成本的。参考链接：https://help.aliyun.com/document_detail/47735.html'},
  {id:1043,type:'multi',answer:'AC',stem:'下面属于阿里云VPC内的网络组件有（正确答案数量：2个）',opts:['路由器','防火墙','交换机','IPS','IDS'],exp:'阿里云VPC（Virtual Private Cloud）的核心网络组件包括虚拟路由器和交换机。虚拟路由器作为VPC的枢纽，负责连接内部子网、处理路由表以及与公网或其他VPC的通信。交换机（vSwitch）是VPC中子网的实现载体，用于划分不同可用区的网络资源。这两个组件在阿里云官方文档《专有网络VPC用户指南》中被明确列为VPC的基础架构要素。选项B（防火墙）、D（IPS）、E（IDS）属于安全类产品，非VPC的标准网络组件。'},
  {id:1044,type:'multi',answer:'ABC',stem:'您在原有的数据中心已经部署了部分应用，现在需要构建新的应用，但本地的数据中心内的物理资源不够用，也没有办法进行扩容，使用以下哪些方案可以用于解决该问题？（正确答案的数量：3个） 选项：',opts:['在阿里云上申请专有网络VPC服务，并基于VPC申请新的云服务资源，与您原有的数据中心使用相同的内网地址网段','通过专线打通原有数据中心与阿里云上的VPC，实现已有数据中心向云上的平滑迁移','通过VPN打通原有数据中心与阿里云上的VPC，实现已有数据中心向云上的平滑迁移','直接申请阿里云的云服务器无需任何操作就可以与原有的数据中心内网打通，实现已有数据中心向云上的平滑迁移'],exp:'无需任何操作是不会打通的。'},
  {id:1045,type:'multi',answer:'CD',stem:'使用工具管理OSS资源时，OSS提供图形化工具、命令行工具、等方便管理OSS资源。（正确答案个数：2个)',opts:['文件整理工具','存储空间提醒工具','文件挂载工具','FTP工具'],exp:'OSS提供的官方管理工具包括：1. 图形化工具（如OSS Browser）；2. 命令行工具（如ossutil）；3. 文件挂载工具（如OSSFS，能将OSS存储空间挂载到本地文件系统）；4. FTP工具（方便通过FTP协议传输文件）。选项A和B并非OSS主要管理工具类型。正确答案为 C （文件挂载工具）和 D （FTP工具）'},
  {id:1046,type:'multi',answer:'ABC',stem:'B公司想基于阿里云的产品构建一个纯WEB版本的网盘，用于公司内3千名员工的内部文件的存储和分享。要求员工能在线上传和下载文件，并查看文件列表，员工之间可以授权共享查看和下载，存储容量为10Tb。那么B公司应该选用阿里云的产品来保证网盘的可扩展性。 （正确答案的数量：3个）',opts:['云数据库RDS，保存文件基本信息、下载链接、员工信息等','云服务器ECS，运行网盘应用程序','对象存储OSS，保存网盘里的文件','内容分发网络CDN，缓存热点文件'],exp:'因为是一个公司的员工，不存在分布在全国各地的情况，所以不需要用到内容分发网络CDN。其他的ECS，RDS，OSS都需要用到。'},
  {id:1047,type:'multi',answer:'ABD',stem:'网络基础设施已经成为云计算服务商的核心竞争力，拥有BGP线路的机房比普通的单线机房提供更快的网络传输能力，以下属于BGP机房的优点。（正确答案的数量：3个） 选项：',opts:['服务器只需要设置一个IP地址，服务器的上行路由与下行路由都能选择最优的路径，所以能真正实现高速的单IP高速访问','由于BGP协议本身具有冗余备份、消除环路的特点，所以当IDC服务商有多条BGP互联线路时可以实现路由的相互备份，在一条线路出现故障时路由会自动切换到其它线路','BGP机房的服务器都具备双机或多机容错功能，一台服务器宕机后不影响整体的对外服务，具备更高的可用性','使用BGP协议可以使网络具有很强的扩展性，将IDC网络与其他运营商互联，实现单IP多线路'],exp:'BGP机房的服务器并不是都具备双机或多机冗错功能。参考BGP机房的优点：（1）服务器只需要设置一个IP地址，最佳访问路由是由网络上的骨干路由器根据路由跳数与其它技术指标来确定的，不会占用服务器的任何系统资源。服务器的上行路由与下行路由都能选择最优的路径，所以能真正实现高速的单IP高速访问。（2）由于BGP协议本身具有冗余备份、消除环路的特点，所以当IDC服务商有多条BGP互联线路时可以实现路由的相互备份，在一条线路出现故障时路由会自动切换到其它线路。（3）使用BGP协议还可以使网络具有很强的扩展性可以将IDC网络与其他运营商互联，轻松实现单IP多线路，做到所有互联运营商的用户访问都很快。这个是双IP双线无法比拟的。'},
  {id:1048,type:'multi',answer:'AC',stem:'专有网络VPC(Virtual Private Cloud)是一个隔离的网络环境，专有网络之间逻辑上彻底隔离。以下关于VPC的说法，正确的有（正确答案个数：2个）',opts:['每个VPC都有一个独立的隧道号，一个隧道号对应着一个虚拟化网络','可以像传统网络环境一样划分子网，每一个子网内部的不同云服务器使用同一个路由器互联，不同子网间使用交换机互联','不同专有网络之间内部网络完全隔离，可以通过对外映射的IP互连','专有网络内的ECS使用安全组防火墙进行二层网络访问控制'],exp:'VPC基于隧道技术实现网络隔离，每个VPC分配唯一隧道号，对应独立虚拟化网络。不同VPC默认逻辑隔离，内部无法直接通信，需通过公网IP、VPN网关等外部网络组件连接。选项B混淆了路由器与交换机的功能，实际子网内通过交换机，跨子网通信依赖虚拟路由器。选项D错误，安全组作用于传输层（四层），非数据链路层（二层）。参考阿里云官方文档，VPC隧道标识与网络互联机制部分。A正确描述了隧道号作用，C指出隔离性并通过外部IP实现连接。B、D存在技术概念错误。'},
  {id:1049,type:'multi',answer:'ABCD',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，阿里云提供公网和私网两种类型的负载均衡服务，用户可以根据业务场景选择配置对外公开或对内私有的负载均衡。以下关于私网负载均衡实例的描述，正确的是',opts:['如果在创建负载均衡实例时选择的类型是私网类型，后续也可以通过绑定EIP，实现对公网流量的转发','私网负载均衡服务既可以被经典网络ECS实例访问，也可以被专有网络ECS实例访问','经典网络类型的私网负载均衡实例，其服务地址由阿里云统一分配和管理','专有网络类型私网负载均衡实例，其服务地址从指定的专有网络的交换机网段内分配'],exp:'CD是官网原话，AB也是对的（A要求slb是专有网路类型，）'},
  {id:1050,type:'multi',answer:'ABCD',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。OSS提供了多种文件上传的方法，以方便用户在不同的场景中使用。阿里云OSS支持文件上传方法。（正确答案的数量：4个)',opts:['从OSS管理控制台直接上传','通过OpenAPI上传','通过SDK上传','通过云市场里的FTP工具上传','通过移动硬盘直接拷贝到OSS中'],exp:'排除法，OSS对象存储不支持从移动硬盘直接拷贝到OSS中去。'},
  {id:1051,type:'multi',answer:'BCD',stem:'通过阿里云“弹性伸缩”服务自动创建的ECS符合以下哪些特征？（正确答案的数量：3个）',opts:['创建的ECS会配置相同的IP地址','如果伸缩组里指定了RDS实例，系统会自动将ECS的IP加入指定的RDS访问白名单当中','如果伸缩组里指定了SLB实例，系统会自动将ECS的加入到SLB组里','创建的ECS配置都是相同的'],exp:'弹性伸缩出来的机器配置和规格相同，但是不会出现相同IP的情况。'},
  {id:1052,type:'multi',answer:'BC',stem:'客户在处理OSS中存储的图片时，可以对OSS中存储的图片执行不同的操作，例如格式转换、缩放、水印和样式封装等。（正确答案个数：2个）',opts:['任何格式的图片质量转换','裁剪','旋转','更改图片颜色'],exp:'https://help.aliyun.com/document_detail/48113.html?spm=5176.11065259.1996646101.searchclickresult.5af212e41zqQG2'},
  {id:1053,type:'multi',answer:'ACD',stem:'以下关于OSS图片处理API Channel说法正确的有（正确答案的数量：3个）',opts:['一个用户最多可创建 10 个 Channel','存储容量每个Channel最高支持2PB','IMG名称在整个图片处理服务中具有全局唯一性，且不能修改','每个Channel中存放的 Object 的数量和大小总和没有限制'],exp:'单个Object（即每张图片）允许的最大大小是20MB。但是每个Channel中存放的object的数量没有限制。所以每个Channel的容量是没有上限的。所以"存储容量每个Channel最高支持2PB"说法是错误的。参考链接：https://help.aliyun.com/document_detail/32207.html'},
  {id:1054,type:'multi',answer:'BD',stem:'路由表是阿里云专有网络VPC路由器上管理路由条目的列表，路由条目定义了通向指定目标网段的网络流量的下一跳地址。路由表支持通过方式进行配置。（正确答案的数量：2个）',opts:['远程登录到路由器进行控制','专有网络VPC的管理控制台','进入机房直接对路由器进行控制','阿里云VPC的OpenAPI'],exp:'您可以通过专有网络VPC的管理控制台以及专有网络VPC的相关路由表接口来管理配置路由表，参考链接：https://help.aliyun.com/document_detail/87057.html'},
  {id:1055,type:'multi',answer:'AD',stem:'某企业经营着一个电商平台，托管在传统机房。主要销售方式是靠会员好友之间推荐和真实评价来吸引客户，，因此平台专门设置了一个交互式的论坛，平均24小时发帖量超过5000个。面临的主要困难是：每周2-3次的DDoS攻击，每次的流量在200M到1.5G之间。另外论坛内容审核工作量大，',opts:['DDoS基础防护，可防护小规模的DDoS攻击','开启态势感知，自动屏蔽违法信息','开启安骑士，在用户发贴的当时就能立即阻止','开启阿里绿网，具有自动识别违规内容的功能，可降低审核工作量'],exp:'题目中主要遇到两个问题：第一是每周2-3次的DDoS攻击，每次的流量在200M 到 1.5G之间，所以DDoS攻击的流量在4.5G以下，所以DDoS基础防护可以防护5G以下的DDoS攻击。第二是论坛内容违规审核工作量大，所以需要采用阿里绿网（现：内容安全）来降低审核工作量。'},
  {id:1056,type:'multi',answer:'BCD',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本，高可靠的云存储服务。为了让用户对存放在OSS里的文件访问可控，OSS为每个存储空间（Bucket)提供了多种访问权限。属于可以对Bucket设置的权限。（正确答案的数量：3个）',opts:['私有读','公共读写','公共读','私有'],exp:'Bucket的权限没有私有读的权限，参考链接：https://help.aliyun.com/document_detail/31843.html'},
  {id:1057,type:'multi',answer:'ABCDE',stem:'在部分地域（Region），阿里云的负载均衡SLB支持应用层的WAF安全防护。WAF是WEB应用防火墙的简称（WebApplicationFireWall），主要用于保护网站（HTTP服务）的安全性，实时对所有的HTTP请求进行合法性检查。阿里云负载均衡SLB的WAF可以提供针对攻击类型的安全防护。（正确答案的数量：5个）',opts:['SQL注入','跨站脚本','WebShell','CSRF（Cross-site Request Forgery）','本地文件包含','暴力密码破解'],exp:'暴力密码破解是属于云盾下面安骑士的功能，不属于WEB应用防火墙的功能。参考链接：https://help.aliyun.com/document_detail/63632.html?spm=5176.11065259.1996646101.searchclickresult.6bb517bdLI0XnZ，WAF漏洞释义参考链接：https://help.aliyun.com/knowledge_detail/42197.html'},
  {id:1058,type:'multi',answer:'AB',stem:'某用户在使用ECS实例过程中忘记登录密码，需要重置ECS登录密码。需要该用户注意的是，在重置ECS登录密码时，ECS实例状态可为，（正确答案个数：2个）',opts:['已停止','运行中','启动中','已过期'],exp:'ECS实例重置密码的核心机制要求实例处于稳定运行或关机状态。根据阿里云规范，运行中状态允许即时修改密码但需重启生效，已停止（关机）状态可直接设置新密码待启动使用。启动中是过渡态无法操作，已过期涉及计费问题不具备操作权限，故正确答案为运行中和已停止状态。'},
  {id:1059,type:'multi',answer:'AB',stem:'负载均衡支持创建HTTPS监听，并且提供了统一的证书管理服务，用户可以将证书上传到负载均衡，支持上传PEM格式的服务器证书和CA证书，需要上传（正确答案个数：2个）',opts:['服务器证书需要上传证书内容和私钥','CA证书只需要上传证书内容','CA证书需要上传证书内容和私钥','服务器证书只需要上传证书内容'],exp:'负载均衡的HTTPS监听配置涉及服务器证书和CA证书的上传要求。参考主流云服务商如阿里云、AWS的官方文档，服务器证书需包含公钥（证书内容）和私钥，用于建立安全连接。CA证书仅需证书内容，用于验证服务器证书的合法性。选项A符合服务器证书要求，选项B符合CA证书要求。选项C错误地将私钥包含在CA证书中，选项D缺少服务器证书必需的私钥。'},
  {id:1060,type:'multi',answer:'ACE',stem:'伸缩组是弹性伸缩的核心单元。伸缩组具有三种状态。（正确答案个数：3个）',opts:['Active','Stopping','Deleting','Starting','inactive'],exp:'弹性伸缩的核心单元伸缩组的状态划分在云服务文档中有明确说明。选项A（Active）代表正常运行中，可执行扩缩容操作；选项C（Deleting）表示资源正在删除过程中，此时无法进行其他操作；选项E（inactive）对应停用状态，伸缩组暂时失效但保留配置。其余选项如Stopping、Starting未在标准状态定义中出现。参考阿里云弹性伸缩官方文档，伸缩组生命周期包含Active、Inactive、Deleting三种主要状态，与题目答案一致。'},
  {id:1061,type:'multi',answer:'ABC',stem:'您开通了阿里云的云服务器ECS实例之后，可以免费开通云盾的安全能力对您的云服务器ECS实例的安全进行保护。（正确答案的数量：3个）',opts:['DDoS基础防护','阿里绿网','安骑士','服务器安全托管'],exp:'服务器安全托管不属于云盾功能，而是属于安全管家的服务。'},
  {id:1062,type:'multi',answer:'AB',stem:'云计算面临的安全威胁主要来自：可用性、完整性、保密性三个方面，以下威胁会影响云计算的保密性（正确答案数量：2个）',opts:['数据非法访问','网站出现后门，私密数据被公开','电力中断','骨干网中断'],exp:'电力中断不会影响数据泄漏'},
  {id:1063,type:'multi',answer:'BCDE',stem:'您在创建阿里云的云服务器实例时，以下配置是在购买云服务器时需要指定的。（正确答案的数量：4个)',opts:['上层部署的应用','内存','地域','CPU','镜像'],exp:'上层部署的应用是在阿里云云服务器ECS购买了以后才需要部署的，内存，地域，CPU，镜像都是需要在购买的时候指定的。'},
  {id:1064,type:'multi',answer:'ABC',stem:'某大型企业准备将公司内部的整套业务系统都迁到阿里云上，以节省整体的IT采购成本和运维成本，在安全性方面，公司提出了两点要求：1、因管理员经常出差，要能支持多地远程的安全运维。2、有多个子系统是不同部门独立使用的，子系统之间要做好网络隔离。以下方案组合可以满足该公司的需求。（正确答案的数量：3个)',opts:['使用云服务器ECS实例的安全组功能，将运行不同的子系统ECS分别放入独立的安全组','建立单独的ECS实例作为堡垒机，用于远程登录运维，授权堡垒机可访问其它子系统所在的ECS实例','在堡垒机上开启VPN服务（也可以直接使用云市场的VPN镜像），管理员运维时采用VPN加密通信','在专有网络 VPC下创建多台ECS实例，用于安装不同部门使用的子系统。所有ECS实例只分配私网IP，并放入唯一的安全组'],exp:'排除法，不用部门使用的子系统应该根据不同子系统的应用配置不同的安全组，每个子系统的安全组的分开配置，这样方便于日后的维护管理。而不是放入唯一的安全组。所以"放入唯一的安全组"是错误的。'},
  {id:1065,type:'multi',answer:'ABC',stem:'交换机是阿里云专有网络VPC的基础网络设备，可以连接不同的云产品实例。下列关于交换机的说法正确的包括哪些（正确答案的数量：3个）',opts:['VPC的交换机是个3层交换机，不支持2层广播和组播','交换机创建完成之后，无法修改CIDRBlock','删除交换机之前，必须先删除目标交换机所连接的云产品实例','新建交换机所使用的CIDRBlock可以与已经存在的交换机的CIDRBlock重复'],exp:'交换机不支持组播和广播。交换机创建后，不能再修改网段。详见创建交换机https://help.aliyun.com/document_detail/65387.html 删除交换机前，确保满足以下条件： 您已经删除交换机下创建的云资源，例如ECS实例、SLB实例和RDS实例等。 如果要删除的交换机下配置了SNAT条目、高可用虚拟IP等，请确保您已经删除了这些关联的资源。 交换机网段不能与所属VPC下其他交换机的网段重叠。如有网段重叠，请修改为其他网段。'},
  {id:1066,type:'multi',answer:'BD',stem:'载,可以让开发者能更加专注于自己的应用逻辑。要想实现这个方案,且确保每一次对OSS的访问都是安全可控的,至少需要OSS和哪些阿里云的产品配合。（正确答案的数量：2个）',opts:['负载均衡SLB（提升并发处理能力）','云服务器ECS(部署应用服务器)','内容分发网络CDN（提高访问速度）','访问控制（Resource Access Management）,用来生成临时访问凭证'],exp:'划重点：手机APP直联阿里云对象存储OSS实现上传和下载。说明就是手机需要下载的话直接从OSS的地址下载，只需要开发者的ECS服务器生成临时访问凭证即可。所以需要ECS和RAM权限控制。参考地址：https://help.aliyun.com/document_detail/31926.html'},
  {id:1067,type:'multi',answer:'ACE',stem:'某电子购物网站，为了方便用户，提供了购物车的功能，即在用户登录期间，可以添加自己喜欢的商品到购物车，选择完成后一次性付款即可。上述网站搭建在阿里云上，选用了云服务器ECS实例和负载均衡SLB实例，应用程序将会话信息和购物车信息都只保存在了应用程序的内存中，公测期间发现绝大部分测试用户的购物车功能没有问题，但一小部分用户的购物车发生了最早添加的商品随机丢失的现象。试分析以下哪些原因可能会造成这种情况？(正确答案的数量：3个）',opts:['用户购物的时长超过了负载均衡SLB实例中定义的会话保持的超时时间','用户使用手机登录，一次购物的过程中，发生过网络的切换导致的重新链接','某台云服务器ECS实例状态不正常，导致这部分用户前期的购物篮记录被清空','负载均衡SLB实例未开启会话保持功能','负载均衡SLB实例进行主备可用区切换导致部分用户数据丢失'],exp:'商品的数据都保存在内存中，那既然出现了数据丢失，出现的问题要么是用户没有访问保存购物数据的那台机器，要么是保存他那台数据的机器出问题了。'},
  {id:1068,type:'multi',answer:'AC',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，支持4层和7层流量的转发，若4层(TCP/UDP）健康检查出现异常，可能是原因导致的.（正确答案个数：2个）',opts:['SLB与后端ECS的网络类型不一致，SLB为经典网络，ECS为专有网络','后端服务器负载过高','ECS的安全组规则入方向配置错误','SLB的安全组规则出方向配置错误'],exp:'负载均衡SLB的4层健康检查依赖网络可达性。网络类型不一致时（如经典网络与专有网络不互通），SLB无法访问后端ECS。安全组规则入方向若未放通SLB对应端口，ECS将拒绝健康检查请求。阿里云官方文档明确要求SLB与ECS网络类型需一致，且ECS安全组需正确配置入方向规则。选项B不直接影响端口连通性，D通常出方向默认允许不影响健康检查。'},
  {id:1069,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(Auto Scaling) 的伸缩配置（ScalingConfiguration）中支持设置的镜像类型包含下面哪些？（正确答案的数量：3个）',opts:['自定义镜像','公共镜像','共享镜像','云市场镜像'],exp:'弹性伸缩设置ECS配置的时候，不支持使用云市场的镜像，主要是因为部分云市场的镜像是收费的，阿里云控制台没有云市场镜像的选项。'},
  {id:1070,type:'multi',answer:'ACD',stem:'某视频公司，使用负载均衡SLB将用户的访问请求分发到20台云服务器ECS实例上，由这些配置相同的ECS实例来响应用户的请求。春节将至，根据经验预估，假期期间业务量会增加一倍。可以使用阿里云弹性伸缩(AutoScaling）来满足资源的弹性变化的需求，由于可以准确的预测业务量变化情况，因此可以选择多种伸缩模式来实现。以下说法正确的是？（正确答案的数量：3个）',opts:['定时任务：在假期开始当天，增加ECS实例个数到40台，假期过后减少至20台','云监控报警任务：通过监控CPU，负载等，在资源紧张时动态增加ECS实例，在资源空闲时，减少ECS实例','固定数量模式：从假期开始当天，设置伸缩组的最小实例数为40台，假期过后将该参数调至20台','健康模式：保持伸缩组中当前的所有的ECS实例能正常工作，以满足用户访问请求的响应'],exp:'题目考察的是选择哪几种伸缩模式实现比较合理，并不是说单独需要什么模式来实现。划重点：由于可以准确预测业务量变化情况。所以不需要动态增加机器，所以报警任务不会选。'},
  {id:1071,type:'multi',answer:'BD',stem:'关于阿里云专有网络VPC中路由器和交换机的说法，正确的是（正确答案个数：2个）',opts:['路由器用于划分不同网段','交换机需要和私网网段绑定','VPC中通过路由表实现不同路由器互通','VPC中通过路由表实现不同交换机互通'],exp:'阿里云VPC中，交换机属于特定可用区，创建时必须指定私网网段（CIDR），且必须在VPC的网段内。每个VPC有默认路由表，也可自定义；交换机需绑定路由表，通过路由条目控制流量转发方向，不同交换机间通信依赖路由表配置。选项B对应交换机与私网网段的绑定要求，选项D对应交换机间互通由路由表实现。参考阿里云官方文档对VPC交换机及路由表的定义及配置流程。'},
  {id:1072,type:'multi',answer:'AB',stem:'SLB实例后端ECS实例权重设置为零对健康检查有影响。（正确答案个数：2个）',opts:['负载均衡不会再将流量转发给该ECS实例，且四层监听的后端服务器健康检查会显示异常','相当于将该ECS实例移出负载均衡','没有影响，只是分配的流量减少','有影响后端ECS会直接释放掉'],exp:'SLB实例后端ECS权重设置为零时，权重决定流量分配，零权重停止转发新流量。四层监听基于TCP/UDP，健康检查依赖端口访问，ECS不接收流量但端口仍可能无法响应，导致健康检查异常。阿里云文档指出，权重为零的ECS不会移除，但停止流量分发，实际效果类似移除。选项A正确因四层健康检查异常；选项B正确因流量停止等效移除。选项C错误因流量完全停止；D错误因权重无关实例释放。参考阿里云负载均衡产品文档。'},
  {id:1073,type:'multi',answer:'AC',stem:'阿里云作为云计算服务的提供商，为用户提供的安全保障服务包括（正确答案的数量：2个)',opts:['云计算底层硬件设施的安全运维','云服务器ECS中的应用维护','云计算租户之间的安全隔离','云数据库RDS的IP白名单设置'],exp:'阿里云作为云计算服务的提供商为用户提供的安全保障会包括云计算底层硬件设施的安全运维、云计算租户之间的安全隔离。但是云服务器ECS中的应用维护和云数据库RDS的IP白名单设置还是需要用户自己来做。'},
  {id:1074,type:'multi',answer:'BCD',stem:'如果用户已经开通了阿里云的云盾数据风控产品，当需要对业务请求进行风险判断时，可以调用数据风控产品提供的API进行“服务风险识别结果”查询，查询结果可能包括（正确答案的数量：3个）',opts:['不确定，无法判断是否有风险','可信，可以直接进入业务流程，对用户无感知','可疑，需要进一步验证或打标记观察','风险，可以直接拦截或将业务权限级别调低'],exp:'风险识别平台可对不同状态（可信、可疑、恶意）的请求进行不同处理。参考链接：https://wenku.baidu.com/view/b39a0aa0a1116c175f0e7cd184254b35eefd1a3c.html'},
  {id:1075,type:'multi',answer:'AB',stem:'使用阿里云负载均衡SLB实例时，通过会话保持可以实现于某个链接（SesSion)相关的所有应用请求能够由同一台后端云服务器ECS进行处理，为了在七层协议专发中，实现基于cookie的会话保持，阿里云的负载均衡SLB提供了处理方式。（正确答案数量：2个）',opts:['Cookie植入','Cookie重写','Cookie跟踪','Cookie校验'],exp:'可查看文档https://help.aliyun.com/knowledge_detail/55202.html，第四条。'},
  {id:1076,type:'multi',answer:'BCD',stem:'CDN节点系统关键组件有哪些?(正确答案的数量:3个)',opts:['origin','LVS','tengine','swift'],exp:'LVS做四层均衡负载；Tengine做七层负载均衡；Swift做HTTP缓存。参考链接：http://docs-aliyun.cn-hangzhou.oss.aliyun-inc.com/pdf/cdn-brief-manual-cn-zh-2016-05-11.pdf'},
  {id:1077,type:'multi',answer:'BC',stem:'阿里云上的很多云产品都有区分地域与可用区，每个地域完全独立。每个可用区完全隔离，但同一个地域内的可用区之间使用低时延链路相连。在使用ECS的时候下列场景是正确的。（正确答案个数：2个）',opts:['一个实例能挂载同一个Region中不同Zone的磁盘','安全组可以跨可用区','快照和镜像在一个Region中可见，可以跨可用区使用','实例可以跨地域进行迁移'],exp:'阿里云产品设计中，地域（Region）完全独立，可用区（Zone）隔离但通过低延迟链路连接。ECS实例所属的安全组作用范围不限制可用区，属于Region级别配置，支持跨可用区使用。快照和镜像是Region级别资源，同一个Region内所有可用区共享可见性。ECS实例无法直接跨地域迁移，数据盘仅支持挂载同一可用区的存储设备。参考阿里云官方文档关于地域与可用区、安全组、快照和镜像的定义。A错误（数据盘不可跨Zone挂载），D错误（实例不支持跨地域迁移）。'},
  {id:1078,type:'multi',answer:'ABCD',stem:'阿里云OSS与自建存储相比，有以下哪些优点？（正确答案的数量：4个）',opts:['海量存储','低成本','安全','多线BGP接入','支持数据备份'],exp:'自建的存储也是支持数据备份的，这个并不是OSS独有的优势。'},
  {id:1079,type:'multi',answer:'ABCD',stem:'您希望将您的应用部署在阿里云的产品上，实现降低成本、提升服务的可用性、云服务器快速部署和数据的异地备份这些需求，以下阿里云产品可以分别满足这些需求。（正确答案的数量：4个）',opts:['云服务器ECS的快照备份满足了应用、数据快速恢复的需求','通过制作云服务器ECS的镜像实现了高效、便捷的部署','合理选择地域来满足应用部署对地域的需求，同时也满足了关键应用、数据对异地备份的需求','负载均衡SLB配合ECS实例可以提升服务的可用性','合理选择内容分发网络CDN可以满足数据异地备份的需求'],exp:'内容分发网络CDN只是用来加快静态资源的访问速度，和数据异地备份没有关系。'},
  {id:1080,type:'multi',answer:'BC',stem:'阿里云的负载均衡SLB是对多台云服务器ECS实例进行流量分发的负载均衡服务，支持多种负载均衡的策略，包括（正确答案的数量：2个）',opts:['最近最少使用算法（Least Recently Used， 简称LRU）','加权轮询','加权最小连接数','先进先出（FIFO）'],exp:'负载均衡支持轮询、加权轮询（WRR）、加权最小连接数（WLC）三种调度算法。参考链接：https://help.aliyun.com/document_detail/53858.html'},
  {id:1081,type:'multi',answer:'ABC',stem:'.阿里云的云盾“DDoS基础防护”为阿里云用户提供最高5G的默认DDoS防护能力。用户如果加入安全信誉防护联盟计划，云盾将基于安全信誉分进一步提升DDoS防护能力，用户最高可获得100G的免费DDoS防护资源。以下有关云盾“DDoS基础防护”的特点描述正确的是（正确答案的数量：3个）',opts:['BGP线路防护：受到DDoS攻击不会影响访问速度，带宽充足不会被其他用户连带影响，优质带宽保证业务可用和稳定','精准防护：精准识别攻击，秒级开启防护，自研清洗设备和算法保证极低误杀','免安装免维护：无需采购昂贵清洗设备，自动为云上客户开通免安装，智能业务学习和配置防护规则','分布式：通过散列分布式的虚拟节点将业务分散部署，有效避免网络攻击的发生'],exp:'具体的可以参考DDoS基础防护服务的产品简介：https://help.aliyun.com/document_detail/28402.html'},
  {id:1082,type:'multi',answer:'ABC',stem:'云计算是一种商业计算模型，它将计算任务分布在大量计算机组成的资源池上，使各种应用系统能够根据需要获取计算能力、存储空间和信息服务。最常见的三种云计算的服务类型包括？（正确答案的数量：3个)',opts:['SaaS(软件即服务)','PaaS(平台即服务)','IaaS(基础设施即服务)','DBaaS(数据库即服务)'],exp:'云计算服务的三种类型（SaaS、PaaS、IaaS），参考链接：https://aws.amazon.com/cn/types-of-cloud-computing/'},
  {id:1083,type:'multi',answer:'AB',stem:'阿里云的负载均衡SLB中的证书（Certificate）用于HTTPS协议，当需要使用加密传输时，用户可以将证书上传至负载均衡SLB实例中，在创建HTTPS协议监听时绑定证书，提供HTTPS服务。用户可以采取以下方式上传证书。（正确答案的数量：2个）',opts:['通过负载均衡SLB的API上传','通过负载均衡SLB的管理控制台上传','通过FTP服务上传','先将证书上传至负载均衡SLB的后端服务器ECS实例上，负载均衡SLB会据此自动更新证书'],exp:'可以通过负载均衡的控台及负载均衡的API上传HTTPS证书，控台上传参考链接：https://help.aliyun.com/document_detail/32336.html，API上传参考链接：https://help.aliyun.com/document_detail/34181.html'},
  {id:1084,type:'multi',answer:'AB',stem:'下面可能是ECS实例的稳定状态的是（正确答案的数量：2个） 选项：',opts:['运行中','已停止','停止中','创建中'],exp:'稳定状态为已停止，运行中，已过期，停止中和创建中均为中间状态，特别注意运行中是稳定状态而非中间状态。'},
  {id:1085,type:'multi',answer:'ABD',stem:'专有网络VPC是用户独有的云上虚拟网络，用户可以将云资源部署在自定义的专有网络中。以下组件是VPC的必要组件（正确答案个数：3个）',opts:['路由器','交换机需要和私网网段绑定','公网网段','私网网段','NAT网关'],exp:'专有网络VPC的构建需包含核心组件。阿里云官方文档指出，VPC必须配置私网网段作为地址规划基础，路由器负责VPC内流量的转发控制，交换机将资源部署到具体子网并与私网网段绑定。公网网段和NAT网关属于可选扩展功能，用于连接公网或实现私网访问公网，并非必要。'},
  {id:1086,type:'multi',answer:'ABCD',stem:'创建阿里云的云服务器ECS实例后，用户无需购买单独的服务就可以抵御的安全攻击或者可以感知的威胁包括（正确答案的数量：4个）',opts:['异地登陆','Web漏洞发现','DDos攻击','暴力密码破解','敏感信息泄露'],exp:'阿里云ECS实例默认提供基础安全防护功能。DDoS攻击（C）由基础防护应对，如5Gbps流量清洗。暴力密码破解（D）通过安全组规则和云安全中心监控拦截多次失败尝试。异地登录（A）通过云安全中心识别异常地理位置触发告警。Web漏洞发现（B）依赖云安全中心基础版的基础漏洞扫描能力，如检测常见Web漏洞。敏感信息泄露（E）需额外服务支持，如内容安全或DLP，不包含在默认服务中。《阿里云安全白皮书》指出基础防护涵盖网络层攻击、入侵检测及漏洞扫描。'},
  {id:1087,type:'multi',answer:'ABD',stem:'下列关于',opts:['用户可以通过OSS将自己的bucket配置成静态网站托管模式','通过Bucket域名访问bucket配置的静态网站','OSS bucket静态托管中的默认首页不支持html格式文件','如果默认页面为空，则表示不启用静态页面托管'],exp:'OSS的静态托管是支持html格式的文件的。参考链接：https://help.aliyun.com/document_detail/31872.html'},
  {id:1088,type:'multi',answer:'CD',stem:'云计算服务的安全需要云服务的提供方(如阿里云)、ISV(独立软件开发商)和用户来共同参与，任何一方的疏漏都可能产生安全风险。云计算服务的用户需要（正确答案的数量：2个）',opts:['提供物理基础设施的安全防护','保证云机房的多路供电','定期修改业务系统密码','加强组织内部的信息安全管理，避免敏感信息外泄'],exp:'题目中问的是ISV（独立软件开发商）需要做哪些来保障安全，就是问使用阿里云服务的企业需要采取哪些安全错误来保障安全，从安全的角度先考虑，所以定期修改业务系统密码，加强组织内部的信息安全管理都是可行的办法。'},
  {id:1089,type:'multi',answer:'BCD',stem:'.如果用户需要实现OSSObject上传，下面哪些情况下使用OSS简单上传?（正确答案的数量：3个）',opts:['需要支持断点上传','上传文件最大不超过5GB','在上传单个文件过程中可以携带meta信息','基于PUT方式或POST方式的http请求上传'],exp:'简单上传指的是使用OSS API中的PutObject方法上传单个文件（Object）。简单上传不需要支持断点上传。简单上传适用于一次HTTP请求交互即可完成上传的场景，比如小文件（小于5GB）的上传。上传文件时支持设置Object Meta。参考链接：https://help.aliyun.com/document_detail/31848.html'},
  {id:1090,type:'multi',answer:'ABC',stem:'您可以根据业务的需要，选择采用手动或者镜像的方式进行阿里云的云服务器ECS实例的运行环境的部署。针对这两种部署方式，以下说法中正确的包括（正确答案的数量：3个）',opts:['阿里云的云市场提供了丰富的镜像资源，大部分镜像都集成了操作系统和应用程序','在创建ECS实例时，可以选择云市场的镜像来快速获得所需的应用程序，无需自行安装，如PHP，MySQL 等','如果您需要个性化定制的运行环境，可以使用手动部署','如果您使用镜像市场的镜像来重新初始化ECS实例，可以通过更换系统盘来完成操作，同时数据盘的数据也会受到影响'],exp:'更改系统盘操作，只会影响系统盘的数据，数据盘的数据不会受到任何影响。'},
  {id:1091,type:'multi',answer:'AB',stem:'伸缩配置(ScalingConfiguration)定义了用于弹性伸缩的ECS实例的配置信息。弹性伸缩为某个伸缩组自动增加ECS实例时,会根据伸缩配置创建ECS实例。ESS伸缩配置具有以下几种状态?(正确答案的数量:2个)',opts:['Active','Inactive','Deleting','down'],exp:'伸缩配置具有以下几种状态（LifecycleState）：Active：生效状态，伸缩组会采用处于生效状态的伸缩配置自动创建ECS实例。Inacitve：失效状态，该伸缩配置存在于伸缩组中，但伸缩组不会采用处于失效状态的伸缩配置自动创建ECS实例。参考链接：https://help.aliyun.com/document_detail/25945.html'},
  {id:1092,type:'multi',answer:'ACD',stem:'阿里云的云服务器ECS产品拥有传统服务器和虚拟主机无法企及的优势。属于云服务器ECS产品在服务器容灾备份方面的优势。（正确答案的数量：3个）',opts:['每份数据多份副本','需要用户人工制作数据备份','单份数据损坏可在短时间内快速恢复','无需额外的开发，支持自动的磁盘数据备份'],exp:'云服务器ECS产品默认支持三副本备份的方式，服务器容灾并不需要用户人工数据备份。'},
  {id:1093,type:'multi',answer:'ABCE',stem:'云计算是一种商业计算模型，它将计算任务分布在大量计算机组成的资源池上，使各种应用系统能够根据需要获取计算力、存储空间和信息服务。以下关于使用公共云计算相对于使用传统IDC的优势，从云计算的使用者角度来看，说法正确的有（正确答案的数量：4个）',opts:['云计算的使用者节约了建立基础设施的成本','云计算的使用者能快速搭建应用','云计算的使用者简化了管理和维护工作','云计算的使用者可以完全管理和控制底层基础设施','云计算的使用者拥有更大的灵活性和扩展性'],exp:'阿里云云计算的使用者是不可以管理和控制底层基础设施。'},
  {id:1094,type:'multi',answer:'ABCD',stem:'在众多的网络攻击类型中，“SQL注入”是应用层面临的主要攻击之一。如果用户搭建在云上的网站发现SQL注入漏洞，可能造成的危害包括（正确答案的数量：4个） 选项：',opts:['网页被篡改','数据被篡改','核心数据被窃取','数据库所在服务器被攻击变成傀儡主机','运行云上虚拟机的物理服务器损坏'],exp:'“SQL注入”破坏的是用户数据库的数据，数据库数据被破坏可能会导致题目中说的网页中关联的数据库数据被篡改，网页数据被篡改，用户根据脚本窃取核心数据，数据库所在服务器被攻击变成傀儡主机。但是“SQL注入”并不会导致云上虛拟机的物理服务器损坏。'},
  {id:1095,type:'multi',answer:'ABC',stem:'阿里云的负载均衡SLB可以把用户请求按照预设的转发策略分发到后端服务器池中的多台云服务器ECS实例上去，由不同的ECS实例完成请求的响应。以下关于后端服务器池中的ECS实例说法正确的是？（正确答案的数量：3个)',opts:['同一组ECS实例可以搭建多个网站，并可以同时对这些网站进行负载均衡','在使用负载均衡SLB实例的过程中，只要不超过限制，可以随时调整后端ECS实例的数目','负载均衡SLB不提供CNAME地址，需要直接将域名解析到负载约衡SLB提供的服务IP地址上','后端服务池中的ECS实例的权重加起来一定等于100','后端服务池中的ECS实例必须都是运行中状态'],exp:'负载均衡SLB不提供CNAME地址，只提供IP地址；后端服务器的权重之和是没有限制的，你可以每个权重都设置为100；后端服务池中的ECS可能由于异常导致机器不能正常运行，会出现非运行中的情况。'},
  {id:1096,type:'multi',answer:'ABD',stem:'CAP理论是分布式领域的重要理论，也被称为“帽子理论”。CAP理论指出，一个分布式系统不可能同时满足和这三个基本需求，最多只能同时满足其中的2个。(正确答案个数：3个)',opts:['一致性','可用性','可扩展性','分区容错性','高性能'],exp:'CAP原则又称CAP定理，指的是在一个分布式系统中，一致性（Consistency）、可用性（Availability）、分区容错性（Partition tolerance）。CAP 原则指的是，这三个要素最多只能同时实现两点，不可能三者兼顾。'},
  {id:1097,type:'multi',answer:'ABD',stem:'阿里云的专有网络VPC可以构建出一个隔离的网络环境，在这个网络中可以完全掌控自己的虚拟网络，也可以通过特定的连接方式将VPC与传统数据中心组成一个按需定制的网络环境。以下可以通过阿里云的专有网络VPC产品实现。（正确答案的数量：3个）',opts:['在单个地域内按业务需要私有网络的网段划分和IP分配，并在该专有网络VPC内创建云产品实例','可以通过将资源部署在处于同一个地域中的不同可用区的交换机中，从而实现利用阿里云的可用区进行容灾','可以通过将资源部署在同一个VPC网络中处于不同地域的交换机中，从而实现利用阿里云多地域进行容灾','通过物理专线将自有数据中心和阿里云VPC连接起来，实现用户网络与阿里云专有网络之间的内网互通'],exp:'同一个VPC只能创建同一个地域不同可用区的交换机实现可用区容灾，不支持跨VPC创建交换机。'},
  {id:1098,type:'multi',answer:'ABD',stem:'在使用阿里云的云服务器ECS实例的过程中，如果您的业务需求发生变化时可能需要进行重置操作系统或者磁盘的操作，在操作前需要注意提前备份对应磁盘里的数据。在进行上述的重置操作时法是正确的。（正确答案的数量：3个）',opts:['使用阿里云提供的公共镜像重置后需要对业务进行重新部署,包括应用的安装和配置,以尽快恢复业务','阿里云的云服务器ECS服务在重置启动前不会为您的实例和磁盘做自动备份','重新初始化系统盘会影响数据盘的数据','可以进行重置操作的前置条件是该ECS实例需要处于“已停止”的状态'],exp:'排除法，重新初始化系统盘对数据盘中的数据并没有影响。'},
  {id:1099,type:'multi',answer:'AB',stem:'云服务器ECS是一种简单高效、处理能力可弹性伸缩的计算服务。某用户使用一台ECS部署企业官网，以下操作，可能造成网站无法访问。 (正确答案个数：2个)',opts:['ECS更换系统盘','ECS修改安全组规则','手动创建快照','给ECS安装云监控插件'],exp:'云服务器ECS部署网站时，核心风险点在于系统盘存储着操作系统及服务运行环境，更换系统盘会直接清空原有数据导致服务中断；安全组作为网络访问控制规则，若修改后未正确开放HTTP/HTTPS端口或IP权限，将阻断外部访问。快照仅备份数据不影响在线服务，云监控插件属于运维组件无服务干扰。'},
  {id:1100,type:'multi',answer:'ABC',stem:'使用阿里云的高速通道可以实现专有网络VPC之间的互联和私网通信。以下场景可以通过高速通道实现。（正确答案的数量：3个）',opts:['同一个帐号下在同一地域内的两个VPC之间的私网通信','不同账号下的两个网段不同的VPC之间可以通过高速通道进行私网通信','同一个帐号处于两个不同地域的VPC之间进行私网通信','同一个账号下的VPC与经典网络的云服务器ECS实例的私网通信'],exp:'高速通道（Express Connect）是一款基于 IPVPN 的便捷高效的网络服务，用于在云上的不同网络环境间实现高速、稳定、安全的私网通信，包括跨地域/跨用户的 VPC 内网互通、专线接入等场景，有效的帮助您提高网络拓扑的灵活性和跨网络通信的质量和安全性。VPC中的ECS不可以和经典网络的ECS实现高速通道的通信。'},
  {id:1101,type:'multi',answer:'BC',stem:'伸缩活动的生命周期为：判断伸缩组的健康状态和边界条件步骤与启动cooldown步骤之间的所有活动，下面哪些活动是伸缩组自动扩展必要的？（正确答案的数量：2个）',opts:['ECS 实例的状态、类型','ECS 实例分配 IP','启动 ECS 实例','添加 RDS 白名单'],exp:'添加RDS白名单，虽然也是在自动伸缩的步骤中，但是伸缩组中不涉及RDS使用的实例不需要添加RDS白名单。请参考：https://www.cloud.alipay.com/docs/2/25914，关注自动拓展的部分。'},
  {id:1102,type:'multi',answer:'AB',stem:'阿里云的专有网络VPC可以帮助用户基于阿里云构建出一个隔离的网络环境。阿里云的负载均衡SLB支持专有网络VPC，即在通过专有网络VPC隔离出的网络环境里也可以使用负载均衡SLB服务。负载均衡SLB可以通过两种方式支持专有网络VPC。（正确答案的数量：2个）',opts:['用户可以申请使用自己VPC内的IP地址作为负载均衡SLB实例的私网地址，并挂载VPC的ECS实例','用户可以申请公网IP地址作为负载均衡SLB实例的公网地址，并挂载VPC的ECS实例','用户可以申请使用自己VPC内的IP地址作为负载均衡SLB实例的私网地址，并挂载经典网络的ECS实例','用户可以申请公网IP地址作为负载均衡SLB实例的公网地址，并可以混合挂载经典网络的ECS实例以及VPC的ECS实例'],exp:'负载均衡SLB结合VPC使用的基础知识。'},
  {id:1103,type:'multi',answer:'BC',stem:'阿里云内容分发网络CDN建立并覆盖在承载网之上，由分布在不同区域的边缘节点服务器群组成的分布式网络替代传统WEBSerVer为中心的数据传输模式。在CDN工作过程中，用户的访问请求首先会到达边缘节点，然后通过回源的方式从源站点抓取数据。以下关于阿里云CDN用户在源站服务器上获取“访客真实IP”的说法，正确的是（正确答案的数量：2个）',opts:['只能通过修改用户应用程序的方法获取','“访客真实IP”保存在HTTP协议的“X—Forwarded-For”Header中，可以在Apache和Nginx的自定义LOG中直接获取到','Windows平台下，如果使用IIS，需要安装一个“F5XForwardedFor”的扩展模块，才能在日志里看到“访客真实IP”','在阿里云CDN的管理控制台中有一键开通“记录访客真实IP”的功能，用户设置了这个关开后，可以在访问日志中直接看到访客真实IP'],exp:'题库考察的是在源站服务器上获取“访客真实IP”的做法正确描述。'},
  {id:1104,type:'multi',answer:'BC',stem:'您所在的企业准备上线一个预计会有很大流量的多媒体APP应用，希望基于阿里云的产品来保证系统的快速上线，为了更好的降低存储的费用并且降低用户的访问等待时间，您可以使用产品与云服务器ECS产品搭配使用，来满足以上需求。（正确答案的数量：2个）',opts:['单独购买多线BGP服务来降低用户访问等待时间','OSS作为静态图片、视频、下载包的存储，以降低存储费用','配合CDN进行静态内容的加速 ，可以减少用户访问等待时间','使用专有网络VPC来提升网络可用性'],exp:'划重点：降低存储的费用，降低用户的访问等待时间。所以需要选择对象存储OSS以及内容分发CDN。'},
  {id:1105,type:'multi',answer:'ABC',stem:'阿里云的云盾安骑士防暴力密码破解功能可以保护服务。 (正确答案的数量：3个)',opts:['windows远程桌面服务（RDP）、Linux远程控制服务（SSH）','文件传输服务（FTP）','MySQL数据库服务、SQLServer数据库服务','WEB服务（HTTP）'],exp:'排除法，WEB服务不属于安骑士的功能点。参考链接：https://help.aliyun.com/document_detail/31770.html'},
  {id:1106,type:'multi',answer:'ABC',stem:'负载均衡SLB是对多台云服务器进行流量分发的负载均衡服务，支持4层和7层流量的转发，某用户使用阿里云负载均衡服务对7层访问流量做分发，可选的调度算法有（正确答案个数：3个）',opts:['轮询(RR)','加权轮询(WRR)','加权最小连接数(WLC)','加权最短剩余时间(WST)','一致性略粉(CH)'],exp:'阿里云7层负载均衡（HTTP/HTTPS）支持的调度算法包括轮询（RR）、加权轮询（WRR）和加权最小连接数（WLC）。轮询按顺序分配请求，加权轮询根据服务器权重分配流量，加权最小连接数优先选择活跃连接数少的后端服务器。阿里云官方文档明确7层协议支持的调度算法为这三种选项。选项D（加权最短剩余时间）适用于特定场景但未在此处支持；选项E（一致性哈希）通常用于会话保持机制而非基础调度算法。'},
  {id:1107,type:'multi',answer:'BC',stem:'OSS是按使用收费的服务，为了防止您在OSS上的数据被其他人盗链，OSS支持基于HTTPheader中表头字段referer的防盗链方法。用户在进行下面哪些访问操作的时候，OSS会进行防盗链验证？（正确答案的数量：2个)',opts:['请求的Header中有“Authorization”字段的访问object','通过URL签名访问object','匿名访问object','白名单访问object'],exp:'用户只有通过URL签名或者匿名访问Object时，才会做防盗链验证。请求Header中有Authorization字段时，不会做防盗链验证。'},
  {id:1108,type:'multi',answer:'ABC',stem:'您希望将本地已经在运行的业务系统（包括服务器及Mysql数据库）迁移到阿里云上，增加系统的可扩展性，并且降低运维成本，以下是可行的操作。（正确答案的数量：3个）',opts:['使用数据传输DTS的增量数据同步功能将自建机房的MySQL实例的数据迁移到RDS for MySQL','将本地的应用部署到阿里云的云服务器ECS实例上','通过已经部署好的云服务器ECS实例制作镜像，进行应用的快速复制，生成更多的应用服务器','基于本地的应用服务器制作镜像上传到阿里云，直接生成新的云服务器ECS实例，提供服务'],exp:'本地的应用服务器制作镜像不支持上传到阿里云作为镜像提供服务。'},
  {id:1109,type:'multi',answer:'AB',stem:'在ECS中挂载磁盘的时候哪些请求参数时必须的？（正确答案的数量：2个）',opts:['DiskId','InstanceId','Action','Device'],exp:'Device和Action两个参数不是挂载云盘（挂载磁盘）接口AttachDisk的必须参数，参考链接：https://help.aliyun.com/document_detail/25515.html'},
  {id:1110,type:'multi',answer:'AB',stem:'阿里云的云服务器ECS实例在同一个地域内，不同账号下，经典网络下可以通过安全组规则设置两台云服务器之间内网互通。比如：UserA的用户在杭州有一台经典网络的ECS云服务器InstanceA(内网IP：A.A.A.A)，InstanceA所属的默认安全组为GroupA，UserB的用户在杭州有一台经典网络的ECS云服务器InstanceB(内网IP:B.B.B.B),InstanceB所属的默认安全组为GroupB。通过安全组配置实现lnstanceA和lnstanceB在内网上互通，正确的操作包括（正确答案的数量：2个）',opts:['UserA为GroupA添加一条这样的规则：在内网入方向上授权B.B.B.B的IP可以访问GroupA下的所有云服务器ECS实例','UserB为GroupB添加一条这样的规则：在内网入方向上授权A.A.A.A的IP可以访问GroupB下的所有云服务器ECS实例','UserA为GroupA添加一条这样的规则：在内网出方向上授权B.B.B.B的IP可以访问GroupA下的所有云服务器ECS实例','UserB为GroupB添加一条这样的规则：在内网出方向上授权A.A.A.A的IP可以访问GroupB下的所有云服务器ECS实例'],exp:'在经典网络下，不同账号的ECS实例内网互通需双向配置安全组入方向规则。因默认出方向允许所有流量，只需保证对方实例的入方向允许己方IP。选项A（UserA允许B.B.B.B入站）确保InstanceB可访问InstanceA；选项B（UserB允许A.A.A.A入站）确保InstanceA可访问InstanceB。C、D涉及出方向，但默认出方向无需配置，故排除'},
  {id:1111,type:'multi',answer:'ABC',stem:'用户可以通过控制台或API配置监听的健康检查。下列属于SLB健康检查必选参数配置的有？(正确答案的数量：3个）',opts:['响应超时时间','健康检查间隔','不健康阀值','健康检查请求'],exp:'注意题目要求的是必选参数，考的是配置健康检查的实际操作能力，健康检查请求不是必须的配置参数。参考链接：https://help.aliyun.com/document_detail/55477.html'},
  {id:1112,type:'multi',answer:'ABCE',stem:'某小型礼品电商网站部署在阿里云上，包含4台包年包月云服务器ECS实例子、负载均衡SLB实例和RDS实例。在双十一、情人节等时期需要应对客户抢购行为，这些时段并发量会是平时的3-10倍。为了应对业务高峰，该公司准备采用弹性伸缩服务创建伸缩组，那么可以配置哪些信息？(正确答案的数量：4个)',opts:['关联的RDS实例','伸缩组内ECS实例的最小值','关联的负载均衡服务实例','RDS实例的配置','伸缩组内ECS实例的最大值','伸缩组内ECS的最大配置'],exp:'排除法，题目问的是：创建伸缩组，可以指定哪些配置。1. 在创建伸缩组时候可以配置RDS的实例，但是并不能指定RDS的实例的配置，RDS的实例的配置需要在购买RDS的时候来指定的。2. 在创建伸缩组时只支持指定ECS的指定配置，不支持指定ECS的最大配置。'},
  {id:1113,type:'multi',answer:'AB',stem:'使用阿里云负载均衡SLB将负载分发到多台云服务器ECS实例上去的时候，即可获得发起请求的用户的真实IP。 (正确答案的数量：2个)',opts:['7层服务可以通过Http Header:X-Forwarded-For获取来访者真实IP,并保证配置负载均衡SLB监听时开启“获取真实访问IP”','4层服务可以直接获取,无需额外配置','4层服务可以通过Http Header:X-Forwarded-For获取来访者真实IP,并保证配置负载均衡SLB监听时开启“获取真实访问IP”','7层服务可以直接获取,无需额外配置'],exp:'针对4层（TCP协议）负载均衡服务，可以直接获取用户IP，七层则需要通过请求头中的X-Forwarded-For获取。'},
  {id:1114,type:'multi',answer:'ACD',stem:'小明是一名大学生，刚注册成为阿里云的用户，正在尝试创建一台ECS，在创建订单时，以下哪些会影响ECS对外提供服务的性能？（正确答案的数量：3个）',opts:['CPU与内存的大小','网络的类型(经典网络/专有网络)','带宽的大小','磁盘的性能'],exp:'ECS的网络的类型对对ECS的性能没有影响。'},
  {id:1115,type:'multi',answer:'AB',stem:'某互联网金融应用需要对大量的金融数据交换文件进行超大文本文件的结构化分析，期望达到的处理效率是分钟级，建议其采用的阿里云方案。（正确答案个数：2个）',opts:['将大量的金融数据交换文件存放在OSS上','通过MaxCompute的OSS外部表查询功能，将OSS上的文件加载到MaxCompute进行架构化分析','将OSS上的数据文件加载至DataLakeAnalytics进行结构化分析','使用DataLakeAnalytics，无需加载，即可对OSS中的文件进行结构化分析'],exp:'互联网金融应用每天都需要将大量的金融数据交换文件存放在OSS上，并需要进行超大文本文件的结构化分析。通过MaxCompute的OSS外部表查询功能，用户可以直接用外部表的方式将OSS上的大文件加载到MaxCompute进行分析，从而大幅提升整个链路的效率。'},
  {id:1116,type:'multi',answer:'BC',stem:'云计算服务的安全需要云服务的提供方（如阿里云)、ISV（独立软件开发商）和用户来共同参与，任何一方的疏漏都可能产生安全风险。管理员的日常运维习惯直接关系到云上资源的安全。以下属于良好的运维习惯。（正确答案的数量：2个）',opts:['三个管理员共用一套用户名和密码','购买云服务器ECS实例后，立即将管理密码修改为8位以上复杂密码','管理员通过统一的堡垒机远程管理云服务器ECS实例','管理员之前经常通过Email和QQ发送帐号和密码'],exp:'题目中问的是良好的运维习惯，很显然管理员之前经常通过Email和QQ发送帐号和密码，三个管理员共用一套用户名和密码，属于无规范的运维行为。'},
  {id:1117,type:'multi',answer:'BC',stem:'阿里云的云服务器ECS拥有与传统服务器和虚拟主机无法企及的优势。在服务器容灾备份方面以下属于云服务器ECS的优势。（正确答案的数量：2个）',opts:['支持自动备份','每份数据多份副本','单份数据损坏可在短时间内快速恢复','需要用户人工制作数据备份'],exp:'题目问的是ECS在容灾方面比传统虚拟主机拥有的优势，其中"支持自动备份"这个是传统虚拟主机也具备的。"需要用户人工制作数据备份"不能算优势。'},
  {id:1118,type:'multi',answer:'BCD',stem:'阿里云弹性伸缩（AutoScaling）中的冷却时间是指在同一伸缩组内一个伸缩活动执行完成后的一段锁定时间内，该伸缩组不执行某些类型的伸缩活动。冷却时间可以避免过于频繁的资源增加或减少的操作，有利于系统的稳定，带给用户更好的体验。以下哪些类型的伸缩活动即使在冷却时间内也可以执行？（正确答案的数量：3个） 选项：',opts:['云监控报警任务触发的伸缩活动','定时任务触发的伸缩活动','手工触发的伸缩活动','健康模式触发的伸缩活动'],exp:'在冷却时间内，伸缩组会拒绝由云监控报警任务触发的伸缩活动请求。但其他类型任务（手动执行任务、定时任务）触发的伸缩活动可以立即执行，绕过冷却时间。参考链接：https://help.aliyun.com/document_detail/25912.html'},
  {id:1119,type:'multi',answer:'BCD',stem:'客户创建好了阿里云的云服务器ECSLinux实例，并承担该云服务器的系统管理员角色，当客户远程连接该服务器时，发现无法连接至该云服务器ECS实例，可以通过来检查。（正确答案个数：2个）',opts:['查看一下云服务器ECS实例的网络对外访问是否正常','如果在本地无法telnet到云服务器ECS实例的ssh远程端口，可以通过管理控制台的远程终端登陆到云服务器ECS实例后，查看一下服务器上的ssh服务是否正常启动','检查本地客户端的防火墙是否有拦截','查看一下云服务器ECS实例上是否有运行NetworkManeger的服务，使用Service NetworkManager Status查看一下服务状态'],exp:'阿里云ECS实例无法远程连接时，优先考虑实例内部的SSH服务状态及网络管理服务。通过管理控制台的远程终端登录实例（选项B）可直接验证SSH是否正常运行，如sshd服务状态、端口监听情况。部分Linux发行版中NetworkManager服务若存在配置冲突或未正确启动（选项D），可能导致网络接口异常，影响SSH连接。阿里云官方文档建议此类场景下检查这两项，排除服务未启动或网络配置问题。选项A涉及出方向网络，通常与SSH入方向连接无关；选项C关注本地客户端，但题干侧重服务端问题排查。'},
  {id:1120,type:'multi',answer:'ABC',stem:'阿里云的云服务器ECS实例的磁盘快照是对某一个时刻的磁盘数据的备份，基于快照进行磁盘回滚操作时会把磁盘上的数据恢复到快照制作时的数据，在执行回滚快照操作时以下说法正确的是（正确答案的数量：体3个)',opts:['回滚快照会把磁盘上的数据回滚到快照制作时的数据，快照制作时间点到当前时间之间该磁盘上的数据变化将会丢失','回滚快照操作只能针对打过快照的磁盘进行','回滚快照操作时必需在云服务器ECS实例的状态为“停止”时才能进行','磁盘在未创建快照的情况下也允许通过其他磁盘的快照进行回滚或数据恢复'],exp:'磁盘在未创建快照的情况下是不允许通过其他磁盘的快照进行回滚或数据恢复'},
  {id:1121,type:'multi',answer:'CD',stem:'云计算服务的安全需要云服务的提供方(如阿里云)、ISV (独立软件开发商)和用户来共同参与，任何一方的疏漏都可能产生安全风险。云计算服务的ISV需要（正确答案的数量：2个）',opts:['制定完善的业务流程','制定良好的开发规范和测试规范，有完整的软件交付验收流程','部署云计算应用时有统一的操作规范，操作过程可追溯','应用系统中不同角色的岗位划分不同的权限，禁止共享账号密码'],exp:'题目中问是的ISV（独立软件开发商）需要做哪些来保障安全，就是问使用阿里云服务的企业需要采取哪些安全措施来保障安全，从安全的角度先考虑，所以需要考虑选项中的操作规范和角色账号的权限问题。'},
  {id:1122,type:'multi',answer:'ABD',stem:'您已经创建好了阿里云的云服务器ECSLinux实例，并承担该云服务器的系统管理员角色，当发生无法远程连接该云服务器ECS实例时，以下检查方法中正确的是？（正确答案的数量：3个）',opts:['如果在本地无法teinet到云服务器ECS实例的ssh远程端口，可以通过管理控制台的远程终端登陆到云服务器ECS实例后，查看云服务器上的ssh服务是否正常启动','查看以下云服务器ECS实例上是否运行NetworkManager的服务，这个服务可能会影响到您的网络，可以使用Service NrkManager Stater查看服务状态','查看本地客户端的TCP端口21对外网络访问是否正常','查看以下云服务器ECS实例上的防火请是否拦截了ssh端口，可以先关闭防火墙进行测试'],exp:'21号端口为ftp端口，ssh服务需要检查的端口为22号端口,官方地址'},
  {id:1123,type:'multi',answer:'AB',stem:'系统为创建的负载均衡实例分配服务IP地址。根据创建的负载均衡实例的类型，服务地址可能是IP。 （正确答案个数：2个）',opts:['公网','私网','网络','主机'],exp:'负载均衡实例是用于分配网络流量的系统，其服务IP地址的分配与其类型有关。在大多数情况下，系统为负载均衡实例分配的服务IP地址可以是公网IP或私网IP。公网IP地址是直接连接到公共网络的IP地址，而私网IP地址是仅在本地网络内使用的IP地址。因此，根据题目描述，系统为创建的负载均衡实例分配的服务IP地址可能是公网IP或私网IP，即选项A和B都是正确答案。'},
  {id:1124,type:'multi',answer:'ABC',stem:'阿里云的负载均衡SLB的Listener是服务监听，每个监听都对应了后端的一个应用服务。服务监听(Listener)包含了以下___内容。（正确答案的数量：3个）',opts:['监听端口','负载均衡策略','健康检查配置','负载均衡SLB实例的IP地址','后端ECS实例个数'],exp:'阿里云负载均衡SLB的服务监听（Listener）用于定义前端请求如何分发到后端服务。其配置涉及端口、策略及健康检查机制。阿里云官方文档指出，监听配置必须指定前端协议和端口（A），选择流量分发算法如轮询、加权（B），并设置健康检查参数确保后端服务可用性（C）。SLB实例的IP地址由系统分配或用户指定，属于实例属性而非监听配置（D）。后端ECS数量由服务器组管理，不直接关联监听配置（E）。'},
  {id:1125,type:'multi',answer:'ABC',stem:'专有网络VPC类型的ECS实例支持两种公网IP地址，分别是ECS系统分配的公网IP地址(NatPublicIP)和弹性公网IP（EIP)地址。关于两种公网IP地址说法正确的是（正确答案个数：3个） 选项：',opts:['如果用户希望长期使用某个公网IP地址，根据业务需要将它绑定到指定的ECS实例上，建议用户选择EIP地址。','如果希望释放实例时公网IP地址随实例一起释放，可以选择NatPublicIP.','在实例的使用期间，将带宽值设置为0Mbit/s，可以释放NatPublicIP。','一台ECS实例可以关联多个NatPublicIP或EIP。','如果ECS实例绑定了EIP地址，用户可在实例内部查询到公网网卡。'],exp:'专有网络VPC中ECS实例的公网IP类型包括系统分配的公网IP（NatPublicIP）和弹性公网IP（EIP）。NatPublicIP由系统自动分配，ECS实例释放后该IP自动释放，不具备长期保留能力；EIP支持独立创建、保留及灵活绑定/解绑到不同实例，适合需固定IP的场景。NatPublicIP带宽调整为0Mbit/s时，IP会被回收，而EIP需手动释放。VPC类型的ECS实例主网卡仅支持绑定一个NatPublicIP或一个EIP，但辅助弹性网卡可绑定多个EIP。ECS实例绑定的公网IP（包括EIP）不会直接配置在实例网卡上，实际通信通过VPC网关映射实现。阿里云官方文档明确区分了两种公网IP的特性及使用场景。选项A、B、C分别对应EIP的长期使用、NatPublicIP随实例释放特性、NatPublicIP带宽降为0时的释放机制。选项D错误，因主网卡仅支持单个公网IP绑定；选项E错误，因实例内部无法直接查询到公网IP的网卡配置。'},
  {id:1126,type:'multi',answer:'ABE',stem:'阿里云的负载均衡SLB、云服务器ECS以及弹性伸缩(AutoScaling)三者合理的搭配使用，可以发挥出各自的优势，比如部署简单、安全可靠、无单点障碍、可弹性伸缩、自动负载均衡、使用成本大幅度降低等，其中云服务器ECS承载了最终的计算、处理任务。在三者配合使用时，关于云服务器ECS的说法正确的有（正确答案的数量：3个）',opts:['同一个云服务器ECS实例只能添加到同一个伸缩组中','云服务器ECS实例的状态必须为运行中才能添加到伸缩组中去','同一个伸缩组中的云服务器ECS实例配置一定相同','云服务器ECS实例的付费类型必须为按量付费','同一个伸缩组中云服务器ECS实例必需加入负载均衡SLB白名单'],exp:'同一个伸缩组中的云服务器ECS实例配置可以不用相同。你可以手动添加闲置的不同配置的ECS进去，所以云服务器ECS实例的付费类型不是必须为按量付费，也可以的包年包月。'},
  {id:1127,type:'multi',answer:'ABCD',stem:'.使用了阿里云CDN后，如果缓存命中率比较低，可能的原因是（正确答案的数量：4个）',opts:['缓存配置不合理，针对某些文件设置较短，导致CDN节点频繁回源','HTTP Header设置导致无法缓存，需要用户检查源站的 Cache-Control 设置或者 Expires 的设置','源站动态资源较多，多为不可缓存的内容，也会导致频繁回源拉取','网站访问量较低，文件热度不够，CDN收到请求较少无法有效命中缓存'],exp:'题目考察的是缓存命中率比较低的原因，参考链接：https://help.aliyun.com/knowledge_detail/40108.html'},
  {id:1128,type:'multi',answer:'AB',stem:'题干：658/1023、某电商平台为吸引用户，除定期推出优惠活动外，还会在节假日、会员日、购物节开展大促。为保证顺利承载活动带来的流量，运维人员可以分析活动历史数据，提前预估新活动所需的计算资源。但如果高峰期流量超出预估，仍需要临时手动创建ECS实例，不仅操作仓促，而且可能因操作不及时影响应用可用性。可采用方案来应对这种情况。（正确答案个数：2个）',opts:['针对日常业务流量，购买包年包月ECS实例','针对计划外突增流量，通过弹性伸缩监控负载变化井实现自动创建ECS实例','使用OSS来解决该问题','使用大量的服务器来应对该问题'],exp:'该题目涉及云计算资源管理与弹性扩展策略。根据阿里云最佳实践，处理可预测流量与突发流量需结合不同资源规划方式。选项A通过长期预留资源优化日常成本，确保基础容量；选项B利用自动化弹性伸缩应对不可预见的峰值，避免手动操作延迟。OSS属于存储服务，与计算资源扩展无关；过度预置服务器导致资源浪费，不符合按需分配原则。阿里云官方文档明确推荐弹性伸缩与预留实例组合方案（参考：阿里云弹性伸缩产品文档）。'},
  {id:1129,type:'multi',answer:'ABC',stem:'阿里云内容分发网络CDN和传统厂商的CDN相比具有稳定快速、节约成本和简单易用三个特点。关于阿里云CDN易用性优势的描述，正确的是（正确答案的数量：3个）',opts:['WEB管理控制台了提供丰富简洁的配置界面，支持自定义防盗链、缓存策略、HTTP响应头等功能','可通过OpenAPI和SDK对CDN进行开通和关闭','如果CDN服务和加速域名同在一个阿里云帐号下管理，可以实现自动修改解析','用户只能通过OpenAPI下载CDN访问日志'],exp:'CDN控制台也是可以下载CDN访问日志的，OpenAPI并不是唯一途径。'},
  {id:1130,type:'multi',answer:'AD',stem:'配置负载均衡SLB之后，访问网站出现”500lnternalServerError"、“502BadGateway”和504GatewayTimeout”等错误，假设当前服务器中的PHP请求总数已经达到了PHP-FPM中max_children设置的上限，如果后续有新的PHP请求到达服务器，以下情况会出现。（正确答案个数：2个）',opts:['如果已有的PHP请求处理较慢，新的PHP请求处于等待状态，直至超过Nginx的fastcg_read_timeout值，则会出现504状态码。','如果已有的PHP请求处理较慢，新的PHP请求处于等待状态，直至超过Nginx的fastcgi_read_timeout值，则会出现500状态码。','如果已有的PHP请求被处理完成，新请求被继续处理，则会出现504状态码。','如果已有的PHP请求处理较慢，新的PHP请求处于等待状态，直至超过Nginx的request_terminate_timeout值，则会出现502状态码。'],exp:'PHP-FPM的max_children参数限制同时处理的子进程数。当达到上限，新请求需等待可用进程。Nginx的`fastcgi_read_timeout`控制等待FastCGI响应的超时时间，超时触发504。PHP-FPM的`request_terminate_timeout`定义单个请求最大执行时间，超时导致进程终止，Nginx返回502。选项A中Nginx的`fastcgi_read_timeout`触发504符合HTTP规范（RFC 7231），状态码504表示网关超时。选项D的PHP-FPM超时终止进程，Nginx无法获取响应，返回502（RFC 7231定义502为无效响应）。选项B的500通常指服务器内部错误，与超时无关。选项C的逻辑矛盾，处理完成不会有超时。'},
  {id:1131,type:'multi',answer:'ABC',stem:'如果您希望删除指定的阿里云的专有网络VPC，必须首先删除该专有网络内的所有云产品实例，包括（正确答案的数量：3个）',opts:['安全组','交换机','云服务器ECS实例','路由器'],exp:'排除法，路由器是你删除VPC时自动删除的。参考链接：https://help.aliyun.com/document_detail/27717.html'},
  {id:1132,type:'multi',answer:'ACD',stem:'在使用阿里云ECS的过程中，经常会遇到关于磁盘的操作，以下关于磁盘的操作实践，是错误的。（正确答案个数：3个）',opts:['ECS实例在任何状态下都可以允许更换系统盘操作','无论是包年包月还是按量付费的ECS实例都支持更换系统盘操作','更换系统盘，原系统的所在实例的ID也会发生变化','更换系统盘，原系统盘快照也会随之丢失','当用户释放云盘时，存储系统立即销毁元数据，确保无法继续访问数据'],exp:'阿里云官方文档指出，ECS实例需处于已停止状态才能更换系统盘，并非任何状态均可操作。系统盘更换不影响实例ID，原有快照仍保留，用户手动创建的快照不会被自动删除。释放云盘时，存储系统会立即移除元数据，终止访问权限，但物理数据清除可能需要时间。更换系统盘功能对包年包月和按量付费实例均适用。错误选项：A（实例状态限制）、C（实例ID不变）、D（快照保留）。正确选项：B、E符合官方说明。'},
  {id:1133,type:'multi',answer:'ABCE',stem:'C公司在传统IDC机房有一套应用系统，用了共计50多台服务器，运维成本越来越高，希望迁到阿里云降低资产拥有成本和运维成本。该系统的硬件包括30台WEB服务器、5台MySQL数据库服务器、5台文件存储服务器、5台自建LVS负载均衡、5台数据备份服务器。C公司要想在系统功能不损失的前提下上云，应该选用阿里云的产品。（正确答案数量：4）',opts:['云服务器ECS','云数据库RDS','对象存储OSS','弹性伸缩(Auto Scaling)','负载均衡SLB'],exp:'题目中的系统的硬件分别对应，30台WEB服务器对应云服务器ECS、5台MySQL数据库服务器对应云数据库RDS、5台文件存储服务器对应对象存储OSS、5台自建LVS负载均衡对应负载均衡SLB、5台数据备份服务器是不需要的，因为ECS和OSS提供了多重冗余备份。'},
  {id:1134,type:'multi',answer:'AC',stem:'FTP服务器是在互联网上提供文件存储和访问服务的计算机，在阿里云上，想要部署FTP服务器并可以进行公网访问需要产品。（正确答案个数：2个）',opts:['EIP','SLB','ECS','RDS'],exp:'FTP服务器的部署需要云服务器实例来承载服务，ECS提供计算资源用于安装和运行FTP服务。FTP对外提供公网访问必须绑定公网IP地址，EIP能够为ECS实例分配固定的公网IP。阿里云文档明确提到，若ECS实例需要通过公网被访问，通常需要绑定EIP或分配公网IP地址。SLB用于流量分发，与FTP单节点部署场景无关；RDS为数据库服务，与文件存储服务无关。'},
  {id:1135,type:'multi',answer:'BC',stem:'某云上用户使用ECS服务器承载其业务应用，对象存储服务OSS作为业务应用的文件存储。因业务需要，用户需要将OSS服务的某个存储空间（Bucket）配置为云存储网关，作为文件系统通过NFS协议挂载至ECS实例。配置完成后，存储空间Bucket可作为或挂载至ECS实例中使用。（正确答案个数：2个）',opts:['数据库系统','文件系统','存储卷','归档存储'],exp:'阿里云云存储网关支持将OSS存储空间转换为标准文件协议访问。根据产品文档，云存储网关提供文件网关和块网关两种形态。文件网关通过NFS/SMB协议挂载为文件系统，块网关通过iSCSI协议挂载为存储卷。选项B对应文件系统形态，C对应存储卷形态。A（数据库系统）通常需要直接块存储而非文件接口，D（归档存储）是OSS的存储类型，与网关挂载方式无关。阿里云官方文档明确云存储网关支持这两种挂载模式。'},
  {id:1136,type:'multi',answer:'ABD',stem:'OSS是按使用收费的服务，为了防止用户在OSS上的数据被其他人盗链，OSS支持基于HTTPheader中表头字段referer的防盗链方法。下列关于oss防盗链的说法正确的是？（正确答案的数量：3个）',opts:['Referer参数支持通配符“*”和“？”','白名单为空时，不会检查referer字段是否为空。','在支持通配符中，可以使用问号“？”代替0个或多个字符','白名单不为空，且设置了不允许referer字段为空的规则；则只有referer属于白名单的请求被允许，其他所有的请求会被拒绝。'],exp:'在支持通配符中，正确是用星号*：代替0个或多个字符。参考链接：https://help.aliyun.com/document_detail/44198.html'},
  {id:1137,type:'multi',answer:'ABC',stem:'阿里云的云监控通过监控弹性公网IP（EIP）的的出流量、入流量、出流量数据包数、入流量数据包数4个监控项，帮助用户监测EIP的运行状态。下列关于弹性公网IP监控说法准确的是（正确答案的数量：3个）',opts:['创建EIP后，云监控自动开始对其监控','用户可登录云监控的管理控制台界面查看EIP的监控数据','用户可以对监控项设置报警规则，以便数据异常时收到报警信息','创建EIP后，云监控服务需要手动开启之后，才开始对EIP进行监控'],exp:'排除法，创建EIP后，云监控服务自动开启，无需手动开启即可对EIP进行监控。'},
  {id:1138,type:'multi',answer:'ABCD',stem:'地域（Region）是指ECS实例所在的物理位置。目前全球可供选择的地域有哪些？（正确答案的数量：4个)',opts:['北京','青岛','香港','杭州','蒙古'],exp:'目前地域中还未有蒙古可供选择。具体的可至云服务器控制台在查看具体的地域和可用区。'},
  {id:1139,type:'multi',answer:'ABC',stem:'MapReduce是一种编程模型，用于大规模数据集的并行运算，可以非常好的和云计算相结合以处理海量数据计算。MapReduce的设计目标包括以下哪些项？（正确答案的数量：3个）',opts:['易于编程','易于扩展','高容错性','实时性'],exp:'MapReduce将自己的程序运行在分布式系统上，他的计算速度比较慢，计算出来的中间结果等等都会写到磁盘上，输出的结果也会到磁盘上，读写磁盘就意味着性能不能达到实时的要求。做历史数据的批处理比较好。'},
  {id:1140,type:'multi',answer:'CD',stem:'对象存储服务(ObjectStorageService，OSS)是一种海量、安全、低成本、高可靠的云存储服务，文件元信息(ObjectMeta)是对上传到OSS的文件的属性描述，若用户需要修改已上传object的元数据，可采用正确答案个数：2个）',opts:['在OSS控制台修改Object的属性值','使用OSSAPI中的ModifyObjectMeta方法进行修改','将Object下载到本地，删除原来的Object，重新上传更改元数据后的Object','通过CopyObject或者UploadPartCopy接口对Object进行拷贝，修改目标文件的元数据，再将源文件删除。'],exp:'OSS的元数据修改机制中，元数据一旦上传无法直接修改，必须替换整个Object。参考阿里云OSS文档描述，Object Meta在创建时确定，后续修改需重新上传或复制覆盖。选项C通过重新上传替换元数据，选项D利用拷贝接口覆盖元数据，均符合OSS不可变元数据的设计。选项A控制台不支持直接修改元数据，选项B不存在Modify Object Meta方法，官方API未提供此接口。'},
  {id:1141,type:'multi',answer:'AC',stem:'路由表中的每一项是由一条路由条目。路由条目指定了网络流量的导向目的地，由下一跳三部分组成。路由条目包括系统路由和自定义路由。（正确答案个数：2个）',opts:['目标网段','路由类型','下一跳类型','源地址'],exp:'路由条目用于定义网络流量的转发规则，其核心结构通常包含关键字段。在常见网络教材中，路由表项的主要组成包括目标网络地址、相关路由协议或类型信息以及下一跳的地址或接口标识。例如，目标网段明确数据包需到达的网络范围，下一跳类型可能涉及下一跳的地址类型（如IP地址或接口名称），而下一跳字段则直接指向具体转发路径的下一节点。选项A（目标网段）对应路由的目的地网络范围，选项C（下一跳类型）关联下一跳的具体形态，两者共同构成路由条目的基础要素。'},
  {id:1142,type:'multi',answer:'AC',stem:'阿里云的专有网络VPC中的云服务器ECS实例如果希望访问经典网络中的云数据库RDS实例，以下有关操作方法及产生的影响的说法正确的是（正确答案的数量：2个）',opts:['给VPC内的云服务器ECS实例绑定EIP，给RDS实例设置外网连接地址，VPC内的云服务器ECS实例通过公网访问RDS实例的公网地址，经典网络的其他云服务器ECS实例还可以继续访问该RDS实例','给VPC内的云服务器ECS实例绑定EIP，给RDS实例设置外网连接地址，VPC内的云服务器ECS实例通过公网访问RDS实例的公网地址，经典网络的其他云服务器ECS实例将无法再访问该RDS实例','将经典网络的RDS实例切换到VPC下，VPC内的云服务器ECS实例可以直接通过内网访问RDS实例，经典网络的其他云服务器ECS实例将无法再访问该RDS实例','将经典网络的RDS实例切换到VPC下，VPC内的云服务器ECS实例可以直接通过内网访问RDS实例，经典网络的其他云服务器ECS实例依然可以继续访问该RDS实例'],exp:'云服务器ECS实例通过公网访问RDS实例的公网地址的时候，不会影响到其他经典网络通过公网访问此RDS实例；在VPC中的RDS，其他经典网络则无法访问该RDS实例。'},
  {id:1143,type:'multi',answer:'BCD',stem:'您创建阿里云的云服务器ECS实例的同时可以创建多块数据盘，用于存储应用的数据。如果是LinuxECS实例的数据盘创建成功之后，数据盘的设备名可以是（正确答案的数量：3个）',opts:['/dev/xvda','/dev/xvdb','/dev/xvdd','/dev/xvdz'],exp:'正常情况下用fdisk -l命令,可以查看到新增的硬盘。/dev/xvda为系统盘，/dev/xvdb,/dev/xvdc.../dev/xvdz都是数据盘。'},
  {id:1144,type:'multi',answer:'ACE',stem:'用户购买云服务器ECS后，为了保证ECS实例的正常运行，在使用之前用户需要了解ECS相关操作的注意事项，包括但不限于下列选项（正确答案个数：3个）',opts:['禁止使用ECS实例做流量穿透服务','购买成功后，不得进行更换系统盘操作','不要随意修改网卡MAC地址','对于4GiB以上内存的云服务器，需选择32位操作系统','不要编译Linux系统的内核，或对内核进行任何其他操作'],exp:'阿里云ECS实例使用需遵循其产品规范。文档指出滥用网络资源如流量穿透违反服务协议，可能导致服务终止。ECS实例的网卡MAC地址由系统分配，手动修改会引发网络异常。官方不建议用户自行编译或修改内核，以避免兼容性问题或系统故障。更换系统盘为支持的常规操作，不影响实例所有权。64位操作系统可更好利用4GiB以上内存，32位系统存在内存寻址限制。'},
  {id:1145,type:'multi',answer:'ABD',stem:'阿里云的云服务器ECS实例通常是黑客攻击的重要目标。针对云服务器ECS实例的攻击有多种类型，攻击是专门针对云服务器ECS实例的操作系统的。（正确答案的数量：3个）',opts:['SSH密码暴力破解','RDP密码暴力破解','SQL注入','安装木马后门'],exp:'排除法，SQL注入是针对RDS数据库进行的攻击。'},
  {id:1146,type:'multi',answer:'BDE',stem:'云服务器ECS实例等同于一台虚拟服务器，内含CPU、内存、等基础的计算组件。（正确答案个数：3个)',opts:['声卡','操作系统','硬盘','磁盘','网络配置'],exp:'云服务器ECS实例的基础组件包括计算、存储和网络资源。阿里云官方文档指出，ECS实例由vCPU、内存、存储（如云盘）及网络配置构成。选项B（操作系统）属于实例运行必需的软件环境，C（硬盘）对应存储资源，E（网络配置）涉及实例的网络属性。A（声卡）并非云服务器基础硬件组件，D（磁盘）与C（硬盘）在题干语境下属同类存储资源，但题干限定三个正确答案。'},
  {id:1147,type:'multi',answer:'AD',stem:'阿里云块存储服务提供数据块级别的存储服务，包括云盘和本地盘两种，在进行选择时需要了解二者的异同。本地盘与云盘对比来看（正确答案个数：2个）',opts:['云盘和本地盘均支持SSD','云盘和本地盘均支持快照','云盘和本地盘均采用多副本的机制保证数据可靠性','云盘和本地盘的性能均与其容量大小有关'],exp:'本地盘不支持创建快照，也不保障数据安全'},
  {id:1148,type:'multi',answer:'AB',stem:'云计算服务的安全需要云服务的提供方（如阿里云)、ISV（独立软件开发商）和用户来共同',opts:['阿里云负责底层云平台的安全，并为用户提供安全防护的工具（云盾）','操作系统之上的应用和数据安全需要用户的参与','用户选择了阿里云，一切安全问题由阿里云全部搞定','安全责任完全由客户自己承担，上不上云没有区别'],exp:'阿里云负责底层云平台的安全责任，用户仍然需要参与维护操作系统上的应用和数据安全。'},
  {id:1149,type:'multi',answer:'CDE',stem:'某阿里云用户使用专有网络VPC来规划网络架构，他发现，每个VPC有一张系统自动创建的默认路由表，VPC内的所有交换机默认使用该路由表。他希望灵活地进行网络管理，以下动作是VPC可以支持的。（正确答案个数：3个)',opts:['删除系统路由表','删除系统路由','创建自定义路由表','创建自定义路由','将交换机从系统路由表解绑'],exp:'创建专有网络后，系统会自动为您创建一张系统路由表并为其添加系统路由来管理专有网络的流量。一个专有网络只有一张系统路由表。该系统路由表在创建专有网络的时候自动为您创建，您不能手动创建也不能删除系统路由表。https://help.aliyun.com/document_detail/100380.html 创建专有网络后，系统会自动为您创建一张默认路由表并为其添加系统路由来管理专有网络的流量。您不能创建系统路由，也不能删除系统路由https://help.aliyun.com/document_detail/128368.html'},
  {id:1150,type:'multi',answer:'AB',stem:'在删除阿里云弹性伸缩(AutoScaling)的伸缩组时有两种模式：强制删除和非强制删除。在非强制删除模式下，必须满足以下哪两个条件才可以删除？（正确答案的数量：2个）',opts:['伸缩组没有任何伸缩活动正在执行','伸缩组当前的ECS实例数量为0','伸缩组没有对应的定时任务以及报警任务','伸缩组没有和负载均衡SLB，云数据库RDS配合使用'],exp:'如果 Forcedelete 属性为 false，必须满足以下两个条件，才能删除伸缩组：1.伸缩组没有任何伸缩活动正在执行。2.伸缩组当前的 ECS 实例数量（Total Capacity）为 0。'},
  {id:1151,type:'multi',answer:'ABCE',stem:'您需要在阿里云上创建云服务器ECS实例，哪些因素可能导致您创建的云服务器ECS实例所产生的费用不同。（正确答案的数量：4个）',opts:['云服务器ECS实例的地域','云服务器ECS实例的付费模式','云服务器ECS实例的镜像类型','将要部署在云服务器ECS实例上的应用不同','云服务器ECS实例的公网带宽不同'],exp:'排除法，可以了解一下ECS的费用组成部分，即哪些配置会影响到ECS的价格。很显然，部署在ECS上面的不同应用是属于系统软件部分，不会影响到ECS的费用。'},
  {id:1152,type:'multi',answer:'ABC',stem:'阿里云弹性伸缩(AutoScaling)，是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务。以下哪些应用场景可以由弹性伸缩实现？（正确答案的数量：3个）',opts:['用户根据自己的业务需求自动调整其弹性计算资源，在满足业务需求高峰增长时无缝地增加ECS实例数量','用户根据自己的业务需求自动调整其弹性计算资源，在业务需求下降时自动减少ECS实例数量以节约成本','当伸缩组中的某个ECS实例发生故障时，弹性伸缩会创建新的ECS实例，接管故障ECS实例的计算任务','用户根据自己的业务需求，自动调整期弹性计算资源，在业务需求上升时，自动提高ECS的配置'],exp:'排除法，弹性伸缩(Auto Scaling)是横向扩展，扩展的是云服务器ECS实例的个数，云服务器ECS实例的配置是不支持伸缩的。所以自动提高ECS的配置是错误的。'},
  {id:1153,type:'multi',answer:'BCD',stem:'在实际项目中，通常会把阿里云的负载均衡SLB、云服务器ECS以及弹性伸缩服务（AutoScaling）结合起来使用，以下关于三者配合使用的说法中正确的有（正确答案的数量：3个）',opts:['三者可以不在同一个地域（Region），也能配合使用','负载均衡SLB实例必须打开健康检查，否则无法和弹性伸缩配合使用','一个SLB实例可以绑定多个伸缩组','一个伸缩组可以同时支持多个SLB实例','负载均衡SLB实例必须关闭会话保持，否则将影响弹性伸缩活动的执行'],exp:'三者必须要在同一个地域才配合使用。会话保持的开关和弹性伸缩的拓展没有关联性能。弹性伸缩会自动释放ECS实例，所以建议伸缩组内ECS实例不要保存应用状态信息和相关数据等信息，例如会话记录（Session）、数据库或者日志等。但是你不关闭并不会影响到伸缩活动的执行。所以"[答案解析]三者必须要在同一个地域才配合使用。会话保持的开关和弹性伸缩的拓展没有关联性能。弹性伸缩会自动释放ECS实例，所以建议伸缩组内ECS实例不要保存应用状态信息和相关数据等信息，例如会话记录（Session）、数据库或者日志等。但是你不关闭并不会影响到伸缩活动的执行。所以"必须关闭会话保持，否则将影响弹性伸缩活动的执行"的描述是不正确的。'},
  {id:1154,type:'multi',answer:'ABCD',stem:'阿里云的云监控(CloudMonitor)是一项针对云资源和互联网应用进行监控的服务。云监控服务当前提供以下功能。 （正确答案的数量：4个)',opts:['站点监控','云服务监控','自定义监控','报警服务','自定义防火墙'],exp:'云监控包含了主机监控，自定义监控，站点监控，云服务监控，报警服务。参考链接：https://help.aliyun.com/document_detail/43393.html'},
