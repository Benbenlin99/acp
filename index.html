<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>阿里ACP云计算认证刷题</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f0f4ff;color:#333}
.app{display:flex;flex-direction:column}

.hd{background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(22,119,255,.35)}
.hd-title{font-size:17px;font-weight:700}
.hd-sub{font-size:12px;opacity:.85;margin-top:2px}
.mode-tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:4px;padding:1px 6px;font-size:11px;margin-left:6px;vertical-align:middle}

.pg-wrap{background:#fff;padding:10px 16px 8px;border-bottom:1px solid #dce8ff;flex-shrink:0}
.pg-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pg-text{font-size:13px;color:#888}
.fav-btn{background:none;border:none;font-size:24px;cursor:pointer;padding:0;line-height:1;color:#faad14}
.pg-bar{height:4px;background:#dce8ff;border-radius:2px;overflow:hidden}
.pg-fill{height:100%;background:linear-gradient(90deg,#1677ff,#4096ff);border-radius:2px;transition:width .35s ease}

.main{}
.screen{display:none}
.screen.on{display:block}

.q-card{background:#fff;margin:12px 12px 8px;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(22,119,255,.08)}
.q-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700;margin-bottom:10px}
.badge-s{background:#e6f4ff;color:#1677ff;border:1px solid #91caff}
.badge-m{background:#fff7e6;color:#fa8c16;border:1px solid #ffd591}
.badge-j{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.q-stem{font-size:16px;line-height:1.65;color:#222}

.opts{margin:0 12px 8px;display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:2px solid #dce8ff;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;color:#333;text-align:left;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:all .15s;-webkit-user-select:none;user-select:none;width:100%}
.opt-label{width:28px;height:28px;border-radius:50%;background:#f0f4ff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#1677ff;flex-shrink:0;transition:all .15s}
.opt-text{flex:1;padding-top:2px}
.opt.sel{border-color:#4096ff;background:#e6f4ff}
.opt.sel .opt-label{background:#4096ff;color:#fff}
.opt.ok{border-color:#52c41a;background:#f6ffed}
.opt.ok .opt-label{background:#52c41a;color:#fff}
.opt.ng{border-color:#ff4d4f;background:#fff1f0}
.opt.ng .opt-label{background:#ff4d4f;color:#fff}
.opt:disabled{cursor:default}

.submit-btn{display:block;margin:0 12px 8px;padding:14px;background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;width:calc(100% - 24px);box-shadow:0 3px 10px rgba(22,119,255,.3)}
.submit-btn:disabled{background:#bfcfff;cursor:default;box-shadow:none}

.result{margin:0 12px 8px;padding:12px 14px;border-radius:10px;font-size:15px;line-height:1.6;display:none}
.result.ok{background:#f6ffed;border-left:4px solid #52c41a;color:#237804}
.result.ng{background:#fff1f0;border-left:4px solid #ff4d4f;color:#a8071a}
.result-exp{margin-top:8px;font-size:13px;color:#666;line-height:1.65;border-top:1px solid rgba(0,0,0,.07);padding-top:8px}

.nav-bar{display:flex;gap:8px;margin:0 12px 12px;align-items:stretch}
.nav-btn{flex:1;padding:12px 8px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.nav-prev{background:#fff;color:#1677ff;border:2px solid #1677ff}
.nav-prev:disabled{color:#bfcfff;border-color:#dce8ff;cursor:default;background:#f7faff}
.nav-next{background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff;box-shadow:0 3px 10px rgba(22,119,255,.3)}
.jump-box{display:flex;align-items:center;background:#fff;border:2px solid #dce8ff;border-radius:10px;overflow:hidden;flex-shrink:0}
.jump-box:focus-within{border-color:#4096ff}
.jump-input{width:60px;border:none;outline:none;text-align:center;font-size:15px;font-weight:700;color:#1677ff;padding:12px 2px}
.jump-input::-webkit-outer-spin-button,.jump-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.jump-input[type=number]{-moz-appearance:textfield;appearance:textfield}
.jump-btn{border:none;background:none;color:#1677ff;font-size:14px;font-weight:700;padding:0 10px;cursor:pointer;align-self:stretch}

.score-wrap{padding:24px 16px;text-align:center}
.score-title{font-size:20px;font-weight:700;color:#333}
.score-sub{font-size:14px;color:#999;margin-top:4px}
.score-ring{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto;box-shadow:0 6px 24px rgba(22,119,255,.35)}
.score-num{font-size:48px;font-weight:800;line-height:1}
.score-lbl{font-size:13px;opacity:.85;margin-top:4px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.sc{background:#fff;border-radius:10px;padding:14px 6px;box-shadow:0 1px 4px rgba(22,119,255,.08)}
.sc-n{font-size:26px;font-weight:800}
.sc-d{font-size:12px;color:#999;margin-top:3px}
.act-btns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.act-btn{padding:14px;border-radius:10px;font-size:16px;font-weight:700;border:none;cursor:pointer}
.act-p{background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff;box-shadow:0 3px 10px rgba(22,119,255,.3)}
.act-s{background:#fff;color:#1677ff;border:2px solid #1677ff}

.list-wrap{padding:12px}
.list-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.list-count{font-size:14px;color:#888}
.list-go{background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff;border:none;border-radius:8px;padding:6px 16px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(22,119,255,.25)}
.list-go.red{background:linear-gradient(135deg,#ff4d4f,#ff7875);box-shadow:0 2px 6px rgba(255,77,79,.25)}
.list-item{background:#fff;border-radius:10px;margin-bottom:10px;padding:14px;box-shadow:0 1px 4px rgba(22,119,255,.06);cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.list-num{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.ln-s{background:linear-gradient(135deg,#1677ff,#4096ff)}
.ln-m{background:linear-gradient(135deg,#fa8c16,#ffa940)}
.ln-j{background:linear-gradient(135deg,#52c41a,#73d13d)}
.list-stem{font-size:14px;color:#444;line-height:1.5;flex:1}
.empty{text-align:center;padding:60px 20px;color:#ccc}
.empty-ico{font-size:56px;margin-bottom:12px}
.empty-txt{font-size:15px}

.bot-nav{background:#fff;border-top:1px solid #dce8ff;display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;border:none;background:none;cursor:pointer;color:#bbb;font-size:11px;gap:2px}
.tab.on{color:#1677ff}
.tab-ico{font-size:22px;line-height:1}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div>
      <div class="hd-title">☁️ 阿里ACP云计算认证刷题 <span class="mode-tag" id="modeTag">顺序练习</span></div>
      <div class="hd-sub">云计算工程师ACP认证 · 共1597题（单选980·多选617）</div>
    </div>
  </div>

  <div class="pg-wrap" id="pgWrap">
    <div class="pg-row">
      <span class="pg-text" id="pgText">第 1 题 / 共 1 题</span>
      <button class="fav-btn" id="favBtn" onclick="toggleFav()">☆</button>
    </div>
    <div class="pg-bar"><div class="pg-fill" id="pgFill" style="width:0%"></div></div>
  </div>

  <div class="main">
    <div class="screen on" id="scrPractice">
      <div class="q-card">
        <span class="q-badge" id="qBadge">单选题</span>
        <div class="q-stem" id="qStem">加载中...</div>
      </div>
      <div class="opts" id="optsWrap"></div>
      <button class="submit-btn" id="submitBtn" onclick="submitMulti()" style="display:none" disabled>提交答案</button>
      <div class="result" id="resultArea"></div>
      <div class="nav-bar">
        <button class="nav-btn nav-prev" id="prevBtn" onclick="prevQ()">← 上一题</button>
        <div class="jump-box">
          <input type="number" id="jumpInput" class="jump-input" placeholder="题号" min="1" onkeydown="if(event.key==='Enter')jumpNum()">
          <button class="jump-btn" onclick="jumpNum()">直达</button>
        </div>
        <button class="nav-btn nav-next" id="navNextBtn" onclick="nextQ()">下一题 →</button>
      </div>
    </div>

    <div class="screen" id="scrScore">
      <div class="score-wrap">
        <div class="score-title">🎉 本次练习完成！</div>
        <div class="score-sub">答题详情如下</div>
        <div class="score-ring">
          <div class="score-num" id="scoreNum">0%</div>
          <div class="score-lbl">正确率</div>
        </div>
        <div class="score-grid">
          <div class="sc"><div class="sc-n" id="scTotal" style="color:#333">0</div><div class="sc-d">共答题</div></div>
          <div class="sc"><div class="sc-n" id="scOk" style="color:#52c41a">0</div><div class="sc-d">答对</div></div>
          <div class="sc"><div class="sc-n" id="scNg" style="color:#ff4d4f">0</div><div class="sc-d">答错</div></div>
        </div>
        <div class="act-btns">
          <button class="act-btn act-p" onclick="goWrong()">查看错题集</button>
          <button class="act-btn act-s" onclick="restart()">重新练习</button>
        </div>
      </div>
    </div>

    <div class="screen" id="scrWrong">
      <div class="list-wrap" id="wrongWrap"></div>
    </div>

    <div class="screen" id="scrFav">
      <div class="list-wrap" id="favWrap"></div>
    </div>
  </div>

  <div class="bot-nav">
    <button class="tab on" id="tab0" onclick="switchTab(0)">
      <span class="tab-ico">📚</span><span>练习</span>
    </button>
    <button class="tab" id="tab1" onclick="switchTab(1)">
      <span class="tab-ico">❌</span><span>错题集</span>
    </button>
    <button class="tab" id="tab2" onclick="switchTab(2)">
      <span class="tab-ico">⭐</span><span>收藏夹</span>
    </button>
  </div>
</div>

<script>
const QS=[
  {id:1,type:'single',answer:'A',stem:'在互联网上存在着各种以盈利为目的的黑客组织，他们控制着大量的服务器资源，可以随时对目标服务器发起网络攻击，其中有一种很常见的，也是破坏性比较强的攻击，可以让目标服务器的资源耗尽，使正常客户无法连接到服务器。以下属于此类攻击。',opts:['DDoS攻击','XSS攻击','SQL注入','WebShell攻击'],exp:'划重点：破坏性比较强的攻击，可以让目标服务器的资源耗尽，使正常客户无法连接到服务器。所以描述的是DDoS攻击。'},
  {id:2,type:'single',answer:'C',stem:'用户通过配置安全组规则，可以控制安全组内一台或多台ECS实例的入流量和出流量。建议用户设置简洁的安全组规则。如果一台ECS实例被分配了多个安全组，该ECS实例很可能会同时遵循数百条安全组规则，任何规则变更都可能引起网络不通的故障。在创建安全组规则时，必填字段不包括',opts:['授权策略','授权对象','授权时限','端口范围'],exp:'安全组规则的必填字段包括授权策略、授权对象和端口范围，用于定义流量控制的基本条件。授权时限不是安全组规则的配置项，云服务商的安全组机制不支持基于时间的规则生效周期，因此该字段不存在于创建规则的必填参数中。'},
  {id:3,type:'single',answer:'C',stem:'您基于阿里云的云服务器ECS实例部署了Mysql数据库，随着业务量的不断上涨，您需要通过读写分离的方式来改善数据库的性能，可以采用阿里云的产品来快速解决该问题。',opts:['对象存储OSS','本读SSD盘','云数据库RDS','表格存储'],exp:'题目中是因为在云服务器ECS上部署了MySQL服务，随着业务上涨导致MySQL服务出现性能的问题，所以需要使用云数据库RDS来改善。'},
  {id:4,type:'single',answer:'D',stem:'您的业务将面临一个新的挑战，要进行一次大型的促销，但无法预估业务增长的幅度，但您了解云服务器ECS实例的CPU利用率如果超过了70%，业务的响应速度将会有大幅度的下降，目前您的web应用部署在一组阿里云的云服务器ECS实例上，前端采用一个公网的负载均衡SLB作为流量入口。采用方式可以最高效并最节省地来应对这个场景。',opts:['制作部署web服务的云服务器ECS实例的镜像,基于该镜像创建足够多的新的云服务器ECS实例,并加入到负载均衡SLB的集群中,提前做好准备','制作部署web服务的云服务器ECS实例的镜像,基于该镜像创建部分新的云服务器ECS实例,并加入到负载均衡SLB的集群中,并由运维人员实时监控CPU的利用率,如果超过70%就立刻申请新的云服务器ECS实例加入到负载均衡的集群中','采用弹性伸缩Auto Scaling服务,设定伸缩规则,当CPU利用率超过70%的时候自动增加新的云服务器ECS实例加入到负载均衡SLB的集群当中','采用弹性伸缩Auto Scaling服务,设定伸缩规则,当CPU利用率超过70%的时候自动增加新的服务器ECS实例加入到负载均衡SLB的集群当中,CPU利用率低于30%的时候释放多余的云服务器ECS实例'],exp:'题目中说到高效并最节省，所以不仅需要应对CPU超过70%的情况，还需要考虑节省，所以设置了,CPU利用率低于30%的时候释放多余的云服务器ECS实例来节省成本。'},
  {id:5,type:'single',answer:'C',stem:'OSS基于高可用架构设计，消除单点故障，确保数据业务的持续性。',opts:['高性能','高并发','高可用','高安全'],exp:'对象存储服务（OSS）采用高可用架构设计，通过分布式存储与冗余机制消除单点故障，保障数据持续可访问和业务连续性。高可用强调系统在部分组件失效时仍能正常提供服务，是确保数据业务持续性的核心架构原则。'},
  {id:6,type:'single',answer:'B',stem:'阿里云的云服务器ECS产品支持的多线BGP接入，解决的主要问题是 选项：',opts:['提升全网内容分发效率；','避免跨运营商的网络访问的速度瓶颈；','解决网络边界内容缓存的问题；','其他都是'],exp:'阿里云多线BGP（中国电信、联通、移动、教育网等）接入，确保全国用户访问畅通，提升用户访问的质量。所以解决的是避免跨运营商的网络访问的速度瓶颈。'},
  {id:7,type:'single',answer:'B',stem:'伴随着层出不穷的网络安全事件，人们越来越重视云上系统的安全，某大型互联网用户，现有网上资产比较多：但是不清楚自己哪些资产联网了，无法及时对这些资产进行清理和关停，存在较大的安全隐患，阿里云的服务最适合解决这个问题。',opts:['漏洞扫描','安全管家','安全审计','安全众测'],exp:'安全管家服务提供资产发现与梳理功能，可自动识别用户云上所有联网资产，包括未备案、未防护的资源，并支持风险评估与处置建议，帮助用户全面掌握资产暴露面。漏洞扫描仅检测已知漏洞，安全审计聚焦操作行为记录，安全众测依赖外部白帽测试，均无法系统性完成资产清查。'},
  {id:8,type:'single',answer:'B',stem:'阿里云的安骑士是云盾提供的用来保护服务器的产品，以下不属于安骑士的功能。',opts:['木马文件检查','防WEB应用系统的密码破解','异地登录报警','防操作系统密码暴力破解'],exp:'防WEB应用系统的密码破解不属于安骑士的功能，而是属于Web应用防火墙的功能。参考链接：https://help.aliyun.com/document_detail/31770.html'},
  {id:9,type:'single',answer:'A',stem:'某企业购买了一个负载均衡SLB实例，该实例下挂载了多台云服务器ECS实例，每个ECS实例上都部署了多个不同的站点，并使用不同域名访问。现在负载均衡SLB实例可以通过配置来实现对同一台ECS实例上不同站点的健康检查',opts:['主机头（Http Host）','ECS实例的IP和端口号','会话保持使用的协议','站点首页的URL'],exp:'一个负载均衡实例最多支持添加50个监听，每个监听配置对应后端ECS实例上的一个应用。您可以通过对后端ECS实例上的多个应用配置不同主机头的方式来满足这一需求。参考链接：https://help.aliyun.com/document_detail/27678.html'},
  {id:10,type:'single',answer:'D',stem:'阿里云提供了多种连接ECS实例的方式，包括Workbench、VNC等，使用VNC方式登录的典型场景不包括',opts:['实例启动自检等原因导致启动速度慢','忘记SSH密码，无法使用远程连接工具链接ECS','实例误开启操作系统防火墙','云服务器失陷，CPU和带宽消耗高'],exp:'VNC登录是一种控制台连接方式，主要用于解决操作系统启动、配置、登录认证等底层问题。A、B、C选项均属于需要通过VNC直接查看控制台输出或进行本地操作才能解决的场景。D选项“云服务器失陷，CPU和带宽消耗高”属于服务器已被攻击或出现异常负载的情况，此时VNC连接可能因系统资源耗尽而无法响应或帮助有限，通常需要借助其他监控或安全工具处理，并非VNC登录的典型或有效场景'},
  {id:11,type:'single',answer:'B',stem:'IDC服务器、虚拟机、其他云平台的云主机或其他类型的服务器想要迁移至阿里云可以使用阿里云提供的工具，该工具迁移过程无需停机，不影响源服务器系统业务。',opts:['快照','SMC','VPC','镜像'],exp:'在这个问题中，我们需要确定哪个阿里云提供的工具能够满足IDC服务器、虚拟机、其他云平台的云主机或其他类型服务器迁移至阿里云的需求，且迁移过程无需停机，不影响源服务器系统业务。 A选项“快照”通常是用于数据备份和恢复的，它并不能直接用于服务器的迁移。 B选项“SMC”（Server Migration Center）是阿里云提供的一个迁移服务工具，它支持多种源服务器的迁移，包括IDC服务器、虚拟机、其他云平台的云主机等，且迁移过程中无需停机，不会影响源服务器的业务运行。 C选项“VPC”（Virtual Private Cloud）是阿里云提供的一种虚拟私有网络服务，它主要用于构建隔离的网络环境，并不直接涉及服务器的迁移。 D选项“镜像”通常用于创建服务器的相同副本，虽然它可以在一定程度上用于迁移，但通常需要停机操作，且不一定支持所有类型的源服务器迁移。 综上所述，根据题目描述和各选项的功能特点，B选项“SMC”是满足题目要求的正确答案。'},
  {id:12,type:'single',answer:'C',stem:'当您通过OpenAPI进行阿里云的云服务器ECS实例的磁盘挂载的时候，发现不能成功挂载，可能是由于以下原因引起的。',opts:['磁盘的状态为待挂载','云服务器ECS实例的状态为运行中','云服务器ECS实例的状态为启动中','云服务器ECS实例的状态为已停止'],exp:'只有在稳定（运行中，已停止）状态才能挂载磁盘，其他状态都不行。参考链接：https://help.aliyun.com/document_detail/25446.html'},
  {id:13,type:'single',answer:'A',stem:'阿里云的云盾的先知计划，是调动众多网络安全专家的力量一起维护互联网平台和业务的安全，降低客户的安全损失。先知计划为企业提供的是服务。 选项：',opts:['为企业收集情报（漏洞）','为企业保障服务器安全','为企业保障网络安全','用大数据的方式为企业进行安全分析'],exp:'先知（安全众测）是一个帮助企业建立私有应急响应中心的平台（帮助企业收集漏洞信息），尽早发现存在的漏洞可以有效地减少企业可能的损失。参考链接：https://help.aliyun.com/document_detail/28378.html'},
  {id:14,type:'single',answer:'D',stem:'云防火墙是用户上云后的首个安全组件，支持全网流量识别、统一策略管控、日志等核心功能。',opts:['组件自动检测','流量清洗','宕机自动重启','入侵检测'],exp:'阿里云云防火墙（Cloud Firewall）是业界首款公共云环境下的SaaS化防火墙，可统一管理互联网到业务的访问控制策略（南北向）和业务与业务之间的微隔离策略（东西向）。内置的威胁入侵检测模块（IPS）支持全网流量可视和业务间访问关系可视，是您业务上云的第一个网络安全基础设施。'},
  {id:15,type:'single',answer:'D',stem:'针对阿里云专有网络VPC内的云服务器ECS实例，可以通过安全组来进行ECS实例的访问控制配置。',opts:['一个安全组中可以包含同一个可用区的不同VPC里的云服务器ECS实例','一个安全组中可以包含同一个地域的不同VPC里的云服务器ECS实例','一个安全组中仅可以包含同一个可用区的同一个VPC内的云服务器ECS实例','一个安全组中可以包含同 一个地域的同-个专有网络VPC内的云服务器ECS实例'],exp:'安全组是阿里云VPC级别的虚拟防火墙，只能关联到同一个VPC内的ECS实例。VPC是地域级资源，安全组可包含该VPC内同一地域下所有可用区的实例。选项A、B错误，因安全组不能跨VPC；选项C错误，因安全组不限制在同一可用区；选项D正确，符合安全组规则'},
  {id:16,type:'single',answer:'B',stem:'B公司运营着一个手机APP应用商店，类似Apple的AppStore，创业初期所有的软件包都存储在云服务器ECS实例的数据盘上。从上个月开始，公司做了大量的推广，下载量增长了200倍，用户覆盖范围也从之前的一个省扩展到了全国。为了节约存储和带宽成本，同时又能提高用户下载速度，B公司选择阿里云的产品组合，可达到最佳效果。',opts:['弹性伸缩(Auto Scaling)+云服务器ECS','对象存储OSS和内容分发网络CDN','对象存储OSS和弹性伸缩(Auto Scaling)','对象存储OSS和云数据库RDS'],exp:'划重点：节约存储和带宽成本，使用对象存储OSS节省存储成本和带宽成本，提高用户下载速度，使用CDN来提高全国用户的下载速度。'},
  {id:17,type:'single',answer:'A',stem:'安全组是一种虚拟防火墙，具备状态监测和数据包过滤能力，用于在云端划分安全域。某客户对运维效率、ECS实例规格以及计算节点的规模要求比较高，那么我们应该为客户推荐最合适。',opts:['企业安全组','普通安全组','默认安全组','自定义安全组'],exp:'企业安全组适用于对运维效率、ECS实例规格以及计算节点规模有更高需求的场景。'},
  {id:18,type:'single',answer:'A',stem:'ECS监控指标分为基础监控和操作系统级别指标监控。基础监控无需安装任何插件，您购买一个ECS实例后，无需任何操作便可查看监控指标。操作系统级别指标需要安装插件才能查看监控数据，下面属于操作系统级别监控指标是哪一个？',opts:['内存使用率(%);','CPU 使用率(%);','网络流入速率(bps);','系统盘 IOPS;'],exp:'操作系统级别监控指标包含内存使用率、平均负载、磁盘 IO 读/写、磁盘使用率、TCP 连接数、进程总数等。'},
  {id:19,type:'single',answer:'A',stem:'如果负载均衡实例下添加多台ECS实例，当其中一部分ECS实例发生故障后，负载均衡会自动屏蔽故障的ECS实例，将请求分发给正常运行的ECS实例，保证应用系统仍能正常工作，这说的是SLB负载均衡的场景？',opts:['消除单点故障','应用于高访问量的业务','扩展应用程序','同城容灾 （多可用区容灾）'],exp:'题目中问的负载均衡SLB会自动屏蔽故障的ECS实例，所以这个是消除单点故障的功能体现。'},
  {id:20,type:'single',answer:'C',stem:'A电商平台近几年业务增长很快，访问量持续保持每年提升300%，平台运营团队因此获得了公司的年度特别奖励。在高兴之余运营团队发现平台系统带宽的支出是以每年500%的比例增长的，如果能有效降低这块成本可以提升整体的运营质量。此时，该公司选择阿里云的服务，效果会最明显。',opts:['支持多可用区的云数据库RDS','对象存储OSS','内容分发网络CDN','负载均衡SLB'],exp:'题目说的就是带宽的问题，每年的带宽增长很快，所以需要CDN来帮他们缓解服务器带宽的压力。'},
  {id:21,type:'single',answer:'B',stem:'OSS服务费用由存储费用、流量费用、请求费用、数据处理费用、对象标签费用、传输加速费用组成，以下不会产生流量费用。',opts:['通过互联网从OSS下载到本地','本地上传图片到OSS','通过CDN服务层下载OSS数据','将源Bucket数据同步复制到目标Bucket，源Bucket和目标Bucket属于不同区域'],exp:'上传到oss是免费的'},
  {id:22,type:'single',answer:'C',stem:'B公司基于阿里云对象存储OSS和云服务器ECS实例构建了一个mp3音乐下载站点，用户在该网站注册后可获得mp3文件的下载链接。最近一周OSS的公网流量突然增长了一倍，但注册用户数只增加了5%，经仔细分析后发现很多下载请求不是用户从该网站直接下载，而是来自某搜索引擎。您认为该网站采取措施可以快速降低这种风险。',opts:['将音乐文件从OSS搬迁到云服务器ECS实例的数据盘','将音乐下载站点改成HTTPS访问','通过OSS Bucket 属性里的“防盗链设置”功能做来源限制','增加负载均衡SLB，多一层防护'],exp:'题目中说了是因为其他非自己的站点的下载导致OSS的公网流量增长，所以需要用到对象存储OSS的防盗链功能来杜绝其他站点的下载。'},
  {id:23,type:'single',answer:'A',stem:'如果公网带宽占有率达到百分之百，EIP未及时扩容，易出现业务流量限速丢包的情况，进而引发客户端访问质量恶化和用户体验的直线下降。可以使用EIP的功能帮助用户实时监测流量波动情况。',opts:['秒级监控','云监控','自动扩容','弹性IP'],exp:'公网带宽占满时，EIP未扩容可能导致业务流量被限速或丢包。题干中涉及的功能需实时监测流量波动。EIP的秒级监控支持5秒粒度的流量数据采集，相比传统的分钟级监控（如云监控）更能捕捉瞬时波动。自动扩容属于带宽调整策略，弹性IP是资源类型而非监控功能。对应阿里云EIP文档，秒级监控用于高频率流量监测场景，适用于题干描述的实时监测需求。选项A符合该场景。'},
  {id:24,type:'single',answer:'A',stem:'您在阿里云两个在不同地域创建了专有网络VPC，如果希望实现两个VPC之间的私网通信，采用产品可以实现。',opts:['通过高速通道实现VPC之间的私网通信','通过路由器创建新的路由条目打通','通过安全组创建新的访问规则打通','无需任何操作，同一个帐号下的不同VPC本来就是内网连通的'],exp:'题目问的是希望实现两个VPC之间的私网通信，所以需要通过高速通道或者云企业网或者vpn来实现VPC之间的私网通信。'},
  {id:25,type:'single',answer:'B',stem:'阿里云OSS产品的账单费用由三部分组成，包括：存储空间费用、流量费用和OSSAPI请求费用。其中流量费用是根据用户使用OSS的下行流量多少收费，上行流量和通过内网访问的流量免费，以下使用OSS的场景中哪一个是不产生OSS流量费用的？',opts:['在阿里云ECS上静态网站直接引用了OSS中的图片，该网站来自公网的访问量是每天1000次','某系管理员将OSS用作数据备份，从ECS上每天晚上用内网上传200G的数据到OSS','某淘宝卖家为了提高店铺的访问速度，将店铺中的所有图片上传到了OSS，然后在店铺中直接引用','管理员在自己的办公室内浏览自己OSS Bucket里的图片'],exp:'只有公网下载（下行）才会产生流量费用，所以此题内网上传文件到OSS，是不会产生流量费用的的。'},
  {id:26,type:'single',answer:'C',stem:'在新建的LinuxECS实例中，启动OFBiz服务的时候，步骤如下：a.#chmod+xant；b.#cdofbizrelease12.04；c.#./antrun；#./antstart&；d.#./ant；#./antrun-install。则下列排序正确的是',opts:['a；c；b；d','a；b；c；d','b；a；d；c','b；c；d；a'],exp:'这个仅要求记住即可，具体步骤解释为：1.进入OFBiz文件夹，2.给ant脚本赋予执行权限，3.运行安装脚本，4.启动ant'},
  {id:27,type:'single',answer:'D',stem:'使用CDN加速访问URL时，出现空白页面，使用Chrome浏览器访问源站，按F12键打开开发者工具，单击Network,查看Content-Length配置项显示为0，这个问题应',opts:['清理浏览器的缓存，井重新开启浏览器访问该网站','登录CDN控制台，检查该域名的配置，查看CNAME是否匹配正确','打开CDN控制台，单击域名管理','查看源站是否返回Tansfer-Encoding: chunked头信息。CDN不支持此头信息，去除此头信息即可'],exp:'https://help.aliyun.com/knowledge_detail/73749.html?spm=5176.11065259.1996646101.searchclickresult.14396032FJvpGT'},
  {id:28,type:'single',answer:'B',stem:'度特别奖励。在高兴之余运营团队发现平台系统带宽的支出是以每年500%的比例增长的，如果能有效降低这块成本可以提升整体的运营质量。此时，该公司选择阿里云的服务，效果会最明显。',opts:['支持多可用区的云数据库RDS','内容分发网络CDN','对象存储OSS','负载均衡SLB'],exp:'题目中说“系统带宽的支出是以每年500%的比例增长的”，说明服务很占用带宽资源，可以通过内容分发网络CDN来减少服务器的带宽输出。'},
  {id:29,type:'single',answer:'C',stem:'在一些业务场景下，可以通过购买按量付费的云服务器ECS实例来满足特定时间段内需要更多资源的需求，可以通过设定自动释放时间的方式来保证按量付费的资源按预期释放。下列关于该操作说法准确的是',opts:['只能在云服务ECS实例创建的时候进行自动释放时间的设置','只能设置一次ECS实例的自动释放时间','可以在取消之前重新设置的ECS实例的自动释放时间','ECS实例的自动释放时间一旦设置不能取消'],exp:'自动释放时间可以多次设置，且设置了可以取消之前的设置。'},
  {id:30,type:'single',answer:'B',stem:'CDN支持配置Referer防盗链。访问请求到达CDN节点后，CDN节点会根据预设的防盗链黑名单或白名单，对访客的身份进行过滤。符合规则的用户可以顺利请求到资源，不符合规则的用户，请求会返回响应码。',opts:['200','403','500','503'],exp:'符合规则的用户可以顺利请求到资源，不符合规则的用户，请求会返回403响应码。 https://help.aliyun.com/document_detail/27134.html?spm=a2c4g.11174283.6.632.26347035jwiYFO'},
  {id:31,type:'single',answer:'C',stem:'为了提升阿里云ECS的安全性，管理员小王不希望公网用户通过ping命令检查到ECS是否在线，以下是他自己设计的加固方案，您认为是不可行的。',opts:['启用安全组，拒绝“公网入”的ICMP协议','启用ECS内操作系统的防火墙，拒绝“公网入”的ICMP协议','先将ECS IP解析到一个不常用的四级域名，然后将对外推广的域名通过CNAME指向以上四级域名','启用安全组，只允许公网TCP 80端口和25端口访问'],exp:'选项A、B、D均通过禁用ICMP协议或仅开放特定端口阻止ping检测，有效提升安全性。选项C通过域名解析隐藏ECS真实IP，但用户仍可直接ping真实IP地址测试在线状态，无法阻止ICMP请求，因此不可行'},
  {id:32,type:'single',answer:'A',stem:'某公司将重要业务部署在阿里云华北2地域，使用的架构是负载均衡SLB+多台ECS，SLB作为公网流量的统一入口，非常关键，为了避免因该SLB实例出现问题导致业务中断，以下措施可行的是',opts:['在华北2区域不同可用区再创建一个SLB实例作为备实例，出现故障时，SLB支持主备实例自动切换','在华东1地域再创建一个SLB实例作为备实例，出现故障时，SLB支持主备实例自动切换','对SLB实例开启实例删除保护，防止其被运维人员误除','使用安骑士对SLB实例进行安全防护'],exp:'当主可用区出现故障或不可用时，负载均衡有能力在非常短的时间内（约30秒）切换到备可用区并恢复服务；当主可用区恢复时，负载均衡同样会自动切换到主可用区提供服务。'},
  {id:33,type:'single',answer:'D',stem:'D公司基于阿里云对象存储OSS和云服务器ECS构建了一个应用网站。初期采用OSS的原因是看上了它的大容量存储和能在多台ECS之间共享读写文件的功能，后来因业务需要逐渐增加了事务性的数据交互需求，在多个请求共同写OSS上的同一个文件时会互相覆盖，为此管理员很发愁。遇到这种情况可以选用阿里云的哪个云服务直接解决',opts:['增加更多的云服务器ECS','内容分发网络CDN','选用负载均衡SLB','选用关系型云数据库RDS解决'],exp:'题目中说因为增加了事务性的数据交互需求，导致在同时写一个文件的时候会相互覆盖，这个时候需要选择关系型数据库RDS来解决事务性的交互需求。'},
  {id:34,type:'single',answer:'C',stem:'阿里云内容分发网络CDN和传统厂商的CDN相比具有稳定快速、节约成本和简单易用三个特点。以下关于阿里云CDN稳定快速特点的描述错误的是',opts:['先进的分布式系统架构，在国内、外均有数百个缓存节点，且节点数在不断增加','充足的带宽和存储资源','CDN的全部缓存节点都采用BGP线路','完善的监控体系和服务体系','稳定高效的性能指标：95%以上的命中率，毫秒级响应时间'],exp:'CDN的全部缓存节点并没有采用BGP线路，BGP线路主要为OSS，和DDoS高防IP提供服务，实现不同运营商的网站都可以快速访问。CDN则是有充足的带宽和存储资源。'},
  {id:35,type:'single',answer:'E',stem:'对于阿里云态势感知典型的功能点描述正确的是',opts:['恶意进程查杀','漏洞检测和修复','外部风险扫描：如AK泄露、账密泄露','全量安全日志，自动化入侵回溯','其它选项都正确'],exp:'文档原文：态势感知具备异常登录检测、网站后门查杀、网站后门查杀、进程异常行为、敏感文件篡改、异常网络连接、Linux 软件漏洞、Windows 系统漏洞、Web-CMS 漏洞、应急漏洞、Web 漏洞扫描、主机基线、云产品基线、资产指纹、AK 和账号密码泄露、数据大屏、日志检索、全量日志分析。参考链接：https://www.jianshu.com/p/99360d03b1cd'},
  {id:36,type:'single',answer:'B',stem:'阿里云账号的AccessKey有所有API访问权限。下列关于AccessKeyId和AccessKeySecret说法错误的是',opts:['AccessKeySecret是用于加密签名字符串和服务器端验证签名字符串的密钥','AccessKeySecret可以通过控制台直接查看而无需做额外验证','AccessKeyId和AccessKeySecret是由阿里云官方发给访问者的','AccessKeyID 是用于标识访问者的身份'],exp:'AccessKeySecret并不支持通过控制台直接查看，AccessKeySecret只能一次生成，后续不支持再次查看。如果忘记AccessKeySecret，只能在授权登录后在控制台重新生成。参考链接：https://help.aliyun.com/document_detail/25934.html'},
  {id:37,type:'single',answer:'C',stem:'作为某初创企业的技术负责人，阿明将Java应用程序、图片视频等静态文件都部署在了一台ECS实例上，提供服务。随着业务发展和用户量的增加，发现存储在ECS实例上的静态文件访问速度不能达到预期的要求。您建议选择阿里云的产品可以快速解决静态文件的访问速度。',opts:['负载均衡SLB','云数据库RDS','对象存储OSS','弹性伸缩Auto Scaling'],exp:'对象存储可存储静态文件，加速访问'},
  {id:38,type:'single',answer:'A',stem:'某企业的网站构建在阿里云的云服务器ECS实例、负载均衡SLB实例以及弹性伸缩（Auto Scaling）之上，其中负载均衡SLB实例已和弹性伸缩绑定，且已开启健康检查。负载均衡SLB实例检查出后端云服务器ECS实例ecs_inst1处于不健康状态，且ecs_inst1在弹性伸缩的伸缩组中。以下说法中正确的是？',opts:['弹性伸缩的弹性自愈功能将会把ecs_inst1移出当前伸缩组，且会新创建一个ECS实例添加进来，该新添加实例会被SLB实例分配负载','负载均衡SLB实例会将ecs_inst1的权重置为0，暂时不分配负载给它，但是会继续通过健康检查监控ecs_inst1的状态，一旦恢复，则将其重新启用，正常分配负载','弹性伸缩的弹性自愈功能将会针对ecs_inst1启动错误检查和自动恢复功能，如果修复成功，ecs_inst1状态恢复正常，则会继续留在伸缩组中，且会被负载均衡SLB实例分配负载','弹性伸缩会自动创建一个新的ECS实例，并将该新实例添加到伸缩组，接收负载均衡SLB实例分配的负载，ecs_inst1将会被保留在伸缩组中，等其状态恢复正常后，将会被继续加入SLB实例的后台服务器池'],exp:'健康检查检查出云服务器ECS实例ecs_inst1处于不健康状态，则会将ecs_inst1移出伸缩组且会重新创建一个新的ECS实例来代替ecs_inst1，同时将其加入负载均衡SLB后端并给其分发请求。'},
  {id:39,type:'single',answer:'B',stem:'关于用户使用阿里云专有网络VPC产品的费用，以下说法中错误的是',opts:['专有网络VPC是一个免费的网络容器','VPC中用的弹性公网IP是免费的','交换机是免费的','路由器是免费的'],exp:'弹性公网IP是收费的服务。'},
  {id:40,type:'single',answer:'C',stem:'某企业使用负载均衡SLB+云服务器ECS+弹性伸缩(Auto Scaling)的架构搭建网站，已经创建了伸缩组，冷却时间设置为缺省值300秒，最小ECS数设置为1，最大ECS数设置为100，并设定了伸缩规则为“每次增加1台ECS”，同时配置报警任务：“统计周期”设为2分钟，“重复几次后报警”设置为3，每当CPU使用率平均值超过60%时触发伸缩规则定义的伸缩活动，当前伸缩组中有10台ECS实例。该网站业务在长达1小时的时间段内发生了井喷式的爆发增长，CPU的使用率会一直高于60%，这一小时期间，每两次触发该报警任务的时间间隔最少为加上创建一台ECS实例的消耗时间。',opts:['11分钟','5分钟','6分钟','9分钟'],exp:'此题考察的是：每两次触发该报警任务间隔时间。题目中的统计周期为2min，重复次数为3，所以每次报警任务的执行间隔时间是2*3=6min，此间隔时间6min已经过了300s(即5min)的冷却时间的限制了，所以本题答案是：最少时间间隔=周期*重复次数，即2min*3=6min。此题经常考，需重视。'},
  {id:41,type:'single',answer:'A',stem:'您在使用阿里云的云服务器ECS实例的过程中，如果进行操作一定不会导致云服务器ECS实例出现异常。',opts:['修改上层应用的网络协议','自行编译系统内核','在ECS实例上部署虚拟化程序','随意更改系统分区下目录的权限'],exp:'修改上层应用的网络协议只是修改应用的访问方式，比如将TCP改成HTTP，并不会导致ECS服务器异常。'},
  {id:42,type:'single',answer:'D',stem:'您管理的网站部署在阿里云的云服务器ECS实例上。您非常担心自己的云服务器ECS实例会遭受来自网络的暴力密码破解。阿里云的产品提供了检测和防止云服务器ECS实例遭受暴力密码破解的安全防护功能。',opts:['对象存储OSS','云监控','负载均衡SLB','云盾'],exp:'对象存储提供静态存储，云监控提供监控功能，SLB提供服务器负载，只有云盾提供安全防护功能。'},
  {id:43,type:'single',answer:'C',stem:'某用户要求可以及时监控到ECS实例网络配置的异常活动、软件崩溃和硬件使用情况，可及时记录网络、软件或硬件问题，我们可以用配合云监控的指标监视功能，灵活自定义计算资源维护的健康水位。',opts:['监控','自助诊断系统','实例健康状况','系统日志'],exp:'实例健康状况侧重于网络配置的异常活动、软件崩溃和硬件使用情况等。通过监视实例健康状态，可及时记录网络、软件或硬件问题。 该功能配合云监控的指标监视功能，可以灵活自定义计算资源维护的健康水位。'},
  {id:44,type:'single',answer:'D',stem:'公网IP可以实现阿里云的云服务器ECS实例与Internet之间互访。下列对于云服务器ECS实例的公网IP描述错误的是',opts:['无论您选择何种计费方式，在购买实例的时候，您都需要选择公网的带宽上限','手工修改ECS实例的公网IP后，该ECS实例的网络通信会受到影响','公网IP可用于不同地域的云服务器之间互访','云服务器ECS实例更换系统盘时，公网IP地址也会随之变更'],exp:'更换系统盘不会导致网络层面的变更，所以公网IP不会变更。'},
  {id:45,type:'single',answer:'B',stem:'关于弹性IP说法错误的是',opts:['可以单独购买一个弹性公网IP，而不是与其他计算资源或存储资源绑定购买','弹性公网IP支持绑在经典网络的ECS实例上','弹性公网IP能动态绑定到不同的ECS实例上，绑定和解绑时无需停机','弹性公网IP只能绑定在相同Region的VPC类型的云产品实例上'],exp:'EIP可绑定到专有网络类型的ECS实例、专有网络类型的私网SLB实例和NAT网关上。所以不支持绑定到经典网络的ECS实例上。参考链接：https://help.aliyun.com/document_detail/32321.html'},
  {id:46,type:'single',answer:'A',stem:'下列哪种状态表示负载均衡SLB后端服务器的状态表示未开启SLB健康检查？',opts:['unavailable','available','abnormal','normal'],exp:'负载均衡SLB后端服务器的状态为unavailable的时候表示其未开启健康检查，参考链接：https://mvp.aliyun.com/zhidao/9043'},
  {id:47,type:'single',answer:'D',stem:'E公司是一个原创网络小说的发布和交流平台，基于阿里云平台建设（使用了云服务器ECS和内容分发网络CDN的组合），上线3年来积攒了大量的原创作品，访问量每季度增长50%。两天前有同事发现来自某一段IP的爬虫每天晚上自动来抓取平台里的原创内容，并在多个社区里发布，连续作者权益的损害。为此管理员果断在ECS的安全组里屏蔽了那段IP，但是问题并没有解决。请你为管理员提供一个可行的方案。',opts:['启用阿里云CDN的refer白名单功能','开启云服务器ECS内部防火墙','启用阿里云CDN的Refer黑名单功能','启用阿里云CDN的IP黑名单功能'],exp:'某一段IP则需要对IP进行屏蔽，使用CDN的IP黑名单功'},
  {id:48,type:'single',answer:'C',stem:'虽然OSS默认对每个存储的对象在物理盘上有多份副本，但合规性要求所规定的数据需要跨一定距离保存一份副本。通过功能，可以在远距离的OSS数据中心之间复制数据以满足这些合规性要求。',opts:['跨可用区复制','数据传输服务','跨区域复制','数据备份服务'],exp:'虽然OSS默认对每个存储的对象在物理盘上有多份副本，但合规性要求所规定的数据需要跨一定距离保存一份副本。通过跨区域复制，可以在远距离的 OSS 数据中心之间复制数据以满足这些合规性要求。'},
  {id:49,type:'single',answer:'C',stem:'object操作在0SS上具有，操作要么成功要么失败，不会存在有中间状态的object.OSS保证用户一旦上传完成之后读到的Object是完整的，OSS不会返回给用户一个部分上传成功的Object',opts:['隔离性','一致性','原子性','持久性'],exp:'题干描述强调了操作“要么成功要么失败，不会存在中间状态”，上传完成后读取到的Object是“完整的”，不会返回“部分上传成功”的对象。这些特性是“原子性”的典型定义，即一个操作作为一个不可分割的整体执行。隔离性关注并发控制；一致性关注数据约束；持久性关注数据保存。因此正确答案是C. 原子性'},
  {id:50,type:'single',answer:'C',stem:'设计云上架构时，如果能充分了解云服务的特点，就能扬长避短，充分利用云的优势。例如，云服务器ECS由于是虚拟服务器，其单机性能或许不如传统物理机，但是，在云上可以很便捷地搭建起两个ECS和一个负载均衡SLB实例的架构，这种架构比单台高配ECS的方式相比，优势不包括',opts:['隐后端IP，避免被扫描、被直接攻击','方便后续水平扩展','方便管理运维','避免单点故障'],exp:'此题考查云架构设计中负载均衡的核心优势。负载均衡（SLB）通过分发流量实现隐藏后端ECS真实IP（A）、支持水平扩展时无缝添加实例（B）、消除单点故障（D）等特性；而多台ECS+SLB的架构需维护多个节点及负载策略，相较单台ECS运维复杂度更高，因此“方便管理运维”并非其优势。'},
  {id:51,type:'single',answer:'B',stem:'弹性伸缩的伸缩规则指的是',opts:['定义了SLB的监听规则','定义了具体的扩展或收缩操作','定义了组内ECS实例数的最大值、最小值','定义了用于弹性伸缩的ECS实例的配置信息'],exp:'弹性伸缩的伸缩规则定义了具体的扩展或收缩操作，例如加入或移出 N 个 ECS 实例。参考链接：https://help.aliyun.com/document_detail/25858.html'},
  {id:52,type:'single',answer:'A',stem:'阿里云负载均衡SLB可以通过流量分发扩展部署在后端服务器中的应用系统对外服务的能力，通过消除单点故障提升应用系统的可用性，必须和阿里云提供的配合使用。',opts:['云服务器ECS','云数据库RDS','专有网络VPC','云监控'],exp:'负载均衡SLB必须和云服务器ECS配合使用。'},
  {id:53,type:'single',answer:'D',stem:'您启动了一台新的阿里云的云服务器ECS实例，要求此实例只允许开放80端口的公网访问。可以通过以下哪个操作来实现此要求而不影响其它实例？',opts:['在该实例所在的默认安全组添加一条公网访问规则仅允许80端口的公网入流量','在该实例所在的默认安全组添加一条公网访问规则仅允许80端口的公网出访问，并添加一条公网访问规则不允许所有的公网出流量','新建一个安全组，并新增一条安全组规则允许80端口的公网入流量，将该云服务器实例放入该安全组','新建一个安全组，并新增一条安全组规则允许80端口的公网入流量，将该云服务器实例放入该安全组，并从原先的默认安全组挪出'],exp:'题目中要求ECS实例只允许开放80端口的公网访问，所以需要新增安全组规则，允许80端口的公网入方向访问，将实例加入该组为了不影响其他实例，并将其从原先的默认安全组移出。'},
  {id:54,type:'single',answer:'C',stem:'用户可以配置实时关注ECS实例使用情况，当监测到伸缩组内的ECS实例vCPU使用率突破80%时，根据用户配置的伸缩规则弹性扩展ECS资源，自动创建合适数量的ECS实例。',opts:['实例健康状况、实例健康状况、弹性伸缩','弹性伸缩、弹性伸缩、实例健康状况','云监控、云监控、弹性伸缩','安全组、云监控、弹性伸缩'],exp:'阿里云相关服务中，用户通过配置云监控自定义监控项跟踪ECS实例指标。当云监控检测到伸缩组内实例vCPU使用率达到阈值，会触发报警并通知弹性伸缩服务执行预定义的伸缩策略。弹性伸缩根据伸缩规则自动调整实例数量。此机制在阿里云文档《弹性伸缩用户指南》有明确说明：云监控采集指标数据，弹性伸缩负责扩缩容操作。选项C符合服务间协作逻辑，其他选项涉及的服务（实例健康检查、安全组）不直接参与指标监控与扩缩容触发。'},
  {id:55,type:'single',answer:'D',stem:'1、某用户在阿里云控制台手动创建了一台ECS实例并加入到弹性伸缩组且（已知该伸缩组配置了负载均衡）中。由于用户业务发生变化，该用户将此台ECS实例转为备用状态，则',opts:['该ECS实例负载均衡权重不变','弹性伸缩仍管理该ECS生命周期','伸缩组发生伸缩活动时，优先移出该ECS实例','用户需从伸缩组内移出该ECS实例才能将其释放'],exp:'• 如果ECS实例所在伸缩组配置了负载均衡，则该ECS实例的负载均衡权重会被置零。 • 该ECS实例保持备用状态，直至您将其移出备用状态。 • 弹性伸缩不会管理ECS实例的生命周期，而是由您管理。 • 伸缩组内发生伸缩活动时，不会移出处于备用状态的ECS实例。 • 该ECS实例被停止或者重启时，不会更新ECS实例的健康检查状态。 • 您需要预先从伸缩组内移出该ECS实例才能将其释放。 • 如果您删除伸缩组，ECS实例会自动解除备用状态并随伸缩组一起释放。'},
  {id:56,type:'single',answer:'A',stem:'您的阿里云专有网络VPC创建后，需要完成操作之后，才能够在专有网络内创建其他的云产品实例，如云服务器、负载均衡和云数据库等.',opts:['创建交换机','创建路由器','配置网段地址','设置路由表'],exp:'在阿里云专有网络VPC创建后，路由器也是随着VPC一起自动创建的，所以不需要手动创建了。这个时候需要继续创建交换机才能在交换机中创建其他云产品。'},
  {id:57,type:'single',answer:'B',stem:'ECS是阿里云提供的一种即开即用、可弹性伸缩的云服务器。它包含CPU、内存、操作系统、网络配置、磁盘等基础的计算组件，对于服务器计算性能以及内存性能的指标需要参考来选择，具体指标包括vCPU核数，内存大小等。',opts:['实际业务需求','规格族','存储容量','网络'],exp:'ECS实例规格定义了实例的基本属性：CPU和内存（包括CPU型号、主频等） https://help.aliyun.com/document_detail/25378.html?spm=a2c4g.11186623.6.590.16145bd7xOslvZ'},
  {id:58,type:'single',answer:'B',stem:'阿里云OSS图片处理服务，绑定域名需要做线上验证，其中一步是下载验证文件并上传到您域名的根目录下，此步骤为验证您对绑定域名的所有权。',opts:['有效率','根目录','顶级目录','子目录'],exp:'线上验证是将下载的验证文件放置于域名的根目录下来完成验证绑定域名的所有权。'},
  {id:59,type:'single',answer:'C',stem:'实人认证服务是指依托活体检测、人脸比对等生物识别技术、证件0CR识别技术等进行的自然人真实身份的校验服务，目前仅支持对拥有的人士进行认证',opts:['通过支付宝实名认证的用户','真人免冠近照','中华人民共和国第二代居民身份证','二代身份证、护照、学生证等合法证件'],exp:'实人认证服务目前仅支持对拥有中华人民共和国第二代居民身份证的居民进行认证。 参考链接 https://help.aliyun.com/document_detail/127757.html?spm=a2c4g.11174283.6.542.56074088HGtBsQ'},
  {id:60,type:'single',answer:'A',stem:'用户在阿里云以外的服务器上安装“云安全中心客户端”后，通过方式与指定的阿里云官网帐号关联。',opts:['在管理控制台生成的安装验证key','用户帐号ID','用户的AccessKey','用户名和密码'],exp:'安装“云安全中心客户端”后，需要通过管理控制台的Key来完成和阿里云官网账号的关联，参考链接：https://www.aliyun.com/ss/?t=h&k=key&rangeinfo=h_pid_28498'},
  {id:61,type:'single',answer:'B',stem:'专有网络VPC类型的ECS实例有两种IP地址，分为私有IP地址和公网IP地址。专有网络VPC类型ECS实例一经创建即被分配一个私有IP地址。下列选项中不属于私有IP地址适用的场景。',opts:['负载均衡','不在同一局域网内的ECS实例与其他云服务之间互访','同一局域网内ECS实例之间内网互访','同一局域网内ECS实例与其他云服务之间内网互访'],exp:'私有IP地址用于同一局域网（VPC）内的内部通信。选项B描述的是不在同一局域网的访问，此时无法直接使用私有IP，需通过公网IP或其他网络连接方式（如VPN网关、对等连接）。其他选项（A负载均衡内部分发、C同一局域网ECS互访、D同一局域网ECS与云服务互访）均属于私有IP的适用场景'},
  {id:62,type:'single',answer:'A',stem:'阿里云负载均衡SLB在四层（TCP）转发时，设置了会话保持，在会话保持的超时时间内，以下说法中正确的是',opts:['来源IP地址相同的连接都会转发到同一台后端云服务器ECS实例上','负载均衡SLB实例将自动以Session为单位进行转发，无需IP地址判断或者cookie信息辅助','客户端的请求中带有负载均衡SLB实例设置的cookie信息，负载均衡SLB实例会根据cookie中的信息判断是否来自同一会话，如果是，则转发到相同的ECS实例','采用test-and-set机制，负载均衡SLB实例先去检查后端ECS实例的内存中是否存在相同Session信息，如果某台ECS实例中存在，则转发至该ECS实例，如果所有ECS实例中都没有相关信息，则该请求被认为是某个Session的第一次连接，会按照转发规则转发给任意一台ECS实例'],exp:'负载均衡SLB在四层（TCP）转发是是基于源IP的会话保持。四层会话保持的最长时间是3600秒。'},
  {id:63,type:'single',answer:'A',stem:'阿里云的负载均衡SLB可以通过流量分发扩展应用系统对外的服务能力，通过消除单点故障提升应用系统的可用性。以下关于负载均衡SLB特点的说法中错误的是',opts:['跨地域容灾：支持同一个负载均衡SLB实例分流负载到跨多个地域（Region）的云服务器ECS实例，可用性更高','扩展性：支持删除和添加后端云服务器，实现无缝伸缩','安全：结合阿里云的安全产品提供多种安全防护，使应用更加安全可靠','成本：和传统硬件负载均衡器相比，成本大幅下降'],exp:'同一个负载均衡只支持跨可用区容灾，不支持跨地域容灾。'},
  {id:64,type:'single',answer:'D',stem:'可以配合CDN产品，提供静态内容存储、分发到边缘节点的解决方案。利用CDN边缘节点缓存的数据，提升同一个文件，被同一地区客户大量重复并发下载的体验。',opts:['SLB','RDS','VPN','OSS'],exp:'对象存储服务（OSS）支持静态内容的存储与分发，可与CDN配合使用，将文件缓存至边缘节点，提升同一地区用户并发下载的效率和体验。SLB用于负载均衡，RDS为关系型数据库，VPN用于网络加密隧道，均不具备静态资源存储与分发能力。'},
  {id:65,type:'single',answer:'D',stem:'在使用阿里云的负载均衡SLB实例时，做了如下健康检查的配置：响应超时时间为5秒，健康检查间隔为2秒，不健康阈值为3，健康阈值为3。即对于确认一个云服务器ECS实例是健康的，需要连续三次得到正常响应。如果某后端云服务器ECS实例当前状态是不健康的，现在对该实例进行修复，可以通过健康检查确认该实例是健康的时间窗是多久？',opts:['19秒','21秒','5秒','7秒'],exp:'题目问的是健康的时间窗的时间，所以就是后端云服务器ECS实例当从不健康状态，到通过健康检查确认其健康状态的时间窗的时长，所以此题时间窗=(健康检查成功响应时间1S x 健康阈值3S) + 健康检查间隔2S x (健康阈值3-1)=7S，参考链接：https://help.aliyun.com/knowledge_detail/39455.html'},
  {id:66,type:'single',answer:'D',stem:'如果ECS实例发生了实例自动恢复事件，例如物理机非预期宕机或进行运维，阿里云默认自动重启恢复实例。用户可以通过修改实例维护属性，自定义实例自动恢复方式。如果实例挂载了本地盘，用户可选择的恢复方式不包括',opts:['自动重启恢复','禁止重启恢复','自动重新部署','部分重启恢复'],exp:'https://help.aliyun.com/knowledge_detail/57052.html?spm=a2c4g.11186623.4.5.5e3b4ebaUBXykL 阿里云默认自动重启恢复您的ECS实例，并且支持自定义恢复方式， 自动重启恢复 禁止重启恢复 自动重新部署'},
  {id:67,type:'single',answer:'A',stem:'PFX是使用二进制的格式保存的个人证书，一般出现在WindowsServer中，现在想把该格式的证书上传到阿里云的负载均衡SLB实例，以下说法正确的是',opts:['负载均衡SLB不支持PFX格式的证书，只能先将其转换成PEM格式，再上传','负载均衡SLB支持PFX格式的证书，可以将其直接上传','负载均衡SLB不支持PFX格式的证书，只能先将其转换成DER格式，再上传','负载均衡SLB不支持PFX格式的证书，只能先将其转换成P7B格式，再上传'],exp:'负载均衡只支持PEM格式的证书。假如是PFX格式或其他部分格式，需要现将其转换成PEM格式再上传。参考链接：https://help.aliyun.com/document_detail/85968.html'},
  {id:68,type:'single',answer:'B',stem:'您基于阿里云的云服务器ECS实例部署了Mysql数据库，随着业务量的不断上涨，您的运维工作不断增加，包括数据库的备份、主备数据库之间的数据同步等问题，可以采用阿里云的产品来快速解决该问题。',opts:['开放搜索服务OpenSearch','云数据库RDS','对象存储OSS','表格存储'],exp:'题目中说了因为业务量的上涨导致自部署的Mysql数据库工作量越来越大，所以需要云数据库RDS来快速解决这些问题。'},
  {id:69,type:'single',answer:'C',stem:'用户在使用阿里云云服务器ECS的时候，经常收到密码被暴力破解的报警信息，虽然都没有成功，但是很担心某一天会被攻破。为了提升系统的安全性，并不再接收到该ECS实例的密码暴力破解报警信息，以下是最安全的措施。',opts:['关闭云监控的异常报警机制','开通安全众测，查找系统中的潜在漏洞','将ECS密码修改为8位以上的复杂密码，同时用安全组关闭远程管理端口','使用WAF来提升系统的安全性'],exp:'WAF保护的是ECS上应用层的用户服务，而不能保护ECS的被保密破解。先知（安全众测）是一个帮助企业建立私有应急响应中心的平台（帮助企业收集漏洞信息），也不能保护ECS的被保密破解。所以最安全的是提升ECS登录密码的复杂度，关闭ECS远程登录管理的端口。'},
  {id:70,type:'single',answer:'D',stem:'在使用阿里云弹性伸缩(AutoScaling)时，需要先创建伸缩组，然后会基于伸缩组提供按照策略或者业务需求弹性伸缩计算资源的服务。当某个伸缩组不再使用时，可以将其删除；其中，（）不依赖于伸缩组的生命周期，即不会随着伸缩组的删除而被删除。',opts:['伸缩配置','伸缩规则','伸缩活动','定时任务'],exp:'定时任务独立于伸缩组存在，不依赖伸缩组的生命周期管理，删除伸缩组不会删除定时任务；云监控报警任务独立于伸缩组存在，不依赖伸缩组的生命周期管理，删除伸缩组不会删除报警任务。参考链接: http://docs-aliyun.cn-hangzhou.oss.aliyun-inc.com/pdf/auto-scaling-product-description-cn-zh-2017-04-07.pdf'},
  {id:71,type:'single',answer:'B',stem:'在公共云的环境中，阿里云负责云计算基础设施的安全（如：IDC环境、物理服务器运维、云产品虚拟化层等），用户需要对自己购买的云产品进行必要的安全优化和防护设置，以下几种客户的行为中您认为最安全的是 选项：',opts:['为了管理方便，将云服务器ECS实例的管理员密码修改为123456','云服务器ECS实例购买成功后，立即通过管理控制台启用该ECS实例的安全组防火墙，并设置为只允许某管理IP远程登录','为了减少沟通成本，公司的5个管理员都用root帐号登录云服务器ECS实例','为了方便在家办公的同事更新数据，对云数据库RDS实例开通了公网IP，并允许所有IP连接'],exp:'上云实践中推荐：云服务器ECS实例购买成功后，立即启⽤安全组防火墙，并对公网只开通必要的服务端口。'},
  {id:72,type:'single',answer:'C',stem:'某用户在阿里云上创建了包年包月类型的ECS，创建后才发现，操作系统误选为Windows5（实际需要使用Linux），下列选项中，能够解决这个问题的最佳方式是',opts:['使用root用户登录ECS，重装操作系统','发起工单，请售后协助更换操作系统','为该ECS更换系统盘','申请5天无理由退款，重新创建ECS'],exp:'阿里云ECS实例支持用户自行更换系统盘来更改操作系统。官方文档指出，更换系统盘允许用户重新选择公共镜像或自定义镜像，且实例的计费方式、公网IP等配置不变。选项A需要root权限且Windows系统不适用；选项B通常涉及数据迁移，非必要情况无需工单；选项D需满足退款条件且可能产生额外费用。选项C通过控制台或API直接更换系统盘，无需退款或联系售后，操作自主高效。阿里云文档-更换系统盘章节。'},
  {id:73,type:'single',answer:'D',stem:'阿里云内容分发网络CDN和传统厂商的CDN相比具有稳定快速、节约成本和简单易用三个特点。以下关于阿里云CDN节约成本的描述错误的是',opts:['资源弹性扩展，按实际使用量付费，接入即可实现跨运营商、跨地域的全网覆盖','先使用后付费,提供按流量或峰值带宽两种计费方式，满足不同业务需求','对于网站突发流量，无需用户干预，自动作出响应和调整,有效减少源站压力','同一地域的CDN和云服务ECS实例之间，不收回源流量费'],exp:'同一地域的CDN和云服务ECS实例之间，是免收回源流量费，并非不收回源流量费，D描述错误。A、B、C选项均是阿里云CDN节约成本特点的正确表述'},
  {id:74,type:'single',answer:'B',stem:'是ECS在线扩容CentOS8系统盘后出现报错："xfs-growfs:is not amountedXFSfilesystem"错误,错误原因为',opts:['xfsgrowts命令后需要接文件系统，而非文件系统挂载点','xfs-growfs命令后需要接文件系统挂载点，而非文件系统','xfs-growfs命令后需要接文件系统挂载点，而非文件系统（此条答案自动忽略不计）','centos8目前只可以进行离线扩容'],exp:'问题原因 新旧版本的xfs_growfs命令使用问题。新版的xfs_growfs命令后面的参数需要为文件系统挂载点，而非文件系统本身。 参考链接： https://help.aliyun.com/knowledge_detail/155936.html?spm=5176.11065259.1996646101.searchclickresult.263279f2A02jOC'},
  {id:75,type:'single',answer:'A',stem:'流量、数据包、连接数等，设置报警值，一旦触发了报警条件，就会通过多种方式进行报警。目前还不支持的报警方式。',opts:['电话报警','邮件报警','短信报警','旺旺报警'],exp:'阿里云的负载均衡SLB的监控报警目前还不支持电话报警。开通负载均衡的云监控服务后，您可以在云监控控制台配置监控报警规则。负载均衡的云监控支持“短信”、“邮件”、“旺旺” 三种报警方式，暂不支持电话报警。参考链接：https://help.aliyun.com/document_detail/32470.html'},
  {id:76,type:'single',answer:'C',stem:'阿里云云服务器ECS是一种简单高效、处理能力可弹性伸缩的计算服务，帮助您快速构建更稳定、安全的应用，提升运维效率，降低IT成本。ECS属于 选项：',opts:['SaaS(软件即服务)','PaaS(平台即服务)','IaaS(基础设施即服务)','DaaS(数据即服务)'],exp:'IaaS也就是基础设施即服务（Infrastructure-as-a-Service）。IaaS公司会提供场外服务器，存储和网络硬件，也可以选择租用。节省了维护成本和办公场地，公司可以在任何时候利用这些硬件来运行其应用。比如阿里云的ECS，亚马逊的EC2，腾讯云的CVM，都属于IaaS。'},
  {id:77,type:'single',answer:'C',stem:'在OSS服务中，单个object的大小限制为',opts:['24.4TB','50TB','48.8TB','没有容量上限'],exp:'单个Object的大小限制是48.8T，但是每个Bucket的容量是没有上限的哦。'},
  {id:78,type:'single',answer:'D',stem:'用户把数据存储到OSS以后，就可以使用阿里云提供的其他产品和服务对其进行相关操作，比如OSS和ECS产品结合使用，假设OSS和ECS实例属于同地域，可以通过方式使用内网访问OSS资源；假设OSS和ECS实例属于不同的地域，可以通过来间接实现通过OSS内网地址访问OSS资源？',opts:['通过VPN网关直接访问OSS资源、通过ossbrowser访问OSS资源','通过URL直接访问OSS资源、通过ossbrowser访问OSS资源','通过VPN网关直接访问OSS资源、通过配置ECS反向代理','通过URL直接访问OSS资源、通过配置ECS反向代理'],exp:'OSS与ECS结合使用时，同地域场景下通过内网访问OSS资源需使用OSS的内网Endpoint（URL形式）。不同地域时，由于内网无法互通，需借助ECS反向代理转发请求。阿里云文档指出OSS内网访问需使用特定地域的Endpoint，跨地域则建议通过代理实现。选项D中“通过URL直接访问”对应内网Endpoint，“配置ECS反向代理”解决跨地域内网访问问题，符合官方推荐方案。其他选项中的VPN网关、ossbrowser不具备题目要求的跨地域内网访问能力。'},
  {id:79,type:'single',answer:'B',stem:'某O2O网站基于阿里云的云服务器ECS、负载均衡SLB以及弹性伸缩(AutoScaling)搭建了线上系统，其中ECS用来处理用户响应，SLB用来分发流量，弹性伸缩负责动态分配资源以满足突发的业务变化，三个产品配合可以提供稳定、便捷、低成本的服务。现在想要增加云数据库RDS到该架构中来，用来保存用户访问时产生的数据。以下说法中正确的是',opts:['可以把RDS实例手工添加到伸缩组，RDS实例可以保存用户访问的数据','如果在伸缩组中指定了RDS实例，则弹性伸缩会自动把伸缩组中的ECS实例的IP地址添加到RDS的白名单中去，无需手工设置','对RDS实例所在的地域（Region）没有硬性规定，但是建议和弹性伸缩在同一个地域，可以减小网络传输的延迟，提升响应速度','可以把RDS实例直接挂在SLB下，由SLB按照转发规则分配任务到RDS实例进行处理'],exp:'题目问的是弹性伸缩和ECS，再配合RDS配合使用，弹性伸缩只支持ECS的伸缩，不支持其他任何云产品的伸缩，所以"可以把RDS实例手工添加到伸缩组"错误；SLB后端只能挂载ECS，不支持其他任何云产品挂载，所以"可以把RDS实例直接挂在SLB下"错误；弹性伸缩必须和RDS出于同一个地域，否则不能搭配使用，所以"对RDS实例所在的地域（Region）没有硬性规定"错误，；弹性伸缩(Auto Scaling)与 SLB/RDS 紧密集成，可以自动管理SLB后端服务器和RDS白名单，节省操作成本。参考弹性伸缩产品优势链接：https://help.aliyun.com/document_detail/25859.html'},
  {id:80,type:'single',answer:'B',stem:'阿里云OSS通过Restful API方式对外提供服务，最终用户通过OSS默认域名或者绑定的自定义域名方式访问。但是，某企业由于安全机制，需要在出口防火墙配置策略，以限制内部员工和业务系统只能访问指定的公网IP，但是OSS的Bucket访问IP会随机变换，导致需要经常修改防火墙策略。建议其采用的方案来解决这个问题。',opts:['使用文件存储代替oss','在ECS实例上配置OSS的反向代理','前端增加一个负载均衡SLB实例，使用SLB的固定IP访问','使用阿里云NAT网关服务，进行IP地址转换'],exp:'阿里云OSS的存储空间（Bucket）访问地址会随机变换，您可以通过在ECS实例上配置OSS的反向代理，实现通过固定IP地址访问OSS的存储空间。'},
  {id:81,type:'single',answer:'D',stem:'某用户使用负载均衡SLB和云服务器ECS搭建FTP服务（监听端口99），搭建完成后，通过filezillaclient访问SLB公网IP的99端口，能够登陆FTP，但是读取目录失败，导致该错误的关键原因是',opts:['后端服务器负载过高','ECS的安全组规则入方向配置错误','创建负载均衡实例后，没有添加监听','负载均衡SLB不支持搭建FTP服务'],exp:'FTP协议使用主动模式时需建立数据连接端口（如20端口），负载均衡SLB无法动态处理FTP的多端口通信，因此不支持直接搭建FTP服务。尽管控制通道（99端口）可连通，但数据通道无法通过SLB转发，导致目录读取失败。'},
  {id:82,type:'single',answer:'C',stem:'您的应用系统中存在大量的非结构化数据，之前采用阿里云的云服务器ECS实例加云数据盘的方式进行存储，随着数据的不断膨胀，维护成本和拥有成本越来越高。您希望将目前存储在云服务器ECS实例的数据盘上的大量非结构化的数据转存到其他的服务上去，并使用新的服务提供后续的数据存储服务，从而实现更好的节省运维、管理及存储本身的成本，采用方式最为经济高效。',opts:['将数据转移到表格存储中，提供低成本、高并发、低延时的海量数据存储与在线访问','申请OSS bucket，使用闪电立方将磁盘上的数据转移到OSS服务中进行存储','在云服务所在的地域申请OSS bucket，使用OssImport将磁盘上的数据转移到OSS服务中进行存储','将磁盘数据存储下载到本地数据中心的磁带库中进行存储'],exp:'闪电立方Lightning Cube（海外叫数据迁移Data Transport）是阿里云为TB乃至PB级数据迁移提供的服务。而题目中说的是：云服务器ECS实例的数据盘上的大量非结构化的数据转存到其他的服务上去。所以使用OSSImport更方便。'},
  {id:83,type:'single',answer:'D',stem:'关于阿里云CDN缓存数据更新的建议和描述，错误的是',opts:['缓存刷新指的是强制将分发节点上缓存的资源标记为过期，当用户再次对该资源发起请求时，节点会回源拉取资源，并缓存一份更新后的资源在分发节点','同名更新时，可以从控制台提交刷新请求，或者使用API，完成主动刷新','同名更新时，如果不主动刷新，只能等待缓存文件到期后才能回源拉取最新的文件','阿里云CDN支持对同名更新的实时更新，用户只要做相关配置后，不必主动提交请求，便可以实现自动刷新'],exp:'阿里云CDN支持对同名更新的实时更新，用户只要做相关配置后，在用户不主动提交请求的时候，CDN不会自动去实现刷新请求。'},
  {id:84,type:'single',answer:'A',stem:'阿里云的弹性伸缩主要可以提供的功能，下面说法错误的是？',opts:['根据客户业务需求横向扩展ECS实例的容量，即自动增加和减少ECS实例，数量是有限制的。','支持SLB负载均衡配置：在增加或减少ECS实例时，自动向SLB实例中添加或移除相应的ECS实例','支持RDS访问白名单：在增加或减少ECS实例时，自动向RDS访问白名单中添加或移出该ECS实例的IP','多模式兼容，可同时配置定时、动态、自定义、固定、健康模式，可通过API方便对接外在监控系统'],exp:'弹性伸缩的核心功能是根据业务需求自动调整ECS实例数量，但选项A错误。弹性伸缩的实例数量限制由用户配置的最大/最小值决定，并非系统固有。选项B、C正确，因弹性伸缩支持与SLB和RDS白名单自动联动。选项D正确，弹性伸缩支持多种模式且可对接API。因此，错误选项为A'},
  {id:85,type:'single',answer:'C',stem:'阿里云的云监控(CloudMonitor)是一项针对阿里云资源和互联网应用进行监控的服务。下列关于云监控的说法准确的是？',opts:['需要单独购买并付费，才可以开通','不能通过管理控制台使用云监控服务','支持监控未部署在阿里云产品上的网站','不支持监控未部署在阿里云产品上的网站'],exp:'无论您的服务器是阿里云服务器 ECS，还是其他云厂商的服务器或物理机，都可以使用主机监控服务。参考链接：https://help.aliyun.com/document_detail/43503.html'},
  {id:86,type:'single',answer:'C',stem:'某用户在云上开通了OSS服务用于存储其站点的图片资源，并且使用CDN进行内容的分发加速。该用户为了在业务中避免被盗图的风险，对于OSS服务中的公共读文件开始了原图保护，限制向外暴露图片的URL。该用户开启原图保护以后，通过方式访问OSS服务可能会造成原图保护失效。',opts:['直接访问OSS文件','匿名访问OSS文件','通过CDN请求访问文件','通过处理参数请求缩略图'],exp:'问题一：OSS开启了原图保护，直接访问图片文件时会正常返回403，但是通过CDN来进行请求时原图保护无效，返回200。 这种情况有可能是CDN回源到了私有Bucket，造成原图保护失效。原图保护功能仅针对匿名访问文件有效，对于带签名的访问是无效的。 问题二：开启原图保护后，通过签名后的URL可以访问原图？ 原图保护仅针对允许匿名访问的文件，使用签名URL访问图片属于非匿名访问，所以开启原图保护后，使用签名后的URL仍然可以访问原图。'},
  {id:87,type:'single',answer:'C',stem:'阿里云的资源是多地域（Region)、多可用区(Zone）部署的，通常来讲，同地域不下同可用区之间的距离大概在范围。',opts:['数百米','数公里','数十公里','数百公里'],exp:'阿里云地域（Region）由多个可用区（Zone）组成，每个可用区为独立物理机房。根据官方文档，同一地域内的不同可用区之间通过低延迟网络连接，并保持足够距离以隔离故障，通常设计为数十公里级别。选项C符合这一设计原则，其他选项或距离过近无法隔离风险，或超出同一地域的常见部署范围。参考阿里云《地域和可用区》文档。'},
  {id:88,type:'single',answer:'B',stem:'起来，然后使用创建的接式对多张图片进行操作。用户可以使用指定处理参数的方式新建图片样式，多参数之间用连接。',opts:['空格','正斜线(/)','顿号(、)','短横线(-)'],exp:'使用图片样式对图片进行处理 高级编辑：使用指定处理参数的方式新建图片样式。输入规则名称，然后在代码区域按照以下格式直接输入图片缩放的参数： image/action1,parame_value1/action2,parame_value2/...。'},
  {id:89,type:'single',answer:'A',stem:'ECS实例区分网络类型，支持经典网络和专有网络VPC，实例在相同的网络中，如同一个VPC，可以使用私网IP地址通过内网通信，经典网络类型的云产品，统一部署在阿里云公共基础设施内，规划和管理由阿里云负责，更适合对网络易用性要求比较高的用户，经典网络支持（）功能。',opts:['私网互通','自定义路由器','隧道技术','自建NAT网关'],exp:'无论经典网络还是专有网络均支持通过私网地址进行互通。参考链接：https://help.aliyun.com/document_detail/61651.html'},
  {id:90,type:'single',answer:'C',stem:'阿里云的负载均衡SLB是对多台后端服务器进行流量分发的服务。以下关于负载均衡SLB的说法正确的是',opts:['通过Tengine提供四层负载均衡','可以不需要云服务器ECS实例就实现负载均衡服务','通过集群提供服务，具有高可靠性','通过LVS提供七层负载均衡'],exp:'通过集群提供服务,具有高可用性(也可以说是可靠性)，四层负载均衡是通过LVS来实现的，七层负载均衡是通过Tengine来实现的。负载均衡必须和云服务器ECS配合使用。'},
  {id:91,type:'single',answer:'D',stem:'您在阿里云的华东1（杭州）距跟华北2（北京）者都创建了专有网络VPC，通过可以最快速的把华东1（杭州）跟华北2（北京）的VPC通过内网连接起来实现两地云服务器ECS实例可以互相访问。',opts:['VPN','高速通道','专线','其他答案都对'],exp:'因为快速是相对的，高速通道、VPN以及专线的建立都是需要一定时间的。所以题目的意思不能说谁最快速，而是说怎么样能通过阿里云最快速实现这样的功能，所以三个都选。'},
  {id:92,type:'single',answer:'B',stem:'阿里云的专有网络VPC中用于连接VPC内的各个交换机的设备是',opts:['路由表','路由器','云服务器ECS','负载均衡SLB'],exp:'路由器和交换机 路由器(VRouter)是专有网络的枢纽。作为专有网络中重要的功能组件,它可以连接VPC内的各个交换机,同时也是连接VPC和其他网络的网关设备。参考链接：https://helpcdn.aliyun.com/document_detail/34217.html'},
  {id:93,type:'single',answer:'D',stem:'某企业利用某公共云服务，租用了若干台虚拟机，并把这些虚拟机放在一个隔离的虚拟网络中，可以完全掌控自己的虚拟网络，包括选择自有IP地址范围、划分网段、配置路由表和网关等，这个虚拟网络在公共云服务中通常称作',opts:['NFV服务','VPN服务','SDN服务','VPC服务'],exp:'题目中说需要构建隔离的虚拟网络，所以需要用到阿里云专用网络VPC服务。'},
  {id:94,type:'single',answer:'B',stem:'阿里云弹性伸缩（AutoScaling）可以通过设置定时任务来定时地增加或减少ECS实例，那么如果多个定时任务在同一时间内触发执行同一个伸缩组的伸缩规则，下面关于定时任务执行的说法正确是？',opts:['会选取最近创建的定时任务执行,排在后面的定时任务会在 LaunchExpirationTime 内自动重试定时触发','会选取最早创建的定时任务执行,排在后面的定时任务会在 LaunchExpirationTime 内自动重试定时触发','会选取最近创建的定时任务执行,排在后面的定时任务则会取消','多个定时任务部分先后将同时执行'],exp:'如果多个定时任务在相近的时间内触发执行同一个伸缩组的伸缩规则，则最早触发的定时任务会先执行伸缩活动。由于同一个伸缩组同一时刻内只能有一个伸缩活动，排在后面的定时任务会在LaunchExpirationTime内自动重试定时触发。如上一个伸缩活动完成之后，排在后面的定时任务还在LaunchExpirationTime内重试，则执行该定时任务的伸缩规则并触发相应的伸缩活动。https://help.aliyun.com/document_detail/25957.html'},
  {id:95,type:'single',answer:'A',stem:'小明是一个社交网站的架构师，创业初期用户量较少，每个注册客户上传的图片文件直接保存在了一台阿里云的云服务器ECS实例上。最近用户量爆增，图片存储的空间达到了3.5T，WEB服务器由原来的1台ECS实例扩展到了5台ECS实例，性能问题得到了解决，可是保存在ECS实例的图片无法在多台ECS之间共享读写。阿里云的产品非常适合解决这个问题',opts:['对象存储OSS','内容分发网络CDN','归档存储（Archive Storage）','负载均衡SLB'],exp:'划重点：保存在ECS实例的图片无法在多台ECS之间共享读写，所以需要对象存储OSS提升图片存储的性能已经共享读写图片。'},
  {id:96,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)中，伸缩组是一组部署了相同应用的云服务器ECS实例的集合。以下关于伸缩组的说法中正确的是？',opts:['当伸缩组对应的伸缩规则的条件触发后，弹性伸缩会根据设定的伸缩规则添加或者减少伸缩组中的云服务器ECS实例','伸缩组是云服务器ECS实例的资源池，当实际应用中需要添加计算资源时，会从伸缩组中获取可用的ECS实例，添加到应用中去','伸缩组是云服务器ECS实例的资源池，弹性伸缩会预先创建一定数量的云服务器ECS实例放在伸缩组中','伸缩组是监控的目标，其中的云服务器ECS实例，必须是由阿里云弹性伸缩基于相同的镜像自动创建的'],exp:'阿里云弹性伸缩（Auto Scaling）的基础知识。服务器ECS实例可以是自己创建，也可以自动添加闲置的云服务器ECS资源。'},
  {id:97,type:'single',answer:'A',stem:'某用户的业务系统在云上搭建了ECS和VPC服务架构。该用户在为Windows系统的ECS实例配置IPv6地址时，搭建好IPv6VPC后的步骤如下：1、开通网络带宽2、分配IPv6地址3、添加安全组规则4、配置IPv6地址请为用户选择正确的步骤顺序为',opts:['2-1-3-4','2-1-4-3','3-2-1-4','3-2-4-1'],exp:'配置IPv6地址的正确逻辑顺序为：首先在VPC中为ECS实例分配IPv6地址（步骤2），然后开通网络带宽以确保网络连通性（步骤1），接着添加安全组规则以控制IPv6流量访问（步骤3），最后在Windows实例操作系统中配置IPv6地址（步骤4）。选项A（2-1-3-4）符合这一流程，确保资源分配和安全策略在系统配置前就绪'},
  {id:98,type:'single',answer:'D',stem:'您发现某台阿里云的云服务器ECS实例无法连接到互联网，不可能是原因造成的。',opts:['您修改了云服务器ECS实例访问公网的安全组策略','自行修改过公网IP','在云服务器ECS实例中将公网IP对应的网卡关闭了','云服务器ECS实例的网口松了'],exp:'云服务器ECS实例无法连接到互联网不会是因为云服务器ECS的网口连接问题导致的。'},
  {id:99,type:'single',answer:'B',stem:'阿里云云安全中心是一个大数据安全分析平台，能对您云上所有资产进行安全告警，并用机器学习来发现潜在的入侵和高隐蔽性攻击，回溯攻击历史，预测即将发生的安全事件。阿里云云安全中心提供的是一种类型的服务。',opts:['IaaS','SaaS','PaaS','SOA'],exp:'大数据安全分析平台提供的是数据分析的功能，所以大数据安全分析平台就是一个软件SaaS平台。'},
  {id:100,type:'single',answer:'C',stem:'云计算在极大地方便用户和企业廉价使用存储资源、软件资源、计算资源的同时，同样也面临着安全方面的挑战。上云并不会增加安全风险,同时云计算厂商也不会帮助客户解决一切安全问题,需要用户积极参与。目前普遍遵循“三不变”原则，不包括以下哪项？ 选项：',opts:['数据归属关系不变','安全管理责任不变','运维管理方式不变','安全管理标准不变'],exp:'在安全管理方面，中网办发布《关于加强党政部门云计算服务网络安全管理的意见》（中网办发文〔2014〕14号）（以下称“14号文”），进一步明确党政部门云计算服务网络安全管理的基本要求，提出了“安全管理责任不变，数据归属关系不变，安全管理标准不变，敏感信息不出境”四条基本要求。不包含"运维管理方式不变"。'},
  {id:101,type:'single',answer:'D',stem:'云服务器ECS的功能组件主要包含实例、镜像、块存储、快照、安全组、网络。想要恢复某一时间点一块数据状态的文件，可以使用云服务器ECS功能。',opts:['实例','镜像','块存储','快照'],exp:'快照用于备份云盘在某一个或者多个时间点的数据。 https://help.aliyun.com/document_detail/25392.html?spm=a2c4g.11186623.6.853.2d57505czICIxT'},
  {id:102,type:'single',answer:'B',stem:'阿里云对象存储OSS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。与自建存储对比，OSS在可靠性、安全、成本和数据处理能力等几个方面都具有优势。以下是OSS在可靠性方面表现出来的优势。',opts:['受限于硬件可靠性,易出问题,一旦出现磁盘坏道,容易出现不可逆转的数据丢失','数据可靠性不低于 99.99999999%。数据自动多重冗余备份','数据需要客户手工备份、耗时、耗力','提供多种鉴权和授权机制及白名单、防盗链、主子账号功能'],exp:'题目中问的是OSS在可靠性方面表现出来的优势，所以选择"数据可靠性不低于 99.99999999%。数据自动多重冗余备份"，"提供多种鉴权和授权机制及白名 单、防盗链、主子账号功能"是OSS在安全性方面表现出来的优势。'},
  {id:103,type:'single',answer:'B',stem:'G公司开发了一款购物的APP，全部系统都基于阿里云的产品构建，用到了华北1（青岛)地域的云服务器ECS实例和对象存储OSS，静态网页和图片全部放在OSS中。上线后在中国大陆范围内访问速度良好。最近公司想拓展美国市场，希望美国用户使用APP时也能实现较快的速度。G公司使用阿里云的方案是最佳的。',opts:['启用华东1(杭州)和华北2(北京)双地域的对象存储OSS和内容分发网络CDN','启用美西（硅谷）地域的对象存储OSS和内容分发网络CDN','启用弹性伸缩(Auto Scaling)和更多的云服务器ECS实例','启用弹性伸缩(Auto Scaling)和内容分发网络CDN'],exp:'题目中需要美国用户使用APP时也能实现较快的速度，所以需要在美国地域开启相应的CDN功能，所以选择在美西（硅谷）地域的对象存储OSS和内容分发网络CDN。'},
  {id:104,type:'single',answer:'A',stem:'转发的请求。负载均衡服务通过设置，将添加的同一地域的多台ECS实例虚拟成一个高性能、高可用的应用服务池。',opts:['虚拟服务地址','后端端口','后端协议','前端协议'],exp:'负载均衡服务通过设置虚拟服务地址，将添加的同一地域的多台ECS实例虚拟成一个高性能、高可用的应用服务池。'},
  {id:105,type:'single',answer:'C',stem:'阿里云提供公网和私网两种类型的负载均衡服务。下列关于SLB实例属性配置说法错误的是？',opts:['如果用户不指定一个容易识别的SLB名称，则系统会自行分配一个名称','LoadBalancerId是用于识别用户SLB实例的唯一标识','系统自动选择公网或者私网访问','不同类型的SLB，系统会分配不同的服务地址给用户'],exp:'负载均衡SLB中的公网或者私网访问的选择是由用户在购买时候的选择，并不是系统自动选择。'},
  {id:106,type:'single',answer:'A',stem:'ECS在使用的过程中如果数据盘空间不够，可以使用扩容功能，扩容云盘只是扩大存储容量，但不会扩容',opts:['文件系统','数据盘','操作系统','共享块存储'],exp:'扩容云盘（ResizeDisk）只是扩大云盘的存储容量，不会扩容ECS实例的文件系统，您需要按照本文步骤扩容文件系统，实现ECS实例存储空间的扩展。 https://help.aliyun.com/document_detail/25452.html?spm=a2c4g.11186623.6.1112.3e3bfdc9F9kJ21'},
  {id:107,type:'single',answer:'D',stem:'关于阿里云的云盾“DDoS高防IP”云服务支持的“线路类型”说法正确的是',opts:['仅支持BGP+电信','仅支持电信+联通','仅支持联通+BGP+电信','仅支持电信+联通+BGP+HK线路'],exp:'阿里云DDoS高防IP服务的线路类型在官方文档中明确指出，该服务支持电信、联通、BGP线路以及针对特定区域的HK线路。选项D涵盖所有官方列出的线路类型，而其他选项均存在线路缺失问题，例如A、B未包含联通或HK线路，C缺少HK线路。阿里云产品文档中对线路类型有明确分类和说明。'},
  {id:108,type:'single',answer:'A',stem:'阿里云的负载均衡SLB对应的后端服务器池中包含多台云服务器ECS实例时，若ECS实例对外服务能力不同，为了更充分的利用ECS实例的处理能力，以下说法中正确的是',opts:['给处理能力强的ECS实例配置更高的权重，权重越高意味着将有机会被分配到更多的访问请求','按照轮询的模式分发任务，能力强的ECS实例一定能分配到更多的请求','按照最小连接数的模式分发任务，能力强的ECS实例一定能分配到更多的请求','负载均衡SLB的目的就是为了平衡后台ECS实例间的负载，无法让某些ECS实例分配到更多的请求'],exp:'通过设置轮询权重，能力强的设置比较高的权重从而获得更多的请求来处理。'},
  {id:109,type:'single',answer:'B',stem:'使用集群是解决高并发，海量数据的通常手段，对于这种类型的网站而言，不管多么强大的服务器都满足不了持续增长的业务需求。这种情况下，需要增加服务器来分担原有系统的压力，我们可以开通阿里云上哪个服务来实现该请求的分发？',opts:['ECS','SLB','RDS','DRDS'],exp:'划重点：来实现该请求的分发，所以需要负载均衡SLB。'},
  {id:110,type:'single',answer:'A',stem:'当您的云服务器ECS实例的镜像选择了Aliyun Linux，可以兼容以下操作系统。',opts:['CentOS','Windows Server 2008','OpenSUSE','UBUNTU'],exp:'Aliyun Linux和Centos都属于RedHat一家的。兼容Red Hat。其中包括（Red Hat Enterprise Linux， Fedora，CentOS，Scientific Linux， Oracle Linux），参考：https://blog.csdn.net/wangjianno2/article/details/51607847'},
  {id:111,type:'single',answer:'B',stem:'如果用户需要创建SLB实例，为了能够真正的实现应用的负载分担，那么要保证至少要有个ECS实例？',opts:['5个','2个','3个','1个'],exp:'因为题目中强调了需要真正实现负载的分担，所以至少需要两台ECS配合才能实现。'},
  {id:112,type:'single',answer:'D',stem:'负载均衡提供标签管理功能，方便用户通过标签对负载均衡实例进行分类。关于负载均衡标签的使用限制说法错误的是',opts:['标签必须绑定在某个负载均衡实例上','一个实例上的每个标签的标签键必须唯一','每个实例可以绑定的标签数量有限制','不同地域中的的标签信息互通'],exp:'不支持未绑定实例的空标签存在，标签必须绑定在某个负载均衡实例上。 一个实例最多可以绑定10个标签。 一个实例上的每个标签的标签键必须唯一，相同标签键的标签会被覆盖。 每个地域中的的标签信息不互通，例如在华东1地域创建的标签在华东2地域不可见。'},
  {id:113,type:'single',answer:'B',stem:'开通阿里云对象存储OSS服务后，您首先需要使用OSS管理控制台或OpenAPI创建Bucket来存储文件。创建Bucket时“所属地域”这个属性必须要指定，特别是您的云服务器ECS实例需要通过内网访问OSSBucket时，必须选择与ECS实例相同的地域，以下有关“所属地域”的说法是正确的。',opts:['Bucket创建后，“所属地域”属性可随时更改','Bucket创建后，“所属地域”属性不可更改','Bucket创建后，如果未上传任何文件，则“所属地域”属性可以更改','Bucket创建后，要想修改“所属地域”属性，需申请特殊权限'],exp:'Bucket创建后，所属地域不可更改。'},
  {id:114,type:'single',answer:'A',stem:'您的应用部署在阿里云的云服务器ECS实例上，想自己采集指标做应用层面的监控。阿里云提供的云监控服务的功能可以提供指标收集、聚合和报警的服务。',opts:['自定义监控','站点监控','云服务监控','云监控无法满足'],exp:'自定义监控中，用户可以针对自己关心的业务指标进行监控。参考链接：https://help.aliyun.com/document_detail/63767.html'},
  {id:115,type:'single',answer:'A',stem:'使用阿里云的负载均衡SLB实例时，合理的会话保持配置可以实现与某个连接（SesSion）相关的所有应用请求能够由同一台后端云服务器ECS实例进行处理，维持业务的延续性。四层服务的会话保持是基于实现的。',opts:['源IP','负载均衡IP','cookie','用户的UUID'],exp:'四层服务的会话保持是基于源IP实现的，七层服务的会话保持是基于Cookie实现的。'},
  {id:116,type:'single',answer:'C',stem:'A网站的账户从而尝试登录B网址，这种攻击行为被称作“撞库攻击”。当您在云盾态势感知中发现有撞库攻击的威胁时应该采取应对。',opts:['立即修改云服务器ECS实例的所有密码，并检查登录日志','立即修改数据库密码，新密码采用8位以上的复杂密码','通知自己业务平台的所有用户立即修改密码，并通过技术手段杜绝简单密码','撞库攻击产生的风险由用户自己负责，不需要做任何操作'],exp:'当您在云盾态势感知中发现有撞库攻击的威胁时，说明黑客很有可能已经知道了网站用户的用户名和密码，这个时候应该紧急通知自己业务平台的所有用户修改密码，并加强密码规则。此时修改数据库密码是没有作用的。'},
  {id:117,type:'single',answer:'B',stem:'某用户在云上创建了VPC网络，其VPC内的某些ECS实例用于需要对外提供服务绑定了EIP实例，其他的ECS实例通过NAT网关的SNAT功能代理访问互联网。由于绑定EIP的ECS实例会优先通过EIP访问互联网，造成了该用户VPC内ECS实例的公网出口IP不一致的情况。为了统一VPC内ECS实例的公网出口IP（对外提供服务的ECS实例仍需要以不同的访问地址继续提供服务），便于用户更高效地管理互联网业务，用户可以',opts:['将绑定了EIP的ECS实例解绑EIP','为原绑定EIP的ECS实例单独分配一块弹性网卡，并将EIP绑定到弹性网卡','为原绑定EIP的ECS实例ECS实例设置DNAT IP映射','为原绑定EIP的ECS实例ECS实例设置DNAT IP映射'],exp:'参考链接： https://help.aliyun.com/document_detail/122272.html?spm=a2c4g.11186623.6.598.6c0178aawzoxeK'},
  {id:118,type:'single',answer:'C',stem:'云安全中心是一个实时识别、分析、预警安全威胁的统一安全管理系统，以下关于云安全中心的描述错误的是',opts:['云安全中心不支持解绑阿里云ECS服务器，即使卸载了Agent插件，该服务器仍将以离线状态出现在服务器列表中，而不会从列表中移除','部分弱密码检测项(例如: MySQL弱密码检测、PostgreSQL弱密码检测、Microsoft SQL Server弱密码检测可能采用尝试登录的方式进行检测，从而会占用一定的服务器资源，产生较多的登录失败记录)和系统等保、CIS标准检测项默认关闭','末安装Agent插件的服务器将不受云安全中心保护，但控制台页面仍会显示该资产的任何漏洞、告警、基线漏洞和资产指纹等数据','资产指纹调查的配置管理功能支持设置监听端口、软件资产、运行进程、账户资产、计划任务和中间件数据的采集刷新频率'],exp:'Agent插件是云安全中心提供的本地安全插件，您必须在要防护的服务器上安装该插件才能使用云安全中心的服务。 参考链接： https://help.aliyun.com/document_detail/117396.html?spm=a2c4g.11186623.6.560.54af755bKHlgw5'},
  {id:119,type:'single',answer:'B',stem:'内容安全提供内容检测API、OSS违规检测和站点检测功能，OSS违规检测使用人工智能技术帮助检测阿里云对象存储服务OSS中的图片、视频是否包含色情、涉政等违规内容，并支持自动冻结(禁止公网访问)检测出的违规内容。下列关于OSS违规检测说法不正确的是',opts:['使用OSS违规检测前，需要在内容安全控制台通过RAM授权内容安全服务读取OSS Bucket的权限。','OSS违规检测支持检测OSS Bucket中的增量内容和存量内容。增量内容(图片、视频)不支持自动检测，存量内容(图片、视频)支持自动检测。','oss违规检测支持对图片和视频对象应用多种场景的违规检测，支持的图片检测场景如下：涉黄、涉政、图文违规、不良场景','OSS违规检测支持检测特定格式后缀的文件，支持检测的视频格式如下：avl、mp4、3gp、mkv等。'],exp:'增量内容（图片、视频）支持自动检测。增量检测一次配置即可长期生效。 存量内容（图片、视频）不支持自动检测。如果要对存量图片、视频进行检测，您需要手动设置要检测的Bucket和时间范围，并执行存量扫描。 参考链接： https://help.aliyun.com/document_detail/28423.html?spm=a2c4g.11186623.2.21.7d444ee7x5AQOr#task-1681236'},
  {id:120,type:'single',answer:'A',stem:'您拥有香港地域可用区A、华北1（青岛）地域可用区B和华南1（深圳）可用区B的云服务器ECS实例，现在希望通过购买新的块存储挂载到已有的云服务器ECS实例上进行磁盘空间的扩容，肯定不能购买可用区的块存储。',opts:['华北1（青岛）地域可用区A','华北1（青岛）地域可用区B','香港地域可用区A','华南1（深圳）地域可用区B'],exp:'根据题意，购买新的块存储意味创建新的数据盘，所以只能购买同一个可用区的云盘，所以只能选择：香港地域可用区A，华北1（青岛）地域可用区B和华南1（深圳）可用区B。'},
  {id:121,type:'single',answer:'C',stem:'对象存储服务OSS是一种海量、安全、低成本、高可靠的云存储服务，支持多种类型的文件访问权限(ACL),不是OSSObjectACL支持的方式。',opts:['公共读','私有','继承Object','继承Bucket'],exp:'OSS的文件读写权限ACL支持：继承Bucket，私有，公共读，公共读写。不支持"继承Object"的权限ACL。'},
  {id:122,type:'single',answer:'A',stem:'在使用阿里云负载均衡SLB的时候，经常会发现有很多100开头的IP(100.x.X.x)在访问负载均衡SLB实例的后端云服务器ECS实例，这可能是引起的？',opts:['开启了健康检查选项，负载均衡SLB实例对ECS实例进行健康检查引起的','是云监控搜集各种统计指标','是阿里云飞天系统的Zookeeper守护进程','肯定配置了阿里云弹性伸缩（Auto Scaling），这是弹性伸缩的弹性自愈进程在做ECS实例的状态检查'],exp:'有10或100开头的IP在频繁访问ECS是因为负载均衡系统除了会通过系统服务器的内网IP将来自外部的访问请求转到后端ECS上之外，还会对ECS进行健康检查（前提是您已经开启了这一功能）和对您的负载均衡服务进行可用性监控，这些访问的来源都是由负载均衡系统发起的。参考链接：https://yq.aliyun.com/ask/58922'},
  {id:123,type:'single',answer:'E',stem:'交换机，是组成VPC网络的基础网络设备。它可以连接不同的云产品实例。在VPC网络内创建云产品实例的时候，必须指定云产品实例所在的交换机。下面关于交换机说法错误的是？',opts:['VPC 的交换机，是一个 3 层交换机，不支持 2 层广播和组播;','只有当 VPC 的状态为 Available 时，才能创建新的交换机;','交换机不支持并行创建，一个交换机创建成功之后，才能够创建下一个;','交换机创建完成之后，无法修改 CIDRBlock;','删除交换机时，该交换机所连接的云产品实例也一同删除;'],exp:'删除交换机之前，必须先删除目标交换机所连接的云产品实例。否则删除不成功。题目中的"删除交换机时，该交换机所连接的云产品实例也一同删除"说法不正确。'},
  {id:124,type:'single',answer:'A',stem:'您的业务增长，会出现现有的阿里云的云服务器ECS实例的系统盘存储资源不足的问题，阿里云提供了系统盘扩容的功能帮您解决系统盘存储资源不足的问题。下列关于扩容系统盘的操作说法错误的是',opts:['扩容系统盘之后您实例的IP地址会发生变化','其他都是错误的','通过更换实例的系统盘来实现系统盘的扩容','扩容系统盘的时候需要停止您的实例，因此会短暂中断您的业务'],exp:'扩容系统盘是需要ECS处于停止的状态，所以会中断ECS中的业务，但是扩容系统盘之后不会导致实例的IP地址发生变化。'},
  {id:125,type:'single',answer:'C',stem:'对象是OSS存储数据的基本单元，也被称为OSS的文件。对象由Data和Key组成。',opts:['Region','Bucket','Object Meta','Endpoint'],exp:'对象包含以下信息： Key：对象的名称，可用于查询对象。 Data：您存储的数据，可由任意长度的字节组成。 Object Meta：对象元信息，是一组键值对，表示了对象的一些属性，例如最后修改时间、大小等信息。您也可以在元信息中存储一些自定义的信息。 https://help.aliyun.com/document_detail/177681.html?spm=a2c4g.11186623.6.633.26073470Zp79te'},
  {id:126,type:'single',answer:'C',stem:'用户想根据业务需求和策略设置伸缩规则，在业务需求增长时自动增加ECS实例以保证计算能力，在业务需求下降时自动减少ECS实例以节约成本，可以使用阿里云的实现该需求。',opts:['负载均衡','云数据库','弹性伸缩','专有网络'],exp:'阿里云弹性伸缩服务（Auto Scaling）支持用户预先配置伸缩组、伸缩配置和伸缩规则，在业务需求变化时自动增加或减少ECS实例数量。负载均衡用于分配流量，云数据库负责数据存储管理，专有网络提供网络隔离环境。阿里云产品文档明确说明弹性伸缩的核心功能即根据业务负载动态调整实例规模，实现自动化扩缩容。'},
  {id:127,type:'single',answer:'D',stem:'阿里云的云监控产品的监控数据可以采用方式下载。',opts:['从管理控制台直接下载','通过OpenAPI下载','只能查看报表，无法下载','支持管理控制台和OpenAPI两种方式下载'],exp:'阿里云云监控产品的监控数据支持通过管理控制台直接下载，也提供OpenAPI供编程下载。选项D全面覆盖了这两种方式，符合产品功能设计；其他选项仅描述部分功能或错误否定下载能力'},
  {id:128,type:'single',answer:'A',stem:'在使用阿里云负载均衡SLB时后端服务器可以设置主备服务器组，当主机工作正常时，流量将直接走主机；当主机宕机时，流量将走到备机。关于主备服务器组支持的协议，以下说法正确的是 选项：',opts:['主备服务器组只支持四层监听（TCP和UDP协议）','主备服务器组只支持七层监听（HTTP和HTTPS协议）','主备服务器组只支持七层监听（HTTP协议）','主备服务器组支持四层监听（TCP和UDP协议）和七层监听（HTTP协议）'],exp:'主备服务器组是在监听维度上维护的，并且只支持四层监听。参考链接：https://help.aliyun.com/document_detail/52796.html'},
  {id:129,type:'single',answer:'D',stem:'云服务器ECS的功能组件主要包含实例、镜像、块存储、快照、安全组、网络。想要恢复某一时间点块数据状态的文件，可以使用云服务器ECS功能。',opts:['实例','镜像','块存储','快照'],exp:'快照是云服务器 ECS 中用于记录指定时间点块存储数据状态的备份机制，可直接用于恢复该时间点的数据文件。实例为运行环境，镜像为系统模板，块存储为持久化存储单元，均不具备按时间点回滚功能。'},
  {id:130,type:'single',answer:'A',stem:'阿里云的负载均衡SLB提供对多台云服务器ECS实例进行流量分发的服务。负载均衡SLB实例和后端提供服务的云服务器ECS实例必须具有相同的',opts:['地域（Region）','规格配置（CPU、内存等）','可用区（Zone）','带宽设置'],exp:'负载均衡SLB实例和云服务器ECS搭配使用的时候，两者必须是在同一个地域。'},
  {id:131,type:'single',answer:'A',stem:'某视频手机应用，日均活跃用户为两百万，可以使用阿里云的哪一款或几款产品来解决用户对视频，图片，音频的大量访问？',opts:['OSS+CDN','VPC','云盾+云监控','PTS'],exp:'划重点：来解决用户对视频，图片，音频的大量访问。所以选择OSS和CDN。'},
  {id:132,type:'single',answer:'A',stem:'交换机是组成专有网络的基础网络设备，用来连接不同的云资源实例。专有网络是地域级别的资源，专有网络不可以跨地域，但包含所属地域的所有可用区。可以在每个可用区内创建一个或多个交换机来划分子网。',opts:['交换机、交换机','交换机、路由器','路由器、交换机','路由器、路由器'],exp:'官方原话'},
  {id:133,type:'single',answer:'B',stem:'某阿里云公共云用户，购买了一台云服务器ECS实例，部署了tomcat，用方法可以最简单的监控该实例的tomcat的8080端口是否访问正常。',opts:['购买第三方的监控工具','在阿里云的云监控的站点监控中创建探测点，监控该端口的状态','每小时间登录一次云服务器ECS实例，用命令行查看','自己写脚本探测，然后上报数据到云监控'],exp:'划重点：最简单的监控，所以最简单直接的方法之间通过云监控去检测这些该端口是否正常。'},
  {id:134,type:'single',answer:'A',stem:'用户在使用SLB负载均衡时，发现在HTTP请求的头部增加了Transfer-Encoding：chunked字段，但是本地主机直接访问后端服务器时是没有这个字段的是因为',opts:['由于七层负载均衡基于Tengine反向代理实现','在四层负载均衡服务中，负载均转发流量增加了该字段','通过设置可以不增加该字段','Transfer-Encoding：chunked表示Web服务器对响应消息体做了整体传输'],exp:'由于七层SLB是基于Tengine反向代理实现，Transfer-Encoding字段表示Web服务器如何对响应消息体编码，例如Transfer-Encoding: chunked表示Web服务器对响应消息体做了分块传输。'},
  {id:135,type:'single',answer:'B',stem:'题干：135/1023、防DDoS攻击是阿里云的云盾最主要的功能之一，为了帮助客户抵御不同规模的网络攻击，云盾提供了多种抗DDoS攻击的产品，其中“DDoS基础防护”的开通方法是',opts:['联系客户经理线下开通','自动开通','需要从管理控制台申请开通','提交工单，24小时之内开通'],exp:'DDoS基础防护是在云产品购买后自动开通的，无需手动开通。'},
  {id:136,type:'single',answer:'A',stem:'您发现在创建云服务器ECS实例的磁盘快照时所需的时间每次都不同，关于这个现象说法错误的是',opts:['磁盘快照生成的时候磁盘本身的读写性能发生了变化','因为磁盘容量大小不同，导致快照创建的时间不同','第一次给磁盘创建快照是一个全量的过程，会把整个磁盘都做成快照，所以第一次快照制作的时间比较长','第一次快照之后的磁盘快照是增量创建，只会对磁盘增加的数据和修改的数据做快照，所以第一次之后的快照制作的时间相对短一些'],exp:'阿里云提供的磁盘本身的读写性能是稳定的，并不会发生了变化，创建一份快照的所需时间主要取决于磁盘容量大小。根据快照的增量原理，磁盘的第一份快照为全量快照，耗时较久。再次创建快照，相对耗时较短，但依然取决于和上一份快照之间的数据变化量。变化越大，耗时越久。参考链接：https://help.aliyun.com/document_detail/25455.html'},
  {id:137,type:'single',answer:'A',stem:'结合使用阿里云的云服务器ECS实例。负载均衡SLB实例以及弹性伸缩（Auto Scaling）可以构建一个稳定、高效、安全、低成本的系统，既能做到将负载按预定策略分流，又能做到根据业务量的变化自动伸缩资源，关于负载均衡SLB实例和弹性伸缩（AutoScaling）配合使用的说法中正确的是',opts:['一个负载均衡SLB实例可以绑定多个弹性伸缩的伸缩组，且这些伸缩组的伸缩配置可以不同','一个负载均衡SLB实例可以绑定多个弹性伸缩的伸缩组，且这些伸缩组的伸缩配置必须一致','一个伸缩组可以对应多个负载均衡SLB实例，但是两者必须在同一个地域（Region）中','一个伸缩组可以对应多个负载均衡SLB实例，但是两者必须在同一个可用区（Zone）中'],exp:'此题应该选择AC，题目到单选了，后期修改 一个伸缩组最多同时关联20个负载均衡实例'},
  {id:138,type:'single',answer:'D',stem:'阿里云对象存储0SS是阿里云对外提供的海量、安全、低成本、高可靠的云存储服务。使用阿里云OSS进行数据存储前，需要先建立创建一个或者多个存储空间，这个存储空间在OSS里叫',opts:['key','value','object','bucket'],exp:'基础知识，顾名思义是Bucket。'},
  {id:139,type:'single',answer:'C',stem:'在阿里云的云盾的网络防护体系中，有一种服务默认为所有客户开通，可提供最高5G以下的小规模DDoS防御功能。该项服务的名称是',opts:['态势感知','WAF防火墙','DDoS基础防护','DDoS高防IP'],exp:'云盾的DDoS基础防护提供免费的5G以下的防DDoS攻击能力。'},
  {id:140,type:'single',answer:'A',stem:'阿里云的负载均衡SLB提供对多台后端服务器进行流量分发的服务。对于后端服务器的选择，以下说法中正确的是',opts:['只能是阿里云的云服务器ECS实例','所有能通过公网访问的服务器均可','所有阿里云的云产品实例','支持AWS的EC2'],exp:'阿里云的负载均衡SLB目前只支持阿里云的云服务器ECS实例，不支持其他服务器。'},
  {id:141,type:'single',answer:'D',stem:'在使用阿里云弹性伸缩（AutoScaling)时，希望能根据计算资源的使用情况来增加或者减少云服务器ECS实例，如当CPU利用率小于等于30%时则减少一台云服务器ECS实例，首先配置伸缩规则为“减少1台ECS”然后还需要来实现。',opts:['创建伸缩配置','设置伸缩组的属性','创建定时任务','创建报警任务'],exp:'划重点：当CPU利用率小于等于30%时则减少一台云服务器ECS实例。只有达到这个条件才去执行，所以这就是一个报警任务。'},
  {id:142,type:'single',answer:'C',stem:'您通过阿里云的云监控服务为某台云服务器ECS实例的磁盘使用率设置了1条报警规则：统计周期为5分钟，磁盘使用率平均值超过80%，连续探测5次超过阈值后就报警。如果您的磁盘平均使用率超过80%后，至少需要几分钟后可以收到报警',opts:['40分钟','0分钟','20分钟','30分钟'],exp:'连续五次超过阈值就报警，问的是最少的时间。所以可以假设刚启动云监控就开始第一次探测超过阈值。所以后面一共只需要四个探测周期就可以报警了。所以时间为5分钟*4次=20分钟。'},
  {id:143,type:'single',answer:'A',stem:'SQL注入是一种常见的应用层攻击，一般是通过构建特殊的输入作为参数传入Web应用程序，盗取或破坏应用的数据。请您指出SQL注入攻击最终破坏或盗取的对象是',opts:['数据库','服务器上的机密文件','WEB应用','服务器的图片'],exp:'SQL注入顾名思义攻击者非法操作数据库的数据。'},
  {id:144,type:'single',answer:'B',stem:'OSS是目前中国国内唯一通过CohassetAssociates审计认证的云服务，可满足严格的电子记录保留要管局（FINRA)的合规要求。用户可设置求；允许用户以“不可删除、不可篡改方式保存和使用数据，符合美国证券交易委员会（SEC)和金融业监管局（FINRA)的合规要求。用户可设置合规保留策略。',opts:['基于对象','基于时间','基于用户','多维度'],exp:'OSS提供强合规策略，用户可针对存储空间（Bucket）设置基于时间的合规保留策略'},
  {id:145,type:'single',answer:'C',stem:'阿里云对象存储OSS提供了海量的文件存储能力，对于文件管理除了支持简单上传、断点续传和大文件分片上传功能外，还提供了多种删除文件的功能。如果需要删除的object数目很多，而且删除的Object是有一定的规律，比如定期删除某些天之前的object，或者干脆是要清空整个Bucket，特别适合使用哪个功能来完成？',opts:['管理控制台逐个删除','管理控制台批量删除','生命周期管理','通过OpenAPI逐个删除'],exp:'题目中说需要比如定期删除某些天之前的Object，所以可以通过生命周期管理来管理最合适。'},
  {id:146,type:'single',answer:'D',stem:'某用户使用负载均衡SLB和云服务器ECS搭建服务集群，搭建完成时，运维人员进行测试，发现通过配置在SLB内的云服务器去TelnetSLB的VIP却不通，导致这种现象的原因是',opts:['SLB健康检查异常','服务器内网防火墙设置没有放行相应端口','创建负载均衡实例后，没有添加监听','目前负载均衡不支持同时作为客户端和服务端，因为返回的数据包只在云服务器内部转发，不经过SLB'],exp:'负载均衡（SLB）的设计机制中，后端服务器通过内网直接响应请求而不经过SLB。当云服务器（ECS）作为客户端尝试访问SLB的虚拟IP（VIP）时，请求通过SLB转发到后端服务器（可能包括自身）。但后端服务器处理完成后，响应数据直接通过内网返回给ECS客户端，不再经过SLB的转发链路。由于TCP连接建立需要双向流量路径一致，而SLB未参与响应包的传输，导致连接无法完成。这属于SLB的固有工作模式限制，与健康检查、防火墙或监听配置无关。选项D的描述符合这一机制。部分云厂商官方文档（如阿里云）明确说明此类场景下VIP访问不可达。'},
  {id:147,type:'single',answer:'C',stem:'SLB系统后端的ECS权重值一样，但是实际负载却不一样，可能是因为什么原因造成的。',opts:['开启了获取真实IP功能','SLB后端服务器端口配置错误','开启了会话保持功能','权重值没有生效'],exp:'解析：如果您同时开启了会话保持功能，那么有可能会造成后端服务器的访问并不是完全相同的。如果出现了访问不均衡的情况，建议您暂时关闭会话保持功能，观察一下是否依然存在这种情况。'},
  {id:148,type:'single',answer:'C',stem:'负载均衡SLE是台云服务器进行流量分发的负载均衡服务，支持4层和7层流量的转发，其中，功能是7层负载均衡服务不支持的。',opts:['域名URL转发','SNI支持','一致性哈希(CH)调度算法','重定向'],exp:'负载均衡支持轮询（RR）、加权轮询（WRR）和加权最小连接数（WLC）三种调度算法。 加权轮询 (WRR)：权重值越高的后端服务器，被轮询到的次数（概率）也越高。'},
  {id:149,type:'single',answer:'A',stem:'您需要创建一个新的云服务器ECS实例进行一个10天的临时性的测试时，采用方式去开通云服务器ECS实例是最经济的模式。',opts:['按量付费','包年包月','预付费模式','其他都不对'],exp:'临时使用ECS，并不需要长期租赁，所以使用按量付费的模式最经济最合适。'},
  {id:150,type:'single',answer:'D',stem:'管理控制台是统一查看和管理阿里云产品及服务的平台。管理控制台面向阿里云用户，通过图形化界面、Cloudshell命令行工具等进行配置操作，创建云服务器ECS后，可以在控制台对其进行管理，ECS管理控制台直接支持的功能不包括',opts:['重启实例','停止实例','释放实例','迁移实例'],exp:'阿里云ECS管理控制台支持实例的重启、停止和释放操作，这些是基础运维功能。迁移实例涉及跨可用区或跨地域的底层资源调度，需通过专用迁移工具或API完成，不属于控制台直接提供的图形化操作功能。'},
  {id:151,type:'single',answer:'C',stem:'互联网络设备之间的数据传输需要特定的规范，这个规范的专业术语被称为“协议”，有一种协议的发明对互联网的产生起了决定性的作用，通过这个协议可以使数万台的计算机连接在一起，这个协议的名称是',opts:['HTTP','UDP','TCP/IP','SOAP'],exp:'Internet使用TCP/IP协议实现了全球范围的计算机网络的互连。'},
  {id:152,type:'single',answer:'A',stem:'共享存储是指是多台服务器访问（读写）同一个存储设备的同一个分区，即系统充许多个用户共享同一份文件。如阿里云的文件存储（NetworkAttached Storage,简称NAS）就提供了共享存储的服务,以下说法错误的是?',opts:['公共云计算中使用的存储都是共享存储','多个云服务器实例可以同时访问同一个共享文件系统','适合跨多个云服务器实例部署的应用程序访问相同数据来源的应用场景','支持主流的应用程序及工作负载可无缝配合使用,无需任何修改即可读写数据'],exp:'公共云计算中使用的存储并非是共享存储，而是分布式的私有存储。'},
  {id:153,type:'single',answer:'B',stem:'阿里云对象存储OSS为用户提供保存访问日志记录的功能。Bucket的拥有者可以通过OSS管理控制台，为其所拥有的Bucket开启访问日志记录功能。当一个BucketA开启访问日志记录功能后，OSS自动将访问这个Bucket的请求日志，以小时为单位，按照固定的命名规则，生成一个Object写入用户指定的BucketB。以下关于OSS日志记录说法正确的',opts:['Bucket A和Bucket B必须是同一个Bucket','Bucket A和Bucket B可以是同一个Bucket，也可以是不同的Bucket，但必须属于同一个用户','Bucket A和Bucket B可以属于不同的用户','Bucket A和Bucket B必须是不同的Bucket'],exp:'源Bucket和目标Bucket可以是同一个Bucket，也可以是不同的Bucket，但必须属于同一个账号下的同一地域内。您也可以将多个源Bucket的Log都保存在同一个目标Bucket内（建议指定不同的TargetPrefix）。参考链接：https://help.aliyun.com/document_detail/31868.html'},
  {id:154,type:'single',answer:'C',stem:'如果您希望在使用阿里云云服务器ECS时，为了定义更灵活的网络拓扑，并按需选择私网IP地址范围并进行网段的划分，应该使用产品。',opts:['VPN','负载均衡SLB','专有网络VPC','云服务器ECS'],exp:'题目中需要实现：网络拓扑，网段划分，所以需要专有网络VPC来实现。'},
  {id:155,type:'single',answer:'A',stem:'某云上用户A的ECS实例上部署的应用程序在云产品通信中，通过云账号的AcceSSKey访问其业务数据库RDS的API，为了方便和快速地调用，某云上用户A直接把AcceSSKey写在配置文件中，但这种方式存在权限过高、泄露信息和难以维护等问题，如果你是阿里云产品经理，你会建议该用户开通服务来解决此问题。',opts:['RAM服务','云防火墙服务','VPC服务','SLB服务'],exp:'使用云账号的 AccessKey 直接访问 RDS API 存在安全风险，应采用最小权限原则。RAM 服务允许创建子用户并分配精细权限，通过角色或策略授予应用程序仅必要权限，避免主账号密钥泄露，同时支持凭据轮换与审计，解决权限过高、泄露和维护困难问题。'},
  {id:156,type:'single',answer:'A',stem:'如果在配置阿里云的负载均衡SLB实例的监听时，开启了获取真实访问IP”，针对7层服务可以通过http头部中的字段获取来访者真实IP。',opts:['X-Forwarded-For','Authorization','Connection','Etag'],exp:'在负载均衡SLB中，可以通过X-Forwarded-For的方式获取访问者真实IP。参考链接：https://help.aliyun.com/document_detail/100972.html'},
  {id:157,type:'single',answer:'B',stem:'新建阿里云的专有网络VPC时会自动创建一个路由器，路由器自带1个路由表。路由表的操作中说法错误的是',opts:['删除VPC时，系统会自动删除对应的路由表','不支持创建和删除路由表','每个路由器可以有多个路由表','路由表的路由条目会影响VPC中的所有云产品实例'],exp:'路由器（VRouter）是专有网络的枢纽。作为专有网络中重要的功能组件，它可以连接VPC内的各个交换机，同时也是连接VPC和其他网络的网关设备。每个专有网络创建成功后，系统会自动创建一个路由器。每个路由器关联一张路由表。更多信息参见路由。参考链接：https://help.aliyun.com/document_detail/34217.html'},
  {id:158,type:'single',answer:'D',stem:'某用户是做香蕉销售生意的，所有的在线平台和数据都放在阿里云的云服务器ECS实例和云数据库RDS实例中，现在CEO想对香蕉销售额的变化趋势做一个监控，并在订单量发生较大变化时能收到预警信息，可以使用阿里云的产品实现，并在管理控制台中展现结果。',opts:['态势感知','阿里绿网','云服务器ECS','云监控'],exp:'题目中说需要在管理控制台中展现云产品的监控预警信息，所以需要用到阿里云的云监控。'},
  {id:159,type:'single',answer:'B',stem:'阿里云对象存储OSS中所有数据都保存在Bucket中，当一个OSSbucket设置成权限，意味着该OSSBucket仅允许其他用户来访问（GETObject）属于该Bucket下的objecto',opts:['公共读写','公共读','私有','私有读'],exp:'允许其他用户访问就代表允许公共访问此Bucket，所以选择公共读。'},
  {id:160,type:'single',answer:'D',stem:'关于阿里云CDN加速域名的“停用”和“删除”，表述正确的是？',opts:['停用加速域名会自己停止相关域名的解析','删除加速域名时，被加速域名的解析记录也会同时被自己恢复为加速前的内容','“停用”该加速域名后，该条加速域名信息仍保留，针对加速域名的请求系统不会再做自动回源处理','“删除”该加速域名后，将删除该加速域名的全部相关记录，对于仅需要暂停使用该加速域名，推荐选择“停用”方式'],exp:'“停用”该加速域名后，该条加速域名信息仍保留，针对加速域名的请求系统将做自动回源处理。参考链接：https://yq.aliyun.com/ask/59575'},
  {id:161,type:'single',answer:'B',stem:'对象存储OSS支持数据冷热分层，提供更具性价比的存储方式，适合存放任意类型的文件。支持三种不同的存储类型，全面覆盖从热到冷的各种数据存储场景，其中不包括',opts:['标准存储','冗余存储','归档存储','低频访问存储'],exp:'对象存储OSS提供标准、低频访问、归档三种存储类型，全面覆盖从热到冷的各种数据存储场景。 参考链接： https://help.aliyun.com/document_detail/51374.html?spm=a2c4g.11174283.6.617.70b67da2wvC5GF'},
  {id:162,type:'single',answer:'B',stem:'云服务器ECS是一种简单高效、处理能力可弹性伸缩的计算服务。在使用云服务器ECS的过程中，有时难免会出现数据被误删除的情况，在阿里云上恢复被误删除的数据有多种方式，其中不包括',opts:['通过ECS管理控制台回滚已创建的快照','通过ECS管理控制台恢复该磁盘对应的数据块副本','使用开源工具ext3grep恢复误删的数据','使用开源工具Extundelete恢复误删的数据'],exp:'https://help.aliyun.com/document_detail/51371.html?spm=5176.11065259.1996646101.searchclickresult.acda28b6TVkRYY'},
  {id:163,type:'single',answer:'A',stem:'弹性伸缩可以根据业务需求和策略设置在业务需求增长时自动增加ECS实例以保证计算能力，在业务需求下降时自动减少ECS实例以节约成本。',opts:['伸缩规则','弹性扩张','伸缩配置','触发任务'],exp:'弹性伸缩使用伸缩配置作为模板自动创建ECS实例，例如通过定时任务、报警任务触发弹性扩张活动。 https://help.aliyun.com/document_detail/25890.html?spm=a2c4g.11186623.6.575.523a61947bA99g'},
  {id:164,type:'single',answer:'A',stem:'某创业团队刚刚成立，几个核心的程序员分布在5个不同的城市异地办公，新发布的线上系统使用了阿里云的云数据库RDS。由于程序员需要在异地用动态IP连接RDS，所以管理员只能打开RDS的公网连接地址和端口，并每天多次从管理控制台查看RDS的连接信息，防止黑客远程登录RDS。管理员通过方法可以最简单地降低这种担忧和人工防护的成本。',opts:['开通云盾态势感知服务，一旦有非常用IP登录数据库rds即可收到报警信息','开通云盾DDoS基础防护，可以防止RDS被非法登录','开启阿里云云监控，一旦发现RDS外网流量特别大就立即登录控制台查看是否是非法连接','内容安全（原名:绿网），可以自动过滤非法的连接'],exp:'题目中说了：在异地用动态IP连接RDS。意思就是程序员登录RDS的IP是不固定的，DDoS基础防护只可以防护DDoS的攻击，云监控在每次都要查看非法IP也不合适，阿里绿网并不能知道什么的非法的连接。所以最合适的还是用态势感知服务的报警服务。'},
  {id:165,type:'single',answer:'A',stem:'负载均衡支持按带宽计费的负载均衡实例下的所有监听共享实例的总带宽，假如您购买了一个带宽峰值为 10MB 的负载均衡实例，并在该实例下创建了三个监听（监听A、监听B和监听C)。监听A的带宽峰值设置为 4MB,另外两个监听没有设置带宽峰值，如果监听A和监听C一直没有流量进入，那么关于监听B的说法，以下说法正确的是',opts:['监听B最多也只能跑满 6MB 带宽','监听B最多也只能跑满4MB 带宽','监听B最多也只能跑满10MB 带宽','监听B最多也只能跑满14MB 带宽'],exp:'监听A的4MB带宽不管用不用都会预留出来的，所以监听B最大只能跑满6MB的带宽。参考链接：https://help.aliyun.com/document_detail/85930.html'},
  {id:166,type:'single',answer:'A',stem:'使用阿里云的负载均衡SLB时，为了实现跨地域（Region）的高可用性，可以在不同的地域(Region）仓创建多个负载均衡SLB实例，通过的方式对外提供服务。',opts:['DNS轮询','DNS最小连接数','DNS广播','DNS多播'],exp:'实现不同地域的多个负载均衡SLB的负载，需要通过DNS轮询来实现，参考链接：https://help.aliyun.com/knowledge_detail/39752.html'},
  {id:167,type:'single',answer:'B',stem:'BGP（边界网关协议)主要用于互联网AS（自治系统)之间的互联，BGP的最主要功能在于控制路由的传播和选择最好的路由，阿里云的云服务器ECS产品支持的多线BGP接入，解决的主要问题是',opts:['提升全网内容分发效率；','避免跨运营商的网络访问的速度瓶颈；','解决网络边界内容缓存的问题；','解决网络带宽的问题；'],exp:'使用BGP协议还可以使网络具有很强的扩展性可以将IDC网络与其他运营商互联，轻松实现单IP多线路，做到所有互联运营商的用户访问都很快。所以解决的是跨运营商的网络访问的速度瓶颈问题，参考链接：https://help.aliyun.com/knowledge_detail/40677.html'},
  {id:168,type:'single',answer:'A',stem:'在使用阿里云负载均衡SLB的管理控制台时，如果需要添加某台云服务器ECS实例到某负载均衡SLB实例的后端服务器池中，ECS实例必须处于状态。',opts:['运行中','启动中','已停止','已创建'],exp:'手动添加负载均衡SLB的后端服务器的时候，后端的ECS服务器必须处于运行中状态。'},
  {id:169,type:'single',answer:'C',stem:'以下哪种服务可以用来发现潜在的入侵和高隐蔽性攻击，回溯攻击历史，预测即将发生的安全事件？',opts:['安骑士','Web应用防火墙','态势感知','云监控'],exp:'题目中问的是可以回溯攻击历史没预测即将发生的安全事件，所以需要的是态势感知。'},
  {id:170,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)是根据用户的业务需求和策略,自动调整其弹性计算资源的管理服务。为了在弹性伸缩创建的ECS实例中可以直接正常处理用户请求，无需任何额外的系统调度和配置，弹性伸缩的云服务器ECS实例中部署的应用必须满足',opts:['无状态且可横向扩展的','有状态','无状态且符合幂等性','所有数据保存在ECS实例磁盘上'],exp:'弹性伸缩主要是ECS的横向伸缩，同时也是服务的横向伸缩，弹性伸缩要求每台ECS是无状态的，否则不能保证数据的统一。参考链接：https://kyfxbl.iteye.com/blog/1831869'},
  {id:171,type:'single',answer:'C',stem:'某电商平台包含众多线上系统和环节，如用户注册、登录、浏览商品、购物结算等。由于站点的动静态资源混杂、跨运营商访问网络不稳定、突发流量造成网络拥塞等问题，经常会出现在线支付、秒杀、促销推广时响应时间慢、服务不稳定等问题。如果你是阿里云产品经理，你会建议用户开通阿里云的服务来解决以上问题。',opts:['云解析DNS','CDN','全站加速CDN','高速通道'],exp:'全站加速（Dynamic Route for Content Delivery Network）是阿里云自主研发的融合了动态加速和静态加速技术的CDN产品。该产品一站式解决了页面动静态资源混杂、跨运营商、网络不稳定、单线源站、突发流量、网络拥塞等诸多因素导致的响应慢、丢包、服务不稳定的问题，提升全站性能和用户体验。'},
  {id:172,type:'single',answer:'B',stem:'您的特定业务要暂时停止一段时间，为了节省成本希望暂时不使用或者释放这些业务的云服务器ECS实例，但希望能够继续保留现有的云服务器ECS实例系统盘上运行的服务和数据，通过可以最节省高效地实现。',opts:['直接释放该云服务器ECS实例，阿里云会自动为用户保留数据','制作该云服务器ECS实例的自定义镜像，并释放该实例','直接释放该云服务器ECS实例，自动镜像可以保证需要保留的应用和数据还能找回来','暂停该云服务器ECS实例'],exp:'题目要求节省成本希望暂时不使用或者释放这些业务的云服务器ECS实例，所以需要保存这些ECS的数据，所以制作镜像后再释放实例满足题目的要求。'},
  {id:173,type:'single',answer:'A',stem:'阿里云的云服务器ECS产品的应用非常广泛，既可以单独的作为Web服务器，也可以与其他阿里云产品配合提供多媒体解决方案。在多媒体、大流量的APP或网站应用场景下，云服务器ECS实例与阿里云的产品搭配，可以存储静态图片、视频、下载包等来降低存储费用。',opts:['对象存储OSS','云数据库RDS','弹性伸缩Auto Scaling','块存储'],exp:'划重点：存储静态图片、视频、下载包，所以选择OSS'},
  {id:174,type:'single',answer:'B',stem:'阿里云的云盾是通过领先的行为收集技术和机器学习模型，解决用户的WEB应用和手机APP的账号、活动、支付等关键业务环节存在的欺诈威胁，最终实现降低企业损失。比如：帮助客户发现代金券套现行为，恶意刷单行为、恶意注册骗取新用户奖励的行为等。',opts:['态势感知','数据风控','内容安全（原名：绿网）','加密服务'],exp:'数据风控由阿里聚安全提供，是基于阿里大数据计算能力，通过业内领先的风险决策引擎，解决企业账号、活动、交在的易等关键业务环节存欺诈威胁，降低企业经济损失。'},
  {id:175,type:'single',answer:'D',stem:'在0SSAPI中通过参数的操作可以实现设置object头?',opts:['Multipart Upload','Get Object','Get Bucket','Copy Object'],exp:'Copy Object接口可以发送一个Put请求给OSS，并在Put请求Header中添加元素x-oss-copy-source来指定源Object。'},
  {id:176,type:'single',answer:'D',stem:'阿里云云服务器ECS提供众多实例规格组，满足不同用户、不同场景的应用，例如：通用性、计算型、突发性、共享型等。以下场景不适合选用共享型实例',opts:['Web应用前段机','开发环境','代码存储库','数据库'],exp:'共享型实例适用于低计算压力场景，其核心限制在于CPU性能不稳定且不可持续。数据库服务需要持续稳定的高性能计算资源以保障查询效率和事务处理能力，而共享型实例采用资源复用机制，在高负载时会出现资源竞争导致性能波动，与数据库场景对I/O吞吐量和CPU独占性的刚性需求存在根本冲突，故D选项不符合适用条件。'},
  {id:177,type:'single',answer:'B',stem:'阿里云对象存储OSS提供了海量的存储能力。当用户需要将一些Object从一个Bucket复制到另外一个Bucket，且不改变内容时，可以使用OSS OpenAPI的CopyObject实现。使用CopyObject来复制文件可以节省成本。',opts:['存储成本','网络带宽','API请求次数','没有节约成本'],exp:'CopyObject接口用于在存储空间（Bucket ） 内或同地域的Bucket之间拷贝文件（Object），所以不需要使用带宽再次上传至OSS，可以节省OSS的网络带宽。'},
  {id:178,type:'single',answer:'A',stem:'您在阿里云的账号A下基于云服务器ECS实例搭建好了Web应用服务，如果需要在另一个阿里云的账号B中快速创建包含相同应用的云服务器ECS实例，可以通过方式最高效的实现。',opts:['在账号A中创建该云服务器ECS实例的自定义镜像，并将该镜像共享给账号B，账号B基于该共享镜像进行新的云服务器ECS实例的创建','直接在账号B中申请云服务器ECS实例并进行相同的Web应用的部署','在账号A中进行该云服务器ECS实例的快照创建，并将该快照共享给账号B，基于该快照进行新的ECS实例的创建','其他方式都不可以完成'],exp:'跨账号共享自定义镜像是阿里云提供的功能，允许用户将自定义镜像共享给其他账号使用。阿里云官方文档指出，共享自定义镜像后，目标账号可以直接使用该镜像创建ECS实例，无需重复配置环境。选项A通过共享镜像实现快速创建，符合高效要求。选项B效率低，需重新部署；选项C的快照共享不支持直接创建实例；选项D与实际情况不符。'},
  {id:179,type:'single',answer:'B',stem:'用户如果想要在OSS中模拟实现文件夹的创建操作，需要使用的API是 选项：',opts:['Multipart Upload','putObject','Get Object','Copy Object'],exp:'OSS中文件夹的概念仅是一个逻辑概念，在通过API/SDK的方式设置文件夹的时候可以指定object对应的key值包括前面的目录即可实现该功能。参考链接：https://help.aliyun.com/knowledge_detail/39527.html'},
  {id:180,type:'single',answer:'A',stem:'为了防止因本地IP对阿里云服务器频繁访问而被屏蔽的情况，可以通过云盾的功能进行设置？',opts:['IP白名单','webshell云查杀','安全网络','常用登录地管理'],exp:'需要屏蔽某个/某段IP频繁非法访问的情况，可以通过云盾的IP白名单来实现。'},
  {id:181,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)是根据用户的业务需求和策略，自动调整其弹性计算资源的管理服务，可以自动调整 选项：',opts:['云服务器ECS实例的个数','云服务器ECS实例的CPU个数','云服务器ECS实例的内存大小','云服务器ECS实例的带宽'],exp:'弹性伸缩(Auto Scaling)是横向扩展，扩展的是云服务器ECS实例的个数，云服务器ECS实例的配置是不支持伸缩的。'},
  {id:182,type:'single',answer:'C',stem:'使用阿里云弹性伸缩(AutoScaling）时，创建了伸缩组，指定了“伸缩最小实例数（台)”为5,伸缩最大实例数（台）”为8，设定了正确的伸缩配置，并添加了伸缩规则为“增加3台ECS实例”，创建了基于该伸缩规则的定时任务(运行时间设置为1小时后)。当前伸缩组中有效的ECS实例个数为3，马上启用该伸缩组，以下说法正确的是',opts:['会在定时任务触发时按照伸缩配置自动创建3个ECS实例，添加到伸缩组','会在伸缩组启用时，按照伸缩配置自动创建7个ECS实例，添加到伸缩组','会在伸缩组启用时，按照伸缩配置自动创建2个ECS实例，添加到伸缩组','会在定时任务触发时按照伸缩配置自动创建2个ECS实例，添加到伸缩组'],exp:'【会在定时任务触发时按照伸缩配置自动创建3个ECS实例】，【会在伸缩组启用时按照伸缩配置自动创建2个ECS实例】，两个选项都是正确的。所以这个是阿里云官方的题目的问题，假如考试遇到这个原题的话直接选择【会在伸缩组启用时按照伸缩配置自动创建2个ECS实例】'},
  {id:183,type:'single',answer:'D',stem:'专有网络的VPC路由条目指定了网络流量的导向目的地，由目标网段、下一跳类型、下一跳三部分组成。某用户需要创建一条自定义路由条目，用于将VPC网络通过高速通道连接到用户本地IDC，该用户的路由条目中，需要选择的下一跳类型为',opts:['VPN网关','NAT网关','路由器接口（专有网络方向）','路由器接口（边界路由器方向）'],exp:'VPC路由条目的下一跳类型决定了流量转发路径，高速通道连接本地IDC需通过边界路由器实现跨网络通信。根据阿里云网络架构，边界路由器方向的路由器接口（对应物理专线接入点）专门用于打通VPC与本地数据中心通道，而VPN网关用于公网加密连接，NAT网关负责公网地址转换，专有网络方向接口用于同地域VPC互通，因此正确配置需选择边界路由器方向的路由器接口。'},
  {id:184,type:'single',answer:'A',stem:'硬件虚拟化是使用软件的方法重新定义划分IT资源，可以实现IT资源的动态分配、灵活调度、跨域共享，提高IT资源利用率，是云计算的基础技术。如果一个虚拟机因为错误而崩溃，同一物理主机上的其他虚拟机不会受到影响，这是描述虚拟化技术的哪种特性？',opts:['隔离性','兼容性','独立于硬件','统一性'],exp:'划重点：如果一个虚拟机因为错误而崩溃，同一物理主机上的其他虚拟机不会受到影响。所以描述的是虚拟化技术的隔离性。'},
  {id:185,type:'single',answer:'A',stem:'阿里云的云盾加密服务通过在阿里云上使用经国家密码管理局检测认证的硬件密码机，帮助用户满足数据安全方面的监管合规要求，保护云上业务数据的隐私性和机密性。管理云盾加密服务的密钥时，必须通过方式的认证。',opts:['身份卡(USB Key)','阿里云官网帐号的AK','用户名和密码','用户自己上传的SSL证书'],exp:'所有的密钥管理都必须依赖身份认证卡（USB key），请务必妥善保管身份卡。如身份认证卡（USB key）丢失，阿里云也无法恢复。参考链接：https://help.aliyun.com/document_detail/28357.html'},
  {id:186,type:'single',answer:'B',stem:'阿里云的对象存储OSS可以与云服务器ECS实例协同来实现文件存储的功能。下列关于云服务器ECS实例与OSS之间的关系描述正确的是',opts:['华东1（杭州）的云服务器ECS实例与华北1（青岛）OSS之间可以通过内网进行访问','云服务器ECS实例与OSS之间的请求次数，不分内外网都会计费','其他都不对'],exp:'文档原话，记住了，走内网流量是不收费的，但是每次的请求次数还是收费。参考链接：https://help.aliyun.com/knowledge_detail/39679.html'},
  {id:187,type:'single',answer:'A',stem:'阿里云内容分发网络是建立并覆盖在承载网之上，由分布在不同区域的边缘节点服务器群组成的分布式网络。阿里云CDN分担源站压力，避免网络拥塞，确保在不同区域、不同场景下加速网站内容的分发，提高资源访问速度。CDN可加速下列哪些阿里云产品？ 选项：',opts:['OSS','RDS','MongoDB','Redis'],exp:'CDN可以加速OSS和ECS中的静态数据，RDS，MongoDB，Redis里面动态数据不支持CDN加速。'},
  {id:188,type:'single',answer:'B',stem:'虚拟化（英语：Virtualization）是云计算的底层结构。它是一种资源管理技术，是将计算机的各种实体资源，如服务器、网络、内存及存储等，予以抽象、转换后呈现出来，打破实体结构间的不可切割的障碍，使用户可以比原本的组态更好的方式来应用这些资源。虚拟化架构描述错误的是以下哪个？',opts:['虚拟化技术可以将单个CPU模拟成多个CPU','虚拟机中的操作系统和物理机上的操作系统有着本质的区别','虚拟化软件层模拟出来的每台虚拟机都是一个完整的系统','相比物理机，虚拟化可以提供更高的IT资源利用率和性能'],exp:'排除法，虚拟机中的操作系统和物理机上的操作系统没有本质的区别。'},
  {id:189,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)经常会和云服务器ECS、负载均衡SLB、云数据库RDS等产品配合使用，以下说法中正确的是',opts:['弹性伸缩必须和云服务器ECS一起使用','弹性伸缩可以单独使用，不依赖于其他任何产品','弹性伸缩必须和云数据库RDS一起使用','弹性伸缩必须和负载均衡SLB一起使用'],exp:'弹性伸缩（Auto Scaling）的核心功能是自动调整云服务器ECS实例的数量，必须与ECS结合才能实现其伸缩能力。选项B错误，因为弹性伸缩必须依赖ECS资源进行伸缩；选项C和D错误，RDS和SLB是常见的配合使用产品以构建高可用架构，但并非必须项。理解弹性伸缩与ECS的依赖关系是关键'},
  {id:190,type:'single',answer:'A',stem:'云计算最大的优势在于弹性与灵活性。阿里云的弹性体现在纵向的弹性和横向的弹性、存储的弹性、网络的弹性以及对于业务架构重新规划的弹性，普通IDC模式下，很难做到对单台服务器进行变更配置。而对于阿里云，的弹性满足了购买云服务器ECS或者存储的容量后，可以根据业务量的增减自由变更配置。',opts:['纵向','横向','存储','网络'],exp:'题目描述了云计算的优势，特别是阿里云的弹性特点，包括纵向的弹性、横向的弹性、存储的弹性、网络的弹性以及对于业务架构重新规划的弹性。接着，题目通过对比普通IDC模式与阿里云模式，强调了阿里云在服务器配置变更上的灵活性。 在普通IDC模式下，很难做到对单台服务器进行变更配置，这反映了传统数据中心在资源调整上的局限性。而阿里云则提供了根据业务量增减自由变更配置的能力，这是其弹性的重要体现。 题目最后询问的是，阿里云的哪种弹性满足了购买云服务器ECS或者存储的容量后，可以根据业务量的增减自由变更配置。根据题目描述，“纵向的弹性”通常指的是对单个服务器资源的垂直扩展或缩减，如CPU、内存等资源的增减，这正是根据业务量变化调整服务器配置的直接体现。 横向弹性通常指的是通过增加或减少服务器数量来应对业务量的变化，而存储弹性和网络弹性则分别指的是存储容量和网络带宽的调整。虽然这些也是云计算弹性的重要方面，但题目中特别强调的是对单台服务器配置的变更，因此更符合纵向弹性的定义。 所以，正确答案是A. 纵向。'},
  {id:191,type:'single',answer:'D',stem:'防DDoS攻击是阿里云的云盾最主要的功能之一，很多网站都曾经受到过不同类型的DDoS攻击，准确理解DDoS对网站做好安全防护至关重要。以下有关DDoS攻击的描述最准确的是',opts:['DDoS攻击通过大量的尝试破解的服务器的登录密码','DDoS攻击的目的是窃取机密信息','DDoS攻击的主要目标是数据库','DDoS攻击的主要目的是让被攻击的目标服务器无法提供正常的服务，是目前最强大、最难防御的网络攻击之一'],exp:'DDoS攻击并不是尝试破解服务器密码，窃取机密信息或者是破坏数据库。DDoS攻击是一种针对目标系统的恶意网络攻击行为，DDoS攻击经常会导致被攻击者的业务无法正常访问，也就是所谓的拒绝服务。参考链接：https://help.aliyun.com/document_detail/65932.html'},
  {id:192,type:'single',answer:'B',stem:'基于隧道技术和Overlay技术，阿里云的研发在硬件网关和自研交换机设备的基础上实现了VPC产品',opts:['CDN','SDN','Overlay','GRE'],exp:'VPC（虚拟私有云）通过软件定义网络（SDN）技术实现网络资源的动态编排与隔离，结合隧道技术在物理网络之上构建逻辑网络。阿里云基于硬件网关和自研交换机，利用SDN控制平面与数据平面分离的架构，完成VPC的灵活部署与管理。CDN用于内容分发，Overlay是隧道封装的通用模式，GRE是具体隧道协议，均非VPC核心架构基础。'},
  {id:193,type:'single',answer:'A',stem:'伸缩活动的生命周期为：判断伸缩组的健康状态和边界条件步骤与启动cooldown步骤之间的所有活动。手工加入既有的ECS实例，还包括A:判断ECS实例的状态、类型；B:分配Activityld和执行伸缩活动；C:修改TotalCapacity；D:加入ECS实例等活动，这些活动正确的顺序是',opts:['A-B-D-C','B-A-D-C','A-D-B-C','B-C-A-D'],exp:'手工加入的步骤：1. 判断伸缩组的健康状态、边界条件和 ECS 实例的状态、类型。2. 分配 ActivityId 和执行伸缩活动。3. 加入 ECS 实例。4. 修改 Total Capacity。5. 添加 RDS 白名单。6. 挂载负载均衡，将权重设为当前伸缩组中已激活的伸缩配置上指定的“负载均衡权重”。此处使用了伸缩配置上指定的“负载均衡权重”。7. 伸缩活动完成，启动 cooldown。参考链接：https://bbs.aliyun.com/simple/t586976.html'},
  {id:194,type:'single',answer:'A',stem:'某企业使用负载均衡SLB将用户的访问请求分发到多台云服务器ECS实例上，同时为了应对业务波动带来的计算资源需求的变化，选用了阿里云弹性伸缩(Auto Scaling)对后端云服务器ECS实例进行动态的添加或者删除。基于对业务状况的判断，他们定义了两种伸缩模式的任务，一种是定时任务，即在指定的时间点执行伸缩活动，另一种是报警任务，即根据云监控的返回信息自动触发伸缩活动。假设在某一时间点，定时任务和报警任务同时满足执行条件，以下说法正确的是',opts:['同时只会有一个伸缩活动执行，两种任务并没有优先级的区分','两个伸缩活动同时执行','同时只会有一个伸缩活动执行，定时任务触发的伸缩活动优先执行','同时只会有一个伸缩活动执行，报警任务触发的伸缩活动优先执行'],exp:'两者是没有优先级之分，两个同时触发会随机执行。请以我们的答案为准。这个答案我们都是确认过的，所以不用质疑哦，这个暂时没有官方文档释义支持。'},
  {id:195,type:'single',answer:'C',stem:'某公司的网站与后台管理都在相同的SLB实例下，需要通过功能只允许特定IP访问后台管理。',opts:['黑名单','虚拟服务器组','白名单'],exp:'开启白名单：仅转发来自所选访问控制策略组中设置的IP地址或地址段的请求，白名单适用于应用只允许特定IP访问的场景。'},
  {id:196,type:'single',answer:'D',stem:'某大型企业客户将关键业务系统部署在阿里云上，使用弹性伸缩服务应对不可预测的高峰流量。该客户发现，由于阿里云不同区域的资源种类、资源数目是有限的，且是动态变化的，在使用弹性伸缩服务进行动态扩展时，有可能出现因资源不足而扩展失败的情况，为了尽可能避免这种情况，建议其采用的措施为',opts:['选择多个地域创建ECS，加入同一伸缩组','选择多个地域创建伸缩组，关联同一个SLB实例','为伸缩活动设置报警策略，当收到伸缩活动失败的报警时，手动创建ECS实例','在伸缩配置中设置多个实例规格，当特定实例规格库存不足时，会切换到至备选实例规格，提高弹性扩张的成功率'],exp:'缩配置中支持选择多个实例规格，当某个实例规格库存不足时，可以自动使用其他实例规格创建ECS实例，提高弹性扩张的成功率。'},
  {id:197,type:'single',answer:'C',stem:'阿里云提供公网和私网两种类型的负载均衡服务。可以根据业务场景选择配置对外公开或对内私有的负载均衡，系统会根据客户的选择分配公网或私网服务地址，下列属于公网负载均衡的描述正确的是',opts:['只能在阿里云内部使用，可以转发的请求只能来自具有负载均衡的私网访问权限的客户端','负载均衡实例的服务地址由阿里云统一分配和管理，该私网负载均衡服务只能被经典网络ECS实例访问','负载均衡实例可以通过internet将客户端请求按照指定的监听规则分发添加的后端服务器ECS上','实例的服务地址会从指定的专有网络的交换机网段内分配。该负载均衡服务只能被相同VPC内的ECS实例访问'],exp:'通过Internet将客户端请求按照您制定的监听规则分发到添加的后端服务器ECS上。 参考链接： https://help.aliyun.com/document_detail/85931.html?spm=a2c4g.11186623.6.568.c23d5d7aPhlEi8'},
  {id:198,type:'single',answer:'B',stem:'用户在添加安全组规则时，必须指定通信协议和端口或端口范围，然后安全组根据允许或拒绝策略决定是否转发数据到ECS实例。某用户需要使用Xshell客户端远程连接Linux系统的ECS实例，设置的安全组规则应放行协议和端口。',opts:['Telnet， 23','SSH， 22','SMTP， 25','HTTPS， 443'],exp:'在解答这个问题时，我们首先要明确题目中的关键信息：用户需要使用Xshell客户端远程连接Linux系统的ECS实例。Xshell是一款常用的SSH客户端，用于远程登录和管理Linux服务器。 接下来，我们分析各个选项所代表的协议和端口： A. Telnet,23：Telnet是一种远程登录协议，但它是不加密的，存在安全风险。此外，题目中明确提到的是Xshell客户端，它通常用于SSH连接，而不是Telnet。 B. SSH,22：SSH（Secure Shell）是一种加密的远程登录协议，广泛用于Linux系统的远程管理。Xshell客户端正是基于SSH协议工作的，且SSH的默认端口是22。 C. SMTP,25：SMTP（Simple Mail Transfer Protocol）是用于发送电子邮件的协议，与远程登录无关。 D. HTTPS,443：HTTPS是用于安全传输网页数据的协议，同样与远程登录无关。 综上所述，为了使用Xshell客户端远程连接Linux系统的ECS实例，用户需要设置的安全组规则应放行SSH协议和端口22。因此，正确答案是B。'},
  {id:199,type:'single',answer:'B',stem:'如果阿里云对象存储OSS客户想对访问OSS的IP进行限制，只允许有限的几个IP地址可以下载OSS上的文件，可以通过配置方法实现。',opts:['直接使用OSS的IP白名单功能','OSS本身不提供IP黑白名单，可以先使用CDN加速，然后在CDN上配置IP白名单','直接使用OSS的IP黑名单功能','OSS本身不提供IP黑白名单，可以在OSS前面部署SLB，然后在SLB上配置IP白名单'],exp:'阿里云对象存储（OSS）不具备直接配置IP黑白名单的功能。要实现IP限制，需结合其他服务： 1. 选项B正确：通过CDN加速后，在CDN控制台的访问控制模块设置IP白名单，仅允许指定IP访问资源。CDN作为中间层，会过滤非法IP请求后再转发至OSS。 2. 选项D错误：SLB的主要功能是负载均衡，虽然支持IP访问控制，但OSS存储桶的直接访问域名为HTTP协议，与SLB的TCP/HTTP监听协议兼容性不足，且官方文档未推荐此方案'},
  {id:200,type:'single',answer:'A',stem:'游戏行业有个明显',opts:['负载均衡SLB+云服务器ECS+云数据库RDS+弹性伸缩AutoScaling','负载均衡SLB+云服务器ECS+云数据库RDS','云服务器ECS+弹性伸缩AutoScaling','云服务器ECS'],exp:'阿里云弹性伸缩Auto Scaling可根据业务需求自动调整ECS实例数量，应对流量波动。负载均衡SLB将流量分发到不同实例，确保业务稳定运行。云数据库RDS提供持久化存储，与弹性伸缩配合实现资源动态扩展。选项B缺少弹性伸缩，无法自动扩缩容；选项C缺少负载均衡和数据库，无法有效分发流量及存储数据；选项D仅基础计算资源，无扩展能力。阿里云产品文档中，弹性伸缩常与SLB、RDS组合用于自动扩展场景，确保资源利用率与业务连续性。'},
  {id:201,type:'single',answer:'B',stem:'.对象存储服务OSS的某个Bucket同时配置了三条生命周期规则，分别是：1、Object保留x天后转换到低频访问2、Object保留y天后转换到归档冷备3、Object保留z天后删除下列选项中，X、y、z的取值满足规则要求的是',opts:['30，15，60','30，60，90','90，60，30','30，30，30'],exp:'https://help.aliyun.com/document_detail/51374.html?spm=a2c4g.11174283.6.617.475c7da2SKHUfQ'},
  {id:202,type:'single',answer:'A',stem:'在使用阿里云弹性伸缩(AutoScaling)时，伸缩组中包含的云服务器ECS实例有两种类型，一种是根ECS实例。关于这两种云服务器ECS实例，以下说法正确的是？',opts:['当ECS实例被弹性伸缩从伸缩组中移出时，对于自动创建的ECS实例会停止和释放，对于手工添加的ECS实例则不会停止和释放','手工添加的ECS实例，受伸缩配置中定义的规格的限制','手工添加的ECS实例对地域没有要求，但是对状态有要求，必须是“运行中”','当伸缩组需要减少ECS实例时，自动创建的ECS实例会被优先移出伸缩组，手工添加的ECS实例会被尽量保留'],exp:'手动添加一台或多台 ECS 实例。手动添加的ECS实例配置与当前伸缩配置没有关联。但是手工添加的ECS需要和当前伸缩组处于同一个地域。参考链接：https://help.aliyun.com/document_detail/25901.html'},
  {id:203,type:'single',answer:'B',stem:'某用户需要根据云监控指标（ECS实例的CPU平均利用率）目标值来触发弹性伸缩活动，由弹性伸缩自动计算所需的实例数量并进行扩缩容，从而将云监控指标维持在目标值附近，该用户需要创建',opts:['简单规则','目标追踪规则','预测规则','步进规则'],exp:'目标追踪规则是根据云监控指标（如CPU平均利用率）的目标值自动计算所需实例数量，实现扩缩容以维持指标在目标值附近。简单规则基于固定阈值触发，步进规则按阶梯增减实例，预测规则基于历史数据预估未来负载，均不直接以目标值为驱动核心。'},
  {id:204,type:'single',answer:'A',stem:'阿里云弹性伸缩(AutoScaling)的一个伸缩活动在12：00执行完成，设置的冷却时间是15分钟。假如这时用户停用再启用伸缩组，在12：05伸缩组完成启动，如果在12：10云监控触发伸缩活动，当前伸缩组将如何处理该请求？?',opts:['接受执行该请求，无需等待','仍需等待5分钟后执行','仍需等待10分钟后执行','仍需等待15分钟后执行'],exp:'停用伸缩组以后，之前的冷却时间即失效。所以后面伸缩活动不会受到冷却时间的影响。参考链接：https://help.aliyun.com/document_detail/25912.html'},
  {id:205,type:'single',answer:'A',stem:'安全组A中存在5台阿里云的云服务器ECS实例，您针对安全组A增加了一个新的规则来允许来自特定IP地址的入流量，并且增加了3台新的云服务器。以下描述中正确的是？ 选项：',opts:['无需任何额外的操作，特定来源IP地址可以访问所有的8台云服务器','需要进行所有服务器的重启之后，特定来源IP地址可以访问所有的8台云服务器','特定来源IP地址仅可以访问新增的3台云服务器','特定来源IP地址仅可以访问新增的3台云服务器，当之前的5台服务器进行重启之后也可以进行访问'],exp:'安全组开通后，无需任何操作即可开放'},
  {id:206,type:'single',answer:'A',stem:'SLB LoadBalancer中哪个接口是用来修改SLB实例的计费方式的？',opts:['ModifyLoadBalancerInternetSpec','CreateLoadBalancer','SetLoadBalancerStatus','SetLoadBalancerName'],exp:'使用ModifyLoadBalancerInternetSpec修改公网负载均衡实例的计费方式。参考链接：https://help.aliyun.com/document_detail/27578.html'},
  {id:207,type:'single',answer:'C',stem:'以下创建ECS镜像时，步骤的描述有错？ 选项：',opts:['输入的自定义镜像描述，不可以为空','选择全部快照，可以看到快照的列表','输入自定义镜像名称，可以为空','登录阿里云的控制台来创建ECS镜像'],exp:'您输入自定义镜像名称,不能为空'},
  {id:208,type:'single',answer:'A',stem:'话咨询委员会(CCITT)联合制定的开放系统互连参考模型，为开放式互连信息系统提供了-种功能结构的框架。我们常用到的第七层是指_。',opts:['应用层','表示层','会话层','传输层'],exp:'七层为应用层，表示层在第六层，会话层第五层，传输层第四层'},
  {id:209,type:'single',answer:'A',stem:'如果使用本地电脑的SSH客户端无法访问阿里云云服务器ECS，且连接没有明显的报错，您首先需要通过什么途径查询该问题？',opts:['查看实例状态','查看实例安全组','尝试用VNC的方式登录','查看本地网络是否联通'],exp:'阿里云官方文档中针对ECS实例连接问题排查流程指出，首先需确认实例处于"运行中"状态。若实例处于停止、启动中等异常状态，所有网络连接均不可用。安全组规则、VNC登录等属于实例运行正常后的次级检查项。本地网络联通性测试需在确认实例健康状态后进行。实例状态可通过ECS控制台直接查看，属于最基础且必须优先验证的环节。'},
  {id:210,type:'single',answer:'A',stem:'云监控的http提交指令是哪一个？',opts:['post','copy','write','put'],exp:'云监控的http提交指令为post。'},
  {id:211,type:'single',answer:'C',stem:'阿里云弹性伸缩服务(AutoScaling)p可以根据业务需求和策略自动调整弹性计算资源。在业务需求增长时无缝增加ECS实例，满足计算需要。在创建伸缩配置时，不需要填写信息。',opts:['镜像','计费方式','登录密码','安全组'],exp:'阿里云弹性伸缩服务(AutoScaling)可以根据业务的需求和预设策略自动地调整弹性计算资源。在其创建伸缩配置的过程中，某些信息是必要的，而某些则可以不用填写。在所给的选项中： A. 镜像：这是必要的，因为ECS实例需要一个镜像来启动和运行。 B. 计费方式：这也是必要的信息，因为不同的计费方式会影响到成本和资源使用情况。 C. 登录密码：在创建伸缩配置时，通常不需要单独填写登录密码，因为密码通常是在创建ECS实例时设置的，并且可以通过其他安全措施如密钥对来管理访问。 D. 安全组：安全组用于管理网络访问规则，是在ECS实例创建后配置的，不是在创建伸缩配置时需要的信息。 因此，在创建伸缩配置时，不需要填写的是登录密码，即选项C是正确的。虽然镜像和计费方式是重要的信息，但题目中并没有明确指出它们在创建伸缩配置时是否需要填写，所以答案专注于解释为什么登录密码是不需要填写的。'},
  {id:212,type:'single',answer:'A',stem:'您成功地创建了一台阿里云的云服务器ECS实例，准备进行应用的部署。在部署应用之前，如何保证该云服务器ECS实例具备防御500M以内的DDoS攻击的能力？',opts:['阿里云的云盾产品提供免费的基础DDoS防护服务，不需要单独购买','需要另行购买DDoS防护服务才可以具备防护功能','需要您自己架设防DDoS服务','其他都不对'],exp:'阿里云的云盾免费的DDoS基础防护提供最高5G的默认DDoS防护能力，所以5G以下可以选择云盾DDoS基础防护，5G以上可以选择云盾的DDoS高防IP服务。'},
